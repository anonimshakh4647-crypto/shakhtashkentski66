<script>
'use strict';
const LS = 'klub_hisob_v1', $ = (s, r) => (r || document).querySelector(s), esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const el = (t, c, h) => { const e = document.createElement(t); if (c) e.className = c; if (h != null) e.innerHTML = h; return e; };
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '), p2 = n => String(n).padStart(2, '0');
const dur = ms => { const s = Math.floor(Math.abs(ms) / 1000); return (ms < 0 ? '-' : '') + p2(Math.floor(s / 3600)) + ':' + p2(Math.floor(s % 3600 / 60)) + ':' + p2(s % 60); };
const hm = ms => { const m = Math.round(ms / 60000); return Math.floor(m / 60) + ' soat ' + (m % 60) + ' daq'; };
const dt = ts => { const d = new Date(ts); return p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const tm = ts => { const d = new Date(ts); return p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const dtl = ts => { const d = new Date(ts); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()); };
const TN = { ps: 'PlayStation', pc: 'Kompyuter' };

/* ---------- ma'lumot ---------- */
function defaults() {
    const st = []; for (let i = 1; i <= 10; i++) st.push({ id: 'ps' + i, type: 'ps', name: 'PlayStation ' + i, rate: null, on: true }); for (let i = 1; i <= 10; i++) st.push({ id: 'pc' + i, type: 'pc', name: 'Kompyuter ' + i, rate: null, on: true });
    return { v: 1, club: 'IT SHAKH Game Club', rates: { ps: 25000, pc: 15000 }, round: 100, minMin: 0, sound: true, pin: null, stations: st, sessions: {}, history: [], seq: 1 };
}
const isStd = id => /^(ps|pc)(10|[1-9])$/.test(id);
function heal(o) { /* 10 PlayStation + 10 kompyuter har doim bor; to'xtatilgan (pauza) seanslar davom ettiriladi */
    if (!o.sessions || Array.isArray(o.sessions)) o.sessions = {}; if (!Array.isArray(o.history)) o.history = []; const now = NOW(); for (const k in o.sessions) { const se = o.sessions[k]; if (se.pausedAt != null) { se.pausedMs = (se.pausedMs || 0) + (now - se.pausedAt); se.pausedAt = null; } }
    for (const t of ['ps', 'pc']) for (let i = 1; i <= 10; i++) { const id = t + i; let s = o.stations.find(x => x.id === id); if (!s) o.stations.push(s = { id, type: t, name: TN[t] + ' ' + i, rate: null, on: true }); s.type = t; s.on = true; }
    o.stations.sort((a, b) => (a.type === b.type ? 0 : a.type === 'ps' ? -1 : 1) || (isStd(b.id) - isStd(a.id)) || (parseInt(a.id.slice(2)) - parseInt(b.id.slice(2)))); return o;
}
function load() { try { const o = JSON.parse(localStorage.getItem(LS)); if (o && o.stations && o.sessions) return heal(Object.assign(defaults(), o)); } catch (e) { } return defaults(); }
/* ---------- SERVER (ma'lumot serverda saqlanadi) ----------
   PHP hosting: klub-api.php ni shu fayl yoniga yuklang (shu qator o'zgarmaydi).
   Cloudflare Worker va h.k.: to'liq manzilni yozing, masalan 'https://klub.sizning-nom.workers.dev/'.
   Bo'sh ('') qoldirsangiz — ma'lumot faqat shu brauzerda saqlanadi. */
const CLUB_API = 'klub-api.php';
const SY = { url: CLUB_API, on: false, rev: 0, off: 0, st: 'off', dirty: false, pushing: false, again: false, key: '', last: 0 };
try { const v = localStorage.getItem('klub_api'); if (v != null) SY.url = v; SY.key = localStorage.getItem('klub_key') || ''; SY.rev = +localStorage.getItem('klub_rev') || 0; SY.dirty = localStorage.getItem('klub_dirty') === '1'; } catch (e) { }
const NOW = () => Date.now() + SY.off;
const ALERTED = new Set();
let S = load(); const UI = { tab: 'st', sel: new Set(), filter: 'today', from: '', to: '', admin: false };
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); localStorage.setItem(LS + '_bak', JSON.stringify(S)); } catch (e) { if (!SY.on) toast('Saqlab bo‘lmadi: xotira to‘lgan yoki taqiqlangan.', true); } if (SY.on && SY.key && UI.admin) { SY.dirty = true; flag(1); schedulePush(); } }
UI.admin = SY.url ? !!SY.key : (!S.pin || sessionStorage.getItem('klub_admin') === '1');
let STORE_OK = true; try { localStorage.setItem(LS + '_t', '1'); localStorage.removeItem(LS + '_t'); } catch (e) { STORE_OK = false; }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
const stOf = id => S.stations.find(s => s.id === id), rateOf = st => st.rate > 0 ? st.rate : S.rates[st.type];
const rnd = x => { const k = S.round || 1; return Math.round(x / k) * k; };
const need = () => { if (!UI.admin) { toast('Faqat admin o‘zgartira oladi — “Admin kirish” ni bosing.', true); return false; } return true; };

/* ---------- hisob (har doim server soatidan — sahifa yopiq bo'lsa ham davom etadi) ---------- */
function calc(se, now) {
    const end = se.pausedAt != null ? se.pausedAt : now, work = Math.max(0, end - se.startTs - (se.pausedMs || 0)), minMs = (S.minMin || 0) * 60000, billMs = Math.max(work, minMs);
    const time = rnd(billMs / 3600000 * se.rate), ex = (se.extras || []).reduce((a, x) => a + (+x.sum || 0), 0), gross = time + ex, disc = Math.min(gross, Math.round(gross * (se.discPct || 0) / 100) + (+se.discSum || 0));
    return { work, time, ex, gross, disc, total: gross - disc, rem: se.limitMin ? se.limitMin * 60000 - work : null };
}
function newSession(stId, o) { const st = stOf(stId); return { id: S.seq++, st: stId, startTs: o.startTs, pausedMs: 0, pausedAt: null, client: o.client || '', limitMin: o.limitMin || 0, rate: o.rate > 0 ? o.rate : rateOf(st), extras: [], discPct: 0, discSum: 0, note: '', alerted: false }; }

/* ---------- UI yordamchilar ---------- */
let toastT = 0; function toast(m, err) { const t = $('#toast'); t.textContent = m; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3800); }
function modal(build) { const b = $('#box'); b.innerHTML = ''; build(b); $('#modal').classList.add('on'); const f = b.querySelector('input:not([type=checkbox]),select'); if (f && window.innerWidth > 700) f.focus(); }
const closeModal = () => $('#modal').classList.remove('on');
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); }); addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
function confirmBox(msg, ok, label) { modal(b => { b.innerHTML = '<h3>Tasdiqlang</h3><p>' + esc(msg) + '</p>'; const a = el('div', 'acts'); const c = el('button', 'btn', 'Bekor'), y = el('button', 'btn bad', label || 'Ha'); c.onclick = closeModal; y.onclick = () => { closeModal(); ok(); }; a.append(c, y); b.appendChild(a); }); }
function beep() { if (!S.sound) return; try { const a = new (window.AudioContext || window.webkitAudioContext)(), o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = 880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.2, a.currentTime); g.gain.exponentialRampToValueAtTime(.001, a.currentTime + 1.2); o.start(); o.stop(a.currentTime + 1.2); } catch (e) { } }

/* ---------- render ---------- */
function render() {
    document.body.classList.toggle('locked', !UI.admin); $('#club').textContent = S.club || 'Klub'; $('#bLock').textContent = (SY.on || S.pin) ? (UI.admin ? '🔓 Qulflash' : '🔒 Admin kirish') : '👤 Admin'; $('#bLock').title = (SY.on || S.pin) ? '' : 'PIN kod Sozlamalarda o‘rnatiladi'; setSt(SY.st);
    document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === UI.tab)); if (UI.tab === 'set' && !UI.admin) UI.tab = 'st';
    ({ st: renderSt, rep: renderRep, set: renderSet })[UI.tab](); renderBar(); tick();
}
function stats() { const now = NOW(), run = Object.values(S.sessions); let cur = 0, ps = 0, pc = 0; for (const se of run) { const c = calc(se, now).total; cur += c; if (stOf(se.st) && stOf(se.st).type === 'ps') ps++; else pc++; } const d0 = new Date(); d0.setHours(0, 0, 0, 0); const today = S.history.filter(h => h.endTs >= d0.getTime()).reduce((a, h) => a + h.total, 0); return { cur, ps, pc, n: run.length, today }; }
function renderSt() {
    const m = $('#main'); m.innerHTML = ''; if (!STORE_OK) m.appendChild(el('div', 'panel', '<b style="color:var(--red)">⚠ Brauzer xotirasi ishlamayapti</b> (maxfiy rejim yoki taqiqlangan). Sahifa yopilsa seanslar yo‘qoladi. Oddiy oynada oching.'));
    const sx = el('div', 'stats'); sx.innerHTML = '<div class="stat"><small>Hozir band</small><b id="sN">0</b><small id="sNd"></small></div><div class="stat"><small>Ishlayotgan hisob</small><b class="mono" id="sCur">0</b></div><div class="stat hl"><small>Bugungi tushum (to‘langan)</small><b class="mono" id="sToday">0</b></div><div class="stat"><small>Tushum + hozirgi hisob</small><b class="mono" id="sAll">0</b></div>'; m.appendChild(sx);
    for (const type of ['ps', 'pc']) {
        const list = S.stations.filter(s => s.type === type && s.on); const h = el('div', 'sec'); h.innerHTML = '<h2 style="color:' + (type === 'ps' ? 'var(--violet)' : 'var(--cyan)') + '">' + TN[type] + ' · ' + list.length + ' ta</h2><div class="line"></div><span class="note">' + fmt(S.rates[type]) + ' so‘m / soat</span>'; m.appendChild(h);
        const g = el('div', 'grid'); for (const st of list) g.appendChild(card(st)); m.appendChild(g);
    }
}
function card(st) {
    const se = S.sessions[st.id], c = el('div', 'card ' + st.type + (se ? ' run' : '') + (UI.sel.has(st.id) ? ' sel' : '')); c.dataset.id = st.id;

  var u=getUser(),credOk=!!(u&&u.email&&u.credential);
  // XAVFSIZLIK (reload bilan aylanib o'tishning oldini olish): sayt bloki yoki shu foydalanuvchining bloki
  // oldin keshlangan bo'lsa, serverdan javob kelgunga QADAR HAM tegishli ekran DARHOL ko'rsatiladi.
  var cachedLock=false;try{cachedLock=localStorage.getItem('it_shakh_sitelock_flag')==='1';}catch(e){}
  if(cachedLock&&!showingLock)showLock();
  var blkKey=credOk?('it_shakh_blk_'+String(u.email).toLowerCase()):null;
  var cachedBlk=false;if(blkKey){try{cachedBlk=localStorage.getItem(blkKey)==='1';}catch(e){}}
  if(cachedBlk&&!showingBlock)showBlock();
  var p1=api({action:'sitestat'},9000);
  var p2=credOk?api({action:(expMs(u.credential)>Date.now()+10000?'me':'blockstat'),credential:u.credential},9000):Promise.resolve(null);
  Promise.all([p1,p2]).then(function(res){checking=false;
   var r=res[0],rb=res[1];
   if(r&&r.ok&&r.locked){try{localStorage.setItem('it_shakh_sitelock_flag','1')}catch(e){}return showLock();}
   if(r&&r.ok&&!r.locked){try{localStorage.removeItem('it_shakh_sitelock_flag')}catch(e){}if(showingLock)hideLock();}
   if(rb&&rb.ok&&rb.blocked){if(blkKey){try{localStorage.setItem(blkKey,'1')}catch(e){}}return showBlock();}
   if(rb&&rb.ok&&!rb.blocked){if(blkKey){try{localStorage.removeItem(blkKey)}catch(e){}}if(showingBlock)hideBlock();}
   if(r&&r.ok&&r.vpnBlock){
    if(vpnFlag===null||Date.now()-vpnCheckedAt>120000){
     checkVpn().then(function(v){vpnFlag=v;vpnCheckedAt=Date.now();
      if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
     });
    }else if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
   }else if(showingVpn)hideVpn();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
</script>
