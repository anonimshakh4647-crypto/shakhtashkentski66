<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text to Speech | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>textarea{width:100%;min-height:190px;resize:vertical;background:#050b14;color:var(--text);border:1px solid rgba(56,189,248,.42);border-radius:10px;padding:14px;font:15px monospace}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.actions{display:flex;gap:10px;margin-top:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header><main><div class="eyebrow">// BROWSER VOICE TOOL</div><h1>TEXT → SPEECH</h1><p class="intro">Matnni qurilmangizdagi mavjud ovoz yordamida o‘qitadi.</p><section class="panel"><textarea id="text" placeholder="Ovoz chiqariladigan matnni yozing…"></textarea><div class="grid"><label class="field"><span class="label">OVOZ</span><select id="voice"></select></label><label class="field"><span class="label">TEZLIK</span><input id="rate" type="range" min="0.5" max="2" step="0.1" value="1"></label></div><div class="actions"><button id="speak">▶ O‘QISH</button><button id="stop" class="secondary">■ TO‘XTATISH</button></div><p id="status" class="notice">Brauzer ovozlarini kutmoqda…</p></section></main><script>const t=document.getElementById('text'),v=document.getElementById('voice'),r=document.getElementById('rate'),s=document.getElementById('status');function load(){const vs=speechSynthesis.getVoices();v.innerHTML='';vs.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name+' — '+x.lang;v.appendChild(o)});s.textContent=vs.length?'Ovoz tayyor.':'Brauzerda ovoz topilmadi.'}speechSynthesis.onvoiceschanged=load;load();document.getElementById('speak').onclick=()=>{if(!t.value.trim())return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.value);const vs=speechSynthesis.getVoices();u.voice=vs[Number(v.value)]||null;u.rate=Number(r.value);u.onend=()=>s.textContent='Tugadi.';speechSynthesis.speak(u);s.textContent='O‘qilmoqda…'};document.getElementById('stop').onclick=()=>{speechSynthesis.cancel();s.textContent='To‘xtatildi.'};</script></body></html>
