<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text to Speech | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>textarea{width:100%;min-height:190px;resize:vertical;background:#050b14;color:var(--text);border:1px solid rgba(56,189,248,.42);border-radius:10px;padding:14px;font:15px monospace;outline:none}textarea:focus{border-color:var(--accent);box-shadow:var(--glow)}.file-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 4px}.file-row input[type=file]{min-width:0;flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.field{display:grid;gap:8px}.field select,.field input{width:100%;min-width:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// BROWSER VOICE TOOL</div><h1>TEXT → SPEECH</h1><p class="intro">Matnni qurilmangizdagi mavjud ovoz yordamida o‘qitadi.</p><section class="panel"><textarea id="text" placeholder="Ovoz chiqariladigan matnni yozing…"></textarea><div class="file-row"><input id="textFile" type="file" accept=".txt,text/plain"><span class="notice" style="margin:0">TXT fayl yuklang — matn avtomatik joylanadi.</span></div><div class="grid"><label class="field"><span class="label">OVOZ</span><select id="voice"></select></label><label class="field"><span class="label">TEZLIK</span><input id="rate" type="range" min="0.5" max="2" step="0.1" value="1"></label></div><div class="actions"><button id="speak">▶ O‘QISH</button><button id="download" class="secondary">⬇ OVOZNI YUKLASH</button><button id="stop" class="secondary">■ TO‘XTATISH</button></div><p id="status" class="notice">Brauzer ovozlarini kutmoqda…</p></section></main><script>const t=document.getElementById('text'),v=document.getElementById('voice'),r=document.getElementById('rate'),s=document.getElementById('status'),textFile=document.getElementById('textFile');function load(){const vs=speechSynthesis.getVoices();v.innerHTML='';vs.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name+' — '+x.lang;v.appendChild(o)});s.textContent=vs.length?'Ovoz tayyor.':'Brauzerda ovoz topilmadi.'}speechSynthesis.onvoiceschanged=load;load();textFile.addEventListener('change',async()=>{const file=textFile.files[0];if(!file)return;if(!/\.txt$/i.test(file.name)&&file.type!=='text/plain'){s.textContent='Faqat TXT fayl yuklang.';textFile.value='';return}try{t.value=await file.text();s.textContent='TXT fayl yuklandi.'}catch(e){s.textContent='TXT faylni o‘qib bo‘lmadi.'}});document.getElementById('speak').onclick=()=>{if(!t.value.trim()){s.textContent='Avval matn yozing yoki TXT fayl yuklang.';return}speak();};function speak(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.value);const vs=speechSynthesis.getVoices();u.voice=vs[Number(v.value)]||null;u.rate=Number(r.value);u.onend=()=>s.textContent='Tugadi.';u.onerror=()=>s.textContent='Ovoz chiqarishda xatolik.';speechSynthesis.speak(u);s.textContent='O‘qilmoqda…'}document.getElementById('stop').onclick=()=>{speechSynthesis.cancel();s.textContent='To‘xtatildi.'};

document.getElementById('download').onclick=async()=>{
  const text=t.value.trim();
  if(!text){s.textContent='Avval matn yozing yoki TXT fayl yuklang.';return}
  if(text.length>12000){s.textContent='Yuklash uchun matn 12000 belgidan oshmasin.';return}

  const vs=speechSynthesis.getVoices();
  const voice=vs[Number(v.value)]||null;
  const lang=(voice?.lang||'en-US').toLowerCase();
  const speed=Number(r.value)||1;

  try{
    s.textContent='MP3 tayyorlanmoqda…';
    const url='https://tts-api.netlify.app/?text='+encodeURIComponent(text)+'&lang='+encodeURIComponent(lang.split('-')[0])+'&speed='+encodeURIComponent(speed);
    const res=await fetch(url,{method:'GET',mode:'cors',cache:'no-store'});
    if(!res.ok) throw new Error('TTS server: '+res.status);
    const type=res.headers.get('content-type')||'';
    if(!type.includes('audio')) throw new Error('Audio qaytmadi');

    const blob=await res.blob();
    if(!blob.size) throw new Error('Bo‘sh audio');
    const blobUrl=URL.createObjectURL(new Blob([blob],{type:'audio/mpeg'}));
    const a=document.createElement('a');
    a.href=blobUrl;
    a.download='it-shakh-voice.mp3';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(blobUrl),5000);
    s.textContent='Ovoz MP3 fayl sifatida yuklandi.';
  }catch(e){
    console.error(e);
    s.textContent='MP3 yuklashda xatolik. O‘QISH tugmasi brauzer ovozida ishlaydi.';
  }
}</script><!-- IT-SHAKH-SITELOCK -->
<style>
#sl-modal,#vb-modal{position:fixed;inset:0;z-index:2147483647;background:rgba(2,6,14,.96);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit}
.sl-box{width:min(440px,100%);background:#06101c;border:1px solid rgba(31,214,245,.4);border-radius:16px;padding:28px 24px;box-shadow:0 0 60px rgba(31,214,245,.25);text-align:center;box-sizing:border-box}
.sl-ic{font-size:42px}
.sl-box h2{margin:8px 0 10px;font-size:21px;color:#1fd6f5;font-family:inherit}
.sl-box p{margin:0;font-size:13px;line-height:1.55;color:#cbd5e1;font-family:inherit}
</style>
<script>
/* ===== SAYTNI TO'LIQ BLOKLASH + VPN TAQIQLASH — TOOLS sahifalari uchun =====
   index.html dagi admin panelidan "SAYTNI BLOKLASH" yoki "VPN TAQIQLASH" yoqilsa,
   bu tekshiruv shu asbob sahifasida ham ishlaydi — ADMIN_EMAIL'dan boshqa hech kim
   to'g'ridan-to'g'ri havola orqali ham asbobdan foydalana olmaydi (sayt bloklanganda),
   yoki VPN/proksi/datacenter orqali kirgan bo'lsa foydalana olmaydi (VPN taqiqlanganda).
   Hech qanday Google token/kredensial talab qilinmaydi — shuning uchun sessiya holatidan qat'i nazar ishlaydi. */
(function(){
 var USERS_API_URL='https://script.google.com/macros/s/AKfycbyGcZgnnp91p19OhUVCep3zh_Izw9Day-jQaveO0rYVX7cK0F_y9yZaSHJ-qdMUZzhiBA/exec';
 var ADMIN='anonimshakh4647@gmail.com';
 var showingLock=false,showingVpn=false,checking=false,vpnFlag=null,vpnCheckedAt=0;
 function getUser(){try{return JSON.parse(localStorage.getItem('it_shakh_google_user')||'null')}catch(e){return null}}
 function isAdmin(){var u=getUser();return !!(u&&String(u.email||'').toLowerCase()===ADMIN);}
 function api(ms){return new Promise(function(res){
  var cb='sl2_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script'),done=false;
  var fin=function(v){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.parentNode&&sc.remove();res(v);};
  window[cb]=fin;sc.onerror=function(){fin(null)};setTimeout(function(){fin(null)},ms||9000);
  sc.src=USERS_API_URL+'?action=sitestat&callback='+cb+'&_='+Date.now();document.head.appendChild(sc);});}
 function showLock(){
  if(showingLock||document.getElementById('sl-modal'))return;showingLock=true;
  var vb=document.getElementById('vb-modal');if(vb)vb.remove();showingVpn=false;
  var d=document.createElement('div');d.id='sl-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛠️</div><h2>Sayt vaqtincha yopiq</h2><p>Hozirda saytda texnik ishlar olib borilmoqda. Iltimos, birozdan so‘ng qayta urinib ko‘ring.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideLock(){var d=document.getElementById('sl-modal');if(!d)return;d.remove();showingLock=false;document.body.style.overflow=showingVpn?'hidden':'';}
 function showVpn(){
  if(showingVpn||showingLock||document.getElementById('vb-modal'))return;showingVpn=true;
  var d=document.createElement('div');d.id='vb-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛡️</div><h2>VPN/Proksi orqali kirish taqiqlangan</h2><p>Saytdan foydalanish uchun VPN yoki proksi dasturini o‘chirib, sahifani qayta yuklang.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideVpn(){var d=document.getElementById('vb-modal');if(!d)return;d.remove();showingVpn=false;document.body.style.overflow=showingLock?'hidden':'';}
 function checkVpn(){
  return new Promise(function(res){
   var c=(typeof AbortController!=='undefined')?new AbortController():null,t=setTimeout(function(){if(c)c.abort();},5000);
   fetch('https://api.ipapi.is/',c?{signal:c.signal}:{}).then(function(r){
    clearTimeout(t);if(!r.ok)return res(null);return r.json();
   }).then(function(j){
    if(!j||typeof j!=='object'||(j.is_vpn==null&&j.is_proxy==null&&j.is_datacenter==null))return res(null);
    res(!!(j.is_vpn||j.is_proxy||j.is_tor||j.is_datacenter));
   }).catch(function(){clearTimeout(t);res(null);});
  });
 }
 function tick(){
  if(checking||isAdmin())return;
  checking=true;api(9000).then(function(r){checking=false;
   if(r&&r.ok&&r.locked)return showLock();
   if(r&&r.ok&&!r.locked&&showingLock)hideLock();
   if(r&&r.ok&&r.vpnBlock){
    if(vpnFlag===null||Date.now()-vpnCheckedAt>120000){
     checkVpn().then(function(v){vpnFlag=v;vpnCheckedAt=Date.now();
      if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
     });
    }else if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
   }else if(showingVpn)hideVpn();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
</script>
</body></html>
