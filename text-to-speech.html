<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text to Speech | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>textarea{width:100%;min-height:190px;resize:vertical;background:#050b14;color:var(--text);border:1px solid rgba(56,189,248,.42);border-radius:10px;padding:14px;font:15px monospace;outline:none}textarea:focus{border-color:var(--accent);box-shadow:var(--glow)}.file-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:14px 0 4px}.file-row input[type=file]{min-width:0;flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.field{display:grid;gap:8px}.field select,.field input{width:100%;min-width:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// BROWSER VOICE TOOL</div><h1>TEXT → SPEECH</h1><p class="intro">Matnni qurilmangizdagi mavjud ovoz yordamida o‘qitadi.</p><section class="panel"><textarea id="text" placeholder="Ovoz chiqariladigan matnni yozing…"></textarea><div class="file-row"><input id="textFile" type="file" accept=".txt,text/plain"><span class="notice" style="margin:0">TXT fayl yuklang — matn avtomatik joylanadi.</span></div><div class="grid"><label class="field"><span class="label">OVOZ</span><select id="voice"></select></label><label class="field"><span class="label">TEZLIK</span><input id="rate" type="range" min="0.5" max="2" step="0.1" value="1"></label></div><div class="actions"><button id="speak">▶ O‘QISH</button><button id="download" class="secondary">⬇ OVOZNI YUKLASH</button><button id="stop" class="secondary">■ TO‘XTATISH</button></div><p id="status" class="notice">Brauzer ovozlarini kutmoqda…</p></section></main><script>const t=document.getElementById('text'),v=document.getElementById('voice'),r=document.getElementById('rate'),s=document.getElementById('status'),textFile=document.getElementById('textFile');function load(){const vs=speechSynthesis.getVoices();v.innerHTML='';vs.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x.name+' — '+x.lang;v.appendChild(o)});s.textContent=vs.length?'Ovoz tayyor.':'Brauzerda ovoz topilmadi.'}speechSynthesis.onvoiceschanged=load;load();textFile.addEventListener('change',async()=>{const file=textFile.files[0];if(!file)return;if(!/\.txt$/i.test(file.name)&&file.type!=='text/plain'){s.textContent='Faqat TXT fayl yuklang.';textFile.value='';return}try{t.value=await file.text();s.textContent='TXT fayl yuklandi.'}catch(e){s.textContent='TXT faylni o‘qib bo‘lmadi.'}});document.getElementById('speak').onclick=()=>{if(!t.value.trim()){s.textContent='Avval matn yozing yoki TXT fayl yuklang.';return}speak();};function speak(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.value);const vs=speechSynthesis.getVoices();u.voice=vs[Number(v.value)]||null;u.rate=Number(r.value);u.onend=()=>s.textContent='Tugadi.';u.onerror=()=>s.textContent='Ovoz chiqarishda xatolik.';speechSynthesis.speak(u);s.textContent='O‘qilmoqda…'}document.getElementById('stop').onclick=()=>{speechSynthesis.cancel();s.textContent='To‘xtatildi.'};

document.getElementById('download').onclick=async()=>{
  const text=t.value.trim();
  if(!text){s.textContent='Avval matn yozing yoki TXT fayl yuklang.';return}
  if(text.length>12000){s.textContent='Yuklash uchun matn 12000 belgidan oshmasin.';return}

  const vs=speechSynthesis.getVoices();
  const voice=vs[Number(v.value)]||null;
  const lang=(voice?.lang||'en-US').toLowerCase();
  const speed=Number(r.value)||1;

  try{
    s.textContent='MP3 tayyorlanmoqda…';
    const url='https://tts-api.netlify.app/?text='+encodeURIComponent(text)+'&lang='+encodeURIComponent(lang.split('-')[0])+'&speed='+encodeURIComponent(speed);
    const res=await fetch(url,{method:'GET',mode:'cors',cache:'no-store'});
    if(!res.ok) throw new Error('TTS server: '+res.status);
    const type=res.headers.get('content-type')||'';
    if(!type.includes('audio')) throw new Error('Audio qaytmadi');

    const blob=await res.blob();
    if(!blob.size) throw new Error('Bo‘sh audio');
    const blobUrl=URL.createObjectURL(new Blob([blob],{type:'audio/mpeg'}));
    const a=document.createElement('a');
    a.href=blobUrl;
    a.download='it-shakh-voice.mp3';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(blobUrl),5000);
    s.textContent='Ovoz MP3 fayl sifatida yuklandi.';
  }catch(e){
    console.error(e);
    s.textContent='MP3 yuklashda xatolik. O‘QISH tugmasi brauzer ovozida ishlaydi.';
  }
}</script></body></html>
