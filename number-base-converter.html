<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Base Converter | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>.result{font:700 18px monospace;word-break:break-all;padding:14px;background:#050b14;border:1px solid rgba(56,189,248,.3);border-radius:10px;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// NUMBER SYSTEM TOOL</div><h1>NUMBER BASE CONVERTER</h1><p class="intro">BIN, OCT, DEC va HEX o‘rtasida sonlarni tez aylantiring.</p><section class="panel"><div class="grid"><label class="field"><span class="label">SON</span><input id="num" value="255" spellcheck="false"></label><label class="field"><span class="label">KIRITISH ASOSI</span><select id="base"><option value="2">BIN — 2</option><option value="8">OCT — 8</option><option value="10" selected>DEC — 10</option><option value="16">HEX — 16</option></select></label></div><div id="out"></div><p id="status" class="notice"></p></section></main><script>const n=document.getElementById('num'),b=document.getElementById('base'),o=document.getElementById('out'),s=document.getElementById('status');function run(){const raw=n.value.trim();if(!raw){o.innerHTML='';return}try{const v=BigInt(raw);const base=Number(b.value);if((base===2&&!/^[-+]?[01]+$/.test(raw))||(base===8&&!/^[-+]?[0-7]+$/.test(raw))||(base===10&&!/^[+-]?\d+$/.test(raw))||(base===16&&!/^[-+]?[0-9a-f]+$/i.test(raw)))throw Error();o.innerHTML=[['BIN',v.toString(2)],['OCT',v.toString(8)],['DEC',v.toString(10)],['HEX',v.toString(16).toUpperCase()]].map(x=>`<div class="result"><small>${x[0]}</small><br>${x[1]}</div>`).join('');s.textContent='Tayyor.'}catch(e){o.innerHTML='';s.textContent='Kiritilgan son tanlangan sanoq sistemasiga mos emas.'}}n.oninput=run;b.onchange=run;run();</script></body></html>
