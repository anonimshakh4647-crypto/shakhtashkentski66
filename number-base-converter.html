<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Number Base Converter | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>.result{font:700 18px monospace;word-break:break-all;padding:14px;background:#050b14;border:1px solid rgba(56,189,248,.3);border-radius:10px;margin-top:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// NUMBER SYSTEM TOOL</div><h1>NUMBER BASE CONVERTER</h1><p class="intro">BIN, OCT, DEC va HEX o‘rtasida sonlarni tez aylantiring.</p><section class="panel"><div class="grid"><label class="field"><span class="label">SON</span><input id="num" value="255" spellcheck="false"></label><label class="field"><span class="label">KIRITISH ASOSI</span><select id="base"><option value="2">BIN — 2</option><option value="8">OCT — 8</option><option value="10" selected>DEC — 10</option><option value="16">HEX — 16</option></select></label></div><div id="out"></div><p id="status" class="notice"></p></section></main><script>const n=document.getElementById('num'),b=document.getElementById('base'),o=document.getElementById('out'),s=document.getElementById('status');function run(){const raw=n.value.trim();if(!raw){o.innerHTML='';return}try{const v=BigInt(raw);const base=Number(b.value);if((base===2&&!/^[-+]?[01]+$/.test(raw))||(base===8&&!/^[-+]?[0-7]+$/.test(raw))||(base===10&&!/^[+-]?\d+$/.test(raw))||(base===16&&!/^[-+]?[0-9a-f]+$/i.test(raw)))throw Error();o.innerHTML=[['BIN',v.toString(2)],['OCT',v.toString(8)],['DEC',v.toString(10)],['HEX',v.toString(16).toUpperCase()]].map(x=>`<div class="result"><small>${x[0]}</small><br>${x[1]}</div>`).join('');s.textContent='Tayyor.'}catch(e){o.innerHTML='';s.textContent='Kiritilgan son tanlangan sanoq sistemasiga mos emas.'}}n.oninput=run;b.onchange=run;run();</script><!-- IT-SHAKH-SITELOCK -->
<style>
#sl-modal{position:fixed;inset:0;z-index:2147483647;background:rgba(2,6,14,.96);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit}
.sl-box{width:min(440px,100%);background:#06101c;border:1px solid rgba(31,214,245,.4);border-radius:16px;padding:28px 24px;box-shadow:0 0 60px rgba(31,214,245,.25);text-align:center;box-sizing:border-box}
.sl-ic{font-size:42px}
.sl-box h2{margin:8px 0 10px;font-size:21px;color:#1fd6f5;font-family:inherit}
.sl-box p{margin:0;font-size:13px;line-height:1.55;color:#cbd5e1;font-family:inherit}
</style>
<script>
/* ===== SAYTNI TO'LIQ BLOKLASH (texnik ishlar rejimi) — TOOLS sahifalari uchun =====
   index.html dagi admin panelidan "SAYTNI BLOKLASH" yoqilsa, bu tekshiruv shu asbob sahifasida ham ishlaydi,
   ADMIN_EMAIL'dan boshqa hech kim to'g'ridan-to'g'ri havola orqali ham asbobdan foydalana olmaydi.
   Hech qanday Google token/kredensial talab qilinmaydi — shuning uchun sessiya holatidan qat'i nazar ishlaydi. */
(function(){
 var USERS_API_URL='https://script.google.com/macros/s/AKfycbyGcZgnnp91p19OhUVCep3zh_Izw9Day-jQaveO0rYVX7cK0F_y9yZaSHJ-qdMUZzhiBA/exec';
 var ADMIN='anonimshakh4647@gmail.com';
 var showing=false,checking=false;
 function getUser(){try{return JSON.parse(localStorage.getItem('it_shakh_google_user')||'null')}catch(e){return null}}
 function isAdmin(){var u=getUser();return !!(u&&String(u.email||'').toLowerCase()===ADMIN);}
 function api(ms){return new Promise(function(res){
  var cb='sl2_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script'),done=false;
  var fin=function(v){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.parentNode&&sc.remove();res(v);};
  window[cb]=fin;sc.onerror=function(){fin(null)};setTimeout(function(){fin(null)},ms||9000);
  sc.src=USERS_API_URL+'?action=sitestat&callback='+cb+'&_='+Date.now();document.head.appendChild(sc);});}
 function show(){
  if(showing||document.getElementById('sl-modal'))return;showing=true;
  var d=document.createElement('div');d.id='sl-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛠️</div><h2>Sayt vaqtincha yopiq</h2><p>Hozirda saytda texnik ishlar olib borilmoqda. Iltimos, birozdan so‘ng qayta urinib ko‘ring.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hide(){var d=document.getElementById('sl-modal');if(!d)return;d.remove();showing=false;document.body.style.overflow='';}
 function tick(){
  if(checking||isAdmin())return;
  checking=true;api(9000).then(function(r){checking=false;
   if(r&&r.ok&&r.locked)show();else if(r&&r.ok&&!r.locked&&showing)hide();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
</script>
</body></html>
