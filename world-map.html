<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Map | IT SHAKH</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header><main><div class="eyebrow">// GLOBAL NETWORK VIEW</div><h1>WORLD MAP</h1><p class="intro">Xaritani sichqoncha yoki barmoq bilan suring, kattalashtiring va nuqtalarni bosing. Nuqtalar demo tarmoq markazlarini ifodalaydi.</p><div id="map" class="map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map',{zoomControl:true}).setView([25,15],2);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);const points=[['Tashkent, UZ',41.2995,69.2401,'Central Asia node'],['London, UK',51.5072,-.1276,'Europe node'],['Singapore',1.3521,103.8198,'Asia-Pacific node'],['New York, US',40.7128,-74.006,'America node'],['São Paulo, BR',-23.5505,-46.6333,'South America node'],['Sydney, AU',-33.8688,151.2093,'Oceania node']];points.forEach(p=>L.circleMarker([p[1],p[2]],{radius:9,color:'#38bdf8',fillColor:'#38bdf8',fillOpacity:.65,weight:2}).bindPopup('<b>'+p[0]+'</b><br>'+p[3]+'<br><span style="color:#1685b4">● ONLINE</span>').addTo(map));
</script></body></html>
