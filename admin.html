<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT SHAKH — ADMIN PANEL</title>
<style>
:root{--accent:#38bdf8;--bg:#02070e;--panel:rgba(3,15,28,.82)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% 20%,rgba(0,125,255,.12),transparent 45%),var(--bg);color:#dbeafe}
body{display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden}
.panel{width:min(900px,96vw);border:1px solid rgba(56,189,248,.42);border-radius:22px;background:var(--panel);box-shadow:0 0 45px rgba(0,150,255,.16),inset 0 0 35px rgba(0,100,255,.05);padding:30px;backdrop-filter:blur(12px)}
h1{margin:0;color:var(--accent);letter-spacing:4px;text-shadow:0 0 20px rgba(56,189,248,.55);font-size:clamp(26px,5vw,44px)}
.sub{margin:8px 0 26px;color:#94a3b8;font:12px monospace;letter-spacing:2px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{padding:22px;border:1px solid rgba(56,189,248,.2);border-radius:14px;background:rgba(2,10,20,.65)}.card b{display:block;color:#38bdf8;margin-bottom:8px}.btn{display:inline-block;margin-top:22px;padding:10px 18px;border-radius:20px;background:var(--accent);color:#001018;text-decoration:none;font-weight:800}.deny{text-align:center}.deny h2{color:#fb7185}.hidden{display:none!important}
</style>
</head>
<body>
<div class="panel" id="admin-app">
  <h1>ADMIN PANEL</h1>
  <div class="sub">IT SHAKH // PRIVATE ADMIN AREA</div>
  <div class="grid">
    <div class="card"><b>ACCESS</b><span id="admin-email">CHECKING...</span></div>
    <div class="card"><b>STATUS</b><span>ADMIN ACCESS ACTIVE</span></div>
    <div class="card"><b>TOOLS</b><span>Admin tools can be added here.</span></div>
  </div>
  <a class="btn" href="index.html">← BACK TO SITE</a>
</div>
<div class="panel deny hidden" id="deny">
  <h2>ACCESS DENIED</h2>
  <p>Bu sahifa faqat administrator uchun.</p>
  <a class="btn" href="index.html">← BACK TO SITE</a>
</div>
<script>
(async function(){
  const app=document.getElementById('admin-app');
  const deny=document.getElementById('deny');
  function denied(){app.classList.add('hidden');deny.classList.remove('hidden');setTimeout(()=>location.replace('index.html#tools'),900);}
  try{
    const r=await fetch('/api/admin/me',{credentials:'same-origin',cache:'no-store'});
    if(!r.ok){ denied(); return; }
    const data=await r.json();
    document.getElementById('admin-email').textContent=data.email||'ADMIN';
  }catch(e){ denied(); }
})();
</script>
</body>
</html>
