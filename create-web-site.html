<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IT SHAKH | Sayt yasash studiyasi</title>
<style>
:root{--bg:#04060b;--accent:#38bdf8;--text-color:#e5e7eb;
--ui:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
--u0:#0a101a;--u1:#0f1724;--u2:#142033;--u3:#1b2a42;--ul:#1f2e47;--ul2:#2a3b58;--ut:#e6edf8;--um:#8a9bb5;--ok:#34d399;--warn:#fbbf24;--err:#f87171;--r:8px}
body.night-mode{--bg:#000;--accent:#00ff41;--text-color:#00ff41}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;font-family:var(--ui);background:var(--bg);color:var(--text-color);overflow:hidden}
header.site{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 20px;flex-wrap:wrap;gap:8px;border-bottom:1px solid rgba(56,189,248,.15)}
.logo-text{font-weight:800;letter-spacing:2px;font-size:15px}
.nav-links{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.nav-links a{color:var(--text-color);text-decoration:none;font-size:12px;letter-spacing:1px;opacity:.85}
.nav-links a:hover{opacity:1;color:var(--accent)}
.mode-toggle{background:transparent;border:1px solid rgba(56,189,248,.4);color:var(--accent);padding:5px 11px;border-radius:20px;font:11px monospace;letter-spacing:1px;cursor:pointer}
main.wrapm{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 12px 10px;max-width:1900px;width:100%;margin:0 auto}
.hidden{display:none!important}
/* ===== app ===== */
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--u0);color:var(--ut);border-radius:10px;overflow:hidden;border:1px solid rgba(56,189,248,.3);font-size:13px;position:relative}
.app *{scrollbar-width:thin;scrollbar-color:var(--ul2) transparent}
.app button,.app input,.app select,.app textarea{font-family:inherit}
.ic{width:16px;height:16px;flex:none;vertical-align:middle;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.topbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--u1);border-bottom:1px solid var(--ul);min-height:46px;overflow-x:auto;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}
.tb-sp{flex:1;min-width:6px}
.tb-sep{width:1px;height:22px;background:var(--ul);flex:none;margin:0 2px}
.ub{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:7px;border:1px solid var(--ul2);background:var(--u2);color:var(--ut);font:600 12.5px var(--ui);cursor:pointer;white-space:nowrap;flex:none;transition:.12s}
.ub:hover{background:var(--u3);border-color:#3a5078}
.ub.pri{background:var(--accent);border-color:var(--accent);color:#04121c}
.ub.pri:hover{filter:brightness(1.1)}
.ub.ghost{background:transparent;border-color:transparent}.ub.ghost:hover{background:var(--u3)}
.ub.ico{width:32px;padding:0}
.ub.on{background:rgba(56,189,248,.16);border-color:var(--accent);color:var(--accent)}
body.night-mode .ub.on{background:rgba(0,255,65,.12)}
.ub.sm{height:26px;padding:0 9px;font-size:12px;border-radius:6px}
.ub.sm.ico{width:26px;padding:0}
.ub.danger:hover{background:rgba(248,113,113,.15);border-color:var(--err);color:var(--err)}
.ub:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;background:var(--u0);border:1px solid var(--ul);border-radius:9px;padding:2px;flex:none}
.seg button{border:0;background:transparent;color:var(--um);height:28px;padding:0 12px;border-radius:7px;font:700 12.5px var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ut)}.seg button.on{background:var(--u3);color:var(--accent);box-shadow:0 0 0 1px var(--ul2)}
.pname{background:transparent;border:1px solid transparent;color:var(--ut);font:700 14px var(--ui);padding:5px 8px;border-radius:6px;width:210px;max-width:28vw;min-width:90px}
.pname:hover{border-color:var(--ul2)}.pname:focus{outline:none;border-color:var(--accent);background:var(--u0)}
.saved{font-size:11.5px;color:var(--um);white-space:nowrap;margin:0 4px}
.view{flex:1;min-height:0;display:flex}
/* ===== builder ===== */
.lp,.rp{flex:none;display:flex;flex-direction:column;background:var(--u1);min-height:0}
.lp{width:292px;border-right:1px solid var(--ul)}
.rp{width:330px;border-left:1px solid var(--ul)}
.ptabs{flex:none;display:flex;border-bottom:1px solid var(--ul);background:var(--u1)}
.ptabs button{flex:1;border:0;background:transparent;color:var(--um);padding:11px 4px;font:700 12px var(--ui);cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.ptabs button:hover{color:var(--ut)}.ptabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.pbody{flex:1;min-height:0;overflow:auto;padding:12px}
.pbody.np{padding:0}
.empty{color:var(--um);text-align:center;padding:30px 16px;font-size:13px;line-height:1.55}
.empty .big{font-size:34px;display:block;margin-bottom:8px}
.hint{color:var(--um);font-size:11.5px;line-height:1.5;margin:4px 0 0}
.note{background:rgba(56,189,248,.08);border:1px solid rgba(56,189,248,.25);color:#b9dcf2;border-radius:8px;padding:9px 11px;font-size:12px;line-height:1.5;margin-bottom:12px}
.note.warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:#f5d98a}
.note b{color:var(--ut)}
.slist{list-style:none;margin:0;padding:6px}
.sli{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent;position:relative}
.sli:hover{background:var(--u2)}.sli.on{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.45)}
body.night-mode .sli.on{background:rgba(0,255,65,.08)}
.sli.drag{opacity:.4}.sli.over{box-shadow:0 -2px 0 var(--accent)}.sli.hid .sl-n{opacity:.45;text-decoration:line-through}
.sli .grab{color:var(--um);cursor:grab;display:flex}
.sli .sl-ic{width:28px;height:28px;border-radius:7px;background:var(--u3);display:grid;place-items:center;color:var(--accent);flex:none}
.sl-n{flex:1;min-width:0;font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-n small{display:block;font-weight:400;color:var(--um);font-size:11px;overflow:hidden;text-overflow:ellipsis}
.sl-act{display:none;gap:2px}.sli:hover .sl-act,.sli.on .sl-act{display:flex}
.sl-act button,.mini{border:0;background:transparent;color:var(--um);width:24px;height:24px;border-radius:5px;cursor:pointer;display:grid;place-items:center;padding:0}
.sl-act button:hover,.mini:hover{background:var(--u3);color:var(--ut)}
.mini.on{color:var(--accent)}.mini.del:hover{color:var(--err)}
.lib-cat{font:700 11px var(--ui);letter-spacing:.8px;text-transform:uppercase;color:var(--um);margin:14px 2px 6px}
.lib-cat:first-child{margin-top:2px}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lib-card{background:var(--u2);border:1px solid var(--ul);border-radius:9px;padding:10px 8px;cursor:pointer;text-align:center;color:var(--ut);font:600 12px var(--ui);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:78px;justify-content:center}
.lib-card:hover{border-color:var(--accent);background:var(--u3)}
.lib-card .ic{width:22px;height:22px;color:var(--accent)}
.lib-card small{font-weight:400;color:var(--um);font-size:10.5px;line-height:1.3}
.add-big{display:flex;width:calc(100% - 12px);margin:6px}
/* fields */
.fld{margin-bottom:12px}
.fld>label,.fld>.lbl{display:block;font:600 11.5px var(--ui);color:#a9b8cf;margin-bottom:5px}
.in,.fld input[type=text],.fld input[type=url],.fld input[type=number],.fld input[type=email],.fld input[type=date],.fld input[type=datetime-local],.fld textarea,.fld select,.dlg input[type=text],.dlg select,.dlg textarea{width:100%;background:var(--u0);border:1px solid var(--ul2);color:var(--ut);border-radius:7px;padding:8px 10px;font:13px var(--ui);min-width:0}
.fld textarea{resize:vertical;min-height:70px;line-height:1.5}
.fld textarea.code,.dlg textarea.code{font:12px/1.5 var(--mono);white-space:pre;tab-size:2}
.in:focus,.fld input:focus,.fld textarea:focus,.fld select:focus,.dlg input:focus,.dlg select:focus,.dlg textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.fld select,.dlg select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#8a9bb5 50%),linear-gradient(135deg,#8a9bb5 50%,transparent 50%);background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:26px}
.fld select option,.dlg select option{background:#0f1724;color:#e6edf8}
.frow{display:flex;gap:8px;align-items:center}
.frow>*{min-width:0}
.tog{display:flex;align-items:center;gap:10px;cursor:pointer;font:600 12.5px var(--ui);color:var(--ut)}
.tog input{display:none}
.tog i{width:34px;height:20px;border-radius:20px;background:var(--u3);border:1px solid var(--ul2);position:relative;flex:none;transition:.15s}
.tog i:after{content:'';position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#8a9bb5;transition:.15s}
.tog input:checked+i{background:var(--accent);border-color:var(--accent)}.tog input:checked+i:after{left:16px;background:#04121c}
.colorf{display:flex;gap:8px;align-items:center}
.colorf input[type=color]{width:38px;height:34px;padding:2px;border-radius:7px;border:1px solid var(--ul2);background:var(--u0);cursor:pointer;flex:none}
.range{width:100%;accent-color:var(--accent)}
.choice{display:flex;gap:6px;flex-wrap:wrap}
.choice button{flex:1;min-width:0;border:1px solid var(--ul2);background:var(--u0);color:var(--um);border-radius:7px;padding:7px 6px;font:600 12px var(--ui);cursor:pointer;white-space:nowrap}
.choice button:hover{color:var(--ut)}.choice button.on{border-color:var(--accent);color:var(--accent);background:rgba(56,189,248,.1)}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.sw button{aspect-ratio:1;border-radius:9px;border:2px solid transparent;cursor:pointer;padding:0;position:relative;overflow:hidden}
.sw button.on{border-color:#fff;box-shadow:0 0 0 2px var(--accent)}
.sw button i{position:absolute;right:0;bottom:0;width:50%;height:50%}
.imgf{display:flex;gap:8px;align-items:center}
.imgf .th{width:64px;height:44px;border-radius:7px;background:var(--u0) center/cover no-repeat;border:1px solid var(--ul2);flex:none;display:grid;place-items:center;color:var(--um)}
.sect{border:1px solid var(--ul);border-radius:9px;margin-bottom:10px;background:var(--u1)}
.sect>summary{list-style:none;cursor:pointer;padding:9px 11px;font:700 12px var(--ui);color:#c7d4e8;display:flex;align-items:center;gap:8px}
.sect>summary::-webkit-details-marker{display:none}
.sect>summary:after{content:'▾';margin-left:auto;color:var(--um);transition:.15s}.sect[open]>summary:after{transform:rotate(180deg)}
.sect>.sb{padding:4px 11px 2px;border-top:1px solid var(--ul)}
.sect>.sb{padding-top:12px}
.li{border:1px solid var(--ul);border-radius:9px;margin-bottom:8px;background:var(--u2)}
.li>.lih{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 10px;cursor:pointer}
.li>.lih b{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li>.lib{display:none;padding:12px 11px 2px;border-top:1px solid var(--ul)}
.li.open>.lib{display:block}
.li>.lih .car{transition:.15s;color:var(--um)}.li.open>.lih .car{transform:rotate(90deg)}
.pill{display:inline-block;font:700 10.5px var(--ui);letter-spacing:.4px;padding:2px 7px;border-radius:20px;background:var(--u3);color:var(--um)}
/* ===== stage ===== */
.stage{flex:1;min-width:0;display:flex;flex-direction:column;background:#0a0f18;position:relative}
.sbar{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--ul);background:var(--u1)}
.dev button{width:34px}
.zoomv{font:600 12px var(--mono);color:var(--um);min-width:42px;text-align:center}
.canvas{flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;padding:14px;background:repeating-conic-gradient(#0d1420 0 25%,#0a101a 0 50%) 0 0/20px 20px}
.sw.sm{grid-template-columns:repeat(auto-fill,40px);gap:8px}.sw.sm button{aspect-ratio:auto;width:40px;height:40px;border-radius:50%}.sw.sm button i{display:none}
.fwrap{background:#fff;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);overflow:hidden;flex:none;position:relative}
.fwrap iframe{border:0;display:block;background:#fff;transform-origin:0 0}
.mbar{display:none}
/* ===== dialogs ===== */
.ovl{position:fixed;inset:0;background:rgba(2,6,14,.72);backdrop-filter:blur(3px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px;animation:fi .15s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.dlg{background:var(--u1);color:var(--ut);border:1px solid var(--ul2);border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);width:min(520px,100%);max-height:calc(100dvh - 28px);display:flex;flex-direction:column;font:13px var(--ui)}
.dlg.wide{width:min(980px,100%)}.dlg.mid{width:min(720px,100%)}
.dlg>.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--ul);flex:none}
.dlg>.dh h3{margin:0;font-size:16px;flex:1}
.dlg>.db{padding:18px;overflow:auto;flex:1;min-height:0}
.dlg>.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--ul);flex:none;flex-wrap:wrap;align-items:center}
.dlg p{line-height:1.6;color:#c3d0e4;margin:0 0 10px}
.dlg code,.hint code,.note code,.lesson code{font:12px var(--mono);background:var(--u0);border:1px solid var(--ul);padding:1px 5px;border-radius:4px;color:#9bd8f5}
.dlg h4{margin:16px 0 6px;font-size:13.5px;color:var(--ut)}
.dlg ol,.dlg ul{margin:6px 0 10px;padding-left:20px;color:#c3d0e4;line-height:1.7}
.dlg kbd,.lesson kbd{font:600 11px var(--mono);background:var(--u3);border:1px solid var(--ul2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--ut)}
.pop{position:fixed;z-index:1100;background:var(--u2);border:1px solid var(--ul2);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.55);padding:5px;min-width:200px;max-height:70vh;overflow:auto;font:13px var(--ui)}
.pop .mi{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--ut);padding:8px 10px;border-radius:7px;cursor:pointer;text-align:left;font:13px var(--ui)}
.pop .mi:hover{background:var(--u3)}.pop .mi small{display:block;color:var(--um);font-size:11px}
.pop .mi .ic{color:var(--accent)}.pop hr{border:0;border-top:1px solid var(--ul);margin:5px 4px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--u3);color:var(--ut);border:1px solid var(--ul2);padding:10px 18px;border-radius:30px;font:600 13px var(--ui);z-index:2000;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:ti .2s;max-width:90vw}
.toast.err{border-color:var(--err);color:#fecaca}.toast.ok{border-color:var(--ok)}
@keyframes ti{from{opacity:0;transform:translate(-50%,10px)}}
/* wizard */
.steps{display:flex;gap:6px;margin-bottom:16px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--u3)}.steps i.on{background:var(--accent)}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tpl{background:var(--u2);border:2px solid var(--ul);border-radius:12px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:var(--ut);font:inherit;display:flex;flex-direction:column}
.tpl:hover{border-color:var(--ul2);transform:translateY(-2px)}.tpl.on{border-color:var(--accent)}
.tpl .pv{height:120px;position:relative;overflow:hidden;background:#fff;pointer-events:none}
.tpl .pv iframe{border:0;width:1200px;height:760px;transform:scale(.16);transform-origin:0 0;position:absolute;left:0;top:0}
.tpl .tx{padding:9px 11px 11px}.tpl b{display:block;font-size:13px}.tpl small{color:var(--um);font-size:11.5px;line-height:1.4;display:block;margin-top:2px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.opt-grid{grid-template-columns:1fr}}
.proj{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--ul);border-radius:10px;margin-bottom:8px;background:var(--u2)}
.proj .pi{width:38px;height:38px;border-radius:9px;background:var(--u3);display:grid;place-items:center;font-size:19px;flex:none}
.proj .pm{flex:1;min-width:0}.proj .pm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.proj .pm small{color:var(--um)}
.chk{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--ul);align-items:flex-start;line-height:1.5}
.chk:last-child{border:0}.chk .st{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.st.ok{background:rgba(52,211,153,.2);color:var(--ok)}.st.warn{background:rgba(251,191,36,.2);color:var(--warn)}.st.err{background:rgba(248,113,113,.2);color:var(--err)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.igrid button{border:2px solid var(--ul);border-radius:9px;padding:0;overflow:hidden;cursor:pointer;aspect-ratio:3/2;background:var(--u0) center/cover;position:relative}
.igrid button:hover{border-color:var(--accent)}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:4px}
.emo button{border:1px solid transparent;background:var(--u2);border-radius:8px;height:38px;font-size:20px;cursor:pointer;color:var(--ut);display:grid;place-items:center;padding:0}
.emo button:hover{border-color:var(--accent);background:var(--u3)}
.emo button .ic{width:20px;height:20px}
/* tour */
.tour-mask{position:fixed;inset:0;z-index:1500}
.tour-hole{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(2,6,14,.78),0 0 0 3px var(--accent);z-index:1501;pointer-events:none;transition:all .25s}
.tour-tip{position:fixed;z-index:1502;width:min(340px,calc(100vw - 24px));background:var(--u2);border:1px solid var(--accent);border-radius:12px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);font:13px var(--ui);color:var(--ut)}
.tour-tip h4{margin:0 0 6px;font-size:15px}.tour-tip p{margin:0 0 14px;line-height:1.6;color:#c3d0e4}
.tour-tip .tf{display:flex;align-items:center;gap:8px}.tour-tip .tf small{color:var(--um);margin-right:auto}
/* ===== code view ===== */
.cv{flex:1;min-width:0;display:flex;min-height:0}
.cside{width:280px;flex:none;border-right:1px solid var(--ul);background:var(--u1);display:flex;flex-direction:column;min-height:0}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.cprev{flex:1;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--ul);min-height:0}
.etabs{flex:none;display:flex;align-items:center;background:var(--u1);border-bottom:1px solid var(--ul);gap:2px;padding:4px 6px}
.etabs .et{border:0;background:transparent;color:var(--um);padding:6px 12px;border-radius:7px;font:700 12px var(--mono);cursor:pointer;display:flex;align-items:center;gap:7px}
.etabs .et i{width:8px;height:8px;border-radius:50%}
.etabs .et:hover{color:var(--ut)}.etabs .et.on{background:var(--u3);color:var(--ut)}
.eh{flex:1;min-height:0;position:relative;background:#0b1320}
.ce{position:absolute;inset:0;display:none}.ce.on{display:block}
.ce-gut{position:absolute;left:0;top:0;bottom:0;width:46px;background:#0b1320;border-right:1px solid var(--ul);overflow:hidden;color:#4d5f7d;font:12.5px/20px var(--mono);text-align:right;padding:10px 8px 0 0;user-select:none;white-space:pre;z-index:2}
.ce-box{position:absolute;left:46px;right:0;top:0;bottom:0;overflow:hidden}

function format(lang,src){

    return out.join('\n').replace(/\}\n(?=[^}\s])/g,'}\n\n')+'\n';
  }
  if(lang==='js'){

    for(let raw of src.split('\n')){let l=raw.trim();if(!l){out.push('');continue}
      const strip=l.replace(/"(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`|\/\/.*$/g,'');

    if(/^<(script|style|pre|textarea)\b/i.test(t)&&!/\/>$/.test(t)){let j=i+1,body='';while(j<tokens.length&&!new RegExp('^</'+/^<(\w+)/.exec(t)[1],'i').test(tokens[j])){body+=tokens[j];j++}out.push('  '.repeat(d)+t);if(body)out.push(body.split('\n').map(l=>'  '.repeat(d+1)+l.trim()).filter(l=>l.trim()).join('\n'));out.push('  '.repeat(d)+(tokens[j]||''));i=j;continue}
    if(/^<\//.test(t)){d=Math.max(0,d-1);out.push('  '.repeat(d)+t)}
    else if(/^<[a-zA-Z]/.test(t)){

      out.push('  '.repeat(d)+t);if(!VOID.has(tag)&&!/\/>$/.test(t))d++}

add({id:'j1',g:'JavaScript',t:'Birinchi JavaScript: tugma bosilganda',tab:'js',

/* >>> js/80_main.js */
/* ===== shell: modes, projects (IndexedDB), wizard, export, help, tour ===== */
(function(WS){
'use strict';
const {h,esc,svg,$,$$}=WS,B=WS.B;
const M=WS.M={proj:null,mode:'builder',db:null,mem:{},list:[],dirty:false,saveT:0,refs:{}};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
/* ---------- storage ---------- */
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('it_shakh_sites',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('p',{keyPath:'id'});d.createObjectStore('m',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);r.onblocked=()=>res(null)}catch(e){res(null)}})}
const req=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const store={
  async put(p){const meta={id:p.id,name:p.name,kind:p.kind,tpl:p.tpl,updated:p.updated,created:p.created,icon:(p.meta&&p.meta.icon)||'',n:(p.sections||[]).length};
    if(!M.db){M.mem[p.id]={p:JSON.parse(JSON.stringify(p)),m:meta};return}
    const t=M.db.transaction(['p','m'],'readwrite');t.objectStore('p').put(p);t.objectStore('m').put(meta);await new Promise((res,rej)=>{t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
  async get(id){if(!M.db)return M.mem[id]?JSON.parse(JSON.stringify(M.mem[id].p)):null;return req(M.db.transaction('p').objectStore('p').get(id))},
  async all(){if(!M.db)return Object.values(M.mem).map(x=>x.m);return req(M.db.transaction('m').objectStore('m').getAll())},
  async del(id){if(!M.db){delete M.mem[id];return}const t=M.db.transaction(['p','m'],'readwrite');t.objectStore('p').delete(id);t.objectStore('m').delete(id);await new Promise(r=>{t.oncomplete=r;t.onerror=r})}
};
async function saveNow(){
  clearTimeout(M.saveT);if(!M.proj||!M.dirty)return;M.dirty=false;
  try{M.proj.updated=Date.now();await store.put(M.proj);setStatus('Saqlandi ✓')}catch(e){setStatus('Saqlab bo‘lmadi!');WS.toast('Brauzer xotirasiga saqlab bo‘lmadi. Loyihani «Yuklab olish → Loyiha fayli» orqali saqlang.','err')}
}
function changed(){M.dirty=true;setStatus('Saqlanmoqda…');clearTimeout(M.saveT);M.saveT=setTimeout(saveNow,700)}
function setStatus(t){const s=$('#saveSt');if(s)s.textContent=t}
addEventListener('beforeunload',()=>{if(M.dirty){saveNow()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});
/* ---------- projects ---------- */
function gcAssets(p){if(!p.assets)return;const s=JSON.stringify([p.sections,p.meta]);for(const id of Object.keys(p.assets))if(s.indexOf('asset:'+id)<0)delete p.assets[id]}
async function openProject(p,keepMode){
  await saveNow();
  if(p.kind!=='code'){gcAssets(p);if(!p.theme)p.theme=WS.defaultTheme();if(!p.info)p.info=WS.defaultInfo();if(!p.meta)p.meta={title:'',desc:'',lang:'uz',icon:'🌐',head:'',css:'',js:''}}
  M.proj=p;LS('ws_cur',p.id);
  if(p.kind==='code'){if(M.mode!=='code'&&M.mode!=='learn')setMode('code',true)}
  else{WS.Builder.load(p);if(M.mode==='code'&&!keepMode)setMode('code',true)}
  if(M.mode==='code'&&WS.Code)WS.Code.openProject(p);
  syncTop();setStatus('');
}
async function newProject(p){await store.put(p);await openProject(p);if(p.kind==='code')setMode('code',true);else if(M.mode!=='builder')setMode('builder',true)}
M.putAndOpen=async function(np){await newProject(np)};
/* ---------- top bar ---------- */
function syncTop(){
  const n=$('#pname');if(n&&M.proj&&document.activeElement!==n)n.value=M.proj.name||'';
  const u=$('#bUndo'),r=$('#bRedo');if(u&&WS.Builder){u.disabled=!WS.Builder.canUndo();r.disabled=!WS.Builder.canRedo()}
}
function buildTop(){
  const tb=$('#topbar');tb.innerHTML='';
  const seg=h('div',{cls:'seg',id:'modeSeg'},...[['builder','layers','Quruvchi'],['code','code','Kod'],['learn','graduate','Darslar']].map(([k,ic,l])=>h('button',{'data-m':k,id:'m-'+k,html:svg(ic)+'<span>'+l+'</span>',on:{click:()=>setMode(k)}})));
  const name=h('input',{cls:'pname',id:'pname',type:'text',spellcheck:'false',title:'Loyiha nomi','aria-label':'Loyiha nomi',on:{input:e=>{if(M.proj){M.proj.name=e.target.value;changed()}}}});
  tb.append(seg,name,h('span',{cls:'saved hide-s',id:'saveSt'}),h('div',{cls:'tb-sp'}),
    h('button',{cls:'ub ico',id:'bUndo',title:'Qaytarish (Ctrl+Z)',html:svg('undo'),on:{click:()=>WS.Builder.undo()}}),
    h('button',{cls:'ub ico',id:'bRedo',title:'Qayta bajarish (Ctrl+Y)',html:svg('redo'),on:{click:()=>WS.Builder.redo()}}),
    h('span',{cls:'tb-sep'}),
    h('button',{cls:'ub',id:'bProj',title:'Mening saytlarim',html:svg('folder')+'<span class="hide-s">Saytlarim</span>',on:{click:openProjects}}),
    h('button',{cls:'ub',id:'bNew',title:'Yangi sayt',html:svg('plus')+'<span class="hide-s">Yangi</span>',on:{click:()=>openWizard()}}),
    h('button',{cls:'ub ico',id:'bHelp',title:'Yordam va yo‘riqnoma',html:svg('help'),on:{click:e=>openHelp()}}),
    h('button',{cls:'ub pri',id:'bExport',html:svg('download')+'<span>Yuklab olish</span>',on:{click:e=>exportMenu(e.currentTarget)}}));
  syncTop();
}
function setMode(m,silent){
  M.mode=m;LS('ws_mode',m);
  $('#vBuilder').classList.toggle('hidden',m!=='builder');$('#vCode').classList.toggle('hidden',m==='builder');
  $$('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const bm=m==='builder';['bUndo','bRedo'].forEach(i=>{const e=$('#'+i);e&&e.classList.toggle('hidden',!bm)});
  $('#pname')&&$('#pname').classList.toggle('hidden',m==='learn');
  if(m==='builder'){
    if(M.proj&&M.proj.kind==='code'){
      store.all().then(async l=>{const b=l.filter(x=>x.kind!=='code').sort((a,c)=>c.updated-a.updated)[0];if(b){await openProject(await store.get(b.id))}else{M.mode='code';setMode('code',true);openWizard()}});
    }
    WS.Builder.refresh&&M.proj&&M.proj.kind!=='code'&&WS.Builder.refresh();
  }else if(WS.Code){
    WS.Code.show(m,M.proj);
  }
  syncTop();
}
/* ---------- export ---------- */
function slug(){return WS.slug((M.proj&&M.proj.name)||'sayt')}
function builderOk(){return M.proj&&M.proj.kind!=='code'}
function composeCode(){return WS.Code?WS.Code.compose(M.proj):{html:'',css:'',js:''}}
function fullHtml(){
  if(builderOk())return WS.exportHtml(M.proj,'single').html;
  return composeCode().doc;
}
function precheck(go){
  if(!builderOk()){go();return}
  const R=WS.audit(M.proj),errs=R.filter(r=>r.s==='err');
  if(!errs.length){go();return}
  auditDialog(R,go);
}
function doDownloadHtml(){precheck(()=>{WS.download(slug()+'.html',fullHtml(),'text/html');WS.toast('HTML fayl yuklab olindi — brauzerda ochib ko‘ring','ok')})}
function doDownloadZip(){precheck(()=>{

    if(el&&el.offsetParent!==null){mask.style.background='transparent';const r=el.getBoundingClientRect(),pad=4;
      hole.style.cssText=`left:${r.left-pad}px;top:${r.top-pad}px;width:${r.width+pad*2}px;height:${r.height+pad*2}px;display:block`;
      const tw=tip.offsetWidth,th=tip.offsetHeight;let x=r.right+14,y=r.top;
      if(x+tw>innerWidth-10){x=r.left+r.width/2-tw/2;y=r.bottom+14}
      if(y+th>innerHeight-10)y=Math.max(10,innerHeight-th-10);if(r.width>innerWidth*.6){x=r.left+r.width/2-tw/2;y=Math.min(r.top+30,innerHeight-th-14)}
      x=Math.max(10,Math.min(x,innerWidth-tw-10));tip.style.left=x+'px';tip.style.top=y+'px';
    }else{hole.style.cssText='display:none';mask.style.background='rgba(2,6,14,.75)';tip.style.left=Math.max(10,(innerWidth-tip.offsetWidth)/2)+'px';tip.style.top=Math.max(10,(innerHeight-tip.offsetHeight)/2)+'px'}
  }
  addEventListener('resize',place);show();
}
WS.startTour=startTour;
/* ---------- host hooks for builder ---------- */
WS.BS.host={changed,hist:syncTop,save:()=>{M.dirty=true;saveNow().then(()=>WS.toast('Saqlandi ✓','ok'))},audit:()=>auditDialog(WS.audit(M.proj),null),preview:doPreview};
/* ---------- boot ---------- */
async function boot(){
  const night=$('#modeToggle'),body=document.body;
  try{if(LS('it_shakh_night_mode')==='1')body.classList.add('night-mode')}catch(e){}
  const lab=()=>{night.textContent=body.classList.contains('night-mode')?'DAY MODE':'NIGHT MODE'};lab();
  night.addEventListener('click',()=>{body.classList.toggle('night-mode');LS('it_shakh_night_mode',body.classList.contains('night-mode')?'1':'0');lab()});
  const back=$('#toolsBackBtn');if(back)back.addEventListener('click',()=>{location.replace('index.html?fromTools=1#tools')});
  buildTop();WS.Builder.build($('#vBuilder'));
  if(WS.Code)WS.Code.build($('#vCode'));
  M.db=await openDB();
  if(!M.db)setTimeout(()=>WS.toast('Brauzer xotirasi mavjud emas — loyihalar avtomatik saqlanmaydi','err'),800);
  const list=(await store.all()).sort((a,b)=>b.updated-a.updated);
  let startMode=LS('ws_mode')||'builder';if(startMode==='learn'&&!WS.Code)startMode='builder';
  M.mode=startMode==='learn'?'learn':'builder';
  if(!list.length){
    setMode('builder',true);openWizard({first:true});
    // learn mode requires no project
    if(startMode==='learn')setMode('learn',true);
  }else{
    const cur=LS('ws_cur');const meta=list.find(x=>x.id===cur)||list[0];
    const p=await store.get(meta.id);
    M.mode=(startMode==='code'||startMode==='learn')?startMode:(p.kind==='code'?'code':'builder');
    $('#vBuilder').classList.toggle('hidden',M.mode!=='builder');$('#vCode').classList.toggle('hidden',M.mode==='builder');
    await openProject(p,true);
    setMode(M.mode,true);
  }
  addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();WS.BS.host.save()}});
}
WS.boot=boot;
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})(window.WS);

</script>
