<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREATE WEB SITE — IT SHAKH</title>
<style>
:root{
  --bg:#070b12;--panel:#0d131d;--panel2:#111a27;--line:#1e3046;
  --text:#e9f2ff;--muted:#7f91a8;--cyan:#00e5ff;--green:#39ff88;
  --red:#ff5277;--shadow:0 0 30px rgba(0,229,255,.08)
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0%,#102033 0,#070b12 38%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;height:100vh;overflow:hidden}
header{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:rgba(7,11,18,.92);backdrop-filter:blur(12px)}
.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:1.5px}
.logo{width:38px;height:38px;border:1px solid var(--cyan);border-radius:10px;display:grid;place-items:center;color:var(--cyan);font-weight:900;box-shadow:0 0 18px rgba(0,229,255,.22)}
.brand span{color:var(--cyan)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:#0c1521;color:var(--text);padding:9px 13px;border-radius:8px;cursor:pointer;font-weight:700}
button:hover{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 15px rgba(0,229,255,.1)}
button.primary{background:rgba(0,229,255,.1);border-color:var(--cyan);color:var(--cyan)}
button.danger{border-color:#5a2635;color:#ff7e9a}
main{height:calc(100vh - 68px);display:grid;grid-template-columns:minmax(430px,46%) 1fr;gap:1px;background:var(--line)}
.editor-area,.preview-area{background:var(--bg);min-width:0}
.editor-area{display:grid;grid-template-rows:1fr 1fr 1fr;gap:1px;background:var(--line)}
.editor{min-height:0;display:flex;flex-direction:column;background:var(--panel)}
.editor-head,.preview-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:var(--panel2);border-bottom:1px solid var(--line)}
.editor-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}
.dot{width:9px;height:9px;border-radius:50%}
.html .dot{background:#ff7043}.css .dot{background:#42a5f5}.js .dot{background:#ffd54f}
.editor textarea{flex:1;width:100%;resize:none;border:0;outline:0;background:#090f18;color:#dbeafe;padding:13px 15px;font:13px/1.55 Consolas,Monaco,monospace;tab-size:2}
.editor textarea:focus{box-shadow:inset 0 0 0 1px rgba(0,229,255,.18)}
.preview-area{display:flex;flex-direction:column}
.preview-head{height:48px}
.preview-title{font-weight:800;font-size:13px;letter-spacing:.8px}
.status{font-size:11px;color:var(--green);display:flex;gap:7px;align-items:center}
.status i{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 9px var(--green)}
.preview-wrap{padding:12px;height:calc(100% - 48px);background:#080d15}
iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:white;box-shadow:var(--shadow)}
.help{color:var(--muted);font-size:11px}
@media(max-width:900px){
 body{overflow:auto;height:auto}
 header{height:auto;min-height:68px;align-items:flex-start;padding:12px;gap:10px;flex-direction:column}
 main{height:auto;min-height:calc(100vh - 100px);display:flex;flex-direction:column}
 .editor-area{height:720px;display:grid;grid-template-rows:repeat(3,1fr)}
 .preview-area{height:620px}
}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">&lt;/&gt;</div><div>IT <span>SHAKH</span> — CREATE WEB SITE</div></div>
  <div class="actions">
    <button class="primary" id="run">▶ RUN</button>
    <button id="clear">CLEAR</button>
    <button id="copy">COPY CODE</button>
    <button id="download">DOWNLOAD HTML</button>
    <button id="fullscreen">FULLSCREEN</button>
  </div>
</header>

<main>
  <section class="editor-area">
    <div class="editor html">
      <div class="editor-head"><div class="editor-title"><i class="dot"></i> HTML</div><div class="help">Structure</div></div>
      <textarea id="htmlCode" spellcheck="false"><div class="page">
  <h1>Welcome to IT SHAKH</h1>
  <p>Create your website here.</p>
  <button onclick="hello()">CLICK ME</button>
</div></textarea>
    </div>
    <div class="editor css">
      <div class="editor-head"><div class="editor-title"><i class="dot"></i> CSS</div><div class="help">Design</div></div>
      <textarea id="cssCode" spellcheck="false">body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: white;
  display: grid;
  place-items: center;
  min-height: 100vh;
}
.page { text-align: center; }
h1 { color: #00e5ff; }
button {
  padding: 12px 20px;
  border: 1px solid #00e5ff;
  border-radius: 8px;
  background: transparent;
  color: #00e5ff;
  cursor: pointer;
}</textarea>
    </div>
    <div class="editor js">
      <div class="editor-head"><div class="editor-title"><i class="dot"></i> JAVASCRIPT</div><div class="help">Logic</div></div>
      <textarea id="jsCode" spellcheck="false">function hello() {
  alert("Hello from IT SHAKH!");
}</textarea>
    </div>
  </section>

  <section class="preview-area" id="previewArea">
    <div class="preview-head">
      <div class="preview-title">LIVE PREVIEW</div>
      <div class="status"><i></i> LIVE</div>
    </div>
    <div class="preview-wrap"><iframe id="preview" sandbox="allow-scripts allow-forms allow-modals"></iframe></div>
  </section>
</main>

<script>
const htmlEl=document.getElementById('htmlCode');
const cssEl=document.getElementById('cssCode');
const jsEl=document.getElementById('jsCode');
const frame=document.getElementById('preview');

function build(){
  const html=htmlEl.value;
  const css=cssEl.value;
  const js=jsEl.value;
  frame.srcdoc='<!doctype html><html><head><meta charset="UTF-8"><style>'+css+'</style></head><body>'+html+'<script>'+js+'<\/script></body></html>';
}
let timer;
function live(){clearTimeout(timer);timer=setTimeout(build,250)}
[htmlEl,cssEl,jsEl].forEach(el=>el.addEventListener('input',live));
document.getElementById('run').onclick=build;
document.getElementById('clear').onclick=()=>{
  htmlEl.value='';cssEl.value='';jsEl.value='';build();
};
function combined(){
  return '<!DOCTYPE html>\\n<html lang="en">\\n<head>\\n<meta charset="UTF-8">\\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\\n<title>My Website</title>\\n<style>\\n'+cssEl.value+'\\n<style id="it-shakh-back-button-style">
.it-shakh-back-btn{position:fixed;left:18px;bottom:18px;z-index:99999;border:1px solid #1b4662;background:#081827;color:#dff5ff;border-radius:10px;padding:10px 15px;font:800 12px Segoe UI,Arial,sans-serif;cursor:pointer;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.it-shakh-back-btn:hover{border-color:#00e5ff;color:#00e5ff}
@media(max-width:600px){.it-shakh-back-btn{left:10px;bottom:10px;padding:9px 12px}}
</style>
</style>\\n</head>\\n<body>\\n'+htmlEl.value+'\\n<script>\\n'+jsEl.value+'\\n<\\/script>\\n</body>\\n</html>';
}
document.getElementById('copy').onclick=async()=>{
  try{await navigator.clipboard.writeText(combined()); alert('Code copied!')}
  catch(e){alert('Copy failed.')}
};
document.getElementById('download').onclick=()=>{
  const blob=new Blob([combined()],{type:'text/html'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-website.html';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.getElementById('fullscreen').onclick=()=>{
  if(frame.requestFullscreen) frame.requestFullscreen();
  else alert('Fullscreen is not supported by this browser.');
};
build();
</script>
<button type="button" class="it-shakh-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">← ORQAGA</button>
</body>
</html>
