<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA Light Studio | IT SHAKH</title>
<meta name="description" content="GTA San Andreas DFF modelidagi istalgan detalni (fanar, shisha, lampa) tunda yonadigan qiling: detalga bosing, yonish turini tanlang, DFF ni yuklab oling.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg0:#070b16;--bg1:#0c1322;--bg2:#121b30;--bg3:#1a2540;--line:#233152;--line2:#2f4170;--accent:#1fd6f5;--violet:#8b6cff;--amber:#ffb020;
  --text:#e6edf8;--mute:#8d9bb8;--dim:#5f6f90;--ok:#34d399;--warn:#fbbf24;--err:#fb7185}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.45 'Inter',system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg0);color:var(--text);
  display:grid;grid-template-rows:46px minmax(0,1fr) 26px;grid-template-columns:minmax(0,1fr) 400px;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{accent-color:var(--accent);width:100%}
input[type=color]{width:100%;height:34px;padding:2px;background:var(--bg0);border:1px solid var(--line2);border-radius:8px;cursor:pointer}
.hide{display:none!important}
#top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg1);border-bottom:1px solid var(--line)}
#top .back{color:var(--accent);text-decoration:none;font-weight:800;font-size:11px;letter-spacing:2px;white-space:nowrap;padding-right:12px;border-right:1px solid var(--line)}
#top h1{margin:0;font-size:13px;letter-spacing:3px;font-weight:800;white-space:nowrap}
#top h1 em{font-style:normal;color:var(--amber)}
#top .sp{flex:1}
.btn{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:7px 13px;font-weight:600;font-size:12.5px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--violet));border:0;color:#04101c;font-weight:800}
.btn.on{border-color:var(--accent);background:rgba(31,214,245,.14);color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.big{width:100%;padding:12px;font-size:14px;border-radius:11px}
#stage{position:relative;min-width:0;min-height:0;background:#000}
#gl{width:100%;height:100%;display:block}
#hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:rgba(8,12,24,.86);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:12px;padding:7px 11px;display:flex;align-items:center;gap:10px}
.pill b{font:12px ui-monospace,Menlo,Consolas,monospace;font-weight:600;min-width:92px;color:var(--mute)}
.pill input[type=range]{width:170px}
.dn{display:flex;background:var(--bg0);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px}
.dn button{border:0;background:transparent;border-radius:7px;padding:6px 11px;font-weight:700;font-size:12.5px;color:var(--mute)}
.dn button[aria-pressed="true"]{background:var(--accent);color:#03101c}
#hint{position:absolute;left:12px;top:12px;background:rgba(8,12,24,.88);border:1px solid var(--line2);border-radius:11px;padding:9px 13px;max-width:min(470px,calc(100% - 24px));color:var(--text);font-size:13px}
#hint b{color:var(--amber)}
#empty{position:absolute;inset:0;display:grid;place-items:center;padding:20px;pointer-events:none}
#empty .box{pointer-events:auto;max-width:520px;text-align:center;border:2px dashed var(--line2);border-radius:18px;padding:30px 24px;background:rgba(12,19,34,.92)}
#empty.over .box{border-color:var(--accent)}
#empty h2{margin:0 0 6px;font-size:21px}
#empty p{margin:0 0 16px;color:var(--mute)}
#empty .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#empty .btn{padding:10px 18px;font-size:14px}
#dock{background:var(--bg1);border-left:1px solid var(--line);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line2) transparent;padding:12px;display:flex;flex-direction:column;gap:12px}
.card{flex-shrink:0;background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card>header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.card>header i{font-style:normal;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--violet));color:#04101c;font-weight:800;font-size:12px;display:grid;place-items:center}
.card>header h2{margin:0;font-size:13.5px;font-weight:700;letter-spacing:.3px}
.cb{padding:13px 14px}
.card.exp{border-color:var(--line2)}
.card.exp .cb{display:grid;gap:9px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg0);border:1px solid var(--line2);border-radius:12px;padding:3px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px;font-weight:700;font-size:12.5px;color:var(--mute)}
.tabs button[aria-pressed="true"]{background:var(--bg3);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.meta{font-size:12px;color:var(--mute);margin-bottom:8px}
.meta b{color:var(--text)}
.hint,.mode,.step{color:var(--mute);font-size:12.5px;margin:0 0 10px}
.step{color:var(--text)}
.mode{font-size:12px;border-left:3px solid var(--accent);padding:5px 10px;background:rgba(31,214,245,.06);border-radius:0 8px 8px 0}
.empty-note{color:var(--dim);font-size:12.5px;margin:6px 0 2px;text-align:center}
.note{font-size:12px;color:var(--mute);border-left:3px solid var(--accent);padding:7px 11px;background:rgba(31,214,245,.06);border-radius:0 8px 8px 0;margin:8px 0}
.note.warn{border-color:var(--warn);background:rgba(251,191,36,.07)}
.seg{display:flex;background:var(--bg0);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 4px;font-size:12px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#03101c;font-weight:800}
.fld{display:grid;gap:5px;margin-bottom:11px;min-width:0}
.fld>label,.lbl{display:flex;justify-content:space-between;gap:8px;color:var(--mute);font-size:11.5px;font-weight:600}
.lbl{margin:2px 0 7px;letter-spacing:.4px;text-transform:uppercase;font-size:10.5px}
.fld>label b{color:var(--text);font:11.5px ui-monospace,Menlo,Consolas,monospace;font-weight:400}
.inp,select,textarea{width:100%;background:var(--bg0);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;outline:0;min-width:0}
textarea{resize:vertical;min-height:54px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.chk{display:flex;align-items:flex-start;gap:8px;margin:0 0 10px;font-size:12.5px;cursor:pointer}
.chk input{accent-color:var(--accent);margin-top:2px}
.chk small{display:block;color:var(--dim);font-size:11.5px}
.objs{max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:4px 8px;margin-top:6px;background:var(--bg0)}
.objs label{display:flex;gap:8px;align-items:center;padding:3px 0;font-size:12px}
.objs label span{color:var(--dim);margin-left:auto;font-size:11px}
details{margin:6px 0}
summary{cursor:pointer;color:var(--mute);font-size:12px;font-weight:600;padding:4px 0;user-select:none}
summary:hover{color:var(--text)}
details.adv{border-top:1px dashed var(--line);margin-top:10px;padding-top:6px}
.drow{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:var(--bg0)}
.drow:hover{border-color:var(--line2)}
.drow.on{border-color:var(--accent);box-shadow:0 0 0 1px rgba(31,214,245,.35) inset}
.drow .dot{width:14px;height:14px;border-radius:50%;box-shadow:0 0 8px currentColor;flex:none}
.drow .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px;background:none;border:0;padding:0;display:block}
.drow small{color:var(--dim);font-size:11px}
.drow .x{border:0;background:transparent;color:var(--mute);font-size:13px;padding:2px 5px;border-radius:5px}
.drow .x:hover{color:var(--err);background:rgba(251,113,133,.12)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.mcard{display:grid;gap:2px;text-align:left;padding:10px 11px;background:var(--bg0);border:1px solid var(--line2);border-radius:11px}
.mcard .ic{font-size:20px;line-height:1.1}
.mcard b{font-size:13px}
.mcard small{color:var(--dim);font-size:11px}
.mcard:hover:not(:disabled){border-color:var(--accent)}
.mcard.on{border-color:var(--accent);background:rgba(31,214,245,.1)}
.mcard:disabled{opacity:.45;cursor:not-allowed}
.pcard{display:grid;gap:1px;text-align:left;padding:10px 11px;background:var(--bg0);border:1px solid var(--line2);border-radius:11px}
.pcard .ic{font-size:20px;line-height:1.1}
.pcard b{font-size:13px}
.pcard small{color:var(--dim);font-size:11px}
.pcard:hover{border-color:var(--accent)}
.pcard.on{border-color:var(--accent);background:rgba(31,214,245,.1)}
.sw{display:flex;gap:5px;flex-wrap:wrap;padding-top:3px}
.swb{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:0}
.swb:hover{border-color:#fff}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:8px 0}
.vbox{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
#logoPrev{display:block;max-width:100%;max-height:130px;margin:0 auto 10px;border-radius:8px;background-image:linear-gradient(45deg,#1a2540 25%,transparent 25%,transparent 75%,#1a2540 75%),linear-gradient(45deg,#1a2540 25%,#0c1322 25%,#0c1322 75%,#1a2540 75%);background-size:14px 14px;background-position:0 0,7px 7px;border:1px solid var(--line)}
.lint{font-size:12px;color:var(--warn)}
.lint:empty{display:none}
.audit{font-size:12px;line-height:1.5;color:var(--mute);margin:0 0 10px;white-space:pre-wrap}
.audit:empty{display:none}
.audit b.ok{color:#4ade80}.audit b.bad{color:var(--warn)}
#readme{white-space:pre-wrap;font:11.5px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#c9d4e8;background:var(--bg0);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:220px;overflow:auto;user-select:text;margin-top:6px}
#status{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--bg1);border-top:1px solid var(--line);color:var(--mute);font:11.5px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#0b101d;border:1px solid var(--accent);border-radius:9px;padding:9px 16px;font-size:13px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(max-width:980px){
  body{display:block;overflow:auto;height:auto}
  #stage{height:60vh}
  #dock{border-left:0;overflow:visible}
  #top h1{display:none}
  .pill input[type=range]{width:110px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="top">
  <a class="back" id="backLink" href="index.html">← IT SHAKH</a>

  <input type="file" id="fileDff" accept=".dff" hidden>

</div>
<div id="stage">
  <canvas id="gl" aria-label="3D ko'rinish"></canvas>

  <div id="empty"><div class="box">
    <h2>DFF modelingizni tashlang</h2>
    <p>GTA San Andreas obyekt yoki mashina DFF fayli. Fayl brauzeringizdan chiqmaydi.</p>
    <div class="row"><button class="btn pri" id="btnDff2" type="button">DFF tanlash</button><button class="btn" id="btnDemo2" type="button">Demo mashina bilan sinash</button></div>
  </div></div>
  <div id="hud">
    <div class="pill"><div class="dn" role="group" aria-label="Kun yoki tun"><button id="bDay" type="button" aria-pressed="true">☀ Kun</button><button id="bNight" type="button" aria-pressed="false">🌙 Tun</button></div>
      <input id="hour" type="range" min="0" max="24" step="0.1" value="13" aria-label="Kun vaqti"><b id="hourTxt">13:00 · kun</b></div>
    <div class="pill hide" id="lampPill"><button class="btn sm pri" id="bLamp" type="button" aria-pressed="true">🚗 Fara: yoqiq</button></div>
    <div class="pill"><button class="btn sm" id="btnReset" type="button">Kamerani tiklash</button></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<script>
/* ===== DFF (RenderWare 3.6 / GTA SA) reader + writer + decal builder. DOM-free. ===== */
(function(root){
'use strict';
const T={STRUCT:1,STRING:2,EXT:3,TEXTURE:6,MATERIAL:7,MATLIST:8,FRAMELIST:14,GEOMETRY:15,CLUMP:16,ATOMIC:20,GEOLIST:26,
  BINMESH:0x50E,SKIN:0x116,NIGHT:0x253F2F9,FX2D:0x253F2F8,FRAMENAME:0x253F2FE};
const CONT=new Set([3,6,7,8,14,15,16,20,26]);

/* ---------- chunk tree ---------- */
function sizeOf(c){
  if(c.children){let s=c.tail?c.tail.length:0;for(const k of c.children)s+=12+sizeOf(k);return s;}
  return c.data.length;
}
function parseChunks(buf,start,end){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength),out=[];let o=start;
  while(o+12<=end){
    const type=dv.getUint32(o,true),size=dv.getUint32(o+4,true),ver=dv.getUint32(o+8,true);
    let e=o+12+size;if(e>end)e=end;
    const c={type,ver};
    if(CONT.has(type)){
      c.children=parseChunks(buf,o+12,e);
      let used=0;for(const k of c.children)used+=12+sizeOf(k);
      c.tail=used<e-o-12?buf.slice(o+12+used,e):null;
    }else c.data=buf.slice(o+12,e);
    out.push(c);o=e;
  }
  return out;
}
function writeChunk(c,out,o){
  const dv=new DataView(out.buffer);
  dv.setUint32(o,c.type,true);dv.setUint32(o+4,sizeOf(c),true);dv.setUint32(o+8,c.ver,true);
  o+=12;
  if(c.children){for(const k of c.children)o=writeChunk(k,out,o);if(c.tail){out.set(c.tail,o);o+=c.tail.length;}}
  else{out.set(c.data,o);o+=c.data.length;}
  return o;
}
function serialize(roots){
  let total=0;for(const c of roots)total+=12+sizeOf(c);
  const out=new Uint8Array(total);let o=0;for(const c of roots)o=writeChunk(c,out,o);
  return out;
}
const child=(c,t)=>c.children&&c.children.find(k=>k.type===t);
const childs=(c,t)=>c.children?c.children.filter(k=>k.type===t):[];
const dvOf=d=>new DataView(d.buffer,d.byteOffset,d.byteLength);
function rwVersion(stamp){ // library stamp -> RW version (e.g. 0x36003)
  if(stamp&0xFFFF0000)return(((stamp>>14)&0x3FF00)+0x30000)|((stamp>>16)&0x3F);
  return stamp<<8;
}

/* ---------- byte writer ---------- */
class BW{
  constructor(){this.a=[];this.n=0;}
  _p(u){this.a.push(u);this.n+=u.length;}
  u8(v){this._p(new Uint8Array([v&255]));}
  u16(v){const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,v,true);this._p(b);}
  u32(v){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v>>>0,true);this._p(b);}
  i32(v){const b=new Uint8Array(4);new DataView(b.buffer).setInt32(0,v,true);this._p(b);}
  f32(v){const b=new Uint8Array(4);new DataView(b.buffer).setFloat32(0,v,true);this._p(b);}
  bytes(u){this._p(u instanceof Uint8Array?u:new Uint8Array(u));}
  str(s,len){const b=new Uint8Array(len);for(let i=0;i<Math.min(len-1,s.length);i++)b[i]=s.charCodeAt(i)&127;this._p(b);}
  done(){const o=new Uint8Array(this.n);let p=0;for(const u of this.a){o.set(u,p);p+=u.length;}return o;}
}

/* ---------- decode ---------- */
function decodeFrames(fl){
  const st=child(fl,T.STRUCT).data,dv=dvOf(st),n=dv.getUint32(0,true),frames=[];
  const exts=childs(fl,T.EXT);
  for(let i=0;i<n;i++){
    const o=4+i*56,rot=new Float32Array(9);for(let k=0;k<9;k++)rot[k]=dv.getFloat32(o+k*4,true);
    const pos=[dv.getFloat32(o+36,true),dv.getFloat32(o+40,true),dv.getFloat32(o+44,true)];
    let name='';const nm=exts[i]&&child(exts[i],T.FRAMENAME);
    if(nm)name=String.fromCharCode(...nm.data).replace(/\0.*$/,'');
    frames.push({name,rot,pos,parent:dv.getInt32(o+48,true),flags:dv.getUint32(o+52,true)});
  }
  return frames;
}
function decodeMaterial(m){
  const st=child(m,T.STRUCT).data,dv=dvOf(st);
  const color=[st[4],st[5],st[6],st[7]],textured=dv.getUint32(12,true)!==0;
  let tex='',mask='';
  const t=child(m,T.TEXTURE);
  if(t){const ss=childs(t,T.STRING);const rd=s=>s?String.fromCharCode(...s.data).replace(/\0.*$/,''):'';tex=rd(ss[0]);mask=rd(ss[1]);}
  return{color,textured,tex,mask};
}
function decodeGeometry(g,rwv){
  const st=child(g,T.STRUCT).data,dv=dvOf(st);
  const flags=dv.getUint32(0,true),nTri=dv.getUint32(4,true),nV=dv.getUint32(8,true),nMorph=dv.getUint32(12,true);
  let o=16;if(rwv<0x34000)o+=12;
  if(flags&0x01000000)return{native:true,flags};
  let numUV=(flags>>16)&255;if(!numUV)numUV=(flags&0x80)?2:(flags&4)?1:0;
  let dayColors=null;
  if(flags&8){dayColors=st.slice(o,o+nV*4);o+=nV*4;}
  const uvs=[];for(let k=0;k<numUV;k++){uvs.push(new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*8)));o+=nV*8;}
  const tris=new Uint16Array(nTri*4);
  for(let i=0;i<nTri;i++){const p=o+i*8;tris[i*4]=dv.getUint16(p+2,true);tris[i*4+1]=dv.getUint16(p,true);tris[i*4+2]=dv.getUint16(p+6,true);tris[i*4+3]=dv.getUint16(p+4,true);}
  // tris[]: v1,v2,v3,materialId
  o+=nTri*8;
  let pos=null,nrm=null;
  for(let m=0;m<nMorph;m++){
    o+=16;const hv=dv.getUint32(o,true),hn=dv.getUint32(o+4,true);o+=8;
    if(hv){const a=new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*12));o+=nV*12;if(m===0)pos=a;}
    if(hn){const a=new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*12));o+=nV*12;if(m===0)nrm=a;}
  }
  const ml=child(g,T.MATLIST);let materials=[];
  if(ml){
    const mst=child(ml,T.STRUCT).data,mdv=dvOf(mst),cnt=mdv.getUint32(0,true),mats=childs(ml,T.MATERIAL).map(decodeMaterial);
    let k=0;for(let i=0;i<cnt;i++){const idx=mdv.getInt32(4+i*4,true);materials.push(idx<0?(mats[k++]||{color:[255,255,255,255],tex:'',mask:'',textured:false}):materials[idx]);}
  }
  const ext=child(g,T.EXT);let night=null,has2dfx=false,skin=false;
  if(ext){
    const nc=child(ext,T.NIGHT);if(nc&&dvOf(nc.data).getUint32(0,true))night=nc.data.slice(4,4+nV*4);
    has2dfx=!!child(ext,T.FX2D);skin=!!child(ext,T.SKIN);
  }

/* ---------- detal tanlash geometriyasi ---------- */
function weld(m){
  if(m._weld)return m._weld;const map=new Map(),w=new Int32Array(m.nV);let n=0;

}

function newDetail(mi,mask,presetKey){

  S.meshes.forEach((m,mi)=>{if(!m.visible)return;const mask=new Uint8Array(m.nT).fill(1);

/* nur nuqtalari (dunyo koordinatasida) */
function lightPoints(d){
  const m=meshOf(d);if(!m)return[];const vs=new Set();
  for(let i=0;i<m.nT;i++)if(d.mask[i]){vs.add(m.tris[i*3]);vs.add(m.tris[i*3+1]);vs.add(m.tris[i*3+2]);}
  const ids=[...vs];if(!ids.length)return[];
  const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9],c=[0,0,0],nrm=[0,0,0];
  for(const v of ids){for(let k=0;k<3;k++){const x=m.wpos[v*3+k];mn[k]=Math.min(mn[k],x);mx[k]=Math.max(mx[k],x);c[k]+=x;nrm[k]+=m.wnrm[v*3+k];}}
  c[0]/=ids.length;c[1]/=ids.length;c[2]/=ids.length;const ext=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2]),lift=Math.min(.05,ext*.08);

    for(const v of cand){let md=1e18;for(const q of pickd){const dx=m.wpos[v*3]-m.wpos[q*3],dy=m.wpos[v*3+1]-m.wpos[q*3+1],dz=m.wpos[v*3+2]-m.wpos[q*3+2];md=Math.min(md,dx*dx+dy*dy+dz*dz);}if(md>bd){bd=md;bv=v;}}
    pickd.push(bv);}

}

  S.bytes=null;S.dff=null;S.fileName='';S.meshes=[];S.details=[];S.active=-1;S.vehicle=false;viewer.setModel([]);viewer.setDetails([]);

/* ---------- mashina farasi (ko'rish uchun) ---------- */
function setLamp(on){viewer.lampOn=!!on;viewer.dirty=true;const b=$('#bLamp');if(b){b.setAttribute('aria-pressed',String(!!on));b.textContent=on?'🚗 Fara: yoqiq':'🚗 Fara: o\'chiq';}
  const c=$('#lampBtnCard');if(c){c.textContent=on?'🚗 Fara yoqilgan — o\'chirib ko\'ring':'🚗 Fara o\'chiq — yoqib ko\'ring';c.classList.toggle('pri',!!on);}}

/* ---------- ko'rish: bosish / sichqoncha ---------- */

    if(r.added.length)L.push('⚠ '+r.added.length+' ta yangi frame/obyekt qo\'shildi: '+r.added.join(', ')+' (logo uchun yangi geometriya; dummy emas).');

   }).then(function(j){

    res(!!(j.is_vpn||j.is_proxy||j.is_tor||j.is_datacenter));
   }).catch(function(){clearTimeout(t);res(null);});
  });
 }
 function tick(){
  if(checking||isAdmin())return;
  checking=true;
  var u=getUser(),credOk=!!(u&&u.email&&u.credential);
  // XAVFSIZLIK (reload bilan aylanib o'tishning oldini olish): sayt bloki yoki shu foydalanuvchining bloki
  // oldin keshlangan bo'lsa, serverdan javob kelgunga QADAR HAM tegishli ekran DARHOL ko'rsatiladi.
  var cachedLock=false;try{cachedLock=localStorage.getItem('it_shakh_sitelock_flag')==='1';}catch(e){}
  if(cachedLock&&!showingLock)showLock();
  var blkKey=credOk?('it_shakh_blk_'+String(u.email).toLowerCase()):null;
  var cachedBlk=false;if(blkKey){try{cachedBlk=localStorage.getItem(blkKey)==='1';}catch(e){}}
  if(cachedBlk&&!showingBlock)showBlock();
  var p1=api({action:'sitestat'},9000);
  var p2=credOk?api({action:(expMs(u.credential)>Date.now()+10000?'me':'blockstat'),credential:u.credential},9000):Promise.resolve(null);
  Promise.all([p1,p2]).then(function(res){checking=false;
   var r=res[0],rb=res[1];
   if(r&&r.ok&&r.locked){try{localStorage.setItem('it_shakh_sitelock_flag','1');if(r.lockMsg)localStorage.setItem('it_shakh_sitelock_msg',r.lockMsg);else localStorage.removeItem('it_shakh_sitelock_msg');}catch(e){}return showLock(r.lockMsg);}
   if(r&&r.ok&&!r.locked){try{localStorage.removeItem('it_shakh_sitelock_flag');localStorage.removeItem('it_shakh_sitelock_msg');}catch(e){}if(showingLock)hideLock();}
   if(rb&&rb.ok&&rb.blocked){if(blkKey){try{localStorage.setItem(blkKey,'1');var bmk=blkMsgKey();if(bmk){if(rb.blockMsg)localStorage.setItem(bmk,rb.blockMsg);else localStorage.removeItem(bmk);}}catch(e){}}return showBlock(rb.blockMsg);}
   if(rb&&rb.ok&&!rb.blocked){if(blkKey){try{localStorage.removeItem(blkKey);var bmk2=blkMsgKey();if(bmk2)localStorage.removeItem(bmk2);}catch(e){}}if(showingBlock)hideBlock();}
   if(r&&r.ok&&r.vpnBlock){
    if(vpnFlag===null||Date.now()-vpnCheckedAt>120000){
     checkVpn().then(function(v){vpnFlag=v;vpnCheckedAt=Date.now();
      if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
     });
    }else if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
   }else if(showingVpn)hideVpn();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
