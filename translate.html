<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Translate | IT SHAKH</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"><style>.upload{display:block;border:1px dashed var(--accent);border-radius:14px;padding:34px 18px;text-align:center;cursor:pointer;background:rgba(3,10,19,.55)}.upload:hover{box-shadow:var(--glow)}.upload input{display:none}.select{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}.select button{background:transparent;color:var(--text);border:1px solid rgba(56,189,248,.5);font-size:12px}.select button.active{background:var(--accent);color:#021018}.file-name{margin:15px 0;color:var(--accent);font-family:monospace}.progress-text{min-height:22px;margin-top:18px;color:var(--muted);font-size:13px}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header><main><div class="eyebrow">// UZBEK SCRIPT CONVERTER</div><h1>TRANSLATE</h1><p class="intro">Word yoki Excel faylni yuklang. O‘zbekcha kirill matni lotinga, lotin matni esa kirillga o‘giriladi.</p><section class="panel"><label class="upload"><input id="file" type="file" accept=".docx,.xlsx,.xls,.txt"><b>FAYLNI TANLANG</b><br><span class="notice">DOCX, XLSX, XLS yoki TXT</span></label><div id="file-name" class="file-name">Fayl tanlanmagan</div><div class="label">YO‘NALISHNI TANLANG</div><div class="select"><button class="active" data-mode="auto">AVTOMATIK</button><button data-mode="c2l">KIRILL → LOTIN</button><button data-mode="l2c">LOTIN → KIRILL</button></div><div class="actions" style="margin-top:22px"><button id="convert">O‘GIRISH VA YUKLASH</button></div><div id="status" class="progress-text">Fayl kompyuteringizdan tashqariga yuborilmaydi.</div></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script><script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script><script>const fileInput=document.getElementById('file'),fileName=document.getElementById('file-name'),status=document.getElementById('status');let mode='auto';const cyr={'А':'A','а':'a','Б':'B','б':'b','В':'V','в':'v','Г':'G','г':'g','Ғ':'Gʻ','ғ':'gʻ','Д':'D','д':'d','Е':'E','е':'e','Ё':'Yo','ё':'yo','Ж':'J','ж':'j','З':'Z','з':'z','И':'I','и':'i','Й':'Y','й':'y','К':'K','к':'k','Л':'L','л':'l','М':'M','м':'m','Н':'N','н':'n','О':'O','о':'o','П':'P','п':'p','Қ':'Q','қ':'q','Р':'R','р':'r','С':'S','с':'s','Т':'T','т':'t','У':'U','у':'u','Ф':'F','ф':'f','Х':'X','х':'x','Ҳ':'H','ҳ':'h','Ц':'Ts','ц':'ts','Ч':'Ch','ч':'ch','Ш':'Sh','ш':'sh','Ъ':'','ъ':'','Ь':'','ь':'','Э':'E','э':'e','Ю':'Yu','ю':'yu','Я':'Ya','я':'ya','Ў':'Oʻ','ў':'oʻ'};const latin=[['o[ʻ’‘\']','ў'],['g[ʻ’‘\']','ғ'],['sh','ш'],['ch','ч'],['yo','ё'],['yu','ю'],['ya','я'],['ts','ц'],['a','а'],['b','б'],['v','в'],['g','г'],['d','д'],['e','е'],['j','ж'],['z','з'],['i','и'],['y','й'],['k','к'],['l','л'],['m','м'],['n','н'],['o','о'],['p','п'],['q','қ'],['r','р'],['s','с'],['t','т'],['u','у'],['f','ф'],['x','х'],['h','ҳ']];function caps(src,out){return src===src.toUpperCase()?out.toUpperCase():src[0]===src[0].toUpperCase()?out[0].toUpperCase()+out.slice(1):out}function toLatin(text){return String(text).replace(/[А-Яа-яЎўҚқҒғҲҳ]/g,ch=>cyr[ch]??ch)}function toCyrillic(text){let out=String(text);latin.forEach(([from,to])=>{out=out.replace(new RegExp(from,'gi'),m=>caps(m,to))});return out}function convert(text){if(mode==='c2l')return toLatin(text);if(mode==='l2c')return toCyrillic(text);const c=(String(text).match(/[А-Яа-яЎўҚқҒғҲҳ]/g)||[]).length,l=(String(text).match(/[A-Za-zʻ’‘']/g)||[]).length;return c>=l?toLatin(text):toCyrillic(text)}function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}fileInput.addEventListener('change',()=>{fileName.textContent=fileInput.files[0]?fileInput.files[0].name:'Fayl tanlanmagan'});document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===btn))}));document.getElementById('convert').addEventListener('click',async()=>{const file=fileInput.files[0];if(!file){status.textContent='Avval faylni tanlang.';return}const name=file.name.replace(/\.[^.]+$/,'');const ext=file.name.split('.').pop().toLowerCase();status.textContent='Fayl o‘girilmoqda…';try{const buffer=await file.arrayBuffer();if(ext==='xlsx'||ext==='xls'){const wb=XLSX.read(buffer,{type:'array'});wb.SheetNames.forEach(n=>{const ws=wb.Sheets[n];Object.keys(ws).forEach(k=>{const cell=ws[k];if(cell&&cell.t==='s'){cell.v=convert(cell.v);cell.w=cell.v}})});const output=XLSX.write(wb,{bookType:'xlsx',type:'array'});save(new Blob([output],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name+'-translated.xlsx')}else if(ext==='docx'){const result=await mammoth.extractRawText({arrayBuffer:buffer});const paragraphs=result.value.split(/\r?\n/).map(t=>new docx.Paragraph({text:convert(t)}));const document=new docx.Document({sections:[{children:paragraphs.length?paragraphs:[new docx.Paragraph('')]}]});save(await docx.Packer.toBlob(document),name+'-translated.docx')}else if(ext==='txt'){save(new Blob([convert(new TextDecoder().decode(buffer))],{type:'text/plain;charset=utf-8'}),name+'-translated.txt')}else throw Error('Faqat DOCX, XLSX, XLS yoki TXT tanlang.');status.textContent='✓ Tayyor. Yangi fayl yuklab olindi.'}catch(e){status.textContent='✕ Xatolik: '+e.message}});</script><!-- IT-SHAKH-SITELOCK -->
<style>
#sl-modal,#vb-modal{position:fixed;inset:0;z-index:2147483647;background:rgba(2,6,14,.96);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit}
.sl-box{width:min(440px,100%);background:#06101c;border:1px solid rgba(31,214,245,.4);border-radius:16px;padding:28px 24px;box-shadow:0 0 60px rgba(31,214,245,.25);text-align:center;box-sizing:border-box}
.sl-ic{font-size:42px}
.sl-box h2{margin:8px 0 10px;font-size:21px;color:#1fd6f5;font-family:inherit}
.sl-box p{margin:0;font-size:13px;line-height:1.55;color:#cbd5e1;font-family:inherit}
</style>
<script>
/* ===== SAYTNI TO'LIQ BLOKLASH + VPN TAQIQLASH — TOOLS sahifalari uchun =====
   index.html dagi admin panelidan "SAYTNI BLOKLASH" yoki "VPN TAQIQLASH" yoqilsa,
   bu tekshiruv shu asbob sahifasida ham ishlaydi — ADMIN_EMAIL'dan boshqa hech kim
   to'g'ridan-to'g'ri havola orqali ham asbobdan foydalana olmaydi (sayt bloklanganda),
   yoki VPN/proksi/datacenter orqali kirgan bo'lsa foydalana olmaydi (VPN taqiqlanganda).
   Hech qanday Google token/kredensial talab qilinmaydi — shuning uchun sessiya holatidan qat'i nazar ishlaydi. */
(function(){
 var USERS_API_URL='https://script.google.com/macros/s/AKfycbyGcZgnnp91p19OhUVCep3zh_Izw9Day-jQaveO0rYVX7cK0F_y9yZaSHJ-qdMUZzhiBA/exec';
 var ADMIN='anonimshakh4647@gmail.com';
 var showingLock=false,showingVpn=false,checking=false,vpnFlag=null,vpnCheckedAt=0;
 function getUser(){try{return JSON.parse(localStorage.getItem('it_shakh_google_user')||'null')}catch(e){return null}}
 function isAdmin(){var u=getUser();return !!(u&&String(u.email||'').toLowerCase()===ADMIN);}
 function api(ms){return new Promise(function(res){
  var cb='sl2_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script'),done=false;
  var fin=function(v){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.parentNode&&sc.remove();res(v);};
  window[cb]=fin;sc.onerror=function(){fin(null)};setTimeout(function(){fin(null)},ms||9000);
  sc.src=USERS_API_URL+'?action=sitestat&callback='+cb+'&_='+Date.now();document.head.appendChild(sc);});}
 function showLock(){
  if(showingLock||document.getElementById('sl-modal'))return;showingLock=true;
  var vb=document.getElementById('vb-modal');if(vb)vb.remove();showingVpn=false;
  var d=document.createElement('div');d.id='sl-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛠️</div><h2>Sayt vaqtincha yopiq</h2><p>Hozirda saytda texnik ishlar olib borilmoqda. Iltimos, birozdan so‘ng qayta urinib ko‘ring.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideLock(){var d=document.getElementById('sl-modal');if(!d)return;d.remove();showingLock=false;document.body.style.overflow=showingVpn?'hidden':'';}
 function showVpn(){
  if(showingVpn||showingLock||document.getElementById('vb-modal'))return;showingVpn=true;
  var d=document.createElement('div');d.id='vb-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛡️</div><h2>VPN/Proksi orqali kirish taqiqlangan</h2><p>Saytdan foydalanish uchun VPN yoki proksi dasturini o‘chirib, sahifani qayta yuklang.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideVpn(){var d=document.getElementById('vb-modal');if(!d)return;d.remove();showingVpn=false;document.body.style.overflow=showingLock?'hidden':'';}
 function checkVpn(){
  return new Promise(function(res){
   var c=(typeof AbortController!=='undefined')?new AbortController():null,t=setTimeout(function(){if(c)c.abort();},5000);
   fetch('https://api.ipapi.is/',c?{signal:c.signal}:{}).then(function(r){
    clearTimeout(t);if(!r.ok)return res(null);return r.json();
   }).then(function(j){
    if(!j||typeof j!=='object'||(j.is_vpn==null&&j.is_proxy==null&&j.is_datacenter==null))return res(null);
    res(!!(j.is_vpn||j.is_proxy||j.is_tor||j.is_datacenter));
   }).catch(function(){clearTimeout(t);res(null);});
  });
 }
 function tick(){
  if(checking||isAdmin())return;
  checking=true;api(9000).then(function(r){checking=false;
   if(r&&r.ok&&r.locked)return showLock();
   if(r&&r.ok&&!r.locked&&showingLock)hideLock();
   if(r&&r.ok&&r.vpnBlock){
    if(vpnFlag===null||Date.now()-vpnCheckedAt>120000){
     checkVpn().then(function(v){vpnFlag=v;vpnCheckedAt=Date.now();
      if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
     });
    }else if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
   }else if(showingVpn)hideVpn();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
</script>
</body></html>
