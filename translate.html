<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Translate | IT SHAKH</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"><style>.upload{display:block;border:1px dashed var(--accent);border-radius:14px;padding:34px 18px;text-align:center;cursor:pointer;background:rgba(3,10,19,.55)}.upload:hover{box-shadow:var(--glow)}.upload input{display:none}.select{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}.select button{background:transparent;color:var(--text);border:1px solid rgba(56,189,248,.5);font-size:12px}.select button.active{background:var(--accent);color:#021018}.file-name{margin:15px 0;color:var(--accent);font-family:monospace}.progress-text{min-height:22px;margin-top:18px;color:var(--muted);font-size:13px}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header><main><div class="eyebrow">// UZBEK SCRIPT CONVERTER</div><h1>TRANSLATE</h1><p class="intro">Word yoki Excel faylni yuklang. O‘zbekcha kirill matni lotinga, lotin matni esa kirillga o‘giriladi.</p><section class="panel"><label class="upload"><input id="file" type="file" accept=".docx,.xlsx,.xls,.txt"><b>FAYLNI TANLANG</b><br><span class="notice">DOCX, XLSX, XLS yoki TXT</span></label><div id="file-name" class="file-name">Fayl tanlanmagan</div><div class="label">YO‘NALISHNI TANLANG</div><div class="select"><button class="active" data-mode="auto">AVTOMATIK</button><button data-mode="c2l">KIRILL → LOTIN</button><button data-mode="l2c">LOTIN → KIRILL</button></div><div class="actions" style="margin-top:22px"><button id="convert">O‘GIRISH VA YUKLASH</button></div><div id="status" class="progress-text">Fayl kompyuteringizdan tashqariga yuborilmaydi.</div></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script><script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script><script>const fileInput=document.getElementById('file'),fileName=document.getElementById('file-name'),status=document.getElementById('status');let mode='auto';const cyr={'А':'A','а':'a','Б':'B','б':'b','В':'V','в':'v','Г':'G','г':'g','Ғ':'Gʻ','ғ':'gʻ','Д':'D','д':'d','Е':'E','е':'e','Ё':'Yo','ё':'yo','Ж':'J','ж':'j','З':'Z','з':'z','И':'I','и':'i','Й':'Y','й':'y','К':'K','к':'k','Л':'L','л':'l','М':'M','м':'m','Н':'N','н':'n','О':'O','о':'o','П':'P','п':'p','Қ':'Q','қ':'q','Р':'R','р':'r','С':'S','с':'s','Т':'T','т':'t','У':'U','у':'u','Ф':'F','ф':'f','Х':'X','х':'x','Ҳ':'H','ҳ':'h','Ц':'Ts','ц':'ts','Ч':'Ch','ч':'ch','Ш':'Sh','ш':'sh','Ъ':'','ъ':'','Ь':'','ь':'','Э':'E','э':'e','Ю':'Yu','ю':'yu','Я':'Ya','я':'ya','Ў':'Oʻ','ў':'oʻ'};const latin=[['o[ʻ’‘\']','ў'],['g[ʻ’‘\']','ғ'],['sh','ш'],['ch','ч'],['yo','ё'],['yu','ю'],['ya','я'],['ts','ц'],['a','а'],['b','б'],['v','в'],['g','г'],['d','д'],['e','е'],['j','ж'],['z','з'],['i','и'],['y','й'],['k','к'],['l','л'],['m','м'],['n','н'],['o','о'],['p','п'],['q','қ'],['r','р'],['s','с'],['t','т'],['u','у'],['f','ф'],['x','х'],['h','ҳ']];function caps(src,out){return src===src.toUpperCase()?out.toUpperCase():src[0]===src[0].toUpperCase()?out[0].toUpperCase()+out.slice(1):out}function toLatin(text){return String(text).replace(/[А-Яа-яЎўҚқҒғҲҳ]/g,ch=>cyr[ch]??ch)}function toCyrillic(text){let out=String(text);latin.forEach(([from,to])=>{out=out.replace(new RegExp(from,'gi'),m=>caps(m,to))});return out}function convert(text){if(mode==='c2l')return toLatin(text);if(mode==='l2c')return toCyrillic(text);const c=(String(text).match(/[А-Яа-яЎўҚқҒғҲҳ]/g)||[]).length,l=(String(text).match(/[A-Za-zʻ’‘']/g)||[]).length;return c>=l?toLatin(text):toCyrillic(text)}function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}fileInput.addEventListener('change',()=>{fileName.textContent=fileInput.files[0]?fileInput.files[0].name:'Fayl tanlanmagan'});document.querySelectorAll('[data-mode]').forEach(btn=>btn.addEventListener('click',()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===btn))}));document.getElementById('convert').addEventListener('click',async()=>{const file=fileInput.files[0];if(!file){status.textContent='Avval faylni tanlang.';return}const name=file.name.replace(/\.[^.]+$/,'');const ext=file.name.split('.').pop().toLowerCase();status.textContent='Fayl o‘girilmoqda…';try{const buffer=await file.arrayBuffer();if(ext==='xlsx'||ext==='xls'){const wb=XLSX.read(buffer,{type:'array'});wb.SheetNames.forEach(n=>{const ws=wb.Sheets[n];Object.keys(ws).forEach(k=>{const cell=ws[k];if(cell&&cell.t==='s'){cell.v=convert(cell.v);cell.w=cell.v}})});const output=XLSX.write(wb,{bookType:'xlsx',type:'array'});save(new Blob([output],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),name+'-translated.xlsx')}else if(ext==='docx'){const result=await mammoth.extractRawText({arrayBuffer:buffer});const paragraphs=result.value.split(/\r?\n/).map(t=>new docx.Paragraph({text:convert(t)}));const document=new docx.Document({sections:[{children:paragraphs.length?paragraphs:[new docx.Paragraph('')]}]});save(await docx.Packer.toBlob(document),name+'-translated.docx')}else if(ext==='txt'){save(new Blob([convert(new TextDecoder().decode(buffer))],{type:'text/plain;charset=utf-8'}),name+'-translated.txt')}else throw Error('Faqat DOCX, XLSX, XLS yoki TXT tanlang.');status.textContent='✓ Tayyor. Yangi fayl yuklab olindi.'}catch(e){status.textContent='✕ Xatolik: '+e.message}});</script></body></html>
