<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speech to Text | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>textarea{width:100%;min-height:250px;resize:vertical;background:#050b14;color:var(--text);border:1px solid rgba(56,189,248,.42);border-radius:10px;padding:14px;font:15px monospace}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}.actions{display:flex;gap:10px;flex-wrap:wrap}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="#" onclick="history.back();return false;">← ORQAGA</a></header><main><div class="eyebrow">// BROWSER SPEECH TOOL</div><h1>SPEECH → TEXT</h1><p class="intro">Mikrofondagi nutqni matnga aylantiradi. Natija brauzerning Speech Recognition imkoniyatiga bog‘liq.</p><section class="panel"><div class="grid"><label class="field"><span class="label">TIL</span><select id="lang"><option value="uz-UZ">O‘zbekcha</option><option value="ru-RU">Русский</option><option value="en-US">English</option><option value="tr-TR">Türkçe</option></select></label><label class="field"><span class="label">HOLAT</span><div id="status" class="notice">Tayyor.</div></label></div><textarea id="text" placeholder="Nutq natijasi shu yerda chiqadi…"></textarea><div class="actions"><button id="start">🎙 BOSHLASH</button><button id="stop" class="secondary">■ TO‘XTATISH</button><button id="clear" class="secondary">TOZALASH</button></div></section></main><script>const SR=window.SpeechRecognition||window.webkitSpeechRecognition,t=document.getElementById('text'),s=document.getElementById('status'),lang=document.getElementById('lang');if(!SR){s.textContent='Bu brauzer Speech Recognitionni qo‘llab-quvvatlamaydi.'}else{const r=new SR();r.continuous=true;r.interimResults=true;r.onstart=()=>s.textContent='Tinglanmoqda…';r.onerror=e=>s.textContent='Xatolik: '+e.error;r.onend=()=>s.textContent='To‘xtadi.';r.onresult=e=>{let final='',interim='';for(let i=e.resultIndex;i<e.results.length;i++){const x=e.results[i][0].transcript;if(e.results[i].isFinal)final+=x+' ';else interim+=x}if(final)t.value+=final;t.dataset.interim=interim};document.getElementById('start').onclick=()=>{r.lang=lang.value;r.start()};document.getElementById('stop').onclick=()=>r.stop();document.getElementById('clear').onclick=()=>{t.value='';t.dataset.interim=''}};</script></body></html>
