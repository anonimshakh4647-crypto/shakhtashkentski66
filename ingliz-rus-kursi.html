<script type="text/plain" data-course="en" data-langname="Ingliz tili" data-voice="en-US">
##### m0 | Boshlang'ich (A1) | 🟢 | Alifbo, oddiy gaplar, kundalik so'zlar
=== a1.1 | Alifbo va talaffuz | 10
## Ingliz alifbosi
Ingliz tilida 26 harf bor: 5 unli (vowel) — **a, e, i, o, u** — va 21 undosh (consonant). Lotin alifbosiga juda o'xshash, lekin talaffuzda ko'p harflar o'zbek tilidagidan farq qiladi.
! Ingliz tilida bir harf bir necha xil o'qilishi mumkin. Masalan "a" harfi: {{cat}} so'zida "ey/æ", {{car}} so'zida "ɑː", {{about}} so'zida esa deyarli "a" eshitilmaydi (schwa tovushi). Shuning uchun so'zlarni alohida-alohida yodlash va ko'p tinglash muhim.
## Asosiy salomlashish iboralari
@@ Hello | Salom | /həˈloʊ/
@@ Hi | Salom (norasmiy) | /haɪ/
@@ Good morning | Xayrli tong | /ɡʊd ˈmɔːrnɪŋ/
@@ Good evening | Xayrli kech | /ɡʊd ˈiːvnɪŋ/
@@ How are you? | Qalaysiz? | /haʊ ɑːr juː/
@@ I'm fine, thank you | Yaxshiman, rahmat | /aɪm faɪn θæŋk juː/
@@ Nice to meet you | Tanishganimdan xursandman | /naɪs tuː miːt juː/
@@ Goodbye | Xayr | /ɡʊdˈbaɪ/
## Oddiy muloqot namunasi
~~~ex
A: Hello! How are you? (Salom! Qalaysiz?)
B: I'm fine, thank you. And you? (Yaxshiman, rahmat. Siz-chi?)
A: I'm good too. Nice to meet you! (Men ham yaxshi. Tanishganimdan xursandman!)
B: Nice to meet you too! (Men ham tanishganimdan xursandman!)
~~~
~ Har bir inglizcha gapni tinglash uchun 🔊 belgisini bosing — brauzeringiz uni ovoz chiqarib o'qib beradi. Talaffuzni takrorlashga harakat qiling.
@quiz "Good morning" iborasi qaysi vaqtda ishlatiladi? ::: Kechqurun ::: *Ertalab ::: Tungi payt ::: why=“Morning” — ertalab, “evening” — kechqurun, “night” — tun degani.
@quiz "Nice to meet you" iborasining ma'nosi nima? ::: Xayr ::: Rahmat ::: *Tanishganimdan xursandman ::: why=Bu ibora birinchi marta tanishganda ishlatiladi.
@fib ___ to meet you! (birinchi marta tanishganda aytiladigan ibora) ::: a=nice ::: hint=N harfi bilan boshlanadi, "yaxshi/yoqimli" degan ma'noni bildiradi ::: why="Nice to meet you" — eng keng tarqalgan tanishuv iborasi.

=== a1.2 | "To be" fe'li va shaxs olmoshlari | 10
## Shaxs olmoshlari (Subject pronouns)
|Olmosh|Tarjima|Misol|
|---|---|---|
|I|men|{{I}} am a student.|
|you|sen/siz|{{You}} are smart.|
|he|u (erkak)|{{He}} is tall.|
|she|u (ayol)|{{She}} is kind.|
|it|u (narsa/hayvon)|{{It}} is a cat.|
|we|biz|{{We}} are friends.|
|they|ular|{{They}} are students.|
## "To be" fe'li — bo'lmoq
Ingliz tilida "bo'lmoq" fe'li **be** deyiladi va u shaxsga qarab o'zgaradi: **am / is / are**. Bu fe'l juda muhim, chunki u kasb, xolat, xususiyatni bildirishda doim ishlatiladi (o'zbek tilida bu fe'l ko'pincha tushirib qoldiriladi: "Men talabaman" — lekin ingliz tilida "I **am** a student" shart).
|Olmosh|To be|Misol|
|---|---|---|
|I|am|{{I am happy.}}|
|he / she / it|is|{{She is a doctor.}}|
|you / we / they|are|{{They are at home.}}|
! Qisqa shakllar (contractions) juda ko'p ishlatiladi: I'm, you're, he's, she's, it's, we're, they're. Kundalik nutqda deyarli hamma doim shu qisqa shaklni ishlatadi.
## Inkor va savol shakli
Inkor qilish uchun **be** fe'lidan keyin **not** qo'shiladi: {{I am not tired.}} / {{She is not (isn't) busy.}}
Savol qilish uchun **be** fe'li gap boshiga chiqadi: {{Are you ready?}} / {{Is he at work?}}
@@ student | talaba | /ˈstuːdənt/
@@ teacher | o'qituvchi | /ˈtiːtʃər/
@@ doctor | shifokor | /ˈdɑːktər/
@@ engineer | muhandis | /ˌendʒɪˈnɪr/
@@ busy | band, mashg'ul | /ˈbɪzi/
@@ tired | charchagan | /taɪərd/
@@ happy | baxtli | /ˈhæpi/
@@ at home | uyda | /æt hoʊm/
@quiz "She ___ a teacher." gapini to'ldiring. ::: am ::: *is ::: are ::: why=She — u (ayol), uchinchi shaxs birlik uchun "is" ishlatiladi.
@quiz "They ___ not at home." gapini to'ldiring. ::: is ::: am ::: *are ::: why=They — ular, ko'plik uchun "are" ishlatiladi.
@fib I ___ a student, and my brother ___ an engineer. ::: a=am;are ::: hint=Birinchi bo'sh joy "I" uchun, ikkinchisi "he/brother" uchun ::: why="I am" va "he is/my brother is" — lekin bu yerda ikkinchisi ham "is" bo'lishi kerak, "are" emas — diqqat bilan mashq qiling.
@fib ___ you ready for the lesson? ::: a=are ::: hint=Savol gapida "be" fe'li boshga chiqadi, "you" bilan "are" ishlatiladi ::: why="Are you...?" — "you" bilan doim "are" ishlatiladi.

=== a1.3 | Present Simple va kundalik harakatlar | 12
## Present Simple nima uchun kerak?
**Present Simple** zamon doimiy odatlarni, haqiqatlarni va tez-tez takrorlanadigan harakatlarni ifodalaydi: {{I wake up at seven every day.}} (Men har kuni soat yettida uyg'onaman.)
## Shakllanishi
I / you / we / they bilan fe'l o'z holida qoladi: {{I work.}} {{They play football.}}
He / she / it bilan fe'lga **-s** (ba'zan -es) qo'shiladi: {{He works.}} {{She plays football.}} {{It rains a lot here.}}
!! Diqqat: -o, -ch, -sh, -ss, -x bilan tugaydigan fe'llarga **-es** qo'shiladi (go→goes, watch→watches), "y" oldidan undosh bo'lsa y→i+es bo'ladi (study→studies).
## Inkor va savol
Inkor uchun **do not (don't)** / **does not (doesn't)** ishlatiladi: {{I don't like coffee.}} {{He doesn't like coffee.}}
Savol uchun **Do** / **Does** gap boshiga chiqadi, asosiy fe'l o'z holida qoladi: {{Do you like tea?}} {{Does she speak English?}}
## Kundalik harakatlar lug'ati
@@ wake up | uyg'onmoq | /weɪk ʌp/
@@ get up | turmoq (o'rindan) | /ɡɛt ʌp/
@@ have breakfast | nonushta qilmoq | /hæv ˈbrɛkfəst/
@@ go to work | ishga bormoq | /ɡoʊ tuː wɜːrk/
@@ study | o'qimoq, o'rganmoq | /ˈstʌdi/
@@ cook dinner | kechki ovqat tayyorlamoq | /kʊk ˈdɪnər/
@@ go to bed | uxlashga yotmoq | /ɡoʊ tuː bɛd/
@@ every day | har kuni | /ˈɛvri deɪ/
~~~ex
A: What time do you wake up? (Siz soat nechida uyg'onasiz?)
B: I wake up at six thirty every day. (Men har kuni olti yarimda uyg'onaman.)
A: Does your sister study English? (Singlingiz ingliz tilini o'rganadimi?)
B: Yes, she studies English every evening. (Ha, u har kecha ingliz tilini o'rganadi.)
~~~

=== a1.4 | Artikllar, ko'plik va sonlar | 10
## Artikllar: a, an, the
**a** va **an** — noaniq artikllar, birinchi marta aytilayotgan yoki umumiy narsani bildiradi. **a** undosh tovush bilan boshlanadigan so'zdan oldin, **an** esa unli tovush bilan boshlanadigan so'zdan oldin keladi: {{a book}}, {{an apple}}, {{an hour}} (h talaffuz qilinmaydi!).
**the** — aniq artikl, allaqachon ma'lum bo'lgan yoki yagona narsani bildiradi: {{The sun is hot.}} {{I bought a book. The book is interesting.}} (ikkinchi gapda kitob allaqachon ma'lum)
## Ko'plik son (Plural nouns)
Ko'pchilik otlar **-s** qo'shish orqali ko'plikka o'tadi: book→books, car→cars. -s, -x, -ch, -sh bilan tugasa **-es** qo'shiladi: box→boxes, watch→watches. -y oldidan undosh bo'lsa y→ies: city→cities.
! Noto'g'ri (irregular) ko'pliklar yodlanishi kerak: man→men, woman→women, child→children, person→people, foot→feet, tooth→teeth, mouse→mice.
## There is / There are
Biror narsaning mavjudligini aytish uchun: birlik uchun **there is**, ko'plik uchun **there are** ishlatiladi: {{There is a cat on the sofa.}} {{There are three books on the table.}}

## Past Simple qachon ishlatiladi?
Tugallangan, o'tmishda aniq bir vaqtda sodir bo'lgan harakatlarni ifodalash uchun ishlatiladi: {{I visited my grandmother last weekend.}}
## To be fe'lining o'tgan zamoni
|Hozirgi|O'tgan|
|---|---|
|am / is|was|
|are|were|

## Muntazam va nomuntazam fe'llar
Muntazam (regular) fe'llarga **-ed** qo'shiladi: work→worked, play→played, study→studied. Nomuntazam (irregular) fe'llar alohida shaklga ega va yodlanishi kerak:

|go|went|bormoq|

!! Nomuntazam fe'llar ro'yxati juda katta (deyarli 200 ta) — ularni guruhlab, har kuni ozgina-ozgina yodlash eng samarali usul.
## Inkor va savol
Inkor va savolda **did/didn't** ishlatiladi, asosiy fe'l esa o'z holiga (infinitivga) qaytadi: {{I didn't go to the party.}} {{Did you see that movie?}}

## Sifatlarning qiyoslash darajalari
Bir bo'g'inli sifatlarga **-er** (comparative) va **-est** (superlative) qo'shiladi: tall→taller→the tallest. Ikki va undan ko'p bo'g'inli sifatlar bilan **more/the most** ishlatiladi: beautiful→more beautiful→the most beautiful.
|Sifat|Comparative|Superlative|
|---|---|---|
|big|bigger|the biggest|
|good|better|the best|
|bad|worse|the worst|
|far|farther/further|the farthest/furthest|
!! "good" va "bad" nomuntazam — ularni alohida yodlang: good→better→best, bad→worse→worst.
## Taqqoslash qurilmalari
Teng darajani bildirish uchun **as...as** ishlatiladi: {{She is as tall as her brother.}} Qiyoslashda **than** ishlatiladi: {{This book is more interesting than that one.}}
## Asosiy predloglar: in, on, at

|on|kun/sana (on Monday)|sirt (on the table)|
|in|oy/yil/fasl (in May, in 2024)|ichida (in the room, in London)|

@@ as...as | xuddi...kabi | /æz æz/

##### m2 | Intermediate (B1) | 🟠 | Present Perfect, modal fe'llar, shart gaplar

## Present Perfect nima uchun kerak?
**have/has + Past Participle (V3)** — o'tmishda bo'lgan, lekin hozirgi vaqtga bog'liq yoki aniq vaqti muhim bo'lmagan harakatlarni ifodalaydi: {{I have visited London three times.}} (qachon muhim emas — tajriba muhim)
## Present Perfect vs Past Simple
Eng ko'p xato qilinadigan joy shu — ikkisining farqini tushunish juda muhim:
|Present Perfect|Past Simple|
|---|---|
|Aniq vaqt ko'rsatilmaydi: "I have been to Paris."|Aniq vaqt ko'rsatiladi: "I went to Paris in 2019."|
|Hozirgi natijaga bog'liq: "I have lost my keys" (hozir yo'q)|Faqat o'tmishdagi fakt: "I lost my keys yesterday, but I found them later."|
## Yordamchi so'zlar
@@ ever | hech qachon (savolda) | /ˈɛvər/
@@ never | hech qachon (inkor) | /ˈnɛvər/
@@ just | hozirgina | /dʒʌst/
@@ already | allaqachon | /ɔːlˈrɛdi/
@@ yet | hali (inkor/savolda) | /jɛt/
@@ since | -dan beri (aniq nuqtadan) | /sɪns/
@@ for | davomida (davr uchun) | /fɔːr/
! "since" aniq boshlanish nuqtasi bilan ishlatiladi (since 2020, since Monday), "for" esa davomiylik bilan (for three years, for a long time).
~~~ex
A: Have you ever been to Japan? (Siz Yaponiyada bo'lganmisiz?)
B: No, I haven't, but I have visited Korea. (Yo'q, bo'lmaganman, lekin Koreyada bo'lganman.)
A: Has she finished her homework yet? (U uyga vazifasini tugatdimi hali?)
B: Yes, she has just finished it. (Ha, u uni hozirgina tugatdi.)
~~~

## Majburiyat: must va have to
**must** — ichki ishonch yoki qoida (ko'pincha gapiruvchining o'z fikri): {{I must study harder.}} **have to** — tashqi qoida/majburiyat: {{I have to wear a uniform at school.}} (bu maktab qoidasi, mening fikrim emas)
## Majburiyat yo'qligi va taqiq

## Maslahat va imkoniyat
**should/shouldn't** — maslahat: {{You should see a doctor.}} **can/could** — imkoniyat/qobiliyat: {{I can swim.}} **may/might** — ehtimollik: {{It may rain later.}}

## Zero Conditional — umumiy haqiqatlar
Har doim to'g'ri bo'lgan qoidalar/tabiat qonunlari uchun: **If + Present Simple, Present Simple**: {{If you heat ice, it melts.}} (bu har doim rost)
## First Conditional — real kelajak ehtimoli
Kelajakda real sodir bo'lishi mumkin bo'lgan holatlar uchun: **If + Present Simple, will + infinitiv**: {{If it rains tomorrow, we will stay at home.}}
!! If-bandida hech qachon "will" ishlatilmaydi — faqat Present Simple: "If it will rain" — XATO. To'g'risi: "If it rains".
## Unless — "agar...bo'lmasa"
**unless** = "if not": {{Unless you study, you won't pass the exam.}} = {{If you don't study, you won't pass the exam.}}

@@ boil | qaynamoq | /bɔɪl/
@@ unless | agar...bo'lmasa | /ənˈlɛs/

B: If I pass, I will celebrate with my friends. (Agar o'tsam, do'stlarim bilan nishonlayman.)
~~~

##### m3 | Upper-Intermediate (B2) | 🔵 | 2/3-shart gaplar, majhul nisbat, ko'chirma gap
=== b2.1 | Shart gaplar: Second va Third Conditional | 14
## Second Conditional — xayoliy hozirgi/kelajak
Hozirgi yoki kelajakdagi **real bo'lmagan/xayoliy** holatlar uchun: **If + Past Simple, would + infinitiv**: {{If I had a million dollars, I would travel around the world.}} (haqiqatda pulim yo'q)

## Third Conditional — xayoliy o'tmish (pushaymonlik)
O'tmishda sodir bo'lmagan holat va uning xayoliy natijasi uchun: **If + Past Perfect, would have + Past Participle**: {{If I had studied harder, I would have passed the exam.}} (lekin men o'qimadim va imtihondan o'tmadim — bu pushaymonlik)

|3-tur|Past Perfect|would have + V3|O'tmishdagi xayol, pushaymonlik|
!! Mixed conditional ham mavjud: "If I had studied medicine (o'tmish), I would be a doctor now (hozir)" — o'tmishdagi shart, hozirgi natija.

##### m4 | Advanced (C1) | 🟣 | Ergash gaplar, akademik lug'at, phrasal verbs
=== c1.1 | Aniqlovchi ergash gaplar va inversiya | 14
## Relative clauses — who, which, that, whose, where
Otni aniqlashtirish uchun ishlatiladi: **who** (odam), **which** (narsa), **that** (odam yoki narsa, defining clausesda), **whose** (egalik), **where** (joy): {{The man who called you is my uncle.}} {{This is the house where I grew up.}}
Defining (zarur) va non-defining (qo'shimcha, vergul bilan ajratiladigan) clauselarni farqlash muhim: {{My brother, who lives in London, is a lawyer.}} (qo'shimcha ma'lumot — vergul bor, "that" ishlatilmaydi non-defining'da)
## Inversiya — ta'kid uchun
Rasmiy/adabiy uslubda ta'kid berish uchun gap boshiga salbiy/cheklovchi so'z chiqarilib, so'z tartibi o'zgaradi: {{Never have I seen such a beautiful sunset.}} {{Not only did she win the race, but she also broke the record.}} {{Rarely do we get such an opportunity.}}
! Inversiya C1-C2 darajadagi yozma va rasmiy nutqda ishlatiladi — oddiy suhbatda kamdan-kam qo'llaniladi, lekin IELTS Writing Task 2'da yuqori ball olish uchun juda foydali.
@@ nevertheless | shunga qaramay | /ˌnɛvərðəˈlɛs/
@@ whereas | holbuki | /wɛrˈæz/

## Akademik bog'lovchilar (Linking words)
Yuqori darajadagi yozma ishlarda fikrlarni bog'lash uchun quyidagi so'zlar juda muhim:
|Bog'lovchi|Vazifasi|Misol|
|---|---|---|
|however|qarama-qarshilik|The plan was good; however, it failed.|
|nevertheless|shunga qaramay|It was expensive. Nevertheless, we bought it.|
|furthermore / moreover|qo'shimcha dalil|The product is cheap. Furthermore, it is reliable.|
|consequently / therefore|natija|He didn't study. Consequently, he failed.|
|whereas / while|qarama-qarshi solishtirish|Some prefer tea, whereas others prefer coffee.|
|in spite of / despite|qarshilikka qaramay|Despite the rain, we went out.|
!! "despite" va "in spite of" dan keyin FE'L emas, OT yoki -ing shakli keladi: "Despite the rain" (to'g'ri), "Despite it rained" (XATO). Fe'l kerak bo'lsa "despite + -ing" ishlatiladi: "Despite losing, she stayed positive."
@@ furthermore | bundan tashqari | /ˈfɜːrðərmɔːr/
@@ consequently | natijada | /ˈkɑːnsəkwəntli/
@@ despite | -ga qaramay | /dɪˈspaɪt/
@quiz "___ the heavy traffic, we arrived on time." ::: Although ::: *Despite ::: Because ::: why="Despite" dan keyin ot keladi ("the heavy traffic"), "Although" dan keyin esa to'liq gap kerak bo'lardi.
@fib She failed the first attempt. ___, she didn't give up and tried again. (qarama-qarshilik) ::: a=however;nevertheless ::: hint=Ikkinchi gap birinchisiga qarama-qarshi natija ::: why="However/Nevertheless" — qarama-qarshilikni bildiruvchi bog'lovchilar.

##### m5 | Mastery (C2) | 🔴 | Subjunktiv, kollokatsiyalar, ilg'or uslub
=== c2.1 | Subjunktiv va nozik grammatik nuanslar | 14
## Subjunctive mood — rasmiy tilak va talab
Rasmiy iboralarda (talab, tavsiya, zarurat) fe'l shaxsga qarab o'zgarmaydi, infinitiv shaklda qoladi: {{It is essential that he arrive on time.}} (emas "arrives"!) {{The committee recommends that the policy be changed.}} (emas "is changed"!)
"Wish" bilan xayoliy hozirgi holat uchun **were** barcha shaxslar bilan ishlatiladi: {{I wish I were taller.}} {{If only she were here.}}
## Cleft sentences — ta'kid uchun qurilmalar
Gapning bir qismini alohida ta'kidlash uchun ishlatiladi: {{It was John who broke the window.}} (aybdor — John, boshqa hech kim emas) {{What I really need is a good night's sleep.}} (ta'kid — aynan shu narsaga ehtiyoj bor)
!! Bu qurilmalar C2 darajali "Native-like" uslubning belgisi — ularni suhbatda ehtiyotkorlik bilan, haqiqatan ta'kid kerak bo'lgan joyda ishlating, haddan tashqari ko'p ishlatilsa sun'iy eshitiladi.
@@ essential | zarur, muhim | /ɪˈsɛnʃəl/
@@ recommend | tavsiya qilmoq | /ˌrɛkəˈmɛnd/
@quiz "It is vital that she ___ informed immediately." (subjunctive) ::: is ::: *be ::: was ::: why=Subjunctive mood'da fe'l infinitiv (base form) holida qoladi — "be", "is" emas.
@fib What I need ___ a bit more time to finish this. (cleft sentence, ta'kid) ::: a=is ::: hint="What I need is..." qurilmasi ::: why="What I need is" — ta'kidlovchi cleft sentence qurilmasi.

=== c2.2 | Native darajadagi kollokatsiyalar va registr | 12
## Kollokatsiyalar (Collocations)
Native speakerlar ba'zi so'zlarni doim birga ishlatadi — bu tabiiylikning kalitidir: {{make a decision}} (emas "do a decision"), {{heavy rain}} (emas "strong rain"), {{strong coffee}} (emas "heavy coffee"), {{pay attention}} (emas "give attention").
|To'g'ri kollokatsiya|Noto'g'ri (keng xato)|
|---|---|
|make a mistake|do a mistake|
|take a decision/make a decision|make a decision — ikkisi ham to'g'ri (BrE/AmE farqi)|
|heavy traffic|strong traffic|
|raise awareness|rise awareness|
## Registr (formal vs informal)
Bir xil ma'noni holatga qarab turlicha ifodalash — bu C2 darajaning muhim belgisi:
|Formal|Informal|Ma'nosi|
|---|---|---|
|purchase|buy / get|sotib olmoq|
|commence|start / begin|boshlamoq|
|children|kids|bolalar|
|I would be grateful if...|Can you please...|iltimos qilmoq|
! So'z tanlashdagi nozik farqlar: "big" (neytral), "large" (formalroq, o'lcham uchun), "huge/enormous" (juda katta, ta'kidli), "massive" (norasmiy, kuchli ta'kid). Har biri bir xil tarjima qilinsa ham, kontekstga mos tanlash kerak.
@quiz Qaysi variant to'g'ri kollokatsiya? ::: do a mistake ::: *make a mistake ::: have a mistake ::: why="Make a mistake" — standart to'g'ri kollokatsiya.
@fib I would be most ___ if you could send me the report by Friday. (rasmiy iltimos) ::: a=grateful ::: hint="Minnatdor bo'lardim" ma'nosidagi rasmiy so'z ::: why="I would be grateful if..." — rasmiy, hurmatli iltimos qurilmasi.

=== c2.3 | Ilg'or yozma uslub | 12
## Gap tuzilishini xilma-xillashtirish
Native-level yozishning belgisi — bir xil qurilmani takrorlamaslik. Qisqa va uzun gaplarni, oddiy va murakkab (relative clause, inversion, participle clause) gaplarni aralashtirib ishlatish matnni jonli qiladi.
## Hedging language — ehtiyotkor fikr bildirish
Akademik va rasmiy matnlarda qattiq da'volardan ko'ra ehtiyotkor, bosqichma-bosqich fikr bildirish afzal ko'riladi: {{It could be argued that...}} {{This may suggest that...}} {{It is widely believed that...}} {{To some extent, this is true.}}
!! "Hech qachon" yoki "doim" kabi keskin so'zlardan (always, never, all, everyone) akademik yozishda ehtiyot bo'ling — ular dalilsiz da'vo sifatida qabul qilinishi mumkin. "Many", "most", "tend to" kabi yumshoqroq so'zlar ishonchliroq eshitiladi.
~~~essay Band 9 uslubidagi paragraf namunasi
It could be argued that technology has fundamentally reshaped the way people communicate. While some may contend that face-to-face interaction has been devalued as a result, it would be an oversimplification to view this shift purely in negative terms. Rather, digital communication has, to a considerable extent, complemented traditional methods, enabling connections that would otherwise have been impossible across vast distances.
~~~
@quiz Akademik matnda qaysi ibora ko'proq ishonchli ko'rinadi? ::: Everyone thinks that... ::: *It is widely believed that... ::: I know that... ::: why="It is widely believed that" — hedging, ehtiyotkor va ob'ektiv ohang.

##### ielts | IELTS 9 ball — tayyorlov moduli | 🎓 | Listening, Reading, Writing, Speaking — band 9 strategiyalari
=== ielts.1 | IELTS haqida va baho mezonlari | 12
## IELTS nima va nega band 9?
IELTS (International English Language Testing System) 4 qismdan iborat: **Listening, Reading, Writing, Speaking**. Har biri 1 dan 9 ballgacha baholanadi, umumiy ball 4 qismning o'rtacha qiymati (yaxlitlangan holda). **Band 9** — "Expert user" darajasi, ya'ni til bilimi to'liq, erkin va aniq, faqat juda kamdan-kam, tasodifiy noaniqliklar bo'lishi mumkin.
## Academic vs General Training
**Academic** modul universitetga kirish uchun (Listening va Speaking ikkisida bir xil, Reading va Writing farq qiladi — Academic'da ilmiy matnlar/grafiklar bo'ladi). **General Training** ko'chish/ish uchun (Reading'da kundalik matnlar, Writing Task 1'da xat yozish bo'ladi).
|Qism|Vaqt|Vazifalar soni|
|---|---|---|
|Listening|~30 daqiqa|4 bo'lim, 40 savol|
|Reading|60 daqiqa|3 matn, 40 savol|
|Writing|60 daqiqa|Task 1 (20 daqiqa) + Task 2 (40 daqiqa)|
|Speaking|11-14 daqiqa|3 qism (shaxsiy intervyu formatida)|
## Band 9 mezonlari — umumiy tasavvur
Har bir qismda baholovchilar quyidagilarga e'tibor beradi: **Fluency & Coherence** (ravonlik va mantiqiy bog'lanish), **Lexical Resource** (lug'at boyligi), **Grammatical Range & Accuracy** (grammatik xilma-xillik va to'g'rilik), **Pronunciation** (Speaking uchun talaffuz) yoki **Task Achievement/Response** (Writing uchun vazifani to'liq bajarish).
! Band 9 olish uchun "mukammal" bo'lish shart emas — kichik, tabiiy xatolar bo'lishi mumkin, lekin ular til bilimiga umuman ta'sir qilmasligi kerak. Asosiysi — fikrni erkin, aniq va boy til vositalari bilan ifodalash.
@quiz IELTS Academic va General Training qaysi qismlarda farq qiladi? ::: Listening va Speaking ::: *Reading va Writing ::: Faqat Writing ::: why=Listening va Speaking ikki modulda bir xil, Reading va Writing farq qiladi.
@quiz Band 9 darajasi qanday ataladi? ::: Good user ::: Competent user ::: *Expert user ::: why=9-band rasmiy ravishda "Expert user" deb ataladi.

=== ielts.2 | Listening va Reading strategiyalari | 14
## Listening strategiyalari
Listening 4 bo'limdan iborat, qiyinlashib boradi. Asosiy maslahatlar: **savollarni oldindan o'qish** (audio boshlanishidan oldin 30-60 soniya beriladi), **kalit so'zlarni (keywords) belgilash**, **sinonimlarga tayyor bo'lish** (audio'da savoldagi so'zning sinonimi aytiladi, aynan o'zi emas), va **raqam/sana/ism yozishda imlo xatolariga yo'l qo'ymaslik** (bitta imlo xatosi javobni noto'g'ri qiladi).
|Savol turi|Strategiya|
|---|---|
|Multiple choice|Barcha variantlarni oldindan o'qing, noto'g'rilarni eliminatsiya qiling|
|Form/note completion|So'z turi (ot/fe'l/son)ni oldindan taxmin qiling, grammatik mosligini tekshiring|
|Map/diagram labelling|Yo'nalish so'zlariga (left, next to, opposite) e'tibor bering|
## Reading strategiyalari
Reading'da vaqt eng katta muammo — 60 daqiqada 3 uzun matn + 40 savol. **Skimming** (umumiy g'oyani tezda tushunish uchun diagonal o'qish) va **scanning** (aniq ma'lumot — sana, ism, raqamni tezda topish) texnikalarini farqlang.
!! "True/False/Not Given" savol turi eng ko'p xato qilinadigan joy: **False** — matnda aytilgan, lekin savolga zid; **Not Given** — matnda bu haqda umuman gap yo'q (False bilan aralashtirmang!).
@@ skim | diagonal (tezkor) o'qish | /skɪm/
@@ scan | kerakli ma'lumotni qidirib o'qish | /skæn/
@@ paraphrase | boshqacha so'z bilan aytish | /ˈpærəfreɪz/
@quiz Matnda umuman tilga olinmagan fikr haqidagi savolga qanday javob beriladi? ::: True ::: False ::: *Not Given ::: why="Not Given" — matnda bu haqda hech narsa aytilmagan holatda ishlatiladi.
@quiz Matnni tezda, asosiy g'oyasini tushunish uchun diagonal o'qish qanday ataladi? ::: Scanning ::: *Skimming ::: Scoring ::: why="Skimming" — umumiy mazmunni tez tushunish texnikasi.

=== ielts.3 | Writing Task 1 (Academic va General) | 16
## Academic Task 1 — grafik/jadval/diagramma tasvirlash
Vazifa: berilgan grafik, jadval, diagramma yoki jarayonni **o'z so'zlaringiz bilan** tasvirlab berish (kamida 150 so'z, 20 daqiqa). Tuzilma: 1) Kirish (ma'lumotni qayta ifodalash), 2) Umumiy ko'rinish (overview — eng muhim 2-3 tendensiya), 3-4) Tafsilotlar (aniq raqamlar bilan).
!! Overview paragrafi band 7+ uchun MAJBURIY — bu barcha ma'lumotlarning eng muhim umumiy tendensiyasini (ortish/kamayish/eng yuqori-past nuqta) alohida, raqamlarsiz, qisqa jamlab beradi. Ko'p o'quvchilar buni unutib, to'g'ridan-to'g'ri tafsilotlarga o'tib ketadi — bu ballni pasaytiradi.
## Trend tasvirlash uchun akademik lug'at
@@ increase / rise | ortmoq | /ɪnˈkriːs raɪz/
@@ decrease / decline | kamaymoq | /dɪˈkriːs dɪˈklaɪn/
@@ fluctuate | tebranib turmoq | /ˈflʌktʃueɪt/
@@ remain stable | barqaror qolmoq | /rɪˈmeɪn ˈsteɪbl/
@@ a sharp/dramatic rise | keskin ortish | /ə ʃɑːrp raɪz/
@@ a gradual/steady increase | sekin-asta ortish | /ə ˈɡrædʒuəl ɪnˈkriːs/
@@ peak at | eng yuqori nuqtaga yetmoq | /piːk æt/
## General Training Task 1 — xat yozish
Formal (notanish odamga/tashkilotga — shikoyat, so'rov), semi-formal (tanish, lekin do'st emas) yoki informal (yaqin do'st/oila) xat yoziladi. Har birining salomlashish va yakunlash uslubi farq qiladi: Formal — "Dear Sir/Madam, ... Yours faithfully,"; Informal — "Hi Tom, ... See you soon, [Ism]".
~~~essay Band 9 namunasi — Academic Task 1 overview paragrafi
The line graph illustrates the number of visitors to three different museums in a European city between 2010 and 2020. Overall, it is clear that Museum A experienced the most significant growth over the period, while Museum C saw a gradual decline. Museum B's visitor numbers remained relatively stable throughout, fluctuating only slightly around the 50,000 mark.
~~~
@quiz Academic Task 1'da band 7+ uchun majburiy qism nima? ::: Xulosa ::: *Overview (umumiy ko'rinish) paragrafi ::: Shaxsiy fikr ::: why=Overview paragrafi tendensiyalarni jamlab beradi va yuqori ball uchun shart.
@fib The number of users ___ ___ ___ from 2015 to 2018, before falling sharply. (sekin-asta ortgan) ::: a=increased gradually;gradually increased ::: hint=Ikki so'zdan iborat, "sekin-asta ortgan" ma'nosida ::: why="increased gradually" — sekin-asta o'sishni bildiruvchi akademik ibora.

=== ielts.4 | Writing Task 2 (Essay) | 16
## Insho turlari
Task 2 — 250+ so'zli insho (40 daqiqa), umumiy ballga Task 1'dan ko'ra ikki hissa ko'proq ta'sir qiladi. Asosiy turlari: **Opinion** (fikringizni bildiring, to agree or disagree), **Discussion** (ikki tomonning fikrini muhokama qilish), **Advantages/Disadvantages**, **Problem/Solution**.
## Band 9 struktura
|Paragraf|Mazmuni|
|---|---|
|1. Kirish|Mavzuni qayta ifodalash (paraphrase) + thesis statement (o'z pozitsiyangiz)|
|2. Asosiy band 1|Bitta asosiy fikr + izoh + aniq misol|
|3. Asosiy band 2|Ikkinchi asosiy fikr + izoh + aniq misol|
|4. Xulosa|Asosiy fikrlarni qisqa jamlash, pozitsiyani qayta tasdiqlash|
!! Har bir asosiy paragraf FAQAT BITTA asosiy fikrga bag'ishlanishi kerak va u aniq, haqiqiy misol bilan tasdiqlanishi kerak — umumiy, mavhum gaplar (masalan "technology is important") band pasaytiradi, aniqlik band oshiradi.
@@ thesis statement | asosiy fikr bayoni | /ˈθiːsɪs ˈsteɪtmənt/
@@ to a certain extent | ma'lum darajada | /tuː ə ˈsɜːrtən ɪkˈstɛnt/
@@ on the other hand | boshqa tomondan | /ɑːn ðiː ˈʌðər hænd/
~~~essay Band 9 namunasi — Task 2 kirish paragrafi
Topic: "Some people believe that technology has made our lives more complicated, while others think it has simplified daily tasks. Discuss both views and give your opinion."

While it is undeniable that modern technology has introduced new sources of stress and complexity into daily life, I would argue that, on balance, its capacity to simplify everyday tasks far outweighs these drawbacks. This essay will examine both perspectives before explaining why I lean towards the latter view.
~~~
@quiz Task 2'da har bir asosiy paragraf nechta asosiy fikrga bag'ishlanishi kerak? ::: 2-3 ta ::: *Faqat 1 ta ::: Imkon qadar ko'p ::: why=Har bir paragraf bitta fikrga chuqur to'xtalishi, tarqoq bo'lmasligi kerak.
@fib The introduction should include a clear ___ ___ that states the writer's position. ::: a=thesis statement ::: hint=Kirish paragrafidagi asosiy pozitsiya bayoni ::: why="Thesis statement" — yozuvchining asosiy pozitsiyasini bildiruvchi jumla.

=== ielts.5 | Speaking: Part 1, 2, 3 va baho mezonlari | 14
## Part 1 — Shaxsiy savollar (4-5 daqiqa)
Tanish mavzular (ish, oila, sevimli mashg'ulotlar) haqida qisqa savollar. Strategiya: javobni 2-3 gapgacha kengaytiring, faqat "yes/no" bilan to'xtamang: {{"Do you like reading?" → "Yes, I really do. I especially enjoy science fiction novels because they let me imagine completely different worlds."}}
## Part 2 — Cue Card (3-4 daqiqa)
Sizga mavzu kartasi beriladi, 1 daqiqa tayyorlanish vaqti (qog'azga eslatma yozish mumkin), so'ng 1-2 daqiqa davomida to'xtovsiz gapirish kerak. Struktura: nima/kim/qayer/qachon — so'ng NEGA bu muhim yoki qanday his-tuyg'u uyg'otgani (bu band oshiradi).
@cue Describe a place you would like to visit in the future ::: What the place is and where it is ::: How you know about this place ::: What you would do there ::: Explain why you want to visit this particular place
## Part 3 — Mavhum muhokama (4-5 daqiqa)
Part 2 mavzusiga bog'liq, lekin kengroq, mavhumroq savollar (jamiyat, tendensiyalar haqida fikr): {{"Why do you think people like to travel to new places?"}} Bu yerda chuqur, tahliliy fikr bildirish, turli nuqtai nazarlarni ko'rib chiqish kerak (masalan "On the one hand... on the other hand...").
## Band 9 mezonlari — Speaking
|Mezon|Band 9 talabi|
|---|---|
|Fluency & Coherence|To'xtovsiz, tabiiy nutq, mantiqiy bog'lovchilar bilan|
|Lexical Resource|Boy, tabiiy, idiomatik lug'at, kam takrorlanish|
|Grammatical Range|Murakkab gap qurilmalari, kamdan-kam, tizimsiz xatolar|
|Pronunciation|Tabiiy urg'u va ohang, tushunishga to'sqinlik qilmaydigan talaffuz|
! Eng muhim maslahat: savolni to'g'ridan-to'g'ri takrorlamang, "filler" so'zlardan (um, like) haddan tashqari ko'p foydalanmang, va javobni doim kichik misol/shaxsiy tajriba bilan boyiting — bu Fluency va Lexical Resource bahosini sezilarli oshiradi.
@quiz Part 2'da nechta daqiqa tayyorlanish vaqti beriladi? ::: 2 daqiqa ::: *1 daqiqa ::: Tayyorlanish vaqti yo'q ::: why=Part 2'da cue card berilgandan keyin 1 daqiqa tayyorgarlik vaqti beriladi.
@quiz Part 3 savollari qanday xususiyatga ega? ::: Faqat shaxsiy ::: *Mavhumroq va tahliliy ::: Faqat ha/yo'q ::: why=Part 3 — jamiyat va tendensiyalar haqida chuqurroq, tahliliy muhokama talab qiladi.

## Rus tilida ot jinsi (род)
Rus tilidagi har bir ot uchta jinsdan biriga tegishli: **erkak (мужской)**, **ayol (женский)** yoki **o'rta (средний)**. Jins otning oxirgi harfiga qarab aniqlanadi:
|Jins|Oxiri|Misollar|
|---|---|---|
|Мужской (erkak)|undosh yoki -й|стол (stol), музей (muzey)|
|Женский (ayol)|-а / -я|книга (kitob), земля (yer)|
|Средний (o'rta)|-о / -е|окно (deraza), море (dengiz)|
! "ь" bilan tugaydigan otlar har xil jinsga tegishli bo'lishi mumkin (дверь — ayol, день — erkak) — bunday otlarning jinsini alohida yodlash kerak.
## Shaxs olmoshlari (3-shaxs) va jins
Narsa/hodisalarni almashtirish uchun jinsga mos olmosh ishlatiladi: **он** (u — erkak jins uchun), **она** (u — ayol jins uchun), **оно** (u — o'rta jins uchun), **они** (ular — ko'plik).
@@ стол | stol | /stol/
@@ книга | kitob | /ˈknʲiɡə/
@@ окно | deraza | /ɐkˈno/
@@ дом | uy | /dom/
@@ дверь | eshik | /dvʲerʲ/
@@ стул | stul | /stul/

O'zbek va ingliz tilidan farqli o'laroq, rus tilida hozirgi zamonda "быть" (bo'lmoq) fe'li ishlatilmaydi: {{Я студент.}} (so'zma-so'z: "Men talaba" — "man" so'zi tushirilgan, lekin ma'nosi "Men talabaman").

## Винительный падеж (Tushum/Vinitelny kelishigi) — to'g'ridan-to'g'ri to'ldiruvchi
Harakatning to'g'ridan-to'g'ri ta'sir etuvchi ob'ektini bildiradi (kimni? nimani?): {{Я читаю книгу.}} (Men kitobni o'qiyapman.) Jonsiz otlarda ko'pincha Nominativ bilan bir xil shaklda qoladi, lekin jonli (animate) erkak jinsdagi otlarda -a/-я qo'shiladi: {{Я вижу брата.}} (Men akamni ko'raman.)
|Jins|Nominativ|Винительный|
|---|---|---|
|Ayol (-а)|книга|книгу|
|Erkak (jonsiz)|стол|стол (o'zgarmaydi)|
|Erkak (jonli)|брат|брата|
## Предложный падеж (Predlog kelishigi) — "qayerda?" savoli
**в** yoki **на** predloglari bilan birga "qayerda?" degan savolga javob beradi: {{Я живу в Ташкенте.}} (Men Toshkentda yashayman.) {{Книга на столе.}} (Kitob stolda.) Ko'pchilik otlarda -е qo'shimchasi qo'shiladi: Москва→в Москве, стол→на столе.
!! "в" yopiq joy/hudud uchun ("в доме", "в городе"), "на" sirt/ochiq joy uchun ("на столе", "на улице") ishlatiladi — bu farqni har bir so'z bilan alohida eslab qolish kerak.

@@ любить | yaxshi ko'rmoq | /lʲʊˈbʲitʲ/
@@ жить | yashamoq | /ʐɨtʲ/
@@ улица | ko'cha | /ˈulʲɪtsə/

=== r2.2 | O'tgan zamon va fe'l aspekti (kirish) | 14
## O'tgan zamon shakllanishi
Rus tilida o'tgan zamon shaxsga qarab emas, **jinsga va songa** qarab o'zgaradi: infinitivdagi -ть o'rniga -л/-ла/-ло/-ли qo'shiladi.
|Jins/son|Qo'shimcha|Misol (читать)|
|---|---|---|
|Erkak (он)|-л|читал|
|Ayol (она)|-ла|читала|
|O'rta (оно)|-ло|читало|
|Ko'plik (они, мы, вы)|-ли|читали|
## Fe'l aspekti: совершенный va несовершенный
Rus tilining eng murakkab, lekin eng muhim xususiyati — har bir fe'lning ikki shakli (aspekti) bor: **несовершенный вид** (tugallanmagan — jarayon, takrorlanish) va **совершенный вид** (tugallangan — natija, bir martalik harakat): {{Я читал книгу вчера.}} (Men kitobni o'qidim/o'qiyotgandim — jarayon muhim) vs {{Я прочитал книгу.}} (Men kitobni oxirigacha o'qib tugatdim — natija muhim).
! Ko'pincha совершенный fe'l prefiks qo'shish orqali yasaladi: читать→прочитать, писать→написать, делать→сделать. Lekin har doim shunday emas — ba'zilarida fe'lning o'zi butunlay o'zgaradi (говорить→сказать).
@@ вчера | kecha | /ftʃɪˈra/
@@ уже | allaqachon | /ʊˈʐe/
@@ сделать | qilib bo'lmoq (tugallangan) | /ˈzdʲelətʲ/
@quiz "Я ___ домашнее задание." (natija muhim — tugatdim) ::: делал ::: *сделал ::: делаю ::: why="Сделал" — tugallangan aspekt, natijaga urg'u.
@fib Вчера она ___ (читать, jarayon, o'qiyotgan edi) письмо, когда я пришёл. ::: a=читала ::: hint=Ayol jinsi, jarayon — tugallanmagan aspekt ::: why="Читала" — jarayonni bildiruvchi несовершенный aspekt, ayol jinsi uchun -ла.

Harakat qaratilgan shaxs/narsani bildiradi, zarurat va yosh ifodalashda ishlatiladi: {{Я дал книгу другу.}} (Men kitobni do'stimga berdim.) {{Мне нужно идти.}} (Menga ketish kerak.) {{Ему двадцать лет.}} (Unga yigirma yosh.)

=== r3.3 | Harakat fe'llari: идти/ходить, ехать/ездить | 14
## Bir yo'nalishli va ko'p yo'nalishli harakat fe'llari
Rus tilida piyoda yurishni bildiruvchi fe'llarning ikki turi bor: **идти** — bir marta, bir yo'nalishda borish (hozir ketayotgan): {{Я иду в школу.}} (Men hozir maktabga ketayapman.) **ходить** — takroriy, bir necha marta, yo'nalishi muhim bo'lmagan harakat: {{Я хожу в школу каждый день.}} (Men har kuni maktabga boraman.)
Transport bilan borish uchun xuddi shu farq: **ехать** (bir marta, hozir) vs **ездить** (takroriy).
|Fe'l|Turi|Misol|
|---|---|---|
|идти|bir marta, piyoda|Сейчас я иду домой.|
|ходить|takroriy, piyoda|Я хожу в спортзал по понедельникам.|
|ехать|bir marta, transportda|Мы едем на море.|
|ездить|takroriy, transportda|Он ездит на работу на машине.|
! Prefiks qo'shish orqali yo'nalishni aniqlashtirish mumkin: при- (kelish) — приходить/приехать, у- (ketish) — уходить/уехать. Bu C1 darajasida chuqurroq o'rganiladi.

@@ каждый день | har kuni | /ˈkaʐdɨj dʲenʲ/

!! Sifatni to'g'ri qo'llash uchun avval otning jinsi va kelishigini aniqlang, so'ngra sifatga mos qo'shimchani tanlang — bu ikki bosqichli jarayon mashq orqali avtomatlashadi.

=== r4.2 | Buyruq va shart mayli | 12
## Buyruq mayli (Повелительное наклонение)
Buyruq/iltimos bildirish uchun fe'lning hozirgi zamon negizidan yasaladi: читать→читай! (sen), читайте! (siz/sizlar). Yumshoq undosh bilan tugasa -ь qo'shiladi: встать→встань!
## Shart mayli — бы bilan
Xayoliy/shartli holatni bildirish uchun fe'lning o'tgan zamon shakli + **бы** zarrachasi ishlatiladi (shaxsga qarab o'zgarmaydi!): {{Я хотел бы поехать в Москву.}} (Men Moskvaga borishni istardim.) {{Если бы у меня было время, я бы пришёл.}} (Agar vaqtim bo'lsa, kelardim.)
! "хотел бы" — "хочу" ning yumshoq, hurmatli shakli, so'rov va takliflarda juda ko'p ishlatiladi (ingliz tilidagi "would like" ga o'xshash).
@@ пожалуйста | iltimos | /pɐˈʐaɫʊstə/
@@ если бы | agar...bo'lsa (xayoliy) | /ˈjeslʲɪ bɨ/
@quiz "Я ___ бы помочь тебе." (istardim — hurmatli shakl) ::: хочу ::: *хотел ::: хотели ::: why="Хотел бы" — shart mayli, "istardim" ma'nosidagi hurmatli ibora.

## который — "qaysi/kim/nima" (aniqlovchi ergash gap)
Otni aniqlashtirish uchun ishlatiladi va aniqlanayotgan otning jinsi/soniga, lekin o'zining gapdagi vazifasiga mos kelishikka ega bo'ladi: {{Это книга, которую я читаю.}} (Bu — men o'qiyotgan kitob.) "Которую" — ayol jins (книга), Винительный (читаю nimani? — которую).
## чтобы — maqsad ergash gap
"Uchun, maqsadida" ma'nosini bildiradi, infinitiv yoki o'tgan zamon bilan ishlatiladi: {{Я учу русский, чтобы работать в России.}} (Men rus tilini Rossiyada ishlash uchun o'rganaman.)
## если — shart ergash gap
Oddiy shart gaplarni bog'laydi: {{Если у тебя есть время, позвони мне.}} (Agar vaqtың bo'lsa, menga qo'ng'iroq qil.)
@@ который | qaysi, -gan (aniqlovchi) | /kɐˈtorɨj/
@@ чтобы | -uchun, maqsadida | /ˈʂtobɨ/
@quiz "Девушка, ___ я видел вчера, очень красивая." (ayol jins, Винительный) ::: который ::: *которую ::: которая ::: why="Девушка" — ayol jins, "видел кого?" — Винительный, shuning uchun "которую".
@fib Я звоню тебе, ___ пригласить на день рождения. (maqsad) ::: a=чтобы ::: hint="Uchun, maqsadida" ma'nosidagi bog'lovchi ::: why="Чтобы" — maqsad ergash gapni bog'lovchi so'z.

##### m5 | Advanced (C1) | 🔴 | Registr, idiomalar, fe'l boshqaruvi
=== c1ru.1 | Rasmiy va norasmiy registr, idiomalar | 14
## Rasmiy va norasmiy lug'at
Rus tilida vaziyatga qarab so'z tanlash juda muhim — bir xil ma'noni ifodalovchi rasmiy va norasmiy so'zlar farqlanadi:
|Rasmiy|Norasmiy|Ma'nosi|
|---|---|---|
|извините|сорян (jargon)|kechirasiz|
|я хотел бы...|я хочу...|men xohlardim/xohlayman|
|благодарю вас|спасибо большое|katta rahmat|
|приобрести|купить|sotib olmoq|
## Keng tarqalgan idiomalar
@@ вешать лапшу на уши | yolg'on gapirmoq (qulog'iga makaron osmoq) | /ˈvʲeʂətʲ ɫɐpˈʂu nɐ ˈuʂɪ/
@@ бить баклуши | ishsiz o'tirmoq, dang'illamoq | /bʲitʲ bɐˈkɫuʂɪ/
@@ зарубить на носу | yaxshi eslab qolmoq | /zərʊˈbʲitʲ nɐ nɐˈsu/
! Idiomalarni to'g'ridan-to'g'ri tarjima qilish mumkin emas — ularning kontekstdagi ma'nosini tushunib, tabiiy nutqda tanish bo'lgan joylarda ishlatish kerak.
## Aspekt nuanslari matnda
Murakkab matnlarda совершенный/несовершенный aspekt tanlovi ko'pincha yozuvchining urg'usiga bog'liq: {{Он писал письмо весь вечер.}} (jarayonga urg'u — kechasi davomida yozgan) vs {{Он написал письмо и пошёл спать.}} (ketma-ket harakatlar ketma-ketligida — tugallangan harakat).
@quiz "Бить баклуши" iborasining ma'nosi nima? ::: Mehnat qilmoq ::: *Ishsiz, bekor o'tirmoq ::: Jahl qilmoq ::: why="Бить баклуши" — "ishsiz, bekorchilikda o'tirmoq" degan idioma.
@fib Не верь ему, он вешает тебе ___ ___ ___. (yolg'on gapiryapti, idioma) ::: a=лапшу на уши ::: hint="Qulog'iga makaron osmoq" idiomasi ::: why="Вешать лапшу на уши" — yolg'on gapirish, aldashni bildiruvchi idioma.

=== c1ru.2 | Fe'l boshqaruvi va matn tahlili | 14
## Глагольное управление — fe'l boshqaruvi
Har bir rus fe'li ma'lum bir kelishikni "talab qiladi" — bu "fe'l boshqaruvi" deyiladi va ko'pincha ona tili bilan to'g'ridan-to'g'ri mos kelmaydi, shuning uchun har bir fe'lni o'z boshqaruvi bilan birga yodlash kerak:
|Fe'l|Boshqaradigan kelishik|Misol|
|---|---|---|
|интересоваться (qiziqmoq)|Творительный|интересоваться музыкой|
|заниматься (shug'ullanmoq)|Творительный|заниматься спортом|
|ждать (kutmoq)|Родительный/Винительный|ждать друга|
|помогать (yordam bermoq)|Дательный|помогать другу|
!! "Помогать другу" (Дательный) — o'zbek tilida "do'stga yordam bermoq" bo'lsa ham, ba'zi fe'llarning boshqaruvi tillar orasida farq qiladi, shuning uchun har doim lug'atdan fe'lning qaysi kelishik bilan ishlatilishini tekshiring.
## Qisqa matn tahlili
~~~essay Namuna matn — fe'l boshqaruvini tahlil qiling
Моя сестра интересуется музыкой с детства. Каждый день она занимается вокалом и помогает младшему брату с домашним заданием. Вечером она ждёт звонка от своей подруги, чтобы обсудить планы на выходные.
~~~
Bu matnda: "интересуется **музыкой**" (Творительный), "занимается **вокалом**" (Творительный), "помогает **брату**" (Дательный), "ждёт **звонка**" (Родительный) — har bir fe'l o'z boshqaruvidagi kelishikni talab qilgan.
@quiz "Заниматься" fe'li qaysi kelishikni boshqaradi? ::: Винительный ::: *Творительный ::: Дательный ::: why="Заниматься спортом/музыкой" — Творительный kelishik bilan ishlatiladi.
@fib Я всегда помогаю ___ (мама, Дательный). ::: a=маме ::: hint="Помогать" fe'li Дательный kelishigini talab qiladi ::: why="Маме" — "мама" so'zining Дательный shakli.

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const SEP=/\s:::\s/;
const LS_KEY='it_shakh_lang_state_v1';

/* ---------- holat (localStorage) ---------- */
function loadState(){
  try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&typeof s==='object')return s;}catch(e){}
  return {};
}
function blankTrack(){return {done:{},quiz:{},fib:{},last:null};}
let STATE=loadState();
function trackFor(lang){if(!STATE[lang])STATE[lang]=blankTrack();return STATE[lang];}
function saveState(){try{localStorage.setItem(LS_KEY,JSON.stringify(STATE));}catch(e){}}

/* ---------- toast ---------- */
let toastT=0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- TTS (brauzer Web Speech API) ---------- */
let voicesReady=false;
if('speechSynthesis' in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged=()=>{voicesReady=true;};
}
function speak(text,lang){
  if(!text)return;
  if(!('speechSynthesis' in window)){toast('Brauzeringiz ovozli talaffuzni (TTS) qo\'llamaydi');return;}
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||'en-US';u.rate=0.9;u.pitch=1;
    const vs=window.speechSynthesis.getVoices();
    const v=vs.find(v=>v.lang===u.lang)||vs.find(v=>v.lang&&v.lang.slice(0,2)===u.lang.slice(0,2));
    if(v)u.voice=v;
    window.speechSynthesis.speak(u);
  }catch(e){toast('Ovoz ijro etilmadi');}
}

/* ---------- DSL parser ---------- */
function parseCourse(text){
  const lines=text.replace(/\r/g,'').split('\n');
  const mods=[];let mod=null,les=null,para=[],list=null,table=null,vocab=null,fence=null,fenceL=[],fenceTag='',qn=0,fn=0;
  const push=b=>{if(les)les.blocks.push(b);};
  const flush=()=>{
    if(para.length){push(['p',para.join(' ')]);para=[];}
    if(list){push([list.t,list.items]);list=null;}
    if(table){push(['table',table]);table=null;}
    if(vocab){push(['vocab',vocab]);vocab=null;}
  };
  for(let li=0;li<lines.length;li++){
    let ln=lines[li];
    if(fence){
      if(/^~~~\s*$/.test(ln)){push([fence,fenceTag,fenceL]);fence=null;fenceL=[];fenceTag='';}else fenceL.push(ln);continue;
    }
    const m5=/^#####\s+(.+)$/.exec(ln);
    if(m5){flush();const p=m5[1].split('|').map(s=>s.trim());mod={id:p[0],title:p[1],icon:p[2]||'📘',desc:p[3]||'',lessons:[]};mods.push(mod);les=null;continue;}
    const m3=/^===\s+(.+)$/.exec(ln);
    if(m3){flush();const p=m3[1].split('|').map(s=>s.trim());les={id:p[0],title:p[1],min:+p[2]||8,blocks:[],quiz:[],fib:[],mod:mod.id};qn=0;fn=0;mod.lessons.push(les);continue;}
    if(!les)continue;
    {const mf=/^~~~(ex|essay)(?:\s+(.*))?$/.exec(ln);if(mf){flush();fence=mf[1];fenceTag=mf[2]||'';fenceL=[];continue;}}
    let m;
    if((m=/^@quiz\s+(.+)$/.exec(ln))){
      const parts=m[1].split(SEP).map(s=>s.trim());const q={id:les.id+'.q'+(++qn),q:parts[0],opts:[],c:0,why:''};
      parts.slice(1).forEach(p=>{if(/^why=/.test(p))q.why=p.slice(4);else if(p[0]==='*'){q.c=q.opts.length;q.opts.push(p.slice(1).trim());}else q.opts.push(p);});
      {let r=[...q.id].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);const rnd=()=>{r=(r*1664525+1013904223)>>>0;return r/4294967296;};
       const arr=q.opts.map((o,i)=>({o,i}));for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
       q.opts=arr.map(x=>x.o);q.c=arr.findIndex(x=>x.i===q.c);}
      les.quiz.push(q);continue;
    }
    if((m=/^@fib\s+(.+)$/.exec(ln))){
      const parts=m[1].split(SEP).map(s=>s.trim());const f={id:les.id+'.f'+(++fn),s:parts[0],a:[],hint:'',why:''};
      parts.slice(1).forEach(p=>{
        if(/^a=/.test(p))f.a=p.slice(2).split(/\s*;;\s*/).map(x=>x.trim().toLowerCase());
        else if(/^hint=/.test(p))f.hint=p.slice(5);
        else if(/^why=/.test(p))f.why=p.slice(4);
      });
      push(['fib',f]);continue;
    }
    if((m=/^@cue\s+(.+)$/.exec(ln))){
      const parts=m[1].split(SEP).map(s=>s.trim());push(['cue',{topic:parts[0],bullets:parts.slice(1)}]);continue;
    }
    if(ln.trim()===''){flush();continue;}
    if((m=/^##\s+(.+)$/.exec(ln))){flush();push(['h',m[1]]);continue;}
    if((m=/^!!\s+(.+)$/.exec(ln))){flush();push(['warn',m[1]]);continue;}
    if((m=/^!\s+(.+)$/.exec(ln))){flush();push(['tip',m[1]]);continue;}
    if((m=/^~\s+(.+)$/.exec(ln))){flush();push(['note',m[1]]);continue;}
    if((m=/^@@\s*(.+)$/.exec(ln))){
      const p=m[1].split('|').map(s=>s.trim());if(!vocab)vocab=[];vocab.push({w:p[0],ipa:p[2]||'',tr:p[1]||''});continue;
    }
    if((m=/^-\s+(.+)$/.exec(ln))){if(para.length||table||(list&&list.t!=='ul'))flush();if(!list)list={t:'ul',items:[]};list.items.push(m[1]);continue;}
    if((m=/^\d+\.\s+(.+)$/.exec(ln))){if(para.length||table||(list&&list.t!=='ol'))flush();if(!list)list={t:'ol',items:[]};list.items.push(m[1]);continue;}
    if(/^\|/.test(ln)){if(para.length||list)flush();const cells=ln.replace(/^\||\|\s*$/g,'').split('|').map(s=>s.trim());if(cells.every(c=>/^-+$/.test(c)))continue;if(!table)table=[];table.push(cells);continue;}
    if(list||table||vocab)flush();
    para.push(ln.trim());
  }
  flush();
  return mods;
}

/* ---------- inline matn render ----------  **bold**  `code`  {{speak}} */
function inl(s,voice){
  let h=esc(s);
  h=h.replace(/\{\{(.+?)\}\}/g,(_,t)=>`<span class="spk" data-say="${esc(t)}" data-voice="${esc(voice||'')}"><span class="ic">🔊</span>${esc(t)}</span>`);
  h=h.replace(/`([^`]+)`/g,'<code>$1</code>');
  h=h.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  return h;
}

/* ---------- blok render ---------- */
function renderBlock(b,voice){
  switch(b[0]){
    case 'p':return '<p>'+inl(b[1],voice)+'</p>';
    case 'h':return '<h2>'+inl(b[1],voice)+'</h2>';
    case 'ul':return '<ul>'+b[1].map(x=>'<li>'+inl(x,voice)+'</li>').join('')+'</ul>';
    case 'ol':return '<ol>'+b[1].map(x=>'<li>'+inl(x,voice)+'</li>').join('')+'</ol>';
    case 'tip':return '<div class="co tip"><span class="ci">💡</span><div>'+inl(b[1],voice)+'</div></div>';
    case 'warn':return '<div class="co warn"><span class="ci">⚠️</span><div>'+inl(b[1],voice)+'</div></div>';
    case 'note':return '<div class="co note"><span class="ci">🧠</span><div>'+inl(b[1],voice)+'</div></div>';
    case 'table':{const t=b[1];return '<table><thead><tr>'+t[0].map(c=>'<th>'+inl(c,voice)+'</th>').join('')+'</tr></thead><tbody>'+t.slice(1).map(r=>'<tr>'+r.map(c=>'<td>'+inl(c,voice)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';}
    case 'vocab':return '<div class="vocab">'+b[1].map(v=>`<div class="vcard"><div class="vw"><b>${esc(v.w)}</b><button class="vspk" data-say="${esc(v.w)}" data-voice="${esc(voice||'')}" title="Tinglash">🔊</button></div>${v.ipa?'<div class="vipa">'+esc(v.ipa)+'</div>':''}<div class="vtr">${esc(v.tr)}</div></div>`).join('')+'</div>';
    case 'ex':return '<div class="exbox">'+b[2].filter(Boolean).map(l=>{const m=/^(\s*[\wА-Яа-яЁё]{1,2}):\s*(.+)$/.exec(l);if(m)return `<div class="exln"><b>${esc(m[1])}:</b><span class="spk" data-say="${esc(m[2].replace(/\s*\(.+?\)\s*$/,''))}" data-voice="${esc(voice||'')}"><span class="ic">🔊</span>${inl(m[2],voice)}</span></div>`;return `<div class="exln">${inl(l,voice)}</div>`;}).join('')+'</div>';
    case 'essay':{const tag=b[1]||'';const body=b[2].join('\n');return `<div class="essaybox">${tag?'<span class="etag">'+esc(tag)+'</span>\n':''}${esc(body)}</div>`;}
    case 'cue':return `<div class="cue"><h4>🗣 ${esc(b[1].topic)}</h4><ul>${b[1].bullets.map(x=>'<li>'+inl(x,voice)+'</li>').join('')}</ul></div>`;
    case 'fib':return renderFib(b[1]);
  }
  return '';
}
function renderFib(f){
  const done=cur&&trackFor(curLang).fib[f.id];
  const parts=f.s.split('___');
  let s=esc(parts[0]);
  for(let i=1;i<parts.length;i++)s+=`<input class="fin" data-f="${f.id}" data-i="${i-1}" ${done?'disabled value="'+esc(f.a[0]||'')+'"':''}>`+esc(parts[i]);
  return `<div class="fib" data-f="${f.id}"><div class="fs">${s}</div><div class="frow"><button class="chk" data-fcheck="${f.id}">✓ Tekshirish</button>${f.hint?'<button class="hintb" data-fhint="'+f.id+'">💡 Maslahat</button>':''}</div>${f.hint?'<div class="fw hint hidden" data-fh="'+f.id+'">💡 '+esc(f.hint)+'</div>':''}<div class="fw" data-fr="${f.id}">${done&&f.why?'✅ '+esc(f.why):''}</div></div>`;
}
function renderQuiz(q){
  const done=trackFor(curLang).quiz[q.id];
  return `<div class="qc" data-q="${q.id}"><div class="qq">${inl(q.q)}</div><div class="qo">${q.opts.map((o,i)=>`<button class="o ${done&&i===q.c?'good':''}" data-qi="${i}" ${done?'disabled':''}>${inl(o)}</button>`).join('')}</div><div class="qw">${done&&q.why?'✅ '+inl(q.why):''}</div></div>`;
}

/* ---------- kurs ma'lumotlari ---------- */
const COURSES={};
$$('script[data-course]').forEach(sc=>{
  const lang=sc.getAttribute('data-course');
  const mods=parseCourse(sc.textContent);
  const LES=[];mods.forEach(m=>m.lessons.forEach(l=>LES.push(l)));
  const LBY={};LES.forEach(l=>LBY[l.id]=l);
  COURSES[lang]={mods,LES,LBY,voice:sc.getAttribute('data-voice')||'en-US',name:sc.getAttribute('data-langname')||lang};
});

let curLang='en',cur=null;

function totalLessons(lang){return COURSES[lang].LES.length;}
function doneLessons(lang){const tr=trackFor(lang);return COURSES[lang].LES.filter(l=>tr.done[l.id]).length;}
function lessonQuizDone(l){return l.quiz.length>0&&l.quiz.every(q=>trackFor(curLang).quiz[q.id]);}
function lessonFibDone(l){const fibs=[];l.blocks.forEach(b=>{if(b[0]==='fib')fibs.push(b[1]);});return fibs.length>0&&fibs.every(f=>trackFor(curLang).fib[f.id]);}

function renderProg(){
  const tot=totalLessons(curLang),d=doneLessons(curLang);
  const pct=tot?Math.round(d/tot*100):0;
  $('#progBar').style.width=pct+'%';$('#progPct').textContent=pct+'% ('+d+'/'+tot+')';
}

function renderMap(){
  const C=COURSES[curLang],tr=trackFor(curLang);
  const m=$('#map');let h='<h4>'+esc(C.name)+' — kurs xaritasi</h4>';
  C.mods.forEach((md,mi)=>{
    const done=md.lessons.filter(l=>tr.done[l.id]).length;
    const isCur=cur&&cur.mod===md.id;
    h+=`<details class="mod" ${isCur||(!cur&&mi===0)?'open':''}><summary><span class="mi">${md.icon}</span><span class="mt">${esc(md.title)}</span><span class="mc">${done}/${md.lessons.length}</span></summary>`;
    md.lessons.forEach(l=>{
      const d=tr.done[l.id],part=!d&&(lessonQuizDone(l)||lessonFibDone(l));
      h+=`<button class="les ${d?'done':''} ${part?'part':''} ${cur&&cur.id===l.id?'cur':''}" data-l="${l.id}"><span class="st">${d?'✓':''}</span><span class="tt">${esc(l.title)}</span><small>${l.min}′</small></button>`;
    });
    h+='</details>';
  });
  m.innerHTML=h;
}

function markDone(l,silent){
  const tr=trackFor(curLang);
  if(!tr.done[l.id]){tr.done[l.id]=1;saveState();if(!silent)toast('✔ Dars yakunlandi!');}
  renderMap();renderProg();renderFinish();
}
function renderFinish(){
  const box=$('#finish');if(!box)return;
  const tr=trackFor(curLang),done=tr.done[cur.id];
  box.innerHTML=done
    ?'<div class="fc">✅ <b>Siz bu darsni yakunladingiz.</b></div>'
    :'<div class="fc pending">Darsni tugatdingizmi? <button class="mk" data-finish="1">✔ Dars yakunlandi deb belgilash</button></div>';
}

function openLesson(id,noScroll){
  const C=COURSES[curLang],l=C.LBY[id];if(!l)return;
  cur=l;trackFor(curLang).last=id;saveState();
  const idx=C.LES.indexOf(l),mod=C.mods.find(m=>m.id===l.mod);
  const prev=C.LES[idx-1],next=C.LES[idx+1];
  let h=`<div class="lhead"><div class="crumb">${mod.icon} ${esc(mod.title).toUpperCase()}</div><h1>${esc(l.title)}</h1><div class="meta">⏱ taxminan ${l.min} daqiqa${l.quiz.length?' · ❓ '+l.quiz.length+' test':''}</div></div>`;
  h+=l.blocks.map(b=>renderBlock(b,C.voice)).join('');
  if(l.quiz.length){
    h+='<section class="quiz"><h2>Bilimingizni tekshiring</h2>';
    l.quiz.forEach(q=>{h+=renderQuiz(q);});
    h+='</section>';
  }
  h+='<div class="finish" id="finish"></div>';
  h+=`<div class="lnav"><button ${prev?`data-go="${prev.id}"`:'disabled'}>← ${prev?esc(prev.title):'Boshi'}</button><button ${next?`data-go="${next.id}"`:'disabled'}>${next?esc(next.title):'Oxiri'} →</button></div>`;
  $('#lesson').innerHTML=h;
  if(!noScroll)$('.lcol').scrollIntoView&&window.scrollTo(0,0);
  renderFinish();renderMap();renderProg();
}

function switchLang(lang){
  if(!COURSES[lang])return;
  curLang=lang;
  $$('#langsw button').forEach(b=>b.classList.toggle('on',b.dataset.lang===lang));
  const tr=trackFor(lang);
  const startId=tr.last&&COURSES[lang].LBY[tr.last]?tr.last:COURSES[lang].LES[0].id;
  cur=null;openLesson(startId,true);
}

/* ---------- hodisalar ---------- */
$('#langsw').addEventListener('click',e=>{const b=e.target.closest('button');if(b)switchLang(b.dataset.lang);});
$('#map').addEventListener('click',e=>{const b=e.target.closest('.les');if(b){openLesson(b.dataset.l);closeDrawer();}});
function closeDrawer(){$('#map').classList.remove('open');$('#drawerBg').classList.remove('show');}
$('#btnMenu').addEventListener('click',()=>{const o=$('#map').classList.toggle('open');$('#drawerBg').classList.toggle('show',o);});
$('#drawerBg').addEventListener('click',closeDrawer);

$('#lesson').addEventListener('click',e=>{
  const spk=e.target.closest('.spk,.vspk');
  if(spk){speak(spk.dataset.say,spk.dataset.voice||COURSES[curLang].voice);return;}
  const g=e.target.closest('[data-go]');
  if(g){openLesson(g.dataset.go);return;}
  const o=e.target.closest('.qc button.o');
  if(o){answerQuiz(o);return;}
  const fc=e.target.closest('[data-fcheck]');
  if(fc){checkFib(fc.dataset.fcheck);return;}
  const fh=e.target.closest('[data-fhint]');
  if(fh){const h=document.querySelector('[data-fh="'+fh.dataset.fhint+'"]');if(h)h.classList.toggle('hidden');return;}
  const f=e.target.closest('[data-finish]');
  if(f){markDone(cur);return;}
});

function answerQuiz(btn){
  const card=btn.closest('.qc');const q=cur.quiz.find(x=>x.id===card.dataset.q);const i=+btn.dataset.qi;
  const w=card.querySelector('.qw');
  if(i===q.c){
    trackFor(curLang).quiz[q.id]=1;saveState();btn.classList.add('good');$$('button.o',card).forEach(b=>b.disabled=true);
    w.innerHTML='✅ To\'g\'ri! '+(q.why?inl(q.why):'');
    renderMap();
  }else{
    btn.classList.add('bad');btn.disabled=true;w.innerHTML='❌ Bu to\'g\'ri emas — yana urinib ko\'ring.';
  }
}
function checkFib(id){
  let f=null;for(const b of cur.blocks){if(b[0]==='fib'&&b[1].id===id){f=b[1];break;}}
  if(!f)return;
  const box=document.querySelector('.fib[data-f="'+id+'"]');
  const inputs=$$('.fin',box);
  let allOk=true;
  inputs.forEach((inp,i)=>{
    const v=inp.value.trim().toLowerCase();
    const ok=f.a.length?f.a.includes(v):v.length>0;
    inp.classList.toggle('good',ok);inp.classList.toggle('bad',!ok);
    if(!ok)allOk=false;
  });
  const wr=box.querySelector('[data-fr]');
  if(allOk){
    trackFor(curLang).fib[id]=1;saveState();
    inputs.forEach(inp=>inp.disabled=true);
    wr.innerHTML='✅ To\'g\'ri!'+(f.why?' '+esc(f.why):'');
    renderMap();
  }else{
    wr.innerHTML='❌ Hali to\'g\'ri emas, yana urinib ko\'ring.';
  }
}

/* ---------- ishga tushirish ---------- */
switchLang('en');
})();
</script>
