<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Prompt Generator | IT SHAKH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tools.css">
<style>
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.field{display:grid;gap:8px;margin-bottom:15px}
.field span{color:var(--muted);font:11px monospace;letter-spacing:1.4px}
select,textarea{width:100%;background:#050b14;color:var(--text);border:1px solid rgba(56,189,248,.42);border-radius:10px;padding:13px;outline:none;font:14px Inter,Arial,sans-serif}
textarea{min-height:125px;resize:vertical;line-height:1.55}
select:focus,textarea:focus{border-color:var(--accent);box-shadow:var(--glow)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.secondary{color:var(--text);background:transparent;border:1px solid rgba(56,189,248,.55)}
#output{min-height:360px}
.status{color:var(--muted);font-size:12px;line-height:1.6;margin-top:13px}
@media(max-width:760px){.wrap{grid-template-columns:1fr}#output{min-height:280px}}
</style>
</head>
<body>
<header>
<a class="brand" href="index.html">IT SHAKH</a>
<a class="back" href="javascript:history.back()">← ORQAGA</a>
</header>
<main>
<div class="eyebrow">// AI PROMPT BUILDER</div>
<h1>AI PROMPT GENERATOR</h1>
<p class="intro">Vazifangizni yozing — tayyor, aniq va qayta ishlatish mumkin bo‘lgan AI prompt yarating.</p>
<section class="panel">
<div class="wrap">
<div>
<label class="field"><span>PROMPT TYPE</span>
<select id="type">
<option value="chat">ChatGPT / AI</option>
<option value="code">Programming</option>
<option value="image">Image AI</option>
<option value="video">Video AI</option>
<option value="music">Music AI</option>
<option value="social">Social Media</option>
<option value="website">Website</option>
</select></label>
<label class="field"><span>YOUR GOAL</span>
<textarea id="goal" placeholder="Masalan: Professional cyberpunk gaming website yaratish"></textarea></label>
<label class="field"><span>STYLE / DETAILS</span>
<textarea id="details" placeholder="Masalan: dark theme, neon blue, responsive, modern..."></textarea></label>
<div class="actions">
<button id="generate" type="button">GENERATE PROMPT</button>
<button id="clear" class="secondary" type="button">CLEAR</button>
</div>
<p id="status" class="status">Ma’lumotlarni kiriting va GENERATE PROMPT tugmasini bosing.</p>
</div>
<div>
<label class="field"><span>GENERATED PROMPT</span>
<textarea id="output" readonly spellcheck="false" placeholder="Tayyor prompt shu yerda chiqadi..."></textarea></label>
<div class="actions"><button id="copy" class="secondary" type="button">COPY PROMPT</button></div>
</div>
</div>
</section>
</main>
<script>
const typeEl=document.getElementById('type'),goalEl=document.getElementById('goal'),detailsEl=document.getElementById('details'),outputEl=document.getElementById('output'),statusEl=document.getElementById('status');
const profiles={
chat:['You are an expert AI assistant.','Solve the user request clearly and accurately.','Ask only when essential. Do not invent missing facts. Structure the answer with useful headings, steps, and examples when appropriate.'],
code:['You are a senior software engineer.','Create a complete, reliable solution for the requested programming task.','Return working code, keep dependencies clear, handle errors, and explain how to run the solution.'],
image:['You are an expert AI image prompt designer.','Create a detailed image-generation prompt based on the requested concept.','Specify subject, composition, environment, lighting, camera perspective, mood, visual style, and important details.'],
video:['You are an expert AI video prompt designer.','Create a detailed video-generation prompt for the requested scene.','Specify action, environment, camera movement, framing, lighting, motion, timing, atmosphere, and visual style.'],
music:['You are an expert AI music prompt designer.','Create a detailed prompt for generating the requested music.','Specify genre, tempo, instruments, rhythm, bass, mood, structure, production style, and vocals if relevant.'],
social:['You are an expert social-media content strategist.','Create content for the requested social-media goal.','Make it clear, engaging, platform-appropriate, and include a strong hook and call to action when useful.'],
website:['You are a senior web designer and frontend developer.','Design and build the requested website.','Provide a responsive, accessible, modern implementation with clean HTML, CSS, and JavaScript when code is requested.']
};
function clean(s){return s.trim().replace(/\s+/g,' ')}
function generate(){
 const goal=clean(goalEl.value),details=clean(detailsEl.value);
 if(!goal){statusEl.textContent='Avval nima yaratish kerakligini yozing.';goalEl.focus();return}
 const p=profiles[typeEl.value];
 outputEl.value=[p[0],'','GOAL:',goal,'','STYLE / DETAILS:',details||'Use a professional, polished, modern approach appropriate for the goal.','','TASK:',p[1],'','REQUIREMENTS:',p[2],'','OUTPUT:','Return the final result in a clear, ready-to-use format. Prioritize accuracy, completeness, and practical details.'].join('\n');
 statusEl.textContent='✓ Prompt tayyor.';
}
document.getElementById('generate').onclick=generate;
document.getElementById('clear').onclick=()=>{goalEl.value='';detailsEl.value='';outputEl.value='';statusEl.textContent='Tozalandi.';goalEl.focus()};
document.getElementById('copy').onclick=async()=>{
 if(!outputEl.value){statusEl.textContent='Avval prompt yarating.';return}
 try{await navigator.clipboard.writeText(outputEl.value)}
 catch(e){outputEl.focus();outputEl.select();document.execCommand('copy')}
 statusEl.textContent='✓ Prompt nusxalandi.'
};
goalEl.onkeydown=detailsEl.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter')generate()};
</script>
</body>
</html>
