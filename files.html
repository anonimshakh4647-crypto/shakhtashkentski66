<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT SHAKH | Senior IT Specialist</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #04060b;
            --accent: #38bdf8;
            --glow: 0 0 45px rgba(56, 189, 248, 0.85);
            --text-color: #e5e7eb;
            --card-bg: rgba(11, 18, 32, 0.7);
        }
        body.night-mode {
            --bg: #000;
            --accent: #00ff41;
            --glow: 0 0 45px rgba(0, 255, 65, 0.85);
            --text-color: #00ff41;
            --card-bg: rgba(0, 20, 0, 0.7);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-color);
            overflow-x: hidden;
            transition: 0.5s;
        }
        canvas { position: fixed; inset: 0; z-index: 0; opacity: 0; pointer-events: none; transition: opacity .35s ease; }
        body.night-mode canvas { opacity: 1; }
        body.night-mode .lion-bg { opacity: 0.035; filter: grayscale(1) contrast(1.35) brightness(.55); }
        body.night-mode::before {
            content: ""; position: fixed; inset: 0; z-index: 1; pointer-events: none;
            background:
              repeating-linear-gradient(0deg, rgba(0,255,65,.045) 0px, rgba(0,255,65,.045) 1px, transparent 1px, transparent 4px),
              radial-gradient(circle at 50% 50%, transparent 0 38%, rgba(0,0,0,.28) 100%);
            mix-blend-mode: screen; opacity: .9;
        }
        body.night-mode::after {
            content: "SYSTEM BREACH // NIGHT PROTOCOL // TRACE ACTIVE";
            position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
            z-index: 3; pointer-events: none; white-space: nowrap;
            font: 700 10px/1 monospace; letter-spacing: 3px; color: #00ff41;
            text-shadow: 0 0 8px #00ff41, 0 0 20px rgba(0,255,65,.8);
            animation: warningBlink .9s steps(2,end) infinite;
        }
        .files-page header, .files-page #datetime-bar, .files-page #file-center-section { position: relative; z-index: 2; }
        .files-page header { z-index: 100; }
        body.night-mode #file-center-card {
            border-color: rgba(0,255,65,.5);
            box-shadow: 0 0 25px rgba(0,255,65,.14), inset 0 0 40px rgba(0,255,65,.035);
        }
        body.night-mode .section-title {
            animation: hackerGlitch 1.8s infinite steps(2,end);
        }
        body.night-mode .file-btn.primary {
            animation: pulseHack 1.25s infinite;
        }
        @keyframes warningBlink { 0%,45% { opacity: .95; } 46%,100% { opacity: .28; } }
        @keyframes pulseHack { 0%,100% { box-shadow: 0 0 0 rgba(0,255,65,0); } 50% { box-shadow: 0 0 22px rgba(0,255,65,.5); } }
        @keyframes hackerGlitch {
            0%, 88%, 100% { transform: translate(0); filter:none; }
            89% { transform: translate(2px,-1px); filter: drop-shadow(-2px 0 #ff003c); }
            90% { transform: translate(-2px,1px); filter: drop-shadow(2px 0 #00ffff); }
            91% { transform: translate(0); filter:none; }
        }
        .lion-bg {
            position: fixed; inset: 0;
            background: url("lion-bg.png") center/cover no-repeat;
            opacity: 0.12; z-index: -2;
            animation: float 20s infinite ease-in-out;
        }

        /* LOADING SCREEN */
        #loading-screen {
            position: fixed; inset: 0; background: #04060b;
            z-index: 9999; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 20px;
            transition: opacity 0.8s ease;
        }
        #loading-screen.hide { opacity: 0; pointer-events: none; }
        .loading-logo {
            width: 100px; height: 100px; border-radius: 50%;
            background: conic-gradient(var(--accent), #7c4dff, var(--accent));
            animation: rotate 1.5s linear infinite;
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .loading-logo::after {
            content: ""; position: absolute; inset: 6px;
            background: #04060b; border-radius: 50%;
        }
        .loading-logo img { width: 70%; z-index: 10; }
        .loading-text {
            font-family: monospace; font-size: 14px;
            color: var(--accent); letter-spacing: 4px;
            text-shadow: var(--glow); animation: blink 1s infinite;
        }
        .loading-bar-wrap {
            width: 200px; height: 3px;
            background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden;
        }
        .loading-bar {
            height: 100%; width: 0%; background: var(--accent);
            box-shadow: var(--glow); border-radius: 10px;
            animation: loadbar 2s ease forwards;
        }
        @keyframes loadbar { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        /* DATETIME BAR */
        #datetime-bar {
            width: 100%; text-align: center; padding: 6px 20px;
            font-family: monospace; font-size: 13px; color: var(--accent);
            background: rgba(0,0,0,0.6); letter-spacing: 2px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            position: fixed; top: 0; z-index: 200; transition: 0.5s;
        }

        header {
            padding: 15px 20px; display: flex;
            justify-content: space-between; align-items: center;
            backdrop-filter: blur(10px);
            position: fixed; top: 32px; width: 100%; z-index: 100;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo-text { font-weight: 800; letter-spacing: 2px; color: var(--accent); font-size: 14px; }
        .nav-links { display: flex; align-items: center; gap: 15px; }
        .nav-links a {
            color: var(--text-color); text-decoration: none;
            font-size: 12px; font-weight: 600; transition: 0.3s;
        }

        .hero {
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
            padding: 120px 20px 40px 20px;
        }
        .hero-container {
            max-width: 1200px; width: 100%;
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 40px; align-items: center;
        }
        .hero-text h1 { font-size: clamp(30px, 8vw, 60px); margin: 0; line-height: 1.1; }
        .hero-text span { color: var(--accent); text-shadow: var(--glow); }
        .hero-text p { color: #9ca3af; font-size: clamp(14px, 4vw, 18px); margin: 20px 0; }

        .socials { display: flex; gap: 15px; flex-wrap: wrap; }
        .socials a {
            width: 45px; height: 45px; background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s; box-shadow: var(--glow);
        }
        .socials a img { width: 20px; height: 20px; filter: invert(1); }

        .logo-wrap { display: flex; justify-content: center; align-items: center; }
        .logo-ring {
            width: clamp(250px, 40vw, 400px); height: clamp(250px, 40vw, 400px);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            position: relative; background: conic-gradient(var(--accent), #7c4dff, var(--accent));
            animation: rotate 12s linear infinite;
        }
        .logo-ring::after {
            content: ""; position: absolute; inset: 6px;
            background: var(--bg); border-radius: 50%;
        }
        .main-logo { width: 80%; z-index: 10; filter: drop-shadow(var(--glow)); }

        @keyframes rotate { from { transform: rotate(0); } to { transform: rotate(360deg); } }
        @keyframes float { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        .mode-toggle {
            background: var(--accent); color: #000;
            border: none; padding: 6px 12px; border-radius: 20px;
            cursor: pointer; font-weight: bold; font-size: 10px;
        }

        /* SECTIONS UMUMIY */
        .section {
            max-width: 900px; margin: 0 auto;
            padding: 60px 20px;
        }
        .section-title {
            font-family: monospace; font-size: 20px;
            color: var(--accent); text-shadow: var(--glow);
            letter-spacing: 3px; margin-bottom: 30px;
            border-left: 3px solid var(--accent);
            padding-left: 15px;
        }



        /* TERMINAL */
        #terminal {
            background: #0a0a0a;
            border: 1px solid var(--accent);
            border-radius: 12px; overflow: hidden;
            box-shadow: var(--glow);
        }
        .terminal-header {
            background: rgba(255,255,255,0.05);
            padding: 10px 15px; display: flex;
            align-items: center; gap: 8px;
        }
        .t-dot {
            width: 12px; height: 12px; border-radius: 50%;
        }
        .t-dot.red { background: #ff5f57; }
        .t-dot.yellow { background: #ffbd2e; }
        .t-dot.green { background: #28ca41; }
        .terminal-title {
            font-family: monospace; font-size: 12px;
            color: #9ca3af; margin-left: 10px;
        }
        #terminal-output {
            padding: 20px; font-family: monospace;
            font-size: 13px; min-height: 200px;
            max-height: 300px; overflow-y: auto;
            color: var(--accent); line-height: 1.8;
        }
        .terminal-input-line {
            display: flex; align-items: center;
            padding: 10px 20px; border-top: 1px solid rgba(255,255,255,0.05);
        }
        .terminal-prompt { color: var(--accent); font-family: monospace; margin-right: 8px; }
        #terminal-input {
            background: transparent; border: none; outline: none;
            color: var(--text-color); font-family: monospace;
            font-size: 13px; flex: 1;
        }
        .t-error { color: #ff5f57; }
        .t-success { color: #28ca41; }
        .t-info { color: #ffbd2e; }

        /* QUIZ */
        #quiz-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 30px;
        }
        .quiz-question {
            font-size: 16px; font-weight: 600;
            margin-bottom: 20px; line-height: 1.5;
        }
        .quiz-number {
            font-family: monospace; font-size: 12px;
            color: var(--accent); margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .quiz-options { display: flex; flex-direction: column; gap: 10px; }
        .quiz-option {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 12px 18px;
            cursor: pointer; transition: 0.3s; font-size: 14px;
        }
        .quiz-option:hover { border-color: var(--accent); color: var(--accent); }
        .quiz-option.correct { background: rgba(40,202,65,0.15); border-color: #28ca41; color: #28ca41; }
        .quiz-option.wrong { background: rgba(255,95,87,0.15); border-color: #ff5f57; color: #ff5f57; }
        .quiz-result {
            margin-top: 15px; font-family: monospace;
            font-size: 13px; min-height: 20px;
        }
        .quiz-nav {
            display: flex; gap: 10px; margin-top: 20px;
            align-items: center; justify-content: space-between;
        }
        .quiz-btn {
            background: var(--accent); color: #000;
            border: none; padding: 8px 20px; border-radius: 20px;
            cursor: pointer; font-weight: bold; font-size: 12px;
            transition: 0.3s;
        }
        .quiz-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .quiz-score {
            font-family: monospace; font-size: 13px;
            color: var(--accent);
        }

        footer {
            text-align: center; padding: 20px;
            color: #9ca3af; font-size: 11px;
            background: rgba(0,0,0,0.3);
        }

        /* TYPING TEST */
        #typing-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 30px;
        }
        #typing-text {
            font-family: monospace; font-size: 16px;
            line-height: 2; margin-bottom: 20px;
            padding: 15px; border-radius: 10px;
            background: rgba(0,0,0,0.3);
            letter-spacing: 1px; user-select: none;
        }
        .typing-char { color: #9ca3af; }
        .typing-char.correct { color: #28ca41; }
        .typing-char.wrong { color: #ff5f57; background: rgba(255,95,87,0.2); border-radius: 2px; }
        .typing-char.current { border-bottom: 2px solid var(--accent); color: var(--text-color); }
        #typing-input {
            width: 100%; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; padding: 12px 15px;
            color: var(--text-color); font-family: monospace;
            font-size: 15px; outline: none; transition: 0.3s;
        }
        #typing-input:focus { border-color: var(--accent); box-shadow: var(--glow); }
        .typing-stats {
            display: flex; gap: 20px; margin-top: 20px;
            flex-wrap: wrap;
        }
        .typing-stat {
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px; padding: 12px 20px;
            text-align: center; flex: 1; min-width: 80px;
        }
        .typing-stat-val {
            font-family: monospace; font-size: 24px;
            color: var(--accent); font-weight: bold;
        }
        .typing-stat-label {
            font-size: 10px; color: #9ca3af;
            letter-spacing: 2px; margin-top: 4px;
        }
        .typing-btns { display: flex; gap: 10px; margin-top: 15px; }
        .typing-btn {
            background: var(--accent); color: #000;
            border: none; padding: 8px 20px; border-radius: 20px;
            cursor: pointer; font-weight: bold; font-size: 12px;
        }
        #typing-timer-bar-wrap {
            height: 3px; background: rgba(255,255,255,0.1);
            border-radius: 10px; margin-bottom: 15px; overflow: hidden;
        }
        #typing-timer-bar {
            height: 100%; width: 100%;
            background: var(--accent); border-radius: 10px;
            transition: width 1s linear;
        }

        @media (max-width: 850px) {
            .hero-container {
                grid-template-columns: 1fr; text-align: center;
                display: flex; flex-direction: column-reverse; gap: 30px;
            }
            .hero { padding-top: 120px; }
            .socials { justify-content: center; }
            .logo-ring { width: 260px; height: 260px; }
            .nav-links a { font-size: 11px; }
            .logo-text { font-size: 12px; letter-spacing: 1px; }
            #datetime-bar { font-size: 11px; letter-spacing: 1px; }
            #ip-card { grid-template-columns: 1fr; }
        }
        @media (max-width: 400px) {
            .logo-ring { width: 200px; height: 200px; }
            .hero-text h1 { font-size: 28px; }
            .nav-links { gap: 8px; }
        }
    
        /* START SCREEN - added without changing the existing site design */
        #loading-screen.start-screen {
            gap: 20px;
        }
        #loading-screen.start-screen.hide {
            opacity: 0;
            pointer-events: none;
        }
        .start-button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 12px 32px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 2px;
            box-shadow: var(--glow);
            transition: .3s;
        }
        .start-button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 55px rgba(56,189,248,.95);
        }
        .start-hint {
            font-family: monospace;
            font-size: 10px;
            color: #64748b;
            letter-spacing: 2px;
        }


/* ===== TYPING TEST PRO FEATURES ===== */
.typing-controls{
    display:flex; gap:12px; align-items:center; flex-wrap:wrap;
    margin-bottom:15px;
}
.typing-control{
    display:flex; align-items:center; gap:8px;
    font:11px monospace; color:#9ca3af; letter-spacing:1px;
}
.typing-control select{
    background:#080e18; color:var(--text-color);
    border:1px solid rgba(56,189,248,.25); border-radius:9px;
    padding:8px 10px; outline:none; cursor:pointer;
}
.typing-record{
    margin-left:auto; color:#9ca3af; font:12px monospace;
}
.typing-record b{color:var(--accent);}
.typing-live{
    display:flex; justify-content:space-between; gap:10px;
    margin-top:12px; color:#7dd3fc; font:11px monospace;
    letter-spacing:1px; flex-wrap:wrap;
}
#typing-text{
    min-height:62px;
    transition:.2s;
}
#typing-input{
    caret-color:var(--accent);
}
.typing-keyboard-wrap,.typing-chart-wrap{
    margin-top:18px; padding:14px;
    background:rgba(0,0,0,.22);
    border:1px solid rgba(255,255,255,.07);
    border-radius:12px;
}
.typing-keyboard-title,.typing-chart-head{
    display:flex; justify-content:space-between;
    color:#9ca3af; font:10px monospace;
    letter-spacing:2px; margin-bottom:10px;
}
.keyboard-row{
    display:flex; justify-content:center; gap:5px; margin:5px 0;
}
.keyboard-key{
    min-width:28px; height:30px; padding:0 7px;
    display:flex; align-items:center; justify-content:center;
    border:1px solid rgba(56,189,248,.16);
    border-radius:6px; background:rgba(8,15,25,.75);
    color:#94a3b8; font:11px monospace;
    transition:.08s;
}
.keyboard-key.active{
    color:#000; background:var(--accent);
    box-shadow:0 0 18px rgba(56,189,248,.8);
    transform:translateY(1px);
}
#typing-chart{
    display:block; width:100%; height:180px;
}
.typing-result{
    margin-top:18px; padding:18px;
    border:1px solid rgba(56,189,248,.3);
    border-radius:12px;
    background:rgba(2,10,20,.65);
    text-align:center;
}
.typing-result-title{
    color:var(--accent); font:14px monospace;
    letter-spacing:2px; margin-bottom:15px;
}
.typing-result-grid{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
}
.typing-result-grid div{
    padding:10px; border-radius:9px;
    background:rgba(255,255,255,.035);
}
.typing-result-grid b{
    display:block; color:var(--accent);
    font:22px monospace;
}
.typing-result-grid small{
    color:#94a3b8; font:9px monospace; letter-spacing:1px;
}
.typing-result-level{
    margin-top:12px; color:#e5e7eb;
    font:bold 11px monospace; letter-spacing:3px;
}
.typing-btn:disabled{opacity:.35; cursor:not-allowed;}
@media(max-width:650px){
    #typing-card{padding:18px;}
    .typing-record{width:100%; margin-left:0;}
    .typing-controls{gap:8px;}
    .typing-control{width:100%; justify-content:space-between;}
    .typing-control select{flex:1;}
    .typing-live{font-size:9px;}
    .keyboard-row{gap:2px;}
    .keyboard-key{
        min-width:20px; height:27px; padding:0 4px; font-size:9px;
    }
    .typing-result-grid{grid-template-columns:repeat(2,1fr);}
    .typing-btns{flex-wrap:wrap;}
    .typing-btn{flex:1; min-width:140px;}
}


/* GOOGLE SHEETS LEADERBOARD */
#leaderboard-card{padding:20px;border:1px solid rgba(56,189,248,.18);border-radius:16px;background:rgba(4,10,18,.55);box-shadow:0 0 30px rgba(0,100,180,.08)}
.leader-top{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.leader-top>div{padding:13px;text-align:center;border:1px solid rgba(56,189,248,.12);border-radius:10px;background:rgba(0,0,0,.18)}.leader-top b{display:block;color:var(--accent);font:700 25px monospace}.leader-top span{display:block;margin-top:4px;color:#94a3b8;font:8px monospace;letter-spacing:1px}.leader-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:11px;border-bottom:1px solid rgba(56,189,248,.12);color:#cbd5e1;font:10px monospace;letter-spacing:2px}.leader-head button{background:rgba(7,16,28,.8);color:#9ca3af;border:1px solid rgba(56,189,248,.2);border-radius:8px;padding:7px 10px;cursor:pointer;font:9px monospace}.leader-head button:hover{color:#fff;border-color:var(--accent)}#leader-list{display:grid;gap:7px;margin-top:11px}.lb-row{display:grid;grid-template-columns:42px 1fr 85px 65px;gap:8px;align-items:center;padding:10px;border:1px solid rgba(255,255,255,.05);border-radius:9px;background:rgba(255,255,255,.018)}.lb-rank{text-align:center;color:var(--accent);font:700 13px monospace}.lb-name{display:flex;align-items:center;gap:8px;min-width:0}.lb-name img{width:32px;height:32px;border-radius:50%;object-fit:cover;display:block;background:#07101c;border:1px solid rgba(56,189,248,.25);box-shadow:0 0 10px rgba(56,189,248,.12)}.lb-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e5e7eb;font:600 11px Inter,sans-serif}.lb-score{text-align:right;color:var(--accent);font:700 12px monospace}.lb-percent{text-align:right;color:#94a3b8;font:9px monospace}.lb-loading,.lb-empty{text-align:center;color:#64748b;padding:22px;font:10px monospace}@media(max-width:600px){.lb-row{grid-template-columns:30px 1fr 62px 48px}.lb-name b{font-size:10px}.leader-top b{font-size:19px}.leader-top span{font-size:7px}.leader-head{font-size:9px}}

</style>

<style>

/* ===== IT SHAKH GOOGLE LOGIN — CLEAN PROFESSIONAL LION LAYERS ===== */
#google-login-screen{
 position:fixed; inset:0; z-index:100000; overflow:hidden;
 display:flex; align-items:center; justify-content:center;
 background:#02070e;
 isolation:isolate;
}
#google-login-screen::before{
 content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
 background:radial-gradient(ellipse at center,rgba(0,125,255,.14) 0%,rgba(0,20,45,.05) 48%,rgba(0,0,0,.30) 100%);
}
/* PURE CSS CYBER VISUALS — no lion images */
.side-visual{display:none;position:absolute;top:0;bottom:0;width:min(31vw,470px);pointer-events:none;z-index:0;overflow:hidden;opacity:.9;}

<script>
/* ===== NIGHT PROTOCOL — MATRIX HACKER BACKGROUND ===== */
(function(){
    const canvas = document.getElementById('matrixCanvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let w=0,h=0,cols=[],raf=0;
    const chars = '01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%<>[]{}\\/|░▒▓ ACCESS DENIED TRACE ROOT KERNEL';
    function resize(){
        const dpr=Math.min(window.devicePixelRatio||1,2);
        w=window.innerWidth; h=window.innerHeight;
        canvas.width=w*dpr; canvas.height=h*dpr;
        canvas.style.width=w+'px'; canvas.style.height=h+'px';
        ctx.setTransform(dpr,0,0,dpr,0,0);
        const count=Math.ceil(w/15);
        cols=Array.from({length:count},(_,i)=>({x:i*15,y:Math.random()*h/15, speed:.18+Math.random()*0.42, size:11+Math.random()*5, glitch:Math.random()}));
    }
    function draw(){
        ctx.fillStyle='rgba(0,0,0,.115)'; ctx.fillRect(0,0,w,h);
        const night=document.body.classList.contains('night-mode');
        if(!night){ raf=requestAnimationFrame(draw); return; }
        for(const c of cols){
            const n=chars[Math.floor(Math.random()*chars.length)];
            ctx.font=`${Math.floor(c.size)}px monospace`;
            const bright=Math.random()>.94;
            ctx.fillStyle=bright?'rgba(210,255,220,.95)':'rgba(0,255,65,.62)';
            ctx.shadowBlur=bright?12:5; ctx.shadowColor='#00ff41';
            ctx.fillText(n,c.x,c.y*15);
            ctx.shadowBlur=0;
            c.y += c.speed;
            if(c.y*15>h+80) { c.y=-Math.random()*20; c.speed=.18+Math.random()*0.42; }
        }
        // occasional terminal-style warning flashes
        if(Math.random()<.018){
            ctx.save(); ctx.font='700 12px monospace'; ctx.fillStyle='rgba(0,255,65,.75)';
            ctx.shadowBlur=14; ctx.shadowColor='#00ff41';
            const msg=['[!] INTRUSION DETECTED','[!] TRACE RUNNING','[!] ROOT ACCESS','[!] FIREWALL BYPASS','[!] UNKNOWN PROCESS'][Math.floor(Math.random()*5)];
            ctx.fillText(msg,18+Math.random()*w*.55,80+Math.random()*h*.75);
            ctx.restore();
        }
        raf=requestAnimationFrame(draw);
    }
    resize(); window.addEventListener('resize',resize,{passive:true});
    draw();
})();

    const refreshBtn = document.getElementById('file-refresh');
    const list = document.getElementById('file-list');
    const count = document.getElementById('file-count');
    const status = document.getElementById('file-status');
    const userBox = document.getElementById('file-center-user');
    const progressWrap = document.getElementById('file-progress-wrap');
    const progressBar = document.getElementById('file-progress-bar');
    const progressName = document.getElementById('file-progress-name');
    const progressPercent = document.getElementById('file-progress-percent');

    if(!input || !zone) return;

    function getUser(){
        try{return JSON.parse(sessionStorage.getItem('it_shakh_google_user') || 'null')}catch(e){return null}
    }
    function getToken(){
        const u=getUser();
        return u && u.credential ? u.credential : '';
    }
    function setStatus(msg,type='info'){
        status.textContent=msg;
        status.className='file-status '+type;
    }
    function formatSize(bytes){
        if(bytes < 1024) return bytes+' B';
        if(bytes < 1024*1024) return (bytes/1024).toFixed(1)+' KB';
        if(bytes < 1024*1024*1024) return (bytes/1024/1024).toFixed(1)+' MB';
        return (bytes/1024/1024/1024).toFixed(2)+' GB';
    }
    function iconFor(name){
        const n=name.toLowerCase();
        if(/\.(png|jpe?g|gif|webp|svg|bmp|ico)$/i.test(n)) return '🖼️';
        if(/\.(mp4|mkv|avi|mov|webm|m4v)$/i.test(n)) return '🎬';
        if(/\.(mp3|wav|flac|ogg|m4a|aac)$/i.test(n)) return '🎵';
        if(/\.(zip|rar|7z|tar|gz)$/i.test(n)) return '📦';
        if(/\.(pdf|docx?|xlsx?|pptx?|txt|csv)$/i.test(n)) return '📄';
        return '📁';
    }
    function safe(s){
        return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function authHeaders(extra={}){
        const token=getToken();
        return token ? Object.assign({'Authorization':'Bearer '+token},extra) : extra;
    }
    function requireLogin(){
        if(!getToken()){
            setStatus('Google login required — avval Google orqali kiring.','err');
            return false;
        }
        return true;
    }

    async function loadFiles(){
        if(!requireLogin()){
            list.innerHTML='<div class="file-empty">GOOGLE LOGIN TALAB QILINADI.</div>';
            count.textContent='0 FILE';
            return;
        }
        list.innerHTML='<div class="file-empty">YUKLANMOQDA...</div>';
        try{
            const r=await fetch(FILE_API+'/list',{headers:authHeaders()});
            const data=await r.json();
            if(!r.ok || !data.success) throw new Error(data.error||'Fayllarni olishda xato');
            const files=Array.isArray(data.files)?data.files:[];
            count.textContent=files.length+' FILE';
            if(!files.length){
                list.innerHTML='<div class="file-empty">FILE STORAGE HOZIRCHA BO‘SH.</div>';
                return;
            }
            files.sort((a,b)=>new Date(b.uploaded)-new Date(a.uploaded));
            list.innerHTML=files.map(f=>{
                const encoded=encodeURIComponent(f.name);
                return `<div class="file-row">
                    <div class="file-icon">${iconFor(f.name)}</div>
                    <div class="file-meta">
                        <div class="file-name" title="${safe(f.name)}">${safe(f.name)}</div>
                        <div class="file-size">${formatSize(Number(f.size)||0)} • ${new Date(f.uploaded).toLocaleString('uz-UZ')}</div>
                    </div>
                    <div class="file-row-actions">
                        <button class="file-btn" type="button" data-download="${encoded}">↗ OCHISH</button>
                        <button class="file-btn danger" type="button" data-delete="${encoded}">🗑 O‘CHIRISH</button>
                    </div>
                </div>`;
            }).join('');
        }catch(e){
            list.innerHTML='<div class="file-empty">STORAGE BILAN ULANIB BO‘LMADI.</div>';
            setStatus('XATO: '+(e.message||'Noma’lum xato'),'err');
        }
    }

    function xhrUpload(url, method, body, token, contentType, onprogress, extraHeaders={}){
        return new Promise((resolve,reject)=>{
            const xhr=new XMLHttpRequest();
            xhr.open(method,url,true);
            if(token) xhr.setRequestHeader('Authorization','Bearer '+token);
            if(contentType) xhr.setRequestHeader('Content-Type',contentType);
            Object.entries(extraHeaders).forEach(([k,v])=>xhr.setRequestHeader(k,v));
            xhr.upload.onprogress=e=>{ if(e.lengthComputable && onprogress) onprogress(e.loaded,e.total); };
            xhr.onload=()=>{
                let data={};
                try{data=JSON.parse(xhr.responseText||'{}');}catch(e){}
                if(xhr.status>=200 && xhr.status<300) resolve(data);
                else reject(new Error(data.error||xhr.responseText||('Server xatosi ('+xhr.status+')')));
            };
            xhr.onerror=()=>reject(new Error('Tarmoq xatosi yoki CORS muammosi.'));
            xhr.onabort=()=>reject(new Error('Upload bekor qilindi.'));
            xhr.send(body);
        });
    }

    async function uploadSimple(file){
        const token=getToken();
        const key=encodeURIComponent(file.name);
        return xhrUpload(
            FILE_API+'/upload/'+key,
            'PUT',file,token,file.type||'application/octet-stream',
            (loaded,total)=>{
                const pct=Math.round((loaded/total)*100);
                progressBar.style.width=pct+'%';
                progressPercent.textContent=pct+'%';
            }
        );
    }

    async function uploadMultipart(file){
        const token=getToken();
        const key=encodeURIComponent(file.name);
        const create=await xhrUpload(
            FILE_API+'/multipart/'+key+'?action=mpu-create',
            'POST',null,token,'application/json',null,{'X-File-Type':file.type||'application/octet-stream'}
        );
        if(!create.uploadId) throw new Error('Multipart upload ID olinmadi.');
        const uploadId=create.uploadId;
        const totalParts=Math.ceil(file.size/MULTIPART_PART_SIZE);
        const parts=[];
        let completedBytes=0;
        try{
            for(let i=0;i<totalParts;i++){
                const start=i*MULTIPART_PART_SIZE;
                const end=Math.min(start+MULTIPART_PART_SIZE,file.size);
                const chunk=file.slice(start,end);
                const partNo=i+1;
                const result=await xhrUpload(
                    FILE_API+'/multipart/'+key+'?action=mpu-uploadpart&uploadId='+encodeURIComponent(uploadId)+'&partNumber='+partNo,
                    'PUT',chunk,token,'application/octet-stream',
                    (loaded,total)=>{
                        const pct=Math.round(((completedBytes+loaded)/file.size)*100);
                        progressBar.style.width=pct+'%';
                        progressPercent.textContent=pct+'%';
                    }
                );
                if(!result.etag) throw new Error('Part '+partNo+' ETag olinmadi.');
                parts.push({partNumber:result.partNumber||partNo,etag:result.etag});
                completedBytes=end;
            }
            return await xhrUpload(
                FILE_API+'/multipart/'+key+'?action=mpu-complete&uploadId='+encodeURIComponent(uploadId),
                'POST',JSON.stringify({parts}),token,'application/json'
            );
        }catch(err){
            try{
                await xhrUpload(
                    FILE_API+'/multipart/'+key+'?action=mpu-abort&uploadId='+encodeURIComponent(uploadId),
                    'DELETE',null,token,'application/json'
                );
            }catch(e){}
            throw err;
        }
    }

    async function uploadOne(file){
        if(file.size > MAX_FILE_SIZE){
            throw new Error(file.name+' — 1 GB dan katta.');
        }
        // Cloudflare Free/Pro request bodies are limited to 100 MB.
        // Files above 80 MB use R2 multipart upload, with 50 MB parts.
        if(file.size > SIMPLE_UPLOAD_LIMIT) return uploadMultipart(file);
        return uploadSimple(file);
    }

    async function uploadSelected(){
        if(!requireLogin()) return;
        const files=Array.from(input.files||[]);
        if(!files.length){
            setStatus('Avval fayl tanlang.','err');
            return;
        }
        uploadBtn.disabled=true;
        clearBtn.disabled=true;
        progressWrap.classList.add('show');
        let done=0;
        for(const file of files){
            progressBar.style.width='0%';
            progressPercent.textContent='0%';
            progressName.textContent=file.name;
            setStatus('Yuklanmoqda: '+file.name,'info');
            try{
                await uploadOne(file);
                done++;
                setStatus('✓ '+file.name+' yuklandi.','ok');
            }catch(e){
                setStatus('✕ '+e.message,'err');
            }
        }
        input.value='';
        uploadBtn.disabled=false;
        clearBtn.disabled=false;
        progressWrap.classList.remove('show');
        await loadFiles();
        if(done) setStatus(done+' ta fayl muvaffaqiyatli yuklandi.','ok');
    }

    zone.addEventListener('dragover',e=>{
        e.preventDefault(); zone.classList.add('dragover');
    });
    zone.addEventListener('dragleave',()=>zone.classList.remove('dragover'));
    zone.addEventListener('drop',e=>{
        e.preventDefault(); zone.classList.remove('dragover');
        try{
            input.files=e.dataTransfer.files;
            setStatus(input.files.length+' ta fayl tanlandi.','info');
        }catch(err){}
    });
    input.addEventListener('change',()=>{
        if(input.files.length) setStatus(input.files.length+' ta fayl tanlandi.','info');
    });
    uploadBtn.addEventListener('click',uploadSelected);
    clearBtn.addEventListener('click',()=>{
        input.value='';
        progressWrap.classList.remove('show');
        setStatus('Tanlangan fayllar tozalandi.','info');
    });
    refreshBtn.addEventListener('click',loadFiles);

    list.addEventListener('click',async e=>{
        const open=e.target.closest('[data-download]');
        const del=e.target.closest('[data-delete]');
        if(open){
            if(!requireLogin()) return;
            const name=decodeURIComponent(open.dataset.download);
            const btn=open;
            btn.disabled=true;
            setStatus('Yuklanmoqda: '+name,'info');
            try{
                const r=await fetch(FILE_API+'/file/'+encodeURIComponent(name),{
                    headers:authHeaders()
                });
                if(!r.ok) throw new Error((await r.text()) || ('Faylni ochishda xato ('+r.status+')'));
                const blob=await r.blob();
                const objectUrl=URL.createObjectURL(blob);
                const a=document.createElement('a');
                a.href=objectUrl;
                a.download=name.split('/').pop() || name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(()=>URL.revokeObjectURL(objectUrl),1500);
                setStatus('✓ Fayl tayyor: '+name,'ok');
            }catch(err){
                setStatus('✕ '+(err.message||'Faylni ochishda xato'),'err');
            }finally{
                btn.disabled=false;
            }
        }
        if(del){
            if(!requireLogin()) return;
            const name=decodeURIComponent(del.dataset.delete);
            if(!confirm('“'+name+'” faylini o‘chirishni xohlaysizmi?')) return;
            del.disabled=true;
            try{
                const r=await fetch(FILE_API+'/file/'+encodeURIComponent(name),{
                    method:'DELETE',headers:authHeaders()
                });
                const data=await r.json();
                if(!r.ok || !data.success) throw new Error(data.error||'O‘chirishda xato');
                setStatus('✓ Fayl o‘chirildi: '+name,'ok');
                loadFiles();
            }catch(err){
                del.disabled=false;
                setStatus('✕ '+(err.message||'O‘chirishda xato'),'err');
            }
        }
    });

    function updateUser(){
        const u=getUser();
        userBox.textContent=u && u.name ? u.name : 'GOOGLE LOGIN';
    }
    updateUser();
    window.addEventListener('storage',updateUser);
    setTimeout(loadFiles,700);
})();

    
// Simple page clock
(function(){const el=document.getElementById('datetime-bar'); if(!el)return; function tick(){const d=new Date(); el.textContent=d.toLocaleDateString('uz-UZ',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'})+' | '+d.toLocaleTimeString('uz-UZ');} tick(); setInterval(tick,1000);})();
// Night mode
(function(){const b=document.body,btn=document.getElementById('modeToggle'); if(!btn)return; const on=localStorage.getItem('it_shakh_night_mode')==='1'; if(on)b.classList.add('night-mode'); btn.addEventListener('click',()=>{b.classList.toggle('night-mode');localStorage.setItem('it_shakh_night_mode',b.classList.contains('night-mode')?'1':'0');});})();
</script>
</body>
