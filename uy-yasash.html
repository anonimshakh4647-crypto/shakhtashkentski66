<style>

select.in { padding: 0 4px; } input[type=color].in { padding: 2px; cursor: pointer; }

#status { grid-area: status; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: var(--panel); border-top: 1px solid var(--line); font: 500 11px var(--mono); color: var(--muted); min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

.tpl { padding: 14px 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; text-align: left; } .tpl:hover { border-color: var(--cyan); } .tpl b { display: block; margin-bottom: 4px; } .tpl small { color: var(--muted); font-size: 11px; line-height: 1.4; display: block; }
@media (max-width: 900px) {

<div id="app">
  <header id="top">

<script>
/* ===== DFF (RenderWare 3.6 / GTA SA) reader + writer + decal builder. DOM-free. ===== */
(function(root){
'use strict';
const T={STRUCT:1,STRING:2,EXT:3,TEXTURE:6,MATERIAL:7,MATLIST:8,FRAMELIST:14,GEOMETRY:15,CLUMP:16,ATOMIC:20,GEOLIST:26,
  BINMESH:0x50E,SKIN:0x116,NIGHT:0x253F2F9,FX2D:0x253F2F8,FRAMENAME:0x253F2FE};
const CONT=new Set([3,6,7,8,14,15,16,20,26]);

/* ---------- chunk tree ---------- */
function sizeOf(c){
  if(c.children){let s=c.tail?c.tail.length:0;for(const k of c.children)s+=12+sizeOf(k);return s;}
  return c.data.length;
}
function parseChunks(buf,start,end){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength),out=[];let o=start;
  while(o+12<=end){
    const type=dv.getUint32(o,true),size=dv.getUint32(o+4,true),ver=dv.getUint32(o+8,true);
    let e=o+12+size;if(e>end)e=end;
    const c={type,ver};
    if(CONT.has(type)){
      c.children=parseChunks(buf,o+12,e);
      let used=0;for(const k of c.children)used+=12+sizeOf(k);
      c.tail=used<e-o-12?buf.slice(o+12+used,e):null;
    }else c.data=buf.slice(o+12,e);
    out.push(c);o=e;
  }
  return out;
}
function writeChunk(c,out,o){
  const dv=new DataView(out.buffer);
  dv.setUint32(o,c.type,true);dv.setUint32(o+4,sizeOf(c),true);dv.setUint32(o+8,c.ver,true);
  o+=12;
  if(c.children){for(const k of c.children)o=writeChunk(k,out,o);if(c.tail){out.set(c.tail,o);o+=c.tail.length;}}
  else{out.set(c.data,o);o+=c.data.length;}
  return o;
}
function serialize(roots){
  let total=0;for(const c of roots)total+=12+sizeOf(c);
  const out=new Uint8Array(total);let o=0;for(const c of roots)o=writeChunk(c,out,o);
  return out;
}
const child=(c,t)=>c.children&&c.children.find(k=>k.type===t);
const childs=(c,t)=>c.children?c.children.filter(k=>k.type===t):[];
const dvOf=d=>new DataView(d.buffer,d.byteOffset,d.byteLength);
function rwVersion(stamp){ // library stamp -> RW version (e.g. 0x36003)
  if(stamp&0xFFFF0000)return(((stamp>>14)&0x3FF00)+0x30000)|((stamp>>16)&0x3F);
  return stamp<<8;
}

/* ---------- byte writer ---------- */
class BW{
  constructor(){this.a=[];this.n=0;}
  _p(u){this.a.push(u);this.n+=u.length;}
  u8(v){this._p(new Uint8Array([v&255]));}
  u16(v){const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,v,true);this._p(b);}
  u32(v){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v>>>0,true);this._p(b);}
  i32(v){const b=new Uint8Array(4);new DataView(b.buffer).setInt32(0,v,true);this._p(b);}
  f32(v){const b=new Uint8Array(4);new DataView(b.buffer).setFloat32(0,v,true);this._p(b);}
  bytes(u){this._p(u instanceof Uint8Array?u:new Uint8Array(u));}
  str(s,len){const b=new Uint8Array(len);for(let i=0;i<Math.min(len-1,s.length);i++)b[i]=s.charCodeAt(i)&127;this._p(b);}
  done(){const o=new Uint8Array(this.n);let p=0;for(const u of this.a){o.set(u,p);p+=u.length;}return o;}
}

/* ---------- decode ---------- */
function decodeFrames(fl){
  const st=child(fl,T.STRUCT).data,dv=dvOf(st),n=dv.getUint32(0,true),frames=[];
  const exts=childs(fl,T.EXT);
  for(let i=0;i<n;i++){
    const o=4+i*56,rot=new Float32Array(9);for(let k=0;k<9;k++)rot[k]=dv.getFloat32(o+k*4,true);
    const pos=[dv.getFloat32(o+36,true),dv.getFloat32(o+40,true),dv.getFloat32(o+44,true)];
    let name='';const nm=exts[i]&&child(exts[i],T.FRAMENAME);
    if(nm)name=String.fromCharCode(...nm.data).replace(/\0.*$/,'');
    const ha=exts[i]&&child(exts[i],0x11E);
    frames.push({name,rot,pos,parent:dv.getInt32(o+48,true),flags:dv.getUint32(o+52,true),hanim:ha?ha.data:null});
  }
  return frames;
}
function decodeMaterial(m){
  const st=child(m,T.STRUCT).data,dv=dvOf(st);
  const color=[st[4],st[5],st[6],st[7]],textured=dv.getUint32(12,true)!==0;
  let tex='',mask='';
  const t=child(m,T.TEXTURE);
  if(t){const ss=childs(t,T.STRING);const rd=s=>s?String.fromCharCode(...s.data).replace(/\0.*$/,''):'';tex=rd(ss[0]);mask=rd(ss[1]);}
  const amb=dv.getFloat32(16,true),spec=dv.getFloat32(20,true),diff=dv.getFloat32(24,true);
  const ext=child(m,T.EXT)||null,tst=t&&child(t,T.STRUCT)?t.children.find(k=>k.type===T.STRUCT).data:null;
  return{color,textured,tex,mask,amb,spec,diff,extChunk:ext,texStruct:tst};
}
function decodeGeometry(g,rwv){
  const st=child(g,T.STRUCT).data,dv=dvOf(st);
  const flags=dv.getUint32(0,true),nTri=dv.getUint32(4,true),nV=dv.getUint32(8,true),nMorph=dv.getUint32(12,true);
  let o=16;if(rwv<0x34000)o+=12;
  if(flags&0x01000000)return{native:true,flags};
  let numUV=(flags>>16)&255;if(!numUV)numUV=(flags&0x80)?2:(flags&4)?1:0;
  let dayColors=null;
  if(flags&8){dayColors=st.slice(o,o+nV*4);o+=nV*4;}
  const uvs=[];for(let k=0;k<numUV;k++){uvs.push(new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*8)));o+=nV*8;}
  const tris=new Uint16Array(nTri*4);
  for(let i=0;i<nTri;i++){const p=o+i*8;tris[i*4]=dv.getUint16(p+2,true);tris[i*4+1]=dv.getUint16(p,true);tris[i*4+2]=dv.getUint16(p+6,true);tris[i*4+3]=dv.getUint16(p+4,true);}
  // tris[]: v1,v2,v3,materialId
  o+=nTri*8;
  let pos=null,nrm=null;
  for(let m=0;m<nMorph;m++){
    o+=16;const hv=dv.getUint32(o,true),hn=dv.getUint32(o+4,true);o+=8;
    if(hv){const a=new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*12));o+=nV*12;if(m===0)pos=a;}
    if(hn){const a=new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*12));o+=nV*12;if(m===0)nrm=a;}
  }
  const ml=child(g,T.MATLIST);let materials=[];
  if(ml){
    const mst=child(ml,T.STRUCT).data,mdv=dvOf(mst),cnt=mdv.getUint32(0,true),mats=childs(ml,T.MATERIAL).map(decodeMaterial);
    let k=0;for(let i=0;i<cnt;i++){const idx=mdv.getInt32(4+i*4,true);materials.push(idx<0?(mats[k++]||{color:[255,255,255,255],tex:'',mask:'',textured:false}):materials[idx]);}
  }
  const ext=child(g,T.EXT);let night=null,has2dfx=false,skin=false,fx2d=null,extra=[],skinData=null;
  if(ext){
    const nc=child(ext,T.NIGHT);if(nc&&dvOf(nc.data).getUint32(0,true))night=nc.data.slice(4,4+nV*4);
    const fx=child(ext,T.FX2D);has2dfx=!!fx;if(fx)fx2d=fx.data;const sk=child(ext,T.SKIN);skin=!!sk;if(sk)skinData=sk.data;
    extra=ext.children.filter(k=>k.type!==T.BINMESH&&k.type!==T.NIGHT&&k.type!==T.FX2D&&k.type!==T.SKIN);
  }
  return{native:false,flags,nTri,nV,numUV,dayColors,uvs,tris,pos,nrm,materials,night,has2dfx,skin,fx2d,extra,skinData};
}

function parseDff(bytes){
  const roots=parseChunks(bytes,0,bytes.length);
  const clump=roots.find(c=>c.type===T.CLUMP);
  if(!clump)throw new Error('Bu DFF fayl emas (Clump topilmadi).');
  const stamp=clump.ver,rwv=rwVersion(stamp);
  const fl=child(clump,T.FRAMELIST),gl=child(clump,T.GEOLIST);
  if(!fl||!gl)throw new Error('DFF tuzilishi to\'liq emas (FrameList yoki GeometryList yo\'q).');

}

function dlFile(data, name, type) { const b = data instanceof Blob ? data : new Blob([data], { type: type || 'application/octet-stream' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(a.href); }, 1500); }
function shiftXY(m, dx, dy) {
    const meshes = m.meshes.map(me => { const pos = new Float32Array(me.pos.length); for (let i = 0; i < pos.length; i += 3) { pos[i] = me.pos[i] - dx; pos[i + 1] = me.pos[i + 1] - dy; pos[i + 2] = me.pos[i + 2]; } return Object.assign({}, me, { pos }); });
    const bb = boundsOf(meshes), size = [bb.max[0] - bb.min[0], bb.max[1] - bb.min[1], bb.max[2] - bb.min[2]]; return Object.assign({}, m, { meshes, bb, size, L: Math.max(size[0], size[1], size[2]) });
}
function prepExport() {
    const P = S.P; let model = buildHouse(P, {}); if (!model) { toast('Uy bo‘sh — avval devor chizing.', true); return null; }
    const bb = model.bb, c = [(bb.min[0] + bb.max[0]) / 2, (bb.min[1] + bb.max[1]) / 2]; model = shiftXY(model, c[0], c[1]); let colModel = buildHouse(P, { col: true }); colModel = shiftXY(colModel, c[0], c[1]);
    return { model, colModel, name: gtaName(P.name), E: P.exp };
}
function exportSimple(kind) {
    try {
        const X = prepExport(); if (!X) return; const { model, colModel, name, E } = X;
        if (kind === 'col') { const c = exportCol(colModel, { name, id: E.id, mode: E.col, minSize: 0.3, maxTris: 30000, surface: 0 }); dlFile(c.bytes, name + '.col'); toast('COL saqlandi: ' + c.info + ' (' + (c.bytes.length / 1024).toFixed(1) + ' KB).'); return; }
        const keys = usedTextures(model);
        if (kind === 'txd') { if (!keys.length) { toast('Modelda tekstura yo‘q.', true); return; } const t = buildTxd({ tex: model.tex }, keys, { fmt: 'dxt', pot: true, maxSize: E.txMax }); dlFile(t.bytes, name + '.txd'); toast('TXD saqlandi: ' + keys.length + ' tekstura, ' + (t.bytes.length / 1024).toFixed(0) + ' KB.'); return; }
        const d = exportDff(model, { single: true, prelit: false });
        if (kind === 'dff') { dlFile(d.bytes, name + '.dff'); toast('DFF saqlandi: ' + (d.bytes.length / 1024).toFixed(0) + ' KB' + (d.parts > 1 ? ' (⚠ ' + d.parts + ' atomik — GTA faqat birinchisini ko‘rsatadi, paket eksportidan foydalaning)' : '') + '.', d.parts > 1); return; }
        const files = [{ name: name + '.dff', data: d.bytes }]; if (keys.length) { const t = buildTxd({ tex: model.tex }, keys, { fmt: 'dxt', pot: true, maxSize: E.txMax }); files.push({ name: name + '.txd', data: t.bytes }); }
        dlFile(zipStore(files), name + '_dff_txd.zip'); toast('DFF + TXD (ZIP) saqlandi.');
    } catch (e) { console.error(e); toast('Eksportda xato: ' + e.message, true); }
}
function exportPack() {
    try {
        const X = prepExport(); if (!X) return; const { model, colModel, name, E } = X;
        const sp = splitModel(model, 55000, name), parts = sp.parts, ids = parts.map((q, k) => Math.min(19999, E.id + k));
        const imgFiles = [], colParts = []; let dffBytes = 0, multi = 0;
        parts.forEach((q, k) => {

        });
        let colLen = 0; colParts.forEach(c => colLen += c.bytes.length); const colAll = new Uint8Array(colLen); { let p0 = 0; for (const c of colParts) { colAll.set(c.bytes, p0); p0 += c.bytes.length; } }
        const keys = usedTextures(model); let txdInfo = 'Tekstura yo‘q.', txdKB = 0;
        if (keys.length) { const t = buildTxd({ tex: model.tex }, keys, { fmt: 'dxt', pot: true, maxSize: E.txMax }); imgFiles.push({ name: name + '.txd', data: t.bytes }); txdKB = t.bytes.length / 1024; txdInfo = 'TXD ' + (txdKB / 1024).toFixed(2) + ' MB (DXT, tekstura ≤ ' + E.txMax + ' px).'; }

            { name: 'README.txt', data: TE.encode(mapReadme(Object.assign({ colInfo: Array.from(new Set(colParts.map(c => c.info))).join('; '), txdInfo }, po))) }];
        const z = zipStore(files); dlFile(z, name + '_gta_xarita.zip');

    } catch (e) { console.error(e); toast('Eksportda xato: ' + e.message, true); }
}
