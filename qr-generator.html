<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Maker | IT SHAKH</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"><style>textarea{width:100%;min-height:150px;resize:vertical;background:#050b14;color:var(--text);border:1px solid rgba(56,189,248,.42);border-radius:10px;padding:14px;font:14px monospace;outline:none}textarea:focus{border-color:var(--accent);box-shadow:var(--glow)}.qr-wrap{display:none;justify-content:center;margin:28px 0 4px}.qr-card{background:#fff;border-radius:14px;padding:14px;line-height:0;box-shadow:0 0 34px rgba(56,189,248,.55)}.qr-card canvas{max-width:100%;height:auto!important}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.secondary{display:inline-flex;align-items:center;color:var(--accent);background:transparent;text-decoration:none;border:1px solid rgba(56,189,248,.6);border-radius:10px;padding:13px 17px;font-size:13px;font-weight:800;cursor:pointer}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header><main><div class="eyebrow">// QUICK SHARE TOOL</div><h1>QR MAKER</h1><p class="intro">Matn, havola, telefon raqami yoki Wi‑Fi ma’lumotini yozing — darhol QR kod yaratiladi.</p><section class="panel"><textarea id="content" maxlength="1200" placeholder="Masalan: https://itshakh.uz yoki istalgan matn…"></textarea><div class="actions"><button id="generate">QR KOD YARATISH</button><button id="clear" class="secondary" type="button">TOZALASH</button></div><p id="status" class="notice">QR kod ichiga eng ko‘pi bilan 1200 ta belgi joylashtirish mumkin.</p><div id="qr-wrap" class="qr-wrap"><div class="qr-card"><canvas id="qr"></canvas></div></div><div id="download-area" class="actions" hidden><a id="download" class="secondary" download="it-shakh-qr.png">↓ PNG YUKLAB OLISH</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script><script>const input=document.getElementById('content'),status=document.getElementById('status'),wrap=document.getElementById('qr-wrap'),downloadArea=document.getElementById('download-area'),download=document.getElementById('download');function generate(){const text=input.value.trim();if(!text){status.textContent='Avval QR kodga aylantiriladigan matn yoki havolani yozing.';wrap.style.display='none';downloadArea.hidden=true;return}if(typeof QRious==='undefined'){status.textContent='QR kutubxonasi yuklanmadi. Internetni tekshirib, sahifani yangilang.';return}try{const qr=new QRious({element:document.getElementById('qr'),value:text,size:360,level:'M',foreground:'#07101a',background:'#ffffff'});download.href=qr.toDataURL('image/png');wrap.style.display='flex';downloadArea.hidden=false;status.textContent='✓ QR kod tayyor — telefon kamerasi bilan skaner qiling yoki PNG sifatida yuklab oling.'}catch(_){status.textContent='Matn juda uzun. Qisqaroq matn yoki havola kiriting.'}}document.getElementById('generate').addEventListener('click',generate);document.getElementById('clear').addEventListener('click',()=>{input.value='';wrap.style.display='none';downloadArea.hidden=true;status.textContent='QR kod ichiga eng ko‘pi bilan 1200 ta belgi joylashtirish mumkin.';input.focus()});input.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key==='Enter')generate()});</script></body></html>
