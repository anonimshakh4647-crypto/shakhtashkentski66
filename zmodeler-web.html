<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZModeler Web — IT SHAKH</title>
<style>
:root{--face:#d4d4d4;--face2:#e4e4e4;--dark:#8a8a8a;--light:#fff;--txt:#111;--sel:#316ac5;--vp:#373737}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--face);color:var(--txt);font:11px/1.35 Tahoma,Verdana,"Segoe UI",sans-serif;user-select:none;-webkit-user-select:none}
#app{display:grid;grid-template-rows:auto auto minmax(0,1fr) 62px 20px;height:100vh}

.di{display:flex;justify-content:space-between;gap:18px;padding:3px 22px 3px 22px;white-space:nowrap;position:relative}

.di.dis{color:#888;pointer-events:none}
.di .k{color:inherit;opacity:.75}
.di.chk::before{content:"✓";position:absolute;left:7px}
.di .sub{position:absolute;left:100%;top:-3px}
.dsep{height:1px;background:var(--dark);margin:3px 2px;border-bottom:1px solid #fff}
.di.has>.drop{left:100%;top:-3px}
.di.has:hover>.drop{display:block}
.di.has::after{content:"▸";position:absolute;right:7px}
/* toolbars */
#toolbars{display:flex;flex-wrap:wrap;gap:3px;padding:3px;background:var(--face);border-bottom:1px solid var(--dark);align-items:center}
.tb{display:flex;gap:1px;padding:2px;border:1px solid var(--dark);border-color:#fff var(--dark) var(--dark) #fff;background:var(--face);align-items:center}
.tb .grip{width:4px;align-self:stretch;margin-right:2px;border-left:1px solid #fff;border-right:1px solid var(--dark)}
.tb.hidden{display:none}
.tbtn{width:24px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;padding:0;color:#111;cursor:default;font:bold 10px Tahoma,sans-serif}
.tbtn:hover:not(:disabled){border-color:#fff var(--dark) var(--dark) #fff}
.tbtn.on{border-color:var(--dark) #fff #fff var(--dark);background:#c2d2e8}
.tbtn:disabled{opacity:.4}
.tbtn svg{width:16px;height:16px;stroke:#222;fill:none;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.tsep{width:1px;height:18px;background:var(--dark);margin:0 3px;border-right:1px solid #fff}

#main{display:grid;grid-template-columns:minmax(0,1fr) 232px;min-height:0}
#views{display:grid;gap:3px;background:#7d7d7d;padding:3px;min-height:0;min-width:0}
.vp{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--vp)}
.vp canvas{position:absolute;left:0;top:0;display:block}
.vp-title{position:absolute;left:5px;top:3px;color:#e8e8e8;font:bold 11px Tahoma,sans-serif;cursor:pointer;padding:1px 4px;background:rgba(0,0,0,.25);border-radius:2px}
.vp-title:hover{background:rgba(80,120,200,.6)}
.vpmenu{position:fixed;z-index:200;background:var(--face);border:1px solid #444;box-shadow:2px 2px 4px rgba(0,0,0,.45);padding:2px 0}

#cmdhead{background:linear-gradient(#0a246a,#a6caf0);color:#fff;font-weight:bold;padding:2px 6px}

.cat{margin-bottom:2px}

.br.open>.brh::before{content:"▾ "}

#status span{padding:2px 8px;border-right:1px solid var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#shade{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:300;display:none;align-items:center;justify-content:center}
#shade.on{display:flex}
.dlg{background:var(--face);border:2px solid;border-color:#fff #444 #444 #fff;box-shadow:3px 3px 10px rgba(0,0,0,.5);min-width:300px;max-width:min(94vw,760px);max-height:92vh;display:flex;flex-direction:column}
.dh{background:linear-gradient(90deg,#0a246a,#a6caf0);color:#fff;font-weight:bold;padding:3px 7px;display:flex;justify-content:space-between}

.db{padding:10px;overflow:auto;user-select:text;-webkit-user-select:text}
.df{display:flex;justify-content:flex-end;gap:6px;padding:8px 10px;border-top:1px solid var(--dark)}
.df button{min-width:74px;padding:4px 10px;font:11px Tahoma;border:1px solid #444;border-color:#fff #444 #444 #fff;background:var(--face)}

.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:5px 0}

.fr input[type=number],.fr input[type=text],.fr select{width:150px;font:11px Tahoma;border:1px solid var(--dark);padding:2px 4px;background:#fff}

.lst{border:1px solid var(--dark);background:#fff;height:220px;overflow:auto;margin:4px 0}
.lst div{padding:2px 6px;white-space:nowrap}
.lst div.on{background:var(--sel);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.thumbs div{border:1px solid var(--dark);background:#fff;padding:3px;text-align:center;font-size:10px;word-break:break-all}
.thumbs div.on{outline:2px solid var(--sel)}
.thumbs img{max-width:100%;height:60px;object-fit:contain;display:block;margin:0 auto 2px}
.kt{width:100%;border-collapse:collapse;font-size:11px}.kt td{padding:2px 6px;border-bottom:1px solid #bbb}.kt td:first-child{white-space:nowrap;font-weight:bold}
::-webkit-scrollbar{width:12px;height:12px}::-webkit-scrollbar-track{background:#e6e6e6}::-webkit-scrollbar-thumb{background:#b4b4b4;border:1px solid #888}

<script>
/* ===== DFF (RenderWare 3.6 / GTA SA) reader + writer + decal builder. DOM-free. ===== */
(function(root){
'use strict';
const T={STRUCT:1,STRING:2,EXT:3,TEXTURE:6,MATERIAL:7,MATLIST:8,FRAMELIST:14,GEOMETRY:15,CLUMP:16,ATOMIC:20,GEOLIST:26,
  BINMESH:0x50E,SKIN:0x116,NIGHT:0x253F2F9,FX2D:0x253F2F8,FRAMENAME:0x253F2FE};
const CONT=new Set([3,6,7,8,14,15,16,20,26]);

/* ---------- chunk tree ---------- */
function sizeOf(c){
  if(c.children){let s=c.tail?c.tail.length:0;for(const k of c.children)s+=12+sizeOf(k);return s;}
  return c.data.length;
}
function parseChunks(buf,start,end){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength),out=[];let o=start;
  while(o+12<=end){
    const type=dv.getUint32(o,true),size=dv.getUint32(o+4,true),ver=dv.getUint32(o+8,true);
    let e=o+12+size;if(e>end)e=end;
    const c={type,ver};
    if(CONT.has(type)){
      c.children=parseChunks(buf,o+12,e);
      let used=0;for(const k of c.children)used+=12+sizeOf(k);
      c.tail=used<e-o-12?buf.slice(o+12+used,e):null;
    }else c.data=buf.slice(o+12,e);
    out.push(c);o=e;
  }
  return out;
}
function writeChunk(c,out,o){
  const dv=new DataView(out.buffer);
  dv.setUint32(o,c.type,true);dv.setUint32(o+4,sizeOf(c),true);dv.setUint32(o+8,c.ver,true);
  o+=12;
  if(c.children){for(const k of c.children)o=writeChunk(k,out,o);if(c.tail){out.set(c.tail,o);o+=c.tail.length;}}
  else{out.set(c.data,o);o+=c.data.length;}
  return o;
}
function serialize(roots){
  let total=0;for(const c of roots)total+=12+sizeOf(c);
  const out=new Uint8Array(total);let o=0;for(const c of roots)o=writeChunk(c,out,o);
  return out;
}
const child=(c,t)=>c.children&&c.children.find(k=>k.type===t);
const childs=(c,t)=>c.children?c.children.filter(k=>k.type===t):[];
const dvOf=d=>new DataView(d.buffer,d.byteOffset,d.byteLength);
function rwVersion(stamp){ // library stamp -> RW version (e.g. 0x36003)
  if(stamp&0xFFFF0000)return(((stamp>>14)&0x3FF00)+0x30000)|((stamp>>16)&0x3F);
  return stamp<<8;
}

/* ---------- byte writer ---------- */
class BW{
  constructor(){this.a=[];this.n=0;}
  _p(u){this.a.push(u);this.n+=u.length;}
  u8(v){this._p(new Uint8Array([v&255]));}
  u16(v){const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,v,true);this._p(b);}
  u32(v){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v>>>0,true);this._p(b);}
  i32(v){const b=new Uint8Array(4);new DataView(b.buffer).setInt32(0,v,true);this._p(b);}
  f32(v){const b=new Uint8Array(4);new DataView(b.buffer).setFloat32(0,v,true);this._p(b);}
  bytes(u){this._p(u instanceof Uint8Array?u:new Uint8Array(u));}
  str(s,len){const b=new Uint8Array(len);for(let i=0;i<Math.min(len-1,s.length);i++)b[i]=s.charCodeAt(i)&127;this._p(b);}
  done(){const o=new Uint8Array(this.n);let p=0;for(const u of this.a){o.set(u,p);p+=u.length;}return o;}
}

/* ---------- decode ---------- */
function decodeFrames(fl){
  const st=child(fl,T.STRUCT).data,dv=dvOf(st),n=dv.getUint32(0,true),frames=[];
  const exts=childs(fl,T.EXT);
  for(let i=0;i<n;i++){
    const o=4+i*56,rot=new Float32Array(9);for(let k=0;k<9;k++)rot[k]=dv.getFloat32(o+k*4,true);
    const pos=[dv.getFloat32(o+36,true),dv.getFloat32(o+40,true),dv.getFloat32(o+44,true)];
    let name='';const nm=exts[i]&&child(exts[i],T.FRAMENAME);
    if(nm)name=String.fromCharCode(...nm.data).replace(/\0.*$/,'');
    frames.push({name,rot,pos,parent:dv.getInt32(o+48,true),flags:dv.getUint32(o+52,true)});
  }
  return frames;
}
function decodeMaterial(m){
  const st=child(m,T.STRUCT).data,dv=dvOf(st);
  const color=[st[4],st[5],st[6],st[7]],textured=dv.getUint32(12,true)!==0;
  let tex='',mask='';
  const t=child(m,T.TEXTURE);
  if(t){const ss=childs(t,T.STRING);const rd=s=>s?String.fromCharCode(...s.data).replace(/\0.*$/,''):'';tex=rd(ss[0]);mask=rd(ss[1]);}
  return{color,textured,tex,mask};
}
function decodeGeometry(g,rwv){
  const st=child(g,T.STRUCT).data,dv=dvOf(st);
  const flags=dv.getUint32(0,true),nTri=dv.getUint32(4,true),nV=dv.getUint32(8,true),nMorph=dv.getUint32(12,true);
  let o=16;if(rwv<0x34000)o+=12;
  if(flags&0x01000000)return{native:true,flags};
  let numUV=(flags>>16)&255;if(!numUV)numUV=(flags&0x80)?2:(flags&4)?1:0;
  let dayColors=null;
  if(flags&8){dayColors=st.slice(o,o+nV*4);o+=nV*4;}
  const uvs=[];for(let k=0;k<numUV;k++){uvs.push(new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*8)));o+=nV*8;}
  const tris=new Uint16Array(nTri*4);
  for(let i=0;i<nTri;i++){const p=o+i*8;tris[i*4]=dv.getUint16(p+2,true);tris[i*4+1]=dv.getUint16(p,true);tris[i*4+2]=dv.getUint16(p+6,true);tris[i*4+3]=dv.getUint16(p+4,true);}
  // tris[]: v1,v2,v3,materialId
  o+=nTri*8;
  let pos=null,nrm=null;
  for(let m=0;m<nMorph;m++){
    o+=16;const hv=dv.getUint32(o,true),hn=dv.getUint32(o+4,true);o+=8;
    if(hv){const a=new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*12));o+=nV*12;if(m===0)pos=a;}
    if(hn){const a=new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*12));o+=nV*12;if(m===0)nrm=a;}
  }
  const ml=child(g,T.MATLIST);let materials=[];
  if(ml){
    const mst=child(ml,T.STRUCT).data,mdv=dvOf(mst),cnt=mdv.getUint32(0,true),mats=childs(ml,T.MATERIAL).map(decodeMaterial);
    let k=0;for(let i=0;i<cnt;i++){const idx=mdv.getInt32(4+i*4,true);materials.push(idx<0?(mats[k++]||{color:[255,255,255,255],tex:'',mask:'',textured:false}):materials[idx]);}
  }
  const ext=child(g,T.EXT);let night=null,has2dfx=false,skin=false;
  if(ext){
    const nc=child(ext,T.NIGHT);if(nc&&dvOf(nc.data).getUint32(0,true))night=nc.data.slice(4,4+nV*4);
    has2dfx=!!child(ext,T.FX2D);skin=!!child(ext,T.SKIN);
  }
  return{native:false,flags,nTri,nV,numUV,dayColors,uvs,tris,pos,nrm,materials,night,has2dfx,skin};
}

function parseDff(bytes){
  const roots=parseChunks(bytes,0,bytes.length);
  const clump=roots.find(c=>c.type===T.CLUMP);
  if(!clump)throw new Error('Bu DFF fayl emas (Clump topilmadi).');
  const stamp=clump.ver,rwv=rwVersion(stamp);
  const fl=child(clump,T.FRAMELIST),gl=child(clump,T.GEOLIST);
  if(!fl||!gl)throw new Error('DFF tuzilishi to\'liq emas (FrameList yoki GeometryList yo\'q).');
  const frames=decodeFrames(fl);
  const geoChunks=childs(gl,T.GEOMETRY),geoms=geoChunks.map(g=>decodeGeometry(g,rwv));
  const atomics=childs(clump,T.ATOMIC).map(a=>{const d=dvOf(child(a,T.STRUCT).data);return{frame:d.getUint32(0,true),geom:d.getUint32(4,true),flags:d.getUint32(8,true)};});
  return{roots,clump,stamp,rwv,frames,geoms,geoChunks,atomics};
}

/* ---------- builders ---------- */
const padLen=n=>(n+4)&~3; // at least one NUL, 4-aligned
function strChunk(s,ver){const d=new Uint8Array(padLen(s.length));for(let i=0;i<s.length;i++)d[i]=s.charCodeAt(i)&127;return{type:T.STRING,ver,data:d};}
const extChunk=(ver,kids)=>({type:T.EXT,ver,children:kids||[],tail:null});
const leaf=(type,ver,data)=>({type,ver,data});
function materialChunk(m,ver){
  const w=new BW();w.u32(0);w.bytes(new Uint8Array(m.color));w.u32(0);w.u32(m.tex?1:0);w.f32(1);w.f32(0);w.f32(1);
  const kids=[leaf(T.STRUCT,ver,w.done())];
  if(m.tex){kids.push({type:T.TEXTURE,ver,children:[leaf(T.STRUCT,ver,new Uint8Array([6,0x11,0,0])),strChunk(m.tex,ver),strChunk(m.mask||'',ver),extChunk(ver)],tail:null});}
  kids.push(extChunk(ver));
  return{type:T.MATERIAL,ver,children:kids,tail:null};
}
/* g: {pos,nrm,uv,day(Uint8 RGBA),night(Uint8 RGBA|null),tris:[a,b,c,mat,...],materials:[{color,tex,mask}],fx2d:Uint8Array|null,prelit:bool} */
function buildGeometry(g,ver){
  const rwv=rwVersion(ver),nV=g.pos.length/3,nT=g.tris.length/4;
  const textured=g.uv&&g.materials.some(m=>m.tex);
  let flags=2|0x10|0x20|0x40;
  if(textured)flags|=4|(1<<16);
  if(g.day)flags|=8;
  const w=new BW();
  w.u32(flags);w.u32(nT);w.u32(nV);w.u32(1);
  if(rwv<0x34000){w.f32(1);w.f32(1);w.f32(1);}
  if(g.day)w.bytes(g.day);
  if(textured){for(let i=0;i<nV*2;i++)w.f32(g.uv[i]);}
  for(let i=0;i<nT;i++){const a=g.tris[i*4],b=g.tris[i*4+1],c=g.tris[i*4+2],m=g.tris[i*4+3];w.u16(b);w.u16(a);w.u16(m);w.u16(c);}
  // bounding sphere
  let cx=0,cy=0,cz=0;for(let i=0;i<nV;i++){cx+=g.pos[i*3];cy+=g.pos[i*3+1];cz+=g.pos[i*3+2];}cx/=nV;cy/=nV;cz/=nV;
  let r=0;for(let i=0;i<nV;i++)r=Math.max(r,Math.hypot(g.pos[i*3]-cx,g.pos[i*3+1]-cy,g.pos[i*3+2]-cz));
  w.f32(cx);w.f32(cy);w.f32(cz);w.f32(r);w.u32(1);w.u32(1);
  for(let i=0;i<nV*3;i++)w.f32(g.pos[i]);
  for(let i=0;i<nV*3;i++)w.f32(g.nrm[i]);
  const ml=new BW();ml.u32(g.materials.length);for(let i=0;i<g.materials.length;i++)ml.i32(-1);
  const matList={type:T.MATLIST,ver,children:[leaf(T.STRUCT,ver,ml.done()),...g.materials.map(m=>materialChunk(m,ver))],tail:null};
  // BinMesh (triangle list, one mesh per material)
  const per=g.materials.map(()=>[]);for(let i=0;i<nT;i++){const m=g.tris[i*4+3];(per[m]||(per[m]=[])).push(g.tris[i*4],g.tris[i*4+1],g.tris[i*4+2]);}
  const bm=new BW(),used=per.map((p,i)=>({p,i})).filter(x=>x.p.length);
  bm.u32(0);bm.u32(used.length);bm.u32(used.reduce((s,x)=>s+x.p.length,0));
  for(const x of used){bm.u32(x.p.length);bm.u32(x.i);for(const v of x.p)bm.u32(v);}
  const exts=[leaf(T.BINMESH,ver,bm.done())];
  if(g.night){const nw=new BW();nw.u32(1);nw.bytes(g.night);exts.push(leaf(T.NIGHT,ver,nw.done()));}
  if(g.fx2d)exts.push(leaf(T.FX2D,ver,g.fx2d));
  return{type:T.GEOMETRY,ver,children:[leaf(T.STRUCT,ver,w.done()),matList,extChunk(ver,exts)],tail:null};
}
/* 2DFX light entries -> chunk data. l: {pos,color:[r,g,b,a],size,range,farClip,corona,shadowTex,flags1,flags2,showMode} */
function build2dfx(lights){
  const w=new BW();w.u32(lights.length);
  for(const l of lights){
    w.f32(l.pos[0]);w.f32(l.pos[1]);w.f32(l.pos[2]);w.u32(0);w.u32(80);
    w.bytes(new Uint8Array(l.color));
    w.f32(l.farClip);w.f32(l.range);w.f32(l.size);w.f32(l.shadowSize||0);
    w.u8(l.showMode||0);w.u8(0);w.u8(0);w.u8(l.shadowMult==null?40:l.shadowMult);w.u8(l.flags1);

/* ---------- render ---------- */
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function gridStep(vp){ // pixel spacing target ~ 16px
  const unit=vp.persp?1:1/vp.zoom*16;let s=S.gridSize;
  if(!vp.persp){const steps=[.01,.02,.05,.1,.2,.5,1,2,5,10,20,50,100,200,500,1000];s=steps.find(x=>x>=unit)||1000;}
  return s;

function clipLine(a,b,near){ // camera-space z clip. a,b: [x,y,z]
  if(a[2]<near&&b[2]<near)return null;
  if(a[2]<near){const t=(near-a[2])/(b[2]-a[2]);a=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,near];}
  else if(b[2]<near){const t=(near-b[2])/(a[2]-b[2]);b=[b[0]+(a[0]-b[0])*t,b[1]+(a[1]-b[1])*t,near];}
  return[a,b];
}
function camSpace(vp,p,B){const d=V.sub(p,B.eye);return[V.dot(d,B.r),V.dot(d,B.u),V.dot(d,B.f)];}
function drawGrid(vp,B){
  const c=vp.ctx,W=vp.W,H=vp.H,minor=hex2rgb(S.cfg.bg).map(v=>Math.min(255,v+(v>110?-22:20))),
        minC='rgb('+minor.join(',')+')',majC='rgb('+hex2rgb(S.cfg.bg).map(v=>Math.min(255,v+(v>110?-45:42))).join(',')+')';
  const step=gridStep(vp);
  const seg=(a,b,col,w)=>{ // world a,b
    let pa,pb;
    if(vp.persp){const ca=camSpace(vp,a,B),cb=camSpace(vp,b,B),cl=clipLine(ca,cb,.05);if(!cl)return;const s=vp.fpx();
      pa=[W/2+cl[0][0]*s/cl[0][2],H/2-cl[0][1]*s/cl[0][2]];pb=[W/2+cl[1][0]*s/cl[1][2],H/2-cl[1][1]*s/cl[1][2]];}
    else{const A=vp.project(a,B),Bp=vp.project(b,B);pa=A;pb=Bp;}
    c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(pa[0],pa[1]);c.lineTo(pb[0],pb[1]);c.stroke();
  };
  // plane axes (a,b): two world axes spanning grid plane
  let ax1,ax2;
  if(vp.persp||vp.type==='top'||vp.type==='bottom'){ax1=0;ax2=1;}else if(vp.type==='front'||vp.type==='back'){ax1=0;ax2=2;}else{ax1=1;ax2=2;}
  let ext,cx,cy;
  if(vp.persp){ext=Math.max(10,Math.ceil(vp.dist*1.2/step)*step);ext=Math.min(ext,step*60);cx=Math.round(vp.target[ax1]/step)*step;cy=Math.round(vp.target[ax2]/step)*step;}
  else{const bb=vp.basis();const hw=vp.W/2/vp.zoom,hh=vp.H/2/vp.zoom;ext=Math.max(hw,hh)*1.5;ext=Math.ceil(ext/step)*step;
    cx=Math.round(vp.target[ax1]/step)*step;cy=Math.round(vp.target[ax2]/step)*step;}
  const n=Math.round(ext/step);
  const mk=(i,j,a,b)=>{const p=[0,0,0];p[ax1]=a;p[ax2]=b;return p;};
  const major=step*10;
  if(S.cfg.minor){
    for(let i=-n;i<=n;i++){const a=cx+i*step,b=cy+i*step;
      if(Math.abs(a%major)>1e-6*major&&Math.abs(a%major-major)>1e-6*major)seg(mk(0,0,a,cy-ext),mk(0,0,a,cy+ext),minC,1);
      if(Math.abs(b%major)>1e-6*major&&Math.abs(b%major-major)>1e-6*major)seg(mk(0,0,cx-ext,b),mk(0,0,cx+ext,b),minC,1);}
  }
  if(S.cfg.major){
    for(let i=-n;i<=n;i++){const a=cx+i*step,b=cy+i*step;
      if(Math.abs(a%major)<1e-6*major||Math.abs(a%major-major)<1e-6*major)seg(mk(0,0,a,cy-ext),mk(0,0,a,cy+ext),majC,1);
      if(Math.abs(b%major)<1e-6*major||Math.abs(b%major-major)<1e-6*major)seg(mk(0,0,cx-ext,b),mk(0,0,cx+ext,b),majC,1);}
  }
  const axC=['#c04040','#40b040','#4070d0'];
  seg(mk(0,0,-ext*2+cx,0),mk(0,0,ext*2+cx,0),axC[ax1],1.5);
  seg(mk(0,0,0,-ext*2+cy),mk(0,0,0,ext*2+cy),axC[ax2],1.5);
}
const WIRE={def:'#c9c9c9',dis:'#656565',act:'#ffffff',sel:'#ff4343',dummy:'#7fd0ff'};
function lightFor(B){return V.norm(V.add(V.mul(B.f,-.65),[.35,-.45,.85]));}
function objProj(o,vp,B){

function vertexNormals(o){

function renderViewport(vp){

      const dim=o.disabled?.55:1;

      c.beginPath();pl.i.forEach((i,k)=>{if(k)c.lineTo(P.sx[i],P.sy[i]);else c.moveTo(P.sx[i],P.sy[i]);});c.closePath();c.fill();

      }
      if(S.level==='edge'){
        c.strokeStyle=WIRE.sel;c.lineWidth=2.4;c.beginPath();
        o.se.forEach(k=>{const [a,b]=k.split('_').map(Number);if(P.ok[a]&&P.ok[b]){c.moveTo(P.sx[a],P.sy[a]);c.lineTo(P.sx[b],P.sy[b]);}});c.stroke();

function renderAll(){VIEWS.forEach(vp=>{if(vp.el.offsetParent!==null||vp.el.style.display!=='none')renderViewport(vp);});}
(function loop(){if(needsRender){needsRender=false;try{renderAll();}catch(e){console.error(e);}}requestAnimationFrame(loop);})();

/* ---------- picking ---------- */
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}
function pointInPoly(px,py,xs,ys){let ins=false;for(let i=0,j=xs.length-1;i<xs.length;j=i++){if((ys[i]>py)!==(ys[j]>py)&&px<(xs[j]-xs[i])*(py-ys[i])/(ys[j]-ys[i])+xs[i])ins=!ins;}return ins;}
function pickVertex(vp,mx,my,r){
  r=r||9;const B=vp.basis();let best=null,bd=r;
  editable().forEach(o=>{if(o.type!=='mesh')return;const P=objProj(o,vp,B);
    for(let i=0;i<o.v.length;i++)if(P.ok[i]){const d=Math.hypot(P.sx[i]-mx,P.sy[i]-my);if(d<bd||(d<=bd&&best&&Math.abs(d-bd)<.5&&P.sz[i]<best.z)){bd=d;best={o,i,z:P.sz[i]};}}});
  return best;
}
function pickEdge(vp,mx,my,r){
  r=r||7;const B=vp.basis();let best=null,bd=r;
  editable().forEach(o=>{if(o.type!=='mesh')return;const P=objProj(o,vp,B);
    edgesOf(o).forEach((e,key)=>{if(!P.ok[e.a]||!P.ok[e.b])return;const d=distSeg(mx,my,P.sx[e.a],P.sy[e.a],P.sx[e.b],P.sy[e.b]);if(d<bd){bd=d;best={o,key,e};}});});
  return best;
}
function pickPoly(vp,mx,my,list){
  const B=vp.basis();let best=null,bz=1e30;
  (list||editable()).forEach(o=>{if(o.type!=='mesh')return;const P=objProj(o,vp,B);
    o.p.forEach((pl,pi)=>{const xs=[],ys=[];let z=0;for(const i of pl.i){if(!P.ok[i])return;xs.push(P.sx[i]);ys.push(P.sy[i]);z+=P.sz[i];}
      z/=pl.i.length;if(z<bz&&pointInPoly(mx,my,xs,ys)){bz=z;best={o,pi,pl};}});});

function pickObject(vp,mx,my){
  const vis=S.objects.filter(o=>!o.hidden);
  const hit=pickPoly(vp,mx,my,vis.filter(o=>o.type==='mesh'));
  if(hit)return hit.o;
  const B=vp.basis();let best=null,bd=7;
  vis.forEach(o=>{
    if(o.type==='dummy'){const p=vp.project(o.pivot,B);if(p){const d=Math.max(Math.abs(p[0]-mx),Math.abs(p[1]-my));if(d<12&&d<bd+5){bd=d;best=o;}}return;}
    const P=objProj(o,vp,B);edgesOf(o).forEach(e=>{if(!P.ok[e.a]||!P.ok[e.b])return;const d=distSeg(mx,my,P.sx[e.a],P.sy[e.a],P.sx[e.b],P.sy[e.b]);if(d<bd){bd=d;best=o;}});});
  return best;
}
/* region select: inside(x,y) predicate */
function regionSelect(vp,inside,mode){ // mode: 'set'|'add'|'sub'
  const B=vp.basis();
  if(mode==='set')clearSelection(S.level!=='object'&&S.level!=='manip');
  if(S.level==='object'||S.level==='manip'){
    S.objects.forEach(o=>{if(o.hidden)return;let ok=false;
      if(o.type==='dummy'){const p=vp.project(o.pivot,B);ok=!!p&&inside(p[0],p[1]);}
      else{const P=objProj(o,vp,B);ok=o.v.length>0;for(let i=0;i<o.v.length&&ok;i++)if(!P.ok[i]||!inside(P.sx[i],P.sy[i]))ok=false;}
      if(ok){o.sel=mode!=='sub';if(o.sel)S.active=o.id;}});
    return;
  }
  editable().forEach(o=>{if(o.type!=='mesh')return;const P=objProj(o,vp,B),insideV=[];
    for(let i=0;i<o.v.length;i++)insideV[i]=!!P.ok[i]&&inside(P.sx[i],P.sy[i]);
    let any=false;
    if(S.level==='vertex'){for(let i=0;i<o.v.length;i++)if(insideV[i]){mode==='sub'?o.sv.delete(i):o.sv.add(i);any=true;}}
    else if(S.level==='edge'){edgesOf(o).forEach((e,k)=>{if(insideV[e.a]&&insideV[e.b]){mode==='sub'?o.se.delete(k):o.se.add(k);any=true;}});}
    else{o.p.forEach((pl,pi)=>{if(pl.i.every(i=>insideV[i])){mode==='sub'?o.sp.delete(pi):o.sp.add(pi);any=true;}});}
    if(any&&!o.sel){o.sel=true;if(!S.active||!objById(S.active)||!objById(S.active).sel)S.active=o.id;}
  });
}
function clearSelection(subOnly){S.objects.forEach(o=>{o.sv.clear();o.se.clear();o.sp.clear();if(!subOnly)o.sel=false;});}
function clickSelect(vp,mx,my,shift,ctrl){
  const mode=ctrl?'sub':shift?'add':'set';
  if(S.level==='object'||S.level==='manip'){
    const o=pickObject(vp,mx,my);
    if(mode==='set')S.objects.forEach(x=>x.sel=false);
    if(o){if(mode==='sub')o.sel=false;else{o.sel=true;S.active=o.id;}}
    return;
  }
  const lvl=S.level;
  let hit=null,o=null;
  if(lvl==='vertex'){hit=pickVertex(vp,mx,my);o=hit&&hit.o;}
  else if(lvl==='edge'){hit=pickEdge(vp,mx,my);o=hit&&hit.o;}
  else{hit=pickPoly(vp,mx,my);o=hit&&hit.o;}
  if(mode==='set')S.objects.forEach(x=>{x.sv.clear();x.se.clear();x.sp.clear();});
  if(!hit)return;
  if(!o.sel&&!S.objects.some(x=>x.sel&&x!==o)&&mode==='set'){S.objects.forEach(x=>x.sel=false);}
  if(!o.sel){o.sel=true;}
  S.active=o.id;
  if(lvl==='vertex'){mode==='sub'?o.sv.delete(hit.i):o.sv.add(hit.i);}
  else if(lvl==='edge'){mode==='sub'?o.se.delete(hit.key):o.se.add(hit.key);}
  else{mode==='sub'?o.sp.delete(hit.pi):o.sp.add(hit.pi);}
}
/* current selection -> verts per object */
function selVertsOf(o){
  if(o.type!=='mesh')return[];
  const s=new Set();
  if(S.level==='vertex')o.sv.forEach(i=>s.add(i));
  else if(S.level==='edge')o.se.forEach(k=>{const [a,b]=k.split('_');s.add(+a);s.add(+b);});
  else if(S.level==='polygon')o.sp.forEach(pi=>{const pl=o.p[pi];if(pl)pl.i.forEach(i=>s.add(i));});
  else if(o.sel)o.v.forEach((_,i)=>s.add(i));
  return[...s];
}
function selTargets(){ // [{o,ids}] for current level
  const out=[];
  S.objects.forEach(o=>{if(o.hidden||o.disabled)return;
    if(S.level==='object'||S.level==='manip'){if(o.sel)out.push({o,ids:selVertsOf(o)});}
    else{const ids=selVertsOf(o);if(ids.length)out.push({o,ids});}});
  return out;
}
function selectionCount(){
  let v=0,e=0,p=0,o=0;
  S.objects.forEach(x=>{if(x.sel)o++;v+=x.sv.size;e+=x.se.size;p+=x.sp.size;});
  return{v,e,p,o};
}

/* ================= OPERATIONS (Modify / Select / Display / Surface) ================= */
const soon=name=>log(name+': bu asbob keyingi versiyada qo‘shiladi.');
function needSel(msg){const t=selTargets();if(!t.length){log(msg||'Avval biror narsani tanlang.');return null;}return t;}

/* ---------- transform ---------- */
let TR=null; // active transform: {kind,base:[{o,ids,pos:[...] ,pivot}],center}
function beginTransform(kind){
  const t=selTargets();if(!t.length)return null;
  if(S.level==='manip'){TR={kind,base:t.map(({o})=>({o,ids:[],pos:[],pivot:o.pivot.slice()})),center:null,manip:true};return TR;}
  const objectLevel=S.level==='object';
  TR={kind,objectLevel,base:t.map(({o,ids})=>({o,ids,pos:ids.map(i=>o.v[i].slice()),pivot:o.pivot.slice(),
    vc:null})),center:null};
  if(!objectLevel){const b=bounds(t.map(({o,ids})=>[o,ids]));TR.center=b?b.c:[0,0,0];}
  else{const sel=t.map(x=>x.o);const bp=sel.map(o=>o.pivot);TR.center=V.mul(bp.reduce((a,b)=>V.add(a,b),[0,0,0]),1/bp.length);}
  const bb=bounds(t.map(({o,ids})=>[o,ids]));TR.ref=bb?bb.c:TR.center;
  return TR;
}
function axisMask(){return[S.axes.x?1:0,S.axes.y?1:0,S.axes.z?1:0];}
function applyMove(d){
  TR.base.forEach(b=>{
    if(TR.manip){b.o.pivot=V.add(b.pivot,d);}
    else{b.ids.forEach((i,k)=>{b.o.v[i]=V.add(b.pos[k],d);});if(TR.objectLevel)b.o.pivot=V.add(b.pivot,d);}
    moved(b.o);
  });
}
function rotMat(axis,a){ // Rodrigues
  const [x,y,z]=V.norm(axis),c=Math.cos(a),s=Math.sin(a),t=1-c;
  return[[t*x*x+c,t*x*y-s*z,t*x*z+s*y],[t*x*y+s*z,t*y*y+c,t*y*z-s*x],[t*x*z-s*y,t*y*z+s*x,t*z*z+c]];
}
const mulMV=(m,p)=>[m[0][0]*p[0]+m[0][1]*p[1]+m[0][2]*p[2],m[1][0]*p[0]+m[1][1]*p[1]+m[1][2]*p[2],m[2][0]*p[0]+m[2][1]*p[1]+m[2][2]*p[2]];
function applyRotate(axis,ang){
  if(TR.manip)return;const M=rotMat(axis,ang);
  TR.base.forEach(b=>{const c=TR.objectLevel?b.pivot:TR.center;
    b.ids.forEach((i,k)=>{b.o.v[i]=V.add(c,mulMV(M,V.sub(b.pos[k],c)));});moved(b.o);});
}
function applyScale(s){ // s: [sx,sy,sz]
  if(TR.manip)return;
  TR.base.forEach(b=>{const c=TR.objectLevel?b.pivot:TR.center;
    b.ids.forEach((i,k)=>{const d=V.sub(b.pos[k],c);b.o.v[i]=[c[0]+d[0]*s[0],c[1]+d[1]*s[1],c[2]+d[2]*s[2]];});moved(b.o);});
}
function snapDelta(d){
  if(!S.snap.on||!S.snap.grid||!TR.ref)return d;const g=S.gridSize,m=axisMask(),any=m[0]||m[1]||m[2];
  const t=V.add(TR.ref,d),r=t.map((v,k)=>(!any||m[k])?Math.round(v/g)*g:v);return V.sub(r,TR.ref);
}
function endTransform(){TR=null;}

/* ---------- exact transform (numeric) ---------- */
function exactTransform(mode,vals,relative){
  const t=needSel();if(!t)return;undoPush();
  beginTransform(mode);
  if(mode==='move'){
    const d=relative?vals:V.sub(vals,TR.ref);applyMove(d);
  }else if(mode==='rotate'){
    const M=[0,1,2].map(k=>vals[k]*Math.PI/180);
    [[[1,0,0],M[0]],[[0,1,0],M[1]],[[0,0,1],M[2]]].forEach(([ax,an])=>{if(an){const base=TR.base;base.forEach(b=>{b.ids.forEach((i,k)=>{b.pos[k]=b.o.v[i].slice();});});applyRotate(ax,an);}});
  }else if(mode==='scale'){applyScale(relative?vals:vals.map(v=>v/100));}
  endTransform();redraw();
}

/* ---------- delete ---------- */
function opDelete(){
  const any=S.objects.some(o=>o.sel||o.sv.size||o.se.size||o.sp.size);if(!any){log('Delete: hech narsa tanlanmagan.');return;}
  undoPush();
  if(S.level==='object'||S.level==='manip'){
    const n=S.objects.filter(o=>o.sel).length;S.objects=S.objects.filter(o=>!o.sel);if(!objById(S.active))S.active=null;log('O‘chirildi: '+n+' ta obyekt.');
  }else{
    S.objects.forEach(o=>{if(o.type!=='mesh')return;
      let kill=new Set();
      if(S.level==='polygon')o.sp.forEach(pi=>kill.add(pi));
      else if(S.level==='edge'){const E=edgesOf(o);o.se.forEach(k=>{const e=E.get(k);if(e)e.polys.forEach(pi=>kill.add(pi));});}
      else if(S.level==='vertex'){o.p.forEach((pl,pi)=>{if(pl.i.some(i=>o.sv.has(i)))kill.add(pi);});}
      if(!kill.size&&!(S.level==='vertex'&&o.sv.size))return;
      const delVerts=S.level==='vertex'?new Set(o.sv):null;
      o.p=o.p.filter((_,pi)=>!kill.has(pi));
      o.sp.clear();o.se.clear();
      if(delVerts){const keepV=new Set();o.p.forEach(pl=>pl.i.forEach(i=>keepV.add(i)));delVerts.forEach(i=>{});}
      touch(o);
      // remove vertices that are now unused AND were part of deleted elements
      const before=o.v.length;o.sv.clear();pruneVerts(o);
      log('O‘chirildi: '+kill.size+' ta poligon ('+o.name+'), '+(before-o.v.length)+' ta vertex.');
    });
  }
  redraw();refreshUI();
}

/* ---------- weld ---------- */
function opWeld(){
  if(S.level!=='vertex'){log('Weld: Vertex darajasida (1) ishlaydi.');return;}
  const t=selTargets();if(!t.length||!t.some(x=>x.ids.length>1)){log('Weld: kamida 2 ta vertex tanlang.');return;}
  undoPush();let merged=0;
  t.forEach(({o,ids})=>{
    const map=o.v.map((_,i)=>i);
    if(S.opt.weldAll){
      const c=V.mul(ids.reduce((a,i)=>V.add(a,o.v[i]),[0,0,0]),1/ids.length),first=ids[0];
      ids.forEach(i=>{map[i]=first;});o.v[first]=c;merged+=ids.length-1;
    }else{
      const thr=S.opt.weldThr,used=new Set();
      ids.forEach(i=>{if(used.has(i))return;ids.forEach(j=>{if(j!==i&&!used.has(j)&&V.len(V.sub(o.v[i],o.v[j]))<=thr){map[j]=i;used.add(j);merged++;}});});
    }
    o.sv=new Set(ids.map(i=>map[i]));weldRemap(o,map);
  });
  log('Weld: '+merged+' ta vertex birlashtirildi.');redraw();refreshUI();
}

/* ---------- flip ---------- */
function opFlip(){
  const sel=S.objects.filter(o=>o.type==='mesh'&&(o.sel||o.sp.size));if(!sel.length){log('Flip: obyekt yoki poligon tanlang.');return;}
  undoPush();let n=0;
  sel.forEach(o=>{const polys=(S.level==='polygon'&&o.sp.size)?[...o.sp].map(i=>o.p[i]).filter(Boolean):o.p;polys.forEach(pl=>{flipPoly(pl);n++;});touch(o);});
  log('Flip: '+n+' ta poligon aylantirildi.');redraw();
}

/* ---------- extrude ---------- */
function opExtrude(amount){
  if(S.level!=='polygon'){log('Extrude: Polygon darajasida (3) ishlaydi.');return;}
  const t=selTargets().filter(x=>x.o.sp.size);if(!t.length){log('Extrude: poligon tanlang.');return;}
  undoPush();
  t.forEach(({o})=>{
    const selp=[...o.sp].filter(pi=>o.p[pi]);const vs=new Set();selp.forEach(pi=>o.p[pi].i.forEach(i=>vs.add(i)));
    const nmap=new Map(),vn=new Map();
    selp.forEach(pi=>{const n=polyNormal(o,o.p[pi]);o.p[pi].i.forEach(i=>{const a=vn.get(i)||[0,0,0];vn.set(i,V.add(a,n));});});
    vs.forEach(i=>{nmap.set(i,o.v.length);const n=V.norm(vn.get(i));o.v.push(V.add(o.v[i],V.mul(n,amount)));if(o.vc)o.vc.push(o.vc[i].slice());});
    // boundary edges of the selection region
    const cnt=new Map(),dir=new Map();
    selp.forEach(pi=>{const pl=o.p[pi],n=pl.i.length;for(let k=0;k<n;k++){const a=pl.i[k],b=pl.i[(k+1)%n],key=edgeKey(a,b);cnt.set(key,(cnt.get(key)||0)+1);dir.set(key,[a,b,pl.m]);}});
    const sides=[];cnt.forEach((c,key)=>{if(c===1){const [a,b,m]=dir.get(key);sides.push({i:[a,b,nmap.get(b),nmap.get(a)],m});}});
    selp.forEach(pi=>{o.p[pi].i=o.p[pi].i.map(i=>nmap.get(i));});
    sides.forEach(s=>o.p.push(s));
    touch(o);
  });
  log('Extrude: '+t.reduce((a,x)=>a+x.o.sp.size,0)+' ta poligon.');redraw();refreshUI();
}

/* ---------- detach / attach ---------- */
function opDetach(){
  if(S.level!=='polygon'){log('Detach: Polygon darajasida ishlaydi.');return;}
  const t=selTargets().filter(x=>x.o.sp.size);if(!t.length){log('Detach: poligon tanlang.');return;}
  undoPush();const created=[];
  t.forEach(({o})=>{
    const sp=[...o.sp].filter(pi=>o.p[pi]),vm=new Map(),n=newObject(uniqueName(o.name+'_part'),'mesh');
    sp.forEach(pi=>{const pl=o.p[pi];n.p.push({i:pl.i.map(i=>{if(!vm.has(i)){vm.set(i,n.v.length);n.v.push(o.v[i].slice());}return vm.get(i);}),m:pl.m});});
    n.pivot=o.pivot.slice();n.smooth=o.smooth;
    const spSet=new Set(sp);o.p=o.p.filter((_,pi)=>!spSet.has(pi));o.sp.clear();o.sv.clear();o.se.clear();touch(o);pruneVerts(o);created.push(n);
  });
  S.objects.forEach(o=>o.sel=false);created.forEach(n=>{S.objects.push(n);n.sel=true;S.active=n.id;});
  log('Detach: '+created.length+' ta yangi obyekt.');redraw();refreshUI();
}
function opAttach(){
  const sel=S.objects.filter(o=>o.sel&&o.type==='mesh');if(sel.length<2){log('Attach: kamida 2 ta obyektni tanlang.');return;}
  undoPush();
  const host=objById(S.active)&&objById(S.active).sel&&objById(S.active).type==='mesh'?objById(S.active):sel[0];
  sel.forEach(o=>{if(o===host)return;const b=host.v.length;o.v.forEach(p=>host.v.push(p));
    if(host.vc||o.vc){if(!host.vc)host.vc=host.v.slice(0,b).map(()=>[255,255,255,255]);o.v.forEach((_,i)=>host.vc.push(o.vc?o.vc[i]:[255,255,255,255]));}
    o.p.forEach(pl=>host.p.push({i:pl.i.map(i=>i+b),m:pl.m}));});
  S.objects=S.objects.filter(o=>!sel.includes(o)||o===host);touch(host);S.active=host.id;host.sel=true;
  log('Attach: '+sel.length+' ta obyekt birlashtirildi → '+host.name);redraw();refreshUI();
}

/* ---------- break / connect / insert ---------- */
function opBreak(){
  if(S.level!=='vertex'){log('Break: Vertex darajasida ishlaydi.');return;}
  const t=needSel('Break: vertex tanlang.');if(!t)return;undoPush();let n=0;
  t.forEach(({o,ids})=>{const set=new Set(ids);
    set.forEach(vi=>{const users=o.p.filter(pl=>pl.i.includes(vi));
      users.forEach((pl,k)=>{if(k===0)return;const nv=o.v.length;o.v.push(o.v[vi].slice());if(o.vc)o.vc.push(o.vc[vi].slice());pl.i=pl.i.map(i=>i===vi?nv:i);n++;});});
    touch(o);});
  log('Break: '+n+' ta vertex ajratildi.');redraw();
}
function opConnect(){
  if(S.level!=='vertex'){log('Connect: Vertex darajasida ishlaydi.');return;}
  const t=selTargets();if(t.length!==1||t[0].ids.length!==2){log('Connect: aynan 2 ta vertex tanlang.');return;}
  const {o,ids}=t[0],[a,b]=ids;
  const pl=o.p.find(p=>p.i.includes(a)&&p.i.includes(b));if(!pl){log('Connect: ikkala vertex bitta poligonda bo‘lishi kerak.');return;}
  const n=pl.i.length,ia=pl.i.indexOf(a),ib=pl.i.indexOf(b);
  if((ia+1)%n===ib||(ib+1)%n===ia){log('Connect: bu vertexlar allaqachon qo‘shni.');return;}
  undoPush();
  const ring=(from,to)=>{const r=[];let k=from;for(;;){r.push(pl.i[k]);if(k===to)break;k=(k+1)%n;}return r;};
  const p1=ring(ia,ib),p2=ring(ib,ia);
  const idx=o.p.indexOf(pl);o.p.splice(idx,1,{i:p1,m:pl.m},{i:p2,m:pl.m});touch(o);log('Connect: poligon ikkiga bo‘lindi.');redraw();
}
function opInsert(){
  if(S.level!=='edge'){log('Insert: Edge darajasida (2) ishlaydi.');return;}
  const t=selTargets().filter(x=>x.o.se.size);if(!t.length){log('Insert: qirra tanlang.');return;}
  undoPush();let n=0;
  t.forEach(({o})=>{
    const keys=[...o.se],mid=new Map();
    keys.forEach(k=>{const [a,b]=k.split('_').map(Number);mid.set(k,o.v.length);o.v.push(V.lerp(o.v[a],o.v[b],.5));if(o.vc)o.vc.push(o.vc[a].map((x,j)=>(x+o.vc[b][j])/2));n++;});
    o.p.forEach(pl=>{const out=[],m=pl.i.length;for(let k=0;k<m;k++){const a=pl.i[k],b=pl.i[(k+1)%m];out.push(a);const key=edgeKey(a,b);if(mid.has(key))out.push(mid.get(key));}pl.i=out;});
    o.se.clear();o.sv=new Set(mid.values());touch(o);
  });
  S.level='vertex';syncLevelUI();log('Insert: '+n+' ta vertex qo‘shildi.');redraw();
}

/* ---------- mirror / align / cleanup ---------- */
function opMirror(axisName,copy,usePivot){
  const ax='XYZ'.indexOf(axisName);
  const targets=S.level==='polygon'?S.objects.filter(o=>o.type==='mesh'&&o.sp.size):S.objects.filter(o=>o.sel&&o.type==='mesh');
  if(!targets.length){log('Mirror: obyekt yoki poligon tanlang.');return;}
  undoPush();
  const mirrorPt=(p,c)=>{const q=p.slice();q[ax]=2*c-q[ax];return q;};
  targets.forEach(o=>{
    const c=usePivot?o.pivot[ax]:0;
    if(S.level==='polygon'){
      const sp=[...o.sp].filter(pi=>o.p[pi]),vm=new Map(),np=[];
      sp.forEach(pi=>{const pl=o.p[pi];np.push({i:pl.i.map(i=>{if(!vm.has(i)){vm.set(i,o.v.length);o.v.push(mirrorPt(o.v[i],c));if(o.vc)o.vc.push(o.vc[i].slice());}return vm.get(i);}).reverse(),m:pl.m});});
      np.forEach(p=>o.p.push(p));touch(o);
    }else if(copy){
      const n=cloneObject(o);n.name=uniqueName(o.name+'_mirror');n.v=n.v.map(p=>mirrorPt(p,c));n.pivot=mirrorPt(n.pivot,c);n.p.forEach(flipPoly);
      S.objects.push(n);
    }else{o.v=o.v.map(p=>mirrorPt(p,c));o.pivot=mirrorPt(o.pivot,c);o.p.forEach(flipPoly);touch(o);}
  });
  log('Mirror '+axisName+(copy?' (nusxa bilan)':'')+'.');redraw();refreshUI();
}
function opAlign(kind){
  const t=needSel('Align: elementlarni tanlang.');if(!t)return;undoPush();
  const vp=activeView,B=vp?vp.basis():null;
  const all=bounds(t.map(({o,ids})=>[o,ids]));if(!all)return;
  let flat; // axes to flatten (indices) ; or direction
  if(kind==='Axis'){const a='XYZ'.indexOf(S.opt.alignAxis);t.forEach(({o,ids})=>{ids.forEach(i=>{o.v[i][a]=all.c[a];});moved(o);});}
  else if(kind==='Line'){const a='XYZ'.indexOf(S.opt.alignAxis);t.forEach(({o,ids})=>{ids.forEach(i=>{for(let k=0;k<3;k++)if(k!==a)o.v[i][k]=all.c[k];});moved(o);});}
  else if(kind==='Plane'){const e=V.sub(all.mx,all.mn),a=e.indexOf(Math.min(...e));t.forEach(({o,ids})=>{ids.forEach(i=>{o.v[i][a]=all.c[a];});moved(o);});}
  else if(kind==='View'&&B){t.forEach(({o,ids})=>{ids.forEach(i=>{const d=V.dot(V.sub(o.v[i],all.c),B.f);o.v[i]=V.sub(o.v[i],V.mul(B.f,d));});moved(o);});}
  log('Align '+kind+'.');redraw();
}
function opCleanup(){
  const objs=S.objects.filter(o=>o.type==='mesh'&&(o.sel||!S.objects.some(x=>x.sel)));
  undoPush();let rv=0,rp=0;
  objs.forEach(o=>{const v0=o.v.length,p0=o.p.length;
    const w=weldMesh({v:o.v,p:o.p},1e-5);o.v=w.v;o.p=w.p;o.vc=null;
    const seen=new Set();o.p=o.p.filter(pl=>{const k=[...pl.i].sort((a,b)=>a-b).join(',');if(seen.has(k))return false;seen.add(k);return true;});
    o.sv.clear();o.se.clear();o.sp.clear();touch(o);pruneVerts(o);rv+=v0-o.v.length;rp+=p0-o.p.length;});
  log('Cleanup: '+rv+' vertex va '+rp+' poligon olib tashlandi.');redraw();refreshUI();
}

/* ---------- select ---------- */
function opSelectAll(){
  if(S.level==='object'||S.level==='manip'){S.objects.forEach(o=>{if(!o.hidden&&!o.disabled)o.sel=true;});if(!S.active&&S.objects.length)S.active=S.objects[0].id;}
  else editable().forEach(o=>{if(o.type!=='mesh')return;o.sel=true;

function selectConnected(o,startPoly){
  const E=edgesOf(o),seen=new Set([startPoly]),st=[startPoly];

function form(fields){
  const root=document.createElement('div');const get={};
  fields.forEach(f=>{
    const row=document.createElement('div');row.className='fr';
    if(f.type==='html'){row.innerHTML=f.html;root.appendChild(row);return;}
    const l=document.createElement('label');l.textContent=f.label;row.appendChild(l);
    let inp;
    if(f.type==='sel'){inp=document.createElement('select');f.opts.forEach(o=>{const op=document.createElement('option');const [v,t]=Array.isArray(o)?o:[o,o];op.value=v;op.textContent=t;inp.appendChild(op);});inp.value=f.v;}
    else if(f.type==='chk'){inp=document.createElement('input');inp.type='checkbox';inp.checked=!!f.v;}
    else{inp=document.createElement('input');inp.type=f.type==='num'?'number':f.type==='color'?'color':'text';inp.value=f.v;
      if(f.type==='num'){if(f.step!=null)inp.step=f.step;if(f.min!=null)inp.min=f.min;if(f.max!=null)inp.max=f.max;}}
    row.appendChild(inp);root.appendChild(row);
    get[f.k]=()=>f.type==='num'?parseFloat(inp.value):f.type==='chk'?inp.checked:inp.value;
  });
  return{el:root,values:()=>{const o={};Object.keys(get).forEach(k=>o[k]=get[k]());return o;}};
}

/* ---------- viewport mouse / keyboard interaction ---------- */
let D=null;let lastMouse={vp:null,x:0,y:0};
const dragPx=4;
function localPos(vp,e){const r=vp.cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
function snapPoint(p){ if(S.snap.on&&S.snap.grid){const g=S.gridSize;return p.map(v=>Math.round(v/g)*g);}return p;}
function planeAt(vp,mx,my){
  const n=vp.constructionN(),P=[0,0,0];
  let pt=vp.planePoint(mx,my,P,n);if(!pt)return null;
  return pt;
}
function bindVP(vp){
  vp.title.addEventListener('mousedown',e=>{e.stopPropagation();});
  vp.title.addEventListener('click',e=>{e.stopPropagation();activateView(vp);viewTypeMenu(vp,e.clientX,e.clientY);});
  vp.el.addEventListener('contextmenu',e=>e.preventDefault());
  vp.el.addEventListener('mousedown',e=>{
    if(e.target===vp.title)return;
    activateView(vp);const [mx,my]=localPos(vp,e);
    D={vp,btn:e.button,x0:mx,y0:my,x:mx,y:my,moved:false,shift:e.shiftKey,ctrl:e.ctrlKey,alt:e.altKey,mode:null};
    const t=S.tool;
    if(e.button===1||(e.button===0&&t==='pan')){D.mode='pan';D.t0=vp.target.slice();}
    else if(e.button===2){D.mode=vp.persp?'orbit':'pan';D.t0=vp.target.slice();D.yaw0=vp.yaw;D.pitch0=vp.pitch;}
    else if(e.button===0&&e.altKey&&vp.persp){D.mode='orbit';D.t0=vp.target.slice();D.yaw0=vp.yaw;D.pitch0=vp.pitch;}
    else if(e.button===0){startLeft(vp,mx,my,e);}
    e.preventDefault();
  });
  vp.el.addEventListener('mousemove',e=>{
    const [mx,my]=localPos(vp,e);lastMouse={vp,x:mx,y:my};
    if(!D){const p=planeAt(vp,mx,my);if(p)setCoords(vp,p);if(S.tool==='polyline'&&vp.rubber&&vp.rubber.kind==='poly'){vp.rubber.cur=[mx,my];redraw();}
      if(vp.rubber&&vp.rubber.kind==='polycreate'){const q=snapPoint(planeAt(vp,mx,my)||[0,0,0]);const B=vp.basis();const pr=vp.project(q,B);vp.rubber.cur=pr;redraw();}}
  });
  vp.el.addEventListener('wheel',e=>{
    e.preventDefault();const [mx,my]=localPos(vp,e);const f=e.deltaY<0?1.15:1/1.15;zoomAt(vp,mx,my,f);activateView(vp);
  },{passive:false});
  vp.el.addEventListener('dblclick',e=>{if(S.tool==='polyline'||S.tool.startsWith('poly:'))return;});
}
window.addEventListener('mousemove',e=>{if(D)dragMove(e);});
window.addEventListener('mouseup',e=>{if(D)dragEnd(e);});
function zoomAt(vp,mx,my,f){
  if(vp.persp){vp.dist=clamp(vp.dist/f,.2,5000);}
  else{
    const B=vp.basis(),P=[0,0,0],n=B.f,before=vp.planePoint(mx,my,vp.target,n,B);
    vp.zoom=clamp(vp.zoom*f,.5,20000);
    const after=vp.planePoint(mx,my,vp.target,n,B);
    if(before&&after)vp.target=V.add(vp.target,V.sub(before,after));
  }
  redraw();
}
function setCoords(vp,p){const el=$('stCoord');if(el)el.textContent='X '+p[0].toFixed(2)+'  Y '+p[1].toFixed(2)+'  Z '+p[2].toFixed(2);}
function startLeft(vp,mx,my,e){
  const t=S.tool;
  if(t.startsWith('create:')){D.mode='create';D.start=planeAt(vp,mx,my);return;}
  if(t.startsWith('poly:')){D.mode='polyclick';return;}
  if(t==='move'||t==='rotate'||t==='scale'){
    // hit-test: drag selection if clicking on it, otherwise select
    let hitSelected=false;
    if(S.level==='object'||S.level==='manip'){const o=pickObject(vp,mx,my);if(o){if(!o.sel){if(!e.shiftKey)S.objects.forEach(x=>x.sel=false);o.sel=true;S.active=o.id;}hitSelected=true;}}
    else{
      const sel=selTargets().length;
      let hit=S.level==='vertex'?pickVertex(vp,mx,my):S.level==='edge'?pickEdge(vp,mx,my):pickPoly(vp,mx,my);
      if(hit){
        const o=hit.o;const isSel=S.level==='vertex'?o.sv.has(hit.i):S.level==='edge'?o.se.has(hit.key):o.sp.has(hit.pi);
        if(!isSel){clickSelect(vp,mx,my,e.shiftKey,false);}
        hitSelected=true;
      }else hitSelected=sel>0&&false;
    }
    if(hitSelected&&selTargets().length){
      undoPush();D.mode='xform';beginTransform(t);D.vp0=vp;
      const B=vp.basis();D.B=B;D.depthP=TR.ref||[0,0,0];
      refreshUI();redraw();return;
    }
    D.mode='select';D.shape='rect';return;
  }
  if(t==='circle'){D.mode='select';D.shape='circle';return;}
  if(t==='quadr'){D.mode='select';D.shape='rect';return;}
  if(t==='polyline'){D.mode='polysel';return;}
  if(t==='separated'){D.mode='sepclick';return;}
  D.mode='select';D.shape='rect';
}
function dragMove(e){
  const vp=D.vp,[mx,my]=localPos(vp,e);D.x=mx;D.y=my;
  const dx=mx-D.x0,dy=my-D.y0;
  if(!D.moved&&Math.hypot(dx,dy)>dragPx)D.moved=true;
  if(D.mode==='pan'){
    const B=vp.basis(),k=vp.unitsPerPx(vp.target,B);
    vp.target=V.add(D.t0,V.add(V.mul(B.r,-dx*k),V.mul(B.u,dy*k)));redraw();
  }else if(D.mode==='orbit'){
    vp.yaw=D.yaw0-dx*.01;vp.pitch=clamp(D.pitch0+dy*.01,-1.5,1.5);redraw();
  }else if(D.mode==='select'&&D.moved){
    vp.rubber=D.shape==='circle'?{kind:'circle',x0:D.x0,y0:D.y0,x1:mx,y1:my}:{kind:'rect',x0:D.x0,y0:D.y0,x1:mx,y1:my};redraw();
  }else if(D.mode==='xform'&&D.moved){doTransform(vp,dx,dy,e);}
  else if(D.mode==='create'&&D.moved){vp.rubber={kind:'create',x0:D.x0,y0:D.y0,x1:mx,y1:my};redraw();}
}
function doTransform(vp,dx,dy,e){
  const B=D.B,m=axisMask(),any=m[0]||m[1]||m[2],kind=TR.kind;
  if(kind==='move'){
    const k=vp.unitsPerPx(D.depthP,B);let d=V.add(V.mul(B.r,dx*k),V.mul(B.u,-dy*k));
    if(any){ // constrain to enabled axes; project the free motion onto them
      if(S.coord==='screen'){const vv=[0,0,0];if(m[0])vv[0]=1;if(m[1])vv[1]=1;
        const dd=V.add(V.mul(B.r,m[0]?dx*k:0),V.mul(B.u,m[1]?-dy*k:0));d=dd;}
      else d=d.map((v,i)=>m[i]?v:0);
      if(!vp.persp&&(d[0]===0&&d[1]===0&&d[2]===0)&&false){}
    }
    d=snapDelta(d);
    if(S.snap.on&&S.snap.vert&&S.level==='vertex'){
      const t0=TR.base[0];if(t0&&t0.ids.length){const cur=V.add(t0.pos[0],d),pp=vp.project(cur,B);
        if(pp){let best=null,bd=10;editable().forEach(o=>{if(o.type!=='mesh')return;const P=objProj(o,vp,B);
          for(let i=0;i<o.v.length;i++){if(o===t0.o&&t0.ids.includes(i))continue;if(!P.ok[i])continue;const dd=Math.hypot(P.sx[i]-pp[0],P.sy[i]-pp[1]);if(dd<bd){bd=dd;best=o.v[i];}}});
          if(best)d=V.sub(best,t0.pos[0]);}}
    }
    applyMove(d);
    const el=$('stCoord');if(el)el.textContent='Δ '+d.map(v=>v.toFixed(3)).join(', ');
  }else if(kind==='rotate'){
    let axis=B.f.slice();
    if(any){const c=m.filter(Boolean).length;if(c===1)axis=[m[0]?1:0,m[1]?1:0,m[2]?1:0];}
    // restore base then rotate
    TR.base.forEach(b=>{b.ids.forEach((i,k)=>{b.o.v[i]=b.pos[k].slice();});});
    applyRotate(axis,dx*.012);
  }else if(kind==='scale'){
    const f=Math.exp(dx*.006);const s=any?m.map(v=>v?f:1):[f,f,f];
    TR.base.forEach(b=>{b.ids.forEach((i,k)=>{b.o.v[i]=b.pos[k].slice();});});
    applyScale(s);
  }
  redraw();
}
function dragEnd(e){
  const d=D;D=null;const vp=d.vp;vp.rubber=vp.rubber&&(vp.rubber.kind==='polycreate'||vp.rubber.kind==='poly')?vp.rubber:null;
  const [mx,my]=localPos(vp,e);
  if(d.btn!==0){redraw();

    refreshUI();redraw();return;

    if(hit){if(!d.shift){clearSelection(S.level!=='object'&&S.level!=='manip');}

    r.pts.push([mx,my]);r.cur=[mx,my];redraw();return;

  if(d.mode==='create'){finishCreate(vp,d,mx,my);return;}

/* primitive creation */
function finishCreate(vp,d,mx,my){
  vp.rubber=null;const kind=S.tool.split(':')[1];
  undoPush();
  let p0=d.start||[0,0,0],p1=planeAt(vp,mx,my)||p0;
  p0=snapPoint(p0);p1=snapPoint(p1);
  const dv=V.sub(p1,p0),ext=dv.map(Math.abs);
  const tiny=!d.moved||V.len(dv)<1e-3;
  const o=S.opt;const dims={};
  const up=vp.type==='top'||vp.type==='bottom'||vp.persp;
  let center=p0.slice();
  const rad=tiny?1:Math.max(.05,V.len(dv));
  switch(kind){
    case'box':{
      let e=ext.slice();
      if(tiny)e=[2,2,2];else{const nz=e.filter(v=>v<1e-6).length?e:e;const idx=e.map((v,i)=>v<1e-6?i:-1).filter(i=>i>=0)[0];
        const others=e.filter(v=>v>1e-6);const avg=others.reduce((a,b)=>a+b,0)/Math.max(1,others.length);if(idx!==undefined)e[idx]=avg;e=e.map(v=>Math.max(v,.02));}
      dims.sx=e[0];dims.sy=e[1];dims.sz=e[2];center=tiny?p0.slice():V.add(p0,V.mul(dv,.5));
      if(up)center[2]=center[2]+dims.sz/2;break;}
    case'plane':{let e=ext.slice();if(tiny)e=[4,4,4];const ax=e.map((v,i)=>v<1e-6?i:-1).filter(i=>i>=0);
      dims.sx=Math.max(.05,e[0]||e[2]);dims.sy=Math.max(.05,e[1]||e[2]);dims.nx=o.segs>0?Math.min(40,Math.max(1,Math.round(o.segs/4))):4;dims.ny=dims.nx;
      center=tiny?p0.slice():V.add(p0,V.mul(dv,.5));break;}
    case'cylinder':case'cone':case'tube':dims.r=rad;dims.h=rad*2;dims.seg=o.segs;dims.r2=rad*.7;if(up)center[2]+=dims.h/2;break;
    case'sphere':dims.r=rad;dims.seg=o.segs;dims.rings=Math.max(4,Math.round(o.segs*.6));if(up)center[2]+=rad;break;
    case'torus':dims.R=rad;dims.r=rad*.35;dims.seg=o.segs+4;dims.sides=Math.max(6,Math.round(o.segs*.6));if(up)center[2]+=dims.r;break;
  }
  const obj=createPrimitive(kind,center,dims);if(!obj){UNDO.pop();return;}
  addObject(obj,true);
  log('Yaratildi: '+obj.name+' ('+obj.v.length+' vertex, '+obj.p.length+' poligon)');
  refreshUI();redraw();
}

function addPolyPoint(vp,mx,my){
  let p=null;const B=vp.basis();

  if(near)p=near.o.v[near.i].slice();else{const q=planeAt(vp,mx,my);if(!q)return;p=snapPoint(q);}
  const r=vp.rubber&&vp.rubber.kind==='polycreate'?vp.rubber:(vp.rubber={kind:'polycreate',pts:[],cur:null});
  r.pts.push(p);
  const mode=S.tool.split(':')[1],kind=S.opt.polyKind;

function finishPolyCreate(vp){
  const r=vp.rubber;if(!r||r.pts.length<3){vp.rubber=null;redraw();return;}

}

/* ---------- OBJ ---------- */
function parseOBJ(text,yup){
  const objs=[],matIdx=new Map();S.mats.forEach((m,i)=>matIdx.set(m.name,i));
  const pos=[];let cur=null,curMat=0;
  const conv=p=>yup?[p[0],-p[2],p[1]]:p;
  const start=n=>{cur={name:n||'obj'+(objs.length+1),vmap:new Map(),v:[],p:[]};objs.push(cur);};
  text.split(/\r?\n/).forEach(line=>{
    const t=line.trim().split(/\s+/);if(!t[0]||t[0][0]==='#')return;
    if(t[0]==='v')pos.push(conv([parseFloat(t[1]),parseFloat(t[2]),parseFloat(t[3])]));
    else if(t[0]==='o'||t[0]==='g'){if(cur&&!cur.p.length&&!cur.v.length){cur.name=t.slice(1).join('_')||cur.name;}else start(t.slice(1).join('_'));}
    else if(t[0]==='usemtl'){const n=t.slice(1).join(' ');if(!matIdx.has(n)){matIdx.set(n,S.mats.length);S.mats.push({name:n,color:[190,190,190],tex:'',alpha:255});}curMat=matIdx.get(n);}
    else if(t[0]==='f'){
      if(!cur)start();
      const ids=t.slice(1).map(s=>{let k=parseInt(s.split('/')[0],10);if(k<0)k=pos.length+k+1;k--;return k;}).filter(k=>k>=0&&k<pos.length);
      if(ids.length<3)return;
      const loc=ids.map(k=>{let j=cur.vmap.get(k);if(j===undefined){j=cur.v.length;cur.v.push(pos[k].slice());cur.vmap.set(k,j);}return j;});
      cur.p.push({i:loc,m:curMat});
    }
  });
  return objs.filter(o=>o.p.length);
}
function toOBJ(yup){
  const meshes=S.objects.filter(o=>o.type==='mesh'&&!o.hidden&&o.p.length);let out='# ZModeler Web OBJ export\r\n',base=1;
  const useMtl=S.mats.length>1||S.mats.some(m=>m.tex);
  if(useMtl)out+='mtllib '+baseName()+'.mtl\r\n';
  const cv=p=>yup?[p[0],p[2],-p[1]]:p;
  meshes.forEach(o=>{
    out+='o '+o.name.replace(/\s+/g,'_')+'\r\n';o.v.forEach(p=>{const q=cv(p);out+='v '+q[0].toFixed(6)+' '+q[1].toFixed(6)+' '+q[2].toFixed(6)+'\r\n';});
    let lastM=-1;o.p.forEach(pl=>{if(useMtl&&pl.m!==lastM){out+='usemtl '+(S.mats[pl.m]?S.mats[pl.m].name:'Default').replace(/\s+/g,'_')+'\r\n';lastM=pl.m;}
      out+='f '+pl.i.map(i=>i+base).join(' ')+'\r\n';});
    base+=o.v.length;});
  let mtl='';if(useMtl)S.mats.forEach(m=>{mtl+='newmtl '+m.name.replace(/\s+/g,'_')+'\r\nKd '+(m.color[0]/255).toFixed(4)+' '+(m.color[1]/255).toFixed(4)+' '+(m.color[2]/255).toFixed(4)+'\r\n'+(m.tex?'map_Kd '+m.tex+'.png\r\n':'')+'\r\n';});
  return{obj:out,mtl:useMtl?mtl:null};
}
function toSTL(){
  const tris=[];S.objects.forEach(o=>{if(o.type!=='mesh'||o.hidden)return;o.p.forEach(pl=>triangulate(pl).forEach(t=>tris.push(t.map(i=>o.v[i]))));});
  const buf=new ArrayBuffer(84+tris.length*50),dv=new DataView(buf);dv.setUint32(80,tris.length,true);
  tris.forEach((t,k)=>{const n=V.norm(V.cross(V.sub(t[1],t[0]),V.sub(t[2],t[0]))),o=84+k*50;
    [n,t[0],t[1],t[2]].forEach((v,j)=>{for(let q=0;q<3;q++)dv.setFloat32(o+j*12+q*4,v[q],true);});});

/* ---------- DFF export (RenderWare 3.6, GTA SA) ---------- */
function buildMeshGeometry(o){
  const nrmRaw=o.p.map(pl=>{let x=0,y=0,z=0;const n=pl.i.length;for(let k=0;k<n;k++){const a=o.v[pl.i[k]],b=o.v[pl.i[(k+1)%n]];x+=(a[1]-b[1])*(a[2]+b[2]);y+=(a[2]-b[2])*(a[0]+b[0]);z+=(a[0]-b[0])*(a[1]+b[1]);}return[x,y,z];});
  const nrmU=nrmRaw.map(V.norm);
  const dom=nrmU.map(n=>{const a=n.map(Math.abs);return a[0]>=a[1]&&a[0]>=a[2]?0:a[1]>=a[2]?1:2;});
  const uses=o.v.map(()=>[]);
  o.p.forEach((pl,pi)=>pl.i.forEach(i=>uses[i].push(pi)));
  const outV=[],outN=[],outUV=[],outC=[],cornerMap=new Map(); // key vi|cluster -> out index
  const cosT=o.smooth?-2:Math.cos(48*Math.PI/180);
  const clusterOf=new Map(); // `${vi}|${pi}` -> out idx
  o.v.forEach((p,vi)=>{
    const clusters=[];
    uses[vi].forEach(pi=>{
      let c=clusters.find(c=>c.dom===(o.smooth?c.dom:dom[pi])&&V.dot(c.n0,nrmU[pi])>cosT);
      if(!c){c={n0:nrmU[pi],dom:dom[pi],sum:[0,0,0],polys:[]};clusters.push(c);}
      c.sum=V.add(c.sum,nrmRaw[pi]);c.polys.push(pi);});
    if(!clusters.length){clusters.push({n0:[0,0,1],dom:2,sum:[0,0,1],polys:[]});}
    clusters.forEach(c=>{const idx=outV.length;
      const q=V.sub(p,o.pivot);outV.push(q);outN.push(V.norm(c.sum));
      const a=p,d=c.dom;const uv=d===0?[a[1],-a[2]]:d===1?[a[0],-a[2]]:[a[0],-a[1]];outUV.push([uv[0]/4,uv[1]/4]);
      outC.push(o.vc&&o.vc[vi]?o.vc[vi]:[255,255,255,255]);
      c.polys.forEach(pi=>clusterOf.set(vi+'|'+pi,idx));});
  });
  if(outV.length>65535)throw new Error('"'+o.name+'": DFF uchun juda ko‘p vertex ('+outV.length+' > 65535). Obyektni bo‘ling.');
  const usedMats=[...new Set(o.p.map(pl=>pl.m||0))].sort((a,b)=>a-b),mapM=new Map(usedMats.map((m,k)=>[m,k]));
  const tris=[];o.p.forEach((pl,pi)=>triangulate(pl).forEach(([a,b,c])=>{tris.push(clusterOf.get(a+'|'+pi),clusterOf.get(b+'|'+pi),clusterOf.get(c+'|'+pi),mapM.get(pl.m||0));}));
  const g={pos:new Float32Array(outV.flat()),nrm:new Float32Array(outN.flat()),uv:new Float32Array(outUV.flat()),day:null,night:null,tris,fx2d:null,
    materials:usedMats.map(m=>{const mm=S.mats[m]||S.mats[0];return{color:[mm.color[0],mm.color[1],mm.color[2],mm.alpha==null?255:mm.alpha],tex:mm.tex||'',mask:''};})};
  if(o.vc&&o.vc.length)g.day=new Uint8Array(outC.flat());
  return g;
}
function buildDffBytes(){
  const items=S.objects.filter(o=>!o.hidden&&((o.type==='mesh'&&o.p.length)||o.type==='dummy'));
  if(!items.length)throw new Error('Eksport uchun obyekt yo‘q.');
  const frames=[{name:'',pos:[0,0,0],parent:-1}],geoms=[],atomics=[];
  items.forEach(o=>{
    frames.push({name:o.name.slice(0,23),pos:o.pivot.slice(),parent:0});
    if(o.type==='mesh'){geoms.push(buildMeshGeometry(o));atomics.push({frame:frames.length-1,geom:geoms.length-1});}
  });
  if(!geoms.length)throw new Error('DFF uchun kamida bitta mesh kerak.');
  const clump=DFF.buildClump({frames,geoms,atomics},0x1803FFFF);
  return DFF.serialize([clump]);
}

/* ---------- DFF import ---------- */
function importDFF(bytes,name){
  const dff=DFF.parseDff(bytes);
  const mats=new Map();S.mats.forEach((m,i)=>mats.set(m.name+'|'+m.color.join(',')+'|'+m.tex,i));
  const W=frameWorlds(dff.frames),created=[];
  dff.atomics.forEach((at,ai)=>{
    const g=dff.geoms[at.geom];if(!g||g.native||!g.pos){log('DFF: native geometriya o‘tkazib yuborildi.');return;}
    const fr=dff.frames[at.frame]||{name:''},M=W[at.frame];
    const o=newObject(uniqueName(fr.name||name||'dff_obj'),'mesh');
    for(let i=0;i<g.nV;i++)o.v.push(xp(M,[g.pos[i*3],g.pos[i*3+1],g.pos[i*3+2]]));
    const mi=(g.materials||[]).map((m,k)=>{const nm=(m.tex||'mat'+k);const key=nm+'|'+m.color.slice(0,3).join(',')+'|'+(m.tex||'');
      if(!mats.has(key)){mats.set(key,S.mats.length);S.mats.push({name:nm,color:m.color.slice(0,3),tex:m.tex||'',alpha:m.color[3]});}return mats.get(key);});
    for(let i=0;i<g.nTri;i++){const a=g.tris[i*4],b=g.tris[i*4+1],c=g.tris[i*4+2],m=g.tris[i*4+3];o.p.push({i:[a,b,c],m:mi[m]||0});}
    o.pivot=[M[12],M[13],M[14]];o.smooth=false;
    if(g.dayColors){o.vc=[];for(let i=0;i<g.nV;i++)o.vc.push([g.dayColors[i*4],g.dayColors[i*4+1],g.dayColors[i*4+2],g.dayColors[i*4+3]]);}
    const w=weldMesh({v:o.v,p:o.p},1e-5);
    if(!o.vc){o.v=w.v;o.p=w.p;}
    created.push(o);
  });
  const used=new Set(dff.atomics.map(a=>a.frame));
  dff.frames.forEach((f,i)=>{if(i===0&&f.parent<0&&!f.name)return;if(!used.has(i)&&f.name){const d=newObject(uniqueName(f.name),'dummy');d.pivot=[W[i][12],W[i][13],W[i][14]];created.push(d);}});
  return created;
}
function matFromFrame(f){const r=f.rot,p=f.pos;return[r[0],r[1],r[2],0,r[3],r[4],r[5],0,r[6],r[7],r[8],0,p[0],p[1],p[2],1];}
function mmul(a,b){const o=new Array(16).fill(0);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
const xp=(m,p)=>[m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];
function frameWorlds(frames){const W=new Array(frames.length);
  const get=i=>{if(W[i])return W[i];const l=matFromFrame(frames[i]),p=frames[i].parent;return W[i]=(p>=0&&p<frames.length&&p!==i)?mmul(get(p),l):l;};
  frames.forEach((_,i)=>get(i));return W;}

          if(!arr.length)throw new Error('OBJ ichida poligon topilmadi.');addObjs(arr,'OBJ import: '+arr.length+' ta obyekt, '+arr.reduce((a,o)=>a+o.p.length,0)+' poligon.');}catch(e){log('Xato: '+e.message);alert(e.message);}};r.readAsText(f);});
    }else if(ext==='dff'){
      const r=new FileReader();r.onload=()=>{try{const arr=importDFF(new Uint8Array(r.result),f.name.replace(/\.dff$/i,''));if(!arr.length)throw new Error('DFF ichida mesh topilmadi.');

    }else alert('Qo‘llab-quvvatlanadigan formatlar: .dff, .obj, .zmw');
  });

function fileExport(){
  const meshCount=S.objects.filter(o=>o.type==='mesh'&&!o.hidden&&o.p.length).length;

  const f=form([{k:'fmt',label:'Format (filter)',type:'sel',opts:[['dff','GTA San Andreas DFF (*.dff)'],['obj','Wavefront OBJ (*.obj)'],['stl','STL (*.stl)'],['zmw','ZModeler Web scene (*.zmw)']],v:'dff'},

    const v=f.values(),nm=(v.name||'model').replace(/[^\w\-]+/g,'_');

      if(v.fmt==='dff'){const bytes=buildDffBytes();download(new Blob([bytes],{type:'application/octet-stream'}),nm+'.dff');log('DFF eksport: '+nm+'.dff ('+bytes.length+' bayt). Teksturalar TXD da alohida bo‘lishi kerak (material nomi = tekstura nomi).');}
      else if(v.fmt==='obj'){const r=toOBJ(v.yup);S.fileName=nm;download(new Blob([r.obj],{type:'text/plain'}),nm+'.obj');if(r.mtl)setTimeout(()=>download(new Blob([r.mtl],{type:'text/plain'}),nm+'.mtl'),400);log('OBJ eksport: '+nm+'.obj');}

  var p=d.querySelector('p');if(p)p.textContent=txt;
 }
 function hideLock(){var d=document.getElementById('sl-modal');if(!d)return;d.remove();showingLock=false;document.body.style.overflow=(showingVpn||showingBlock)?'hidden':'';}
 function showBlock(msg){
  if(showingLock)return;
  var txt=(msg&&String(msg).trim())?String(msg):getCachedMsg(blkMsgKey(),DEFAULT_BLOCK_MSG);
  var d=document.getElementById('bk-modal');
  if(!d){
   var vb=document.getElementById('vb-modal');if(vb)vb.remove();showingVpn=false;
   d=document.createElement('div');d.id='bk-modal';
   d.innerHTML='<div class="bk-box"><div class="bk-ic">🚫</div><h2>Akkauntingiz bloklangan</h2><p></p><p class="bk-sub">Bu xato deb hisoblasangiz, administrator bilan bog‘laning.</p></div>';
   document.body.appendChild(d);document.body.style.overflow='hidden';
  }
  showingBlock=true;
  var p=d.querySelector('p');if(p)p.textContent=txt;
 }
 function hideBlock(){var d=document.getElementById('bk-modal');if(!d)return;d.remove();showingBlock=false;document.body.style.overflow=(showingLock||showingVpn)?'hidden':'';}
 function showVpn(){
  if(showingVpn||showingLock||showingBlock||document.getElementById('vb-modal'))return;showingVpn=true;
  var d=document.createElement('div');d.id='vb-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛡️</div><h2>VPN/Proksi orqali kirish taqiqlangan</h2><p>Saytdan foydalanish uchun VPN yoki proksi dasturini o‘chirib, sahifani qayta yuklang.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideVpn(){var d=document.getElementById('vb-modal');if(!d)return;d.remove();showingVpn=false;document.body.style.overflow=(showingLock||showingBlock)?'hidden':'';}
 function checkVpn(){
  return new Promise(function(res){
   var c=(typeof AbortController!=='undefined')?new AbortController():null,t=setTimeout(function(){if(c)c.abort();},5000);
   fetch('https://api.ipapi.is/',c?{signal:c.signal}:{}).then(function(r){
    clearTimeout(t);if(!r.ok)return res(null);return r.json();
   }).then(function(j){
    if(!j||typeof j!=='object'||(j.is_vpn==null&&j.is_proxy==null&&j.is_datacenter==null))return res(null);
    res(!!(j.is_vpn||j.is_proxy||j.is_tor||j.is_datacenter));
   }).catch(function(){clearTimeout(t);res(null);});
  });
 }
 function tick(){
  if(checking||isAdmin())return;
  checking=true;
  var u=getUser(),credOk=!!(u&&u.email&&u.credential);
  // XAVFSIZLIK (reload bilan aylanib o'tishning oldini olish): sayt bloki yoki shu foydalanuvchining bloki
  // oldin keshlangan bo'lsa, serverdan javob kelgunga QADAR HAM tegishli ekran DARHOL ko'rsatiladi.
  var cachedLock=false;try{cachedLock=localStorage.getItem('it_shakh_sitelock_flag')==='1';}catch(e){}
  if(cachedLock&&!showingLock)showLock();
  var blkKey=credOk?('it_shakh_blk_'+String(u.email).toLowerCase()):null;
  var cachedBlk=false;if(blkKey){try{cachedBlk=localStorage.getItem(blkKey)==='1';}catch(e){}}
  if(cachedBlk&&!showingBlock)showBlock();
  var p1=api({action:'sitestat'},9000);
  var p2=credOk?api({action:(expMs(u.credential)>Date.now()+10000?'me':'blockstat'),credential:u.credential},9000):Promise.resolve(null);
  Promise.all([p1,p2]).then(function(res){checking=false;
   var r=res[0],rb=res[1];
   if(r&&r.ok&&r.locked){try{localStorage.setItem('it_shakh_sitelock_flag','1');if(r.lockMsg)localStorage.setItem('it_shakh_sitelock_msg',r.lockMsg);else localStorage.removeItem('it_shakh_sitelock_msg');}catch(e){}return showLock(r.lockMsg);}
   if(r&&r.ok&&!r.locked){try{localStorage.removeItem('it_shakh_sitelock_flag');localStorage.removeItem('it_shakh_sitelock_msg');}catch(e){}if(showingLock)hideLock();}
   if(rb&&rb.ok&&rb.blocked){if(blkKey){try{localStorage.setItem(blkKey,'1');var bmk=blkMsgKey();if(bmk){if(rb.blockMsg)localStorage.setItem(bmk,rb.blockMsg);else localStorage.removeItem(bmk);}}catch(e){}}return showBlock(rb.blockMsg);}
   if(rb&&rb.ok&&!rb.blocked){if(blkKey){try{localStorage.removeItem(blkKey);var bmk2=blkMsgKey();if(bmk2)localStorage.removeItem(bmk2);}catch(e){}}if(showingBlock)hideBlock();}
   if(r&&r.ok&&r.vpnBlock){
    if(vpnFlag===null||Date.now()-vpnCheckedAt>120000){
     checkVpn().then(function(v){vpnFlag=v;vpnCheckedAt=Date.now();
      if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
     });
    }else if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
   }else if(showingVpn)hideVpn();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
</script>
