<script>
/* ===== DFF (RenderWare 3.6 / GTA SA) reader + writer + decal builder. DOM-free. ===== */
(function(root){
'use strict';
const T={STRUCT:1,STRING:2,EXT:3,TEXTURE:6,MATERIAL:7,MATLIST:8,FRAMELIST:14,GEOMETRY:15,CLUMP:16,ATOMIC:20,GEOLIST:26,
  BINMESH:0x50E,SKIN:0x116,NIGHT:0x253F2F9,FX2D:0x253F2F8,FRAMENAME:0x253F2FE};
const CONT=new Set([3,6,7,8,14,15,16,20,26]);

/* ---------- chunk tree ---------- */
function sizeOf(c){
  if(c.children){let s=c.tail?c.tail.length:0;for(const k of c.children)s+=12+sizeOf(k);return s;}
  return c.data.length;
}
function parseChunks(buf,start,end){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength),out=[];let o=start;
  while(o+12<=end){
    const type=dv.getUint32(o,true),size=dv.getUint32(o+4,true),ver=dv.getUint32(o+8,true);
    let e=o+12+size;if(e>end)e=end;
    const c={type,ver};
    if(CONT.has(type)){
      c.children=parseChunks(buf,o+12,e);
      let used=0;for(const k of c.children)used+=12+sizeOf(k);
      c.tail=used<e-o-12?buf.slice(o+12+used,e):null;
    }else c.data=buf.slice(o+12,e);
    out.push(c);o=e;
  }
  return out;
}
function writeChunk(c,out,o){
  const dv=new DataView(out.buffer);
  dv.setUint32(o,c.type,true);dv.setUint32(o+4,sizeOf(c),true);dv.setUint32(o+8,c.ver,true);
  o+=12;
  if(c.children){for(const k of c.children)o=writeChunk(k,out,o);if(c.tail){out.set(c.tail,o);o+=c.tail.length;}}
  else{out.set(c.data,o);o+=c.data.length;}
  return o;
}
function serialize(roots){
  let total=0;for(const c of roots)total+=12+sizeOf(c);
  const out=new Uint8Array(total);let o=0;for(const c of roots)o=writeChunk(c,out,o);
  return out;
}
const child=(c,t)=>c.children&&c.children.find(k=>k.type===t);
const childs=(c,t)=>c.children?c.children.filter(k=>k.type===t):[];
const dvOf=d=>new DataView(d.buffer,d.byteOffset,d.byteLength);
function rwVersion(stamp){ // library stamp -> RW version (e.g. 0x36003)
  if(stamp&0xFFFF0000)return(((stamp>>14)&0x3FF00)+0x30000)|((stamp>>16)&0x3F);
  return stamp<<8;
}

/* ---------- byte writer ---------- */
class BW{
  constructor(){this.a=[];this.n=0;}
  _p(u){this.a.push(u);this.n+=u.length;}
  u8(v){this._p(new Uint8Array([v&255]));}
  u16(v){const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,v,true);this._p(b);}
  u32(v){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v>>>0,true);this._p(b);}
  i32(v){const b=new Uint8Array(4);new DataView(b.buffer).setInt32(0,v,true);this._p(b);}
  f32(v){const b=new Uint8Array(4);new DataView(b.buffer).setFloat32(0,v,true);this._p(b);}
  bytes(u){this._p(u instanceof Uint8Array?u:new Uint8Array(u));}
  str(s,len){const b=new Uint8Array(len);for(let i=0;i<Math.min(len-1,s.length);i++)b[i]=s.charCodeAt(i)&127;this._p(b);}
  done(){const o=new Uint8Array(this.n);let p=0;for(const u of this.a){o.set(u,p);p+=u.length;}return o;}
}

/* ---------- decode ---------- */
function decodeFrames(fl){
  const st=child(fl,T.STRUCT).data,dv=dvOf(st),n=dv.getUint32(0,true),frames=[];
  const exts=childs(fl,T.EXT);
  for(let i=0;i<n;i++){
    const o=4+i*56,rot=new Float32Array(9);for(let k=0;k<9;k++)rot[k]=dv.getFloat32(o+k*4,true);
    const pos=[dv.getFloat32(o+36,true),dv.getFloat32(o+40,true),dv.getFloat32(o+44,true)];
    let name='';const nm=exts[i]&&child(exts[i],T.FRAMENAME);
    if(nm)name=String.fromCharCode(...nm.data).replace(/\0.*$/,'');
    frames.push({name,rot,pos,parent:dv.getInt32(o+48,true),flags:dv.getUint32(o+52,true)});
  }
  return frames;
}
function decodeMaterial(m){
  const st=child(m,T.STRUCT).data,dv=dvOf(st);
  const color=[st[4],st[5],st[6],st[7]],textured=dv.getUint32(12,true)!==0;
  let tex='',mask='';
  const t=child(m,T.TEXTURE);
  if(t){const ss=childs(t,T.STRING);const rd=s=>s?String.fromCharCode(...s.data).replace(/\0.*$/,''):'';tex=rd(ss[0]);mask=rd(ss[1]);}
  return{color,textured,tex,mask};
}
function decodeGeometry(g,rwv){
  const st=child(g,T.STRUCT).data,dv=dvOf(st);
  const flags=dv.getUint32(0,true),nTri=dv.getUint32(4,true),nV=dv.getUint32(8,true),nMorph=dv.getUint32(12,true);
  let o=16;if(rwv<0x34000)o+=12;
  if(flags&0x01000000)return{native:true,flags};
  let numUV=(flags>>16)&255;if(!numUV)numUV=(flags&0x80)?2:(flags&4)?1:0;
  let dayColors=null;
  if(flags&8){dayColors=st.slice(o,o+nV*4);o+=nV*4;}
  const uvs=[];for(let k=0;k<numUV;k++){uvs.push(new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*8)));o+=nV*8;}
  const tris=new Uint16Array(nTri*4);
  for(let i=0;i<nTri;i++){const p=o+i*8;tris[i*4]=dv.getUint16(p+2,true);tris[i*4+1]=dv.getUint16(p,true);tris[i*4+2]=dv.getUint16(p+6,true);tris[i*4+3]=dv.getUint16(p+4,true);}
  // tris[]: v1,v2,v3,materialId
  o+=nTri*8;
  let pos=null,nrm=null;
  for(let m=0;m<nMorph;m++){
    o+=16;const hv=dv.getUint32(o,true),hn=dv.getUint32(o+4,true);o+=8;
    if(hv){const a=new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*12));o+=nV*12;if(m===0)pos=a;}
    if(hn){const a=new Float32Array(st.buffer.slice(st.byteOffset+o,st.byteOffset+o+nV*12));o+=nV*12;if(m===0)nrm=a;}
  }
  const ml=child(g,T.MATLIST);let materials=[];
  if(ml){
    const mst=child(ml,T.STRUCT).data,mdv=dvOf(mst),cnt=mdv.getUint32(0,true),mats=childs(ml,T.MATERIAL).map(decodeMaterial);
    let k=0;for(let i=0;i<cnt;i++){const idx=mdv.getInt32(4+i*4,true);materials.push(idx<0?(mats[k++]||{color:[255,255,255,255],tex:'',mask:'',textured:false}):materials[idx]);}
  }
  const ext=child(g,T.EXT);let night=null,has2dfx=false,skin=false;
  if(ext){
    const nc=child(ext,T.NIGHT);if(nc&&dvOf(nc.data).getUint32(0,true))night=nc.data.slice(4,4+nV*4);
    has2dfx=!!child(ext,T.FX2D);skin=!!child(ext,T.SKIN);
  }
  return{native:false,flags,nTri,nV,numUV,dayColors,uvs,tris,pos,nrm,materials,night,has2dfx,skin};
}

function parseDff(bytes){
  const roots=parseChunks(bytes,0,bytes.length);
  const clump=roots.find(c=>c.type===T.CLUMP);
  if(!clump)throw new Error('Bu DFF fayl emas (Clump topilmadi).');
  const stamp=clump.ver,rwv=rwVersion(stamp);
  const fl=child(clump,T.FRAMELIST),gl=child(clump,T.GEOLIST);
  if(!fl||!gl)throw new Error('DFF tuzilishi to\'liq emas (FrameList yoki GeometryList yo\'q).');
  const frames=decodeFrames(fl);
  const geoChunks=childs(gl,T.GEOMETRY),geoms=geoChunks.map(g=>decodeGeometry(g,rwv));
  const atomics=childs(clump,T.ATOMIC).map(a=>{const d=dvOf(child(a,T.STRUCT).data);return{frame:d.getUint32(0,true),geom:d.getUint32(4,true),flags:d.getUint32(8,true)};});
  return{roots,clump,stamp,rwv,frames,geoms,geoChunks,atomics};
}

/* ---------- builders ---------- */
const padLen=n=>(n+4)&~3; // at least one NUL, 4-aligned
function strChunk(s,ver){const d=new Uint8Array(padLen(s.length));for(let i=0;i<s.length;i++)d[i]=s.charCodeAt(i)&127;return{type:T.STRING,ver,data:d};}
const extChunk=(ver,kids)=>({type:T.EXT,ver,children:kids||[],tail:null});
const leaf=(type,ver,data)=>({type,ver,data});
function materialChunk(m,ver){
  const w=new BW();w.u32(0);w.bytes(new Uint8Array(m.color));w.u32(0);w.u32(m.tex?1:0);w.f32(1);w.f32(0);w.f32(1);
  const kids=[leaf(T.STRUCT,ver,w.done())];
  if(m.tex){kids.push({type:T.TEXTURE,ver,children:[leaf(T.STRUCT,ver,new Uint8Array([6,0x11,0,0])),strChunk(m.tex,ver),strChunk(m.mask||'',ver),extChunk(ver)],tail:null});}
  kids.push(extChunk(ver));
  return{type:T.MATERIAL,ver,children:kids,tail:null};
}
/* g: {pos,nrm,uv,day(Uint8 RGBA),night(Uint8 RGBA|null),tris:[a,b,c,mat,...],materials:[{color,tex,mask}],fx2d:Uint8Array|null,prelit:bool} */
function buildGeometry(g,ver){
  const rwv=rwVersion(ver),nV=g.pos.length/3,nT=g.tris.length/4;
  const textured=g.uv&&g.materials.some(m=>m.tex);
  let flags=2|0x10|0x20|0x40;
  if(textured)flags|=4|(1<<16);
  if(g.day)flags|=8;
  const w=new BW();
  w.u32(flags);w.u32(nT);w.u32(nV);w.u32(1);
  if(rwv<0x34000){w.f32(1);w.f32(1);w.f32(1);}

/* ================= VIEWPORTS: camera, render, picking ================= */

/* ---------- render ---------- */
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[(n>>16)&255,(n>>8)&255,n&255];}
function gridStep(vp){ // pixel spacing target ~ 16px

  if(!vp.persp){const steps=[.01,.02,.05,.1,.2,.5,1,2,5,10,20,50,100,200,500,1000];s=steps.find(x=>x>=unit)||1000;}
  return s;

function clipLine(a,b,near){ // camera-space z clip. a,b: [x,y,z]
  if(a[2]<near&&b[2]<near)return null;
  if(a[2]<near){const t=(near-a[2])/(b[2]-a[2]);a=[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,near];}

function camSpace(vp,p,B){const d=V.sub(p,B.eye);return[V.dot(d,B.r),V.dot(d,B.u),V.dot(d,B.f)];}

    c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(pa[0],pa[1]);c.lineTo(pb[0],pb[1]);c.stroke();
  };
  // plane axes (a,b): two world axes spanning grid plane

    cx=Math.round(vp.target[ax1]/step)*step;cy=Math.round(vp.target[ax2]/step)*step;}
  const n=Math.round(ext/step);
  const mk=(i,j,a,b)=>{const p=[0,0,0];p[ax1]=a;p[ax2]=b;return p;};
  const major=step*10;

      if(Math.abs(a%major)>1e-6*major&&Math.abs(a%major-major)>1e-6*major)seg(mk(0,0,a,cy-ext),mk(0,0,a,cy+ext),minC,1);
      if(Math.abs(b%major)>1e-6*major&&Math.abs(b%major-major)>1e-6*major)seg(mk(0,0,cx-ext,b),mk(0,0,cx+ext,b),minC,1);}
  }

      if(Math.abs(a%major)<1e-6*major||Math.abs(a%major-major)<1e-6*major)seg(mk(0,0,a,cy-ext),mk(0,0,a,cy+ext),majC,1);

  objs.forEach(o=>{
    if(o.type==='mesh'){

      const P=proj.get(o.id),E=edgesOf(o);
      const col=o.disabled?WIRE.dis:o.sel?(o.id===S.active?'#ff7070':WIRE.sel):(XT(o).wireOn?XT(o).wireCol:(gl?'rgba(20,20,20,.55)':WIRE.def));
      c.strokeStyle=col;c.lineWidth=o.sel&&!sub?1.4:1;c.beginPath();
      E.forEach(e=>{if(P.ok[e.a]&&P.ok[e.b]){c.moveTo(P.sx[e.a],P.sy[e.a]);c.lineTo(P.sx[e.b],P.sy[e.b]);}});c.stroke();
      if(S.cfg.showNormals&&!o.disabled){
        c.strokeStyle='#5ad';c.beginPath();
        o.p.forEach(pl=>{const ce=polyCenter(o,pl),n=polyNormal(o,pl),a=vp.project(ce,B),b=vp.project(V.add(ce,V.mul(n,S.cfg.normLen)),B);if(a&&b){c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);}});c.stroke();}
    }else{
      const col=o.disabled?WIRE.dis:o.sel?(o.id===S.active?'#ff7070':WIRE.sel):(OBJ_COL[o.type]||WIRE.def);
      if(o.type==='spline')drawSplineObj(c,vp,B,o,col,sub&&o.sel);
      else if(o.type==='lattice')drawLatticeObj(c,vp,B,o,col);

  /* sub-object selection overlay */

      if(!hasVerts(o))return;const P=proj.get(o.id);if(!P)return;
      if(S.level==='polygon'&&o.sp.size&&o.type==='mesh'){
        c.fillStyle='rgba(255,60,60,.42)';c.beginPath();
        o.sp.forEach(pi=>{const pl=o.p[pi];if(!pl||!pl.i.every(i=>P.ok[i]))return;pl.i.forEach((i,k)=>{if(k)c.lineTo(P.sx[i],P.sy[i]);else c.moveTo(P.sx[i],P.sy[i]);});c.closePath();});
        c.fill('nonzero');c.strokeStyle=WIRE.sel;c.lineWidth=1.3;c.beginPath();
        o.sp.forEach(pi=>{const pl=o.p[pi];if(!pl)return;pl.i.forEach((i,k)=>{const j=pl.i[(k+1)%pl.i.length];if(P.ok[i]&&P.ok[j]){c.moveTo(P.sx[i],P.sy[i]);c.lineTo(P.sx[j],P.sy[j]);}});});c.stroke();
      }
      if(S.level==='edge'&&o.type==='mesh'){
        c.strokeStyle=WIRE.sel;c.lineWidth=2.4;c.beginPath();
        o.se.forEach(k=>{const [a,b]=k.split('_').map(Number);if(P.ok[a]&&P.ok[b]){c.moveTo(P.sx[a],P.sy[a]);c.lineTo(P.sx[b],P.sy[b]);}});c.stroke();
      }

        c.fillStyle='#ff3030';c.beginPath();o.sv.forEach(i=>{if(P.ok[i])c.rect(P.sx[i]-r-1,P.sy[i]-r-1,r*2+2,r*2+2);});c.fill();

    });
  }

  if(!sub&&vp.opts.pivot!==false){
    selObjs().forEach(o=>{
      const p=vp.project(o.pivot,B);if(!p)return;const L2=22;
      [[1,0,0,'#ff4040'],[0,1,0,'#40d040'],[0,0,1,'#5080ff']].forEach(([x,y,z,col])=>{const q=vp.project(V.add(o.pivot,V.mul([x,y,z],vp.unitsPerPx(o.pivot,B)*L2)),B);if(!q)return;
        c.strokeStyle=col;c.lineWidth=S.level==='manip'?2.4:1.4;c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1]);c.stroke();});
      if(S.level==='manip'){c.fillStyle='#fff';c.fillRect(p[0]-3,p[1]-3,6,6);}

  }
  /* tool previews */
  if(vp.rubber){
    const r=vp.rubber;c.strokeStyle='#ffff80';c.lineWidth=1;c.setLineDash([4,3]);
    if(r.kind==='rect')c.strokeRect(Math.min(r.x0,r.x1)+.5,Math.min(r.y0,r.y1)+.5,Math.abs(r.x1-r.x0),Math.abs(r.y1-r.y0));
    else if(r.kind==='circle'){c.beginPath();c.arc(r.x0,r.y0,Math.hypot(r.x1-r.x0,r.y1-r.y0),0,Math.PI*2);c.stroke();}
    else if(r.kind==='poly'){c.beginPath();r.pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));if(r.cur)c.lineTo(r.cur[0],r.cur[1]);c.stroke();}
    else if(r.kind==='polycreate'){c.setLineDash([]);c.strokeStyle='#7fe07f';c.beginPath();r.pts.forEach((p,i)=>{const q=vp.project(p,B);if(!q)return;i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);});
      if(r.cur)c.lineTo(r.cur[0],r.cur[1]);c.stroke();r.pts.forEach(p=>{const q=vp.project(p,B);if(q){c.fillStyle='#7fe07f';c.fillRect(q[0]-3,q[1]-3,6,6);}});}
    else if(r.kind==='create'){c.setLineDash([]);c.strokeStyle='#7fe07f';c.strokeRect(Math.min(r.x0,r.x1)+.5,Math.min(r.y0,r.y1)+.5,Math.abs(r.x1-r.x0),Math.abs(r.y1-r.y0));
      c.beginPath();c.arc(r.x0,r.y0,Math.hypot(r.x1-r.x0,r.y1-r.y0),0,Math.PI*2);c.stroke();}
    else if(r.kind==='line'){c.setLineDash([]);c.strokeStyle=r.col||'#ffd24a';c.lineWidth=1.5;c.beginPath();c.moveTo(r.x0,r.y0);c.lineTo(r.x1,r.y1);c.stroke();c.fillStyle=c.strokeStyle;c.fillRect(r.x0-3,r.y0-3,6,6);c.fillRect(r.x1-3,r.y1-3,6,6);}
    c.setLineDash([]);
  }
  /* tripod */
  const tsz={small:18,medium:30,big:46}[vp.opts.tripod||'small'];
  if(tsz){const org=[16+tsz,H-14-tsz];
    [[[1,0,0],'#ff5050','X'],[[0,1,0],'#50d050','Y'],[[0,0,1],'#6090ff','Z']].forEach(([a,col,t])=>{
      const dx=V.dot(a,B.r),dy=-V.dot(a,B.u);c.strokeStyle=col;c.lineWidth=1.6;c.beginPath();c.moveTo(org[0],org[1]);c.lineTo(org[0]+dx*tsz,org[1]+dy*tsz);c.stroke();
      c.fillStyle=col;c.font='10px Tahoma,sans-serif';c.fillText(t,org[0]+dx*(tsz+6)-3,org[1]+dy*(tsz+6)+3);});}
  if(vp===activeView){c.strokeStyle='#e0d060';c.lineWidth=2;c.strokeRect(1,1,W-2,H-2);}
}
/* background image (ZModeler: viewport menu -> Image background) - orthographic views only.
   The picture lives in the view plane: centre (bi.x,bi.y) and width bi.w in view coordinates (right/up axes). */

  const w=bi.w,h=bi.w*bi.img.naturalHeight/bi.img.naturalWidth,at=(x,y)=>vp.project(V.add(V.mul(B.r,x),V.mul(B.u,y)),B);

function renderAll(){VIEWS.forEach(vp=>{if(vp.el.offsetParent!==null||vp.el.style.display!=='none')renderViewport(vp);});}

/* ---------- picking ---------- */
function distSeg(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(ax+t*dx),py-(ay+t*dy));}
function pointInPoly(px,py,xs,ys){let ins=false;for(let i=0,j=xs.length-1;i<xs.length;j=i++){if((ys[i]>py)!==(ys[j]>py)&&px<(xs[j]-xs[i])*(py-ys[i])/(ys[j]-ys[i])+xs[i])ins=!ins;}return ins;}
function pickVertex(vp,mx,my,r){
  r=r||9;const B=vp.basis();let best=null,bd=r;
  editable().forEach(o=>{if(!hasVerts(o))return;const P=objProj(o,vp,B);
    for(let i=0;i<o.v.length;i++)if(P.ok[i]){const d=Math.hypot(P.sx[i]-mx,P.sy[i]-my);if(d<bd||(d<=bd&&best&&Math.abs(d-bd)<.5&&P.sz[i]<best.z)){bd=d;best={o,i,z:P.sz[i]};}}});
  return best;
}
function pickEdge(vp,mx,my,r){
  r=r||7;const B=vp.basis();let best=null,bd=r;
  editable().forEach(o=>{if(o.type!=='mesh')return;const P=objProj(o,vp,B);
    edgesOf(o).forEach((e,key)=>{if(!P.ok[e.a]||!P.ok[e.b])return;const d=distSeg(mx,my,P.sx[e.a],P.sy[e.a],P.sx[e.b],P.sy[e.b]);if(d<bd){bd=d;best={o,key,e};}});});
  return best;
}
function pickPoly(vp,mx,my,list){
  const B=vp.basis();let best=null,bz=1e30;
  (list||editable()).forEach(o=>{if(o.type!=='mesh')return;const P=objProj(o,vp,B);
    o.p.forEach((pl,pi)=>{const xs=[],ys=[];let z=0;for(const i of pl.i){if(!P.ok[i])return;xs.push(P.sx[i]);ys.push(P.sy[i]);z+=P.sz[i];}
      z/=pl.i.length;if(z<bz&&pointInPoly(mx,my,xs,ys)){bz=z;best={o,pi,pl};}});});
  return best;
}
function pickObject(vp,mx,my){
  const vis=S.objects.filter(o=>!o.hidden);
  const hit=pickPoly(vp,mx,my,vis.filter(o=>o.type==='mesh'));
  if(hit)return hit.o;
  const B=vp.basis();let best=null,bd=7;
  vis.forEach(o=>{
    if(isPoint(o)){let d=1e9;const p=vp.project(o.pivot,B);if(p)d=Math.max(Math.abs(p[0]-mx),Math.abs(p[1]-my));
      if(o.type==='bone'&&o.v[0]){const q=vp.project(o.v[0],B);if(p&&q)d=Math.min(d,distSeg(mx,my,p[0],p[1],q[0],q[1]));}
      if(d<12&&d<bd+5){bd=d;best=o;}return;}
    if(o.type==='spline'){const pts=splinePoly(o).map(w=>vp.project(w,B));for(let i=1;i<pts.length;i++){if(!pts[i]||!pts[i-1])continue;const d=distSeg(mx,my,pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]);if(d<bd){bd=d;best=o;}}return;}
    const P=objProj(o,vp,B);edgesOf(o).forEach(e=>{if(!P.ok[e.a]||!P.ok[e.b])return;const d=distSeg(mx,my,P.sx[e.a],P.sy[e.a],P.sx[e.b],P.sy[e.b]);if(d<bd){bd=d;best=o;}});
    if(o.type==='lattice'){for(let i=0;i<o.v.length;i++)if(P.ok[i]){const d=Math.hypot(P.sx[i]-mx,P.sy[i]-my);if(d<bd+3){bd=d;best=o;}}}});
  return best;
}
/* region select: inside(x,y) predicate */
function regionSelect(vp,inside,mode){ // mode: 'set'|'add'|'sub'
  const B=vp.basis();
  if(mode==='set')clearSelection(S.level!=='object'&&S.level!=='manip');
  if(S.level==='object'||S.level==='manip'){
    S.objects.forEach(o=>{if(o.hidden)return;let ok=false;
      if(isPoint(o)){const p=vp.project(o.pivot,B);ok=!!p&&inside(p[0],p[1]);}
      else{const P=objProj(o,vp,B);ok=o.v.length>0;for(let i=0;i<o.v.length&&ok;i++)if(!P.ok[i]||!inside(P.sx[i],P.sy[i]))ok=false;}
      if(ok){o.sel=mode!=='sub';if(o.sel)S.active=o.id;}});
    return;
  }
  editable().forEach(o=>{if(!hasVerts(o))return;const P=objProj(o,vp,B),insideV=[];
    for(let i=0;i<o.v.length;i++)insideV[i]=!!P.ok[i]&&inside(P.sx[i],P.sy[i]);
    let any=false;
    if(S.level==='vertex'){for(let i=0;i<o.v.length;i++)if(insideV[i]){mode==='sub'?o.sv.delete(i):o.sv.add(i);any=true;}}
    else if(S.level==='edge'){edgesOf(o).forEach((e,k)=>{if(insideV[e.a]&&insideV[e.b]){mode==='sub'?o.se.delete(k):o.se.add(k);any=true;}});}
    else{o.p.forEach((pl,pi)=>{if(pl.i.every(i=>insideV[i])){mode==='sub'?o.sp.delete(pi):o.sp.add(pi);any=true;}});}
    if(any&&!o.sel){o.sel=true;if(!S.active||!objById(S.active)||!objById(S.active).sel)S.active=o.id;}
  });
}
function clearSelection(subOnly){S.objects.forEach(o=>{o.sv.clear();o.se.clear();o.sp.clear();if(!subOnly)o.sel=false;});}
function clickSelect(vp,mx,my,shift,ctrl){
  const mode=ctrl?'sub':shift?'add':'set';
  if(S.level==='object'||S.level==='manip'){
    const o=pickObject(vp,mx,my);
    if(mode==='set')S.objects.forEach(x=>x.sel=false);
    if(o){if(mode==='sub')o.sel=false;else{o.sel=true;S.active=o.id;}}
    return;
  }
  const lvl=S.level;
  let hit=null,o=null;
  if(lvl==='vertex'){hit=pickVertex(vp,mx,my);o=hit&&hit.o;}
  else if(lvl==='edge'){hit=pickEdge(vp,mx,my);o=hit&&hit.o;}
  else{hit=pickPoly(vp,mx,my);o=hit&&hit.o;}
  if(mode==='set')S.objects.forEach(x=>{x.sv.clear();x.se.clear();x.sp.clear();});
  if(!hit)return;
  if(!o.sel&&!S.objects.some(x=>x.sel&&x!==o)&&mode==='set'){S.objects.forEach(x=>x.sel=false);}
  if(!o.sel){o.sel=true;}
  S.active=o.id;
  if(lvl==='vertex'){mode==='sub'?o.sv.delete(hit.i):o.sv.add(hit.i);}
  else if(lvl==='edge'){mode==='sub'?o.se.delete(hit.key):o.se.add(hit.key);}
  else{mode==='sub'?o.sp.delete(hit.pi):o.sp.add(hit.pi);}
}
/* current selection -> verts per object */
function selVertsOf(o){
  if(!hasVerts(o))return[];
  const s=new Set();
  if(S.level==='vertex')o.sv.forEach(i=>s.add(i));
  else if(S.level==='edge')o.se.forEach(k=>{const [a,b]=k.split('_');s.add(+a);s.add(+b);});
  else if(S.level==='polygon')o.sp.forEach(pi=>{const pl=o.p[pi];if(pl)pl.i.forEach(i=>s.add(i));});
  else if(o.sel)o.v.forEach((_,i)=>s.add(i));
  return[...s];
}
function selTargets(){ // [{o,ids}] for current level
  const out=[];
  S.objects.forEach(o=>{if(o.hidden||o.disabled)return;
    if(S.level==='object'||S.level==='manip'){if(o.sel)out.push({o,ids:selVertsOf(o)});}
    else{const ids=selVertsOf(o);if(ids.length)out.push({o,ids});}});
  return out;
}
function selectionCount(){
  let v=0,e=0,p=0,o=0;
  S.objects.forEach(x=>{if(x.sel)o++;v+=x.sv.size;e+=x.se.size;p+=x.sp.size;});
  return{v,e,p,o};
}

/* ================= OPERATIONS (Modify / Select / Display / Surface) ================= */
const soon=name=>log(name+': bu asbob keyingi versiyada qo‘shiladi.');
function needSel(msg){const t=selTargets();if(!t.length){log(msg||'Avval biror narsani tanlang.');return null;}return t;}

/* ---------- transform ---------- */
let TR=null; // active transform: {kind,base:[{o,ids,pos:[...] ,pivot}],center}
function beginTransform(kind){
  let t=selTargets();if(!t.length)return null;
  if(kind==='move'&&S.level==='object'&&S.opt.affectChildren!==false){const have=new Set(t.map(x=>x.o));t.slice().forEach(({o})=>descendants(o).forEach(c=>{if(!have.has(c)&&!c.hidden&&!c.disabled){have.add(c);t.push({o:c,ids:c.v.map((_,i)=>i)});}}));}
  if(S.level==='manip'){TR={kind,base:t.map(({o})=>({o,ids:[],pos:[],pivot:o.pivot.slice()})),center:null,manip:true};return TR;}
  const objectLevel=S.level==='object';
  TR={kind,objectLevel,base:t.map(({o,ids})=>({o,ids,pos:ids.map(i=>o.v[i].slice()),pivot:o.pivot.slice(),
    vc:null})),center:null};
  if(!objectLevel){const b=bounds(t.map(({o,ids})=>[o,ids]));TR.center=b?b.c:[0,0,0];}
  else{const sel=t.map(x=>x.o);const bp=sel.map(o=>o.pivot);TR.center=V.mul(bp.reduce((a,b)=>V.add(a,b),[0,0,0]),1/bp.length);}
  const bb=bounds(t.map(({o,ids})=>[o,ids]));TR.ref=bb?bb.c:TR.center;
  return TR;
}
function axisMask(){return[S.axes.x?1:0,S.axes.y?1:0,S.axes.z?1:0];}
function applyMove(d){
  TR.base.forEach(b=>{
    if(TR.manip){b.o.pivot=V.add(b.pivot,d);}
    else{b.ids.forEach((i,k)=>{b.o.v[i]=V.add(b.pos[k],d);});if(TR.objectLevel)b.o.pivot=V.add(b.pivot,d);}
    moved(b.o);
  });
}
function rotMat(axis,a){ // Rodrigues
  const [x,y,z]=V.norm(axis),c=Math.cos(a),s=Math.sin(a),t=1-c;
  return[[t*x*x+c,t*x*y-s*z,t*x*z+s*y],[t*x*y+s*z,t*y*y+c,t*y*z-s*x],[t*x*z-s*y,t*y*z+s*x,t*z*z+c]];
}
const mulMV=(m,p)=>[m[0][0]*p[0]+m[0][1]*p[1]+m[0][2]*p[2],m[1][0]*p[0]+m[1][1]*p[1]+m[1][2]*p[2],m[2][0]*p[0]+m[2][1]*p[1]+m[2][2]*p[2]];
function applyRotate(axis,ang){
  if(TR.manip)return;const M=rotMat(axis,ang);
  TR.base.forEach(b=>{const c=TR.objectLevel?b.pivot:TR.center;
    b.ids.forEach((i,k)=>{b.o.v[i]=V.add(c,mulMV(M,V.sub(b.pos[k],c)));});moved(b.o);});
}
function applyScale(s){ // s: [sx,sy,sz]
  if(TR.manip)return;
  TR.base.forEach(b=>{const c=TR.objectLevel?b.pivot:TR.center;
    b.ids.forEach((i,k)=>{const d=V.sub(b.pos[k],c);b.o.v[i]=[c[0]+d[0]*s[0],c[1]+d[1]*s[1],c[2]+d[2]*s[2]];});moved(b.o);});
}
function snapDelta(d){
  if(!S.snap.on||!S.snap.grid||!TR.ref)return d;const g=S.gridSize,m=axisMask(),any=m[0]||m[1]||m[2];
  const t=V.add(TR.ref,d),r=t.map((v,k)=>(!any||m[k])?Math.round(v/g)*g:v);return V.sub(r,TR.ref);
}
function endTransform(){TR=null;}

/* ---------- exact transform (numeric) ---------- */
function exactTransform(mode,vals,relative){
  const t=needSel();if(!t)return;undoPush();
  beginTransform(mode);
  if(mode==='move'){
    const d=relative?vals:V.sub(vals,TR.ref);applyMove(d);
  }else if(mode==='rotate'){
    const M=[0,1,2].map(k=>vals[k]*Math.PI/180);
    [[[1,0,0],M[0]],[[0,1,0],M[1]],[[0,0,1],M[2]]].forEach(([ax,an])=>{if(an){const base=TR.base;base.forEach(b=>{b.ids.forEach((i,k)=>{b.pos[k]=b.o.v[i].slice();});});applyRotate(ax,an);}});
  }else if(mode==='scale'){applyScale(relative?vals:vals.map(v=>v/100));}
  endTransform();redraw();
}

/* ---------- delete ---------- */
function opDelete(){
  const any=S.objects.some(o=>o.sel||o.sv.size||o.se.size||o.sp.size);if(!any){log('Delete: hech narsa tanlanmagan.');return;}
  undoPush();
  if(S.level==='object'||S.level==='manip'){
    const dead=new Set(S.objects.filter(o=>o.sel));fixChildrenOnDelete(dead);const n=dead.size;S.objects=S.objects.filter(o=>!dead.has(o));if(!objById(S.active))S.active=null;log('O‘chirildi: '+n+' ta obyekt.');
  }else{
    S.objects.forEach(o=>{if(o.type!=='spline'||!o.sv.size||S.level!=='vertex')return;const x=XT(o),keep=o.v.map((_,i)=>!o.sv.has(i));o.v=o.v.filter((_,i)=>keep[i]);if(x.vt)x.vt=x.vt.filter((_,i)=>keep[i]);o.sv.clear();touch(o);log('Spline nuqtalari o‘chirildi.');});
    S.objects.forEach(o=>{if(o.type!=='mesh')return;
      let kill=new Set();
      if(S.level==='polygon')o.sp.forEach(pi=>kill.add(pi));
      else if(S.level==='edge'){const E=edgesOf(o);o.se.forEach(k=>{const e=E.get(k);if(e)e.polys.forEach(pi=>kill.add(pi));});}
      else if(S.level==='vertex'){o.p.forEach((pl,pi)=>{if(pl.i.some(i=>o.sv.has(i)))kill.add(pi);});}
      if(!kill.size&&!(S.level==='vertex'&&o.sv.size))return;
      const delVerts=S.level==='vertex'?new Set(o.sv):null;
      o.p=o.p.filter((_,pi)=>!kill.has(pi));
      o.sp.clear();o.se.clear();
      if(delVerts){const keepV=new Set();o.p.forEach(pl=>pl.i.forEach(i=>keepV.add(i)));delVerts.forEach(i=>{});}
      touch(o);
      // remove vertices that are now unused AND were part of deleted elements
      const before=o.v.length;o.sv.clear();pruneVerts(o);
      log('O‘chirildi: '+kill.size+' ta poligon ('+o.name+'), '+(before-o.v.length)+' ta vertex.');
    });
  }
  redraw();refreshUI();
}

/* ---------- weld ---------- */
function opWeld(){
  if(S.level!=='vertex'){log('Weld: Vertex darajasida (1) ishlaydi.');return;}
  const t=selTargets();if(!t.length||!t.some(x=>x.ids.length>1)){log('Weld: kamida 2 ta vertex tanlang.');return;}
  undoPush();let merged=0;
  t.forEach(({o,ids})=>{
    const map=o.v.map((_,i)=>i);
    if(S.opt.weldAll){
      const c=V.mul(ids.reduce((a,i)=>V.add(a,o.v[i]),[0,0,0]),1/ids.length),first=ids[0];
      ids.forEach(i=>{map[i]=first;});o.v[first]=c;merged+=ids.length-1;
    }else{
      const thr=S.opt.weldThr,used=new Set();
      ids.forEach(i=>{if(used.has(i))return;ids.forEach(j=>{if(j!==i&&!used.has(j)&&V.len(V.sub(o.v[i],o.v[j]))<=thr){map[j]=i;used.add(j);merged++;}});});
    }
    o.sv=new Set(ids.map(i=>map[i]));weldRemap(o,map);
  });
  log('Weld: '+merged+' ta vertex birlashtirildi.');redraw();refreshUI();
}

/* ---------- flip ---------- */
function opFlip(){
  const sel=S.objects.filter(o=>o.type==='mesh'&&(o.sel||o.sp.size));if(!sel.length){log('Flip: obyekt yoki poligon tanlang.');return;}
  undoPush();let n=0;
  sel.forEach(o=>{const polys=(S.level==='polygon'&&o.sp.size)?[...o.sp].map(i=>o.p[i]).filter(Boolean):o.p;polys.forEach(pl=>{flipPoly(pl);n++;});touch(o);});
  log('Flip: '+n+' ta poligon aylantirildi.');redraw();
}

/* ---------- extrude ---------- */
function opExtrude(amount){
  if(S.level!=='polygon'){log('Extrude: Polygon darajasida (3) ishlaydi.');return;}
  const t=selTargets().filter(x=>x.o.sp.size);if(!t.length){log('Extrude: poligon tanlang.');return;}
  undoPush();
  t.forEach(({o})=>{
    const selp=[...o.sp].filter(pi=>o.p[pi]);const vs=new Set();selp.forEach(pi=>o.p[pi].i.forEach(i=>vs.add(i)));
    const nmap=new Map(),vn=new Map();
    selp.forEach(pi=>{const n=polyNormal(o,o.p[pi]);o.p[pi].i.forEach(i=>{const a=vn.get(i)||[0,0,0];vn.set(i,V.add(a,n));});});
    vs.forEach(i=>{nmap.set(i,o.v.length);const n=V.norm(vn.get(i));o.v.push(V.add(o.v[i],V.mul(n,amount)));if(o.vc)o.vc.push(o.vc[i].slice());});
    // boundary edges of the selection region
    const cnt=new Map(),dir=new Map();
    selp.forEach(pi=>{const pl=o.p[pi],n=pl.i.length;for(let k=0;k<n;k++){const a=pl.i[k],b=pl.i[(k+1)%n],key=edgeKey(a,b);cnt.set(key,(cnt.get(key)||0)+1);dir.set(key,[a,b,pl.m]);}});
    const sides=[];cnt.forEach((c,key)=>{if(c===1){const [a,b,m]=dir.get(key);if(S.opt.extSides==='Triangles'){sides.push({i:[a,b,nmap.get(b)],m},{i:[a,nmap.get(b),nmap.get(a)],m});}else sides.push({i:[a,b,nmap.get(b),nmap.get(a)],m});}});
    selp.forEach(pi=>{o.p[pi].i=o.p[pi].i.map(i=>nmap.get(i));});
    sides.forEach(s=>o.p.push(s));
    touch(o);
  });
  log('Extrude: '+t.reduce((a,x)=>a+x.o.sp.size,0)+' ta poligon.');redraw();refreshUI();
}

/* ---------- detach / attach ---------- */
function opDetach(){
  if(S.level!=='polygon'){log('Detach: Polygon darajasida ishlaydi.');return;}
  const t=selTargets().filter(x=>x.o.sp.size);if(!t.length){log('Detach: poligon tanlang.');return;}
  undoPush();const created=[];
  t.forEach(({o})=>{
    const sp=[...o.sp].filter(pi=>o.p[pi]),vm=new Map(),n=newObject(uniqueName(o.name+'_part'),'mesh');
    sp.forEach(pi=>{const pl=o.p[pi];n.p.push({i:pl.i.map(i=>{if(!vm.has(i)){vm.set(i,n.v.length);n.v.push(o.v[i].slice());}return vm.get(i);}),m:pl.m,...(pl.uv?{uv:pl.uv.map(q=>q.slice())}:{})});});
    n.pivot=o.pivot.slice();n.smooth=o.smooth;
    const spSet=new Set(sp);o.p=o.p.filter((_,pi)=>!spSet.has(pi));o.sp.clear();o.sv.clear();o.se.clear();touch(o);pruneVerts(o);created.push(n);
  });
  S.objects.forEach(o=>o.sel=false);created.forEach(n=>{S.objects.push(n);n.sel=true;S.active=n.id;});
  log('Detach: '+created.length+' ta yangi obyekt.');redraw();refreshUI();
}
function opAttach(){
  const sel=S.objects.filter(o=>o.sel&&o.type==='mesh');if(sel.length<2){log('Attach: kamida 2 ta obyektni tanlang.');return;}
  undoPush();
  const host=objById(S.active)&&objById(S.active).sel&&objById(S.active).type==='mesh'?objById(S.active):sel[0];
  sel.forEach(o=>{if(o===host)return;const b=host.v.length;o.v.forEach(p=>host.v.push(p));
    if(host.vc||o.vc){if(!host.vc)host.vc=host.v.slice(0,b).map(()=>[255,255,255,255]);o.v.forEach((_,i)=>host.vc.push(o.vc?o.vc[i]:[255,255,255,255]));}
    o.p.forEach(pl=>host.p.push({i:pl.i.map(i=>i+b),m:pl.m,...(pl.uv?{uv:pl.uv.map(q=>q.slice())}:{})}));});
  S.objects=S.objects.filter(o=>!sel.includes(o)||o===host);touch(host);S.active=host.id;host.sel=true;
  log('Attach: '+sel.length+' ta obyekt birlashtirildi → '+host.name);redraw();refreshUI();
}

/* ---------- break / connect / insert ---------- */
function opBreak(){
  if(S.level!=='vertex'){log('Break: Vertex darajasida ishlaydi.');return;}
  const t=needSel('Break: vertex tanlang.');if(!t)return;undoPush();let n=0;
  t.forEach(({o,ids})=>{const set=new Set(ids);
    set.forEach(vi=>{const users=o.p.filter(pl=>pl.i.includes(vi));
      users.forEach((pl,k)=>{if(k===0)return;const nv=o.v.length;o.v.push(o.v[vi].slice());if(o.vc)o.vc.push(o.vc[vi].slice());pl.i=pl.i.map(i=>i===vi?nv:i);n++;});});
    touch(o);});
  log('Break: '+n+' ta vertex ajratildi.');redraw();
}
function opConnect(){
  if(S.level!=='vertex'){log('Connect: Vertex darajasida ishlaydi.');return;}
  const t=selTargets();if(t.length!==1||t[0].ids.length!==2){log('Connect: aynan 2 ta vertex tanlang.');return;}
  const {o,ids}=t[0],[a,b]=ids;
  const pl=o.p.find(p=>p.i.includes(a)&&p.i.includes(b));if(!pl){log('Connect: ikkala vertex bitta poligonda bo‘lishi kerak.');return;}
  const n=pl.i.length,ia=pl.i.indexOf(a),ib=pl.i.indexOf(b);
  if((ia+1)%n===ib||(ib+1)%n===ia){log('Connect: bu vertexlar allaqachon qo‘shni.');return;}
  undoPush();
  const ring=(from,to)=>{const r=[];let k=from;for(;;){r.push(pl.i[k]);if(k===to)break;k=(k+1)%n;}return r;};
  const p1=ring(ia,ib),p2=ring(ib,ia),UV=hasUV(pl)?pl.uv:null;
  const ringU=(from,to)=>{const r=[];let k=from;for(;;){r.push(UV[k].slice());if(k===to)break;k=(k+1)%n;}return r;};
  const idx=o.p.indexOf(pl);o.p.splice(idx,1,{i:p1,m:pl.m,...(UV?{uv:ringU(ia,ib)}:{})},{i:p2,m:pl.m,...(UV?{uv:ringU(ib,ia)}:{})});touch(o);log('Connect: poligon ikkiga bo‘lindi.');redraw();
}
function opInsert(){
  if(S.level!=='edge'){log('Insert: Edge darajasida (2) ishlaydi.');return;}
  const t=selTargets().filter(x=>x.o.se.size);if(!t.length){log('Insert: qirra tanlang.');return;}
  undoPush();let n=0;
  t.forEach(({o})=>{
    const keys=[...o.se],mid=new Map();
    keys.forEach(k=>{const [a,b]=k.split('_').map(Number);mid.set(k,o.v.length);o.v.push(V.lerp(o.v[a],o.v[b],.5));if(o.vc)o.vc.push(o.vc[a].map((x,j)=>(x+o.vc[b][j])/2));n++;});
    o.p.forEach(pl=>{const out=[],m=pl.i.length,uv=hasUV(pl)?pl.uv:null,ou=uv?[]:null;for(let k=0;k<m;k++){const a=pl.i[k],b=pl.i[(k+1)%m];out.push(a);if(uv)ou.push(uv[k]);const key=edgeKey(a,b);if(mid.has(key)){out.push(mid.get(key));if(uv){const q=uv[(k+1)%m];ou.push([(uv[k][0]+q[0])/2,(uv[k][1]+q[1])/2]);}}}pl.i=out;if(uv)pl.uv=ou;});
    o.se.clear();o.sv=new Set(mid.values());touch(o);
  });
  S.level='vertex';syncLevelUI();log('Insert: '+n+' ta vertex qo‘shildi.');redraw();
}

/* ---------- mirror / align / cleanup ---------- */
function opMirror(axisName,copy,usePivot){
  const ax='XYZ'.indexOf(axisName);
  const targets=S.level==='polygon'?S.objects.filter(o=>o.type==='mesh'&&o.sp.size):S.objects.filter(o=>o.sel&&o.type==='mesh');
  if(!targets.length){log('Mirror: obyekt yoki poligon tanlang.');return;}
  undoPush();
  const mirrorPt=(p,c)=>{const q=p.slice();q[ax]=2*c-q[ax];return q;};
  targets.forEach(o=>{
    const c=usePivot?o.pivot[ax]:0;
    if(S.level==='polygon'){
      const sp=[...o.sp].filter(pi=>o.p[pi]),vm=new Map(),np=[];
      sp.forEach(pi=>{const pl=o.p[pi];np.push({i:pl.i.map(i=>{if(!vm.has(i)){vm.set(i,o.v.length);o.v.push(mirrorPt(o.v[i],c));if(o.vc)o.vc.push(o.vc[i].slice());}return vm.get(i);}).reverse(),m:pl.m,...(pl.uv?{uv:pl.uv.map(q=>q.slice()).reverse()}:{})});});
      np.forEach(p=>o.p.push(p));touch(o);
    }else if(copy){
      const n=cloneObject(o);n.name=uniqueName(o.name+'_mirror');n.v=n.v.map(p=>mirrorPt(p,c));n.pivot=mirrorPt(n.pivot,c);n.p.forEach(flipPoly);
      S.objects.push(n);
    }else{o.v=o.v.map(p=>mirrorPt(p,c));o.pivot=mirrorPt(o.pivot,c);o.p.forEach(flipPoly);touch(o);}
  });
  log('Mirror '+axisName+(copy?' (nusxa bilan)':'')+'.');redraw();refreshUI();
}
function opAlign(kind){
  const t=needSel('Align: elementlarni tanlang.');if(!t)return;undoPush();
  const vp=activeView,B=vp?vp.basis():null;
  const all=bounds(t.map(({o,ids})=>[o,ids]));if(!all)return;
  let flat; // axes to flatten (indices) ; or direction
  if(kind==='Axis'){const a='XYZ'.indexOf(S.opt.alignAxis);t.forEach(({o,ids})=>{ids.forEach(i=>{o.v[i][a]=all.c[a];});moved(o);});}
  else if(kind==='Line'){const a='XYZ'.indexOf(S.opt.alignAxis);t.forEach(({o,ids})=>{ids.forEach(i=>{for(let k=0;k<3;k++)if(k!==a)o.v[i][k]=all.c[k];});moved(o);});}
  else if(kind==='Plane'){const e=V.sub(all.mx,all.mn),a=e.indexOf(Math.min(...e));t.forEach(({o,ids})=>{ids.forEach(i=>{o.v[i][a]=all.c[a];});moved(o);});}
  else if(kind==='View'&&B){t.forEach(({o,ids})=>{ids.forEach(i=>{const d=V.dot(V.sub(o.v[i],all.c),B.f);o.v[i]=V.sub(o.v[i],V.mul(B.f,d));});moved(o);});}
  log('Align '+kind+'.');redraw();
}
function opCleanup(){
  const objs=S.objects.filter(o=>o.type==='mesh'&&(o.sel||!S.objects.some(x=>x.sel)));
  undoPush();let rv=0,rp=0;
  objs.forEach(o=>{const v0=o.v.length,p0=o.p.length;
    const w=weldKeepUV({v:o.v,p:o.p},1e-5);o.v=w.v;o.p=w.p;o.vc=null;
    const seen=new Set();o.p=o.p.filter(pl=>{const k=[...pl.i].sort((a,b)=>a-b).join(',');if(seen.has(k))return false;seen.add(k);return true;});
    o.sv.clear();o.se.clear();o.sp.clear();touch(o);pruneVerts(o);rv+=v0-o.v.length;rp+=p0-o.p.length;});
  log('Cleanup: '+rv+' vertex va '+rp+' poligon olib tashlandi.');redraw();refreshUI();
}

/* ---------- select ---------- */
function opSelectAll(){
  if(S.level==='object'||S.level==='manip'){S.objects.forEach(o=>{if(!o.hidden&&!o.disabled)o.sel=true;});if(!S.active&&S.objects.length)S.active=S.objects[0].id;}
  else editable().forEach(o=>{if(!hasVerts(o))return;o.sel=true;
    if(S.level==='vertex')o.v.forEach((_,i)=>o.sv.add(i));else if(S.level==='edge')edgesOf(o).forEach((_,k)=>o.se.add(k));else o.p.forEach((_,i)=>o.sp.add(i));});
  redraw();refreshUI();
}
function opSelectNone(){clearSelection(S.level!=='object'&&S.level!=='manip');if(S.level==='object')S.objects.forEach(o=>o.sel=false);redraw();refreshUI();}
function opSelectInvert(){
  if(S.level==='object'||S.level==='manip')S.objects.forEach(o=>{if(!o.hidden)o.sel=!o.sel;});
  else editable().forEach(o=>{if(!hasVerts(o))return;
    if(S.level==='vertex'){const n=new Set();o.v.forEach((_,i)=>{if(!o.sv.has(i))n.add(i);});o.sv=n;}
    else if(S.level==='edge'){const n=new Set();edgesOf(o).forEach((_,k)=>{if(!o.se.has(k))n.add(k);});o.se=n;}
    else{const n=new Set();o.p.forEach((_,i)=>{if(!o.sp.has(i))n.add(i);});o.sp=n;}});
  redraw();refreshUI();
}
function opSelectOpenEdges(){
  S.level='edge';syncLevelUI();
  editable().forEach(o=>{if(o.type!=='mesh')return;edgesOf(o).forEach((e,k)=>{if(e.polys.length===1)o.se.add(k);});if(o.se.size)o.sel=true;});
  log('Open Edges: '+selectionCount().e+' ta ochiq qirra.');redraw();refreshUI();
}
function selectConnected(o,startPoly){
  const E=edgesOf(o),seen=new Set([startPoly]),st=[startPoly];
  const vp=new Map();o.p.forEach((pl,pi)=>pl.i.forEach(i=>{(vp.get(i)||vp.set(i,[]).get(i)).push(pi);}));
  while(st.length){const pi=st.pop();o.p[pi].i.forEach(i=>vp.get(i).forEach(q=>{if(!seen.has(q)){seen.add(q);st.push(q);}}));}
  return seen;
}
function selectPolysSet(o,set){
  if(S.level==='polygon'){set.forEach(pi=>o.sp.add(pi));}
  else if(S.level==='vertex'){set.forEach(pi=>o.p[pi].i.forEach(i=>o.sv.add(i)));}
  else if(S.level==='edge'){set.forEach(pi=>{const pl=o.p[pi],n=pl.i.length;for(let k=0;k<n;k++)o.se.add(edgeKey(pl.i[k],pl.i[(k+1)%n]));});}
  o.sel=true;
}

/* ---------- display ---------- */
function opHide(){const s=S.objects.filter(o=>o.sel);if(!s.length){log('Hide: obyekt tanlang.');return;}undoPush();s.forEach(o=>{o.hidden=true;o.sel=false;});if(!objById(S.active)||objById(S.active).hidden)S.active=null;log('Yashirildi: '+s.length);redraw();refreshUI();}
function opShowAll(){undoPush();S.objects.forEach(o=>o.hidden=false);redraw();refreshUI();log('Hammasi ko‘rsatildi.');}
function opDisable(v){const s=S.objects.filter(o=>o.sel);if(!s.length){log('Obyekt tanlang.');return;}undoPush();s.forEach(o=>o.disabled=v);redraw();refreshUI();}
function opEnableAll(){undoPush();S.objects.forEach(o=>o.disabled=false);redraw();refreshUI();}
function opCenterPivot(){const s=S.objects.filter(o=>o.sel);if(!s.length){log('Obyekt tanlang.');return;}undoPush();
  s.forEach(o=>{const b=o.type==='mesh'?bounds([[o,null]]):null;if(b)o.pivot=b.c;});redraw();log('Pivot markazlashtirildi.');}
function opResetPivot(){const s=S.objects.filter(o=>o.sel);if(!s.length){log('Obyekt tanlang.');return;}undoPush();s.forEach(o=>{o.pivot=[0,0,0];});redraw();log('Pivot dunyo markaziga qaytarildi.');}

/* ---------- surface ---------- */
function opNormalsCalc(){

  undoPush();let n=0;s.forEach(o=>{if(objectVolume(o)<0){o.p.forEach(flipPoly);touch(o);n++;}});
  log('Normals Calculate: '+n+' ta obyekt tashqariga qaratildi.');redraw();

function opSmooth(v){const s=S.objects.filter(o=>o.sel&&o.type==='mesh');if(!s.length){log('Obyekt tanlang.');return;}undoPush();s.forEach(o=>{o.smooth=v===undefined?!o.smooth:v;moved(o);});redraw();log('Smooth: '+(s[0].smooth?'yoqildi':'o‘chirildi'));}
function opPaint(hex){

  t.forEach(({o,ids})=>{if(!o.vc)o.vc=o.v.map(()=>[255,255,255,255]);ids.forEach(i=>{o.vc[i]=[r,g,b,255];});moved(o);});
  log('Prelit rang berildi.');redraw();

function opCopy(){

  S.objects.forEach(o=>o.sel=false);out.forEach(c=>c.sel=true);S.active=out[0].id;log('Copy: '+out.length+' ta nusxa.');redraw();refreshUI();
}
function assignMaterial(mi){MT(S.mats[mi]);

}

function finishCreate(vp,d,mx,my){

/* ---------- OBJ ---------- */

function parseOBJ(text,yup){
  const objs=[],matIdx=new Map();S.mats.forEach((m,i)=>matIdx.set(m.name,i));
  const pos=[],uvs=[];let cur=null,curMat=0;
  const conv=p=>yup?[p[0],-p[2],p[1]]:p;
  const start=n=>{cur={name:n||'obj'+(objs.length+1),vmap:new Map(),v:[],p:[]};objs.push(cur);};
  text.split(/\r?\n/).forEach(line=>{
    const t=line.trim().split(/\s+/);if(!t[0]||t[0][0]==='#')return;
    if(t[0]==='v')pos.push(conv([parseFloat(t[1]),parseFloat(t[2]),parseFloat(t[3])]));
    else if(t[0]==='vt')uvs.push([parseFloat(t[1])||0,1-(parseFloat(t[2])||0)]);
    else if(t[0]==='o'||t[0]==='g'){if(cur&&!cur.p.length&&!cur.v.length){cur.name=t.slice(1).join('_')||cur.name;}else start(t.slice(1).join('_'));}
    else if(t[0]==='usemtl'){const n=t.slice(1).join(' ');if(!matIdx.has(n)){matIdx.set(n,S.mats.length);S.mats.push({name:n,color:[190,190,190],tex:'',alpha:255});}curMat=matIdx.get(n);}
    else if(t[0]==='f'){
      if(!cur)start();
      const cs=[];t.slice(1).forEach(s=>{const q=s.split('/');let k=parseInt(q[0],10);if(k<0)k=pos.length+k+1;k--;if(k<0||k>=pos.length)return;
        let ti=q[1]?parseInt(q[1],10):NaN;if(ti<0)ti=uvs.length+ti+1;ti--;cs.push({k,uv:(ti>=0&&ti<uvs.length)?uvs[ti]:null});});
      if(cs.length<3)return;
      const loc=cs.map(c=>{let j=cur.vmap.get(c.k);if(j===undefined){j=cur.v.length;cur.v.push(pos[c.k].slice());cur.vmap.set(c.k,j);}return j;});
      const pl={i:loc,m:curMat};if(cs.every(c=>c.uv))pl.uv=cs.map(c=>c.uv.slice());cur.p.push(pl);
    }
  });
  return objs.filter(o=>o.p.length);
}
function toOBJ(yup){
  const meshes=S.objects.filter(o=>o.type==='mesh'&&!o.hidden&&o.p.length);let out='# ZModeler Web OBJ export\r\n',base=1,tbase=1;
  const useMtl=S.mats.length>1||S.mats.some(m=>m.tex);
  if(useMtl)out+='mtllib '+baseName()+'.mtl\r\n';
  const cv=p=>yup?[p[0],p[2],-p[1]]:p;
  meshes.forEach(o=>{
    out+='o '+o.name.replace(/\s+/g,'_')+'\r\n';o.v.forEach(p=>{const q=cv(p);out+='v '+q[0].toFixed(6)+' '+q[1].toFixed(6)+' '+q[2].toFixed(6)+'\r\n';});
    const polyUV=o.p.map(pl=>uvOf(o,pl));
    polyUV.forEach(u=>u.forEach(q=>{out+='vt '+q[0].toFixed(6)+' '+(1-q[1]).toFixed(6)+'\r\n';}));
    let lastM=-1,t=tbase;o.p.forEach((pl,pi)=>{if(useMtl&&pl.m!==lastM){out+='usemtl '+(S.mats[pl.m]?S.mats[pl.m].name:'Default').replace(/\s+/g,'_')+'\r\n';lastM=pl.m;}
      out+='f '+pl.i.map((i,k)=>(i+base)+'/'+(t+k)).join(' ')+'\r\n';t+=pl.i.length;});
    base+=o.v.length;tbase=t;});
  let mtl='';if(useMtl)S.mats.forEach(m=>{mtl+='newmtl '+m.name.replace(/\s+/g,'_')+'\r\nKd '+(m.color[0]/255).toFixed(4)+' '+(m.color[1]/255).toFixed(4)+' '+(m.color[2]/255).toFixed(4)+'\r\n'+(m.alpha<255?'d '+(m.alpha/255).toFixed(3)+'\r\n':'')+(m.tex?'map_Kd '+m.tex+'.png\r\n':'')+'\r\n';});
  return{obj:out,mtl:useMtl?mtl:null};
}

function toSTL(){
  const tris=[];S.objects.forEach(o=>{if(o.type!=='mesh'||o.hidden)return;o.p.forEach(pl=>triangulate(pl).forEach(t=>tris.push(t.map(i=>o.v[i]))));});
  const buf=new ArrayBuffer(84+tris.length*50),dv=new DataView(buf);dv.setUint32(80,tris.length,true);
  tris.forEach((t,k)=>{const n=V.norm(V.cross(V.sub(t[1],t[0]),V.sub(t[2],t[0]))),o=84+k*50;
    [n,t[0],t[1],t[2]].forEach((v,j)=>{for(let q=0;q<3;q++)dv.setFloat32(o+j*12+q*4,v[q],true);});});
  return new Blob([buf],{type:'application/octet-stream'});
}

/* ---------- DFF export (RenderWare 3.6, GTA SA) ---------- */
function buildMeshGeometry(o){
  const nrmRaw=o.p.map(pl=>{let x=0,y=0,z=0;const n=pl.i.length;for(let k=0;k<n;k++){const a=o.v[pl.i[k]],b=o.v[pl.i[(k+1)%n]];x+=(a[1]-b[1])*(a[2]+b[2]);y+=(a[2]-b[2])*(a[0]+b[0]);z+=(a[0]-b[0])*(a[1]+b[1]);}return[x,y,z];});
  const nrmU=nrmRaw.map(V.norm);
  const dom=nrmU.map(n=>{const a=n.map(Math.abs);return a[0]>=a[1]&&a[0]>=a[2]?0:a[1]>=a[2]?1:2;});
  const uses=o.v.map(()=>[]);
  o.p.forEach((pl,pi)=>pl.i.forEach(i=>uses[i].push(pi)));
  const outV=[],outN=[],outUV=[],outC=[],cornerMap=new Map(); // key vi|cluster -> out index
  const xs=XT(o),cosT=xs.flat?2:o.smooth?(xs.sAng>=180?-2:Math.cos(xs.sAng*Math.PI/180)-1e-9):Math.cos(48*Math.PI/180);
  const clusterOf=new Map(); // `${vi}|${pi}` -> out idx
  o.v.forEach((p,vi)=>{
    const clusters=[];
    uses[vi].forEach(pi=>{
      const cuv=uvOf(o,o.p[pi])[o.p[pi].i.indexOf(vi)];
      let c=clusters.find(c=>c.dom===(o.smooth?c.dom:dom[pi])&&V.dot(c.n0,nrmU[pi])>cosT&&Math.abs(c.uv[0]-cuv[0])<1e-5&&Math.abs(c.uv[1]-cuv[1])<1e-5);
      if(!c){c={n0:nrmU[pi],dom:dom[pi],sum:[0,0,0],polys:[],uv:cuv};clusters.push(c);}
      c.sum=V.add(c.sum,nrmRaw[pi]);c.polys.push(pi);});
    if(!clusters.length){clusters.push({n0:[0,0,1],dom:2,sum:[0,0,1],polys:[],uv:[0,0]});}
    clusters.forEach(c=>{const idx=outV.length;
      const q=V.sub(p,o.pivot);outV.push(q);
      if(o.nproj){const dd=V.sub(p,o.pivot);if(o.nproj==='cyl')dd[2]=0;outN.push(V.len(dd)>1e-9?V.norm(dd):V.norm(c.sum));}else outN.push(V.norm(c.sum));
      outUV.push(c.uv.slice());
      outC.push(o.vc&&o.vc[vi]?o.vc[vi]:[255,255,255,255]);
      c.polys.forEach(pi=>clusterOf.set(vi+'|'+pi,idx));});
  });
  if(outV.length>65535)throw new Error('"'+o.name+'": DFF uchun juda ko‘p vertex ('+outV.length+' > 65535). Obyektni bo‘ling.');
  const usedMats=[...new Set(o.p.map(pl=>pl.m||0))].sort((a,b)=>a-b),mapM=new Map(usedMats.map((m,k)=>[m,k]));
  const tris=[];o.p.forEach((pl,pi)=>triangulate(pl).forEach(([a,b,c])=>{tris.push(clusterOf.get(a+'|'+pi),clusterOf.get(b+'|'+pi),clusterOf.get(c+'|'+pi),mapM.get(pl.m||0));}));
  const g={pos:new Float32Array(outV.flat()),nrm:new Float32Array(outN.flat()),uv:new Float32Array(outUV.flat()),day:null,night:null,tris,fx2d:null,
    materials:usedMats.map(m=>{const mm=S.mats[m]||S.mats[0];return{color:[mm.color[0],mm.color[1],mm.color[2],mm.alpha==null?255:mm.alpha],tex:mm.tex||'',mask:''};})};
  if(o.vc&&o.vc.length)g.day=new Uint8Array(outC.flat());
  return g;
}
function buildDffBytes(){
  const items=S.objects.filter(o=>!o.hidden&&((o.type==='mesh'&&o.p.length)||o.type==='dummy'));
  if(!items.length)throw new Error('Eksport uchun obyekt yo‘q.');
  const frames=[{name:'',pos:[0,0,0],parent:-1}],geoms=[],atomics=[];
  items.forEach(o=>{
    frames.push({name:o.name.slice(0,23),pos:o.pivot.slice(),parent:0});
    if(o.type==='mesh'){geoms.push(buildMeshGeometry(o));atomics.push({frame:frames.length-1,geom:geoms.length-1});}
  });
  if(!geoms.length)throw new Error('DFF uchun kamida bitta mesh kerak.');
  const clump=DFF.buildClump({frames,geoms,atomics},0x1803FFFF);
  return DFF.serialize([clump]);
}

/* ---------- DFF import ---------- */
function importDFF(bytes,name){
  const dff=DFF.parseDff(bytes);
  const mats=new Map();S.mats.forEach((m,i)=>mats.set(m.name+'|'+m.color.join(',')+'|'+m.tex,i));
  const W=frameWorlds(dff.frames),created=[];
  dff.atomics.forEach((at,ai)=>{
    const g=dff.geoms[at.geom];if(!g||g.native||!g.pos){log('DFF: native geometriya o‘tkazib yuborildi.');return;}
    const fr=dff.frames[at.frame]||{name:''},M=W[at.frame];
    const o=newObject(uniqueName(fr.name||name||'dff_obj'),'mesh');
    for(let i=0;i<g.nV;i++)o.v.push(xp(M,[g.pos[i*3],g.pos[i*3+1],g.pos[i*3+2]]));
    const mi=(g.materials||[]).map((m,k)=>{const nm=(m.tex||'mat'+k);const key=nm+'|'+m.color.slice(0,3).join(',')+'|'+(m.tex||'');
      if(!mats.has(key)){mats.set(key,S.mats.length);S.mats.push({name:nm,color:m.color.slice(0,3),tex:m.tex||'',alpha:m.color[3]});}return mats.get(key);});
    for(let i=0;i<g.nTri;i++){const a=g.tris[i*4],b=g.tris[i*4+1],c=g.tris[i*4+2],m=g.tris[i*4+3];{const pl={i:[a,b,c],m:mi[m]||0},uu=g.uvs&&g.uvs[0];if(uu)pl.uv=[a,b,c].map(k=>[uu[k*2],uu[k*2+1]]);o.p.push(pl);}}
    o.pivot=[M[12],M[13],M[14]];o.smooth=false;
    if(g.dayColors){o.vc=[];for(let i=0;i<g.nV;i++)o.vc.push([g.dayColors[i*4],g.dayColors[i*4+1],g.dayColors[i*4+2],g.dayColors[i*4+3]]);}
    const w=weldKeepUV({v:o.v,p:o.p},1e-5);
    if(!o.vc){o.v=w.v;o.p=w.p;}
    created.push(o);
  });
  const used=new Set(dff.atomics.map(a=>a.frame));
  dff.frames.forEach((f,i)=>{if(i===0&&f.parent<0&&!f.name)return;if(!used.has(i)&&f.name){const d=newObject(uniqueName(f.name),'dummy');d.pivot=[W[i][12],W[i][13],W[i][14]];created.push(d);}});
  return created;
}
function matFromFrame(f){const r=f.rot,p=f.pos;return[r[0],r[1],r[2],0,r[3],r[4],r[5],0,r[6],r[7],r[8],0,p[0],p[1],p[2],1];}
function mmul(a,b){const o=new Array(16).fill(0);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
const xp=(m,p)=>[m[0]*p[0]+m[4]*p[1]+m[8]*p[2]+m[12],m[1]*p[0]+m[5]*p[1]+m[9]*p[2]+m[13],m[2]*p[0]+m[6]*p[1]+m[10]*p[2]+m[14]];
function frameWorlds(frames){const W=new Array(frames.length);
  const get=i=>{if(W[i])return W[i];const l=matFromFrame(frames[i]),p=frames[i].parent;return W[i]=(p>=0&&p<frames.length&&p!==i)?mmul(get(p),l):l;};
  frames.forEach((_,i)=>get(i));return W;}

    sc={c:bb0?bb0.c:[0,0,0],r:bb0?Math.max(.5,V.len(V.sub(bb0.mx,bb0.mn))/2):10};
  const VP=glMatrix(vp,B,sc),textured=mode==='tex'||mode==='texwire',wire=mode==='solidwire'||mode==='texwire';
  const eye=vp.persp?B.eye:V.sub(vp.target,V.mul(B.f,5000)),Lh=lightFor(B),lights=sceneLights(),useHead=(!lights.length||S.cfg.headlight)?1:0;

  const lp=new Float32Array(16),lc=new Float32Array(16),ld=new Float32Array(16),ls=new Float32Array(16);
  lights.forEach((o,i)=>{const x=o.x||{},col=hex3(x.color||'#ffffff'),k=x.kind||'omni',inten=x.inten==null?1:x.inten;
    const dir=o.v[0]?V.norm(V.sub(o.v[0],o.pivot)):[0,0,-1];
    lp.set([o.pivot[0],o.pivot[1],o.pivot[2],k==='omni'?0:k==='dir'?1:2],i*4);lc.set([col[0]*inten,col[1]*inten,col[2]*inten,1],i*4);ld.set([dir[0],dir[1],dir[2],0],i*4);
    const hot=Math.cos((x.hot==null?20:x.hot)*Math.PI/180),fall=Math.cos((x.fall==null?45:x.fall)*Math.PI/180);ls.set([hot,fall,0,0],i*4);});
  gl.uniform4fv(u.uLP,lp);gl.uniform4fv(u.uLC,lc);gl.uniform4fv(u.uLD,ld);gl.uniform4fv(u.uLS,ls);gl.uniform1f(u.uNL,lights.length);
  gl.uniform1i(u.uTex,0);gl.activeTexture(gl.TEXTURE0);
  const attr=(b,i)=>{gl.bindBuffer(gl.ARRAY_BUFFER,b.b);gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,b.size,b.type,b.norm,0,0);};
  const solidObjs=objs.filter(o=>vp.persp?XT(o).solidP:true),transObjs=new Set(),bgv=hex2rgb(S.cfg.bg).map(v=>v/255);
  gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1,1);
  const drawGroups=(o,pass)=>{
    const e=glEntry(o),x=XT(o);if(!e.pos)return;
    attr(e.pos,0);attr(e.nrm,1);attr(e.uv,2);attr(e.col,3);
    if(x.noCull||!(S.cfg.cull||x.flipInt))gl.disable(gl.CULL_FACE);else{gl.enable(gl.CULL_FACE);gl.cullFace(x.flipInt?gl.FRONT:gl.BACK);}
    gl.uniform1f(u.uBackTint,x.noCull?0:1);gl.uniform1f(u.uDim,o.disabled?.55:0);
    e.groups.forEach(g=>{
      const m=MT(S.mats[g.m]||S.mats[0]),isTrans=m.blend.on||m.alpha<255||x.semi;
      if(pass==='opaque'&&isTrans){transObjs.add(o);return;}
      if(pass==='trans'&&!isTrans)return;
      const tx=textured?glTexture(m.tex):null;
      gl.bindTexture(gl.TEXTURE_2D,tx?tx.tex:GLR.white);gl.uniform1f(u.uUseTex,tx?1:0);
      gl.uniform4f(u.uDiff,m.color[0]/255,m.color[1]/255,m.color[2]/255,(x.semi&&m.alpha>=255)?.6:m.alpha/255);
      gl.uniform3f(u.uEmis,m.emis[0]/255,m.emis[1]/255,m.emis[2]/255);
      gl.uniform3f(u.uSpecC,m.spec[0]/255,m.spec[1]/255,m.spec[2]/255);gl.uniform1f(u.uSpecS,m.hl.on?m.hl.str:(x.hiBlend?.35:0));
      gl.uniform1f(u.uPrelit,(o.vc&&o.vc.length&&!S.cfg.noPrelit)?1:0);gl.uniform1f(u.uWeights,(S.weightView&&o.bw)?1:0);
      gl.uniform1f(u.uAT,m.atest.on?1:0);gl.uniform1f(u.uATref,m.atest.ref/255);gl.uniform1f(u.uATfn,m.atest.fn);
      if(pass==='trans'){
        gl.enable(gl.BLEND);const bg=BLEND_GL(gl);let s=m.blend.src,d=m.blend.dst;if(!m.blend.on){s=4;d=5;}
        gl.blendFuncSeparate(s===4?gl.ONE:bg[s],bg[d],gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
      }else{gl.disable(gl.BLEND);gl.depthMask(!m.noZW);}
      gl.drawArrays(gl.TRIANGLES,g.start,g.count);

  };

  const tl=[...transObjs].map(o=>{const b=bounds([[o,null]]);return{o,d:b?V.dot(V.sub(b.c,vp.persp?B.eye:vp.target),B.f):0};}).sort((a,b)=>b.d-a.d);
  tl.forEach(t=>drawGroups(t.o,'trans'));
  gl.disable(gl.BLEND);gl.depthMask(true);for(let i=0;i<4;i++)gl.disableVertexAttribArray(i);
  gl.disable(gl.POLYGON_OFFSET_FILL);gl.disable(gl.CULL_FACE);
  /* wire overlay (hidden lines removed). Selected objects are always outlined. */
  const L=GLR.L;gl.useProgram(L.p);gl.uniformMatrix4fv(L.u.uVP,false,VP);gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
  objs.forEach(o=>{
    if(!wire&&!o.sel)return;
    const e=glEntry(o);if(!e.wire)return;const x=XT(o);
    let c;if(o.disabled)c=[.4,.4,.4,1];else if(o.sel)c=o.id===S.active?[1,.44,.44,1]:[1,.26,.26,1];
    else if(x.wireOn)c=[...hex3(x.wireCol),1];else c=[.04,.04,.05,.8];
    gl.uniform4fv(L.u.uC,c);gl.bindBuffer(gl.ARRAY_BUFFER,e.wire);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);gl.drawArrays(gl.LINES,0,e.nWire);
  });
  gl.disableVertexAttribArray(0);gl.disable(gl.BLEND);gl.depthMask(true);
  vp.ctx.drawImage(GLR.cv,0,GLR.cv.height-H,W,H,0,0,vp.W,vp.H);
  glGC();
}

function newSpline(pts,closed,smooth,name){
  const o=newObject(nameNum(name||'Spline'),'spline');o.v=pts.map(p=>p.slice());const x=XT(o);x.closed=!!closed;x.smooth=smooth!==false;x.steps=S.opt.splSteps||8;x.vt=pts.map(()=>'bezier');centerPivot(o);return o;

function splinePoly(o,steps){
  const x=XT(o),v=o.v,n=v.length;if(n<2)return v.map(p=>p.slice());
  const closed=!!x.closed,segs=closed?n:n-1;
  if(!x.smooth){const r=v.map(p=>p);if(closed)r.push(v[0]);return r;}
  steps=steps||x.steps||8;const vt=x.vt||[];
  const P=i=>v[closed?((i%n)+n)%n:clamp(i,0,n-1)];
  const T=i=>{if(vt[i]==='corner')return[0,0,0];const a=P(i-1),b=P(i+1);
    if(!closed&&(i===0||i===n-1)){const q=i===0?V.sub(P(1),P(0)):V.sub(P(n-1),P(n-2));return q;}
    return V.mul(V.sub(b,a),.5);};

    const p0=P(s),p1=P(s+1),m0=T(s%n),m1=T((s+1)%n);
    for(let k=0;k<steps;k++){const t=k/steps,t2=t*t,t3=t2*t;
      const h00=2*t3-3*t2+1,h10=t3-2*t2+t,h01=-2*t3+3*t2,h11=t3-t2;
      out.push([0,1,2].map(a=>h00*p0[a]+h10*m0[a]+h01*p1[a]+h11*m1[a]));}
  }
  out.push(closed?v[0].slice():v[n-1].slice());return out;
}
function polyLength(pts){let l=0;for(let i=1;i<pts.length;i++)l+=V.len(V.sub(pts[i],pts[i-1]));return l;}
function resample(pts,count,closed){ // equally spaced points along polyline
  const pp=closed?pts.concat([pts[0]]):pts.slice(),cum=[0];for(let i=1;i<pp.length;i++)cum.push(cum[i-1]+V.len(V.sub(pp[i],pp[i-1])));

  for(let k=0;k<n;k++){const d=closed?L*k/n:L*k/Math.max(1,n-1);let i=1;while(i<cum.length-1&&cum[i]<d)i++;
    const seg=Math.max(1e-12,cum[i]-cum[i-1]),t=clamp((d-cum[i-1])/seg,0,1);out.push(V.lerp(pp[i-1],pp[i],t));}

const imgCache=new Map();
function texImage(name){
  const real=findTexture(name);if(!real)return null;let im=imgCache.get(real);
  if(!im){im=new Image();im.onload=()=>redraw();im.src=S.textures[real];imgCache.set(real,im);}
  return im.complete&&im.naturalWidth?im:null;
}
function uvDisplay(){
  const out=[];
  S.objects.forEach(o=>{
    if(o.type!=='mesh'||o.hidden)return;let pis=null;
    if(S.level==='polygon'&&o.sp.size)pis=[...o.sp].filter(i=>o.p[i]);
    else if(S.level==='vertex'&&o.sv.size){pis=[];o.p.forEach((pl,pi)=>{if(pl.i.some(i=>o.sv.has(i)))pis.push(pi);});}
    else if(S.level==='edge'&&o.se.size){const set=new Set();edgesOf(o).forEach((e,k)=>{if(o.se.has(k))e.polys.forEach(p=>set.add(p));});pis=[...set];}
    else if(o.sel)pis=o.p.map((_,i)=>i);
    if(pis&&pis.length)out.push({o,pis});
  });
  return out;
}
const uvs2=(vp,u,v)=>[vp.W/2+(u-vp.uvc[0])*vp.uvz,vp.H/2+(v-vp.uvc[1])*vp.uvz];
const uvKey=(pi,k)=>pi+':'+k;
function uvSelCount(){let n=0;S.objects.forEach(o=>{if(o.suv)n+=o.suv.size;});return n;}
function uvClearSel(){S.objects.forEach(o=>{if(o.suv)o.suv.clear();});}
function renderUV(vp){
  const c=vp.ctx,W=vp.W,H=vp.H;
  if(!vp.uvc){vp.uvc=[.5,.5];vp.uvz=Math.min(W,H)*.78;}
  const disp=uvDisplay(),z=vp.uvz,p00=uvs2(vp,0,0),p11=uvs2(vp,1,1);
  /* texture */
  let img=null,matName='';
  if(disp.length){const o=disp[0].o,pl=o.p[disp[0].pis[0]],m=MT(S.mats[pl.m]||S.mats[0]);matName=m.name+(m.tex?' ['+m.tex+']':'');img=texImage(m.tex);}
  c.save();
  if(img){c.globalAlpha=.9;c.drawImage(img,p00[0],p00[1],p11[0]-p00[0],p11[1]-p00[1]);c.globalAlpha=1;}
  else{c.fillStyle='#4a4a4a';c.fillRect(p00[0],p00[1],p11[0]-p00[0],p11[1]-p00[1]);
    const n=8,w=(p11[0]-p00[0])/n,h=(p11[1]-p00[1])/n;c.fillStyle='#555';for(let i=0;i<n;i++)for(let j=0;j<n;j++)if((i+j)&1)c.fillRect(p00[0]+i*w,p00[1]+j*h,w,h);}
  c.restore();
  /* grid */
  c.lineWidth=1;c.strokeStyle='rgba(255,255,255,.12)';c.beginPath();
  const step=z>600?.05:z>200?.1:.25,u0=Math.floor((vp.uvc[0]-W/2/z)/step)*step,u1=vp.uvc[0]+W/2/z,v0=Math.floor((vp.uvc[1]-H/2/z)/step)*step,v1=vp.uvc[1]+H/2/z;
  for(let u=u0;u<=u1;u+=step){const a=uvs2(vp,u,v0),b=uvs2(vp,u,v1);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);}
  for(let v=v0;v<=v1;v+=step){const a=uvs2(vp,u0,v),b=uvs2(vp,u1,v);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);}c.stroke();
  c.strokeStyle='#e8c040';c.lineWidth=1.5;c.strokeRect(p00[0],p00[1],p11[0]-p00[0],p11[1]-p00[1]);
  /* polygons */
  c.lineWidth=1;
  disp.forEach(({o,pis})=>{
    const sel=o.suv||new Set();c.strokeStyle='#7fc4ff';c.beginPath();
    pis.forEach(pi=>{const pl=o.p[pi],uv=uvOf(o,pl);pl.i.forEach((_,k)=>{const a=uvs2(vp,uv[k][0],uv[k][1]),b=uvs2(vp,uv[(k+1)%uv.length][0],uv[(k+1)%uv.length][1]);c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);});});c.stroke();
    const r=3;c.fillStyle='#f0e060';c.beginPath();
    pis.forEach(pi=>{const pl=o.p[pi],uv=uvOf(o,pl);uv.forEach((q,k)=>{if(!sel.has(uvKey(pi,k))){const a=uvs2(vp,q[0],q[1]);c.rect(a[0]-r+.5,a[1]-r+.5,r*2,r*2);}});});c.fill();
    c.fillStyle='#ff3030';c.beginPath();
    pis.forEach(pi=>{const pl=o.p[pi],uv=uvOf(o,pl);uv.forEach((q,k)=>{if(sel.has(uvKey(pi,k))){const a=uvs2(vp,q[0],q[1]);c.rect(a[0]-r-1,a[1]-r-1,r*2+2,r*2+2);}});});c.fill();
  });
  if(vp.rubber){const r=vp.rubber;c.strokeStyle='#ffff80';c.setLineDash([4,3]);
    if(r.kind==='circle'){c.beginPath();c.arc(r.x0,r.y0,Math.hypot(r.x1-r.x0,r.y1-r.y0),0,Math.PI*2);c.stroke();}else c.strokeRect(Math.min(r.x0,r.x1)+.5,Math.min(r.y0,r.y1)+.5,Math.abs(r.x1-r.x0),Math.abs(r.y1-r.y0));c.setLineDash([]);}
  c.fillStyle='rgba(255,255,255,.85)';c.font='11px Tahoma,sans-serif';
  c.fillText(disp.length?('Material: '+matName+'   |   UV selected: '+uvSelCount()):'Ko‘rsatish uchun mesh yoki poligon/vertex tanlang (UV Mapper tanlangan elementlar UV sini ko‘rsatadi).',8,H-8);
}
function uvPick(vp,mx,my,r){
  r=r||8;let best=null,bd=r;
  uvDisplay().forEach(({o,pis})=>pis.forEach(pi=>{const pl=o.p[pi],uv=uvOf(o,pl);uv.forEach((q,k)=>{const a=uvs2(vp,q[0],q[1]),d=Math.hypot(a[0]-mx,a[1]-my);if(d<bd){bd=d;best={o,pi,k,u:q[0],v:q[1],vi:pl.i[k]};}});}));
  return best;
}
function uvAddHit(h,sub){ // selects the corner and every coincident corner of the same vertex
  const o=h.o;if(!o.suv)o.suv=new Set();
  o.p.forEach((pl,pi)=>{const uv=uvOf(o,pl);pl.i.forEach((vi,k)=>{if(vi===h.vi&&Math.abs(uv[k][0]-h.u)<1e-4&&Math.abs(uv[k][1]-h.v)<1e-4){if(sub)o.suv.delete(uvKey(pi,k));else o.suv.add(uvKey(pi,k));}});});
}
function uvIsSel(h){return h.o.suv&&h.o.suv.has(uvKey(h.pi,h.k));}
function uvSelList(){ // [{o,pi,k}]
  const out=[];S.objects.forEach(o=>{if(o.suv)o.suv.forEach(key=>{const [pi,k]=key.split(':').map(Number);if(o.p[pi]&&k<o.p[pi].i.length)out.push({o,pi,k});});});return out;
}
function uvRectSelect(vp,inside,mode){
  if(mode==='set')uvClearSel();
  uvDisplay().forEach(({o,pis})=>{if(!o.suv)o.suv=new Set();pis.forEach(pi=>{const uv=uvOf(o,o.p[pi]);uv.forEach((q,k)=>{const a=uvs2(vp,q[0],q[1]);if(inside(a[0],a[1])){if(mode==='sub')o.suv.delete(uvKey(pi,k));else o.suv.add(uvKey(pi,k));}});});});
}
function uvDown(vp,e,mx,my){
  if(!vp.uvc){vp.uvc=[.5,.5];vp.uvz=Math.min(vp.W,vp.H)*.78;}
  if(e.button===1||e.button===2||(e.button===0&&S.tool==='pan')){D.mode='uvpan';D.c0=vp.uvc.slice();return true;}
  if(e.button!==0)return true;
  const t=S.tool,hit=uvPick(vp,mx,my);
  if(t==='move'||t==='rotate'||t==='scale'){
    if(hit&&!uvIsSel(hit)){if(!e.shiftKey)uvClearSel();uvAddHit(hit);}
    const L=uvSelList();
    if(L.length){
      undoPush();ensureUV(L[0].o,L.map(x=>x.pi));S.objects.forEach(o=>{const ps=L.filter(x=>x.o===o).map(x=>x.pi);if(ps.length)ensureUV(o,ps);});
      D.mode='uvx';D.kind=t;D.base=L.map(({o,pi,k})=>({o,pi,k,q:o.p[pi].uv[k].slice()}));
      const b=uvBounds(D.base.map(x=>x.q));D.ctr=[(b.u0+b.u1)/2,(b.v0+b.v1)/2];return true;}
  }
  D.mode='uvrect';D.shape=t==='circle'?'circle':'rect';return true;
}
function uvDrag(vp,dx,dy,e){
  if(D.mode==='uvpan'){vp.uvc=[D.c0[0]-dx/vp.uvz,D.c0[1]-dy/vp.uvz];redraw();return;}
  if(D.mode==='uvrect'&&D.moved){vp.rubber=D.shape==='circle'?{kind:'circle',x0:D.x0,y0:D.y0,x1:D.x,y1:D.y}:{kind:'rect',x0:D.x0,y0:D.y0,x1:D.x,y1:D.y};redraw();return;}
  if(D.mode==='uvx'&&D.moved){
    const m=axisMask(),any=m[0]||m[1];let du=dx/vp.uvz,dv=dy/vp.uvz;
    if(S.snap.on&&S.snap.grid){const g=.0625;du=Math.round(du/g)*g;dv=Math.round(dv/g)*g;}
    D.base.forEach(({o,pi,k,q})=>{
      let r;
      if(D.kind==='move')r=[q[0]+((any&&!m[0])?0:du),q[1]+((any&&!m[1])?0:dv)];
      else if(D.kind==='rotate'){const a=dx*.012,cs=Math.cos(a),sn=Math.sin(a),x=q[0]-D.ctr[0],y=q[1]-D.ctr[1];r=[D.ctr[0]+x*cs-y*sn,D.ctr[1]+x*sn+y*cs];}
      else{const f=Math.exp(dx*.006);r=[D.ctr[0]+(q[0]-D.ctr[0])*((any&&!m[0])?1:f),D.ctr[1]+(q[1]-D.ctr[1])*((any&&!m[1])?1:f)];}
      o.p[pi].uv[k]=r;moved(o);
    });
    const el=$('stCoord');if(el)el.textContent='UV Δ '+du.toFixed(3)+', '+dv.toFixed(3);redraw();
  }
}
function uvUp(vp,d,mx,my){
  if(d.mode==='uvx'){if(!d.moved)UNDO.pop();else modified=true;redraw();return true;}
  if(d.mode==='uvrect'){
    const mode=d.ctrl?'sub':d.shift?'add':'set';
    if(!d.moved){const h=uvPick(vp,mx,my);if(mode==='set')uvClearSel();if(h)uvAddHit(h,mode==='sub');}
    else if(d.shape==='circle'){const r=Math.hypot(mx-d.x0,my-d.y0);uvRectSelect(vp,(x,y)=>Math.hypot(x-d.x0,y-d.y0)<=r,mode);}
    else{const x0=Math.min(d.x0,mx),x1=Math.max(d.x0,mx),y0=Math.min(d.y0,my),y1=Math.max(d.y0,my);uvRectSelect(vp,(x,y)=>x>=x0&&x<=x1&&y>=y0&&y<=y1,mode);}

/* mapping commands */

function uvEachCorner(fn){ // selected corners if any, else all displayed

function uvCenterOf(){const pts=[];const L=uvSelList();if(L.length)L.forEach(({o,pi,k})=>pts.push(uvOf(o,o.p[pi])[k]));else uvTargets().forEach(({o,pis})=>pis.forEach(pi=>uvOf(o,o.p[pi]).forEach(q=>pts.push(q))));

function uvFit01(){undoPush();const pts=[];uvTargets().forEach(({o,pis})=>pis.forEach(pi=>uvOf(o,o.p[pi]).forEach(q=>pts.push(q))));const b=uvBounds(pts);if(!b)return;

const childrenOf=o=>S.objects.filter(c=>XT(c).parent===o.id);
function descendants(o,acc){acc=acc||[];childrenOf(o).forEach(c=>{if(!acc.includes(c)){acc.push(c);descendants(c,acc);}});return acc;}
function linkSelectedToActive(){

function unlinkSelected(withChildren){undoPush();S.objects.forEach(o=>{if(o.sel){if(withChildren)childrenOf(o).forEach(c=>{XT(c).parent=null;});else XT(o).parent=null;}});log('Unlink.');refreshUI();}
function fixChildrenOnDelete(dead){ // Delete options: Children → Relink (default) or Delete

/* ---------- Convert To ---------- */
function convertToDummy(){const T=S.objects.filter(o=>o.sel&&o.type==='mesh');if(!T.length){log('Convert To Dummy: mesh tanlang.');return;}undoPush();
  T.forEach(o=>{o.type='dummy';o.v=[];o.p=[];o.vc=null;o.sv.clear();o.se.clear();o.sp.clear();touch(o);});log('Dummy ga aylantirildi: '+T.length);redraw();refreshUI();}
function convertTriangles(){
  const T=S.objects.filter(o=>o.type==='mesh'&&(S.level==='polygon'?o.sp.size:o.sel));if(!T.length){log('Triangles: poligon yoki obyekt tanlang.');return;}undoPush();let n=0;
  T.forEach(o=>{const sel=S.level==='polygon'?o.sp:null,np=[];o.p.forEach((pl,pi)=>{if((sel&&!sel.has(pi))||pl.i.length===3){np.push(pl);return;}const uv=uvOf(o,pl);
    for(let k=1;k<pl.i.length-1;k++){np.push({i:[pl.i[0],pl.i[k],pl.i[k+1]],m:pl.m,uv:[uv[0].slice(),uv[k].slice(),uv[k+1].slice()]});}n++;});
    o.p=np;o.sp.clear();touch(o);});
  log('Triangles: '+n+' ta poligon uchburchaklarga bo‘lindi.');redraw();refreshUI();
}
function convertQuad(){
  if(S.level!=='edge'){log('Quad: Edge darajasida, ikki uchburchak orasidagi qirrani tanlang.');return;}
  const T=S.objects.filter(o=>o.type==='mesh'&&o.se.size);if(!T.length){log('Quad: qirra tanlang.');return;}undoPush();let n=0;
  T.forEach(o=>{const E=edgesOf(o);const kill=new Set(),add=[];
    o.se.forEach(k=>{const e=E.get(k);if(!e||e.polys.length!==2)return;const [p,q]=e.polys.map(i=>o.p[i]);if(!p||!q||p.i.length!==3||q.i.length!==3||kill.has(e.polys[0])||kill.has(e.polys[1]))return;
      const shared=[e.a,e.b],pa=p.i.find(i=>!shared.includes(i)),qa=q.i.find(i=>!shared.includes(i));

function drawMatPreview(cv,m){
  MT(m);const c=cv.getContext('2d'),W=cv.width,H=cv.height;c.fillStyle='#3a3a3a';c.fillRect(0,0,W,H);
  for(let i=0;i<8;i++)for(let j=0;j<8;j++)if((i+j)&1){c.fillStyle='#454545';c.fillRect(i*W/8,j*H/8,W/8,H/8);}

  const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const tc=tmp.getContext('2d');
  if(img){tc.drawImage(img,cx-r,cy-r,r*2,r*2);}else{tc.fillStyle='rgb('+m.color.join(',')+')';tc.fillRect(0,0,W,H);}
  c.globalAlpha=m.alpha/255;c.drawImage(tmp,0,0);c.globalAlpha=1;
  const g=c.createRadialGradient(cx-r*.4,cy-r*.45,r*.05,cx,cy,r*1.05);g.addColorStop(0,m.hl.on?'rgba(255,255,255,.75)':'rgba(255,255,255,.25)');g.addColorStop(.35,'rgba(255,255,255,0)');g.addColorStop(.75,'rgba(0,0,0,.25)');g.addColorStop(1,'rgba(0,0,0,.65)');
  c.fillStyle=g;c.fillRect(0,0,W,H);c.restore();c.strokeStyle='#222';c.strokeRect(.5,.5,W-1,H-1);
}

/* ---------- 3DS (Autodesk 3D Studio) ---------- */
function to3DS(){
  const meshes=S.objects.filter(o=>o.type==='mesh'&&!o.hidden&&o.p.length);if(!meshes.length)throw new Error('3DS: eksport uchun mesh yo‘q.');
  const u16=n=>{const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,n,true);return b;},u32=n=>{const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,n,true);return b;},f32=n=>{const b=new Uint8Array(4);new DataView(b.buffer).setFloat32(0,n,true);return b;};
  const cat=arr=>{let n=0;arr.forEach(a=>{n+=a.length;});const o=new Uint8Array(n);let p=0;arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;};
  const str=s=>{const t=(s||'').replace(/[^\x20-\x7e]/g,'_');const b=new Uint8Array(t.length+1);for(let i=0;i<t.length;i++)b[i]=t.charCodeAt(i);return b;};
  const ch=(id,...kids)=>{const body=cat(kids);return cat([u16(id),u32(body.length+6),body]);};
  const nm=s=>(s||'mat').replace(/\s+/g,'_').slice(0,15);
  const matChunks=S.mats.map((m,i)=>{const mm=MT(m);const kids=[ch(0xA000,str(nm(m.name||('mat'+i)))),ch(0xA020,ch(0x0011,new Uint8Array(m.color.map(v=>clamp(Math.round(v),0,255))))),ch(0xA050,ch(0x0030,u16(Math.round(m.alpha/255*100))))];
    if(m.tex)kids.push(ch(0xA200,ch(0x0030,u16(100)),ch(0xA300,str((m.tex+'.bmp').slice(0,12)))));return ch(0xAFFF,...kids);});
  const objChunks=[];let skipped=0;
  meshes.forEach(o=>{
    /* expand: unique (vertex,uv) pairs, <= 65535 verts and faces per object */
    const key=(i,q)=>i+'|'+q[0].toFixed(5)+'|'+q[1].toFixed(5),map=new Map(),ev=[],euv=[],faces=[],fm=[];
    o.p.forEach(pl=>{const uv=uvOf(o,pl),ids=pl.i.map((i,k)=>{const kk=key(i,uv[k]);let j=map.get(kk);if(j===undefined){j=ev.length;map.set(kk,j);ev.push(o.v[i]);euv.push(uv[k]);}return j;});
      triangulate({i:ids}).forEach(t=>{faces.push(t);fm.push(pl.m||0);});});
    if(ev.length>65535||faces.length>65535){skipped++;return;}
    const vb=[u16(ev.length)];ev.forEach(p=>{vb.push(f32(p[0]),f32(p[1]),f32(p[2]));});
    const fb=[u16(faces.length)];faces.forEach(t=>{fb.push(u16(t[0]),u16(t[1]),u16(t[2]),u16(7));});
    const groups=new Map();fm.forEach((m,fi)=>{(groups.get(m)||groups.set(m,[]).get(m)).push(fi);});
    const gch=[];groups.forEach((fl,m)=>{gch.push(ch(0x4130,str(nm((S.mats[m]||S.mats[0]).name||('mat'+m))),u16(fl.length),...fl.map(u16)));});
    const ub=[u16(euv.length)];euv.forEach(q=>{ub.push(f32(q[0]),f32(1-q[1]));});
    const pv=o.pivot,tr=[1,0,0,0,1,0,0,0,1,pv[0],pv[1],pv[2]].map(f32);
    objChunks.push(ch(0x4000,str(o.name.replace(/\s+/g,'_').slice(0,10)),ch(0x4100,ch(0x4110,...vb),ch(0x4120,...fb,...gch),ch(0x4140,...ub),ch(0x4160,...tr))));
  });
  if(!objChunks.length)throw new Error('3DS: obyektlar 65535 vertex/poligon chegarasidan katta — bo‘lib eksport qiling.');
  if(skipped)log('3DS: '+skipped+' ta katta obyekt o‘tkazib yuborildi (65535 chegarasi).');
  return ch(0x4D4D,ch(0x0002,u32(3)),ch(0x3D3D,ch(0x3D3E,u32(3)),...matChunks,...objChunks));
}
function parse3DS(bytes,name){
  const dv=new DataView(bytes.buffer,bytes.byteOffset,bytes.byteLength),mats=[],objs=[];
  const rd=(p)=>({id:dv.getUint16(p,true),len:dv.getUint32(p+2,true)});
  const cstr=(p,end)=>{let s='';while(p<end&&dv.getUint8(p)){s+=String.fromCharCode(dv.getUint8(p));p++;}return[s,p+1];};
  const main=rd(0);if(main.id!==0x4D4D)throw new Error('3DS: noto‘g‘ri sarlavha.');
  const walk=(p,end,fn)=>{while(p+6<=end){const c=rd(p);if(c.len<6)break;fn(c,p+6,p+c.len);p+=c.len;}};
  walk(6,Math.min(bytes.length,main.len),(c,s,e)=>{
    if(c.id!==0x3D3D)return;
    walk(s,e,(c2,s2,e2)=>{
      if(c2.id===0xAFFF){const m={name:'mat',color:[190,190,190],tex:'',alpha:255};
        walk(s2,e2,(c3,s3,e3)=>{if(c3.id===0xA000)m.name=cstr(s3,e3)[0];else if(c3.id===0xA020){walk(s3,e3,(c4,s4)=>{if(c4.id===0x0011)m.color=[dv.getUint8(s4),dv.getUint8(s4+1),dv.getUint8(s4+2)];});}
          else if(c3.id===0xA050){walk(s3,e3,(c4,s4)=>{if(c4.id===0x0030)m.alpha=Math.round(dv.getUint16(s4,true)/100*255);});}
          else if(c3.id===0xA200){walk(s3,e3,(c4,s4,e4)=>{if(c4.id===0xA300)m.tex=cstr(s4,e4)[0].replace(/\.[^.]+$/,'');});}});
        mats.push(m);}
      else if(c2.id===0x4000){
        const [oname,p3]=cstr(s2,e2),ob={name:oname,v:[],uv:[],f:[],fm:[]};
        walk(p3,e2,(c3,s3,e3)=>{if(c3.id!==0x4100)return;
          walk(s3,e3,(c4,s4,e4)=>{
            if(c4.id===0x4110){const n=dv.getUint16(s4,true);for(let i=0;i<n;i++)ob.v.push([dv.getFloat32(s4+2+i*12,true),dv.getFloat32(s4+6+i*12,true),dv.getFloat32(s4+10+i*12,true)]);}
            else if(c4.id===0x4140){const n=dv.getUint16(s4,true);for(let i=0;i<n;i++)ob.uv.push([dv.getFloat32(s4+2+i*8,true),1-dv.getFloat32(s4+6+i*8,true)]);}
            else if(c4.id===0x4120){const n=dv.getUint16(s4,true);for(let i=0;i<n;i++){const q=s4+2+i*8;ob.f.push([dv.getUint16(q,true),dv.getUint16(q+2,true),dv.getUint16(q+4,true)]);ob.fm.push(null);}
              walk(s4+2+n*8,e4,(c5,s5,e5)=>{if(c5.id===0x4130){const [mn,pp]=cstr(s5,e5),cnt=dv.getUint16(pp,true);for(let i=0;i<cnt;i++){const fi=dv.getUint16(pp+2+i*2,true);if(fi<ob.fm.length)ob.fm[fi]=mn;}}});}
          });});
        objs.push(ob);}
    });
  });
  return{mats,objs};
}
function import3DS(bytes,name){
  const d=parse3DS(bytes,name),idx=new Map();S.mats.forEach((m,i)=>idx.set(m.name,i));
  d.mats.forEach(m=>{if(!idx.has(m.name)){idx.set(m.name,S.mats.length);S.mats.push(MT(m));}});
  const out=[];
  d.objs.forEach(ob=>{if(!ob.f.length||!ob.v.length)return;const o=newObject(uniqueName(ob.name||name||'3ds_obj'),'mesh');o.v=ob.v;
    o.p=ob.f.map((f,fi)=>{const pl={i:f.slice(),m:ob.fm[fi]&&idx.has(ob.fm[fi])?idx.get(ob.fm[fi]):0};if(ob.uv.length===ob.v.length)pl.uv=f.map(k=>ob.uv[k].slice());return pl;});
    const w=weldKeepUV({v:o.v,p:o.p},1e-5);o.v=w.v;o.p=w.p;centerPivot(o);out.push(o);});

<script>
/* ===== Bamper almashtirish sahifasi bilan bog'lanish: sahifa ichida ochilganda (#bamper) bamperni qabul qilib, tahrirdan keyin qaytaradi ===== */
(function(){
'use strict';
if(!/bamper/.test(location.hash))return;
let src=null,editable=[],ready=false;
document.addEventListener('DOMContentLoaded',()=>setTimeout(()=>{ready=true;},60));
const css=document.createElement('style');
css.textContent='#bmpbar{position:fixed;left:50%;top:6px;transform:translateX(-50%);z-index:9000;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:96vw;background:#0d1626;border:1px solid #1fd6f5;border-radius:10px;padding:6px 10px;font:600 12.5px Inter,system-ui,sans-serif;color:#e6eefc;box-shadow:0 8px 30px rgba(0,0,0,.55)}#bmpbar span{opacity:.9}#bmpbar button{font:inherit;border-radius:7px;padding:6px 11px;cursor:pointer;border:1px solid #2a3a55;background:#14223a;color:#e6eefc}#bmpbar button.ok{background:linear-gradient(90deg,#1fd6f5,#8b6cff);color:#06101e;border:0}';
document.head.appendChild(css);
function send(){
  const Z=window.ZMW,objs=Z.S.objects.filter(o=>editable.includes(o.name)&&o.type==='mesh');
  if(!objs.length){alert('Bamper obyekti topilmadi — nomi o\'zgargan yoki o\'chirilgan bo\'lishi mumkin. Kerakli nom: '+editable.join(', '));return;}
  const empty=objs.filter(o=>!o.p.length);if(empty.length){alert(empty.map(o=>o.name).join(', ')+' — bo\'sh (poligon yo\'q).');return;}
  src.postMessage({type:'itshakh-zmw-result',objects:objs.map(o=>({name:o.name,v:o.v,p:o.p,smooth:!!o.smooth})),mats:Z.S.mats},'*');
  Z.log('Bamper sahifasiga qaytarildi: '+objs.map(o=>o.name+' ('+o.p.length+' poligon)').join(', '));
}
function bar(){
  let b=document.getElementById('bmpbar');if(!b){b=document.createElement('div');b.id='bmpbar';document.body.appendChild(b);}
  b.replaceChildren();const t=document.createElement('span');t.textContent='Bamper sahifasidan: '+editable.join(', ')+' — tahrirlang (qolgan qismlar muzlatilgan).';
  const ok=document.createElement('button');ok.className='ok';ok.type='button';ok.textContent='✔ Bamper sahifasiga qaytarish';ok.onclick=send;
  const no=document.createElement('button');no.type='button';no.textContent='✕ Bekor qilish';no.onclick=()=>src&&src.postMessage({type:'itshakh-zmw-cancel'},'*');
  b.append(t,ok,no);
}
window.addEventListener('message',e=>{
  const d=e.data;if(!d||typeof d!=='object')return;
  if(d.type==='itshakh-zmw-ping'){if(ready&&window.ZMW)e.source.postMessage({type:'itshakh-zmw-boot'},'*');return;}
  if(d.type!=='itshakh-zmw-load'||!window.ZMW)return;
  const Z=window.ZMW;src=e.source;editable=d.editable||[];
  try{
    Z.loadScene(d.scene,false);Z.S.fileName=d.fileName||'bamper';
    Z.afterLoad('Bamper sahifasidan yuklandi: '+editable.join(', ')+' tahrirlanadi. Qolgan qismlar muzlatilgan (Freeze) — faqat ko\'rish uchun.');
    Z.S.objects.forEach(o=>{o.sel=editable.includes(o.name);});const a=Z.S.objects.find(o=>editable.includes(o.name));if(a)Z.S.active=a.id;
    Z.fitAll();Z.refreshUI();Z.redraw();bar();
    Z.log('Tayyor bo\'lgach yuqoridagi «✔ Bamper sahifasiga qaytarish» tugmasini bosing (File→Export emas — u mashina tuzilishini saqlamaydi).');
    e.source.postMessage({type:'itshakh-zmw-loaded',objects:Z.S.objects.length},'*');
  }catch(err){alert('Yuklab bo\'lmadi: '+err.message);e.source.postMessage({type:'itshakh-zmw-error',message:err.message},'*');}
});
})();
</script>
