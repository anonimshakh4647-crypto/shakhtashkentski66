<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Google Search | IT SHAKH</title>
<style>
:root{--bg:#03060b;--card:#07111d;--accent:#19d5ff;--text:#e8f5ff;--muted:#8da5ba;--line:rgba(25,213,255,.24)}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 12%,#0b2235,#03060b 52%);color:var(--text);font-family:Inter,Arial,sans-serif}header{height:74px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06);background:rgba(2,7,14,.8);backdrop-filter:blur(12px)}.logo{font-weight:900;letter-spacing:4px;color:var(--accent);font-size:24px;text-shadow:0 0 22px rgba(25,213,255,.55)}.back{color:#7891a7;text-decoration:none;font-size:12px}.back:hover{color:var(--accent)}main{width:min(1180px,94vw);margin:auto;padding:62px 0}.title{font-size:clamp(42px,7vw,76px);line-height:.95;margin:0;font-weight:900}.title span{color:var(--accent);text-shadow:0 0 24px rgba(25,213,255,.45)}.sub{color:var(--muted);line-height:1.7;margin:18px 0 25px}.search-shell{border:1px solid var(--line);border-radius:20px;padding:14px;background:rgba(5,14,25,.72);box-shadow:0 0 40px rgba(0,130,200,.08)}.topbar{display:flex;gap:9px}.topbar input{flex:1;height:54px;border-radius:13px;border:1px solid rgba(25,213,255,.25);background:#020810;color:#fff;padding:0 16px;font-size:16px;outline:none}.topbar button{height:54px;border:0;border-radius:13px;padding:0 24px;background:var(--accent);color:#001018;font-weight:900;cursor:pointer}.topbar button:hover{filter:brightness(1.08);box-shadow:0 0 20px rgba(25,213,255,.25)}.results{margin-top:14px;min-height:360px;border:1px solid rgba(255,255,255,.06);border-radius:15px;background:#fff;color:#222;overflow:hidden}.hint{padding:35px;text-align:center;color:#66798a;background:#07111d}.open-google{display:inline-block;margin-top:12px;color:var(--accent);text-decoration:none}.gsc-control-cse{font-family:Inter,Arial,sans-serif!important;border:0!important;padding:18px!important;background:#fff!important}.gsc-control-cse *{box-sizing:border-box}.gsc-search-box{display:none!important}.gsc-result{padding:10px 0!important}.gsc-result .gs-title{color:#0b63ce!important;font-size:17px!important}.gsc-url-top{color:#17833b!important}.gs-webResult .gs-snippet{font-size:13px!important;color:#46515c!important;line-height:1.55!important}.gsc-cursor-box{margin-top:15px!important}.footer-note{margin-top:12px;color:#60778c;font-size:10px}
@media(max-width:650px){main{padding:42px 0}.topbar{flex-direction:column}.topbar button{width:100%}.results{min-height:300px}.title{font-size:50px}}
</style>
<script async src="https://cse.google.com/cse.js?cx=000888210889775888983:y9tkcjel090"></script>
</head>
<body>
<header><div class="logo">IT SHAKH</div><a class="back" href="index.html">TOOLS / GOOGLE SEARCH</a></header>
<main>
<h1 class="title">GOOGLE <span>SEARCH</span></h1>
<p class="sub">Google qidiruv natijalarini shu sahifaning o‘zida ko‘ring. Natijani ko‘rish uchun boshqa Google sahifasiga o‘tish shart emas.</p>
<section class="search-shell">
<form id="searchForm" class="topbar"><input id="searchInput" placeholder="Nimani qidirmoqchisiz?" autocomplete="off"><button type="submit">QIDIRISH</button></form>
<div class="results" id="results"><div class="hint">Qidiruv so‘zini yozing. Google natijalari shu yerda chiqadi.</div></div>
<div class="footer-note">Google Programmable Search Engine ishlatilmoqda.</div>
</section>
</main>
<script>
const input=document.getElementById('searchInput'), box=document.getElementById('results');
document.getElementById('searchForm').addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(!q)return;box.innerHTML='<div class="gcse-searchresults-only"></div>';if(window.google&&google.search&&google.search.cse){google.search.cse.element.render({div:box.querySelector('.gcse-searchresults-only'),tag:'searchresults-only',gname:'itshakh'});setTimeout(()=>{const i=box.querySelector('input.gsc-input');if(i){i.value=q;const b=box.querySelector('button.gsc-search-button');if(b)b.click();}},600)}else{box.innerHTML='<div class="hint">Google qidiruv moduli yuklanmoqda...</div>';setTimeout(()=>location.reload(),1500)}});
</script>
</body></html>
