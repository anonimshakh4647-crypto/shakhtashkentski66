<!doctype html><html lang="uz"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Google Search | IT SHAKH</title><style>
*{box-sizing:border-box}body{margin:0;background:#04060b;color:#e5e7eb;font-family:Arial,sans-serif}header{height:72px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #102235;background:#030912}.logo{font-weight:900;letter-spacing:4px;color:#19d5ff;font-size:25px;text-shadow:0 0 20px #078db0}.back{color:#7891a6;text-decoration:none;font-size:12px}main{width:min(1050px,92vw);margin:auto;padding:75px 0}.title{font-size:clamp(45px,8vw,82px);margin:0;font-weight:900}.title span{color:#19d5ff}.sub{color:#8fa4b8;line-height:1.7}.card{margin-top:30px;padding:18px;border:1px solid #16425a;border-radius:20px;background:#07111d}.row{display:flex;gap:10px}.row input{flex:1;height:58px;background:#020810;border:1px solid #18506b;border-radius:13px;color:#fff;padding:0 18px;font-size:17px;outline:0}.row button,.chip{border:1px solid #1b6a88;background:#092033;color:#bdefff;border-radius:12px;padding:0 20px;font-weight:800;cursor:pointer}.row button{background:#19cceb;color:#001018;border-color:#19cceb}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.chip{padding:10px 14px;font-size:11px}.chip:hover,.row button:hover{filter:brightness(1.12)}@media(max-width:650px){main{padding:50px 0}.row{flex-direction:column}.row input,.row button{height:54px}}
</style></head><body><header><div class="logo">IT SHAKH</div><a class="back" href="index.html">TOOLS / GOOGLE SEARCH</a></header><main><h1 class="title">GOOGLE <span>SEARCH</span></h1><p class="sub">Google’da web, rasmlar, yangiliklar, videolar va xaritalarni tez qidiring.</p><section class="card"><form id="f" class="row"><input id="q" placeholder="Nimani qidirmoqchisiz?" autocomplete="off" autofocus><button>QIDIRISH</button></form><div class="chips"><button class="chip" type="button" data-m="web">WEB</button><button class="chip" type="button" data-m="img">RASMLAR</button><button class="chip" type="button" data-m="news">YANGILIKLAR</button><button class="chip" type="button" data-m="vid">VIDEOLAR</button><button class="chip" type="button" data-m="map">XARITA</button></div></section></main><script>const q=document.getElementById('q');function go(m='web'){let v=q.value.trim();if(!v)return q.focus();let u=m==='img'?'https://www.google.com/search?tbm=isch&q=':m==='news'?'https://www.google.com/search?tbm=nws&q=':m==='vid'?'https://www.google.com/search?tbm=vid&q=':m==='map'?'https://www.google.com/maps/search/?api=1&query=':'https://www.google.com/search?q=';location.href=u+encodeURIComponent(v)}document.getElementById('f').onsubmit=e=>{e.preventDefault();go()};document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>go(x.dataset.m));</script></body></html>
