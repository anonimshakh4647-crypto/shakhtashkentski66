function gameRobot(){let hp=100,ehp=100;arena.innerHTML='<p class="prompt">Dushman HP: 100. Hujum yoki himoya tanlang.</p><div class="big" id="robotHP">100 / 100</div>';const hit=d=>{ehp=Math.max(0,ehp-d);if(ehp===0){addScore(220);end("✓ ROBOT DEFEATED",true);return}hp=Math.max(0,hp-(5+random(12)));$("robotHP").textContent=hp+" / "+ehp;if(hp===0)end("✕ YOUR ROBOT IS DOWN",false)};["PUNCH","LASER","SHIELD"].forEach(x=>arena.append(action(x,()=>x==="SHIELD"?(hp=Math.min(100,hp+12),$("robotHP").textContent=hp+" / "+ehp):hit(x==="LASER"?25:15))))}
function gameTower(){let wave=0;arena.innerHTML='<p class="prompt">10 wave. Har bir FIRE hujumni qaytaradi.</p><div class="big" id="wave">0 / 10</div>';arena.append(action("🔥 FIRE",()=>{wave++;addScore(30);$("wave").textContent=wave+" / 10";if(wave>=10)end("✓ BASE SECURED",true)}))}
function gameBomb(){const wires=["RED","BLUE","GREEN","YELLOW"],correct=wires[random(4)];arena.innerHTML='<p class="prompt">Qaysi simni kesasiz?</p>';const c=document.createElement("div");c.className="choices";wires.forEach(x=>c.append(action("✂ "+x,()=>x===correct?(addScore(200),end("✓ BOMB DEFUSED",true)):end("💥 BOOM",false))));arena.append(c)}
function gameArchery(){let n=0;arena.innerHTML='<p class="prompt">10 ta targetni uring.</p><button class="target" id="arch"></button>';const t=$("arch"),move=()=>{t.style.marginLeft=(random(460)-230)+"px";t.style.marginTop=(random(150)-75)+"px"};listen(t,"click",()=>{n++;addScore(30);if(n>=10)end("✓ 10 HIT COMBO",true);else move()});move()}
function gameSpace(){let n=0;arena.innerHTML='<div class="space" id="space"><div class="ship">🛸</div></div><p class="prompt">15 ta alien kemasini uring.</p>';const s=$("space");function spawn(){s.querySelectorAll(".enemy").forEach(e=>e.remove());const e=document.createElement("div");e.className="enemy";e.textContent="👾";e.style.left=random(90)+"%";e.style.top=random(65)+"%";s.append(e);listen(e,"click",()=>{n++;addScore(20);if(n>=15)end("✓ SECTOR CLEAR",true);else spawn()})}spawn()}
function gameFight(){let hp=100,ehp=100;arena.innerHTML='<div class="big" id="fightHP">100 / 100</div>';["JAB","KICK","SPECIAL","BLOCK"].forEach(x=>arena.append(action(x,()=>{if(x==="BLOCK")hp=Math.min(100,hp+8);else ehp=Math.max(0,ehp-(x==="SPECIAL"?30:15));if(x!=="BLOCK")hp=Math.max(0,hp-(3+random(10)));$("fightHP").textContent=hp+" / "+ehp;if(ehp===0){addScore(220);end("✓ FIGHT WON",true)}else if(hp===0)end("✕ KNOCKED OUT",false)})))}
function gameZombie(){let n=0;arena.innerHTML='<div class="big">🧟</div><p class="prompt">20 ta zombini yo‘q qiling.</p>';arena.append(action("SHOOT 🔫",()=>{n++;addScore(20);if(n>=20)end("✓ WAVE SURVIVED",true);else message("Zombie #"+n+" eliminated")}))}
function gameRacer(){let d=0,obstacles=0;arena.innerHTML='<div class="road" id="road"><div class="car">🚗</div></div><p class="prompt">DRIVE bosib masofani oshiring. To‘siqqa urilsa restart.</p>';const r=$("road"),drive=()=>{d++;if(random(100)<22){obstacles++;if(obstacles%2===0)return end("💥 CRASH",false)}addScore(15);message("DISTANCE: "+d+" km");if(d>=25)end("✓ CITY RECORD • 25 KM",true)};arena.append(action("DRIVE →",drive))}
function gameRunner(){let n=0;arena.innerHTML='<div class="big">🏃</div><p class="prompt">Har bosishda coin yig‘ing. 500 scorega yeting.</p><div class="progress"><i id="runbar"></i></div>';arena.append(action("JUMP + COLLECT",()=>{n+=random(45)+15;setScore(n);$("runbar").style.width=Math.min(100,n/5)+"%";if(n>=500)end("✓ RUN COMPLETE • 500+",true)}))}
function gameAlien(){let n=0;arena.innerHTML='<div class="big">👽</div><p class="prompt">20 ta alienni qaytaring.</p>';arena.append(action("DEFEND 🛡️",()=>{n++;addScore(20);if(n>=20)end("✓ CITY SAVED",true);else message("Alien "+n+" defeated")}))}
const game={pw:gamePW,code:gameCode,detective:gameDetective,defender:gameDefender,bug:gameBug,ctf:gameCTF,reaction:gameReaction,aim:gameAim,memory:gameMemory,binary:gameBinary,vuln:gameVuln,ip:gameIP,key:gameKey,hash:gameHash,typing:gameTyping,packet:gamePacket,stealth:gameStealth,robot:gameRobot,tower:gameTower,bomb:gameBomb,archery:gameArchery,space:gameSpace,fight:gameFight,zombie:gameZombie,racer:gameRacer,runner:gameRunner,alien:gameAlien};
const wrap=$("games");
function render(filter="all"){wrap.innerHTML="";G.forEach((g,i)=>{if(filter!=="all"&&g[3]!==filter)return;const c=document.createElement("article");c.className="card";c.innerHTML='<span class="num">#'+String(i+1).padStart(2,"0")+'</span><div class="icon">'+g[0]+'</div><h2>'+g[1]+'</h2><p>'+g[2]+'</p>';c.append(action("START GAME →",()=>start(g[4])));wrap.append(c)});$("gameCount").textContent=wrap.children.length}
document.querySelectorAll(".filter").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.filter)}));
$("close").addEventListener("click",()=>{$("modal").style.display="none";cleanup()});
$("modal").addEventListener("click",e=>{if(e.target===$("modal")){$("modal").style.display="none";cleanup()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){$("modal").style.display="none";cleanup()}});
$("played").textContent=Number(localStorage.getItem(key("played"))||0);
$("bestScore").textContent=Math.max(0,...G.map(g=>Number(localStorage.getItem(key("best_"+g[4]))||0)));
render();
</script>
</body>
</html>
