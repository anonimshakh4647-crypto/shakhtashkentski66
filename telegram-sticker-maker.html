<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Telegram Sticker Maker | IT SHAKH</title>
<style>
:root{--bg:#03070d;--panel:#09111b;--panel2:#0c1622;--line:#203246;--text:#eef7ff;--muted:#8da8c2;--cyan:#08d9ff;--blue:#168bff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0b1b2c 0,#03070d 48%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:auto;padding:42px 22px}.brand{font-size:30px;font-weight:900;letter-spacing:2px;color:var(--cyan)}.crumb{color:var(--muted);margin-top:7px}
.card{margin-top:28px;background:rgba(9,17,27,.94);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 20px 70px #0008}
.grid{display:grid;grid-template-columns:minmax(320px,1fr) minmax(320px,1fr);gap:24px}.stagebox,.controls{background:var(--panel2);border:1px solid var(--line);border-radius:18px;padding:18px}
h1{margin:0 0 10px;font-size:30px}h2{margin:0 0 15px;font-size:18px}.hint{color:var(--muted);line-height:1.5}
.canvas-wrap{display:flex;justify-content:center;align-items:center;min-height:480px;background:repeating-conic-gradient(#101a25 0 25%,#0b141e 0 50%) 0/28px 28px;border-radius:15px;overflow:hidden}
canvas{width:min(100%,500px);height:auto;aspect-ratio:1;border-radius:12px;box-shadow:0 12px 40px #000b;touch-action:none}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:13px}label{display:block;font-size:13px;color:#b8cbe0;margin-bottom:7px}
input[type=file],input[type=text],input[type=number],select{width:100%;background:#050b12;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}
input[type=range]{width:100%}input[type=color]{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:#050b12}
.check{display:flex;gap:8px;align-items:center;color:#c8d8e8;margin:10px 0}.check input{width:auto}
button{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;color:#001018;background:linear-gradient(135deg,var(--cyan),var(--blue));margin:4px}
button.secondary{background:#132333;color:#dcecff;border:1px solid #28435d}button.danger{background:#3a1720;color:#ffd9df;border:1px solid #69313d}
.actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}.status{margin-top:12px;color:var(--muted);min-height:22px}.small{font-size:12px;color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:1fr}.canvas-wrap{min-height:350px}}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="brand">IT SHAKH</div><a href="javascript:history.back()" style="color:var(--cyan);text-decoration:none;font-weight:800;font-size:12px;letter-spacing:1px">← ORQAGA</a></div>
  <div class="crumb">Tools / Telegram Sticker Maker</div>
  <div class="card">
    <h1>Telegram Sticker Maker</h1>
    <p class="hint">Create a square PNG sticker directly in your browser. Your image stays on your device.</p>
    <div class="grid">
      <section class="stagebox">
        <h2>Preview</h2>
        <div class="canvas-wrap"><canvas id="canvas" width="512" height="512"></canvas></div>
        <div class="actions">
          <button id="download">Download PNG</button>
          <button class="secondary" id="reset">Reset</button>
        </div>
        <div class="status" id="status">Upload an image to begin.</div>
        <div class="small">Export: 512 × 512 PNG with transparency when enabled.</div>
      </section>
      <section class="controls">
        <div class="field"><label>Image</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp"></div>
        <div class="row">
          <div class="field"><label>Zoom <span id="zoomVal">1.00</span></label><input id="zoom" type="range" min="0.2" max="3" step="0.01" value="1"></div>
          <div class="field"><label>Rotate <span id="rotVal">0°</span></label><input id="rotate" type="range" min="-180" max="180" step="1" value="0"></div>
        </div>
        <div class="row">
          <div class="field"><label>Text</label><input id="text" type="text" placeholder="Your sticker text"></div>
          <div class="field"><label>Font</label><select id="font"><option>Arial Black</option><option>Impact</option><option>Arial</option><option>Verdana</option><option>Georgia</option><option>Courier New</option></select></div>
        </div>
        <div class="row">
          <div class="field"><label>Text size <span id="sizeVal">54</span> px</label><input id="size" type="range" min="12" max="150" value="54"></div>
          <div class="field"><label>Outline <span id="outlineVal">10</span> px</label><input id="outline" type="range" min="0" max="30" value="10"></div>
        </div>
        <div class="row">
          <div class="field"><label>Text color</label><input id="color" type="color" value="#ffffff"></div>
          <div class="field"><label>Outline color</label><input id="outlineColor" type="color" value="#000000"></div>
        </div>
        <div class="row">
          <div class="field"><label>Text X <span id="xVal">256</span></label><input id="tx" type="range" min="0" max="512" value="256"></div>
          <div class="field"><label>Text Y <span id="yVal">440</span></label><input id="ty" type="range" min="0" max="512" value="440"></div>
        </div>
        <label class="check"><input id="transparent" type="checkbox" checked> Transparent background</label>
        <label class="check"><input id="fit" type="checkbox" checked> Fit image inside sticker</label>
        <div class="actions">
          <button class="secondary" id="left">↶ Rotate left</button>
          <button class="secondary" id="right">↷ Rotate right</button>
          <button class="secondary" id="center">Center image</button>
        </div>
      </section>
    </div>
  </div>
</div>
<script>
const c=document.getElementById('canvas'),ctx=c.getContext('2d');
const $=id=>document.getElementById(id);
let img=null, imgName='sticker';
let state={zoom:1,rot:0};

function fitRect(iw,ih){
  const s=$('fit').checked ? Math.min(512/iw,512/ih) : Math.max(512/iw,512/ih);
  return {w:iw*s,h:ih*s};
}
function draw(){
  ctx.clearRect(0,0,512,512);
  if(!$('transparent').checked){ctx.fillStyle='#fff';ctx.fillRect(0,0,512,512)}
  if(img){
    const r=fitRect(img.width,img.height), z=state.zoom;
    ctx.save();ctx.translate(256,256);ctx.rotate(state.rot*Math.PI/180);ctx.drawImage(img,-r.w*z/2,-r.h*z/2,r.w*z,r.h*z);ctx.restore();
  }
  const t=$('text').value;
  if(t){
    const size=+$('size').value, outline=+$('outline').value;
    ctx.save();ctx.font=`900 ${size}px "${$('font').value}"`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.lineJoin='round';ctx.lineWidth=outline;ctx.strokeStyle=$('outlineColor').value;ctx.strokeText(t,+$('tx').value,+$('ty').value);
    ctx.fillStyle=$('color').value;ctx.fillText(t,+$('tx').value,+$('ty').value);ctx.restore();
  }
}
$('file').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  imgName=f.name.replace(/\.[^.]+$/,'')||'sticker';
  const im=new Image();im.onload=()=>{img=im;state.zoom=1;$('zoom').value=1;draw();$('status').textContent='Image loaded. Customize your sticker.'};
  im.onerror=()=>$('status').textContent='Could not read this image.';
  im.src=URL.createObjectURL(f);
};
$('zoom').oninput=e=>{state.zoom=+e.target.value;$('zoomVal').textContent=state.zoom.toFixed(2);draw()};
$('rotate').oninput=e=>{state.rot=+e.target.value;$('rotVal').textContent=state.rot+'°';draw()};
$('size').oninput=e=>{$('sizeVal').textContent=e.target.value;draw()};
$('outline').oninput=e=>{$('outlineVal').textContent=e.target.value;draw()};
$('tx').oninput=e=>{$('xVal').textContent=e.target.value;draw()};
$('ty').oninput=e=>{$('yVal').textContent=e.target.value;draw()};
['text','font','color','outlineColor','transparent','fit'].forEach(id=>$(id).addEventListener('input',draw));
$('left').onclick=()=>{state.rot-=15;state.rot=((state.rot+180)%360)-180;$('rotate').value=state.rot;$('rotVal').textContent=state.rot+'°';draw()};
$('right').onclick=()=>{state.rot+=15;state.rot=((state.rot+180)%360)-180;$('rotate').value=state.rot;$('rotVal').textContent=state.rot+'°';draw()};
$('center').onclick=()=>{state.zoom=1;state.rot=0;$('zoom').value=1;$('rotate').value=0;$('zoomVal').textContent='1.00';$('rotVal').textContent='0°';draw()};
$('reset').onclick=()=>{img=null;$('file').value='';$('text').value='';state.zoom=1;state.rot=0;$('zoom').value=1;$('rotate').value=0;$('zoomVal').textContent='1.00';$('rotVal').textContent='0°';draw();$('status').textContent='Reset.'};
$('download').onclick=()=>{
  if(!img && !$('text').value){$('status').textContent='Upload an image or add text first.';return}
  c.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=imgName+'-telegram-sticker.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='PNG sticker downloaded.'},'image/png');
};
draw();
</script>

<style>
#sl-modal,#vb-modal{position:fixed;inset:0;z-index:2147483647;background:rgba(2,6,14,.96);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit}
.sl-box{width:min(440px,100%);background:#06101c;border:1px solid rgba(31,214,245,.4);border-radius:16px;padding:28px 24px;box-shadow:0 0 60px rgba(31,214,245,.25);text-align:center;box-sizing:border-box}
.sl-ic{font-size:42px}
.sl-box h2{margin:8px 0 10px;font-size:21px;color:#1fd6f5;font-family:inherit}

</style>
<script>
/* ===== SAYTNI TO'LIQ BLOKLASH + VPN TAQIQLASH — TOOLS sahifalari uchun =====
   index.html dagi admin panelidan "SAYTNI BLOKLASH" yoki "VPN TAQIQLASH" yoqilsa,
   bu tekshiruv shu asbob sahifasida ham ishlaydi — ADMIN_EMAIL'dan boshqa hech kim
   to'g'ridan-to'g'ri havola orqali ham asbobdan foydalana olmaydi (sayt bloklanganda),
   yoki VPN/proksi/datacenter orqali kirgan bo'lsa foydalana olmaydi (VPN taqiqlanganda).
   Hech qanday Google token/kredensial talab qilinmaydi — shuning uchun sessiya holatidan qat'i nazar ishlaydi. */
(function(){
 var USERS_API_URL='https://script.google.com/macros/s/AKfycbyGcZgnnp91p19OhUVCep3zh_Izw9Day-jQaveO0rYVX7cK0F_y9yZaSHJ-qdMUZzhiBA/exec';
 var ADMIN='anonimshakh4647@gmail.com';
 var showingLock=false,showingVpn=false,checking=false,vpnFlag=null,vpnCheckedAt=0;
 function getUser(){try{return JSON.parse(localStorage.getItem('it_shakh_google_user')||'null')}catch(e){return null}}
 function isAdmin(){var u=getUser();return !!(u&&String(u.email||'').toLowerCase()===ADMIN);}
 function api(ms){return new Promise(function(res){
  var cb='sl2_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script'),done=false;
  var fin=function(v){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.parentNode&&sc.remove();res(v);};
  window[cb]=fin;sc.onerror=function(){fin(null)};setTimeout(function(){fin(null)},ms||9000);
  sc.src=USERS_API_URL+'?action=sitestat&callback='+cb+'&_='+Date.now();document.head.appendChild(sc);});}
 function showLock(){
  if(showingLock||document.getElementById('sl-modal'))return;showingLock=true;
  var vb=document.getElementById('vb-modal');if(vb)vb.remove();showingVpn=false;
  var d=document.createElement('div');d.id='sl-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛠️</div><h2>Sayt vaqtincha yopiq</h2><p>Hozirda saytda texnik ishlar olib borilmoqda. Iltimos, birozdan so‘ng qayta urinib ko‘ring.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideLock(){var d=document.getElementById('sl-modal');if(!d)return;d.remove();showingLock=false;document.body.style.overflow=showingVpn?'hidden':'';}
 function showVpn(){
  if(showingVpn||showingLock||document.getElementById('vb-modal'))return;showingVpn=true;
  var d=document.createElement('div');d.id='vb-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛡️</div><h2>VPN/Proksi orqali kirish taqiqlangan</h2><p>Saytdan foydalanish uchun VPN yoki proksi dasturini o‘chirib, sahifani qayta yuklang.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideVpn(){var d=document.getElementById('vb-modal');if(!d)return;d.remove();showingVpn=false;document.body.style.overflow=showingLock?'hidden':'';}
 function checkVpn(){
  return new Promise(function(res){
   var c=(typeof AbortController!=='undefined')?new AbortController():null,t=setTimeout(function(){if(c)c.abort();},5000);
   fetch('https://api.ipapi.is/',c?{signal:c.signal}:{}).then(function(r){
    clearTimeout(t);if(!r.ok)return res(null);return r.json();
   }).then(function(j){
    if(!j||typeof j!=='object'||(j.is_vpn==null&&j.is_proxy==null&&j.is_datacenter==null))return res(null);
    res(!!(j.is_vpn||j.is_proxy||j.is_tor||j.is_datacenter));
   }).catch(function(){clearTimeout(t);res(null);});
  });
 }
 function tick(){
  if(checking||isAdmin())return;
  checking=true;api(9000).then(function(r){checking=false;
   if(r&&r.ok&&r.locked)return showLock();
   if(r&&r.ok&&!r.locked&&showingLock)hideLock();
   if(r&&r.ok&&r.vpnBlock){
    if(vpnFlag===null||Date.now()-vpnCheckedAt>120000){
     checkVpn().then(function(v){vpnFlag=v;vpnCheckedAt=Date.now();
      if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
     });
    }else if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
   }else if(showingVpn)hideVpn();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
</script>
</body>
