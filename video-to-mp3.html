<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video to MP3 | IT SHAKH</title><style>
:root{--bg:#05070b;--panel:#0b111a;--line:#172235;--text:#eef5ff;--muted:#8da0b8;--a:#00e5ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#102033,#05070b 48%);color:var(--text);font-family:Segoe UI,Arial,sans-serif;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:40px 20px}.brand{font-size:28px;font-weight:900;letter-spacing:2px;color:var(--a)}.sub,.hint{color:var(--muted)}.card{background:#0b111aee;border:1px solid var(--line);border-radius:20px;padding:26px;margin-top:25px;box-shadow:0 15px 50px #0008}h1{margin-top:0}input,select,textarea{width:100%;padding:13px;margin:7px 0 14px;background:#070c13;color:var(--text);border:1px solid #24334a;border-radius:10px}.btn{padding:13px 18px;border:0;border-radius:11px;background:linear-gradient(135deg,#00e5ff,#188cff);font-weight:800;cursor:pointer}.btn:disabled{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.status{margin-top:15px;color:var(--muted);white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="brand">IT SHAKH</div><div class="sub">Tools / Video to MP3</div><section class="card"><h1>🎬 Video → MP3</h1><p class="hint">Convert a local video file to MP3 directly in your browser. No upload is required.</p><input id="file" type="file" accept="video/*"><button id="go" class="btn" disabled>Convert to MP3</button><div id="status" class="status">Select a video.</div></section></main>
<script type="module">
import {FFmpeg} from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm/index.js';
import {fetchFile,toBlobURL} from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/esm/index.js';
const ff=new FFmpeg(),$=x=>document.getElementById(x);let file;
$('file').onchange=e=>{file=e.target.files[0];$('go').disabled=!file;$('status').textContent=file?'Ready: '+file.name:'Select a video.'};
$('go').onclick=async()=>{try{$('go').disabled=true;$('status').textContent='Loading FFmpeg...';const b='https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/esm';await ff.load({coreURL:await toBlobURL(b+'/ffmpeg-core.js','text/javascript'),wasmURL:await toBlobURL(b+'/ffmpeg-core.wasm','application/wasm')});$('status').textContent='Converting...';await ff.writeFile('input',await fetchFile(file));await ff.exec(['-i','input','-vn','-codec:a','libmp3lame','-q:a','2','output.mp3']);const d=await ff.readFile('output.mp3');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([d.buffer],{type:'audio/mpeg'}));a.download=file.name.replace(/\.[^.]+$/,'')+'.mp3';a.click();$('status').textContent='Done. MP3 downloaded.'}catch(e){$('status').textContent='Error: '+e.message}finally{$('go').disabled=false}};
</script></body></html>
