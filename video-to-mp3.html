<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video to MP3 | IT SHAKH</title>
<style>
:root{--bg:#05070b;--panel:#0b111a;--line:#172235;--text:#eef5ff;--muted:#8da0b8;--a:#00e5ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#102033,#05070b 48%);color:var(--text);font-family:Segoe UI,Arial,sans-serif;min-height:100vh}
.wrap{max-width:950px;margin:auto;padding:40px 20px}
.brand{font-size:28px;font-weight:900;letter-spacing:2px;color:var(--a)}
.sub,.hint{color:var(--muted)}
.card{background:#0b111aee;border:1px solid var(--line);border-radius:20px;padding:26px;margin-top:25px;box-shadow:0 15px 50px #0008}
h1{margin-top:0}
input{width:100%;padding:13px;margin:7px 0 14px;background:#070c13;color:var(--text);border:1px solid #24334a;border-radius:10px}
.btn{padding:13px 18px;border:0;border-radius:11px;background:linear-gradient(135deg,#00e5ff,#188cff);font-weight:800;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.status{margin-top:15px;color:var(--muted);white-space:pre-wrap;line-height:1.6}
.progress-wrap{margin-top:14px;height:8px;background:#101a28;border-radius:20px;overflow:hidden;display:none}
.progress{height:100%;width:0;background:linear-gradient(90deg,#00e5ff,#188cff);transition:width .15s}
.note{margin-top:15px;padding:12px;border:1px solid #17304a;border-radius:10px;color:#8da0b8;font-size:13px}
<style id="it-shakh-back-button-style">
.it-shakh-back-btn{position:fixed;left:18px;bottom:18px;z-index:99999;border:1px solid #1b4662;background:#081827;color:#dff5ff;border-radius:10px;padding:10px 15px;font:800 12px Segoe UI,Arial,sans-serif;cursor:pointer;text-decoration:none;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.it-shakh-back-btn:hover{border-color:#00e5ff;color:#00e5ff}
@media(max-width:600px){.it-shakh-back-btn{left:10px;bottom:10px;padding:9px 12px}}
</style>
</style>
</head>
<body>
<main class="wrap">
  <div class="brand">IT SHAKH</div>
  <div class="sub">Tools / Video to MP3</div>

  <section class="card">
    <h1>🎬 Video → MP3</h1>
    <p class="hint">Convert a local video file to MP3 directly in your browser. The video is not uploaded to a server.</p>

    <input id="file" type="file" accept="video/*,.mp4,.mkv,.mov,.avi,.webm,.flv,.3gp">

    <button id="go" class="btn" disabled>Convert to MP3</button>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress" id="progress"></div>
    </div>

    <div id="status" class="status">Select a video.</div>

    <div class="note">
      First conversion may take a little longer because FFmpeg must load in the browser.
    </div>
  </section>
</main>

<!-- Single-thread FFmpeg build: avoids the cross-origin Worker error on GitHub Pages. -->
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
(() => {
  const { createFFmpeg, fetchFile } = FFmpeg;

  const $ = id => document.getElementById(id);
  const fileInput = $('file');
  const go = $('go');
  const status = $('status');
  const progressWrap = $('progressWrap');
  const progress = $('progress');

  let selectedFile = null;
  let ffmpeg = null;
  let loaded = false;

  fileInput.addEventListener('change', () => {
    selectedFile = fileInput.files && fileInput.files[0];

    if (!selectedFile) {
      go.disabled = true;
      status.textContent = 'Select a video.';
      return;
    }

    go.disabled = false;
    status.textContent = 'Ready: ' + selectedFile.name;
  });

  async function loadFFmpeg() {
    if (loaded) return;

    status.textContent = 'Loading FFmpeg for the first time...';
    progressWrap.style.display = 'block';
    progress.style.width = '5%';

    ffmpeg = createFFmpeg({
      log: false,
      mainName: 'main',
      corePath: 'https://unpkg.com/@ffmpeg/core-st@0.11.1/dist/ffmpeg-core.js'
    });

    ffmpeg.setProgress(({ ratio }) => {
      const percent = Math.max(0, Math.min(100, Math.round(ratio * 100)));
      progress.style.width = percent + '%';
      status.textContent = 'Converting... ' + percent + '%';
    });

    await ffmpeg.load();
    loaded = true;
    progress.style.width = '10%';
  }

  go.addEventListener('click', async () => {
    if (!selectedFile) return;

    go.disabled = true;
    fileInput.disabled = true;
    progressWrap.style.display = 'block';
    progress.style.width = '0%';

    const inputName = 'input' + (selectedFile.name.match(/\.[^.]+$/) || ['.mp4'])[0].toLowerCase();
    const outputName = 'output.mp3';

    try {
      await loadFFmpeg();

      status.textContent = 'Reading video...';
      progress.style.width = '12%';

      ffmpeg.FS('writeFile', inputName, await fetchFile(selectedFile));

      status.textContent = 'Converting to MP3...';
      await ffmpeg.run(
        '-i', inputName,
        '-vn',
        '-codec:a', 'libmp3lame',
        '-q:a', '2',
        outputName
      );

      const data = ffmpeg.FS('readFile', outputName);
      const blob = new Blob([data.buffer], { type: 'audio/mpeg' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = selectedFile.name.replace(/\.[^.]+$/, '') + '.mp3';
      document.body.appendChild(a);
      a.click();
      a.remove();

      setTimeout(() => URL.revokeObjectURL(url), 5000);

      progress.style.width = '100%';
      status.textContent = 'Done! MP3 created and downloaded.';
    } catch (err) {
      console.error(err);
      status.textContent = 'Error: ' + (err && err.message ? err.message : String(err));
    } finally {
      try {
        if (ffmpeg) {
          try { ffmpeg.FS('unlink', inputName); } catch (_) {}
          try { ffmpeg.FS('unlink', outputName); } catch (_) {}
        }
      } catch (_) {}

      go.disabled = !selectedFile;
      fileInput.disabled = false;
    }
  });
})();
</script>
<button type="button" class="it-shakh-back-btn" onclick="if(history.length>1){history.back()}else{location.href='index.html'}">← ORQAGA</button>
</body>
</html>
