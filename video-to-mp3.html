<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video to MP3 | IT SHAKH</title>
<style>
:root{--bg:#05070b;--panel:#0b111a;--line:#172235;--text:#eef5ff;--muted:#8da0b8;--a:#00e5ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#102033,#05070b 48%);color:var(--text);font-family:Segoe UI,Arial,sans-serif;min-height:100vh}
.wrap{max-width:950px;margin:auto;padding:40px 20px}.brand{font-size:28px;font-weight:900;letter-spacing:2px;color:var(--a)}
.sub,.hint{color:var(--muted)}.card{background:#0b111aee;border:1px solid var(--line);border-radius:20px;padding:26px;margin-top:25px;box-shadow:0 15px 50px #0008}
h1{margin-top:0}input{width:100%;padding:13px;margin:7px 0 14px;background:#070c13;color:var(--text);border:1px solid #24334a;border-radius:10px}
.btn{padding:13px 18px;border:0;border-radius:11px;background:linear-gradient(135deg,#00e5ff,#188cff);font-weight:800;cursor:pointer}.btn:disabled{opacity:.45}
.status{margin-top:15px;color:var(--muted);white-space:pre-wrap}.bar{height:10px;background:#111b29;border-radius:99px;overflow:hidden;margin-top:15px}.fill{height:100%;width:0;background:linear-gradient(90deg,#00e5ff,#7c4dff);transition:width .2s}
.small{font-size:12px;color:#71849d;margin-top:12px;line-height:1.5}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">IT SHAKH</div>
<div class="sub">Tools / Video to MP3</div>
<section class="card">
<h1>🎬 Video → MP3</h1>
<p class="hint">Convert a local video file to MP3 directly in your browser. No upload is required.</p>
<input id="file" type="file" accept="video/*,.mkv,.webm,.mov,.avi,.mp4">
<button id="go" class="btn" disabled>Convert to MP3</button>
<div class="bar"><div id="fill" class="fill"></div></div>
<div id="status" class="status">Select a video.</div>
<div class="small">The first conversion downloads FFmpeg WebAssembly components into your browser. The video itself is processed locally.</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let selected=null, ffmpeg=null, loading=null;

$('file').addEventListener('change', e=>{
  selected=e.target.files && e.target.files[0];
  $('go').disabled=!selected;
  $('fill').style.width='0%';
  $('status').textContent=selected ? 'Ready: '+selected.name : 'Select a video.';
});

async function getFFmpeg(){
  if(ffmpeg && ffmpeg.isLoaded()) return ffmpeg;
  if(loading) return loading;
  loading=(async()=>{
    if(typeof FFmpeg==='undefined' || !FFmpeg.createFFmpeg){
      throw new Error('FFmpeg library could not be loaded. Check your internet connection or CDN access.');
    }
    ffmpeg=FFmpeg.createFFmpeg({
      log:false,
      corePath:'https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.11.5/dist/ffmpeg-core.js'
    });
    ffmpeg.setProgress(({ratio})=>{
      const pct=Math.max(0,Math.min(100,Math.round(ratio*100)));
      $('fill').style.width=pct+'%';
      $('status').textContent='Converting… '+pct+'%';
    });
    $('status').textContent='Loading FFmpeg…';
    await ffmpeg.load();
    return ffmpeg;
  })();
  try{return await loading}finally{loading=null}
}

$('go').addEventListener('click', async()=>{
  if(!selected) return;
  $('go').disabled=true;
  $('fill').style.width='0%';
  try{
    const f=await getFFmpeg();
    const inputName='input'+(selected.name.match(/\.[^.]+$/)||['.mp4'])[0].toLowerCase();
    const outputName='output.mp3';
    f.FS('writeFile',inputName,await FFmpeg.fetchFile(selected));
    $('status').textContent='Converting…';
    await f.run('-i',inputName,'-vn','-codec:a','libmp3lame','-q:a','2',outputName);
    const data=f.FS('readFile',outputName);
    const blob=new Blob([data.buffer],{type:'audio/mpeg'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=selected.name.replace(/\.[^.]+$/,'')+'.mp3';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    $('fill').style.width='100%';
    $('status').textContent='Done. MP3 downloaded.';
    try{f.FS('unlink',inputName);f.FS('unlink',outputName)}catch(_){}
  }catch(e){
    $('status').textContent='Error: '+(e && e.message ? e.message : e);
    $('fill').style.width='0%';
  }finally{$('go').disabled=false}
});
</script>
</body>
</html>
