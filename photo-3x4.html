<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Foto 3×4 Studio | IT SHAKH</title>
<meta name="description" content="Professional 3×4 foto studiyasi: fonni olib tashlash, rang tuzatish, yo'riqnomalar, A4 / 10×15 varaqqa chop etish, PDF.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#0a0d13;--bg1:#12161f;--bg2:#1a2030;--bg3:#232a3d;--line:#262e42;--line2:#34405c;
  --accent:#38bdf8;--violet:#7c4dff;--text:#e5e7eb;--mute:#8b97ad;--dim:#5f6b82;
  --ok:#34d399;--warn:#fbbf24;--err:#fb7185;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:13px/1.4 'Inter',system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg0);color:var(--text);overflow:hidden;
  display:grid;grid-template-rows:32px 42px minmax(0,1fr) 24px;grid-template-columns:50px minmax(0,1fr) 340px;user-select:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{accent-color:var(--accent)}
.hide{display:none!important}

/* menu bar */
#menubar{grid-column:1/-1;display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--bg1);border-bottom:1px solid var(--line);position:relative;z-index:50}
#menubar .back{white-space:nowrap;flex:0 0 auto;color:var(--accent);text-decoration:none;font-weight:800;font-size:11px;letter-spacing:2px;padding:0 12px 0 4px;margin-right:6px;border-right:1px solid var(--line)}
#menubar .mb{background:transparent;border:0;padding:5px 11px;border-radius:5px;color:var(--text);font-size:12.5px}
#menubar .mb:hover,#menubar .mb.open{background:var(--bg3)}
#menubar .sp{flex:1}
#fname{color:var(--mute);font-size:12px;max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:10px}
.btn{background:var(--bg3);border:1px solid var(--line2);border-radius:6px;padding:6px 12px;font-weight:600;font-size:12.5px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--violet));border:0;color:#03060b;font-weight:800}
.btn.sm{padding:4px 9px;font-size:12px}
.dd{position:absolute;top:32px;min-width:250px;background:#0e121b;border:1px solid var(--line2);border-radius:8px;padding:5px;box-shadow:0 14px 40px rgba(0,0,0,.6);z-index:60}
.dd button{display:flex;width:100%;justify-content:space-between;gap:24px;background:transparent;border:0;border-radius:5px;padding:7px 10px;text-align:left;font-size:12.5px}
.dd button:hover:not(:disabled){background:var(--bg3)}
.dd button:disabled{opacity:.4;cursor:not-allowed}
.dd kbd{color:var(--dim);font:11px ui-monospace,Menlo,Consolas,monospace}
.dd hr{border:0;border-top:1px solid var(--line);margin:5px 4px}

/* options bar */
#optbar{grid-column:1/-1;display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
#optbar .og{display:flex;align-items:center;gap:7px}
#optbar label{color:var(--mute);font-size:11.5px}
#optbar input[type=range]{width:110px}
#optbar .v{min-width:34px;color:var(--text);font:11.5px ui-monospace,Menlo,Consolas,monospace}
#optbar .sepv{width:1px;height:20px;background:var(--line2)}
.chk{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12px}
.chk input{accent-color:var(--accent)}

/* toolbar */
#toolbar{background:var(--bg1);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
.tool{width:38px;height:38px;border-radius:8px;border:1px solid transparent;background:transparent;display:grid;place-items:center;color:var(--mute);position:relative}
.tool svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--bg3);color:#fff}
.tool[aria-pressed="true"]{background:rgba(56,189,248,.16);border-color:var(--accent);color:var(--accent)}
.tool .k{position:absolute;right:2px;bottom:0;font:9px ui-monospace,monospace;color:var(--dim)}
.tsep{width:26px;height:1px;background:var(--line2);margin:4px 0}
.tool-sw{margin-top:auto;width:30px;height:30px;border-radius:6px;border:2px solid var(--line2);background:#fff;cursor:pointer;padding:0}

/* workspace */
#ws{position:relative;background:#0f1218;overflow:hidden;min-width:0;min-height:0;touch-action:none}
#wsCv{position:absolute;inset:0;width:100%;height:100%;display:block}
#empty{position:absolute;inset:0;display:grid;place-items:center;padding:20px}
.drop{max-width:520px;width:100%;border:2px dashed var(--line2);border-radius:18px;padding:36px 26px;text-align:center;background:rgba(18,22,31,.8)}
.drop.over{border-color:var(--accent);background:rgba(56,189,248,.08)}
.drop h2{margin:0 0 6px;font-size:22px;letter-spacing:-.3px}
.drop p{margin:0 0 18px;color:var(--mute)}
.drop .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.drop small{display:block;margin-top:16px;color:var(--dim)}
.drop .btn{padding:10px 18px;font-size:14px}

/* dock */
#dock{background:var(--bg1);border-left:1px solid var(--line);overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.sec{border-bottom:1px solid var(--line)}
.sec>.sh{display:flex;align-items:center;gap:8px;width:100%;background:var(--bg2);border:0;padding:8px 12px;font-weight:700;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mute);text-align:left}
.sec>.sh:hover{color:#fff}
.sec>.sh::before{content:"▸";font-size:10px;transition:transform .15s}
.sec.open>.sh::before{transform:rotate(90deg)}
.sec>.sb{display:none;padding:12px}
.sec.open>.sb{display:block}
.fld{display:grid;gap:5px;margin-bottom:11px}
.fld>label{display:flex;justify-content:space-between;color:var(--mute);font-size:11.5px}
.fld>label b{color:var(--text);font:11.5px ui-monospace,Menlo,Consolas,monospace;font-weight:400}
.inp,select{width:100%;background:var(--bg0);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;outline:0;min-width:0}
.inp:focus,select:focus{border-color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;background:var(--bg0);border:1px solid var(--line2);border-radius:7px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:5px;padding:5px 6px;font-size:12px;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#03060b;font-weight:700}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:7px;border:2px solid var(--line2);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px rgba(56,189,248,.35)}
.sw .tr{background-image:linear-gradient(45deg,#888 25%,transparent 25%,transparent 75%,#888 75%),linear-gradient(45deg,#888 25%,#ccc 25%,#ccc 75%,#888 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.sw input[type=color]{width:30px;height:30px;border:2px solid var(--line2);border-radius:7px;padding:0;background:none}
.note{font-size:12px;color:var(--mute);margin:0 0 10px}
.warn{font-size:12px;color:var(--warn);margin:8px 0 0}
.prevbox{background:#0a0d13;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;padding:12px;margin-bottom:10px;
  background-image:linear-gradient(45deg,#161b26 25%,transparent 25%,transparent 75%,#161b26 75%),linear-gradient(45deg,#161b26 25%,#10141c 25%,#10141c 75%,#161b26 75%);background-size:14px 14px;background-position:0 0,7px 7px}
#prevCv{max-width:100%;max-height:230px;box-shadow:0 6px 22px rgba(0,0,0,.6);background:#fff}
.prevcap{text-align:center;color:var(--mute);font:11.5px ui-monospace,Menlo,Consolas,monospace;margin-bottom:8px}
.layer{display:flex;align-items:center;gap:9px;padding:6px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:6px;background:var(--bg0)}
.layer .eye{width:26px;height:26px;border-radius:6px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center}
.layer .eye[aria-pressed="true"]{color:var(--accent)}
.layer .th{width:34px;height:42px;border-radius:4px;border:1px solid var(--line2);background:#fff;flex:0 0 auto}
.layer .nm{flex:1;min-width:0;font-weight:600}
.layer .nm small{display:block;color:var(--dim);font-weight:400;font-size:11px}
#hist{display:grid;gap:3px;max-height:210px;overflow:auto;scrollbar-width:thin}
#hist button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--bg0);border:1px solid transparent;border-radius:5px;padding:5px 8px;font-size:12px;color:var(--mute)}
#hist button:hover{color:#fff}
#hist button.cur{border-color:var(--accent);color:#fff;background:rgba(56,189,248,.1)}
#hist button.fut{opacity:.45}
#sheetCv{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;display:block;margin:6px 0 10px}
.dock-act{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--bg1) 28%);padding:14px 12px 12px;display:grid;gap:8px}

/* status */
#status{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 12px;background:var(--bg1);border-top:1px solid var(--line);color:var(--mute);font:11.5px ui-monospace,Menlo,Consolas,monospace;overflow:hidden;white-space:nowrap}
#status .sp{flex:1}

/* modal + toast */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:100;padding:16px}
#modal .box{background:var(--bg1);border:1px solid var(--line2);border-radius:14px;max-width:560px;width:100%;max-height:86vh;overflow:auto;padding:22px;user-select:text}
#modal h3{margin:0 0 12px;font-size:18px}
#modal table{width:100%;border-collapse:collapse;font-size:13px}
#modal td{padding:5px 4px;border-bottom:1px solid var(--line)}
#modal kbd{background:var(--bg3);border:1px solid var(--line2);border-radius:4px;padding:1px 6px;font:11.5px ui-monospace,Menlo,Consolas,monospace}
#modal ul{padding-left:18px;color:var(--mute);line-height:1.7}
#toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:#0e121b;border:1px solid var(--accent);border-radius:8px;padding:9px 16px;font-size:13px;z-index:120;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
#busy{position:absolute;inset:0;background:rgba(10,13,19,.55);display:grid;place-items:center;z-index:5;color:var(--accent);font-weight:700;letter-spacing:2px}

@media(max-width:900px){
  body{display:block;overflow:auto;height:auto}
  #menubar{position:sticky;top:0;overflow-x:auto}
  #optbar{min-height:42px}
  #toolbar{flex-direction:row;justify-content:center;padding:6px;border-right:0;border-bottom:1px solid var(--line)}
  .tool-sw,.tsep{display:none}
  #ws{height:62vh}
  #dock{border-left:0;overflow:visible}
  #status{position:sticky;bottom:0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="menubar" role="menubar">
  <a class="back" href="index.html" id="backLink">← IT SHAKH</a>
  <button class="mb" data-menu="file" type="button">Fayl</button>
  <button class="mb" data-menu="edit" type="button">Tahrirlash</button>
  <button class="mb" data-menu="image" type="button">Rasm</button>
  <button class="mb" data-menu="view" type="button">Ko'rinish</button>
  <button class="mb" data-menu="help" type="button">Yordam</button>
  <span class="sp"></span>
  <span id="fname">Rasm ochilmagan</span>
  <button class="btn pri sm" id="mbExport" type="button" disabled>Saqlash</button>
</div>

<div id="optbar" role="toolbar" aria-label="Asbob sozlamalari"></div>

<div id="toolbar" role="toolbar" aria-label="Asboblar" aria-orientation="vertical"></div>

<div id="ws">
  <canvas id="wsCv"></canvas>
  <div id="empty">
    <div class="drop" id="drop">
      <h2>Fotosuratni shu yerga tashlang</h2>
      <p>Yoki tanlang. Rasm kompyuteringizdan chiqmaydi — hammasi brauzerda ishlaydi.</p>
      <div class="row">
        <button class="btn pri" id="btnOpen" type="button">Rasm tanlash</button>
        <button class="btn" id="btnDemo" type="button">Demo rasm</button>
      </div>
      <small>Ctrl+V — buferdan qo'yish · JPG, PNG, WebP, HEIC (brauzer qo'llasa)</small>
    </div>
  </div>
  <input type="file" id="file" accept="image/*" hidden>
</div>

<aside id="dock" aria-label="Panellar"></aside>

<div id="status"><span id="stInfo">—</span><span id="stOut"></span><span class="sp"></span><span id="stPos"></span><span id="stZoom"></span></div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="hide" role="dialog" aria-modal="true"></div>

<script>
/* ===== SEG: GrabCut (GMM + graph cut) + guided-filter edge refinement. DOM-free. ===== */
(function(root){
'use strict';
const tick=()=>new Promise(r=>setTimeout(r,0));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- Boykov–Kolmogorov max-flow on a 4-connected grid ----------
   cap[i*4+d]  residual capacity of arc i -> neighbour(d)   d: 0=left 1=right 2=up 3=down
   tr[i]       source cap - sink cap (positive: linked to source, negative: to sink)          */
function maxflow(w,h,cap,tr){
  const n=w*h,NONE=-1,TERM=-2,ORPH=-3,INF=1e9;
  const head=new Int32Array(n*4);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;
    head[i*4]=x>0?i-1:-1;head[i*4+1]=x<w-1?i+1:-1;head[i*4+2]=y>0?i-w:-1;head[i*4+3]=y<h-1?i+w:-1;}
  const parent=new Int32Array(n).fill(NONE),isSink=new Uint8Array(n),TS=new Int32Array(n),DIST=new Int32Array(n);
  const nxt=new Int32Array(n).fill(-1),onext=new Int32Array(n).fill(-1);
  let qf0=-1,ql0=-1,qf1=-1,ql1=-1,ofirst=-1,olast=-1,TIME=0,flow=0,cur=-1;
  const sis=a=>head[a]*4+((a&3)^1);
  const setActive=i=>{if(nxt[i]<0){if(ql1>=0)nxt[ql1]=i;else qf1=i;ql1=i;nxt[i]=i;}};
  const nextActive=()=>{
    for(;;){
      let i=qf0;
      if(i<0){i=qf0=qf1;ql0=ql1;qf1=ql1=-1;if(i<0)return -1;}
      if(nxt[i]===i){qf0=ql0=-1;}else qf0=nxt[i];
      nxt[i]=-1;
      if(parent[i]!==NONE)return i;
    }
  };
  const orphanFront=i=>{parent[i]=ORPH;onext[i]=ofirst;ofirst=i;};
  const orphanRear=i=>{parent[i]=ORPH;onext[i]=-1;if(olast>=0)onext[olast]=i;else ofirst=i;olast=i;};

  function augment(mid){
    const ms=sis(mid),s=mid>>2,t=head[mid];
    let bott=cap[mid],i;
    for(i=s;;){const a=parent[i];if(a===TERM)break;const sa=sis(a);if(bott>cap[sa])bott=cap[sa];i=head[a];}
    if(bott>tr[i])bott=tr[i];
    for(i=t;;){const a=parent[i];if(a===TERM)break;if(bott>cap[a])bott=cap[a];i=head[a];}
    if(bott>-tr[i])bott=-tr[i];
    cap[ms]+=bott;cap[mid]-=bott;
    for(i=s;;){const a=parent[i];if(a===TERM)break;const sa=sis(a);cap[a]+=bott;cap[sa]-=bott;if(cap[sa]<=0)orphanFront(i);i=head[a];}
    tr[i]-=bott;if(tr[i]<=0)orphanFront(i);
    for(i=t;;){const a=parent[i];if(a===TERM)break;const sa=sis(a);cap[sa]+=bott;cap[a]-=bott;if(cap[a]<=0)orphanFront(i);i=head[a];}
    tr[i]+=bott;if(tr[i]>=0)orphanFront(i);
    flow+=bott;
  }
  function procOrphan(i,sinkSide){
    let dmin=INF,a0min=-1;
    for(let d=0;d<4;d++){
      const a0=i*4+d,j=head[a0];if(j<0)continue;
      const c=sinkSide?cap[a0]:cap[sis(a0)];
      if(c<=0)continue;
      if((isSink[j]===1)===sinkSide&&parent[j]!==NONE){
        let dd=0,jj=j;
        for(;;){
          if(TS[jj]===TIME){dd+=DIST[jj];break;}
          const a=parent[jj];dd++;
          if(a===TERM){TS[jj]=TIME;DIST[jj]=1;break;}
          if(a===ORPH){dd=INF;break;}
          jj=head[a];
        }
        if(dd<INF){
          if(dd<dmin){a0min=a0;dmin=dd;}
          for(let k=j;TS[k]!==TIME;k=head[parent[k]]){TS[k]=TIME;DIST[k]=dd--;}
        }
      }
    }
    parent[i]=a0min;
    if(a0min>=0){TS[i]=TIME;DIST[i]=dmin+1;}
    else{
      for(let d=0;d<4;d++){
        const a0=i*4+d,j=head[a0];if(j<0)continue;
        if((isSink[j]===1)===sinkSide&&parent[j]!==NONE){
          const a=parent[j],c=sinkSide?cap[a0]:cap[sis(a0)];
          if(c>0)setActive(j);
          if(a!==TERM&&a!==ORPH&&head[a]===i)orphanRear(j);
        }
      }
    }
  }
  for(let i=0;i<n;i++)if(tr[i]!==0){isSink[i]=tr[i]>0?0:1;parent[i]=TERM;TS[i]=0;DIST[i]=1;setActive(i);}
  for(;;){
    let i=-1;
    if(cur>=0){i=cur;nxt[i]=-1;if(parent[i]===NONE)i=-1;}
    if(i<0){i=nextActive();if(i<0)break;}
    let a=-1;
    if(!isSink[i]){
      for(let d=0;d<4;d++){
        const aa=i*4+d,j=head[aa];if(j<0||cap[aa]<=0)continue;
        if(parent[j]===NONE){isSink[j]=0;parent[j]=sis(aa);TS[j]=TS[i];DIST[j]=DIST[i]+1;setActive(j);}
        else if(isSink[j]){a=aa;break;}
        else if(TS[j]<=TS[i]&&DIST[j]>DIST[i]){parent[j]=sis(aa);TS[j]=TS[i];DIST[j]=DIST[i]+1;}
      }
    }else{
      for(let d=0;d<4;d++){
        const aa=i*4+d,j=head[aa];if(j<0)continue;const sa=sis(aa);if(cap[sa]<=0)continue;
        if(parent[j]===NONE){isSink[j]=1;parent[j]=sa;TS[j]=TS[i];DIST[j]=DIST[i]+1;setActive(j);}
        else if(!isSink[j]){a=sa;break;}
        else if(TS[j]<=TS[i]&&DIST[j]>DIST[i]){parent[j]=sa;TS[j]=TS[i];DIST[j]=DIST[i]+1;}
      }
    }
    TIME++;
    if(a>=0){
      nxt[i]=i;cur=i;
      augment(a);
      while(ofirst>=0){
        const rest=onext[ofirst];onext[ofirst]=-1;olast=-1;
        for(;;){
          const np=ofirst;if(np<0)break;
          ofirst=onext[np];if(ofirst<0)olast=-1;
          procOrphan(np,isSink[np]===1);
        }
        ofirst=rest;
      }
    }else cur=-1;
  }
  const source=new Uint8Array(n);
  for(let i=0;i<n;i++)source[i]=(parent[i]!==NONE&&!isSink[i])?1:0;
  return{flow,source};
}

/* ---------- GMM in RGB ---------- */
function inv3(c){ // c: [xx,xy,xz,yy,yz,zz] -> inverse (same layout) + det
  const a=c[0],b=c[1],cc=c[2],d=c[3],e=c[4],f=c[5];
  const A=d*f-e*e,B=-(b*f-e*cc),C=b*e-d*cc,D=a*f-cc*cc,E=-(a*e-b*cc),F=a*d-b*b;
  const det=a*A+b*B+cc*C;
  return{inv:[A/det,B/det,C/det,D/det,E/det,F/det],det};
}
function kmeansCenters(rgb,idx,K){
  const m=idx.length,step=Math.max(1,Math.floor(m/12000)),S=[];
  for(let t=0;t<m;t+=step)S.push(idx[t]);
  const lum=i=>.299*rgb[i*3]+.587*rgb[i*3+1]+.114*rgb[i*3+2];
  S.sort((a,b)=>lum(a)-lum(b));
  let C=new Float64Array(K*3);
  for(let k=0;k<K;k++){const p=S[Math.min(S.length-1,Math.floor((k+.5)/K*S.length))];C[k*3]=rgb[p*3];C[k*3+1]=rgb[p*3+1];C[k*3+2]=rgb[p*3+2];}
  for(let it=0;it<8;it++){
    const sum=new Float64Array(K*3),cnt=new Float64Array(K);
    for(const p of S){let bk=0,bd=1e18;for(let k=0;k<K;k++){const dx=rgb[p*3]-C[k*3],dy=rgb[p*3+1]-C[k*3+1],dz=rgb[p*3+2]-C[k*3+2],d=dx*dx+dy*dy+dz*dz;if(d<bd){bd=d;bk=k;}}

    for(let k=0;k<K;k++)if(cnt[k]>0){C[k*3]=sum[k*3]/cnt[k];C[k*3+1]=sum[k*3+1]/cnt[k];C[k*3+2]=sum[k*3+2]/cnt[k];}

}
function nearestComp(C,K,r,g,b){let bk=0,bd=1e18;for(let k=0;k<K;k++){const dx=r-C[k*3],dy=g-C[k*3+1],dz=b-C[k*3+2],d=dx*dx+dy*dy+dz*dz;if(d<bd){bd=d;bk=k;}}return bk;}
function estimate(rgb,idx,comp,K){
  const cnt=new Float64Array(K),mu=new Float64Array(K*3),S=new Float64Array(K*6);
  for(let t=0;t<idx.length;t++){const p=idx[t],k=comp[t],r=rgb[p*3],g=rgb[p*3+1],b=rgb[p*3+2];
    cnt[k]++;mu[k*3]+=r;mu[k*3+1]+=g;mu[k*3+2]+=b;
    S[k*6]+=r*r;S[k*6+1]+=r*g;S[k*6+2]+=r*b;S[k*6+3]+=g*g;S[k*6+4]+=g*b;S[k*6+5]+=b*b;}
  const total=Math.max(1,idx.length),M={K,mu:new Float64Array(K*3),inv:new Float64Array(K*6),c:new Float64Array(K).fill(-1e9)};
  for(let k=0;k<K;k++){
    if(cnt[k]<4)continue;
    const n=cnt[k],m0=mu[k*3]/n,m1=mu[k*3+1]/n,m2=mu[k*3+2]/n;
    const c=[S[k*6]/n-m0*m0+3,S[k*6+1]/n-m0*m1,S[k*6+2]/n-m0*m2,S[k*6+3]/n-m1*m1+3,S[k*6+4]/n-m1*m2,S[k*6+5]/n-m2*m2+3];
    const {inv,det}=inv3(c);if(!(det>1e-9))continue;
    M.mu[k*3]=m0;M.mu[k*3+1]=m1;M.mu[k*3+2]=m2;for(let q=0;q<6;q++)M.inv[k*6+q]=inv[q];

function term(M,k,r,g,b){

const TT=new Float64Array(16);
function cost(M,r,g,b){

function argComp(M,r,g,b){let bk=0,bv=-1e18;for(let k=0;k<M.K;k++){if(M.c[k]<-1e8)continue;const v=term(M,k,r,g,b);if(v>bv){bv=v;bk=k;}}return bk;}
function fitFresh(rgb,idx,K){

/* ---------- helpers ---------- */
function downscale(data,w,h,maxSide){
  const s=Math.max(1,Math.max(w,h)/maxSide),sw=Math.max(1,Math.round(w/s)),sh=Math.max(1,Math.round(h/s));
  const out=new Float32Array(sw*sh*3),fx=w/sw,fy=h/sh;
  for(let y=0;y<sh;y++){const y0=Math.floor(y*fy),y1=Math.max(y0+1,Math.min(h,Math.ceil((y+1)*fy)));
    for(let x=0;x<sw;x++){const x0=Math.floor(x*fx),x1=Math.max(x0+1,Math.min(w,Math.ceil((x+1)*fx)));
      let r=0,g=0,b=0,c=0;for(let yy=y0;yy<y1;yy++)for(let xx=x0;xx<x1;xx++){const p=(yy*w+xx)*4;r+=data[p];g+=data[p+1];b+=data[p+2];c++;}
      const o=(y*sw+x)*3;out[o]=r/c;out[o+1]=g/c;out[o+2]=b/c;}}
  return{rgb:out,w:sw,h:sh,scale:w/sw};
}
function morphGray(a,w,h,r,grow){
  if(!r)return a;
  const tmp=new Uint8Array(a.length),out=new Uint8Array(a.length);
  for(let y=0;y<h;y++){const row=y*w;for(let x=0;x<w;x++){let v=grow?0:255;const x0=Math.max(0,x-r),x1=Math.min(w-1,x+r);
    for(let k=x0;k<=x1;k++){const q=a[row+k];if(grow?q>v:q<v)v=q;}tmp[row+x]=v;}}
  for(let x=0;x<w;x++)for(let y=0;y<h;y++){let v=grow?0:255;const y0=Math.max(0,y-r),y1=Math.min(h-1,y+r);
    for(let k=y0;k<=y1;k++){const q=tmp[k*w+x];if(grow?q>v:q<v)v=q;}out[y*w+x]=v;}
  return out;
}
function components(lab,w,h,val){ // 4-connected components of pixels equal to val; returns {id:Int32Array,sizes:[],touch:[]}
  const n=w*h,id=new Int32Array(n).fill(-1),sizes=[],touch=[],stack=new Int32Array(n);let c=0;
  for(let s=0;s<n;s++){
    if(lab[s]!==val||id[s]>=0)continue;
    let sp=0,size=0,tb=false;stack[sp++]=s;id[s]=c;
    while(sp){const p=stack[--sp],x=p%w,y=(p-x)/w;size++;if(x===0||y===0||x===w-1||y===h-1)tb=true;
      if(x>0&&lab[p-1]===val&&id[p-1]<0){id[p-1]=c;stack[sp++]=p-1;}
      if(x<w-1&&lab[p+1]===val&&id[p+1]<0){id[p+1]=c;stack[sp++]=p+1;}
      if(y>0&&lab[p-w]===val&&id[p-w]<0){id[p-w]=c;stack[sp++]=p-w;}
      if(y<h-1&&lab[p+w]===val&&id[p+w]<0){id[p+w]=c;stack[sp++]=p+w;}}
    sizes.push(size);touch.push(tb);c++;

  return{id,sizes,touch};
}

/* ---------- GrabCut ---------- */
async function grabcut(rgb,w,h,iters,progress){
  const n=w*h,K=5,GAMMA=50;
  // pairwise weights
  let sum=0,cntp=0;
  const dR=new Float32Array(n),dD=new Float32Array(n);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;
    if(x<w-1){const j=i+1,d=(rgb[i*3]-rgb[j*3])**2+(rgb[i*3+1]-rgb[j*3+1])**2+(rgb[i*3+2]-rgb[j*3+2])**2;dR[i]=d;sum+=d;cntp++;}
    if(y<h-1){const j=i+w,d=(rgb[i*3]-rgb[j*3])**2+(rgb[i*3+1]-rgb[j*3+1])**2+(rgb[i*3+2]-rgb[j*3+2])**2;dD[i]=d;sum+=d;cntp++;}}
  const beta=1/(2*Math.max(1e-6,sum/cntp));
  const base=new Float64Array(n*4);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;
    if(x<w-1){const v=GAMMA*Math.exp(-beta*dR[i]);base[i*4+1]=v;base[(i+1)*4]=v;}
    if(y<h-1){const v=GAMMA*Math.exp(-beta*dD[i]);base[i*4+3]=v;base[(i+w)*4+2]=v;}}
  const BIG=4*GAMMA+10;

  /* initial trimap: ring (top/left/right) -> bg model -> flood = probable bg */
  const ring=new Uint8Array(n),rw=Math.max(2,Math.round(Math.min(w,h)*.03));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(y<rw||x<rw||x>=w-rw)ring[y*w+x]=1;
  const ringIdx=[];for(let i=0;i<n;i++)if(ring[i])ringIdx.push(i);
  const bg0=fitFresh(rgb,Int32Array.from(ringIdx),3);
  const rd=ringIdx.map(i=>cost(bg0,rgb[i*3],rgb[i*3+1],rgb[i*3+2])).sort((a,b)=>a-b);
  const thr=rd[Math.floor(rd.length*.96)]*1.15+1;
  const near=new Uint8Array(n);for(let i=0;i<n;i++)near[i]=cost(bg0,rgb[i*3],rgb[i*3+1],rgb[i*3+2])<=thr?1:0;
  const flood=new Uint8Array(n),stack=new Int32Array(n);let sp=0;
  for(const i of ringIdx)if(near[i]){flood[i]=1;stack[sp++]=i;}
  while(sp){const p=stack[--sp],x=p%w,y=(p-x)/w;
    if(x>0&&near[p-1]&&!flood[p-1]){flood[p-1]=1;stack[sp++]=p-1;}
    if(x<w-1&&near[p+1]&&!flood[p+1]){flood[p+1]=1;stack[sp++]=p+1;}
    if(y>0&&near[p-w]&&!flood[p-w]){flood[p-w]=1;stack[sp++]=p-w;}
    if(y<h-1&&near[p+w]&&!flood[p+w]){flood[p+w]=1;stack[sp++]=p+w;}}
  const hardBg=new Uint8Array(n),hardFg=new Uint8Array(n),lab=new Uint8Array(n);
  const cx=w*.5,cy=h*.46,rx=w*.09,ry=h*.11;
  let fgCount=0;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;
    if(ring[i]&&flood[i])hardBg[i]=1;
    if(!flood[i]){lab[i]=1;fgCount++;if(((x-cx)/rx)**2+((y-cy)/ry)**2<=1)hardFg[i]=1;}}
  if(fgCount<n*.02){ // nothing differs from the border -> cannot segment
    return{lab:new Uint8Array(n),failed:true,fg:null,bg:null};
  }

  let fgM=null,bgM=null,tr=new Float64Array(n);
  for(let it=0;it<iters;it++){
    const fi=[],bi=[];for(let i=0;i<n;i++)(lab[i]?fi:bi).push(i);
    const fIdx=Int32Array.from(fi),bIdx=Int32Array.from(bi);
    if(!fgM){fgM=fitFresh(rgb,fIdx,K);bgM=fitFresh(rgb,bIdx,K);}
    else{fgM=refit(rgb,fIdx,fgM);bgM=refit(rgb,bIdx,bgM);}
    let common=0;
    for(let i=0;i<n;i++){
      let cs,ct;
      if(hardFg[i]){cs=BIG;ct=0;}
      else if(hardBg[i]){cs=0;ct=BIG;}
      else{const r=rgb[i*3],g=rgb[i*3+1],b=rgb[i*3+2];
        cs=clamp(cost(bgM,r,g,b),0,40);  // cost of labelling as BACKGROUND
        ct=clamp(cost(fgM,r,g,b),0,40);} // cost of labelling as FOREGROUND
      tr[i]=cs-ct;
    }
    const res=maxflow(w,h,base.slice(),tr.slice());
    let changed=0;for(let i=0;i<n;i++){const v=res.source[i];if(v!==lab[i])changed++;lab[i]=v;}
    progress&&progress((it+1)/iters,changed);
    await tick();
    if(changed<n*.0005&&it>0)break;
  }
  return{lab,failed:false,fg:fgM,bg:bgM,hardFg};
}

/* ---------- guided filter (gray guide) ---------- */
function boxMean(src,w,h,r){
  const tmp=new Float32Array(src.length),out=new Float32Array(src.length),cs=new Float64Array(Math.max(w,h)+1);
  for(let y=0;y<h;y++){const row=y*w;cs[0]=0;for(let x=0;x<w;x++)cs[x+1]=cs[x]+src[row+x];
    for(let x=0;x<w;x++){const a=Math.max(0,x-r),b=Math.min(w-1,x+r);tmp[row+x]=(cs[b+1]-cs[a])/(b-a+1);}}
  for(let x=0;x<w;x++){cs[0]=0;for(let y=0;y<h;y++)cs[y+1]=cs[y]+tmp[y*w+x];
    for(let y=0;y<h;y++){const a=Math.max(0,y-r),b=Math.min(h-1,y+r);out[y*w+x]=(cs[b+1]-cs[a])/(b-a+1);}}
  return out;
}
function guided(I,p,w,h,r,eps){
  const n=w*h,Ip=new Float32Array(n),II=new Float32Array(n);
  for(let i=0;i<n;i++){Ip[i]=I[i]*p[i];II[i]=I[i]*I[i];}
  const mI=boxMean(I,w,h,r),mp=boxMean(p,w,h,r),mIp=boxMean(Ip,w,h,r),mII=boxMean(II,w,h,r);
  const a=new Float32Array(n),b=new Float32Array(n);
  for(let i=0;i<n;i++){const v=mII[i]-mI[i]*mI[i],c=mIp[i]-mI[i]*mp[i];a[i]=c/(v+eps);b[i]=mp[i]-a[i]*mI[i];}
  const ma=boxMean(a,w,h,r),mb=boxMean(b,w,h,r),q=new Float32Array(n);
  for(let i=0;i<n;i++)q[i]=ma[i]*I[i]+mb[i];
  return q;
}

/* ---------- full pipeline ---------- */
async function autoCut(data,w,h,progress){
  progress=progress||(()=>{});
  const sm=downscale(data,w,h,360);
  progress(.02,'Rang modellari…');await tick();
  const gc=await grabcut(sm.rgb,sm.w,sm.h,5,(f,c)=>progress(.05+.6*f,'Segmentatsiya '+Math.round(f*100)+'%'));
  if(gc.failed)return{failed:true};
  const sw=sm.w,sh=sm.h,n=sw*sh;
  // clean up: keep main foreground blobs, fill small enclosed holes
  let lab=gc.lab;
  const cf=components(lab,sw,sh,1);
  let big=0;for(const s of cf.sizes)if(s>big)big=s;
  const keep=new Uint8Array(cf.sizes.length);
  cf.sizes.forEach((s,k)=>{keep[k]=s>=big*.08?1:0;});
  for(let i=0;i<n;i++)if(lab[i]&&!keep[cf.id[i]])lab[i]=0;
  const cb=components(lab,sw,sh,0);
  for(let i=0;i<n;i++)if(!lab[i]){const k=cb.id[i];if(!cb.touch[k]&&cb.sizes[k]<n*.012)lab[i]=1;}
  progress(.68,'Sochlar orasidagi fon…');await tick();
  const pk=downscale(data,w,h,640),pw=pk.w,ph=pk.h,pn=pw*ph;
  // threshold from the background's own colour statistics (the fg model may have learned background pockets)
  const bc=[];for(let i=0;i<n;i+=3)if(!lab[i])bc.push(cost(gc.bg,sm.rgb[i*3],sm.rgb[i*3+1],sm.rgb[i*3+2]));
  bc.sort((a,b)=>a-b);const thrB=bc.length>50?bc[Math.floor(bc.length*.97)]:0;
  let bgLike=new Uint8Array(pn);
  if(bc.length>50)for(let i=0;i<pn;i++){const r=pk.rgb[i*3],g=pk.rgb[i*3+1],b=pk.rgb[i*3+2];
    bgLike[i]=cost(gc.bg,r,g,b)<=thrB?255:0;}
  bgLike=morphGray(morphGray(bgLike,pw,ph,1,false),pw,ph,1,true);
  const pc=components(bgLike.map(v=>v?1:0),pw,ph,1),pocket=new Uint8Array(pn),keepP=new Uint8Array(pc.sizes.length);
  const cx=pw*.5,cy=ph*.46,rx=pw*.09*1.8,ry=ph*.11*1.8,minArea=Math.max(60,pn*.0005);
  pc.sizes.forEach((sz,k)=>{keepP[k]=sz>=minArea?1:0;});
  for(let y=0;y<ph;y++)for(let x=0;x<pw;x++){const i=y*pw+x,k=pc.id[i];
    if(k>=0&&((x-cx)/rx)**2+((y-cy)/ry)**2<=1)keepP[k]=0;}
  for(let i=0;i<pn;i++){const k=pc.id[i];if(k>=0&&keepP[k])pocket[i]=1;}
  if(root.__PSDBG)root.__PSDBG.pocket={thrB,bgLikePx:bgLike.reduce((a,v)=>a+(v?1:0),0),pn,comps:pc.sizes.length,top:pc.sizes.slice().sort((a,b)=>b-a).slice(0,6),minArea,kept:keepP.reduce((a,v)=>a+v,0),pocketPx:pocket.reduce((a,v)=>a+v,0)};
  progress(.72,'Chekkalarni aniqlash…');await tick();
  // soft upsample
  const f=new Uint8Array(n);for(let i=0;i<n;i++)f[i]=lab[i]?255:0;
  const soft=boxMean(Float32Array.from(f,v=>v/255),sw,sh,1);
  const er=morphGray(f,sw,sh,2,false),di=morphGray(f,sw,sh,2,true);
  const N=w*h,p=new Float32Array(N),I=new Float32Array(N);
  const sx=sw/w,sy=sh/h;
  for(let y=0;y<h;y++){
    const v=y*sy-.5,y0=clamp(Math.floor(v),0,sh-1),y1=Math.min(sh-1,y0+1),fy=clamp(v-y0,0,1);
    for(let x=0;x<w;x++){
      const u=x*sx-.5,x0=clamp(Math.floor(u),0,sw-1),x1=Math.min(sw-1,x0+1),fx=clamp(u-x0,0,1);
      const a=soft[y0*sw+x0]*(1-fx)+soft[y0*sw+x1]*fx,b=soft[y1*sw+x0]*(1-fx)+soft[y1*sw+x1]*fx;
      const i=y*w+x;p[i]=a*(1-fy)+b*fy;
      const q=i*4;I[i]=(.299*data[q]+.587*data[q+1]+.114*data[q+2])/255;
    }
    if((y&255)===255)await tick();
  }
  // uncertain band: re-classify with the learned GMMs at full resolution
  for(let y=0;y<h;y++){
    const ly=Math.min(sh-1,Math.floor(y*sy));
    for(let x=0;x<w;x++){
      const lx=Math.min(sw-1,Math.floor(x*sx)),li=ly*sw+lx;
      if(er[li]===255||di[li]===0)continue;           // sure fg / sure bg
      const i=y*w+x,q=i*4,r=data[q],g=data[q+1],b=data[q+2];
      const d=cost(gc.bg,r,g,b)-cost(gc.fg,r,g,b);   // >0 : looks like foreground
      const a=1/(1+Math.exp(-d/2.2));
      p[i]=.75*a+.25*p[i];
    }
    if((y&255)===255)await tick();
  }
  progress(.82,'Silliqlash…');await tick();
  const p2=Float32Array.from(p);
  for(let y=0;y<h;y++){const py=Math.min(ph-1,Math.floor(y*ph/h))*pw;
    for(let x=0;x<w;x++)if(pocket[py+Math.min(pw-1,Math.floor(x*pw/w))])p2[y*w+x]=0;}
  const rad=Math.max(3,Math.round(Math.max(w,h)/170));
  const toAlpha=q=>{const o=new Uint8Array(N);for(let i=0;i<N;i++){const v=clamp((q[i]-.5)*1.7+.5,0,1);o[i]=Math.round(v*255);}return o;};
  const alphaPlain=toAlpha(guided(I,p,w,h,rad,1.5e-3));
  await tick();
  const alpha=toAlpha(guided(I,p2,w,h,rad,1.5e-3));
  progress(1,'Tayyor');
  return{failed:false,alpha,alphaPlain,low:{lab,w:sw,h:sh}};
}

/* ---------- edge colour decontamination ---------- */
function decontaminate(data,alpha,w,h){
  const N=w*h,m=new Float32Array(N),R=new Float32Array(N),G=new Float32Array(N),B=new Float32Array(N);
  for(let i=0;i<N;i++){if(alpha[i]>245){m[i]=1;R[i]=data[i*4];G[i]=data[i*4+1];B[i]=data[i*4+2];}}
  const r=Math.max(3,Math.round(Math.max(w,h)/400)),mm=boxMean(m,w,h,r),mr=boxMean(R,w,h,r),mg=boxMean(G,w,h,r),mb=boxMean(B,w,h,r);
  const out=new Uint8ClampedArray(data);
  for(let i=0;i<N;i++){
    const a=alpha[i]/255;if(a>.96||mm[i]<.03)continue;
    const k=clamp((.96-a)/.55,0,1),fr=mr[i]/mm[i],fg=mg[i]/mm[i],fb=mb[i]/mm[i],q=i*4;
    out[q]=data[q]+(fr-data[q])*k;out[q+1]=data[q+1]+(fg-data[q+1])*k;out[q+2]=data[q+2]+(fb-data[q+2])*k;
  }
  return out;
}

root.PSseg={maxflow,autoCut,morphGray,decontaminate,boxMean,downscale,grabcut};
})(typeof window!=='undefined'?window:globalThis);

<script>
/* ===== FOTO 3x4 STUDIO — core ===== */
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){
    const v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='value')e.value=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='html')e.innerHTML=v;
    else e.setAttribute(k,v===true?'':v);
  }
  kids.flat(9).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(String(c)));});
  return e;

  const keep=P;P=defP();P.size=keep.size;P.dpi=keep.dpi;P.bg=keep.bg;P.bgOn=keep.bgOn;

/* ---------- auto levels ---------- */
function computeAutoLevels(d){
  const hist=[new Uint32Array(256),new Uint32Array(256),new Uint32Array(256)],n=d.width*d.height,a=d.data;
  const step=Math.max(1,Math.floor(n/200000));let cnt=0;
  for(let i=0;i<n;i+=step){hist[0][a[i*4]]++;hist[1][a[i*4+1]]++;hist[2][a[i*4+2]]++;cnt++;}
  const lo=[],hi=[];
  for(let c=0;c<3;c++){let s=0,l=0,hh=255;for(let v=0;v<256;v++){s+=hist[c][v];if(s>=cnt*.004){l=v;break;}}
    s=0;for(let v=255;v>=0;v--){s+=hist[c][v];if(s>=cnt*.004){hh=v;break;}}
    if(hh-l<40){l=0;hh=255;}lo.push(l);hi.push(hh);}
  return{lo,hi};
}

/* ---------- geometry ---------- */
const baseScale=(Wp,Hp)=>Math.max(Wp/img.w,Hp/img.h)*P.zoom;
function drawLayer(ctx,cv,Wp,Hp,ox,oy){
  const s=baseScale(Wp,Hp);
  ctx.save();ctx.translate(ox+Wp*(.5+P.tx),oy+Hp*(.5+P.ty));ctx.rotate(P.rot*Math.PI/180);ctx.scale(P.flip?-s:s,s);
  ctx.drawImage(cv,-img.w/2,-img.h/2);ctx.restore();
}
function outPx(){return{W:clamp(Math.round(P.size.w/25.4*P.dpi),16,4800),H:clamp(Math.round(P.size.h/25.4*P.dpi),16,4800)};}

/* ---------- adjustments ---------- */
function adjActive(a){return a.auto||a.bw||['exposure','brightness','contrast','highlights','shadows','saturation','vibrance','temp','tint','smooth','sharpen'].some(k=>a[k]);}
function buildLUT(a,c){
  const t=new Uint8ClampedArray(256),ex=Math.pow(2,a.exposure),br=a.brightness/100*.25,ct=1+a.contrast/100,hl=a.highlights/100*.4,sh=a.shadows/100*.4;
  const lo=a.auto?img.autoLv.lo[c]:0,hi=a.auto?img.autoLv.hi[c]:255;
  for(let i=0;i<256;i++){
    let v=a.auto?clamp((i-lo)/Math.max(1,hi-lo),0,1):i/255;
    v*=ex;v+=br;v=(v-.5)*ct+.5;
    const vv=clamp(v,0,1);
    v+=sh*vv*Math.pow(1-vv,2)*6.75;v+=hl*vv*vv*(1-vv)*6.75;
    t[i]=clamp(v,0,1)*255;
  }
  return t;
}
function boxBlur(src,W,Hh,r){

    for(let c=0;c<3;c++){let sum=0;for(let i=-r;i<=r;i++)sum+=src[row+clamp(i,0,W-1)*4+c];
      for(let x=0;x<W;x++){tmp[row+x*4+c]=sum/d;sum+=src[row+Math.min(W-1,x+r+1)*4+c]-src[row+Math.max(0,x-r)*4+c];}}}
  for(let x=0;x<W;x++){
    for(let c=0;c<3;c++){let sum=0;for(let i=-r;i<=r;i++)sum+=tmp[clamp(i,0,Hh-1)*W*4+x*4+c];
      for(let y=0;y<Hh;y++){out[y*W*4+x*4+c]=sum/d;sum+=tmp[Math.min(Hh-1,y+r+1)*W*4+x*4+c]-tmp[Math.max(0,y-r)*W*4+x*4+c];}}}
  for(let i=3;i<src.length;i+=4)out[i]=src[i];

}
function adjust(data,W,Hh){
  const a=P.adj;if(!adjActive(a))return;
  const d=data,n=W*Hh;
  if(a.smooth>0){
    const bl=boxBlur(d,W,Hh,Math.max(2,Math.round(W/110))),k=a.smooth/100*.9;
    for(let i=0;i<n;i++){const j=i*4,r=d[j],g=d[j+1],b=d[j+2];
      const cb=128-.168736*r-.331264*g+.5*b,cr=128+.5*r-.418688*g-.081312*b,y=.299*r+.587*g+.114*b;
      if(cb>74&&cb<130&&cr>130&&cr<175&&y>45){
        const yb=.299*bl[j]+.587*bl[j+1]+.114*bl[j+2],df=Math.abs(y-yb),w=Math.exp(-(df*df)/(2*14*14))*k;
        d[j]+=(bl[j]-r)*w;d[j+1]+=(bl[j+1]-g)*w;d[j+2]+=(bl[j+2]-b)*w;}}
  }
  const LR=buildLUT(a,0),LG=buildLUT(a,1),LB=buildLUT(a,2);
  const tr=1+a.temp/100*.18,tb=1-a.temp/100*.18,tg=1-a.tint/100*.12,sat=1+a.saturation/100,vib=a.vibrance/100,bw=a.bw;
  const doColor=a.temp||a.tint||a.saturation||a.vibrance||bw;
  for(let i=0;i<n;i++){
    const j=i*4;let r=LR[d[j]],g=LG[d[j+1]],b=LB[d[j+2]];
    if(doColor){
      r*=tr;g*=tg;b*=tb;
      const lum=.299*r+.587*g+.114*b;
      if(bw){r=g=b=lum;}
      else{
        let s=sat;
        if(vib){const mx=Math.max(r,g,b),mn=Math.min(r,g,b),cs=(mx-mn)/(mx+1);s*=1+vib*(1-cs);}
        r=lum+(r-lum)*s;g=lum+(g-lum)*s;b=lum+(b-lum)*s;

    }
    d[j]=r;d[j+1]=g;d[j+2]=b;
  }
  if(a.sharpen>0){
    const bl=boxBlur(d,W,Hh,Math.max(1,Math.round(W/320))),k=a.sharpen/100*1.6;
    for(let i=0;i<n;i++){const j=i*4;d[j]+=(d[j]-bl[j])*k;d[j+1]+=(d[j+1]-bl[j+1])*k;d[j+2]+=(d[j+2]-bl[j+2])*k;}
  }
}

/* ---------- frame render (also used by export) ---------- */
const scratchA=document.createElement('canvas'),scratchB=document.createElement('canvas');
function renderFrame(cv,W,Hh,o){
  o=o||{};

  const x=cv.getContext('2d');x.imageSmoothingQuality='high';
  if(P.bgOn||o.forceBg){x.fillStyle=P.bg;x.fillRect(0,0,W,Hh);}
  if(!img||!P.subOn)return cv;
  scratchA.width=scratchB.width=W;scratchA.height=scratchB.height=Hh;
  const a=scratchA.getContext('2d',{willReadFrequently:true}),b=scratchB.getContext('2d',{willReadFrequently:true});
  a.imageSmoothingQuality=b.imageSmoothingQuality='high';

  const ad=a.getImageData(0,0,W,Hh),md=b.getImageData(0,0,W,Hh),A=ad.data,M=md.data,n=W*Hh;
  adjust(A,W,Hh);
  for(let i=0;i<n;i++)A[i*4+3]=M[i*4+3];

PS.renderFrame=renderFrame;

/* ---------- coordinate transforms ---------- */

/* ---------- wand / background removal ---------- */
let wand=null;
const LIN=new Float32Array(256);for(let i=0;i<256;i++){const v=i/255;LIN[i]=v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);}

function floodRegion(seeds,color,tol,contig){

    if(x<w-1){const q=p+1;if(!seen[q]){seen[q]=1;if(near(q)){reg[q]=1;stack[sp++]=q;}}}
    if(y>0){const q=p-w;if(!seen[q]){seen[q]=1;if(near(q)){reg[q]=1;stack[sp++]=q;}}}
    if(y<hh-1){const q=p+w;if(!seen[q]){seen[q]=1;if(near(q)){reg[q]=1;stack[sp++]=q;}}}}

}

      for(let x=0;x<w;x++){tmp[row+x]=s/d;s+=cur[row+Math.min(w-1,x+r+1)]-cur[row+Math.max(0,x-r)];}}
    for(let x=0;x<w;x++){let s=0;for(let i=-r;i<=r;i++)s+=tmp[clamp(i,0,hh-1)*w+x];
      for(let y=0;y<hh;y++){out[y*w+x]=s/d;s+=tmp[Math.min(hh-1,y+r+1)*w+x]-tmp[Math.max(0,y-r)*w+x];}}

}
function borderSeeds(){
  const w=img.w,hh=img.h,s=[];

}
function borderColor(){
  const w=img.w,hh=img.h,d=img.srcData.data,R=[],G=[],B=[];
  const add=i=>{R.push(d[i*4]);G.push(d[i*4+1]);B.push(d[i*4+2]);};

function runAuto(){

/* ---------- brush ---------- */
let dirty=null;
function dab(x,y,r,hard,flow,erase){
  const d=img.maskImg.data,w=img.w,hh=img.h;
  const x0=Math.max(0,Math.floor(x-r)),x1=Math.min(w-1,Math.ceil(x+r)),y0=Math.max(0,Math.floor(y-r)),y1=Math.min(hh-1,Math.ceil(y+r));

const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

async function withDpi(blob,fmt,dpi){
  const b=new Uint8Array(await blob.arrayBuffer());
  if(fmt==='png'){
    const ppm=Math.round(dpi/.0254),chunk=new Uint8Array(21),dv=new DataView(chunk.buffer);
    dv.setUint32(0,9);chunk.set([0x70,0x48,0x59,0x73],4);dv.setUint32(8,ppm);dv.setUint32(12,ppm);chunk[16]=1;
    dv.setUint32(17,crc32(chunk.subarray(4,17)));
    const out=new Uint8Array(b.length+21);out.set(b.subarray(0,33));out.set(chunk,33);out.set(b.subarray(33),54);
    return new Blob([out],{type:'image/png'});
  }
  if(b[0]===0xFF&&b[1]===0xD8){
    const d=Math.round(dpi);
    if(b[2]===0xFF&&b[3]===0xE0&&b[6]===0x4A&&b[7]===0x46){b[13]=1;b[14]=d>>8;b[15]=d&255;b[16]=d>>8;b[17]=d&255;return new Blob([b],{type:'image/jpeg'});}
    const seg=new Uint8Array([0xFF,0xE0,0,16,0x4A,0x46,0x49,0x46,0,1,1,1,d>>8,d&255,d>>8,d&255,0,0]);
    const out=new Uint8Array(b.length+seg.length);out.set(b.subarray(0,2));out.set(seg,2);out.set(b.subarray(2),2+seg.length);
    return new Blob([out],{type:'image/jpeg'});
  }
  return blob;
}
const baseName=()=>((S.img&&S.img.name)||'foto').replace(/\.[^.]+$/,'').replace(/[^\w\-]+/g,'_').slice(0,40)||'foto';

async function exportPhoto(){
  if(!hasImg()){PS.toast('Avval rasm oching.');return;}
  PS.busy(true);await new Promise(r=>setTimeout(r,30));
  try{
    const o=PS.outPx(),cv=document.createElement('canvas');
    const png=exp.fmt==='png';
    PS.renderFrame(cv,o.W,o.H,{forceBg:!png&&!S.P.bgOn});
    if(!png&&!S.P.bgOn){/* JPG cannot be transparent */}
    let blob=await toBlob(cv,png?'image/png':'image/jpeg',exp.q/100);
    blob=await withDpi(blob,png?'png':'jpg',S.P.dpi);
    saveBlob(blob,baseName()+'_'+sizeTag()+'_'+S.P.dpi+'dpi.'+(png?'png':'jpg'));
    PS.toast('Saqlandi: '+o.W+'×'+o.H+' px, '+S.P.dpi+' DPI'+((!png&&!S.P.bgOn)?' (JPG shaffoflikni qo\'llamaydi — oq fon)':''));

function layoutSheet(){
  const w=S.P.size.w,hh=S.P.size.h,m=sheet.margin,g=sheet.gap;
  const calc=(pw,ph)=>{const cols=Math.max(0,Math.floor((pw-2*m+g)/(w+g))),rows=Math.max(0,Math.floor((ph-2*m+g)/(hh+g)));return{pw,ph,cols,rows,max:cols*rows};};
  let L;
  const a=calc(sheet.pw,sheet.ph),b=calc(sheet.ph,sheet.pw);
  if(sheet.orient==='portrait')L=a;else if(sheet.orient==='landscape')L=b;else L=b.max>a.max?b:a;
  const count=L.max?(sheet.copies>0?Math.min(sheet.copies,L.max):L.max):0;
  const usedCols=Math.min(L.cols,count),usedRows=count?Math.ceil(count/L.cols):0;
  L.count=count;L.w=w;L.h=hh;L.g=g;
  L.x0=(L.pw-(usedCols*w+Math.max(0,usedCols-1)*g))/2;L.y0=(L.ph-(usedRows*hh+Math.max(0,usedRows-1)*g))/2;
  return L;
}
const sheetPhoto=document.createElement('canvas');
function drawSheet(cv,dpi){
  const L=layoutSheet();let d=dpi;
  while((L.pw/25.4*d)*(L.ph/25.4*d)>36e6)d*=.9;
  const pxW=Math.round(L.pw/25.4*d),pxH=Math.round(L.ph/25.4*d);
  cv.width=pxW;cv.height=pxH;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,pxW,pxH);
  if(!hasImg()||!L.count)return{L,dpi:d};
  const pw=Math.round(L.w/25.4*d),ph=Math.round(L.h/25.4*d);
  PS.renderFrame(sheetPhoto,pw,ph,{forceBg:true});
  const mm=v=>v/25.4*d;
  for(let i=0;i<L.count;i++){
    const c=i%L.cols,r=Math.floor(i/L.cols),px=Math.round(mm(L.x0+c*(L.w+L.g))),py=Math.round(mm(L.y0+r*(L.h+L.g)));
    x.drawImage(sheetPhoto,px,py,pw,ph);
    if(sheet.cut){x.strokeStyle='#b5bac4';x.lineWidth=Math.max(1,Math.round(d/300));x.strokeRect(px-.5,py-.5,pw+1,ph+1);}
  }
  return{L,dpi:d};
}
function pdfFromJpeg(jpg,wpx,hpx,wmm,hmm){
  const enc=new TextEncoder(),parts=[],offs=[];let pos=0;
  const push=b=>{const u=typeof b==='string'?enc.encode(b):b;parts.push(u);pos+=u.length;};
  push('%PDF-1.4\n');push(new Uint8Array([0x25,0xE2,0xE3,0xCF,0xD3,0x0A]));
  const obj=(n,body)=>{offs[n]=pos;push(n+' 0 obj\n'+body+'\nendobj\n');};
  const W=(wmm*72/25.4).toFixed(2),Hh=(hmm*72/25.4).toFixed(2);
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+Hh+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
  offs[4]=pos;push('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+wpx+' /Height '+hpx+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpg.length+' >>\nstream\n');push(jpg);push('\nendstream\nendobj\n');
  const cs='q '+W+' 0 0 '+Hh+' 0 0 cm /Im0 Do Q';
  obj(5,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
  const xr=pos;let t='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)t+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  t+='trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n';push(t);
  return new Blob(parts,{type:'application/pdf'});
}
async function exportSheet(fmt){
  if(!hasImg()){PS.toast('Avval rasm oching.');return;}
  const L0=layoutSheet();if(!L0.count){PS.toast('Bu varaqqa foto sig\'maydi. Chekka yoki oraliqni kamaytiring.');return;}
  PS.busy(true);await new Promise(r=>setTimeout(r,30));
  try{
    const cv=document.createElement('canvas'),{L,dpi}=drawSheet(cv,S.P.dpi);
    const nm=baseName()+'_varaq_'+L.count+'ta_'+sizeTag();
    if(fmt==='pdf'){
      const jb=await toBlob(cv,'image/jpeg',.95),jpg=new Uint8Array(await jb.arrayBuffer());
      saveBlob(pdfFromJpeg(jpg,cv.width,cv.height,L.pw,L.ph),nm+'.pdf');
    }else{
      let b=await toBlob(cv,fmt==='png'?'image/png':'image/jpeg',.95);b=await withDpi(b,fmt==='png'?'png':'jpg',dpi);saveBlob(b,nm+'.'+(fmt==='png'?'png':'jpg'));
    }
    PS.toast('Varaq saqlandi: '+L.count+' ta foto, '+L.pw+'×'+L.ph+' mm');
  }catch(e){PS.toast('Xato: '+e.message);}
  PS.busy(false);
}
function buildSheet(){
  const prev=h('canvas',{id:'sheetCv',width:10,height:10}),info=h('div',{class:'prevcap',id:'sheetInfo'},'—');
  const paper=h('select',{'aria-label':'Qog\'oz'},PAPERS.map(p=>h('option',{value:p[0]},p[1])));
  const pwI=h('input',{class:'inp',type:'number',min:'30',max:'1000',step:'0.1'}),phI=h('input',{class:'inp',type:'number',min:'30',max:'1000',step:'0.1'});
  const cust=h('div',{class:'g2'},field('Eni (mm)',pwI),field('Bo\'yi (mm)',phI));
  const mI=h('input',{class:'inp',type:'number',min:'0',max:'40',step:'0.5'}),gI=h('input',{class:'inp',type:'number',min:'0',max:'20',step:'0.5'}),cI=h('input',{class:'inp',type:'number',min:'0',max:'200',step:'1',placeholder:'0 = maksimal'});
  const ori=h('div',{class:'seg'});[['auto','Avto'],['portrait','Tik'],['landscape','Yotiq']].forEach(([v,l])=>ori.append(h('button',{type:'button','data-v':v,onclick:()=>{sheet.orient=v;upd();}},l)));
  const cut=h('label',{class:'chk',style:'margin:4px 0 10px'},h('input',{type:'checkbox'}),'Kesish chizig\'lari');
  cut.firstChild.addEventListener('change',e=>{sheet.cut=e.target.checked;upd();});
  paper.addEventListener('change',()=>{const p=PAPERS.find(x=>x[0]===paper.value);sheet.paper=p[0];if(p[0]!=='custom'){sheet.pw=p[2];sheet.ph=p[3];}upd();});
  [[pwI,'pw',30],[phI,'ph',30],[mI,'margin',0],[gI,'gap',0],[cI,'copies',0]].forEach(([el,k,mn])=>el.addEventListener('input',()=>{const v=parseFloat(el.value);sheet[k]=isNaN(v)?mn:Math.max(mn,v);if(k==='copies')sheet.copies=Math.round(sheet.copies);if(k==='pw'||k==='ph'){sheet.paper='custom';}upd(true);}));
  const sfmt=h('div',{class:'seg'});[['pdf','PDF'],['jpg','JPG'],['png','PNG']].forEach(([v,l])=>sfmt.append(h('button',{type:'button','data-v':v,onclick:()=>{exp.sheetFmt=v;upd();}},l)));
  function upd(typing){
    saveSettings();
    paper.value=sheet.paper;cust.classList.toggle('hide',sheet.paper!=='custom');
    if(!typing){pwI.value=sheet.pw;phI.value=sheet.ph;mI.value=sheet.margin;gI.value=sheet.gap;cI.value=sheet.copies||'';}
    ori.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===sheet.orient)));
    sfmt.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===exp.sheetFmt)));
    cut.firstChild.checked=sheet.cut;
    const L=layoutSheet();
    const cv=drawSheet(prev,Math.max(20,600/(Math.max(L.pw,1)/25.4)));
    prev.style.aspectRatio=L.pw+'/'+L.ph;
    info.textContent=L.count?(L.count+' ta foto · '+L.cols+'×'+L.rows+' · '+L.pw+'×'+L.ph+' mm'):'Foto sig\'maydi';
  }
  PS.updSheet=upd;
  syncs.push(()=>{if(secs.sheet&&secs.sheet.classList.contains('open'))upd(true);});
  section('sheet','Chop etish varag\'i',false,[
    h('p',{class:'note'},'Bir varaqqa bir nechta foto joylashtiring — fotostudiyaga olib borish yoki o\'zingiz chop etish uchun.'),
    field('Qog\'oz',paper),cust,
    h('div',{class:'g3'},field('Chekka (mm)',mI),field('Oraliq (mm)',gI),field('Soni',cI)),
    field('Yo\'nalish',ori),cut,prev,info,
    h('div',{class:'fld'},h('label',null,'Saqlash formati'),sfmt),
    h('button',{class:'btn pri',type:'button',style:'width:100%;padding:9px',onclick:()=>exportSheet(exp.sheetFmt)},'⬇ Varaqni yuklab olish'),
    h('p',{class:'note',style:'margin-top:8px'},'Chop etishda "Haqiqiy o\'lcham (100%)" ni tanlang — foto aniq o\'lchamda chiqadi.')]);
  secs.sheet.querySelector('.sh').addEventListener('click',()=>setTimeout(()=>upd(),0));
  upd();
}

document.querySelectorAll('.mb').forEach(btn=>btn.addEventListener('click',e=>{

  closeMenu();openMenu=id;btn.classList.add('open');
  const dd=h('div',{class:'dd',role:'menu'},MENUS[id]().map(it=>it==='-'?h('hr'):h('button',{type:'button',role:'menuitem',disabled:!!it[3],onclick:()=>{closeMenu();it[2]();}},h('span',null,it[0]),it[1]?h('kbd',null,it[1]):null)));

/* ---------- keyboard ---------- */
window.addEventListener('keydown',e=>{
  const tag=e.target.tagName,typing=(tag==='INPUT'&&!/range|checkbox|color/.test(e.target.type))||tag==='TEXTAREA'||tag==='SELECT';
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?PS.redo():PS.undo();return;}
  if(mod&&k==='y'){e.preventDefault();PS.redo();return;}
  if(mod&&k==='o'){e.preventDefault();$('#file').click();return;}
  if(mod&&k==='s'){e.preventDefault();exportPhoto();return;}
  if(mod&&k==='0'){e.preventDefault();PS.fitView();return;}
  if(mod&&(k==='='||k==='+')){e.preventDefault();PS.zoomView(1.25);return;}
  if(mod&&k==='-'){e.preventDefault();PS.zoomView(.8);return;}
  if(typing||mod)return;
  if(e.key==='Escape'){$('#modal').classList.add('hide');closeMenu();return;}
  const map={v:'move',w:'wand',e:'erase',r:'restore',h:'hand'};
  if(map[k]){PS.setTool(map[k]);return;}
  if(k==='x'&&(S.tool==='erase'||S.tool==='restore')){PS.setTool(S.tool==='erase'?'restore':'erase');return;}
  if(k==='g'){S.view.guides=!S.view.guides;PS.requestRender();buildOptions();return;}
  if(e.key==='['||e.key===']'){S.opt.brush.size=clamp(S.opt.brush.size+(e.key==='['?-6:6),6,200);buildOptions();PS.requestRender();return;}
  if(hasImg()&&e.key.startsWith('Arrow')){
    e.preventDefault();const st=e.shiftKey?10:1,fr=PS.frameRect();
    if(e.key==='ArrowLeft')S.P.tx-=st/fr.w;if(e.key==='ArrowRight')S.P.tx+=st/fr.w;if(e.key==='ArrowUp')S.P.ty-=st/fr.h;if(e.key==='ArrowDown')S.P.ty+=st/fr.h;
    PS.requestRender();clearTimeout(PS.__nudge);PS.__nudge=setTimeout(()=>PS.pushHist('Surish',false),400);
  }
});
