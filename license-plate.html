    <style>
        :root {
            --bg: #04060b;
            --accent: #38bdf8;
            --glow: 0 0 35px rgba(56, 189, 248, 0.65);
            --text-color: #e5e7eb;
            --card-bg: rgba(11, 18, 32, 0.84);
            --border: rgba(56, 189, 248, 0.25);
        }
        body.night-mode {
            --bg: #000000;
            --accent: #00ff41;
            --glow: 0 0 35px rgba(0, 255, 65, 0.65);
            --text-color: #00ff41;
            --card-bg: rgba(0, 20, 0, 0.85);
            --border: rgba(0, 255, 65, 0.3);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.35s, color 0.35s;
        }
        header {
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            background: rgba(4, 6, 11, 0.9);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .back-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 10px;
            text-decoration: none;
            font: 700 11px monospace;
            letter-spacing: 1px;
            transition: 0.25s;
        }
        .back-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: var(--glow);
        }
        .logo-text {
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent);
            font-size: 14px;
            text-shadow: var(--glow);
        }
        .mode-toggle {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            font-size: 10px;
            letter-spacing: 1px;
        }

        /* WORKSPACE */
        .workspace {
            max-width: 1460px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 20px;
            min-height: calc(100vh - 65px);
        }
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.55);
        }
        .panel-title {
            font: 700 11px monospace;
            color: var(--accent);
            letter-spacing: 2px;
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin: 0;
        }
        .control-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.34);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .field-row {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .field-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .field-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1.2fr 1fr;
            gap: 8px;
        }
        label {
            font: 700 10px monospace;
            color: #94a3b8;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }
        label b { color: var(--accent); }
        select, input[type="text"] {
            width: 100%;
            background: #07101e;
            color: #fff;
            border: 1px solid var(--border);
            padding: 10px 12px;
            border-radius: 9px;
            font: 700 13px 'Inter', monospace;
            outline: none;
            transition: 0.2s;
            text-transform: uppercase;
        }
        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .btn {
            background: rgba(7, 16, 28, 0.92);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 10px;
            font: 700 10px monospace;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.22);
        }
        .btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        .btn-export {
            background: var(--accent);
            color: #001018;
            border: none;
            padding: 13px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 0 22px rgba(56, 189, 248, 0.35);
        }
        .btn-export:hover {
            opacity: 0.92;
            color: #000;
            transform: translateY(-1px);
        }

        /* STAGE */
        .stage-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 580px;
        }
        .stage-toolbar {
            padding: 12px 18px;
            border-bottom: 1px solid var(--border);
            background: rgba(2, 6, 12, 0.88);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .country-pills {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .pill {
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid var(--border);
            color: #cbd5e1;
            padding: 6px 10px;
            border-radius: 8px;
            font: 700 10px monospace;
            cursor: pointer;
            transition: 0.2s;
        }
        .pill:hover, .pill.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        .canvas-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            position: relative;
            background-color: #060a12;
            background-image:
                radial-gradient(circle at 50% 40%, rgba(56, 189, 248, 0.12), transparent 65%),

                linear-gradient(-45deg, rgba(255,255,255,0.025) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.025) 75%),
                linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.025) 75%);
            background-size: 100% 100%, 24px 24px, 24px 24px, 24px 24px, 24px 24px;
            background-position: 0 0, 0 0, 0 12px, 12px -12px, -12px 0;
        }
        #plateCanvas {
            max-width: 100%;
            height: auto;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.75));
            transition: transform 0.2s ease;
        }
        .stage-footer {
            padding: 12px 18px;
            border-top: 1px solid var(--border);
            background: rgba(2, 6, 12, 0.92);
            display: flex;
            justify-content: space-between;
            align-items: center;

            color: #94a3b8;
            flex-wrap: wrap;
            gap: 10px;
        }

            .stage-panel { order: -1; min-height: 380px; }
        }
    </style>
</head>

// UI holatlari
let showBolts = true;
let showHolo = true;
let showHolder = true;
let showBgShadow = false;

const canvas = document.getElementById('plateCanvas');
const ctx = canvas.getContext('2d');

// ==================== VEKTORLI BAYROQLAR CHIZISH ENGINE (NO CORS!) ====================
function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawFlag(ctx, code, x, y, w, h) {
    ctx.save();
    drawRoundedRect(ctx, x, y, w, h, 4);
    ctx.clip();

    if (code === 'UZ') {
        // O'zbekiston bayrog'i: Ko'k, Qizil chiziq, Oq, Qizil chiziq, Yashil + Hilol va 12 yulduz
        const stripeH = h * 0.31;
        const redH = h * 0.035;
        ctx.fillStyle = '#0099B5';
        ctx.fillRect(x, y, w, stripeH);
        ctx.fillStyle = '#CE1126';
        ctx.fillRect(x, y + stripeH, w, redH);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x, y + stripeH + redH, w, stripeH);
        ctx.fillStyle = '#CE1126';
        ctx.fillRect(x, y + stripeH * 2 + redH, w, redH);
        ctx.fillStyle = '#1EB53A';
        ctx.fillRect(x, y + stripeH * 2 + redH * 2, w, stripeH + 2);

        // Yarim oy
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(x + w * 0.18, y + stripeH * 0.5, stripeH * 0.34, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0099B5';
        ctx.beginPath();
        ctx.arc(x + w * 0.21, y + stripeH * 0.5, stripeH * 0.29, 0, Math.PI * 2);
        ctx.fill();

        // Yulduzchalar (3 qator: 3, 4, 5)
        ctx.fillStyle = '#FFFFFF';
        const rows = [3, 4, 5];
        for (let r = 0; r < 3; r++) {
            const count = rows[r];
            for (let c = 0; c < count; c++) {
                const sx = x + w * 0.48 - (c * w * 0.045);
                const sy = y + stripeH * (0.24 + r * 0.26);
                ctx.beginPath();
                ctx.arc(sx, sy, 1.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }
    } else if (code === 'RU') {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x, y, w, h / 3);
        ctx.fillStyle = '#0039A6';
        ctx.fillRect(x, y + h / 3, w, h / 3);
        ctx.fillStyle = '#D52B1E';
        ctx.fillRect(x, y + (h * 2) / 3, w, h / 3);
    } else if (code === 'KZ') {
        ctx.fillStyle = '#00AFCA';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#FEC50C';
        ctx.beginPath();
        ctx.arc(x + w * 0.54, y + h * 0.46, h * 0.22, 0, Math.PI * 2);
        ctx.fill();
        // Burgut qanoti
        ctx.strokeStyle = '#FEC50C';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.arc(x + w * 0.54, y + h * 0.56, h * 0.28, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();
    } else if (code === 'KG') {
        ctx.fillStyle = '#E8112D';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#FFEF00';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, h * 0.28, 0, Math.PI * 2);
        ctx.stroke();
    } else if (code === 'TJ') {
        ctx.fillStyle = '#CC0000';
        ctx.fillRect(x, y, w, h * 0.28);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x, y + h * 0.28, w, h * 0.44);
        ctx.fillStyle = '#006600';
        ctx.fillRect(x, y + h * 0.72, w, h * 0.28);
        ctx.fillStyle = '#F8C300';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, h * 0.1, 0, Math.PI * 2);
        ctx.fill();
    } else if (code === 'AZ') {
        ctx.fillStyle = '#00B5E2';
        ctx.fillRect(x, y, w, h / 3);
        ctx.fillStyle = '#EF3340';
        ctx.fillRect(x, y + h / 3, w, h / 3);
        ctx.fillStyle = '#509E2F';
        ctx.fillRect(x, y + (h * 2) / 3, w, h / 3);
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath();
        ctx.arc(x + w * 0.48, y + h / 2, h * 0.13, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#EF3340';
        ctx.beginPath();
        ctx.arc(x + w * 0.51, y + h / 2, h * 0.10, 0, Math.PI * 2);
        ctx.fill();
    } else if (code === 'UK') {
        ctx.fillStyle = '#012169';
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = h * 0.22;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x + w, y + h);
        ctx.moveTo(x + w, y); ctx.lineTo(x, y + h);
        ctx.stroke();
        ctx.strokeStyle = '#C8102E';
        ctx.lineWidth = h * 0.1;
        ctx.beginPath();
        ctx.moveTo(x, y); ctx.lineTo(x + w, y + h);
        ctx.moveTo(x + w, y); ctx.lineTo(x, y + h);
        ctx.stroke();
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = h * 0.3;
        ctx.beginPath();
        ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h);
        ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2);
        ctx.stroke();
        ctx.strokeStyle = '#C8102E';
        ctx.lineWidth = h * 0.18;
        ctx.beginPath();
        ctx.moveTo(x + w / 2, y); ctx.lineTo(x + w / 2, y + h);
        ctx.moveTo(x, y + h / 2); ctx.lineTo(x + w, y + h / 2);
        ctx.stroke();
    } else if (code === 'KR') {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = '#CD2E3A';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, h * 0.26, Math.PI, 0);
        ctx.fill();
        ctx.fillStyle = '#0047A0';
        ctx.beginPath();
        ctx.arc(x + w / 2, y + h / 2, h * 0.26, 0, Math.PI);
        ctx.fill();
    }

    // Bayroq ustidan chiroyli ramka
    ctx.strokeStyle = 'rgba(0,0,0,0.35)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
}

// Yevroittifoq 12 ta yulduz doirasi
function drawEUStars(ctx, cx, cy, radius) {
    ctx.save();
    ctx.fillStyle = '#FFCC00';
    for (let i = 0; i < 12; i++) {
        const ang = (i * 30 - 90) * (Math.PI / 180);
        const sx = cx + Math.cos(ang) * radius;
        const sy = cy + Math.sin(ang) * radius;
        ctx.beginPath();
        ctx.arc(sx, sy, 3.6, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

// ==================== 3D BO'RTMA MATN (EMBOSS ENGINE) ====================
function drawEmbossedText(ctx, text, x, y, font, fillColor, align = 'center', maxWidth = null) {
    const embossPct = parseInt(document.getElementById('embossSlider').value, 10) / 100;
    ctx.save();
    ctx.font = font;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';

    if (embossPct > 0.05) {
        // Pastki o'ng qora soya (3D bo'rtma balandligi)
        ctx.fillStyle = `rgba(0, 0, 0, ${0.42 * embossPct})`;
        const off = 3.5 * embossPct;
        if (maxWidth) ctx.fillText(text, x + off, y + off, maxWidth);
        else ctx.fillText(text, x + off, y + off);

        // Yuqori chap oq yorug'lik (Bevel highlight)
        ctx.fillStyle = `rgba(255, 255, 255, ${0.55 * embossPct})`;
        if (maxWidth) ctx.fillText(text, x - off * 0.55, y - off * 0.55, maxWidth);
        else ctx.fillText(text, x - off * 0.55, y - off * 0.55);
    }

    // Asosiy matn rangi
    ctx.fillStyle = fillColor;
    if (maxWidth) ctx.fillText(text, x, y, maxWidth);
    else ctx.fillText(text, x, y);

    // Shtamplangan metall chekka chizig'i
    if (embossPct > 0.2) {
        ctx.strokeStyle = fillColor === '#FFFFFF' ? 'rgba(220,235,255,0.35)' : 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1.4;
        if (maxWidth) ctx.strokeText(text, x - 0.5, y - 0.5, maxWidth);
        else ctx.strokeText(text, x - 0.5, y - 0.5);
    }
    ctx.restore();
}

// Murvat (Bolt) chizish
function drawBolt(ctx, cx, cy, r = 13) {
    if (!showBolts) return;
    ctx.save();
    // Soya
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.arc(cx + 2, cy + 3, r, 0, Math.PI * 2);
    ctx.fill();

    // Metall qopqoq
    const grad = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, r);
    grad.addColorStop(0, '#f8fafc');
    grad.addColorStop(0.55, '#94a3b8');
    grad.addColorStop(1, '#334155');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Krest o'yig'i
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 2.6;
    ctx.beginPath();
    ctx.moveTo(cx - r * 0.5, cy); ctx.lineTo(cx + r * 0.5, cy);
    ctx.moveTo(cx, cy - r * 0.5); ctx.lineTo(cx, cy + r * 0.5);
    ctx.stroke();
    ctx.restore();
}

// Gologramma lazer belgisi
function drawHologram(ctx, x, y, label = 'UZ') {
    if (!showHolo) return;
    ctx.save();
    const grad = ctx.createLinearGradient(x - 14, y - 14, x + 14, y + 14);
    grad.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
    grad.addColorStop(0.5, 'rgba(192, 132, 252, 0.35)');
    grad.addColorStop(1, 'rgba(52, 211, 153, 0.35)');
    ctx.fillStyle = grad;
    drawRoundedRect(ctx, x - 15, y - 15, 30, 30, 5);
    ctx.fill();
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = 'rgba(51, 65, 85, 0.65)';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, x, y);
    ctx.restore();
}

// ==================== ASOSIY RENDER FUNKSIYASI ====================
function renderPlate() {
    const country = document.getElementById('countrySelect').value;
    const typeId = document.getElementById('plateTypeSelect').value;
    const cfg = COUNTRY_CONFIGS[country];

    const regText = (document.getElementById('inpRegion').value || '').toUpperCase().trim();
    const mainText = (document.getElementById('inpMain').value || '').toUpperCase().trim();
    const subText = (document.getElementById('inpSub').value || '').toUpperCase().trim();
    const holderText = (document.getElementById('inpHolder').value || '').trim();

    const isUSRatio = cfg.ratio === 'us';
    const plateW = isUSRatio ? 1020 : 1480;
    const plateH = isUSRatio ? 510 : 320;
    const holderExtraH = showHolder ? 46 : 0;
    const pad = showBgShadow ? 44 : 14;

    canvas.width = plateW + pad * 2;
    canvas.height = plateH + holderExtraH + pad * 2;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const px = pad;
    const py = pad;

    // 1. AVTOSALON QORA RAMKASI (Agar yoqilgan bo'lsa)
    if (showHolder) {
        ctx.save();
        if (showBgShadow) {
            ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
            ctx.shadowBlur = 28;
            ctx.shadowOffsetY = 12;
        }
        const hGrad = ctx.createLinearGradient(px, py, px, py + plateH + holderExtraH);
        hGrad.addColorStop(0, '#1e2430');
        hGrad.addColorStop(0.5, '#0f131a');
        hGrad.addColorStop(1, '#07090e');
        ctx.fillStyle = hGrad;
        drawRoundedRect(ctx, px - 12, py - 10, plateW + 24, plateH + holderExtraH + 14, 24);
        ctx.fill();

        ctx.strokeStyle = 'rgba(255,255,255,0.12)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Ramka pastidagi yozuv chizig'i
        ctx.fillStyle = '#38bdf8';
        ctx.font = '800 21px "Inter", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(holderText, px + plateW / 2, py + plateH + holderExtraH * 0.54);
        ctx.restore();
    } else if (showBgShadow) {
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
        ctx.shadowBlur = 26;
        ctx.shadowOffsetY = 10;
        ctx.fillStyle = '#000';
        drawRoundedRect(ctx, px, py, plateW, plateH, 20);
        ctx.fill();
        ctx.restore();
    }

    // 2. NOMER ASOSI (FON RANGI VA METALL EFFEKT)
    ctx.save();
    drawRoundedRect(ctx, px, py, plateW, plateH, 20);
    ctx.clip();

    // Rang sxemasini aniqlash
    let bgFill = '#F4F6F9';
    let textFill = '#111318';
    let borderFill = '#111318';

    if (typeId === 'uz_ev') {
        // O'zbekiston Elektromobil yashil fon
        bgFill = '#F4F6F9';
    } else if (typeId === 'uz_dip') {
        bgFill = '#0E8A44';
        textFill = '#FFFFFF';
        borderFill = '#FFFFFF';
    } else if (typeId === 'uz_un') {
        bgFill = '#0277BD';
        textFill = '#FFFFFF';
        borderFill = '#FFFFFF';
    } else if (typeId === 'ru_dip') {
        bgFill = '#C62828';
        textFill = '#FFFFFF';
        borderFill = '#FFFFFF';
    } else if (typeId === 'ru_pol') {
        bgFill = '#1565C0';
        textFill = '#FFFFFF';
        borderFill = '#FFFFFF';
    } else if (typeId === 'tr_gov') {
        bgFill = '#111318';
        textFill = '#FFFFFF';
        borderFill = '#FFFFFF';
    } else if (typeId === 'uk_rear') {
        bgFill = '#F7B500';
        textFill = '#111318';
        borderFill = '#111318';
    } else if (typeId === 'us_ny') {
        bgFill = '#F5B014';
        textFill = '#0A2246';
        borderFill = '#0A2246';
    } else if (typeId === 'jp_com') {
        bgFill = '#0F4D2A';
        textFill = '#FFFFFF';
        borderFill = '#FFFFFF';
    } else if (typeId === 'cn_std') {
        bgFill = '#0C3C9E';
        textFill = '#FFFFFF';
        borderFill = '#FFFFFF';
    }

    ctx.fillStyle = bgFill;
    ctx.fillRect(px, py, plateW, plateH);

    // Xitoy EV yashil gradient
    if (typeId === 'cn_ev') {
        const evGrad = ctx.createLinearGradient(px, py, px, py + plateH);
        evGrad.addColorStop(0, '#F4F7F5');
        evGrad.addColorStop(0.42, '#86EFAC');
        evGrad.addColorStop(1, '#16A34A');
        ctx.fillStyle = evGrad;
        ctx.fillRect(px, py, plateW, plateH);
    }

    // ==================== DAVLATLAR BO'YICHA ANIQ LAYOUT ====================

    if (country === 'UZ') {
        const divX1 = px + 315;
        const isGovNoReg = typeId === 'uz_gov' && !regText;

        // Agar Elektromobil bo'lsa, hudud qismi yashil bo'ladi
        if (typeId === 'uz_ev') {
            ctx.fillStyle = '#16A34A';
            ctx.fillRect(px, py, 315, plateH);
        }

        if (typeId === 'uz_dip' || typeId === 'uz_un') {
            // Diplomat va UN nomerlar
            drawEmbossedText(ctx, mainText, px + plateW * 0.45, py + plateH * 0.52, '700 185px "Oswald", sans-serif', '#FFFFFF', 'center', plateW * 0.72);
            drawFlag(ctx, 'UZ', px + plateW - 165, py + 44, 120, 68);
            drawEmbossedText(ctx, 'UZ', px + plateW - 105, py + plateH - 72, '700 68px "Oswald", sans-serif', '#FFFFFF', 'center');
        } else {
            // Chapda hudud kodi (01, 10, 30...)
            const regColor = typeId === 'uz_ev' ? '#FFFFFF' : textFill;
            drawEmbossedText(ctx, regText || '01', px + 158, py + plateH * 0.52, '700 190px "Oswald", sans-serif', regColor, 'center', 260);

            // Vertikal ajratuvchi chiziq
            ctx.fillStyle = borderFill;
            ctx.fillRect(divX1 - 5, py + 14, 10, plateH - 28);

            // O'rtada asosiy raqam (A 777 AA yoki 777 AAA)
            drawEmbossedText(ctx, mainText, px + 820, py + plateH * 0.52, '700 202px "Oswald", sans-serif', textFill, 'center', 920);

            // O'ngda O'zbekiston bayrog'i va UZ kodi
            drawFlag(ctx, 'UZ', px + plateW - 160, py + 48, 118, 66);
            drawEmbossedText(ctx, subText || 'UZ', px + plateW - 101, py + plateH - 74, '700 72px "Oswald", sans-serif', '#0099B5', 'center');

            // Gologrammalar
            drawHologram(ctx, divX1 + 42, py + 55, 'UZ');
            drawHologram(ctx, divX1 + 42, py + plateH - 55, 'UZ');
        }
        drawBolt(ctx, px + 52, py + plateH / 2);
        drawBolt(ctx, px + plateW - 210, py + plateH / 2);

    } else if (country === 'RU') {
        const divX = px + plateW - 365;
        ctx.fillStyle = borderFill;
        ctx.fillRect(divX - 5, py + 14, 10, plateH - 28);

        // Asosiy raqam chap/o'rtada
        drawEmbossedText(ctx, mainText, px + (divX - px) * 0.5, py + plateH * 0.53, '700 198px "Oswald", sans-serif', textFill, 'center', (divX - px) - 90);

        // O'ng quti: tepada Region (777), pastda RUS + Bayroq
        drawEmbossedText(ctx, regText || '777', divX + 182, py + 115, '700 142px "Oswald", sans-serif', textFill, 'center', 310);
        drawEmbossedText(ctx, subText || 'RUS', divX + 118, py + plateH - 64, '700 58px "Oswald", sans-serif', textFill, 'center');
        drawFlag(ctx, 'RU', divX + 210, py + plateH - 94, 102, 58);

        drawBolt(ctx, px + 52, py + plateH / 2);
        drawBolt(ctx, px + plateW - 48, py + plateH / 2);

    } else if (country === 'KZ') {
        const rightDivX = px + plateW - 300;
        ctx.fillStyle = borderFill;
        ctx.fillRect(rightDivX - 5, py + 14, 10, plateH - 28);

        // Chapda KZ bayrog'i va KZ yozuvi
        drawFlag(ctx, 'KZ', px + 44, py + 52, 118, 68);
        drawEmbossedText(ctx, 'KZ', px + 103, py + plateH - 74, '700 72px "Oswald", sans-serif', '#00AFCA', 'center');

        // O'rtada raqam
        drawEmbossedText(ctx, mainText, px + 665, py + plateH * 0.52, '700 198px "Oswald", sans-serif', textFill, 'center', 880);

        // O'ngda hudud (01, 02)
        drawEmbossedText(ctx, regText || '01', rightDivX + 150, py + plateH * 0.52, '700 185px "Oswald", sans-serif', textFill, 'center', 240);

        drawBolt(ctx, px + 195, py + plateH / 2);
        drawBolt(ctx, rightDivX - 42, py + plateH / 2);

    } else if (country === 'KG') {
        const divX = px + 325;
        ctx.fillStyle = borderFill;
        ctx.fillRect(divX - 5, py + 14, 10, plateH - 28);

        drawEmbossedText(ctx, regText || '01', px + 162, py + 115, '700 148px "Oswald", sans-serif', textFill, 'center');
        drawFlag(ctx, 'KG', px + 54, py + plateH - 102, 102, 58);
        drawEmbossedText(ctx, 'KG', px + 220, py + plateH - 68, '700 62px "Oswald", sans-serif', textFill, 'center');

        drawEmbossedText(ctx, mainText, divX + (plateW - 325) * 0.5, py + plateH * 0.52, '700 200px "Oswald", sans-serif', textFill, 'center', 1020);
        drawBolt(ctx, divX + 55, py + plateH / 2);
        drawBolt(ctx, px + plateW - 55, py + plateH / 2);

    } else if (country === 'TJ') {
        drawFlag(ctx, 'TJ', px + 46, py + 52, 118, 66);
        drawEmbossedText(ctx, 'TJ', px + 105, py + plateH - 74, '700 70px "Oswald", sans-serif', textFill, 'center');

        drawEmbossedText(ctx, mainText, px + 690, py + plateH * 0.52, '700 196px "Oswald", sans-serif', textFill, 'center', 880);
        drawEmbossedText(ctx, regText || '01', px + plateW - 145, py + plateH * 0.45, '700 145px "Oswald", sans-serif', textFill, 'center', 220);

        drawBolt(ctx, px + 195, py + plateH / 2);
        drawBolt(ctx, px + plateW - 50, py + plateH / 2);

    } else if (country === 'AZ') {
        drawFlag(ctx, 'AZ', px + 44, py + 48, 116, 66);
        drawEmbossedText(ctx, 'AZ', px + 102, py + plateH - 74, '700 70px "Oswald", sans-serif', textFill, 'center');
        // Mikrochip belgisi
        ctx.fillStyle = '#cbd5e1';
        drawRoundedRect(ctx, px + 76, py + 128, 52, 34, 4);
        ctx.fill();

        const fullAz = `${regText || '90'} - ${mainText}`;
        drawEmbossedText(ctx, fullAz, px + 830, py + plateH * 0.52, '700 195px "Oswald", sans-serif', textFill, 'center', 1150);
        drawBolt(ctx, px + 195, py + plateH / 2);
        drawBolt(ctx, px + plateW - 55, py + plateH / 2);

    } else if (country === 'TR') {
        // Chapda ko'k TR tasma
        ctx.fillStyle = '#003399';
        ctx.fillRect(px, py, 155, plateH);
        drawEmbossedText(ctx, 'TR', px + 78, py + plateH - 70, '700 68px "Oswald", sans-serif', '#FFFFFF', 'center');

        const fullTr = `${regText || '34'} ${mainText}`;
        drawEmbossedText(ctx, fullTr, px + 155 + (plateW - 155) * 0.5, py + plateH * 0.52, '700 198px "Oswald", sans-serif', textFill, 'center', 1200);
        drawBolt(ctx, px + 210, py + plateH / 2);
        drawBolt(ctx, px + plateW - 55, py + plateH / 2);

    } else if (country === 'DE') {
        // Chapda Yevroittifoq ko'k tasmasi + 12 yulduz + D
        ctx.fillStyle = '#003399';
        ctx.fillRect(px, py, 160, plateH);
        drawEUStars(ctx, px + 80, py + 95, 44);
        drawEmbossedText(ctx, subText || 'D', px + 80, py + plateH - 68, '700 76px "Oswald", sans-serif', '#FFFFFF', 'center');

        // Shahar kodi (B, M, F)
        drawEmbossedText(ctx, regText || 'B', px + 285, py + plateH * 0.52, '700 196px "Chakra Petch", sans-serif', textFill, 'center', 210);

        // Germaniya TÜV va Shahar gerbi muhrlari
        const sealX = px + 445;
        ctx.fillStyle = '#F59E0B';
        ctx.beginPath(); ctx.arc(sealX, py + 95, 36, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#111'; ctx.lineWidth = 3; ctx.stroke();

        ctx.fillStyle = '#2563EB';
        ctx.beginPath(); ctx.arc(sealX, py + plateH - 95, 38, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();

        // Asosiy qism
        drawEmbossedText(ctx, mainText, px + 980, py + plateH * 0.52, '700 196px "Chakra Petch", sans-serif', textFill, 'center', 880);
        drawBolt(ctx, px + 205, py + 48);
        drawBolt(ctx, px + plateW - 55, py + 48);

    } else if (country === 'UK') {
        // Chapda ko'k yoki EV yashil tasma + UK bayrog'i
        ctx.fillStyle = typeId === 'uk_ev' ? '#00843D' : '#003399';
        ctx.fillRect(px, py, 165, plateH);
        drawFlag(ctx, 'UK', px + 28, py + 54, 110, 64);
        drawEmbossedText(ctx, regText || 'UK', px + 83, py + plateH - 72, '700 68px "Oswald", sans-serif', '#FFFFFF', 'center');

        drawEmbossedText(ctx, mainText, px + 165 + (plateW - 165) * 0.5, py + plateH * 0.52, '700 205px "Oswald", sans-serif', textFill, 'center', 1180);
        drawBolt(ctx, px + 230, py + plateH / 2);
        drawBolt(ctx, px + plateW - 65, py + plateH / 2);

    } else if (country === 'UAE') {
        if (typeId === 'uae_ad') {
            // Abu Dhabi Qizil chap qism
            ctx.fillStyle = '#D32F2F';
            ctx.fillRect(px, py, 330, plateH);
            drawEmbossedText(ctx, regText || '5', px + 165, py + plateH * 0.45, '700 165px "Oswald", sans-serif', '#FFFFFF', 'center');
            drawEmbossedText(ctx, 'ABU DHABI', px + 165, py + plateH - 45, '700 34px "Inter", sans-serif', '#FFFFFF', 'center');
            drawEmbossedText(ctx, mainText, px + 905, py + plateH * 0.52, '700 208px "Oswald", sans-serif', textFill, 'center', 980);
        } else {
            // DUBAI uslubi
            drawEmbossedText(ctx, 'DUBAI', px + 230, py + 95, '800 72px "Inter", sans-serif', '#111318', 'center');
            drawEmbossedText(ctx, regText || 'A', px + 230, py + plateH - 95, '700 135px "Oswald", sans-serif', '#111318', 'center');
            ctx.fillStyle = '#111318';
            ctx.fillRect(px + 430, py + 24, 8, plateH - 48);
            drawEmbossedText(ctx, mainText, px + 955, py + plateH * 0.52, '700 212px "Oswald", sans-serif', '#111318', 'center', 920);
        }
        drawBolt(ctx, px + 55, py + plateH / 2);
        drawBolt(ctx, px + plateW - 55, py + plateH / 2);

    } else if (country === 'US') {
        // AQSH 2:1 Nomer (California / NY / TX)
        const headerColor = typeId === 'us_ca' ? '#C8102E' : textFill;
        const mainColor = typeId === 'us_ca' ? '#102A68' : textFill;

        // Burchakdagi yil va oy stikerlari
        ctx.fillStyle = '#1D4ED8';
        drawRoundedRect(ctx, px + 70, py + 38, 110, 52, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 26px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('OCT', px + 125, py + 72);

        ctx.fillStyle = '#DC2626';
        drawRoundedRect(ctx, px + plateW - 180, py + 38, 110, 52, 6);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillText('2026', px + plateW - 125, py + 72);

        // Shtat nomi tepada
        drawEmbossedText(ctx, regText || 'California', px + plateW / 2, py + 85, 'italic 800 84px "Inter", serif', headerColor, 'center', 600);

        // O'rtada katta raqam
        drawEmbossedText(ctx, mainText, px + plateW / 2, py + plateH * 0.54, '700 215px "Oswald", sans-serif', mainColor, 'center', plateW - 100);

        // Pastda shior
        drawEmbossedText(ctx, subText || 'DMV.CA.GOV', px + plateW / 2, py + plateH - 48, '700 34px "Inter", sans-serif', headerColor, 'center', plateW - 160);

        drawBolt(ctx, px + 125, py + 30);
        drawBolt(ctx, px + plateW - 125, py + 30);
        drawBolt(ctx, px + 125, py + plateH - 30);
        drawBolt(ctx, px + plateW - 125, py + plateH - 30);

    } else if (country === 'JP') {
        // Yaponiya 2:1 Nomer
        const jpColor = typeId === 'jp_com' ? '#FFFFFF' : '#0F4D2A';
        drawEmbossedText(ctx, regText || '品川 330', px + plateW / 2, py + 115, '700 96px "Inter", sans-serif', jpColor, 'center', 760);
        drawEmbossedText(ctx, subText || 'あ', px + 145, py + 335, '700 115px "Inter", sans-serif', jpColor, 'center');
        drawEmbossedText(ctx, mainText, px + plateW * 0.58, py + 335, '700 225px "Oswald", sans-serif', jpColor, 'center', 720);

        drawBolt(ctx, px + 135, py + 65, 16);
        drawBolt(ctx, px + plateW - 135, py + 65, 16);

    } else if (country === 'KR') {
        ctx.fillStyle = '#003399';
        ctx.fillRect(px, py, 160, plateH);
        drawFlag(ctx, 'KR', px + 32, py + 54, 96, 62);
        drawEmbossedText(ctx, 'KOR', px + 80, py + plateH - 70, '700 58px "Oswald", sans-serif', '#FFFFFF', 'center');

        drawEmbossedText(ctx, mainText, px + 160 + (plateW - 160) * 0.5, py + plateH * 0.52, '700 198px "Oswald", sans-serif', textFill, 'center', 1180);
        drawBolt(ctx, px + 225, py + plateH / 2);
        drawBolt(ctx, px + plateW - 60, py + plateH / 2);

    } else if (country === 'CN') {
        const cnFull = `${regText || '京A'} • ${mainText}`;
        drawEmbossedText(ctx, cnFull, px + plateW / 2, py + plateH * 0.52, '700 198px "Oswald", sans-serif', textFill, 'center', plateW - 120);
        drawBolt(ctx, px + 220, py + 42);
        drawBolt(ctx, px + plateW - 220, py + 42);
        drawBolt(ctx, px + 220, py + plateH - 42);
        drawBolt(ctx, px + plateW - 220, py + plateH - 42);
    }

    // 3. TASHQI BO'RTMA CHEGARA CHIZIG'I (STAMPED RIM)
    ctx.strokeStyle = borderFill;
    ctx.lineWidth = 12;
    drawRoundedRect(ctx, px + 10, py + 10, plateW - 20, plateH - 20, 14);
    ctx.stroke();

    // 4. METALL NUR VA CHANG/GARD EFFEKTI
    const glossPct = parseInt(document.getElementById('glossSlider').value, 10) / 100;
    if (glossPct > 0.05) {
        const sheen = ctx.createLinearGradient(px, py, px + plateW * 0.75, py + plateH);
        sheen.addColorStop(0, `rgba(255,255,255,${0.26 * glossPct})`);
        sheen.addColorStop(0.45, 'rgba(255,255,255,0)');
        sheen.addColorStop(0.55, `rgba(255,255,255,${0.12 * glossPct})`);
        sheen.addColorStop(1, 'rgba(0,0,0,0.12)');
        ctx.fillStyle = sheen;
        ctx.fillRect(px, py, plateW, plateH);
    }

    const dirtPct = parseInt(document.getElementById('dirtSlider').value, 10) / 100;
    if (dirtPct > 0.02) {
        const dirtGrad = ctx.createRadialGradient(px + plateW / 2, py + plateH / 2, plateH * 0.2, px + plateW / 2, py + plateH / 2, plateW * 0.65);
        dirtGrad.addColorStop(0, `rgba(60, 48, 35, ${dirtPct * 0.15})`);
        dirtGrad.addColorStop(1, `rgba(42, 34, 24, ${dirtPct * 0.55})`);
        ctx.fillStyle = dirtGrad;
        ctx.fillRect(px, py, plateW, plateH);
    }

    ctx.restore();

    document.getElementById('plateSpecInfo').textContent =
        isUSRatio ? `STANDART: 300 × 150 MM (${canvas.width}×${canvas.height} PX)` : `STANDART: 520 × 112 MM (${canvas.width}×${canvas.height} PX)`;
}

// ==================== DAVLAT VA SERIYA ALMASHGANDA YANGILASH ====================
const countrySelect = document.getElementById('countrySelect');
const plateTypeSelect = document.getElementById('plateTypeSelect');
const regionPresetSelect = document.getElementById('regionPresetSelect');

function populateCountryOptions(countryCode) {
    const cfg = COUNTRY_CONFIGS[countryCode];
    if (!cfg) return;

    // Turlarni to'ldirish
    plateTypeSelect.innerHTML = cfg.types
        .map(t => `<option value="${t.id}">${t.name}</option>`)
        .join('');

    // Hududlarni to'ldirish
    regionPresetSelect.innerHTML = cfg.regions
        .map(r => `<option value="${r.code}">${r.name}</option>`)
        .join('');

    applySelectedTypeDefaults();

    // Tezkor tugmalarni aktivlashtirish
    document.querySelectorAll('#quickCountryPills .pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.c === countryCode);
    });
}

function applySelectedTypeDefaults() {
    const country = countrySelect.value;
    const cfg = COUNTRY_CONFIGS[country];
    const selectedType = cfg.types.find(t => t.id === plateTypeSelect.value) || cfg.types[0];

    document.getElementById('inpRegion').value = selectedType.reg;
    document.getElementById('inpMain').value = selectedType.main;
    document.getElementById('inpSub').value = selectedType.sub;
    renderPlate();
}

countrySelect.addEventListener('change', () => populateCountryOptions(countrySelect.value));
plateTypeSelect.addEventListener('change', applySelectedTypeDefaults);
regionPresetSelect.addEventListener('change', () => {
    document.getElementById('inpRegion').value = regionPresetSelect.value;
    renderPlate();
});

document.querySelectorAll('#quickCountryPills .pill').forEach(btn => {
    btn.addEventListener('click', () => {
        countrySelect.value = btn.dataset.c;
        populateCountryOptions(btn.dataset.c);
    });
});

// Inputlar va Slayderlar
['inpRegion', 'inpMain', 'inpSub', 'inpHolder'].forEach(id => {
    document.getElementById(id).addEventListener('input', renderPlate);
});

document.getElementById('embossSlider').addEventListener('input', e => {
    document.getElementById('embossVal').textContent = e.target.value + '%';
    renderPlate();
});
document.getElementById('glossSlider').addEventListener('input', e => {

    renderPlate();
});
document.getElementById('dirtSlider').addEventListener('input', e => {
    document.getElementById('dirtVal').textContent = e.target.value + '%';
    renderPlate();
});

// VIP va Tasodifiy nomer generatorlari
const LETTERS = ['A', 'B', 'C', 'E', 'H', 'K', 'M', 'O', 'P', 'T', 'X', 'Z'];
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateFormattedNumber(vipDigits) {
    const c = countrySelect.value;
    const L1 = pick(LETTERS), L2 = pick(LETTERS), L3 = pick(LETTERS);
    const d3 = vipDigits || String(Math.floor(100 + Math.random() * 900));

    if (c === 'UZ') {
        if (plateTypeSelect.value === 'uz_corp') {
            document.getElementById('inpMain').value = `${d3} ${L1}${L1}${L1}`;
        } else {
            document.getElementById('inpMain').value = `${L1} ${d3} ${L2}${L2}`;
        }
    } else if (c === 'RU') {
        document.getElementById('inpMain').value = `${L1} ${d3} ${L1}${L1}`;
    } else if (c === 'KZ' || c === 'KG') {
        document.getElementById('inpMain').value = `${d3} ${L1}${L1}${L1}`;
    } else if (c === 'UAE') {
        document.getElementById('inpMain').value = vipDigits ? `${vipDigits}77` : String(Math.floor(10000 + Math.random() * 89999));
    } else if (c === 'DE') {
        document.getElementById('inpMain').value = `${L1}${L2} ${d3}7`;
    } else {
        document.getElementById('inpMain').value = `${L1}${L2} ${d3}`;
    }
    renderPlate();
}

document.getElementById('vip777Btn').addEventListener('click', () => generateFormattedNumber('777'));
document.getElementById('vip001Btn').addEventListener('click', () => generateFormattedNumber('001'));
document.getElementById('randomBtn').addEventListener('click', () => generateFormattedNumber(null));

// ==================== PNG VA JPG EXPORT ====================
function exportPlateImage(format) {
    renderPlate();
    const c = countrySelect.value;
    const cleanMain = (document.getElementById('inpMain').value || 'PLATE').replace(/\s+/g, '_');

    if (format === 'png') {
        const dataUrl = canvas.toDataURL('image/png');
        triggerDownload(dataUrl, `IT_SHAKH_${c}_${cleanMain}.png`);
        document.getElementById('statusMsg').textContent = '✓ Yuqori sifatli shaffof .PNG fayl yuklab olindi!';
    } else {
        // JPG uchun orqasiga to'q studiovi fon qo'shamiz
        const jpgCanvas = document.createElement('canvas');
        jpgCanvas.width = canvas.width;
        jpgCanvas.height = canvas.height;
        const jCtx = jpgCanvas.getContext('2d');
        jCtx.fillStyle = '#070b14';
        jCtx.fillRect(0, 0, jpgCanvas.width, jpgCanvas.height);
        jCtx.drawImage(canvas, 0, 0);

        const dataUrl = jpgCanvas.toDataURL('image/jpeg', 0.96);
        triggerDownload(dataUrl, `IT_SHAKH_${c}_${cleanMain}.jpg`);
        document.getElementById('statusMsg').textContent = '✓ Yuqori sifatli .JPG fayl yuklab olindi!';
    }
}

function triggerDownload(url, filename) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
}

document.getElementById('downloadPngBtn').addEventListener('click', () => exportPlateImage('png'));
document.getElementById('downloadJpgBtn').addEventListener('click', () => exportPlateImage('jpg'));

// Fontlar yuklangach qayta chizish
document.fonts.ready.then(() => {
    populateCountryOptions('UZ');
});
populateCountryOptions('UZ');
</script>
