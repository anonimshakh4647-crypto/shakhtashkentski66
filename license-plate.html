            --border: rgba(56, 189, 248, 0.26);

        body.night-mode {
            --bg: #000000;
            --accent: #00ff41;
            --glow: 0 0 35px rgba(0, 255, 65, 0.65);
            --text-color: #00ff41;
            --card-bg: rgba(0, 20, 0, 0.86);
            --border: rgba(0, 255, 65, 0.32);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text-color);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background 0.35s, color 0.35s;
        }
        header {
            padding: 13px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(12px);
            background: rgba(4, 6, 11, 0.92);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .back-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid var(--border);
            color: var(--accent);
            padding: 8px 14px;
            border-radius: 10px;
            text-decoration: none;
            font: 700 11px monospace;
            letter-spacing: 1px;
            transition: 0.25s;
        }
        .back-btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: var(--glow);
        }
        .logo-text {
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent);
            font-size: 14px;
            text-shadow: var(--glow);
        }
        .mode-toggle {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 800;
            font-size: 10px;
            letter-spacing: 1px;
        }

        /* WORKSPACE */
        .workspace {
            max-width: 1500px;
            margin: 0 auto;
            padding: 18px;
            display: grid;
            grid-template-columns: 420px 1fr;
            gap: 20px;
            min-height: calc(100vh - 64px);
        }
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 13px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.55);
        }
        .panel-title {
            font: 700 11px monospace;
            color: var(--accent);
            letter-spacing: 2px;
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin: 0;
        }
        .control-box {
            display: flex;
            flex-direction: column;
            gap: 9px;
            padding: 12px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.36);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .field-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field-grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .field-grid-3 {
            display: grid;
            grid-template-columns: 0.9fr 1.4fr 0.8fr;
            gap: 8px;
        }
        label {
            font: 700 10px monospace;
            color: #94a3b8;
            letter-spacing: 1px;
            display: flex;
            justify-content: space-between;
        }
        label b { color: var(--accent); }
        select, input[type="text"] {
            width: 100%;
            background: #07101e;
            color: #fff;
            border: 1px solid var(--border);
            padding: 9px 11px;
            border-radius: 9px;
            font: 700 12px 'Inter', monospace;
            outline: none;
            transition: 0.2s;
        }
        input[type="text"].upper { text-transform: uppercase; }
        select:focus, input[type="text"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 14px rgba(56, 189, 248, 0.3);
        }
        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .btn {
            background: rgba(7, 16, 28, 0.92);
            color: var(--text-color);
            border: 1px solid var(--border);
            padding: 9px 8px;
            border-radius: 9px;
            font: 700 10px monospace;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.22);
        }
        .btn.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }
        .btn-export {
            background: var(--accent);
            color: #001018;
            border: none;
            padding: 13px;
            font-size: 11px;
            font-weight: 800;
            box-shadow: 0 0 22px rgba(56, 189, 248, 0.35);
        }
        .btn-export:hover {
            opacity: 0.92;
            color: #000;
            transform: translateY(-1px);
        }

        /* STAGE PANEL */
        .stage-panel {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 600px;
        }
        .stage-toolbar {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(2, 6, 12, 0.9);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .region-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(56, 189, 248, 0.2);
            color: #94a3b8;
            padding: 5px 10px;
            border-radius: 7px;
            font: 700 10px monospace;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: rgba(56, 189, 248, 0.18);
            color: var(--accent);
            border-color: var(--accent);
        }
        .country-pills {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: thin;
        }
        .pill {
            background: rgba(7, 15, 28, 0.9);
            border: 1px solid var(--border);
            color: #e2e8f0;
            padding: 5px 10px;
            border-radius: 8px;
            font: 700 10px 'Inter', sans-serif;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }
        .pill img {
            width: 18px;
            height: 12px;
            object-fit: cover;
            border-radius: 2px;
        }
        .pill:hover, .pill.active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;

            background-color: #060a12;

</head>

];

// ==================== HAQIQIY BAYROQ RASMLARI LOADER (CORS-SAFE) ====================
const flagCache = {};
function getFlagImage(isoCode, onLoadCallback) {
    if (!isoCode) return null;
    const key = isoCode.toLowerCase();
    if (flagCache[key]) {
        return flagCache[key].complete ? flagCache[key] : null;
    }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
        if (onLoadCallback) onLoadCallback();
    };
    img.src = `https://flagcdn.com/w320/${key}.png`;
    flagCache[key] = img;
    return null;
}

// ==================== 3M HONEYCOMB RETRO-REFLECTIVE PATTERN ====================
let honeycombPatternCanvas = null;
function getHoneycombPattern() {
    if (honeycombPatternCanvas) return honeycombPatternCanvas;
    const pc = document.createElement('canvas');
    pc.width = 28;
    pc.height = 16;
    const pctx = pc.getContext('2d');

    pctx.strokeStyle = 'rgba(130, 145, 165, 0.22)';
    pctx.lineWidth = 0.9;
    // Asalari uyasi (Geksagonal mikro-prizma to'ri)
    pctx.beginPath();
    pctx.moveTo(0, 8); pctx.lineTo(7, 0); pctx.lineTo(14, 0); pctx.lineTo(21, 8); pctx.lineTo(14, 16); pctx.lineTo(7, 16); pctx.closePath();
    pctx.moveTo(21, 8); pctx.lineTo(28, 8);
    pctx.stroke();

    pctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
    pctx.beginPath();
    pctx.arc(10, 4, 1.2, 0, Math.PI * 2);
    pctx.arc(24, 12, 1.2, 0, Math.PI * 2);
    pctx.fill();

    honeycombPatternCanvas = pc;
    return pc;
}

// ==================== GLOBAL HOLAT ====================
let showBolts = true;
let showHolo = true;
let showHolder = true;
let isSquareMode = false;
let activeContinent = 'ALL';

const canvas = document.getElementById('plateCanvas');
const ctx = canvas.getContext('2d');

function drawRoundedRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// 5 qirrali haqiqiy yulduz chizish (EU bayrog'i uchun)
function drawFivePointStar(ctx, cx, cy, outerR, innerR) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = (i * 36 - 90) * (Math.PI / 180);
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
}

function drawEUStarsCircle(ctx, cx, cy, ringRadius) {
    ctx.save();
    ctx.fillStyle = '#FFCC00';
    for (let i = 0; i < 12; i++) {
        const ang = (i * 30 - 90) * (Math.PI / 180);
        drawFivePointStar(ctx, cx + Math.cos(ang) * ringRadius, cy + Math.sin(ang) * ringRadius, 5.2, 2.2);
    }
    ctx.restore();
}

// Bayroqni chizish (CDN rasm + O'zbekiston uchun yuqori aniqlikdagi vektor fallback)
function drawOfficialFlag(ctx, isoCode, x, y, w, h) {
    ctx.save();
    drawRoundedRect(ctx, x, y, w, h, 3);
    ctx.clip();

    const img = getFlagImage(isoCode, () => renderPlate());
    if (img && img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, w, h);
    } else {
        // Offline / yuklanish vaqtidagi tezkor vektor bayroq
        ctx.fillStyle = '#0099B5';
        ctx.fillRect(x, y, w, h * 0.32);
        ctx.fillStyle = '#CE1126';
        ctx.fillRect(x, y + h * 0.32, w, h * 0.04);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x, y + h * 0.36, w, h * 0.28);
        ctx.fillStyle = '#CE1126';
        ctx.fillRect(x, y + h * 0.64, w, h * 0.04);
        ctx.fillStyle = '#1EB53A';
        ctx.fillRect(x, y + h * 0.68, w, h * 0.32);
    }

    ctx.strokeStyle = 'rgba(0, 0, 0, 0.45)';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);
    ctx.restore();
}

// ==================== HAQIQIY 3D QOLIPLANGAN SHTAMP HARFLAR (STAMPED METAL EMBOSS) ====================
function drawStampedText(ctx, text, x, y, fontSize, fillColor, align = 'center', maxWidth = null, fontFamily = '"PlateDIN", "Barlow Condensed", "Archivo Narrow", sans-serif') {
    if (!text) return;
    const embossPct = parseInt(document.getElementById('embossSlider').value, 10) / 100;
    ctx.save();
    ctx.font = `700 ${fontSize}px ${fontFamily}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';

    if (embossPct > 0.05) {
        // 1. Alyuminiy bukilgan joydagi yumshoq chuqur soya
        ctx.save();
        ctx.shadowColor = `rgba(0, 0, 0, ${0.42 * embossPct})`;
        ctx.shadowBlur = 6 * embossPct;
        ctx.shadowOffsetX = 3.5 * embossPct;
        ctx.shadowOffsetY = 4.5 * embossPct;
        ctx.fillStyle = fillColor;
        if (maxWidth) ctx.fillText(text, x, y, maxWidth);
        else ctx.fillText(text, x, y);
        ctx.restore();

        // 2. Yuqori chap metall qirrasi yaltirashi (Specular Bevel)
        ctx.fillStyle = `rgba(255, 255, 255, ${0.78 * embossPct})`;
        const bOff = 2.4 * embossPct;
        if (maxWidth) ctx.fillText(text, x - bOff, y - bOff, maxWidth);
        else ctx.fillText(text, x - bOff, y - bOff);

        // 3. Pastki o'ng metall qirrasi soyasi
        ctx.fillStyle = `rgba(0, 0, 0, ${0.55 * embossPct})`;
        if (maxWidth) ctx.fillText(text, x + bOff * 1.1, y + bOff * 1.2, maxWidth);
        else ctx.fillText(text, x + bOff * 1.1, y + bOff * 1.2);
    }

    // 4. Asosiy bo'yoq qatlami (Hot-stamped foil)
    ctx.fillStyle = fillColor;
    if (maxWidth) ctx.fillText(text, x, y, maxWidth);
    else ctx.fillText(text, x, y);

    // 5. Bo'yoq ustidagi ichki mikro-yorug'lik chizig'i (Shtamp realistik ko'rinishi uchun)
    if (embossPct > 0.25) {
        ctx.strokeStyle = fillColor === '#FFFFFF' ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.22)';
        ctx.lineWidth = Math.max(1, fontSize * 0.008);
        if (maxWidth) ctx.strokeText(text, x - 0.6, y - 0.6, maxWidth);
        else ctx.strokeText(text, x - 0.6, y - 0.6);
    }

    ctx.restore();
}

// Rossiya GOST standarti uchun (Harflar kichikroq, raqamlar kattaroq!)
function drawRussianGOSTSequence(ctx, text, centerX, centerY, digitSize, color) {
    const tokens = text.trim().split(/\s+/);
    // Agar standart "A 777 AA" ko'rinishida bo'lsa, harflarni 74% balandlikda chizamiz
    ctx.save();
    const letterSize = Math.round(digitSize * 0.72);
    const fontFam = '"PlateDIN", "Barlow Condensed", sans-serif';

    // Har bir belgini o'lchab umumiy kenglikni topamiz
    const chars = text.replace(/\s+/g, '');
    const items = [];
    let totalW = 0;

    for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        const isDigit = /[0-9]/.test(ch);
        const fSize = isDigit ? digitSize : letterSize;
        ctx.font = `700 ${fSize}px ${fontFam}`;
        const w = ctx.measureText(ch).width;
        const gap = i > 0 ? ((/[0-9]/.test(chars[i - 1]) !== isDigit) ? 26 : 12) : 0;
        items.push({ ch, isDigit, fSize, w, gap });
        totalW += w + gap;
    }

    let curX = centerX - totalW / 2;
    items.forEach(item => {
        curX += item.gap;
        // Harflar pastki chiziq bo'ylab raqamlar bilan tekislanadi
        const yOffset = item.isDigit ? 0 : (digitSize - item.fSize) * 0.30;
        drawStampedText(ctx, item.ch, curX + item.w / 2, centerY + yOffset, item.fSize, color, 'center');
        curX += item.w;
    });
    ctx.restore();
}

// Haqiqiy 3D Murvat (Bolt / Washer)
function drawRealisticBolt(ctx, cx, cy, r = 11) {
    if (!showBolts) return;
    ctx.save();
    // Soya
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath();
    ctx.arc(cx + 2, cy + 3, r + 2, 0, Math.PI * 2);
    ctx.fill();

    // Metall shayba (Washer)
    const wGrad = ctx.createLinearGradient(cx - r, cy - r, cx + r, cy + r);
    wGrad.addColorStop(0, '#e2e8f0');
    wGrad.addColorStop(0.5, '#94a3b8');
    wGrad.addColorStop(1, '#334155');
    ctx.fillStyle = wGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
    ctx.fill();

    // Olti burchakli murvat boshi (Hex bolt head)
    const bGrad = ctx.createRadialGradient(cx - 2, cy - 2, 1, cx, cy, r);
    bGrad.addColorStop(0, '#ffffff');
    bGrad.addColorStop(0.6, '#cbd5e1');
    bGrad.addColorStop(1, '#475569');
    ctx.fillStyle = bGrad;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
        const ang = (i * 60) * (Math.PI / 180);
        const vx = cx + Math.cos(ang) * (r * 0.85);
        const vy = cy + Math.sin(ang) * (r * 0.85);
        if (i === 0) ctx.moveTo(vx, vy);
        else ctx.lineTo(vx, vy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    ctx.restore();
}

// Lazerli himoya gologramma doirasi (O'z DSt 640:2014 dagi "UZ" lazer muhrlari)
function drawLaserSeal(ctx, cx, cy, codeText = 'UZ') {
    if (!showHolo) return;
    ctx.save();
    const grad = ctx.createLinearGradient(cx - 12, cy - 12, cx + 12, cy + 12);
    grad.addColorStop(0, 'rgba(148, 163, 184, 0.32)');
    grad.addColorStop(0.5, 'rgba(56, 189, 248, 0.25)');
    grad.addColorStop(1, 'rgba(148, 163, 184, 0.32)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, 13, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(100, 116, 139, 0.35)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 2]);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = 'rgba(71, 85, 105, 0.55)';
    ctx.font = '700 8px "Inter", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(codeText, cx, cy);
    ctx.restore();
}

// Bo'rtma vertikal ajratuvchi chiziq
function drawStampedDivider(ctx, x, y, h, color) {
    const embossPct = parseInt(document.getElementById('embossSlider').value, 10) / 100;
    ctx.save();
    if (embossPct > 0.1) {
        ctx.fillStyle = `rgba(255, 255, 255, ${0.7 * embossPct})`;
        ctx.fillRect(x - 6, y, 3, h);
        ctx.fillStyle = `rgba(0, 0, 0, ${0.45 * embossPct})`;
        ctx.fillRect(x + 4, y + 2, 4, h);
    }
    ctx.fillStyle = color;
    drawRoundedRect(ctx, x - 4.5, y, 9, h, 4);
    ctx.fill();
    ctx.restore();
}

// ==================== ASOSIY RENDER FUNKSIYASI ====================
function renderPlate() {
    const cCode = document.getElementById('countrySelect').value || 'UZ';
    const cObj = WORLD_COUNTRIES.find(c => c.code === cCode) || WORLD_COUNTRIES[0];
    const typeId = document.getElementById('plateTypeSelect').value;

    const regText = (document.getElementById('inpRegion').value || '').toUpperCase().trim();
    const mainText = (document.getElementById('inpMain').value || '').toUpperCase().trim();
    const subText = (document.getElementById('inpSub').value || cObj.vCode || '').toUpperCase().trim();
    const holderText = (document.getElementById('inpHolder').value || '').trim();

    const isUSFormat = (cObj.style === 'us' || cObj.style === 'jp' || isSquareMode);

    // Haqiqiy proporsiya: 520 x 112 mm -> 1560 x 336 px (yoki Kvadrat/US: 960 x 480 px)
    const plateW = isUSFormat ? 980 : 1560;
    const plateH = isUSFormat ? 490 : 336;
    const holderH = showHolder ? 48 : 0;
    const pad = 28;

    canvas.width = plateW + pad * 2;
    canvas.height = plateH + holderH + pad * 2;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const px = pad;
    const py = pad;

    // 1. AVTOSALON PLASTIK RAMKASI (3D Qisqichlari va Xrom yozuvi bilan)
    if (showHolder) {
        ctx.save();
        const fGrad = ctx.createLinearGradient(px, py, px, py + plateH + holderH);
        fGrad.addColorStop(0, '#222731');
        fGrad.addColorStop(0.5, '#12151c');
        fGrad.addColorStop(1, '#080a0f');
        ctx.fillStyle = fGrad;
        drawRoundedRect(ctx, px - 14, py - 12, plateW + 28, plateH + holderH + 20, 22);
        ctx.fill();

        // Ichki chuqurcha soyasi
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Pastki yozuv paneli
        ctx.fillStyle = '#05070b';
        drawRoundedRect(ctx, px + 20, py + plateH + 6, plateW - 40, holderH - 8, 8);
        ctx.fill();

        // Xrom / Firuza yozuv
        const txtGrad = ctx.createLinearGradient(px, py + plateH, px, py + plateH + holderH);
        txtGrad.addColorStop(0, '#ffffff');
        txtGrad.addColorStop(0.5, '#38bdf8');
        txtGrad.addColorStop(1, '#cbd5e1');
        ctx.fillStyle = txtGrad;
        ctx.font = '800 21px "Inter", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.letterSpacing = '3px';
        ctx.fillText(holderText, px + plateW / 2, py + plateH + holderH * 0.52);
        ctx.restore();
    }

    // 2. ALYUMINIY PLASTINA ASOSI
    ctx.save();
    drawRoundedRect(ctx, px, py, plateW, plateH, 18);
    ctx.clip();

    // Rang sxemalari
    let bgFill = '#F2F4F7';
    let textFill = '#111317';
    let rimFill = '#111317';

    if (typeId === 'uz_cmd' || typeId === 'uz_dip' || typeId === 'uz_tech') {
        bgFill = '#0B7A3E'; textFill = '#FFFFFF'; rimFill = '#FFFFFF';
    } else if (typeId === 'uz_un' || typeId === 'ru_pol' || cObj.style === 'cn' && typeId !== 'cn_ev') {
        bgFill = '#0D47A1'; textFill = '#FFFFFF'; rimFill = '#FFFFFF';
    } else if (typeId === 'uz_for_h' || typeId === 'uz_for_m' || typeId === 'ru_tax' || cObj.style === 'nl' || typeId === 'jp_kei') {
        bgFill = '#F5B800'; textFill = '#111317'; rimFill = '#111317';
    } else if (typeId === 'ru_dip') {
        bgFill = '#B71C1C'; textFill = '#FFFFFF'; rimFill = '#FFFFFF';
    } else if (typeId === 'jp_com') {
        bgFill = '#0E4B28'; textFill = '#FFFFFF'; rimFill = '#FFFFFF';
    } else if (cObj.style === 'be') {
        bgFill = '#F4F5F7'; textFill = '#9B111E'; rimFill = '#9B111E';
    } else if (typeId === 'us_ny') {
        bgFill = '#F5B014'; textFill = '#0A2246'; rimFill = '#0A2246';
    }

    // Asosiy fon
    const baseGrad = ctx.createLinearGradient(px, py, px, py + plateH);
    baseGrad.addColorStop(0, bgFill);
    baseGrad.addColorStop(0.5, bgFill === '#F2F4F7' ? '#FFFFFF' : bgFill);
    baseGrad.addColorStop(1, bgFill === '#F2F4F7' ? '#E2E7EE' : bgFill);
    ctx.fillStyle = baseGrad;
    ctx.fillRect(px, py, plateW, plateH);

    // Xitoy EV yashil gradient
    if (typeId === 'cn_ev') {
        const evGrad = ctx.createLinearGradient(px, py, px, py + plateH);
        evGrad.addColorStop(0, '#F8FAFC');
        evGrad.addColorStop(0.38, '#86EFAC');
        evGrad.addColorStop(1, '#15803D');
        ctx.fillStyle = evGrad;
        ctx.fillRect(px, py, plateW, plateH);
    }

    // 3. 3M RETRO-REFLECTIVE ASALARI UYASI (HONEYCOMB TEXTURE)
    const honeyPct = parseInt(document.getElementById('honeySlider').value, 10) / 100;
    if (honeyPct > 0.05) {
        ctx.save();
        ctx.globalAlpha = honeyPct * 0.55;
        const pat = ctx.createPattern(getHoneycombPattern(), 'repeat');
        ctx.fillStyle = pat;
        ctx.fillRect(px, py, plateW, plateH);
        ctx.restore();
    }

    // ==================== 4. DAVLATLAR BO'YICHA HAQIQIY PROPORSIONAL CHIZISH ====================

    // A) KVADRAT (2-QATORLI) O'ZBEKISTON / MDH NOMERI
    if (isSquareMode && cObj.style !== 'us' && cObj.style !== 'jp') {
        // Tepada: Hudud (01) + Bayroq + UZ
        drawStampedText(ctx, regText || '01', px + 230, py + 135, 195, textFill, 'center');
        drawStampedDivider(ctx, px + 440, py + 22, 210, rimFill);
        drawOfficialFlag(ctx, cObj.iso, px + 520, py + 55, 155, 85);
        drawStampedText(ctx, subText || cObj.vCode, px + 780, py + 125, 115, cObj.code === 'UZ' ? '#0088A8' : textFill, 'center');

        // Gorizontal chiziq
        ctx.fillStyle = rimFill;
        ctx.fillRect(px + 18, py + 232, plateW - 36, 9);

        // Pastda: Asosiy raqam (A 777 AA)
        drawStampedText(ctx, mainText, px + plateW / 2, py + 365, 220, textFill, 'center', plateW - 90);
        drawRealisticBolt(ctx, px + 140, py + 52);
        drawRealisticBolt(ctx, px + plateW - 140, py + 52);

    } else if (cObj.style === 'uz') {
        // ==================== O'ZBEKISTON (O'z DSt 640:2014 ANIQ STANDARTI) ====================
        const noRegionTypes = ['uz_paa', 'uz_cmd', 'uz_dip', 'uz_tech', 'uz_un'];
        const hasRegionBox = !noRegionTypes.includes(typeId) && regText.length > 0;
        const divX = px + 318; // 520mm dan 106mm = 20.4%

        // Elektromobil bo'lsa chap bo'lma yashil bo'ladi
        if ((typeId === 'uz_ev' || typeId === 'uz_ev_c') && hasRegionBox) {
            ctx.fillStyle = '#0F9D58';
            ctx.fillRect(px + 14, py + 14, 304, plateH - 28);
        }

        // O'ng chekkadagi Bayroq + UZ ustuni (X = px + plateW - 145)
        const flagW = 104;
        const flagH = 54;
        const flagX = px + plateW - 142;
        const flagY = py + 52;

        drawOfficialFlag(ctx, 'uz', flagX, flagY, flagW, flagH);
        const uzCodeColor = (textFill === '#FFFFFF') ? '#FFFFFF' : '#0085AD';
        drawStampedText(ctx, subText || 'UZ', flagX + flagW / 2, py + plateH - 82, 84, uzCodeColor, 'center');

        if (hasRegionBox) {
            const regColor = (typeId === 'uz_ev' || typeId === 'uz_ev_c') ? '#FFFFFF' : textFill;
            drawStampedText(ctx, regText, px + 166, py + plateH * 0.51, 245, regColor, 'center', 250);
            drawStampedDivider(ctx, divX, py + 16, plateH - 32, rimFill);

            // Asosiy raqam markazi (divX va flagX o'rtasida)
            const mainCenterX = divX + (flagX - divX - 20) * 0.5;
            drawStampedText(ctx, mainText, mainCenterX, py + plateH * 0.51, 252, textFill, 'center', flagX - divX - 55);

            // Lazerli UZ gologramma muhrlari (haqiqiy joyida)
            drawLaserSeal(ctx, divX + 36, py + 58, 'UZ');
            drawLaserSeal(ctx, px + plateW - 185, py + 58, 'UZ');
            drawLaserSeal(ctx, divX + 36, py + plateH - 58, 'UZ');
        } else {
            // Hududsiz nomerlar (PAA 001, CMD 01 01, D 01 007, UN 0077)
            const mainCenterX = px + (flagX - px - 10) * 0.5;
            drawStampedText(ctx, mainText, mainCenterX, py + plateH * 0.51, 248, textFill, 'center', flagX - px - 80);
        }

        // Haqiqiy murvat joylari (chapda region yonida, o'ngda bayroq ustuni oldida)
        drawRealisticBolt(ctx, px + 44, py + plateH / 2);
        drawRealisticBolt(ctx, flagX - 26, py + plateH / 2);

    } else if (cObj.style === 'ru') {
        // ==================== ROSSIYA (GOST R 50577-93: KICHIK HARFLAR + KATTA RAQAMLAR) ====================
        const divX = px + plateW - 375;
        drawStampedDivider(ctx, divX, py + 16, plateH - 32, rimFill);

        // Chap/o'rtada GOST formatdagi raqam va harflar
        drawRussianGOSTSequence(ctx, mainText, px + (divX - px) * 0.51, py + plateH * 0.51, 255, textFill);

        // O'ng qutida: Tepada hudud kodi (777), pastda RUS + Bayroq
        drawStampedText(ctx, regText || '777', divX + 188, py + 118, 178, textFill, 'center', 310);
        drawStampedText(ctx, subText || 'RUS', divX + 115, py + plateH - 64, 68, textFill, 'center');
        drawOfficialFlag(ctx, 'ru', divX + 205, py + plateH - 92, 104, 56);

        drawLaserSeal(ctx, px + 95, py + 58, 'RUS');
        drawRealisticBolt(ctx, px + 46, py + plateH / 2);
        drawRealisticBolt(ctx, px + plateW - 44, py + plateH / 2);

    } else if (cObj.style === 'kz') {
        // ==================== QOZOG'ISTON (2012-2026 STANDARTI) ====================
        const divX = px + plateW - 310;
        drawStampedDivider(ctx, divX, py + 16, plateH - 32, rimFill);

        // Chapda KZ bayrog'i va KZ yozuvi
        drawOfficialFlag(ctx, cObj.iso, px + 44, py + 52, 112, 62);
        drawStampedText(ctx, subText || cObj.vCode, px + 100, py + plateH - 80, 82, '#0088B5', 'center');

        // O'rtada raqam (777 AAA)
        const centerMain = px + 170 + (divX - (px + 170)) * 0.5;
        drawStampedText(ctx, mainText, centerMain, py + plateH * 0.51, 248, textFill, 'center', divX - px - 210);

        // O'ngda hudud kodi (01, 02...)
        drawStampedText(ctx, regText || '01', divX + 155, py + plateH * 0.51, 238, textFill, 'center', 250);

// ==================== UI VA FILTRLAR BOSHQARUVI ====================
const countrySelect = document.getElementById('countrySelect');
const plateTypeSelect = document.getElementById('plateTypeSelect');
const regionPresetSelect = document.getElementById('regionPresetSelect');
const countrySearch = document.getElementById('countrySearch');
const quickPills = document.getElementById('quickPills');

function renderCountryList() {
    const query = (countrySearch.value || '').toLowerCase().trim();
    const prevVal = countrySelect.value || 'UZ';

    const filtered = WORLD_COUNTRIES.filter(c => {
        const matchCont = activeContinent === 'ALL' || c.cont === activeContinent;
        const matchText = !query || c.name.toLowerCase().includes(query) || c.code.toLowerCase().includes(query) || c.vCode.toLowerCase().includes(query);
        return matchCont && matchText;
    });

    document.getElementById('countryCountLbl').textContent = `${filtered.length} TA`;

    countrySelect.innerHTML = filtered
        .map(c => `<option value="${c.code}">[${c.code}] ${c.name}</option>`)
        .join('');

    if (filtered.some(c => c.code === prevVal)) {
        countrySelect.value = prevVal;
    } else if (filtered.length > 0) {
        countrySelect.value = filtered[0].code;
    }

    // Yuqori bayroqli tezkor tugmalar
    quickPills.innerHTML = filtered.slice(0, 28).map(c => `
        <button class="pill ${c.code === countrySelect.value ? 'active' : ''}" data-code="${c.code}" type="button">
            <img src="https://flagcdn.com/w40/${c.iso}.png" alt="${c.code}">
            <span>${c.code}</span>
        </button>
    `).join('');

    quickPills.querySelectorAll('.pill').forEach(btn => {
        btn.addEventListener('click', () => {
            countrySelect.value = btn.dataset.code;
            onCountryChanged();
        });
    });

    onCountryChanged();
}

function onCountryChanged() {
    const code = countrySelect.value;
    const cObj = WORLD_COUNTRIES.find(c => c.code === code) || WORLD_COUNTRIES[0];

    // Nomer turlari (Seriyalar)
    if (code === 'UZ') {
        plateTypeSelect.innerHTML = UZ_PLATE_TYPES.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    } else if (COUNTRY_SUBTYPES[code]) {
        plateTypeSelect.innerHTML = COUNTRY_SUBTYPES[code].map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    } else {
        plateTypeSelect.innerHTML = `<option value="std">Standart (${cObj.defReg ? cObj.defReg + ' | ' : ''}${cObj.defMain})</option>`;
    }

    // Hudud / Viloyat ro'yxati
    if (code === 'UZ') {
        document.getElementById('regionPresetRow').style.display = 'flex';
        regionPresetSelect.innerHTML = UZ_ALL_REGIONS.map(r => `<option value="${r.code}">${r.name}</option>`).join('');
    } else if (code === 'RU') {
        document.getElementById('regionPresetRow').style.display = 'flex';
        regionPresetSelect.innerHTML = RU_REGIONS.map(r => `<option value="${r.code}">${r.name}</option>`).join('');
    } else if (code === 'KZ') {
        document.getElementById('regionPresetRow').style.display = 'flex';
        regionPresetSelect.innerHTML = KZ_REGIONS.map(r => `<option value="${r.code}">${r.name}</option>`).join('');
    } else {
        document.getElementById('regionPresetRow').style.display = 'none';
    }

    quickPills.querySelectorAll('.pill').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.code === code);
    });

    applyTypeDefaults();
}

function applyTypeDefaults() {
    const code = countrySelect.value;
    const cObj = WORLD_COUNTRIES.find(c => c.code === code) || WORLD_COUNTRIES[0];
    const typeId = plateTypeSelect.value;

    let list = code === 'UZ' ? UZ_PLATE_TYPES : (COUNTRY_SUBTYPES[code] || []);
    const found = list.find(t => t.id === typeId);

    if (found) {
        document.getElementById('inpRegion').value = found.reg;
        document.getElementById('inpMain').value = found.main;
        document.getElementById('inpSub').value = found.sub;
    } else {
        document.getElementById('inpRegion').value = cObj.defReg;
        document.getElementById('inpMain').value = cObj.defMain;
        document.getElementById('inpSub').value = cObj.vCode;
    }

    getFlagImage(cObj.iso, () => renderPlate());
    renderPlate();
}

// VIP va Random tugmalar
const LETTERS = ['A', 'B', 'C', 'E', 'H', 'K', 'M', 'O', 'P', 'T', 'X', 'Z'];
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function generateCustomNumber(vipDigits) {
    const code = countrySelect.value;
    const L1 = pick(LETTERS), L2 = pick(LETTERS);
    const d3 = vipDigits || String(Math.floor(100 + Math.random() * 900));

    if (code === 'UZ') {
        if (plateTypeSelect.value === 'uz_corp') {
            document.getElementById('inpMain').value = `${d3} ${L1}${L1}${L1}`;
        } else {
            document.getElementById('inpMain').value = `${L1} ${d3} ${L2}${L2}`;
        }
    } else if (code === 'RU') {
        document.getElementById('inpMain').value = `${L1} ${d3} ${L1}${L1}`;
    } else if (code === 'KZ' || code === 'KG') {
        document.getElementById('inpMain').value = `${d3} ${L1}${L1}${L1}`;
    } else if (code === 'UAE') {
        document.getElementById('inpMain').value = vipDigits ? `${vipDigits}77` : String(Math.floor(10000 + Math.random() * 89999));
    } else {
        document.getElementById('inpMain').value = `${L1}${L2} ${d3}7`;
    }
    renderPlate();
}

document.getElementById('vip777Btn').addEventListener('click', () => generateCustomNumber('777'));

// ==================== PNG VA JPG YUKLAB OLISH ====================
function exportPlate(format) {
    renderPlate();
    const code = countrySelect.value;
    const cleanMain = (document.getElementById('inpMain').value || 'PLATE').replace(/\s+/g, '_');

    if (format === 'png') {
        const url = canvas.toDataURL('image/png');
        triggerDownload(url, `IT_SHAKH_${code}_${cleanMain}.png`);
        document.getElementById('statusMsg').textContent = '✓ Yuqori aniqlikdagi .PNG fayl muvaffaqiyatli yuklab olindi!';
    } else {
        const jCanvas = document.createElement('canvas');
        jCanvas.width = canvas.width;
        jCanvas.height = canvas.height;
        const jCtx = jCanvas.getContext('2d');
        jCtx.fillStyle = '#060a12';
        jCtx.fillRect(0, 0, jCanvas.width, jCanvas.height);
        jCtx.drawImage(canvas, 0, 0);
        const url = jCanvas.toDataURL('image/jpeg', 0.96);
        triggerDownload(url, `IT_SHAKH_${code}_${cleanMain}.jpg`);
        document.getElementById('statusMsg').textContent = '✓ Yuqori aniqlikdagi .JPG fayl muvaffaqiyatli yuklab olindi!';
    }
}

function triggerDownload(url, filename) {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
}

document.getElementById('downloadPngBtn').addEventListener('click', () => exportPlate('png'));
document.getElementById('downloadJpgBtn').addEventListener('click', () => exportPlate('jpg'));

document.fonts.ready.then(() => {
    renderCountryList();
});
renderCountryList();
</script>
