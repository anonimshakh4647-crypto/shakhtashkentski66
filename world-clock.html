<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World Clock | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>.clocks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.clock{padding:20px;border:1px solid rgba(56,189,248,.25);border-radius:14px;background:#050b14}.city{font-weight:800;color:var(--accent)}.time{font:800 30px monospace;margin:8px 0}.date{color:#9ca3af;font-size:12px}@media(max-width:650px){.clocks{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header><main><div class="eyebrow">// GLOBAL TIME ZONES</div><h1>WORLD CLOCK</h1><p class="intro">Dunyoning asosiy shaharlari vaqtini real vaqtda ko‘rsating.</p><section class="panel"><div id="clocks" class="clocks"></div></section></main><script>const cities=[['Tashkent','Asia/Tashkent'],['Dubai','Asia/Dubai'],['London','Europe/London'],['New York','America/New_York'],['Los Angeles','America/Los_Angeles'],['Tokyo','Asia/Tokyo'],['Singapore','Asia/Singapore'],['Sydney','Australia/Sydney'],['Berlin','Europe/Berlin'],['Seoul','Asia/Seoul']];const box=document.getElementById('clocks');box.innerHTML=cities.map((c,i)=>`<div class="clock"><div class="city">${c[0]}</div><div id="t${i}" class="time">--:--:--</div><div id="d${i}" class="date">---</div></div>`).join('');function tick(){const now=new Date();cities.forEach((c,i)=>{const o={timeZone:c[1],hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};const d={timeZone:c[1],weekday:'short',year:'numeric',month:'short',day:'2-digit'};document.getElementById('t'+i).textContent=new Intl.DateTimeFormat('en-GB',o).format(now);document.getElementById('d'+i).textContent=new Intl.DateTimeFormat('en-GB',d).format(now)})}tick();setInterval(tick,1000);</script></body></html>
