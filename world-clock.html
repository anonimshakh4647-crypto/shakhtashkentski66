<title>World Clock | IT SHAKH</title>

<style>
.clocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.clock{padding:18px;border:1px solid rgba(56,189,248,.25);border-radius:14px;background:#050b14;min-width:0;transition:.2s}
.clock:hover{border-color:rgba(56,189,248,.65);transform:translateY(-2px)}
.city{font-weight:800;color:var(--accent);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.country{color:#cbd5e1;font-size:12px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font:800 28px monospace;margin:10px 0 6px;letter-spacing:-1px}
.date{color:#9ca3af;font-size:12px}
.meta{color:#64748b;font-size:11px;margin-top:6px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.tools input,.tools select{flex:1 1 240px;min-width:180px;padding:12px 14px;border-radius:10px;border:1px solid rgba(56,189,248,.25);background:#07101c;color:#e5e7eb;outline:none}
.tools input:focus,.tools select:focus{border-color:rgba(56,189,248,.8)}
.count{color:#94a3b8;font-size:12px;margin:0 0 12px}
@media(max-width:950px){.clocks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:650px){.clocks{grid-template-columns:1fr}.time{font-size:30px}}
</style>
</head>

<header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header>

const box=document.getElementById('clocks'), search=document.getElementById('search'), continent=document.getElementById('continent'), count=document.getElementById('count');
let visible=[];
function filtered(){
 const q=search.value.trim().toLowerCase(), c=continent.value;
 return cities.filter(x=>(c==='all'||x[2]===c)&&(!q||x[0].toLowerCase().includes(q)||x[1].toLowerCase().includes(q)));
}
function render(){
 visible=filtered();
 count.textContent=`${visible.length} ta shahar / vaqt zonasi ko‘rsatilmoqda (jami ${cities.length} ta).`;
 box.innerHTML=visible.map((c,i)=>`<div class="clock"><div class="city">${c[1]}</div><div class="country">${c[0]}</div><div id="t${i}" class="time">--:--:--</div><div id="d${i}" class="date">---</div><div id="o${i}" class="meta">UTC --</div></div>`).join('');
 tick();
}
function offsetText(zone,now){
 const parts=new Intl.DateTimeFormat('en-US',{timeZone:zone,timeZoneName:'longOffset',hour:'2-digit'}).formatToParts(now);
 const p=parts.find(x=>x.type==='timeZoneName'); return p?p.value.replace('GMT','UTC'):'';
}
function tick(){
 const now=new Date();
 visible.forEach((c,i)=>{
  const time={timeZone:c[3],hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false};
  const date={timeZone:c[3],weekday:'short',year:'numeric',month:'short',day:'2-digit'};
  document.getElementById('t'+i).textContent=new Intl.DateTimeFormat('en-GB',time).format(now);
  document.getElementById('d'+i).textContent=new Intl.DateTimeFormat('en-GB',date).format(now);
  document.getElementById('o'+i).textContent=offsetText(c[3],now);
 });
}
search.addEventListener('input',render); continent.addEventListener('change',render); render(); setInterval(tick,1000);
