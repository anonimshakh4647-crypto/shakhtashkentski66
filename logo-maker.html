<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IT SHAKH — Logo Maker</title>
<style>
:root{--bg:#05070b;--panel:#0a0f18;--panel2:#0d1420;--line:#1b2a3d;--text:#eaf4ff;--muted:#7f91a7;--accent:#38bdf8;--accent2:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#10233b 0,#05070b 48%);color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;min-height:100vh}
button,input,select{font:inherit}.app{display:grid;grid-template-columns:290px minmax(400px,1fr) 300px;min-height:100vh}
.sidebar,.right{background:rgba(7,11,18,.92);border-color:var(--line);padding:18px;overflow:auto}.sidebar{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}
.brand{font-weight:900;letter-spacing:2px;color:var(--accent);margin-bottom:20px}.section{margin-bottom:22px}.label{font-size:10px;color:var(--muted);letter-spacing:1.7px;font-weight:800;margin-bottom:9px}
.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#0c1522;color:#cfe5f7;border-radius:9px;padding:9px 11px;cursor:pointer;font-size:12px}.btn:hover,.btn.active{border-color:var(--accent);color:#fff;box-shadow:0 0 16px #38bdf81c}.btn.primary{background:linear-gradient(135deg,var(--accent),#60a5fa);color:#00131e;border:0;font-weight:900}
input,select{width:100%;background:#070c13;border:1px solid var(--line);color:#eaf4ff;border-radius:8px;padding:10px;outline:none}input:focus,select:focus{border-color:var(--accent)}
.main{display:flex;flex-direction:column;min-width:0}.top{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.top-actions{display:flex;gap:7px}
.workspace{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;overflow:auto}.canvas-wrap{width:min(720px,82vw);aspect-ratio:1;background:#fff;position:relative;box-shadow:0 25px 80px #0008;border-radius:5px;overflow:hidden}
#canvas{width:100%;height:100%;display:block}.checker{background-color:#f8f8f8;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:13px}.tab{flex:1;padding:8px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}.tab.active{color:var(--accent);border-color:var(--accent)}
.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.swatch{height:30px;border-radius:6px;border:1px solid #ffffff22;cursor:pointer}.swatch.active{outline:2px solid var(--accent);outline-offset:1px}
.icon-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.icon{height:52px;border:1px solid var(--line);background:#0b1320;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:25px;cursor:pointer}.icon:hover{border-color:var(--accent)}
.preview-title{font-size:11px;color:var(--muted);letter-spacing:1.4px;margin:18px 0 8px}.mini-preview{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;align-items:center;justify-content:center;background:#fff;min-height:130px}.mini-preview.dark{background:#080b10}.mini-preview canvas{max-width:100%;height:auto}
.range{display:grid;grid-template-columns:1fr 48px;gap:8px;align-items:center}.range output{font-size:11px;color:var(--accent);text-align:right}
.layers{display:grid;gap:7px}.layer{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px}.layer span{flex:1}.layer button{border:0;background:transparent;color:#8fa2b7;cursor:pointer}
@media(max-width:1050px){.app{grid-template-columns:250px 1fr}.right{display:none}}
@media(max-width:720px){.app{display:block}.sidebar{display:none}.top{position:sticky;top:0;z-index:5;background:#070b12}.workspace{padding:15px}.canvas-wrap{width:92vw}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand">IT SHAKH / LOGO MAKER</div>
<div class="section"><div class="label">BRAND NAME</div><input id="name" value="YOUR BRAND" maxlength="24"></div>
<div class="section"><div class="label">TAGLINE</div><input id="tag" value="YOUR TAGLINE" maxlength="30"></div>
<div class="section"><div class="label">LOGO STYLE</div><div class="row" id="styles">
<button class="btn active" data-style="modern">Modern</button><button class="btn" data-style="minimal">Minimal</button><button class="btn" data-style="badge">Badge</button><button class="btn" data-style="tech">Tech</button><button class="btn" data-style="luxury">Luxury</button>
</div></div>
<div class="section"><div class="label">SYMBOL</div><div class="icon-grid" id="icons">
<div class="icon">◆</div><div class="icon">✦</div><div class="icon">⚡</div><div class="icon">⬢</div><div class="icon">◉</div><div class="icon">✚</div><div class="icon">★</div><div class="icon">▲</div><div class="icon">♜</div><div class="icon">∞</div><div class="icon">✧</div><div class="icon">◈</div>
</div></div>
<div class="section"><div class="label">LAYOUT</div><select id="layout"><option value="stack">Symbol + text</option><option value="side">Symbol left</option><option value="symbol">Symbol only</option><option value="text">Text only</option></select></div>
<div class="section"><div class="label">FONT</div><select id="font"><option value="Arial">Modern Sans</option><option value="Georgia">Elegant Serif</option><option value="monospace">Tech Mono</option><option value="Impact">Bold Display</option></select></div>
</aside>

<main class="main">
<header class="top"><strong>PROFESSIONAL LOGO STUDIO</strong><div class="top-actions"><button class="btn" id="undo">UNDO</button><button class="btn" id="redo">REDO</button><button class="btn" id="random">RANDOMIZE</button><button class="btn primary" id="download">EXPORT PNG</button></div></header>
<div class="workspace"><div class="canvas-wrap checker"><canvas id="canvas" width="1200" height="1200"></canvas></div></div>
</main>

<aside class="right">
<div class="tabs"><button class="tab active" data-tab="design">DESIGN</button><button class="tab" data-tab="color">COLOR</button><button class="tab" data-tab="layers">LAYERS</button></div>
<div id="design">
<div class="section"><div class="label">SYMBOL SIZE</div><div class="range"><input id="size" type="range" min="80" max="520" value="300"><output id="sizeOut">300</output></div></div>
<div class="section"><div class="label">LETTER SPACING</div><div class="range"><input id="spacing" type="range" min="-2" max="18" value="4"><output id="spacingOut">4</output></div></div>
<div class="section"><div class="label">CORNER RADIUS</div><div class="range"><input id="radius" type="range" min="0" max="180" value="80"><output id="radiusOut">80</output></div></div>
<div class="section"><div class="label">GLOW</div><div class="range"><input id="glow" type="range" min="0" max="40" value="0"><output id="glowOut">0</output></div></div>
</div>
<div id="color" style="display:none">
<div class="section"><div class="label">PRIMARY COLOR</div><input id="primary" type="color" value="#38bdf8"></div>
<div class="section"><div class="label">SECONDARY COLOR</div><input id="secondary" type="color" value="#8b5cf6"></div>
<div class="section"><div class="label">PALETTES</div><div class="palette">
<div class="swatch" style="background:linear-gradient(135deg,#38bdf8,#8b5cf6)" data-a="#38bdf8" data-b="#8b5cf6"></div>
<div class="swatch" style="background:linear-gradient(135deg,#111827,#f59e0b)" data-a="#111827" data-b="#f59e0b"></div>
<div class="swatch" style="background:linear-gradient(135deg,#ef4444,#f97316)" data-a="#ef4444" data-b="#f97316"></div>
<div class="swatch" style="background:linear-gradient(135deg,#10b981,#06b6d4)" data-a="#10b981" data-b="#06b6d4"></div>
<div class="swatch" style="background:linear-gradient(135deg,#ec4899,#8b5cf6)" data-a="#ec4899" data-b="#8b5cf6"></div>
</div></div>
<div class="section"><div class="label">BACKGROUND</div><div class="row"><button class="btn active" data-bg="transparent">Transparent</button><button class="btn" data-bg="#ffffff">White</button><button class="btn" data-bg="#080b10">Dark</button></div></div>
</div>
<div id="layers" style="display:none"><div class="layers"><div class="layer">◈ <span>Symbol</span><button>☰</button></div><div class="layer">T <span>Brand name</span><button>☰</button></div><div class="layer">A <span>Tagline</span><button>☰</button></div></div></div>
<div class="preview-title">BRAND PREVIEW</div><div class="mini-preview" id="preview"></div>
<div class="preview-title">EXPORT</div><div class="row"><button class="btn" id="png2">PNG 1200</button><button class="btn" id="png4">PNG 2400</button><button class="btn" id="svg">SVG</button></div>
</aside>
</div>

<script>
const c=document.getElementById('canvas'),x=c.getContext('2d'),state={style:'modern',symbol:'◆',layout:'stack',bg:'transparent',a:'#38bdf8',b:'#8b5cf6',font:'Arial',size:300,spacing:4,radius:80,glow:0};
const $=id=>document.getElementById(id);
function draw(ctx=c.getContext('2d'),w=1200,h=1200){
ctx.clearRect(0,0,w,h); if(state.bg!=='transparent'){ctx.fillStyle=state.bg;ctx.fillRect(0,0,w,h)}
const cx=w/2,cy=h/2,grad=ctx.createLinearGradient(300,300,900,900);grad.addColorStop(0,state.a);grad.addColorStop(1,state.b);
ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=grad;ctx.strokeStyle=grad;
if(state.glow){ctx.shadowColor=state.a;ctx.shadowBlur=state.glow}
let sym=state.symbol;
if(state.style==='badge'){ctx.beginPath();ctx.arc(cx,cy-55,230,0,Math.PI*2);ctx.lineWidth=18;ctx.stroke()}
if(state.style==='tech'){ctx.beginPath();ctx.arc(cx,cy-40,205,0,Math.PI*2);ctx.lineWidth=10;ctx.setLineDash([16,12]);ctx.stroke();ctx.setLineDash([])}
if(state.style==='minimal')ctx.globalAlpha=.9;
if(state.layout!=='text'){ctx.font=`900 ${state.size}px ${state.font}`;ctx.fillText(sym,state.layout==='side'?cx-190:cx, state.layout==='symbol'?cy:cy-170)}
ctx.shadowBlur=0;ctx.globalAlpha=1;
if(state.layout!=='symbol'){
ctx.font=`900 ${Math.min(120,Math.max(55,1200/(Math.max(6,$('name').value.length)*.75)))}px ${state.font}`;
ctx.letterSpacing=state.spacing+'px';ctx.fillStyle=grad;ctx.fillText($('name').value,cx,state.layout==='side'?cy+20:cy+120);
ctx.font=`500 34px ${state.font}`;ctx.fillStyle='#64748b';ctx.fillText($('tag').value,cx,state.layout==='side'?cy+100:cy+195);ctx.letterSpacing='0px';
}
}
function render(){draw();$('preview').innerHTML='';const pc=document.createElement('canvas');pc.width=500;pc.height=300;const px=pc.getContext('2d');draw(px,500,500);pc.style.maxWidth='100%';$('preview').appendChild(pc)}
document.querySelectorAll('#styles .btn').forEach(b=>b.onclick=()=>{document.querySelectorAll('#styles .btn').forEach(z=>z.classList.remove('active'));b.classList.add('active');state.style=b.dataset.style;render()});
document.querySelectorAll('#icons .icon').forEach(b=>b.onclick=()=>{state.symbol=b.textContent.trim();render()});
['name','tag','layout','font'].forEach(id=>$(id).addEventListener('input',()=>{state[id]=$ (id).value;render()}));
[['size','sizeOut'],['spacing','spacingOut'],['radius','radiusOut'],['glow','glowOut']].forEach(([a,b])=>$(a).addEventListener('input',e=>{state[a]=+e.target.value;$(b).textContent=e.target.value;render()}));
$('primary').oninput=e=>{state.a=e.target.value;render()};$('secondary').oninput=e=>{state.b=e.target.value;render()};
document.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-bg]').forEach(z=>z.classList.remove('active'));b.classList.add('active');state.bg=b.dataset.bg;render()});
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{state.a=b.dataset.a;state.b=b.dataset.b;$('primary').value=state.a;$('secondary').value=state.b;render()});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(z=>z.classList.remove('active'));t.classList.add('active');['design','color','layers'].forEach(id=>$(id).style.display=id===t.dataset.tab?'block':'none')});
$('random').onclick=()=>{state.symbol=['◆','✦','⚡','⬢','◉','★','▲','◈'][Math.floor(Math.random()*8)];state.a=['#38bdf8','#f59e0b','#10b981','#ec4899','#ef4444'][Math.floor(Math.random()*5)];state.b=['#8b5cf6','#111827','#06b6d4','#f97316'][Math.floor(Math.random()*4)];$('primary').value=state.a;$('secondary').value=state.b;render()};
function download(size,name='it-shakh-logo.png'){const out=document.createElement('canvas');out.width=out.height=size;draw(out.getContext('2d'),size,size);const a=document.createElement('a');a.download=name;a.href=out.toDataURL('image/png');a.click()}
$('download').onclick=()=>download(1200);$('png2').onclick=()=>download(1200);$('png4').onclick=()=>download(2400);
$('svg').onclick=()=>{const name=$('name').value.replace(/[<>&"]/g,'');const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><defs><linearGradient id="g"><stop stop-color="${state.a}"/><stop offset="1" stop-color="${state.b}"/></linearGradient></defs><rect width="1200" height="1200" fill="${state.bg==='transparent'?'none':state.bg}"/><text x="600" y="540" text-anchor="middle" font-family="${state.font}" font-size="${state.size}" font-weight="900" fill="url(#g)">${state.symbol}</text><text x="600" y="720" text-anchor="middle" font-family="${state.font}" font-size="100" font-weight="900" fill="url(#g)">${name}</text><text x="600" y="790" text-anchor="middle" font-family="${state.font}" font-size="34" fill="#64748b">${$('tag').value}</text></svg>`;const a=document.createElement('a');a.download='it-shakh-logo.svg';a.href=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));a.click()};
$('undo').onclick=()=>{};$('redo').onclick=()=>{};render();
</script>
</body>
</html>
