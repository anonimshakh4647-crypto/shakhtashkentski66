<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Enhancer | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>
.drop{display:block;width:100%;border:1px dashed var(--accent);padding:30px;border-radius:14px;text-align:center;cursor:pointer;background:rgba(3,10,19,.45)}.drop input{display:none}.drop b{display:block;margin-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.field{display:grid;gap:8px}.field input,.field select{width:100%}.preview{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px}.box-title{font:11px monospace;letter-spacing:1.5px;color:var(--muted)}.imgbox{height:330px;margin-top:9px;display:grid;place-items:center;border:1px solid rgba(56,189,248,.25);border-radius:12px;background:#07101a;overflow:hidden}.imgbox img{max-width:100%;max-height:100%;object-fit:contain}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}#download{display:none;text-decoration:none}@media(max-width:700px){.grid,.preview{grid-template-columns:1fr}.imgbox{height:280px}}</style></head><body>
<header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← ORQAGA</a></header><main><div class="eyebrow">// IMAGE CLARITY TOOL</div><h1>IMAGE ENHANCER</h1><p class="intro">Xira rasmlarni tiniqlashtiring, detal va kontrastni kuchaytiring.</p><section class="panel">
<label class="drop"><input id="file" type="file" accept="image/*"><b>RASMNI TANLANG</b><span class="notice">JPG, PNG, WebP</span></label>
<div class="grid"><label class="field"><span class="label">TINIQLIK</span><input id="sharp" type="range" min="0" max="100" value="55"></label><label class="field"><span class="label">KONTRAST</span><input id="contrast" type="range" min="-30" max="50" value="10"></label></div>
<div class="grid"><label class="field"><span class="label">RANG</span><input id="sat" type="range" min="-30" max="40" value="0"></label><label class="field"><span class="label">KATTALASHTIRISH</span><select id="scale"><option value="1">Original</option><option value="1.5">1.5×</option><option value="2" selected>2×</option><option value="3">3×</option><option value="4">4×</option></select></label></div>
<p id="status" class="notice">Rasm tanlang.</p><div class="preview"><div><div class="box-title">ORIGINAL</div><div class="imgbox"><img id="before"></div></div><div><div class="box-title">ENHANCED</div><div class="imgbox"><img id="after"></div></div></div>
<div class="actions"><button id="go">✨ TINIQ QILISH</button><a id="download" class="secondary">↓ YUKLAB OLISH</a></div>
<p class="notice">Eslatma: bu vosita xiralikni kamaytiradi va mavjud detallarni kuchaytiradi; yo‘qolgan detalni to‘liq tiklay olmaydi.</p></section></main>
<script>
const f=document.getElementById('file'),before=document.getElementById('before'),after=document.getElementById('after'),status=document.getElementById('status'),dl=document.getElementById('download');let src=null,out=null;
f.onchange=()=>{if(!f.files[0])return;if(src)URL.revokeObjectURL(src);src=URL.createObjectURL(f.files[0]);before.src=src;after.removeAttribute('src');dl.style.display='none';status.textContent='Rasm tayyor.'};
function clamp(v){return Math.max(0,Math.min(255,v))}
document.getElementById('go').onclick=async()=>{if(!f.files[0]){status.textContent='Avval rasm tanlang.';return}status.textContent='Tiniqlashtirilmoqda…';try{const img=new Image();img.src=src;await img.decode();const sc=+document.getElementById('scale').value,w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';x.drawImage(img,0,0,w,h);let d=x.getImageData(0,0,w,h),a=d.data,orig=new Uint8ClampedArray(a),k=+document.getElementById('sharp').value/100*.95,cf=(259*(+document.getElementById('contrast').value+255))/(255*(259-+document.getElementById('contrast').value)),sf=1+(+document.getElementById('sat').value)/100;for(let y=0;y<h;y++)for(let xx=0;xx<w;xx++){let i=(y*w+xx)*4,l=(y*w+Math.max(0,xx-1))*4,r=(y*w+Math.min(w-1,xx+1))*4,u=(Math.max(0,y-1)*w+xx)*4,q=(Math.min(h-1,y+1)*w+xx)*4;for(let ch=0;ch<3;ch++){let blur=(orig[l+ch]+orig[r+ch]+orig[u+ch]+orig[q+ch]+orig[i+ch])/5,v=orig[i+ch]+k*(orig[i+ch]-blur);v=cf*(v-128)+128;let lum=.2126*orig[i]+.7152*orig[i+1]+.0722*orig[i+2];v=lum+(v-lum)*sf;a[i+ch]=clamp(v)}a[i+3]=orig[i+3]}x.putImageData(d,0,0);const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.95));if(out)URL.revokeObjectURL(out);out=URL.createObjectURL(blob);after.src=out;dl.href=out;dl.download='it-shakh-enhanced-'+w+'x'+h+'.jpg';dl.style.display='inline-flex';status.textContent='✓ Tayyor: '+w+' × '+h+' px'}catch(e){console.error(e);status.textContent='Xatolik yuz berdi.'}};
</script></body></html>
