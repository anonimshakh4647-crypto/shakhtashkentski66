<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIF Maker | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>.drop{display:block;width:100%;border:1px dashed var(--accent);padding:28px;border-radius:14px;text-align:center;cursor:pointer;background:rgba(3,10,19,.45);transition:.2s}.drop:hover{box-shadow:var(--glow);background:rgba(3,10,19,.7)}.drop input{display:none}.drop b{display:block;font-size:15px;margin-bottom:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.field{display:grid;gap:8px;min-width:0}.field input,.field select{width:100%;min-width:0}.preview{width:100%;max-width:100%;max-height:420px;display:block;margin:18px auto;border-radius:12px;background:#000;border:1px solid rgba(56,189,248,.18);object-fit:contain}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// IMAGE SEQUENCE TOOL</div><h1>GIF MAKER</h1><p class="intro">Bir nechta rasmdan animatsion GIF yarating. Hammasi brauzerda ishlaydi.</p><section class="panel"><label class="drop"><input id="files" type="file" accept="image/*" multiple><b>RASMLARNI TANLANG</b><br><span class="notice">Bir nechta JPG, PNG yoki WebP rasm tanlang</span></label><div class="grid"><label class="field"><span class="label">KADR VAQTI (MS)</span><input id="delay" type="number" min="50" max="5000" value="500"></label><label class="field"><span class="label">TAKRORLASH</span><select id="repeat"><option value="0">Cheksiz</option><option value="1">1 marta</option><option value="2">2 marta</option></select></label></div><div class="actions"><button id="make">GIF YARATISH</button><a id="download" class="secondary" hidden>↓ GIF YUKLAB OLISH</a></div><p id="status" class="notice">Rasm tanlang.</p><img id="preview" class="preview" hidden></section></main><script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script><script>const f=document.getElementById('files'),s=document.getElementById('status'),p=document.getElementById('preview'),d=document.getElementById('download');document.getElementById('make').onclick=async()=>{if(!f.files.length){s.textContent='Avval rasmlarni tanlang.';return}if(typeof GIF==='undefined'){s.textContent='GIF kutubxonasi yuklanmadi.';return}let workerURL=null;try{s.textContent='GIF tayyorlanmoqda…';d.hidden=true;const workerRes=await fetch('https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.worker.js',{cache:'no-store'});if(!workerRes.ok)throw new Error('Worker yuklanmadi');workerURL=URL.createObjectURL(await workerRes.blob());const imgs=await Promise.all([...f.files].map(file=>new Promise((res,rej)=>{const i=new Image();const u=URL.createObjectURL(file);i.onload=()=>{i._src=u;res(i)};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Rasm ochilmadi'))};i.src=u})));const MAX=1280;const sizes=imgs.map(i=>{const scale=Math.min(1,MAX/i.naturalWidth,MAX/i.naturalHeight);return{w:Math.max(1,Math.round(i.naturalWidth*scale)),h:Math.max(1,Math.round(i.naturalHeight*scale))}});const w=Math.max(...sizes.map(v=>v.w)),h=Math.max(...sizes.map(v=>v.h));const gif=new GIF({workers:2,quality:10,width:w,height:h,repeat:Number(document.getElementById('repeat').value),workerScript:workerURL});const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');for(let n=0;n<imgs.length;n++){const i=imgs[n],sz=sizes[n];x.clearRect(0,0,w,h);x.drawImage(i,(w-sz.w)/2,(h-sz.h)/2,sz.w,sz.h);gif.addFrame(x,{copy:true,delay:Number(document.getElementById('delay').value)});URL.revokeObjectURL(i._src);s.textContent='Kadr qo‘shilmoqda… '+(n+1)+'/'+imgs.length}gif.on('progress',v=>s.textContent='GIF tayyorlanmoqda… '+Math.round(v*100)+'%');gif.on('finished',blob=>{const url=URL.createObjectURL(blob);p.src=url;p.hidden=false;d.href=url;d.download='it-shakh.gif';d.hidden=false;s.textContent='Tayyor.';if(workerURL)URL.revokeObjectURL(workerURL)});gif.on('abort',()=>{s.textContent='GIF yaratish to‘xtatildi.';if(workerURL)URL.revokeObjectURL(workerURL)});gif.render()}catch(e){console.error(e);s.textContent='GIF yaratishda xatolik. Rasmlar soni yoki hajmini kamaytirib qayta urinib ko‘ring.';if(workerURL)URL.revokeObjectURL(workerURL)}};</script></body></html>
