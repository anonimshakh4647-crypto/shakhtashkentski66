<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Converter | IT SHAKH</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"><style>.upload{display:block;border:1px dashed var(--accent);border-radius:14px;padding:30px;text-align:center;cursor:pointer;background:rgba(3,10,19,.55)}.upload:hover{box-shadow:var(--glow)}.upload input{display:none}.settings{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.field{display:grid;gap:7px}.field select,.field input{width:100%;min-width:0}.image-preview{display:none;width:100%;max-height:360px;object-fit:contain;background:repeating-conic-gradient(#1a2b3b 0 25%,#09141e 0 50%) 50%/22px 22px;border:1px solid rgba(56,189,248,.4);border-radius:12px;margin-top:16px}.actions{display:none;gap:10px;flex-wrap:wrap;margin-top:16px}.secondary{display:inline-flex;align-items:center;color:var(--accent);background:transparent;text-decoration:none;border:1px solid rgba(56,189,248,.6);border-radius:10px;padding:13px 17px;font-size:13px;font-weight:800;cursor:pointer}@media(max-width:560px){.settings{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// LOCAL IMAGE FORMAT TOOL</div><h1>IMAGE CONVERTER</h1><p class="intro">Rasmlarni JPG, PNG, WebP yoki AVIF ga o‘tkazing. Rasm qurilmangizdan tashqariga yuborilmaydi.</p><section class="panel"><label class="upload"><input id="file" type="file" accept="image/*"><b>RASMNI TANLANG</b><br><span class="notice">JPG, PNG, WebP, GIF, BMP, SVG, AVIF va brauzeringiz ochadigan boshqa rasm formatlari</span></label><div class="settings"><label class="field"><span class="label">YANGI FORMAT</span><select id="format"><option value="image/jpeg">JPG / JPEG</option><option value="image/png">PNG</option><option value="image/webp">WEBP</option><option value="image/avif">AVIF</option></select></label><label class="field"><span class="label">SIFAT: <b id="quality-label">92%</b></span><input id="quality" type="range" min="10" max="100" value="92"></label></div><p id="status" class="notice">Rasm tanlangandan so‘ng konvert qilish tugmasi chiqadi.</p><img id="preview" class="image-preview" alt="Tanlangan rasm"><div id="actions" class="actions"><button id="convert">CONVERT QILISH</button><button id="download" class="secondary" hidden>YUKLAB OLISH</button></div></section></main><script>const file=document.getElementById('file'),format=document.getElementById('format'),quality=document.getElementById('quality'),ql=document.getElementById('quality-label'),preview=document.getElementById('preview'),status=document.getElementById('status'),actions=document.getElementById('actions'),download=document.getElementById('download');let source='',filename='image';quality.oninput=()=>ql.textContent=quality.value+'%';function extension(type){return({ 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/avif':'avif'})[type]||'png'}file.onchange=()=>{const selected=file.files[0];download.hidden=true;if(!selected)return;if(!selected.type.startsWith('image/')){status.textContent='Faqat rasm faylini tanlang.';return}filename=selected.name.replace(/\.[^.]+$/,'')||'image';const reader=new FileReader();reader.onload=()=>{source=reader.result;preview.onload=()=>{preview.style.display='block';actions.style.display='flex';status.textContent='✓ '+selected.name+' — '+preview.naturalWidth+' × '+preview.naturalHeight+' px'};preview.onerror=()=>status.textContent='Bu rasm formatini brauzer ocholmadi.';preview.src=source};reader.readAsDataURL(selected)};format.onchange=()=>{if(format.value==='image/avif'){status.textContent='AVIF tayyorlanmoqda — brauzer qo‘llamasa ham ichki encoder ishlatiladi.'}};async function encodeAVIF(canvas){try{const native=canvas.toDataURL('image/avif',Number(quality.value)/100);if(native.startsWith('data:image/avif')) return {data:native,type:'native'};}catch(_){}status.textContent='AVIF encoder yuklanmoqda…';const mod=await import('https://cdn.jsdelivr.net/npm/@jsquash/avif@2.1.0/+esm');const imageData=canvas.getContext('2d',{willReadFrequently:true}).getImageData(0,0,canvas.width,canvas.height);const cq=Math.max(0,Math.min(63,Math.round(63-(Number(quality.value)-10)*63/90)));const bytes=await mod.encode(imageData,{cqLevel:cq});const blob=new Blob([bytes],{type:'image/avif'});return {data:URL.createObjectURL(blob),type:'blob'};}document.getElementById('convert').onclick=async()=>{if(!source)return;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=preview.naturalWidth;canvas.height=preview.naturalHeight;if(format.value==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height)}ctx.drawImage(preview,0,0);let data='',objectUrl='';try{if(format.value==='image/avif'){const result=await encodeAVIF(canvas);data=result.data;if(result.type==='blob')objectUrl=data;}else{data=canvas.toDataURL(format.value,Number(quality.value)/100)}}catch(e){status.textContent='AVIF konvert qilishda xato: '+(e&&e.message?e.message:'encoder ishlamadi');return}if(!data.startsWith('data:'+format.value)&&!objectUrl){status.textContent='Bu brauzer tanlangan formatni chiqara olmaydi. Boshqa formatni tanlang.';return}download.onclick=()=>{const a=document.createElement('a');a.href=data;a.download=filename+'-converted.'+extension(format.value);a.click();if(objectUrl)setTimeout(()=>URL.revokeObjectURL(objectUrl),1500)};download.hidden=false;status.textContent='✓ Tayyor: '+extension(format.value).toUpperCase()+' formatiga o‘tkazildi.'};</script></body></html>
