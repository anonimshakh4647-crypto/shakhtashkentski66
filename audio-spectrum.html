<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AUDIO SPECTRUM PRO | IT SHAKH</title>
    
    <style>
        /* ==============================================
           ASOSIY DIZAYN VA ELEMENTLAR
           ============================================== */
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background: #03060b; 
            color: #eef7ff; 
            font: 14px 'Segoe UI', Arial, sans-serif; 
        }
        .wrap { max-width: 1400px; margin: auto; padding: 24px 14px; }
        .brand { 
            font-size: 27px; font-weight: 900; letter-spacing: 2px; color: #00e5ff; 
        }
        .crumb { color: #8198b1; }
        .card { 
            margin-top: 18px; background: #09111c; border: 1px solid #1b3048; 
            border-radius: 18px; padding: 16px; 
        }

        /* YUQORI BOSHQARUV PANELI */
        .top { display: grid; grid-template-columns: 1fr auto auto auto; gap: 9px; }
        .file, select, button { 
            background: #0b1725; border: 1px solid #263c55; color: #eef7ff; 
            border-radius: 9px; padding: 10px; font-weight: 800; 
        }
        .file input { width: 100%; color: #cfe2f5; }
        button { cursor: pointer; }
        button:hover, select:hover { border-color: #00e5ff; }
        .primary { background: linear-gradient(135deg, #00bcd4, #7047e8) !important; border: 0; }

        /* VIZUALIZATOR OYNASI */
        .visual { 
            position: relative; margin-top: 12px; background: #01040a; 
            border: 1px solid #1b3048; border-radius: 14px; overflow: hidden; 
        }
        .visual canvas { display: block; width: 100%; height: 590px; }
        .hud { 
            position: absolute; top: 12px; left: 14px; right: 14px; 
            display: flex; justify-content: space-between; color: #91a9c0; 
            font: 12px monospace; pointer-events: none; 
        }
        .hud b { color: #00e5ff; }
        .fs { position: absolute; right: 12px; bottom: 12px; }

        /* ICHKI PANELLAR VA INPUTLAR */
        .dash { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 10px; margin-top: 10px; }
        .panel { background: #07101a; border: 1px solid #1a2d43; border-radius: 11px; padding: 11px; }
        .panel h3 { font-size: 11px; letter-spacing: 1px; color: #b6cce0; margin: 0 0 10px; }
        
        .controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .ctrl { background: #09131f; border: 1px solid #172b42; border-radius: 9px; padding: 9px; }
        .ctrl label { display: flex; justify-content: space-between; font-size: 10px; font-weight: 800; }
        .ctrl output { color: #00e5ff; }
        input[type=range] { width: 100%; accent-color: #00e5ff; margin-top: 8px; }

        /* METRLAR VA STATISTIKA */
        .meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
        .meter { 
            height: 105px; background: #02070d; border: 1px solid #17283a; 
            border-radius: 7px; position: relative; overflow: hidden; 
        }
        .meter i { 
            position: absolute; bottom: 0; width: 100%; height: 0; 
            background: linear-gradient(0deg, #35ef9b, #00e5ff, #7c4dff); 
        }
        .meter span { 
            position: absolute; top: 7px; width: 100%; text-align: center; 
            font: 9px monospace; color: #9cb1c5; 
        }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; margin-top: 7px; }
        .stat { padding: 7px; background: #050a11; border: 1px solid #14273b; border-radius: 7px; }
        .stat small { color: #7188a1; font-size: 9px; }
        .stat strong { display: block; font: 11px monospace; margin-top: 2px; }
        .checks { display: flex; flex-wrap: wrap; gap: 8px; color: #9fb5c9; font-size: 11px; }

        .player { margin-top: 10px; padding: 10px; background: #050a11; border: 1px solid #1b3048; border-radius: 10px; }
        audio { width: 100%; }
        .hint { margin-top: 9px; color: #7088a1; font-size: 11px; line-height: 1.5; }

        .probar { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 9px; }
        .probar select, .probar button { min-width: 0; }

        .text-panel, .particle-panel { margin-top: 10px; background: #07101a; border: 1px solid #1a2d43; border-radius: 11px; padding: 12px; }
        .text-head, .particle-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .text-head h3, .particle-head h3 { font-size: 11px; letter-spacing: 1px; color: #b6cce0; margin: 0; }
        .text-head label, .particle-head label { font-size: 11px; color: #9fb5c9; }
        
        .text-grid, .particle-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
        .text-field, .particle-field { background: #09131f; border: 1px solid #172b42; border-radius: 9px; padding: 8px; }
        .text-field.wide, .particle-field.wide { grid-column: span 2; }
        .text-field label, .particle-field label { display: flex; justify-content: space-between; color: #9eb4ca; font-size: 9px; font-weight: 800; margin-bottom: 6px; }
        .text-field output, .particle-field output { color: #00e5ff; }
        
        .text-field input[type=text], .text-field input:not([type]), .text-field select, .particle-field select { 
            width: 100%; background: #050b12; border: 1px solid #1b3048; color: #eef7ff; border-radius: 6px; padding: 7px; font-size: 11px; 
        }
        .text-field input[type=color], .particle-field input[type=color] { 
            width: 100%; height: 32px; padding: 2px; background: #050b12; border: 1px solid #1b3048; border-radius: 6px; 
        }
        .text-field input[type=range], .particle-field input[type=range] { width: 100%; margin: 0; }
        .particle-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 9px; }
        .particle-actions button { flex: 1; min-width: 130px; }

        .text-field.wide select#textPreset { max-height: 44px; }
        #download1080:disabled { opacity: .65; cursor: wait; }
        .text-preset-count { color: #00e5ff; font-size: 10px; margin-left: 6px; }
        .visual.it-fs-stage { background: #01040a !important; }
        .visual.it-fs-stage canvas { width: 100% !important; height: 100% !important; display: block !important; }

        /* RESPONSIVE DESIGN (Media Queries) */
        @media(max-width: 1000px) {
            .top { grid-template-columns: 1fr 1fr; }
            .dash { grid-template-columns: 1fr; }
            .controls { grid-template-columns: repeat(3, 1fr); }
            .probar { grid-template-columns: 1fr; }
            .probar button { width: 100%; }
            .text-grid, .particle-grid { grid-template-columns: repeat(2, 1fr); }
            .text-field.wide, .particle-field.wide { grid-column: span 2; }
        }
        @media(max-width: 600px) {
            .top, .controls { grid-template-columns: 1fr; }
            .visual canvas { height: 390px; }
            .probar { grid-template-columns: 1fr; }
            .text-grid, .particle-grid { grid-template-columns: 1fr; }
            .text-field.wide, .particle-field.wide { grid-column: span 1; }
        }
    </style>

    <style id="it-shakh-glass-redesign">
        /* ==============================================
           IT SHAKH PRO GLASS REDESIGN (CHIZMA VA RANG)
           ============================================== */
        :root {
            --glass-bg: rgba(7, 16, 29, .62);
            --glass-bg-strong: rgba(5, 13, 24, .78);
            --glass-border: rgba(104, 205, 255, .18);
            --glass-border-hi: rgba(74, 220, 255, .42);
            --glass-shadow: 0 22px 70px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .055);
            --cyan: #21ddff;
            --violet: #8b5cf6;
        }
        body {
            background: radial-gradient(900px 500px at 12% -8%, rgba(0, 229, 255, .13), transparent 62%),
                        radial-gradient(800px 520px at 90% 8%, rgba(124, 77, 255, .13), transparent 60%),
                        radial-gradient(700px 500px at 50% 105%, rgba(0, 229, 255, .07), transparent 65%),
                        #02050a;
            overflow-x: hidden;
        }
        .wrap { max-width: 1580px; padding: 22px 18px 36px; }
        .brand {
            font-size: 29px; letter-spacing: 3px;
            background: linear-gradient(90deg, #fff, #21ddff 42%, #8b5cf6);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            text-shadow: 0 0 28px rgba(33, 221, 255, .18);
        }
        .crumb { margin-top: 4px; color: #7892ad; font-size: 11px; letter-spacing: 1.5px; }
        
        .card {
            position: relative; isolation: isolate; margin-top: 18px; padding: 14px;
            border: 1px solid var(--glass-border-hi); border-radius: 24px;
            background: linear-gradient(145deg, rgba(8, 20, 35, .82), rgba(3, 8, 16, .70));
            box-shadow: var(--glass-shadow), 0 0 80px rgba(0, 190, 255, .055);
            backdrop-filter: blur(22px) saturate(135%); -webkit-backdrop-filter: blur(22px) saturate(135%);
        }
        .card:before {
            content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
            background: linear-gradient(115deg, rgba(33, 221, 255, .055), transparent 30%), linear-gradient(300deg, rgba(139, 92, 246, .055), transparent 34%);
            pointer-events: none;
        }
        
        .pro-workspace { display: grid; grid-template-columns: 270px minmax(520px, 1fr) 320px; gap: 14px; grid-template-areas: "top top top" "left visual right" "bottom bottom bottom"; align-items: start; }
        .pro-top { grid-area: top; display: grid; grid-template-columns: minmax(300px, 1fr) 270px 112px 130px; gap: 10px; padding: 4px; }
        .pro-top > * {
            min-height: 44px !important; border-radius: 13px !important; background: rgba(8, 20, 34, .70) !important;
            border: 1px solid var(--glass-border) !important; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 8px 24px rgba(0, 0, 0, .18);
            backdrop-filter: blur(14px);
        }
        .pro-top .file { padding: 9px 11px !important; }
        .pro-top .file input { height: 22px; }
        .pro-top select, .pro-top button { width: 100%; height: 44px; }
        .pro-top .primary { background: linear-gradient(135deg, #16d9f5, #5968ff) !important; color: #001018 !important; box-shadow: 0 0 24px rgba(33, 221, 255, .20) !important; }
        .pro-top button:not(.primary):hover, .pro-top select:hover { border-color: var(--cyan) !important; box-shadow: 0 0 22px rgba(33, 221, 255, .14); }
        
        .pro-effect { grid-column: 1 / -1 !important; padding: 0 !important; background: transparent !important; border: 0 !important; box-shadow: none !important; }
        .pro-effect select {
            width: 100%; height: 42px; padding: 0 14px; border-radius: 12px !important;
            background: rgba(5, 14, 25, .72) !important; border: 1px solid var(--glass-border) !important; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
        }
        
        .pro-left, .pro-right {
            background: linear-gradient(180deg, rgba(8, 19, 33, .74), rgba(3, 10, 18, .62)); border: 1px solid var(--glass-border);
            border-radius: 18px; box-shadow: var(--glass-shadow); backdrop-filter: blur(18px) saturate(130%); -webkit-backdrop-filter: blur(18px) saturate(130%);
        }
        .pro-left { grid-area: left; min-height: 620px; padding: 13px; display: flex; flex-direction: column; }
        .pro-right { grid-area: right; min-height: 620px; padding: 13px; }
        .pro-left h3, .pro-right h3 { color: #dcefff; font-size: 11px; letter-spacing: 2px; text-shadow: 0 0 14px rgba(33, 221, 255, .16); margin: 0 0 9px; }
        
        .particle-search { height: 40px !important; border-radius: 12px !important; background: rgba(1, 8, 16, .62) !important; border: 1px solid var(--glass-border) !important; width: 100%; padding: 8px 9px !important; margin-bottom: 8px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035); }
        .particle-list-wrap { flex: 1; min-height: 0; overflow: auto; border: 1px solid rgba(104, 205, 255, .12); border-radius: 13px; background: rgba(1, 7, 14, .48); box-shadow: inset 0 0 28px rgba(0, 0, 0, .20); }
        .particle-list-wrap .particle-field { border: 0; background: transparent; padding: 6px; }
        .particle-list-wrap select { background: transparent !important; display: block; overflow-y: auto; border: 0 !important; border-radius: 0 !important; padding: 2px !important; font-size: 10px; line-height: 1.35; font-weight: 700; height: 500px; min-height: 500px; width: 100%; }
        .particle-list-wrap option { padding: 9px 8px !important; border-bottom: 1px solid rgba(104, 205, 255, .07) !important; display: block; min-height: 28px; white-space: nowrap; }
        .particle-page { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; color: #6f89a3; font-size: 10px; padding: 7px 3px 0; }
        .particle-page b { color: var(--cyan); text-shadow: 0 0 12px rgba(33, 221, 255, .4); }
        
        .pro-visual { grid-area: visual; padding: 0; min-width: 0; }
        .pro-visual .visual {
            margin: 0 !important; border-radius: 19px !important; border: 1px solid rgba(104, 205, 255, .25) !important;
            background: radial-gradient(circle at 50% 45%, rgba(0, 229, 255, .055), transparent 34%), linear-gradient(145deg, #020912, #01040a 65%) !important;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .42), 0 0 40px rgba(0, 190, 255, .055), inset 0 1px 0 rgba(255, 255, 255, .045) !important;
        }
        .pro-visual .visual canvas { height: 620px !important; }
        .pro-visual .hud { top: 14px; }
        
        .pro-right .particle-head { padding-bottom: 10px; border-bottom: 1px solid rgba(104, 205, 255, .10); margin-bottom: 8px; }
        .pro-right .particle-grid { grid-template-columns: 1fr 1fr; gap: 8px !important; margin-top: 0; }
        .pro-right .particle-field { padding: 7px; border: 1px solid rgba(104, 205, 255, .12) !important; border-radius: 12px !important; background: rgba(4, 13, 23, .56) !important; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025); }
        .pro-right .particle-field.wide { grid-column: span 2; display: none; }
        .pro-right .particle-field label { font-size: 8px; }
        .pro-right .particle-field:hover { border-color: rgba(33, 221, 255, .30) !important; }
        .pro-right .particle-actions { margin-top: 8px; }
        .pro-right .particle-actions button { font-size: 9px; padding: 8px; border-radius: 11px !important; background: rgba(7, 18, 31, .72) !important; border: 1px solid rgba(104, 205, 255, .18) !important; }
        .pro-right .particle-actions button:hover { border-color: var(--cyan) !important; box-shadow: 0 0 18px rgba(33, 221, 255, .12); }
        
        .pro-bottom { grid-area: bottom; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)) !important; gap: 12px !important; align-items: stretch; }
        .pro-bottom .pro-dash-holder { display: contents !important; }
        .pro-bottom .panel, .pro-bottom .bg-panel, .pro-bottom .text-panel, .pro-export, .pro-player {
            margin: 0 !important; border: 1px solid var(--glass-border) !important; border-radius: 17px !important;
            background: linear-gradient(145deg, rgba(7, 18, 31, .68), rgba(3, 10, 18, .58)) !important;
            box-shadow: var(--glass-shadow) !important; backdrop-filter: blur(17px) saturate(125%); -webkit-backdrop-filter: blur(17px) saturate(125%);
        }
        .pro-bottom .panel { padding: 13px !important; min-height: 0 !important; }
        .pro-bottom .panel:nth-child(1) { grid-column: span 6 !important; }
        .pro-bottom .panel:nth-child(2), .pro-bottom .panel:nth-child(3) { grid-column: span 3 !important; }
        .pro-bottom .bg-panel, .pro-bottom .text-panel { grid-column: span 6 !important; padding: 14px !important; }
        
        .pro-export { grid-column: span 3; padding: 14px !important; }
        .pro-export h3 { font-size: 11px; letter-spacing: 1px; color: #b6cce0; margin: 0 0 10px; }
        .pro-export .export-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .pro-export .export-meta div { background: rgba(2, 9, 17, .48) !important; border: 1px solid rgba(104, 205, 255, .11) !important; border-radius: 10px !important; padding: 7px; font-size: 9px; color: #8fa8bf; }
        .pro-export .export-meta b { display: block; color: #eef7ff; font-size: 10px; margin-top: 2px; }
        .pro-export #download1080 { width: 100%; padding: 12px; border-radius: 12px !important; box-shadow: 0 10px 28px rgba(0, 190, 255, .16); }
        
        .pro-player { grid-column: span 3; padding: 14px !important; align-self: stretch; margin: 0; background: #050a11; border: 1px solid #1b3048; border-radius: 10px; }
        .pro-hint { grid-column: 1 / -1 !important; padding: 10px 13px !important; color: #6e879f !important; border: 1px solid rgba(104, 205, 255, .08) !important; border-radius: 12px !important; background: rgba(3, 10, 18, .36) !important; margin: 0 !important; }
        
        .pro-bottom .panel h3, .pro-export h3, .text-head h3 { color: #dcefff !important; letter-spacing: 1.8px !important; }
        .controls { gap: 10px !important; }
        .ctrl, .text-field, .particle-field { background: rgba(4, 13, 23, .52) !important; border: 1px solid rgba(104, 205, 255, .12) !important; border-radius: 12px !important; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025); }
        .ctrl { padding: 11px !important; }
        .ctrl:hover, .text-field:hover { border-color: rgba(33, 221, 255, .25) !important; }
        .meter, .stat { background: rgba(1, 7, 14, .52) !important; border-color: rgba(104, 205, 255, .11) !important; border-radius: 10px !important; }
        .text-grid { gap: 9px !important; }
        .text-field { padding: 10px !important; }
        .text-field input[type=text], .text-field select, .text-field input[type=color] { background: rgba(1, 7, 14, .62) !important; border-color: rgba(104, 205, 255, .13) !important; border-radius: 9px !important; }
        input[type=range] { filter: drop-shadow(0 0 5px rgba(33, 221, 255, .12)); }
        .file input::file-selector-button { background: rgba(33, 221, 255, .12); color: #dff9ff; border: 1px solid rgba(33, 221, 255, .25); border-radius: 8px; padding: 6px 9px; margin-right: 8px; cursor: pointer; }
        audio { filter: drop-shadow(0 8px 20px rgba(0, 0, 0, .22)); }
        
        /* SHU YERDA display: none OLIB TASHLANDI */
        .card > .top, .card > .probar, .card > .visual, .card > .dash, .card > .bg-panel, .card > .particle-panel, .card > .text-panel, .card > .player, .card > .hint { display: grid; }
        
        #particlePreset { display: block !important; width: 100% !important; height: 500px !important; min-height: 500px !important; overflow-y: auto !important; }
        html.it-fs-html, body.it-fs-body { width: 100% !important; height: 100% !important; margin: 0 !important; overflow: hidden !important; }
        #visual.it-fs-stage, #visual:fullscreen { position: fixed !important; inset: 0 !important; width: 100vw !important; height: 100vh !important; min-width: 100vw !important; min-height: 100vh !important; max-width: none !important; max-height: none !important; margin: 0 !important; padding: 0 !important; border-radius: 0 !important; border: 0 !important; z-index: 2147483647 !important; }
        #visual.it-fs-stage canvas, #visual:fullscreen canvas { width: 100vw !important; height: 100vh !important; min-width: 100vw !important; min-height: 100vh !important; max-width: none !important; max-height: none !important; display: block !important; }
        #visual.it-fs-stage .hud, #visual:fullscreen .hud { top: 14px !important; left: 18px !important; right: 18px !important; }

        @media(max-width: 1250px) {
            .pro-workspace { grid-template-columns: 230px minmax(0, 1fr) 285px; }
            .pro-top { grid-template-columns: minmax(220px, 1fr) 235px 100px 115px; }
            .pro-bottom .panel:nth-child(1), .pro-bottom .bg-panel, .pro-bottom .text-panel { grid-column: span 6 !important; }
            .pro-export, .pro-player { grid-column: span 3; }
        }
        @media(max-width: 1100px) {
            .pro-workspace { grid-template-columns: 215px minmax(0, 1fr); grid-template-areas: "top top" "left visual" "right visual" "bottom bottom"; }
            .pro-right { min-height: 620px; }
            .pro-bottom { grid-template-columns: repeat(6, minmax(0, 1fr)) !important; }
            .pro-bottom .panel:nth-child(1), .pro-bottom .bg-panel, .pro-bottom .text-panel { grid-column: span 6 !important; }
            .pro-bottom .panel:nth-child(2), .pro-bottom .panel:nth-child(3) { grid-column: span 3 !important; }
            .pro-export, .pro-player { grid-column: span 3; }
        }
        @media(max-width: 760px) {
            .wrap { padding: 14px 9px 26px; }
            .card { padding: 9px; border-radius: 18px; }
            .pro-workspace { grid-template-columns: 1fr; grid-template-areas: "top" "visual" "left" "right" "bottom"; }
            .pro-top { grid-template-columns: 1fr 1fr; }
            .pro-top .file, .pro-effect { grid-column: 1 / -1 !important; }
            .pro-top button, .pro-top select { height: 42px; }
            .pro-visual .visual canvas { height: 390px !important; }
            .pro-left, .pro-right { min-height: 0; }
            .pro-bottom { grid-template-columns: 1fr !important; }
            .pro-bottom .panel:nth-child(1), .pro-bottom .panel:nth-child(2), .pro-bottom .panel:nth-child(3),
            .pro-bottom .bg-panel, .pro-bottom .text-panel, .pro-export, .pro-player { grid-column: 1 !important; }
            .controls { grid-template-columns: 1fr 1fr !important; }
        }
        @media(max-width: 480px) {
            .brand { font-size: 23px; }
            .pro-top { grid-template-columns: 1fr; }
            .pro-top .file, .pro-effect { grid-column: auto !important; }
            .controls { grid-template-columns: 1fr !important; }
        }
    </style>
</head>

<body>
<main class="wrap">
    <div class="brand">IT SHAKH</div>
    <div class="crumb">Tools / AUDIO SPECTRUM PRO</div>
    
    <section class="card">
        
        <!-- YUQORI PANEL -->
        <div class="top">
            <div class="file">
                <input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac">
            </div>
            <select id="mode" title="250 visual modes">
                <option value="bars">SPECTRUM BARS</option>
                <option value="mirror">MIRRORED BARS</option>
                <option value="wave">WAVEFORM</option>
                <option value="circle">CIRCULAR</option>
                <option value="radial">RADIAL</option>
                <option value="dots">PARTICLE DOTS</option>
                <option value="ring">RING</option>
                <option value="tunnel">TUNNEL</option>
                <option value="orbit">ORBIT</option>
                <option value="matrix">MATRIX</option>
            </select>
            <button id="start" class="primary" disabled>START</button>
            <button id="fullscreen">FULLSCREEN</button>
        </div>
        
        <div class="probar">
            <select id="effectPreset" title="4000 effect presets">
                <option value="">4000 EFFECT PRESETS</option>
            </select>
            <button id="download1080" class="primary">⬇ DOWNLOAD 1080P</button>
        </div>
        
        <!-- VIZUALIZATOR OYNASI -->
        <div class="visual" id="visual" style="display: block;">
            <canvas id="canvas"></canvas>
            <div class="hud">
                <span id="track">NO AUDIO</span>

<script>
/* =========================================================================
   MINGLAB EFFEKTLARNI BRAUZERDA AVTOMATIK YARATISH KODI
========================================================================= */
(function() {
    // 1. "Mode" effektlarini generatsiya qilish
    const modeSelect = document.getElementById('mode');
    const baseModes = ['SPECTRUM BARS', 'MIRRORED BARS', 'WAVEFORM', 'CIRCULAR', 'RADIAL', 'PARTICLE DOTS', 'RING', 'TUNNEL', 'ORBIT', 'MATRIX'];
    const themes = ['NEON', 'CYBER', 'LASER', 'AURORA', 'ELECTRIC', 'PLASMA', 'VIOLET', 'OCEAN', 'FIRE', 'ICE', 'MAGENTA', 'ULTRAVIOLET', 'TOXIC', 'SYNTHWAVE', 'CHROME', 'PULSE', 'GLOW', 'SHOCKWAVE', 'COSMIC', 'HOLOGRAM', 'QUANTUM', 'NIGHT', 'PHANTOM', 'INFERNO'];
    let modeCounter = 11;
    let modeHtml = '';
    for(let t=0; t<themes.length; t++) {
        for(let b=0; b<baseModes.length; b++) {
            let numStr = modeCounter.toString().padStart(3, '0');
            modeHtml += `<option value="v${modeCounter-11}">${numStr} — ${baseModes[b]} • ${themes[t]}</option>`;
            modeCounter++;
        }
    }
    modeSelect.insertAdjacentHTML('beforeend', modeHtml);

    // 2. Asosiy "Effect Preset" (4000 ta) ni generatsiya qilish
    const effectSelect = document.getElementById('effectPreset');
    const effThemes = ['NEON GLOW', 'BASS PULSE', 'LASER TRAIL', 'CHROMATIC', 'SHOCKWAVE', 'AURORA FLOW', 'STARFIELD', 'VORTEX', 'ENERGY RING', 'DIGITAL RAIN', 'GLITCH', 'SCANLINE', 'LIGHT RAYS', 'PARTICLE BURST', 'SMOOTH BLOOM', 'STROBE', 'ECHO TRAIL', 'COSMIC DUST', 'COLOR SHIFT', 'SPECTRAL FLARE'];
    const effIntensities = ['SUBTLE', 'LOW', 'MEDIUM', 'HIGH', 'ULTRA', 'MAX', 'EXTREME', 'CINEMA', 'CLUB', 'INSANE'];
    const effVariants = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'O', 'P', 'Q', 'R', 'S', 'X'];
    let effCount = 1;
    let effFinalHtml = '';
    for(let t=0; t<effThemes.length; t++) {
        effFinalHtml += `<optgroup label="${effThemes[t]} — 200 EFFECTS">`;
        for(let i=0; i<effIntensities.length; i++) {
            for(let v=0; v<effVariants.length; v++) {
                let numStr = effCount.toString().padStart(4, '0');
                effFinalHtml += `<option value="e${effCount-1}">${effThemes[t]} • ${effIntensities[i]} • ${effVariants[v]} • ${numStr}</option>`;
                effCount++;
            }
        }
        effFinalHtml += `</optgroup>`;
    }
    effectSelect.insertAdjacentHTML('beforeend', effFinalHtml);

    // 3. Orqa fon (bgFit) sozlamalari
    const fitSelect = document.getElementById('bgFit');
    const fitBase = ['CONTAIN', 'STRETCH', 'COVER'];
    let fitHtml = '';
    for(let i=1; i<=297; i++) {
        let type = fitBase[(i-1) % 3];
        let variant = ((i-1) % 99) + 1;
        fitHtml += `<option value="fit${i.toString().padStart(3,'0')}">FIT ${i.toString().padStart(3,'0')} • ${type} • VARIANT ${variant.toString().padStart(2,'0')}</option>`;
    }
    fitSelect.insertAdjacentHTML('beforeend', fitHtml);

    // 4. Orqa fon Blendlari
    const blendSelect = document.getElementById('bgBlend');
    const blendBase = ['LIGHTER', 'OVERLAY', 'SOFT-LIGHT', 'HARD-LIGHT', 'MULTIPLY', 'DARKEN', 'LIGHTEN', 'COLOR-DODGE', 'COLOR-BURN', 'DIFFERENCE', 'EXCLUSION', 'HUE', 'SATURATION', 'COLOR', 'LUMINOSITY', 'SCREEN'];
    let blendHtml = '';
    for(let i=1; i<=293; i++) {
        let type = blendBase[(i-1) % 16];
        blendHtml += `<option value="blend${i.toString().padStart(3,'0')}">BLEND ${i.toString().padStart(3,'0')} • ${type}</option>`;
    }
    blendSelect.insertAdjacentHTML('beforeend', blendHtml);

    // 5. Orqa fon Effektlari
    const bgeSelect = document.getElementById('bgEffect');
    const effBase = ['PULSE GLOW', 'RGB SHIFT', 'COLORIZE', 'MIRROR', 'KALEIDOSCOPE', 'GRAIN', 'SCANLINES', 'CRT', 'GLITCH', 'PIXELATE', 'CHROMATIC', 'EDGE GLOW', 'NEON', 'FILM', 'NOISE', 'WAVE', 'RIPPLE', 'RADIAL', 'TUNNEL', 'PRISM', 'SOLARIZE', 'POSTERIZE', 'INVERT', 'SEPIA', 'DUOTONE', 'THERMAL', 'MOSAIC', 'VIGNETTE'];
    let bgeHtml = '';
    for(let i=1; i<=293; i++) {
        let type = effBase[(i-1) % 28];
        bgeHtml += `<option value="effect${i.toString().padStart(3,'0')}">EFFECT ${i.toString().padStart(3,'0')} • ${type}</option>`;
    }
    bgeSelect.insertAdjacentHTML('beforeend', bgeHtml);

    // 6. Matn Effektlari (textPreset - 2000 ta)
    const tpSelect = document.getElementById('textPreset');
    const tpThemes = ['NEON', 'CYBER', 'FIRE', 'ICE', 'GALAXY', 'COSMIC', 'MATRIX', 'GLITCH', 'RETRO', 'HOLOGRAPHIC', 'SYNTHWAVE', 'BLOOD', 'VENOM', 'GOLD', 'DIAMOND', 'PLATINUM', 'NEON TOXIC', 'PLASMA', 'ELECTRIC', 'SHOCKWAVE']; 
    const tpStyles = ['HUGE TITLE', 'CINEMA', 'CLUB', 'MINIMAL', 'GAMING', 'TECH', 'SUBTITLE', 'RETRO', 'GLASS', 'ULTRA'];
    const tpAnims = ['NONE', 'PULSE', 'FLOAT', 'BOUNCE', 'WAVE', 'GLITCH', 'TYPE', 'ZOOM', 'SPIN', 'SHAKE'];
    let tpCount = 1;
    let tpHtml = '';
    for(let t=0; t<tpThemes.length; t++) {
        tpHtml += `<optgroup label="${tpThemes[t]} — 100 PRESETS">`;
        for(let s=0; s<tpStyles.length; s++) {
            for(let a=0; a<tpAnims.length; a++) {
                let numStr = tpCount.toString().padStart(4, '0');
                tpHtml += `<option value="tp${tpCount-1}">${tpThemes[t]} • ${tpStyles[s]} • ${tpAnims[a]} • ${numStr}</option>`;
                tpCount++;
            }
        }
        tpHtml += `</optgroup>`;
    }
    tpSelect.insertAdjacentHTML('beforeend', tpHtml);
})();
</script>
