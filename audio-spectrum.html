<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>AUDIO SPECTRUM PRO | IT SHAKH</title>
    
    <style>
        /* =========================================
           ASOSIY SOZLAMALAR VA MATN
           ========================================= */
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: radial-gradient(circle at 50% -10%, #10243a 0, #03060b 42%, #02050a 100%);
            color: #eef7ff;
            font: 14px 'Segoe UI', Arial, sans-serif;
            overflow-x: hidden;
        }
        .wrap {
            max-width: 1520px;
            margin: auto;
            padding: 18px 12px;
        }
        .brand {
            font-size: 29px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #fff, #21ddff 42%, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 28px rgba(33, 221, 255, .18);
        }
        .crumb {
            color: #7892ad;
            font-size: 11px;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        /* =========================================
           KARTA VA ASOSIY QATLAM (GLASSMORPHISM)
           ========================================= */
        .card {
            position: relative;
            isolation: isolate;
            margin-top: 18px;
            padding: 14px;
            border: 1px solid rgba(74, 220, 255, .42);
            border-radius: 24px;
            background: linear-gradient(145deg, rgba(8, 20, 35, .82), rgba(3, 8, 16, .70));
            box-shadow: 0 22px 70px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .055), 0 0 80px rgba(0, 190, 255, .055);
            backdrop-filter: blur(22px) saturate(135%);
            -webkit-backdrop-filter: blur(22px) saturate(135%);
        }
        .card:before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -1;
            border-radius: inherit;
            background: linear-gradient(115deg, rgba(33, 221, 255, .055), transparent 30%),
                        linear-gradient(300deg, rgba(139, 92, 246, .055), transparent 34%);
            pointer-events: none;
        }

        /* =========================================
           YUQORI BOSHQARUV PANEL (TOP)
           ========================================= */
        .top {
            display: grid;
            grid-template-columns: minmax(300px, 1fr) 270px 112px 130px;
            gap: 10px;
            padding: 4px;
        }
        .top > * {
            min-height: 44px !important;
            border-radius: 13px !important;
            background: rgba(8, 20, 34, .70) !important;
            border: 1px solid rgba(104, 205, 255, .18) !important;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04), 0 8px 24px rgba(0, 0, 0, .18);
            color: #eef7ff;
            font-weight: 800;
        }
        .file {
            padding: 9px 11px !important;
        }
        .file input {
            width: 100%;
            height: 22px;
            color: #cfe2f5;
        }
        .file input::file-selector-button {
            background: rgba(33, 221, 255, .12);
            color: #dff9ff;
            border: 1px solid rgba(33, 221, 255, .25);
            border-radius: 8px;
            padding: 6px 9px;
            margin-right: 8px;
            cursor: pointer;
        }
        select, button {
            padding: 10px;
            cursor: pointer;
        }
        button:not(.primary):hover, select:hover {
            border-color: #21ddff !important;
            box-shadow: 0 0 22px rgba(33, 221, 255, .14);
        }
        .primary {
            background: linear-gradient(135deg, #16d9f5, #5968ff) !important;
            color: #001018 !important;
            border: 0 !important;
            box-shadow: 0 0 24px rgba(33, 221, 255, .20) !important;
        }

        /* =========================================
           VIZUALIZATOR VA EKRAN (VISUAL)
           ========================================= */
        .visual {
            position: relative;
            margin-top: 12px;
            border-radius: 19px !important;
            border: 1px solid rgba(104, 205, 255, .25) !important;
            background: radial-gradient(circle at 50% 45%, rgba(0, 229, 255, .055), transparent 34%),
                        linear-gradient(145deg, #020912, #01040a 65%) !important;
            box-shadow: 0 24px 80px rgba(0, 0, 0, .42), 0 0 40px rgba(0, 190, 255, .055), inset 0 1px 0 rgba(255, 255, 255, .045) !important;
            overflow: hidden;
        }
        .visual canvas {
            display: block;
            width: 100%;
            height: 590px;
        }
        .hud {
            position: absolute;
            top: 14px;
            left: 18px;
            right: 18px;
            display: flex;
            justify-content: space-between;
            color: #91a9c0;
            font: 12px monospace;
            pointer-events: none;
        }
        .hud b {
            color: #00e5ff;
        }
        .fs {
            position: absolute;
            right: 12px;
            bottom: 12px;
        }

        /* =========================================
           PANEL VA ELEMENTLAR TUZILISHI (DASHBOARD)
           ========================================= */
        .dash, .probar, .bg-panel, .particle-panel, .text-panel {
            display: grid;
            gap: 10px;
            margin-top: 10px;
        }
        .dash {
            grid-template-columns: 1.5fr 1fr 1fr;
        }
        .probar {
            grid-template-columns: 1fr auto;
        }
        .panel, .bg-panel, .particle-panel, .text-panel {
            background: linear-gradient(180deg, rgba(8, 19, 33, .74), rgba(3, 10, 18, .62));
            border: 1px solid rgba(104, 205, 255, .18);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 0 22px 70px rgba(0, 0, 0, .42);
            backdrop-filter: blur(18px) saturate(130%);
        }
        h3 {
            font-size: 11px;
            letter-spacing: 2px;
            color: #dcefff;
            margin: 0 0 10px;
            text-shadow: 0 0 14px rgba(33, 221, 255, .16);
        }
        
        /* Nazorat elementlari */
        .controls, .bg-grid, .particle-grid, .text-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .text-grid, .particle-grid {
            grid-template-columns: repeat(4, 1fr);
        }
        .ctrl, .bg-field, .particle-field, .text-field {
            background: rgba(4, 13, 23, .52);
            border: 1px solid rgba(104, 205, 255, .12);
            border-radius: 12px;
            padding: 11px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .025);
            transition: 0.3s;
        }
        .ctrl:hover, .text-field:hover, .bg-field:hover, .particle-field:hover {
            border-color: rgba(33, 221, 255, .25);
        }
        .wide {
            grid-column: span 2;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 800;
            color: #9eb4ca;
            margin-bottom: 6px;
        }
        output {
            color: #00e5ff;
        }
        input[type=range] {
            width: 100%;
            accent-color: #00e5ff;
            margin-top: 8px;
            filter: drop-shadow(0 0 5px rgba(33, 221, 255, .12));
        }
        input[type=text], input[type=color], select {
            width: 100%;
            background: rgba(1, 7, 14, .62);
            border: 1px solid rgba(104, 205, 255, .13);
            color: #eef7ff;
            border-radius: 9px;
            padding: 8px;
            font-size: 11px;
        }
        input[type=color] {
            height: 32px;
            padding: 2px;
        }

        /* =========================================
           METERLAR VA STATISTIKA
           ========================================= */
        .meters {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
        }
        .meter {
            height: 105px;
            background: rgba(1, 7, 14, .52);
            border: 1px solid rgba(104, 205, 255, .11);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }
        .meter i {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: linear-gradient(0deg, #35ef9b, #00e5ff, #7c4dff);
        }
        .meter span {
            position: absolute;
            top: 7px;
            width: 100%;
            text-align: center;
            font: 9px monospace;
            color: #9cb1c5;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
            margin-top: 7px;
        }
        .stat {
            padding: 7px;
            background: rgba(1, 7, 14, .52);
            border: 1px solid rgba(104, 205, 255, .11);
            border-radius: 10px;
        }
        .stat small {
            color: #7188a1;
            font-size: 9px;
        }
        .stat strong {
            display: block;
            font: 11px monospace;
            margin-top: 2px;
        }
        
        /* Qo'shimchalar */
        .checks {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: #9fb5c9;
            font-size: 11px;
        }
        .player {
            margin-top: 10px;
            padding: 10px;
            background: rgba(5, 10, 17, 0.9);
            border: 1px solid #1b3048;
            border-radius: 10px;
        }
        audio {
            width: 100%;
            filter: drop-shadow(0 8px 20px rgba(0, 0, 0, .22));
        }

        /* =========================================
           RESPONSIVE (ADAPTIV) DIZAYN
           ========================================= */
        @media(max-width: 1250px) {
            .top { grid-template-columns: minmax(220px, 1fr) 235px 100px 115px; }
            .dash, .text-grid, .particle-grid, .bg-grid { grid-template-columns: repeat(2, 1fr); }
            .probar { grid-template-columns: 1fr; }
        }
        @media(max-width: 760px) {
            .wrap { padding: 14px 9px 26px; }
            .top { grid-template-columns: 1fr 1fr; }
            .top .file { grid-column: 1 / -1; }
            .visual canvas { height: 390px !important; }
            .dash, .controls, .text-grid, .particle-grid, .bg-grid { grid-template-columns: 1fr; }
            .wide { grid-column: span 1; }
        }
    </style>
</head>
<body>

<main class="wrap">
    <!-- Sarlavha qismi -->
    <div class="brand">IT SHAKH</div>
    <div class="crumb">Tools / AUDIO SPECTRUM PRO</div>

    <!-- Asosiy Karta -->
    <section class="card">
        
        <!-- Yuqori boshqaruv (Top) -->
        <div class="top">
            <div class="file">
                <input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac">
            </div>
            
            <select id="mode" title="250 visual modes">
                <option value="bars">SPECTRUM BARS</option>
                <option value="mirror">MIRRORED BARS</option>
                <option value="wave">WAVEFORM</option>
                <!-- Qisqartirildi: Boshqa yuzlab vizual rejim (mode) variantlari shu yerga qo'shiladi -->
            </select>
            
            <button id="start" class="primary" disabled>START</button>
            <button id="fullscreen">FULLSCREEN</button>
        </div>

        <!-- Qo'shimcha boshqaruv qatori (Probar) -->
        <div class="probar">
            <select id="effectPreset" title="4000 effect presets">
                <option value="">4000 EFFECT PRESETS</option>
                <optgroup label="NEON GLOW">
                    <option value="e0">NEON GLOW • SUBTLE • A</option>
                    <option value="e1">NEON GLOW • SUBTLE • B</option>
                    <!-- Qisqartirildi: Minglab effekt variantlari shu yerga qo'shiladi -->
                </optgroup>
            </select>
            <button id="download1080" class="primary">⬇ DOWNLOAD 1080P</button>
        </div>

        <!-- Vizualizator qismi -->
        <div class="visual" id="visual">
            <canvas id="canvas"></canvas>
            <div class="hud">
                <span id="track">NO AUDIO</span>
                <span>
                    <b id="bpm">-- BPM</b> · 
                    <b id="peak">PEAK -- dB</b> · 
                    <b id="fps">-- FPS</b>
                </span>
            </div>
            <button id="fs" class="fs">⛶</button>
        </div>

        <!-- Ekvalayzer va boshqaruv panellari -->
        <div class="dash">
            
            <!-- Sozlamalar paneli -->
            <div class="panel">
                <h3>VISUALIZER CONTROLS</h3>
                <div class="controls">
                    <div class="ctrl">
                        <label>SENSITIVITY <output id="sensO">1.50×</output></label>
                        <input id="sens" type="range" min=".3" max="3.5" step=".05" value="1.5">
                    </div>
                    <div class="ctrl">
                        <label>SMOOTHING <output id="smoothO">.75</output></label>
                        <input id="smooth" type="range" min="0" max=".95" step=".01" value=".75">
                    </div>
                    <div class="ctrl">
                        <label>FFT SIZE <output id="fftO">4096</output></label>
                        <input id="fft" type="range" min="0" max="5" value="3">
                    </div>
                    <div class="ctrl">
                        <label>BAR COUNT <output id="barsO">96</output></label>
                        <input id="bars" type="range" min="24" max="180" value="96">
                    </div>
                    <div class="ctrl">
                        <label>GLOW <output id="glowO">22</output></label>
                        <input id="glow" type="range" min="0" max="45" value="22">
                    </div>
                    <div class="ctrl">
                        <label>DECAY <output id="decayO">.88</output></label>
                        <input id="decay" type="range" min=".5" max=".99" step=".01" value=".88">
                    </div>
                </div>
            </div>

            <!-- Metr va statistika paneli -->
            <div class="panel">
                <h3>FREQUENCY METERS</h3>
                <div class="meters">
                    <div class="meter"><span>BASS 20–250Hz</span><i id="bass"></i></div>
                    <div class="meter"><span>MID 250Hz–4kHz</span><i id="mid"></i></div>
                    <div class="meter"><span>TREBLE 4–20kHz</span><i id="treble"></i></div>
                </div>
                <div class="stats">
                    <div class="stat"><small>RMS</small><strong id="rms">--</strong></div>
                    <div class="stat"><small>PEAK</small><strong id="peak2">--</strong></div>
                    <div class="stat"><small>FFT</small><strong id="fft2">--</strong></div>
                    <div class="stat"><small>SAMPLE RATE</small><strong id="sr">--</strong></div>
                </div>
            </div>

            <!-- Ekran parametrlari -->
            <div class="panel">
                <h3>DISPLAY OPTIONS</h3>
                <div class="checks">
                    <label><input id="grid" type="checkbox"> Grid</label>
                    <label><input id="labels" type="checkbox"> Freq labels</label>
                    <label><input id="peaks" type="checkbox" checked> Peak hold</label>
                    <label><input id="reflection" type="checkbox"> Reflection</label>
                    <label><input id="stars" type="checkbox" checked> Particles</label>
                    <label><input id="beat" type="checkbox" checked> Beat pulse</label>
                </div>
                <br>
                <button id="color">CHANGE COLOR</button> 
                <button id="reset">RESET</button>
            </div>
            
        </div>

        <!-- Orqa fon paneli -->
        <div class="bg-panel">
            <div class="bg-head">
                <h3>BACKGROUND IMAGE STUDIO</h3>
                <label><input id="bgEnabled" type="checkbox" checked> ENABLE BACKGROUND</label>
            </div>
            <div class="bg-grid">
                <div class="bg-field wide">
                    <label>BACKGROUND IMAGE</label>
                    <input id="bgFile" type="file" accept="image/*">
                </div>
                <div class="bg-field">
                    <label>FIT</label>
                    <select id="bgFit">
                        <option value="cover">COVER</option>
                        <option value="contain">CONTAIN</option>
                        <option value="stretch">STRETCH</option>
                        <!-- Qisqartirildi: Boshqa variantlar shu yerda bo'ladi -->
                    </select>
                </div>
                <div class="bg-field">
                    <label>OPACITY <output id="bgOpacityO">100%</output></label>
                    <input id="bgOpacity" type="range" min="0" max="100" value="100">
                </div>
                <div class="bg-field">
                    <label>BLUR <output id="bgBlurO">0px</output></label>
                    <input id="bgBlur" type="range" min="0" max="24" value="0">
                </div>
            </div>
        </div>

        <!-- Zarrachalar (Particles) paneli -->
        <div class="particle-panel">
            <div class="particle-head">
                <h3>BACKGROUND PARTICLE STUDIO</h3>
                <label><input id="particleEnabled" type="checkbox" checked> ENABLE PARTICLES</label>
            </div>
            <div class="particle-grid">
                <div class="particle-field wide">
                    <label>PARTICLE EFFECT</label>
                    <select id="particlePreset">
                        <option value="p1">DEFAULT PARTICLES</option>
                        <!-- Qisqartirildi: Zarrachalar uchun barcha variantlar shu yerda bo'ladi -->
                    </select>
                </div>
                <div class="particle-field">
                    <label>AMOUNT <output id="particleAmountO">650</output></label>
                    <input id="particleAmount" type="range" min="20" max="2200" value="650">
                </div>
                <div class="particle-field">
                    <label>COLOR 1</label>
                    <input id="particleColor1" type="color" value="#00e5ff">
                </div>
                <div class="particle-field">
                    <label>COLOR 2</label>
                    <input id="particleColor2" type="color" value="#7c4dff">
                </div>
            </div>
        </div>

        <!-- Matn (Text) paneli -->
        <div class="text-panel">
            <div class="text-head">
                <h3>TEXT OVERLAY STUDIO</h3>
                <label><input id="textEnabled" type="checkbox" checked> SHOW TEXT</label>
            </div>
            <div class="text-grid">
                <div class="text-field wide">
                    <label>MAIN TEXT</label>
                    <input id="mainText" value="IT SHAKH" maxlength="80">
                </div>
                <div class="text-field wide">
                    <label>SECOND LINE</label>
                    <input id="subText" value="AUDIO SPECTRUM" maxlength="80">
                </div>
                <div class="text-field wide">
                    <label>TEXT PRESET</label>
                    <select id="textPreset">
                        <option value="">CUSTOM</option>
                        <!-- Qisqartirildi: Matn shriftlari va dizayn variantlari shu yerda bo'ladi -->
                    </select>
                </div>
            </div>
        </div>

    </section>
</main>

<!-- Skriptlar yoziladigan qism -->
<script>
    // Asbobning ishlashi uchun JavaScript mantiqi shu yerga yoziladi
    console.log("Audio Spectrum Pro yuklandi.");
</script>

</body>
</html>
