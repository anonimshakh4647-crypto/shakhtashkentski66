<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUDIO SPECTRUM PRO | IT SHAKH</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at 50% -10%, #10243a 0, #03060b 42%, #02050a 100%);
    color: #eef7ff;
    font: 14px "Segoe UI", Arial, sans-serif;
    overflow-x: hidden;
  }
  .wrap { max-width: 1520px; margin: auto; padding: 18px 12px; }
  .brand {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #00e5ff;
    text-shadow: 0 0 22px rgba(0, 229, 255, 0.25);
  }
  .crumb { color: #8198b1; font-size: 12px; margin-bottom: 12px; }
  
  .card {
    background: linear-gradient(180deg, #08121f, #050b13);
    border: 1px solid #1b3a57;
    border-radius: 18px;
    padding: 14px;
    box-shadow: 0 18px 60px rgba(0,0,0,0.35);
  }

  button, select, input[type="text"], input[type="file"] {
    background: #0b1725;
    border: 1px solid #263c55;
    color: #eef7ff;
    border-radius: 9px;
    padding: 10px;
    font-weight: 800;
  }
  button { cursor: pointer; transition: 0.2s; }
  button:hover, select:hover { border-color: #00e5ff; }
  .primary {
    background: linear-gradient(135deg, #00bcd4, #7047e8) !important;
    border: 0 !important;
  }
  .primary:disabled { opacity: 0.5; cursor: not-allowed; }

  /* PRO WORKSPACE LAYOUT */
  .pro-workspace {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr) 290px;
    grid-template-areas:
      "top top top"
      "left visual right"
      "bottom bottom bottom";
    gap: 12px;
    align-items: start;
  }

  .pro-top {
    grid-area: top;
    display: grid;
    grid-template-columns: minmax(220px, 1fr) 250px auto auto;
    gap: 8px;
  }
  .pro-top .file input { width: 100%; color: #cfe2f5; }

  .pro-left {
    grid-area: left;
    background: #07101a;
    border: 1px solid #1a2d43;
    border-radius: 12px;
    padding: 10px;
    min-height: 620px;
    display: flex;
    flex-direction: column;
  }
  .pro-left h3, .pro-right h3, .panel h3, .pro-export h3 {
    font-size: 11px;
    letter-spacing: 1px;
    color: #b6cce0;
    margin: 0 0 10px;
    text-transform: uppercase;
  }

  .particle-search {
    width: 100%;
    background: #050b12 !important;
    border: 1px solid #1b3048 !important;
    padding: 8px 9px !important;
    margin-bottom: 8px;
    font-size: 11px;
  }

  .particle-list-wrap {
    flex: 1;
    min-height: 0;
    overflow: auto;
    border: 1px solid #142b40;
    border-radius: 8px;
    background: #040a11;
  }
  .particle-list-wrap select {
    width: 100%;
    height: 500px;
    border: 0 !important;
    background: #040a11 !important;
    padding: 2px !important;
    font-size: 10px;
    font-weight: 700;
  }
  .particle-list-wrap option { padding: 7px 6px; border-bottom: 1px solid #0e2235; }

  .pro-visual { grid-area: visual; min-width: 0; }
  .visual {
    position: relative;
    background: #01040a;
    border: 1px solid #1b3048;
    border-radius: 14px;
    overflow: hidden;
  }
  .visual canvas { display: block; width: 100%; height: 620px; }
  
  .hud {
    position: absolute;
    top: 12px; left: 14px; right: 14px;
    display: flex;
    justify-content: space-between;
    color: #91a9c0;
    font: 12px monospace;
    pointer-events: none;
  }
  .hud b { color: #00e5ff; }

  .pro-right {
    grid-area: right;
    background: #07101a;
    border: 1px solid #1a2d43;
    border-radius: 12px;
    padding: 10px;
    min-height: 620px;
  }

  .particle-grid, .text-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .ctrl-field {
    background: #09131f;
    border: 1px solid #172b42;
    border-radius: 9px;
    padding: 8px;
  }
  .ctrl-field label {
    display: flex;
    justify-content: space-between;
    color: #9eb4ca;
    font-size: 9px;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .ctrl-field output { color: #00e5ff; }
  .ctrl-field input[type="range"] { width: 100%; accent-color: #00e5ff; }
  .ctrl-field input[type="color"] { width: 100%; height: 32px; padding: 2px; background: #050b12; border: 1px solid #1b3048; border-radius: 6px; }

  .pro-bottom {
    grid-area: bottom;
    display: grid;
    grid-template-columns: 1.25fr 1fr 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  .panel {
    background: #07101a;
    border: 1px solid #1a2d43;
    border-radius: 11px;
    padding: 11px;
  }

  .pro-export {
    background: #07101a;
    border: 1px solid #1a2d43;
    border-radius: 11px;
    padding: 11px;
  }
  .export-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .export-meta div { background: #09131f; border: 1px solid #172b42; border-radius: 7px; padding: 7px; font-size: 9px; color: #8fa8bf; }
  .export-meta b { display: block; color: #eef7ff; font-size: 10px; margin-top: 2px; }

  /* RESPONSIVE MEDIA QUERIES */
  @media (max-width: 1100px) {
    .pro-workspace {
      grid-template-columns: 210px minmax(0, 1fr);
      grid-template-areas:
        "top top"
        "left visual"
        "right visual"
        "bottom bottom";
    }
    .pro-visual .visual canvas { height: 520px; }
    .pro-bottom { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 760px) {
    .pro-workspace {
      grid-template-columns: 1fr;
      grid-template-areas:
        "top"
        "visual"
        "left"
        "right"
        "bottom";
    }
    .pro-visual .visual canvas { height: 390px; }
    .pro-left { min-height: 350px; }
    .particle-list-wrap select { height: 260px; }
    .pro-bottom { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<main class="wrap">
  <div class="brand">IT SHAKH</div>
  <div class="crumb">Tools / AUDIO SPECTRUM PRO</div>

  <div class="card">
    <div class="pro-workspace">
      
      <!-- TOP CONTROL BAR -->
      <div class="pro-top">
        <div class="file">
          <input id="file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.flac">
        </div>
        <select id="mode" title="250 visual modes">
          <option value="bars">SPECTRUM BARS</option>
          <option value="mirror">MIRRORED BARS</option>
          <option value="wave">WAVEFORM</option>
          <option value="circle">CIRCULAR</option>
          <option value="radial">RADIAL</option>
          <option value="dots">PARTICLE DOTS</option>
          <option value="ring">RING</option>
          <option value="tunnel">TUNNEL</option>
          <option value="orbit">ORBIT</option>
          <option value="matrix">MATRIX</option>
        </select>
        <button id="start" class="primary" disabled>START</button>
        <button id="fullscreen">FULLSCREEN</button>
      </div>

      <!-- LEFT SIDEBAR: EFFECT PRESET SEARCH & LIST -->
      <div class="pro-left">
        <h3>Effect Presets</h3>
        <input type="text" id="effectSearch" class="particle-search" placeholder="Search 4000 presets...">
        <div class="particle-list-wrap">
          <select id="effectPreset" size="30">
            <!-- Programmatically populated with 4,000 effect presets -->
          </select>
        </div>
      </div>

      <!-- MAIN VISUAL CANVAS -->
      <div class="pro-visual">
        <div class="visual" id="stage">
          <div class="hud">
            <div>MODE: <b id="hudMode">BARS</b></div>
            <div>FPS: <b id="hudFps">60</b></div>
          </div>
          <canvas id="canvas"></canvas>
        </div>
      </div>

      <!-- RIGHT SIDEBAR: PARTICLE STUDIO -->
      <div class="pro-right">
        <h3>Particle Studio</h3>
        <div class="particle-grid">
          <div class="ctrl-field">
            <label>COUNT <output id="outPCount">150</output></label>
            <input type="range" id="pCount" min="10" max="500" value="150">
          </div>
          <div class="ctrl-field">
            <label>SPEED <output id="outPSpeed">1.5</output></label>
            <input type="range" id="pSpeed" min="0.1" max="5" step="0.1" value="1.5">
          </div>
          <div class="ctrl-field">
            <label>SIZE <output id="outPSize">3.0</output></label>
            <input type="range" id="pSize" min="0.5" max="10" step="0.5" value="3.0">
          </div>
          <div class="ctrl-field">
            <label>COLOR</label>
            <input type="color" id="pColor" value="#00e5ff">
          </div>
        </div>
      </div>

      <!-- BOTTOM PANELS: TEXT OVERLAY & EXPORT -->
      <div class="pro-bottom">
        <div class="panel">
          <h3>Text Overlay</h3>
          <div class="text-grid">
            <div class="ctrl-field">
              <label>TITLE</label>
              <input type="text" id="textTitle" value="AUDIO SPECTRUM PRO">
            </div>
            <div class="ctrl-field">
              <label>SUBTITLE</label>
              <input type="text" id="textSub" value="IT SHAKH DESIGN">
            </div>
          </div>
        </div>

        <div class="panel">
          <h3>Audio Player</h3>
          <audio id="audio" controls style="width: 100%; margin-top: 8px;"></audio>
        </div>

        <div class="pro-export">
          <h3>Export</h3>
          <div class="export-meta">
            <div>RES <b>1920x1080</b></div>
            <div>FPS <b>60 FPS</b></div>
          </div>
          <button id="download1080" class="primary">EXPORT FULL HD</button>
        </div>
      </div>

    </div>
  </div>
</main>

<script>
  // Populate 4,000 Effect Presets Dynamically
  const presetSelect = document.getElementById('effectPreset');
  const categories = [
    "NEON GLOW", "BASS PULSE", "LASER TRAIL", "CHROMATIC", 
    "CYBER MATRIX", "QUANTUM WAVE", "HOLOGRAM", "INFERNO"
  ];
  const styles = ["SUBTLE", "LOW", "MEDIUM", "HIGH", "ULTRA", "MAX", "EXTREME", "CINEMA", "CLUB", "INSANE"];
  
  let optionCount = 0;
  for (let c = 0; c < categories.length; c++) {
    const group = document.createElement('optgroup');
    group.label = `${categories[c]} — 500 EFFECTS`;
    
    for (let i = 1; i <= 500; i++) {
      optionCount++;
      const opt = document.createElement('option');
      opt.value = `e${optionCount}`;
      const styleName = styles[i % styles.length];
      const code = String(i).padStart(4, '0');
      opt.textContent = `${categories[c]} • ${styleName} • ${code}`;
      group.appendChild(opt);
    }
    presetSelect.appendChild(group);
  }

  // Filter Presets Functionality
  const searchInput = document.getElementById('effectSearch');
  searchInput.addEventListener('input', (e) => {
    const filter = e.target.value.toLowerCase();
    const options = presetSelect.getElementsByTagName('option');
    for (let opt of options) {
      const txt = opt.textContent.toLowerCase();
      opt.style.display = txt.includes(filter) ? '' : 'none';
    }
  });

  // UI Control Updates
  document.getElementById('pCount').addEventListener('input', (e) => {
    document.getElementById('outPCount').value = e.target.value;
  });
  document.getElementById('pSpeed').addEventListener('input', (e) => {
    document.getElementById('outPSpeed').value = e.target.value;
  });
  document.getElementById('pSize').addEventListener('input', (e) => {
    document.getElementById('outPSize').value = e.target.value;
  });

  // Fullscreen Handler
  document.getElementById('fullscreen').addEventListener('click', () => {
    const stage = document.getElementById('stage');
    if (!document.fullscreenElement) {
      stage.requestFullscreen().catch(err => alert(err.message));
    } else {
      document.exitFullscreen();
    }
  });

  // File Upload Activator
  const fileInput = document.getElementById('file');
  const startBtn = document.getElementById('start');
  const audio = document.getElementById('audio');

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      audio.src = URL.createObjectURL(file);
      startBtn.disabled = false;
    }
  });
</script>

</body>
</html>
