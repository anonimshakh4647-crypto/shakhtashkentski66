<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Visualizer Pro</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0f17;
      color: #e1e7ed;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Visualizer Area */
    .visualizer-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at center, #1a1f36 0%, #0d0f17 100%);
    }

    canvas {
      width: 90%;
      height: 70%;
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Controls Sidebar */
    .sidebar {
      width: 360px;
      background: rgba(23, 27, 44, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #00f2fe;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.03);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    label {
      font-size: 0.85rem;
      color: #a0aec0;
      display: flex;
      justify-content: space-between;
    }

    input[type="file"] {
      display: none;
    }

    .file-upload-btn {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #000;
      font-weight: 600;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }

    .file-upload-btn:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    input[type="range"] {
      width: 100%;
      accent-color: #00f2fe;
      cursor: pointer;
    }

    select, input[type="color"] {
      width: 100%;
      padding: 8px;
      border-radius: 6px;
      background: #171b2c;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      outline: none;
    }

    audio {
      width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="visualizer-container">
    <canvas id="canvas"></canvas>
    <audio id="audio" controls></audio>
  </div>

  <div class="sidebar">
    <h2>Audio Sozlamalari</h2>

    <div class="control-group">
      <label for="audioFile">Audio Fayl Yuklash</label>
      <label class="file-upload-btn" for="audioFile">Fayl Tanlang</label>
      <input type="file" id="audioFile" accept="audio/*">
    </div>

    <div class="control-group">
      <label for="visualType">Visualizer Turi</label>
      <select id="visualType">
        <option value="bars">Barlar (Bars)</option>
        <option value="wave">To'lqin (Waveform)</option>
        <option value="circle">Aylana (Circle)</option>
      </select>
    </div>

    <div class="control-group">
      <label for="barColor">Rang Sozlamasi</label>
      <input type="color" id="barColor" value="#00f2fe">
    </div>

    <div class="control-group">
      <label for="fftSize">Aniqlik (FFT Size)</label>
      <select id="fftSize">
        <option value="64">Past (64)</option>
        <option value="128">O'rta (128)</option>
        <option value="256" selected>Yuqori (256)</option>
        <option value="512">Ultra (512)</option>
      </select>
    </div>
  </div>

</body>
</html>
