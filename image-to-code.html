<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to Code | IT SHAKH</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"><style>.upload{display:block;border:1px dashed var(--accent);border-radius:14px;padding:30px;text-align:center;cursor:pointer;background:rgba(3,10,19,.55)}.upload:hover{box-shadow:var(--glow)}.upload input{display:none}.title-input{width:100%;margin:14px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.preview-img,.frame{display:none;width:100%;border:1px solid rgba(56,189,248,.4);border-radius:12px;background:#fff}.preview-img{max-height:310px;object-fit:contain;background:#07101a}.frame{height:310px}.code{display:none;width:100%;min-height:310px;margin-top:18px;resize:vertical;background:#030914;color:#b9ebff;border:1px solid rgba(56,189,248,.4);border-radius:12px;padding:14px;font:12px/1.5 monospace}.actions{display:none;gap:10px;flex-wrap:wrap;margin-top:14px}.secondary{display:inline-flex;align-items:center;color:var(--accent);background:transparent;text-decoration:none;border:1px solid rgba(56,189,248,.6);border-radius:10px;padding:13px 17px;font-size:13px;font-weight:800;cursor:pointer}@media(max-width:650px){.split{grid-template-columns:1fr}.frame{height:400px}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// OFFLINE LANDING GENERATOR</div><h1>IMAGE TO CODE</h1><p class="intro">Rasm yuklang — u asosida ranglari mos bo‘lgan, rasmni ichiga joylashtirgan tayyor HTML landing page yarating. Internet va API kaliti kerak emas.</p><section class="panel"><label class="upload"><input id="image" type="file" accept="image/*"><b>RASMNI TANLANG</b><br><span class="notice">JPG, PNG, WebP va boshqa rasm formatlari</span></label><input id="site-title" class="title-input" maxlength="80" value="MY WEBSITE" placeholder="Sayt nomi"><p id="status" class="notice">Rasm tanlangandan keyin kod avtomatik yaratiladi.</p><div class="split"><img id="image-preview" class="preview-img" alt="Yuklangan rasm"><iframe id="preview" class="frame" title="Sayt previewi" sandbox></iframe></div><textarea id="code" class="code" readonly spellcheck="false"></textarea><div id="actions" class="actions"><button id="copy" class="secondary">KODNI NUSXALASH</button><button id="download" class="secondary">HTML YUKLAB OLISH</button></div></section></main><script>const picker=document.getElementById('image'),titleInput=document.getElementById('site-title'),imagePreview=document.getElementById('image-preview'),frame=document.getElementById('preview'),codeBox=document.getElementById('code'),status=document.getElementById('status'),actions=document.getElementById('actions');let imageData='';const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function getColor(img){const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=c.height=40;x.drawImage(img,0,0,40,40);const d=x.getImageData(0,0,40,40).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2];n++}r=Math.round(r/n);g=Math.round(g/n);b=Math.round(b/n);const max=Math.max(r,g,b),min=Math.min(r,g,b),boost=max-min<45?70:25;return 'rgb('+Math.min(255,r+boost)+','+Math.min(255,g+boost)+','+Math.min(255,b+boost)+')'}function build(){if(!imageData)return;const title=safe(titleInput.value.trim()||'MY WEBSITE'),accent=getColor(imagePreview),html='<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <title>'+title+'</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { margin: 0; font-family: Arial, sans-serif; color: white; background: #07101a; }\n    .hero { min-height: 100vh; display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at top right, '+accent+', transparent 45%), #07101a; }\n    .card { width: min(100%, 980px); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border-radius: 24px; background: rgba(255,255,255,.08); box-shadow: 0 20px 70px rgba(0,0,0,.45); }\n    img { width: 100%; height: 100%; object-fit: cover; min-height: 340px; }\n    .content { padding: clamp(30px, 6vw, 70px); display: flex; flex-direction: column; justify-content: center; }\n    .tag { color: '+accent+'; font-weight: bold; letter-spacing: 2px; }\n    h1 { font-size: clamp(36px, 6vw, 68px); margin: 14px 0; }\n    p { color: #c7d2df; line-height: 1.7; }\n    a { display: inline-block; width: fit-content; margin-top: 16px; background: '+accent+'; color: #07101a; padding: 13px 18px; border-radius: 999px; text-decoration: none; font-weight: bold; }\n    @media (max-width: 680px) { .card { grid-template-columns: 1fr; } img { min-height: 240px; } }\n  </style>\n</head>\n<body>\n  <main class="hero"><section class="card"><img src="'+imageData+'" alt="'+title+'"><div class="content"><div class="tag">CREATIVE WEBSITE</div><h1>'+title+'</h1><p>Rasmingiz asosida avtomatik yaratilgan zamonaviy landing page.</p><a href="#">BOSHLASH</a></div></section></main>\n</body>\n</html>';codeBox.value=html;frame.srcdoc=html;codeBox.style.display='block';imagePreview.style.display='block';frame.style.display='block';actions.style.display='flex';status.textContent='✓ Tayyor. Preview va HTML kodi quyida.'}picker.addEventListener('change',()=>{const file=picker.files[0];if(!file)return;if(!file.type.startsWith('image/')){status.textContent='Faqat rasm faylini tanlang.';return}const reader=new FileReader();reader.onload=()=>{imageData=reader.result;imagePreview.onload=build;imagePreview.src=imageData};reader.readAsDataURL(file)});titleInput.addEventListener('input',build);document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(codeBox.value);status.textContent='✓ Kod nusxalandi.'}catch(_){codeBox.select();document.execCommand('copy');status.textContent='✓ Kod nusxalandi.'}});document.getElementById('download').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([codeBox.value],{type:'text/html'}));a.download='image-website.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)});</script><!-- IT-SHAKH-SITELOCK -->
<style>
#sl-modal,#vb-modal,#bk-modal{position:fixed;inset:0;z-index:2147483647;background:rgba(2,6,14,.96);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit}
.sl-box{width:min(440px,100%);background:#06101c;border:1px solid rgba(31,214,245,.4);border-radius:16px;padding:28px 24px;box-shadow:0 0 60px rgba(31,214,245,.25);text-align:center;box-sizing:border-box}

.bk-ic{font-size:42px}
.bk-box h2{margin:8px 0 10px;font-size:21px;color:#f87171;font-family:inherit}

</style>
<script>
/* ===== SAYTNI TO'LIQ BLOKLASH + VPN TAQIQLASH + FOYDALANUVCHINI BLOKLASH — TOOLS sahifalari uchun =====
   index.html dagi admin panelidan "SAYTNI BLOKLASH" yoki "VPN TAQIQLASH" yoqilsa, yoki ma'lum bir foydalanuvchi
   akkaunti (email yoki uning IP manzili orqali) bloklansa — bu tekshiruv shu asbob sahifasida ham ishlaydi.
   Foydalanuvchini bloklash tekshiruvi FAQAT tizimga kirgan (Google orqali) foydalanuvchilar uchun ishlaydi —
   index.html'dagi xuddi shu cheklov bilan bir xil (kirmagan mehmon uchun bu tekshiruv ishlamaydi).
   ADMIN_EMAIL hech qachon tekshirilmaydi/bloklanmaydi. Hech qanday Google token talab qilinmaydi (sayt bloklash
   va VPN taqiqlash ommaviy tekshiruv) — faqat foydalanuvchi bloki uchun localStorage'dagi kredensial ishlatiladi. */
(function(){
 var USERS_API_URL='https://script.google.com/macros/s/AKfycbyGcZgnnp91p19OhUVCep3zh_Izw9Day-jQaveO0rYVX7cK0F_y9yZaSHJ-qdMUZzhiBA/exec';
 var ADMIN='anonimshakh4647@gmail.com';
 var showingLock=false,showingVpn=false,showingBlock=false,checking=false,vpnFlag=null,vpnCheckedAt=0;
 function getUser(){try{return JSON.parse(localStorage.getItem('it_shakh_google_user')||'null')}catch(e){return null}}
 function isAdmin(){var u=getUser();return !!(u&&String(u.email||'').toLowerCase()===ADMIN);}
 function expMs(c){try{return JSON.parse(atob(c.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}}
 function api(params,ms){return new Promise(function(res){
  var cb='sl2_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script'),done=false;
  var fin=function(v){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.parentNode&&sc.remove();res(v);};
  window[cb]=fin;sc.onerror=function(){fin(null)};setTimeout(function(){fin(null)},ms||9000);
  var qs='';for(var k in params){if(params[k]==null)continue;qs+=(qs?'&':'')+k+'='+encodeURIComponent(params[k]);}
  sc.src=USERS_API_URL+'?'+qs+'&callback='+cb+'&_='+Date.now();document.head.appendChild(sc);});}
 function showLock(){
  if(showingLock||document.getElementById('sl-modal'))return;showingLock=true;
  ['vb-modal','bk-modal'].forEach(function(id){var m=document.getElementById(id);if(m)m.remove();});
  showingVpn=false;showingBlock=false;
  var d=document.createElement('div');d.id='sl-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛠️</div><h2>Sayt vaqtincha yopiq</h2><p>Hozirda saytda texnik ishlar olib borilmoqda. Iltimos, birozdan so‘ng qayta urinib ko‘ring.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideLock(){var d=document.getElementById('sl-modal');if(!d)return;d.remove();showingLock=false;document.body.style.overflow=(showingVpn||showingBlock)?'hidden':'';}
 function showBlock(){
  if(showingBlock||showingLock||document.getElementById('bk-modal'))return;showingBlock=true;
  var vb=document.getElementById('vb-modal');if(vb)vb.remove();showingVpn=false;
  var d=document.createElement('div');d.id='bk-modal';
  d.innerHTML='<div class="bk-box"><div class="bk-ic">🚫</div><h2>Akkauntingiz bloklangan</h2><p>Qoidabuzarlik yoki shubhali faoliyat tufayli ushbu akkaunt uchun saytdan foydalanish to‘xtatildi.</p><p class="bk-sub">Bu xato deb hisoblasangiz, administrator bilan bog‘laning.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideBlock(){var d=document.getElementById('bk-modal');if(!d)return;d.remove();showingBlock=false;document.body.style.overflow=(showingLock||showingVpn)?'hidden':'';}
 function showVpn(){
  if(showingVpn||showingLock||showingBlock||document.getElementById('vb-modal'))return;showingVpn=true;
  var d=document.createElement('div');d.id='vb-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛡️</div><h2>VPN/Proksi orqali kirish taqiqlangan</h2><p>Saytdan foydalanish uchun VPN yoki proksi dasturini o‘chirib, sahifani qayta yuklang.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideVpn(){var d=document.getElementById('vb-modal');if(!d)return;d.remove();showingVpn=false;document.body.style.overflow=(showingLock||showingBlock)?'hidden':'';}
 function checkVpn(){
  return new Promise(function(res){
   var c=(typeof AbortController!=='undefined')?new AbortController():null,t=setTimeout(function(){if(c)c.abort();},5000);
   fetch('https://api.ipapi.is/',c?{signal:c.signal}:{}).then(function(r){
    clearTimeout(t);if(!r.ok)return res(null);return r.json();
   }).then(function(j){
    if(!j||typeof j!=='object'||(j.is_vpn==null&&j.is_proxy==null&&j.is_datacenter==null))return res(null);
    res(!!(j.is_vpn||j.is_proxy||j.is_tor||j.is_datacenter));
   }).catch(function(){clearTimeout(t);res(null);});
  });
 }
 function tick(){
  if(checking||isAdmin())return;
  checking=true;
  var u=getUser(),credOk=!!(u&&u.email&&u.credential);
  // XAVFSIZLIK (reload bilan aylanib o'tishning oldini olish): sayt bloki yoki shu foydalanuvchining bloki
  // oldin keshlangan bo'lsa, serverdan javob kelgunga QADAR HAM tegishli ekran DARHOL ko'rsatiladi.
  var cachedLock=false;try{cachedLock=localStorage.getItem('it_shakh_sitelock_flag')==='1';}catch(e){}
  if(cachedLock&&!showingLock)showLock();
  var blkKey=credOk?('it_shakh_blk_'+String(u.email).toLowerCase()):null;
  var cachedBlk=false;if(blkKey){try{cachedBlk=localStorage.getItem(blkKey)==='1';}catch(e){}}
  if(cachedBlk&&!showingBlock)showBlock();
  var p1=api({action:'sitestat'},9000);
  var p2=credOk?api({action:(expMs(u.credential)>Date.now()+10000?'me':'blockstat'),credential:u.credential},9000):Promise.resolve(null);
  Promise.all([p1,p2]).then(function(res){checking=false;
   var r=res[0],rb=res[1];
   if(r&&r.ok&&r.locked){try{localStorage.setItem('it_shakh_sitelock_flag','1')}catch(e){}return showLock();}
   if(r&&r.ok&&!r.locked){try{localStorage.removeItem('it_shakh_sitelock_flag')}catch(e){}if(showingLock)hideLock();}
   if(rb&&rb.ok&&rb.blocked){if(blkKey){try{localStorage.setItem(blkKey,'1')}catch(e){}}return showBlock();}
   if(rb&&rb.ok&&!rb.blocked){if(blkKey){try{localStorage.removeItem(blkKey)}catch(e){}}if(showingBlock)hideBlock();}
   if(r&&r.ok&&r.vpnBlock){
    if(vpnFlag===null||Date.now()-vpnCheckedAt>120000){
     checkVpn().then(function(v){vpnFlag=v;vpnCheckedAt=Date.now();
      if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
     });
    }else if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
   }else if(showingVpn)hideVpn();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
</script>
