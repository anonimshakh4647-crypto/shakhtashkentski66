<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image to Code | IT SHAKH</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"><style>.upload{display:block;border:1px dashed var(--accent);border-radius:14px;padding:30px;text-align:center;cursor:pointer;background:rgba(3,10,19,.55)}.upload:hover{box-shadow:var(--glow)}.upload input{display:none}.title-input{width:100%;margin:14px 0}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.preview-img,.frame{display:none;width:100%;border:1px solid rgba(56,189,248,.4);border-radius:12px;background:#fff}.preview-img{max-height:310px;object-fit:contain;background:#07101a}.frame{height:310px}.code{display:none;width:100%;min-height:310px;margin-top:18px;resize:vertical;background:#030914;color:#b9ebff;border:1px solid rgba(56,189,248,.4);border-radius:12px;padding:14px;font:12px/1.5 monospace}.actions{display:none;gap:10px;flex-wrap:wrap;margin-top:14px}.secondary{display:inline-flex;align-items:center;color:var(--accent);background:transparent;text-decoration:none;border:1px solid rgba(56,189,248,.6);border-radius:10px;padding:13px 17px;font-size:13px;font-weight:800;cursor:pointer}@media(max-width:650px){.split{grid-template-columns:1fr}.frame{height:400px}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// OFFLINE LANDING GENERATOR</div><h1>IMAGE TO CODE</h1><p class="intro">Rasm yuklang — u asosida ranglari mos bo‘lgan, rasmni ichiga joylashtirgan tayyor HTML landing page yarating. Internet va API kaliti kerak emas.</p><section class="panel"><label class="upload"><input id="image" type="file" accept="image/*"><b>RASMNI TANLANG</b><br><span class="notice">JPG, PNG, WebP va boshqa rasm formatlari</span></label><input id="site-title" class="title-input" maxlength="80" value="MY WEBSITE" placeholder="Sayt nomi"><p id="status" class="notice">Rasm tanlangandan keyin kod avtomatik yaratiladi.</p><div class="split"><img id="image-preview" class="preview-img" alt="Yuklangan rasm"><iframe id="preview" class="frame" title="Sayt previewi" sandbox></iframe></div><textarea id="code" class="code" readonly spellcheck="false"></textarea><div id="actions" class="actions"><button id="copy" class="secondary">KODNI NUSXALASH</button><button id="download" class="secondary">HTML YUKLAB OLISH</button></div></section></main><script>const picker=document.getElementById('image'),titleInput=document.getElementById('site-title'),imagePreview=document.getElementById('image-preview'),frame=document.getElementById('preview'),codeBox=document.getElementById('code'),status=document.getElementById('status'),actions=document.getElementById('actions');let imageData='';const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function getColor(img){const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});c.width=c.height=40;x.drawImage(img,0,0,40,40);const d=x.getImageData(0,0,40,40).data;let r=0,g=0,b=0,n=0;for(let i=0;i<d.length;i+=16){r+=d[i];g+=d[i+1];b+=d[i+2];n++}r=Math.round(r/n);g=Math.round(g/n);b=Math.round(b/n);const max=Math.max(r,g,b),min=Math.min(r,g,b),boost=max-min<45?70:25;return 'rgb('+Math.min(255,r+boost)+','+Math.min(255,g+boost)+','+Math.min(255,b+boost)+')'}function build(){if(!imageData)return;const title=safe(titleInput.value.trim()||'MY WEBSITE'),accent=getColor(imagePreview),html='<!doctype html>\n<html lang="en">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <title>'+title+'</title>\n  <style>\n    * { box-sizing: border-box; }\n    body { margin: 0; font-family: Arial, sans-serif; color: white; background: #07101a; }\n    .hero { min-height: 100vh; display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at top right, '+accent+', transparent 45%), #07101a; }\n    .card { width: min(100%, 980px); display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border-radius: 24px; background: rgba(255,255,255,.08); box-shadow: 0 20px 70px rgba(0,0,0,.45); }\n    img { width: 100%; height: 100%; object-fit: cover; min-height: 340px; }\n    .content { padding: clamp(30px, 6vw, 70px); display: flex; flex-direction: column; justify-content: center; }\n    .tag { color: '+accent+'; font-weight: bold; letter-spacing: 2px; }\n    h1 { font-size: clamp(36px, 6vw, 68px); margin: 14px 0; }\n    p { color: #c7d2df; line-height: 1.7; }\n    a { display: inline-block; width: fit-content; margin-top: 16px; background: '+accent+'; color: #07101a; padding: 13px 18px; border-radius: 999px; text-decoration: none; font-weight: bold; }\n    @media (max-width: 680px) { .card { grid-template-columns: 1fr; } img { min-height: 240px; } }\n  </style>\n</head>\n<body>\n  <main class="hero"><section class="card"><img src="'+imageData+'" alt="'+title+'"><div class="content"><div class="tag">CREATIVE WEBSITE</div><h1>'+title+'</h1><p>Rasmingiz asosida avtomatik yaratilgan zamonaviy landing page.</p><a href="#">BOSHLASH</a></div></section></main>\n</body>\n</html>';codeBox.value=html;frame.srcdoc=html;codeBox.style.display='block';imagePreview.style.display='block';frame.style.display='block';actions.style.display='flex';status.textContent='✓ Tayyor. Preview va HTML kodi quyida.'}picker.addEventListener('change',()=>{const file=picker.files[0];if(!file)return;if(!file.type.startsWith('image/')){status.textContent='Faqat rasm faylini tanlang.';return}const reader=new FileReader();reader.onload=()=>{imageData=reader.result;imagePreview.onload=build;imagePreview.src=imageData};reader.readAsDataURL(file)});titleInput.addEventListener('input',build);document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(codeBox.value);status.textContent='✓ Kod nusxalandi.'}catch(_){codeBox.select();document.execCommand('copy');status.textContent='✓ Kod nusxalandi.'}});document.getElementById('download').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([codeBox.value],{type:'text/html'}));a.download='image-website.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1200)});</script></body></html>
