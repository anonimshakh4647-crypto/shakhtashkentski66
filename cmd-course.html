<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IT SHAKH | CMD (buyruq satri) to‘liq kursi</title>
<style>
:root{--bg:#04060b;--accent:#38bdf8;--text-color:#e5e7eb;
--ui:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;--mono:Consolas,'Cascadia Mono','Courier New',ui-monospace,monospace;
--u0:#0a101a;--u1:#0f1724;--u2:#142033;--u3:#1b2a42;--ul:#1f2e47;--ul2:#2a3b58;--ut:#e6edf8;--um:#8a9bb5;--ok:#34d399;--warn:#fbbf24;--err:#f87171;--pur:#a78bfa;--r:10px}
body.night-mode{--bg:#000;--accent:#00ff41;--text-color:#00ff41}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;font-family:var(--ui);background:var(--bg);color:var(--text-color);overflow:hidden}
header.site{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 20px;flex-wrap:wrap;gap:8px;border-bottom:1px solid rgba(56,189,248,.15)}
.logo-text{font-weight:800;letter-spacing:2px;font-size:15px}
.nav-links{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.nav-links a{color:var(--text-color);text-decoration:none;font-size:12px;letter-spacing:1px;opacity:.85}
.nav-links a:hover{opacity:1;color:var(--accent)}
.mode-toggle{background:transparent;border:1px solid rgba(56,189,248,.4);color:var(--accent);padding:5px 11px;border-radius:20px;font:11px monospace;letter-spacing:1px;cursor:pointer}
main.wrapm{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 12px 10px;max-width:1900px;width:100%;margin:0 auto}
.hidden{display:none!important}
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--u0);color:var(--ut);border-radius:12px;overflow:hidden;border:1px solid rgba(56,189,248,.3);font-size:14px;position:relative}
.app *{scrollbar-width:thin;scrollbar-color:var(--ul2) transparent}
.app button,.app input,.app select,.app textarea{font-family:inherit}
.topbar{flex:none;display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--u1);border-bottom:1px solid var(--ul);min-height:52px;overflow-x:auto;scrollbar-width:none}
.topbar::-webkit-scrollbar{display:none}
.brand{display:flex;flex-direction:column;line-height:1.15;flex:none;margin-right:4px}
.brand b{font-size:15px;letter-spacing:.5px}.brand small{color:var(--um);font-size:11px}
.brand b span{color:var(--accent)}
.ub{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--ul2);background:var(--u2);color:var(--ut);font:600 13px var(--ui);cursor:pointer;white-space:nowrap;flex:none;transition:.12s}
.ub:hover{background:var(--u3);border-color:#3a5078}
.ub.pri{background:var(--accent);border-color:var(--accent);color:#04121c}
.ub.pri:hover{filter:brightness(1.1)}
.ub.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.ub.ico{width:34px;padding:0}
.ub:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--u0);border:1px solid var(--ul);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:transparent;color:var(--um);height:30px;padding:0 13px;border-radius:7px;font:700 13px var(--ui);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button:hover{color:var(--ut)}.seg button.on{background:var(--u3);color:var(--accent);box-shadow:0 0 0 1px var(--ul2)}
.sp{flex:1;min-width:6px}
.prog{display:flex;align-items:center;gap:9px;flex:none;min-width:210px}
.prog .bar{flex:1;height:9px;border-radius:9px;background:var(--u3);overflow:hidden;min-width:90px}
.prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#34d399);border-radius:9px;transition:width .5s}
.prog b{font-size:15px;min-width:42px;text-align:right}
.prog small{color:var(--um);font-size:11px;white-space:nowrap}
.views{flex:1;min-height:0;display:flex;position:relative}
.view{flex:1;min-width:0;min-height:0;display:flex}
/* ===== Darslar ko‘rinishi ===== */
.map{flex:none;width:272px;background:var(--u1);border-right:1px solid var(--ul);overflow:auto;padding:10px 8px 24px}
.map h4{margin:6px 8px 10px;font-size:11px;letter-spacing:1.4px;color:var(--um);text-transform:uppercase}
.mod{margin-bottom:6px;border-radius:10px}
.mod>summary{list-style:none;cursor:pointer;padding:8px 9px;border-radius:9px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.mod>summary::-webkit-details-marker{display:none}
.mod>summary:hover{background:var(--u2)}
.mod>summary .mi{font-size:16px;width:22px;text-align:center}
.mod>summary .mt{flex:1;line-height:1.25}
.mod>summary .mc{font-size:11px;color:var(--um);font-weight:600}
.mod[open]>summary .mc{color:var(--accent)}
.les{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;color:var(--ut);padding:7px 9px 7px 14px;border-radius:8px;cursor:pointer;font:500 13px var(--ui);line-height:1.3}
.les:hover{background:var(--u2)}
.les.cur{background:rgba(56,189,248,.14);box-shadow:inset 3px 0 0 var(--accent)}
.les .st{width:18px;height:18px;border-radius:50%;border:2px solid var(--ul2);flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;color:#04121c}
.les.done .st{background:var(--ok);border-color:var(--ok)}
.les.part .st{border-color:var(--warn)}
.les .tt{flex:1}
.les small{color:var(--um);font-size:11px}
.lcol{flex:1;min-width:0;overflow:auto;padding:22px 30px 60px;scroll-behavior:smooth}
.tcol{flex:none;width:min(48%,720px);min-width:380px;display:flex;flex-direction:column;border-left:1px solid var(--ul);background:#07090e;min-height:0}
article.lesson{max-width:760px;margin:0 auto;line-height:1.72;font-size:15px}
.lhead{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.lhead .crumb{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.6px}
.lhead h1{margin:0;font-size:28px;line-height:1.2}
.lhead .meta{font-size:12.5px;color:var(--um)}
article h2{font-size:19px;margin:26px 0 8px;color:#fff;display:flex;align-items:center;gap:8px}
article h2::before{content:'';width:5px;height:19px;border-radius:3px;background:var(--accent);flex:none}
article p{margin:10px 0}
article code{font-family:var(--mono);font-size:.92em;background:#0b1626;border:1px solid var(--ul2);padding:1px 6px;border-radius:5px;color:#9bdcff}
article kbd{font-family:var(--mono);font-size:.85em;background:var(--u3);border:1px solid var(--ul2);border-bottom-width:3px;padding:1px 7px;border-radius:6px;color:#fff;white-space:nowrap}
article ul,article ol{margin:10px 0;padding-left:24px}
article li{margin:5px 0}
article table{border-collapse:collapse;width:100%;margin:14px 0;font-size:14px;display:block;overflow-x:auto}
article th,article td{border:1px solid var(--ul2);padding:7px 11px;text-align:left;vertical-align:top}
article th{background:var(--u2);color:#cfe3ff;white-space:nowrap}
article td code{white-space:nowrap}
.co{margin:14px 0;padding:11px 14px;border-radius:10px;border:1px solid;font-size:14.5px;line-height:1.6;display:flex;gap:11px}
.co .ci{font-size:18px;line-height:1.4;flex:none}
.co.tip{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.35)}
.co.warn{background:rgba(251,191,36,.09);border-color:rgba(251,191,36,.4)}
.co.ana{background:rgba(167,139,250,.09);border-color:rgba(167,139,250,.4)}
.cmdb{margin:12px 0;border:1px solid var(--ul2);border-radius:10px;overflow:hidden;background:#05080d}
.cmdb .row{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px}
.cmdb .row code{flex:1;background:transparent;border:0;font-size:15px;color:#e6f2ff;padding:0;white-space:pre-wrap;word-break:break-all}
.cmdb .row code::before{content:'> ';color:var(--accent)}
.cmdb .why{padding:7px 14px 9px;border-top:1px dashed var(--ul2);color:#a9bad2;font-size:13.5px;line-height:1.55}
.cdb{margin:12px 0}.cdb .cdh{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#161b22;border:1px solid #2b2b2b;border-bottom:0;border-radius:8px 8px 0 0;padding:6px 8px 6px 14px;font:700 12.5px var(--mono);color:#9ecbff}.cdb .cdbtn{display:flex;gap:6px}.cdb .tr{margin:0;border-radius:0 0 8px 8px}
.tr{margin:12px 0;background:#0c0c0c;color:#ccc;border-radius:8px;border:1px solid #2b2b2b;font:13px/1.45 var(--mono);padding:11px 14px;overflow-x:auto;white-space:pre}
.tr .pr{color:#cfcfcf}.tr .cm{color:#f2f2f2;font-weight:700}
.anat{margin:14px 0;background:#05080d;border:1px solid var(--ul2);border-radius:10px;padding:14px}
.anat .a-cmd{font:17px var(--mono);margin-bottom:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.anat .a-cmd span{padding:3px 8px;border-radius:6px;border:1.5px solid}
.anat .a-leg{display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.anat .a-leg div{display:flex;gap:9px;align-items:baseline}
.anat .a-leg b{font:700 12.5px var(--mono);padding:1px 7px;border-radius:5px;border:1.5px solid;white-space:nowrap}
.k-cmd{color:#7dd3fc;border-color:#7dd3fc}.k-sw{color:#fbbf24;border-color:#fbbf24}.k-arg{color:#86efac;border-color:#86efac}.k-op{color:#f0abfc;border-color:#f0abfc}.k-x{color:#fca5a5;border-color:#fca5a5}
.lnav{display:flex;gap:10px;justify-content:space-between;margin:34px 0 0;flex-wrap:wrap}
.quiz{margin-top:30px;border-top:1px solid var(--ul);padding-top:6px}
.qc{margin:14px 0;background:var(--u1);border:1px solid var(--ul);border-radius:12px;padding:14px 16px}
.qc .qq{font-weight:700;margin-bottom:9px}
.qc .qo{display:flex;flex-direction:column;gap:7px}
.qc button.o{text-align:left;background:var(--u2);border:1px solid var(--ul2);border-radius:9px;color:var(--ut);padding:9px 12px;font:500 14px var(--ui);cursor:pointer;line-height:1.45}
.qc button.o:hover:not(:disabled){border-color:var(--accent)}
.qc button.o.good{background:rgba(52,211,153,.16);border-color:var(--ok)}
.qc button.o.bad{background:rgba(248,113,113,.14);border-color:var(--err)}
.qc .qw{margin-top:9px;font-size:13.5px;color:#b9c7dc;line-height:1.55}
.finish{margin:24px 0 0;padding:16px;border-radius:12px;border:1px solid var(--ul2);background:linear-gradient(135deg,rgba(56,189,248,.1),rgba(52,211,153,.08));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.finish .ft{flex:1;min-width:200px}
/* topshiriqlar */
.tasks{flex:none;max-height:38%;overflow:auto;padding:11px 14px;border-bottom:1px solid var(--ul);background:var(--u1)}
.tasks h5{margin:0 0 8px;font-size:11px;letter-spacing:1.3px;color:var(--um);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.tasks h5 span{margin-left:auto;color:var(--accent)}
.tk{display:flex;gap:10px;padding:8px 9px;border-radius:9px;margin-bottom:5px;background:var(--u2);border:1px solid transparent;font-size:13.5px;line-height:1.5}
.tk.ok{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.35)}
.tk .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--ul2);flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#04121c}
.tk.ok .ck{background:var(--ok);border-color:var(--ok)}
.tk .tb{flex:1;min-width:0}
.tk .tb .tx{color:#e9f1ff}
.tk .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.tk .acts button{border:1px solid var(--ul2);background:var(--u3);color:var(--um);border-radius:6px;padding:2px 9px;font:600 11.5px var(--ui);cursor:pointer}
.tk .acts button:hover{color:var(--accent);border-color:var(--accent)}
.tk .hint{margin-top:6px;font-size:12.5px;color:#f5d98a;background:rgba(251,191,36,.08);border-radius:7px;padding:6px 9px}
.tk .ans{margin-top:6px;font:13px var(--mono);background:#05080d;border:1px solid var(--ul2);border-radius:7px;padding:6px 9px;color:#9bdcff;white-space:pre-wrap;word-break:break-all}
.notask{color:var(--um);font-size:13px;padding:4px 2px}
.tmid{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 10px 0}
.expl{flex:none;border-top:1px solid var(--ul);background:var(--u1)}
.expl>button{width:100%;text-align:left;border:0;background:transparent;color:var(--um);padding:8px 14px;font:700 12px var(--ui);cursor:pointer;letter-spacing:.6px;display:flex;gap:8px;align-items:center}
.expl>button:hover{color:var(--ut)}
.expl .ex-b{max-height:210px;overflow:auto;padding:2px 14px 12px;font:13px/1.55 var(--mono)}
.expl.shut .ex-b{display:none}
.ft-row{display:flex;gap:6px;align-items:center;padding:1px 4px;border-radius:5px;cursor:pointer;white-space:nowrap}
.ft-row:hover{background:var(--u3)}
.ft-row.cwd{background:rgba(56,189,248,.16);color:#fff}
.ft-row.hid{opacity:.5}
.ft-row .fi{width:18px;text-align:center}
/* ===== terminal ===== */
.tw{display:flex;flex-direction:column;min-height:0;flex:1;border-radius:9px 9px 0 0;overflow:hidden;border:1px solid #333;background:#0c0c0c;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tw-bar{flex:none;display:flex;align-items:center;gap:8px;background:#1f1f1f;padding:0 0 0 10px;height:34px;color:#ddd;font:12px var(--ui)}
.tw-ico{font:700 11px var(--mono);background:#000;border:1px solid #555;padding:0 4px;color:#ddd}
.tw-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tw-sp{flex:1}
.tw-b{border:1px solid #444;background:#2b2b2b;color:#ddd;border-radius:6px;padding:2px 9px;font:600 11.5px var(--ui);cursor:pointer;white-space:nowrap}
.tw-b:hover{background:#383838;color:#fff}
.tw-b.on{background:#7a5c00;border-color:#fbbf24;color:#fff}
.tw.is-admin .tw-bar{background:#4a3a00}
.tw-win{display:flex;height:100%}
.tw-win i{width:40px;display:flex;align-items:center;justify-content:center;font-style:normal;color:#aaa;font-size:11px}
.tw-win i:last-child:hover{background:#c42b1c;color:#fff}
.tw-screen{--tbg:#0c0c0c;--tfg:#cccccc;flex:1;min-height:0;overflow:auto;background:var(--tbg);color:var(--tfg);font:14px/1.28 var(--mono);padding:8px 10px 10px;cursor:text;scroll-behavior:auto}
.tw-out{margin:0;font:inherit;white-space:pre-wrap;word-break:break-word;display:inline}
.tw-out::after{content:''}
.tw-line{display:flex;align-items:baseline}
.tw-pp{white-space:pre;flex:none}
.tw-in{flex:1;min-width:30px;background:transparent;border:0;outline:0;color:inherit;font:inherit;padding:0;caret-color:var(--tfg)}
.tw-keys{flex:none;display:none;gap:6px;padding:6px;background:#161616}
.tw-keys button{flex:1;background:#2a2a2a;border:1px solid #444;color:#ddd;border-radius:7px;padding:7px 4px;font:600 12px var(--ui)}
@media (pointer:coarse){.tw-keys{display:flex}}
/* ===== sandbox ===== */
.sbx{flex:1;display:flex;min-width:0}
.sbx .sl{flex:none;width:300px;background:var(--u1);border-right:1px solid var(--ul);overflow:auto;padding:14px}
.sbx .sl h4{margin:14px 0 8px;font-size:11px;letter-spacing:1.3px;color:var(--um);text-transform:uppercase}
.sbx .sl h4:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--ul2);background:var(--u2);color:var(--ut);border-radius:999px;padding:4px 11px;font:600 12px var(--mono);cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.sc{font-family:var(--ui)}
.sbx .sc-d{font-size:12.5px;color:var(--um);line-height:1.5;margin:6px 0 10px}
.sbx .sm{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px;gap:0;min-height:0}
.sbx .sr{flex:none;width:300px;background:var(--u1);border-left:1px solid var(--ul);overflow:auto;padding:12px 14px;font:13px/1.55 var(--mono)}
/* ===== spravochnik ===== */
.refv{flex:1;display:flex;flex-direction:column;min-width:0}
.rtop{flex:none;display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--ul);flex-wrap:wrap;background:var(--u1)}
.rtop input[type=search],.in{background:var(--u0);border:1px solid var(--ul2);border-radius:9px;color:var(--ut);padding:8px 12px;font:14px var(--ui);min-width:200px;flex:1;max-width:420px}
.rtop input:focus,.in:focus{outline:none;border-color:var(--accent)}
.rbody{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-content:start}
.rc{background:var(--u1);border:1px solid var(--ul);border-radius:12px;padding:13px 15px;display:flex;flex-direction:column;gap:7px;min-width:0}
.rc h3{margin:0;font:700 17px var(--mono);color:#fff;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rc h3 .tag{font:600 10.5px var(--ui);padding:2px 8px;border-radius:999px;background:var(--u3);color:var(--um)}
.rc .d{color:#cfe0f5;line-height:1.55;font-size:14px}
.rc .syn{font:13px var(--mono);background:#05080d;border:1px solid var(--ul2);border-radius:7px;padding:6px 9px;color:#9bdcff;white-space:pre-wrap;word-break:break-word}
.rc table{border-collapse:collapse;font-size:12.5px;width:100%}
.rc td{padding:3px 6px;border-bottom:1px solid var(--ul);vertical-align:top}
.rc td:first-child{font-family:var(--mono);color:#fbbf24;white-space:nowrap;padding-right:12px}
.rc .exs{display:flex;flex-direction:column;gap:4px}
.rc .ex{display:flex;gap:8px;align-items:center;font-size:12.5px}
.rc .ex code{font:12.5px var(--mono);background:#05080d;border:1px solid var(--ul2);border-radius:6px;padding:2px 7px;color:#e6f2ff;cursor:pointer}
.rc .ex code:hover{border-color:var(--accent)}
.rc .ex span{color:#a9bad2}
.rc .nt{font-size:12.5px;color:#f5d98a}
.rc.err{border-left:4px solid var(--err)}
.rc.rec{border-left:4px solid var(--ok)}
.emp{color:var(--um);padding:30px;text-align:center;grid-column:1/-1}
.anbox{grid-column:1/-1;background:var(--u1);border:1px solid var(--ul);border-radius:12px;padding:16px}
/* ===== imtihon ===== */
.exv{flex:1;overflow:auto;padding:26px 20px 50px}
.exw{max-width:760px;margin:0 auto}
.exw h2{margin:0 0 8px;font-size:26px}
.exw .qc{margin:12px 0}
.bigbar{height:10px;background:var(--u3);border-radius:99px;overflow:hidden;margin:10px 0 18px}
.bigbar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#34d399);width:0;transition:width .3s}
.score{font-size:54px;font-weight:800;line-height:1}
.cert{background:#fff;color:#111;border:8px double #b8860b;border-radius:6px;padding:34px 30px;text-align:center;max-width:720px;margin:18px auto;font-family:Georgia,'Times New Roman',serif}
.cert h3{margin:0;font-size:30px;letter-spacing:3px;color:#7a5c00}
.cert .nm{font-size:34px;margin:16px 0 8px;border-bottom:2px solid #b8860b;display:inline-block;padding:0 24px;min-width:260px}
.cert p{margin:8px 0;font-size:16px;line-height:1.5}
.cert small{color:#666}
/* ===== umumiy ===== */
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);background:#0f1b2e;border:1px solid var(--accent);color:#fff;padding:9px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:13.5px;max-width:90%;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.good{border-color:var(--ok);background:#0b2a22}
.modal{position:absolute;inset:0;background:rgba(2,5,10,.75);display:flex;align-items:center;justify-content:center;z-index:70;padding:14px}

##### m1 | Tanishuv | 🚀 | CMD nima, uni qanday ochish va birinchi buyruqlar

=== 1.1 | CMD nima va u nima uchun kerak? | 7
@cwd C:\Users\Student
Salom! Bu kurs sizni **noldan boshlab** CMD (buyruq satri) bilan mustaqil ishlay oladigan darajaga olib chiqadi. Hech qanday oldindan bilim shart emas — kompyuterda sichqoncha bilan ishlay olsangiz bas.

## CMD nima?

CMD — Windows ning **matnli boshqaruv oynasi**. Odatda siz kompyuterga sichqoncha bilan «bosib» buyruq berasiz: papkani ochasiz, faylni o‘chirasiz. CMD da esa xuddi shu ishlarni **yozib** buyurasiz: klaviaturada buyruq yozasiz, Enter bosasiz, kompyuter bajaradi va javobini matn qilib qaytaradi.

~ Restoranni tasavvur qiling. Sichqoncha bilan ishlash — **menyudagi rasmga ko‘rsatib** buyurtma berish. CMD — **oshpazga to‘g‘ridan-to‘g‘ri aniq gap bilan** «ikki porsiya palov, achchiq-chuchuk, tezroq» deyish. Rasm tanishga oson, lekin gap bilan aytsangiz ko‘p murakkab va takrorlanadigan ishni bir zumda buyurib qo‘yasiz.

## Nega CMD ni bilish kerak?

- **Tezlik.** 500 ta faylning nomini sichqoncha bilan o‘zgartirish soatlar oladi, CMD da — bitta qator.
- **Avtomatlashtirish.** Buyruqlarni faylga yozib (`.bat` skript), kerak bo‘lganda bir bosishda ishga tushirasiz: zaxira nusxa olish, papkalarni tozalash.
- **Muammolarni topish va tuzatish.** Internet ishlamayaptimi? Kompyuter sekinmi? Xizmat qotdimi? Ko‘pgina diagnostika va ta’mirlash vositalari faqat CMD orqali ishlaydi.
- **Sichqonchada yo‘q imkoniyatlar.** Ba’zi sozlamalar va ma’lumotlar (masalan, aniq IP manzil, ochiq portlar) faqat buyruq bilan ko‘rinadi.
- **Kasb uchun.** Dasturchi, tizim administratori, tarmoq mutaxassisi, hatto oddiy ofis xodimi uchun ham katta ustunlik.

## Sichqoncha va CMD solishtirmasi

| | Oyna va sichqoncha (GUI) | CMD (buyruq satri) |
|---|---|---|
| Qanday ishlaydi | Bosasiz, sudrab olasiz | Yozasiz va Enter bosasiz |
| Yangi boshlovchiga | Oson | Dastlab g‘alati, keyin juda qulay |
| Ko‘p faylga bir ishni qilish | Sekin, charchatadi | Bir qator |
| Takrorlash | Har safar qo‘lda | Skriptga yozib qo‘yasiz |
| Xato qilish | Ko‘rinadi (ogohlantirish oynasi) | Ba’zan ogohlantirmaydi — ehtiyot bo‘lish kerak |

## Atamalarni ajratib olaylik

Ko‘p so‘z uchraydi, ularning ma’nosi:

- **CMD / cmd.exe / Command Prompt** — Windows ning klassik buyruq satri dasturi. Bu kurs aynan shu haqida.
- **Konsol / terminal** — buyruq yoziladigan oynaning umumiy nomi.
- **Qobiq (shell)** — yozganingizni tushunib bajaradigan dastur. CMD ning o‘zi ham bir turdagi qobiq.
- **PowerShell** — Windows dagi boshqa, kuchliroq qobiq. CMD ni bilsangiz, unga o‘tish ancha oson bo‘ladi (kursning oxirida solishtiramiz).

## Bu kurs qanday ishlaydi?

1. **Chapdagi xarita** — barcha darslar. Dars yoniga ✓ belgisi qo‘yiladi.
2. **O‘rtada** — dars matni. Ko‘k «▶ Sinash» tugmasi buyruqni o‘ng tomondagi terminalga yuboradi.
3. **O‘ngda** — haqiqiy CMD ga o‘xshab ishlaydigan **simulyator** va uning tepasida **topshiriqlar**. Topshiriq bajarilganda o‘zi ✓ bo‘ladi.
4. Dars oxirida kichik **test**. Topshiriqlar va test tugasa, dars yakunlanadi va yuqoridagi foiz oshadi.
5. Qiynalsangiz topshiriqdagi **💡 Maslahat** va **👁 Yechim** tugmalari bor. Avval o‘zingiz urinib ko‘ring!

!! Simulyator — xavfsiz poligon: bu yerda fayllarni o‘chirsangiz ham, xato qilsangiz ham haqiqiy kompyuteringizga hech narsa bo‘lmaydi. «↺ Boshidan» tugmasi hamma narsani asl holiga qaytaradi. Shuning uchun **jur’at bilan sinab ko‘ring**.

Simulyator haqiqiy CMD ning asosiy buyruqlarini deyarli aynan shunday bajaradi, javob matnlari ham haqiqiyga juda o‘xshash. Haqiqiy CMD dagi xabarlar ingliz tilida chiqadi — shuning uchun simulyatorda ham ularni inglizcha ko‘rasiz va o‘zbekcha izohini darsdan olasiz.

## Birinchi buyruq

Hozir o‘ng tomondagi terminalga quyidagini yozib Enter bosing (yoki «▶ Sinash» ni bosing):

$ echo Salom, dunyo! ::: `echo` — «aks sado»: yozganingizni ekranga chiqaradi. Eng oddiy buyruq.

@task Terminalga `echo Salom, dunyo!` deb yozing va **Enter** bosing. ::: h=Buyruq: echo, so‘ng probel, so‘ng istalgan matn. ::: a=echo Salom, dunyo! ::: ck=E.ok(/^echo\s+\S/i)
@task Endi Windows versiyasini bilish uchun `ver` yozing. ::: h=Faqat uch harf: ver ::: a=ver ::: ck=E.ok(/^ver\s*$/i)
@quiz CMD ni eng to‘g‘ri ta’riflagan javob qaysi? ::: *Buyruqlarni matn ko‘rinishida yozib kompyuterni boshqarish oynasi ::: Faqat dasturchilar uchun o‘yin dasturi ::: Internetga ulanish brauzeri ::: Fayllarni arxivlovchi dastur ::: why=CMD — buyruqlarni klaviatura orqali yozib Windows ga topshiriq beradigan matnli oyna.
@quiz Quyidagilardan qaysi biri CMD ning ustunligi? ::: Ko‘p faylga bir xil ishni bir qatorda bajarish ::: Rasmlarni chiroyli tahrirlash ::: Video o‘ynatish ::: *Takrorlanadigan ishlarni skriptga yozib avtomatlashtirish ::: why=CMD ning kuchi — tezlik va avtomatlashtirishda: bir buyruq ko‘p ishni qiladi, skript esa uni takrorlaydi.

=== 1.2 | CMD ni ochish va oyna tuzilishi | 8
@cwd C:\Users\Student
Haqiqiy kompyuteringizda CMD ni ochishning bir nechta yo‘li bor. Qaysi biri qulay bo‘lsa, shuni tanlang.

## CMD ni qanday ochamiz?

| Usul | Qadamlar |
|---|---|
| **Run oynasi (eng tez)** | [[Win]] + [[R]] bosing, `cmd` yozing, [[Enter]] |
| **Qidiruv orqali** | Start tugmasini bosib `cmd` yoki `Command Prompt` yozing va Enter |
| **Win + X menyusi** | [[Win]] + [[X]] bosing, «Terminal» yoki «Command Prompt» ni tanlang |
| **Aynan kerakli papkada (juda qulay!)** | Fayl brauzeri (Explorer) da papkani oching, tepadagi manzil qatoriga `cmd` yozing va Enter — CMD aynan shu papkada ochiladi |
| **Administrator sifatida** | Qidiruvda `cmd` yozing, **o‘ng tugma → «Run as administrator»**, yoki [[Ctrl]] + [[Shift]] + [[Enter]] |

!! Windows 11 da [[Win]]+[[X]] odatda «Windows Terminal» ni ochadi va u PowerShell bilan boshlanishi mumkin. Agar tepada «PS C:\...>» ko‘rsangiz — bu PowerShell. CMD ga o‘tish uchun shunchaki `cmd` deb yozing yoki yangi tab ochishda «Command Prompt» ni tanlang.

## Oyna tuzilishi

Oyna ochilganda quyidagiga o‘xshash matn chiqadi:

~~~out
Microsoft Windows [Version 10.0.19045.3693]
(c) Microsoft Corporation. All rights reserved.

C:\Users\Student>_
~~~

Oxirgi qator — **taklif belgisi** (prompt). U sizga ikki muhim narsani aytadi:

~~~anat
C:\Users\Student>
C:|cmd|**Disk (drayv) harfi.** Hozir qaysi diskda ekanligingiz. C: — odatda Windows o‘rnatilgan asosiy disk.
\Users\Student|arg|**Papka yo‘li.** Hozir turgan papkangiz (ya’ni «shu yerdaman» manzili).
>|op|**Taklif belgisi.** «Buyruq kutyapman» degani. Buyruqni shundan keyin yozasiz.
~~~

~ Prompt — bu navbatchining «Sizga qanday yordam bera olaman?» deyishi va siz hozir **qaysi binoning qaysi xonasida** ekaningiz. Har buyruq aynan shu «xona» uchun bajariladi.

## Administrator rejimi nima?

Oddiy CMD da siz oddiy foydalanuvchi huquqi bilan ishlaysiz: tizim fayllarini buzib bo‘lmaydi. Ba’zi buyruqlar (masalan, tizimni tekshirish `sfc`, diskni tekshirish `chkdsk`) **yuqori huquq** talab qiladi. Bunday holda CMD ni «administrator sifatida» ochish kerak. Oyna sarlavhasida **«Administrator: Command Prompt»** yozuvi chiqadi.

!! Administrator rejimida xato buyruq jiddiy zarar yetkazishi mumkin. Shuning uchun faqat zarur bo‘lganda oching va buyruqni avval tushunib oling.

## Nusxalash va qo‘yish

- Yangi Windows 10/11 da: [[Ctrl]]+[[C]] nusxa, [[Ctrl]]+[[V]] qo‘yish ishlaydi.
- Eski usul: matnni sichqoncha bilan belgilab **o‘ng tugma** bosing (nusxalaydi); bo‘sh joyda o‘ng tugma — qo‘yadi.
- [[Ctrl]]+[[C]] ba’zan buyruqni **to‘xtatadi** (keyingi darsda ko‘ramiz) — shuning uchun belgilangan matn bo‘lsagina nusxa oladi.

@task Hozir qaysi papkada turganingizni bilish uchun `cd` ni **argumentsiz** yozing. ::: h=Faqat ikki harf: cd ::: a=cd ::: ck=E.ok(/^cd\s*$/i)
@task Kompyuter nomini ko‘rsatadigan `hostname` buyrug‘ini bajaring. ::: a=hostname ::: ck=E.ok(/^hostname\s*$/i)
@task Terminal tepasidagi **🛡 Admin** tugmasini bosing (sarlavha «Administrator: …» ga o‘zgaradi), so‘ng `whoami` yozing. ::: h=Tugma terminal oynasining sarlavhasida, o‘ng tomonda. ::: a=@admin ;; whoami ::: ck=E.admin()&&E.ran(/^whoami/i)
@quiz Win+R oynasida nimani yozib CMD ni ochasiz? ::: command.exe ::: *cmd ::: terminal.bat ::: console ::: why=Win+R → cmd → Enter. Bu eng tezkor usul.
@quiz Prompt `D:\Kino>` nimani anglatadi? ::: Kompyuter D deb nomlangan ::: *Siz D diskidagi Kino papkasidasiz ::: Kino fayli ochiq ::: D buyrug‘i bajarilmoqda ::: why=Prompt — hozirgi disk va papka manzili. `D:` disk, `\Kino` — shu diskdagi papka.
@quiz Qaysi usul CMD ni aynan kerakli papkada ochadi? ::: Win+X ::: Start menyusidan qidirish ::: *Explorer manzil qatoriga cmd yozib Enter bosish ::: Task Manager ::: why=Papka oynasining manzil qatoriga `cmd` yozilsa, CMD o‘sha papkada ochiladi — vaqtni tejaydi.

=== 1.3 | Birinchi buyruqlar | 9
@cwd C:\Users\Student
Endi eng kerakli «boshlang‘ich» buyruqlar bilan tanishamiz. Har birini terminalda o‘zingiz sinab ko‘ring.

## ECHO — matn chiqarish

$ echo Salom ::: Yozganingizni ekranga chiqaradi.
$ echo Bugun yaxshi kun! ::: Probellar bilan ko‘p so‘z ham bo‘ladi.
$ echo. ::: Nuqta bilan — bo‘sh qator chiqaradi (chiroyli ajratish uchun).

~~~anat
echo Salom
echo|cmd|**Buyruq** — «ekranga chiqar».
Salom|arg|**Argument** — nimani chiqarish kerakligi.
~~~

## CLS — ekranni tozalash

$ cls ::: «Clear Screen». Eski yozuvlar yo‘qoladi, ekran toza bo‘ladi. Ma’lumot yo‘qolmaydi — faqat ko‘rinish tozalanadi.

## VER — Windows versiyasi

$ ver ::: Windows ning versiya raqamini ko‘rsatadi.

## DATE va TIME — sana va vaqt

$ date /t ::: Bugungi sana. `/t` («tell») — faqat ko‘rsat, o‘zgartirishni so‘rama.
$ time /t ::: Hozirgi vaqt.

!! `/t` ni unutsangiz, CMD «Yangi sana kiriting» deb so‘raydi. Hech narsa yozmay Enter bosing — sana o‘zgarmaydi.

## TITLE va COLOR — oynani sozlash

$ title Mening birinchi oynam ::: Oyna sarlavhasini o‘zgartiradi.
$ color 0a ::: Rangni o‘zgartiradi: birinchi raqam — fon, ikkinchi — matn rangi. `0a` = qora fon, och yashil matn (xakerlar uslubi 😄).
$ color ::: Argumentsiz — asl ranglarga qaytaradi.

| Raqam | Rang | Raqam | Rang |
|---|---|---|---|
| 0 | Qora | 8 | Kulrang |
| 1 | Ko‘k | 9 | Och ko‘k |
| 2 | Yashil | A | Och yashil |
| 4 | Qizil | C | Och qizil |
| 6 | Sariq | E | Och sariq |
| 7 | Oq (odatiy) | F | Yorqin oq |

## HELP — yordam

$ help ::: Barcha asosiy buyruqlar ro‘yxati (qisqa izoh bilan).

! Buyruqlarni **katta yoki kichik harf** bilan yozishingiz mumkin: `DIR`, `dir`, `Dir` — hammasi bir xil.

@task Ekranni `cls` bilan tozalang. ::: a=cls ::: ck=E.ok(/^cls\s*$/i)
@task Sarlavhani o‘zgartiring: `title Mening oynam` ::: h=title, probel, yangi nom. ::: a=title Mening oynam ::: ck=E.title()==='Mening oynam'
@task Rangni yashil matn qilib o‘zgartiring: `color 0a` ::: a=color 0a ::: ck=E.ran(/^color\s+0?a\s*$/i)
@task Bugungi sanani `date /t` bilan chiqaring. ::: a=date /t ::: ck=E.ok(/^date\s+\/t\s*$/i)
@quiz `cls` buyrug‘i nima qiladi? ::: Fayllarni o‘chiradi ::: *Ekrandagi yozuvlarni tozalaydi ::: Kompyuterni o‘chiradi ::: Rangni qora qiladi ::: why=cls — Clear Screen. Faqat ko‘rinishni tozalaydi, hech narsa o‘chmaydi.
@quiz `color 0a` da `a` nimani bildiradi? ::: Fon rangi ::: *Matn rangi (och yashil) ::: Shrift o‘lchami ::: Sarlavha ::: why=Birinchi raqam/harf — fon, ikkinchisi — matn rangi.
@quiz `date /t` da `/t` nima uchun kerak? ::: Sanani o‘chirish uchun ::: Sanani o‘zgartirish uchun ::: *Faqat ko‘rsatish uchun, o‘zgartirishni so‘ramasdan ::: Tarmoq sanasi uchun ::: why=`/t` bo‘lmasa CMD yangi sana so‘raydi; `/t` bilan faqat bugungi sana ko‘rsatiladi.

=== 1.4 | Buyruq tuzilishi va yordam olish | 8
@cwd C:\Users\Student
Har bir buyruq bir xil qoidaga bo‘ysunadi. Uni tushunsangiz, **hech qachon ko‘rmagan buyrug‘ingizni ham** o‘qiy olasiz.

## Buyruqning uch qismi

~~~anat
dir /b C:\Users
dir|cmd|**Buyruq** — nima qilish kerak («papka ichini ko‘rsat»).
/b|sw|**Kalit** (switch, parametr) — buyruqning qanday ishlashini o‘zgartiradi. Doim `/` bilan boshlanadi. Bu yerda: «faqat nomlarni, ixcham ko‘rsat».
C:\Users|arg|**Argument** — buyruq nimaga nisbatan ishlashi (qaysi papka, qaysi fayl).
~~~

~ Oshpazga: «**Pishir** (buyruq) **qovurib** (kalit) **go‘shtni** (argument)». Buyruq — fe’l, kalit — qanday, argument — nimani.

- Qismlar **probel** bilan ajratiladi.
- Kalitlar odatda `/` bilan yoziladi (ba’zi tashqi dasturlarda `-` ham bo‘ladi, masalan `ping -n 2`).
- Bir buyruqda bir nechta kalit bo‘lishi mumkin: `dir /s /b` yoki ixchamroq `dir /sb` emas — `/s /b` deb alohida yozing.

## Probelli yo‘llar — qo‘shtirnoq

Papka nomida probel bo‘lsa, CMD uni ikki so‘z deb o‘ylaydi. Shuning uchun **qo‘shtirnoq** ichiga oling:

$ dir "C:\Program Files" ::: Qo‘shtirnoqsiz `dir C:\Program Files` xato beradi: CMD «C:\Program» va «Files» ni alohida o‘qiydi.

! Qoida: **shubha bo‘lsa — qo‘shtirnoqqa oling.** Zarar qilmaydi.

## O‘zingiz yordam olishni o‘rganing

Har qanday buyruq haqida ma’lumotni **uning o‘zidan** olish mumkin:

$ dir /? ::: Istalgan buyruqdan keyin `/?` yozilsa, uning yordami chiqadi.
$ help copy ::: Xuddi shu natijani beradi: `help buyruq`.

Haqiqiy CMD yordami inglizcha va uzun bo‘ladi (bu simulyatorda yordam o‘zbekcha va qisqartirilgan), shuning uchun quyidagi **o‘qish tartibini** eslab qoling:

1. Eng yuqoridagi bir qator — buyruq nima qilishi.
2. **Sintaksis** qatori — buyruq qanday yoziladi. `[ ]` ichidagi narsa — **ixtiyoriy**.
3. Kalitlar ro‘yxati — har kalit nima qilishi.

~~~out
Displays a list of files and subdirectories in a directory.

DIR [drive:][path][filename] [/A[[:]attributes]] [/B] [/S] ...
~~~

Bu yerda `[drive:][path][filename]` — hammasi ixtiyoriy, ya’ni `dir` ni o‘zini ham yozsa bo‘ladi.

## Xato xabarlari bilan do‘stlashing

Xato — dushman emas, **maslahatchi**. Eng ko‘p uchraydigan ikkitasi:

~~~out
C:\Users\Student>dirr
'dirr' is not recognized as an internal or external command,
operable program or batch file.
~~~

«Bunday buyruq topilmadi» — ko‘pincha **imlo xatosi**. Yana:

~~~out
C:\Users\Student>cd Nomavjud
The system cannot find the path specified.
~~~

«Ko‘rsatilgan yo‘l topilmadi» — papka nomi noto‘g‘ri yoki boshqa joyda.

@task Probelli yo‘lni to‘g‘ri yozing: `dir "C:\Program Files"` ::: h=Yo‘lni qo‘shtirnoq ichiga oling. ::: a=dir "C:\Program Files" ::: ck=E.ok(/^dir\s+"C:\\Program Files"\s*$/i)
@task `dir` buyrug‘ining yordamini oling: `dir /?` ::: a=dir /? ::: ck=E.ok(/^dir\s+\/\?\s*$/i)

## Eng muhim tugmalar

|---|---|
| [[↑]] va [[↓]] | Oldin yozgan buyruqlaringiz ro‘yxati bo‘ylab yuradi — qayta yozish shart emas |

| [[Home]] / [[End]] | Kursorni qator boshiga / oxiriga olib boradi |
| [[Ctrl]]+[[←]] / [[→]] | Kursorni so‘zma-so‘z siljitadi |
| [[F7]] | Oldingi buyruqlar ro‘yxatini oynada ko‘rsatadi |
| [[F3]] | Oxirgi buyruqni qayta yozadi |

Tasavvur qiling, papkangizning nomi `Documents`. Hammasini yozish o‘rniga `Doc` yozib [[Tab]] bosasiz — CMD qolganini o‘zi yozadi. Bir nechta moslik bo‘lsa, [[Tab]] ni qayta-qayta bossangiz, ular birma-bir chiqadi.

! Tab nafaqat tezlik beradi, balki **imlo xatosining oldini oladi** va fayl nomlarini eslab o‘tirmaslikka yordam beradi.

Ba’zi buyruqlar o‘zi tugamaydi (masalan, to‘xtovsiz ping). Yoki siz xato buyruq yuborib qo‘ydingiz. Hamma holatda: [[Ctrl]]+[[C]] bosing.

$ ping -t 8.8.8.8 ::: `-t` — to‘xtovsiz ping. Bir necha javob chiqqach [[Ctrl]]+[[C]] bosing — statistika chiqadi va to‘xtaydi.

$ doskey /history ::: Shu oyna ochilganidan beri yozgan barcha buyruqlaringiz ro‘yxati.

=== 2.1 | Fayl, papka, disk va yo‘l | 9
@cwd C:\Users\Student
CMD bilan ishlashning 80% i — **fayllar va papkalar** bilan ishlash. Avval ular qanday joylashganini tushunib olamiz. Bu dars — butun kursning poydevori, shoshilmay o‘qing.

## Uchta asosiy tushuncha

- **Fayl** — ma’lumot saqlaydigan bitta narsa: matn, rasm, qo‘shiq, dastur. Nomi va **kengaytmasi** bor: `hisobot.docx` (kengaytma — nuqtadan keyingi `docx`, fayl turini bildiradi).
- **Papka (katalog, directory)** — fayllar va boshqa papkalarni saqlaydigan «quti».
- **Disk (drayv)** — hamma papka va fayllarni saqlaydigan eng katta «ombor»: `C:`, `D:` va hokazo.

~ Kutubxonani tasavvur qiling. **Disk** — butun bino. **Papka** — javonlar va javon ichidagi tokchalar. **Fayl** — tokchadagi kitob. Kitobni topish uchun «Bino → javon → tokcha → kitob» yo‘lini aytasiz. Kompyuterda bu yo‘l **path** deb ataladi.

## Daraxt ko‘rinishi

Quyida bizning mashq kompyuterimiz tuzilishining bir qismi:

~~~out
C:\
├── Users
│   └── Student          <-- siz shu yerdasiz
│       ├── Desktop
│       ├── Documents
│       │   ├── notes.txt
│       │   └── Loyihalar
│       ├── Downloads
│       └── Pictures
├── Windows
└── Program Files
D:\
├── Kino
└── Hujjatlar
~~~

## Yo‘l (path) qanday yoziladi

Yo‘l — papkalar nomi, ular orasida **teskari chiziq** `\` (backslash):

~~~anat
C:\Users\Student\Documents\notes.txt
C:|cmd|**Disk.** Qaysi diskdan boshlanishi.
\Users|sw|**Birinchi papka.** Har `\` — «ichiga kir» degani.
\Student|sw|**Ichidagi papka.**
\Documents|sw|**Yana ichidagi papka.**
\notes.txt|arg|**Fayl** — yo‘lning oxirgi qismi.
~~~

!! Teskari chiziq `\` va oddiy `/` ni adashtirmang! Windows yo‘llarida `\` ishlatiladi. `/` esa kalitlarni boshlaydi (`dir /s`). Klaviaturada `\` odatda Enter ustida, yoki [[Shift]]+[[/]] qatorida bo‘ladi.

## Ikki xil yo‘l: to‘liq va nisbiy

| Tur | Qanday | Misol (siz C:\Users\Student da turibsiz) |
|---|---|---|
| **To‘liq (absolyut)** | Diskdan boshlanadi, qayerda turishingizga bog‘liq emas | `C:\Users\Student\Documents` |
| **Nisbiy** | Hozirgi papkadan boshlanadi | `Documents` |

Nisbiy yo‘lda ikkita maxsus belgi bor:

- `.` (bitta nuqta) — **shu papkaning o‘zi**
- `..` (ikkita nuqta) — **bir daraja yuqoridagi** papka (ota-papka)

Masalan, `C:\Users\Student` dan `..` — bu `C:\Users`; `..\..` — `C:\`.

! Hozir qaysi papkadaligingizni bilish uchun prompt ga qarang yoki `cd` ni yozing. Adashib qolsangiz — `cd \` sizni diskning ildiziga qaytaradi.

## Kengaytmalar

| Kengaytma | Nima |
|---|---|
| `.txt` | Oddiy matn |
| `.docx` | Word hujjati |
| `.jpg`, `.png` | Rasm |
| `.mp3`, `.mp4` | Qo‘shiq, video |

@task Bir daraja yuqoriga chiqing (ota-papkaga). ::: h=Ikkita nuqta. ::: a=cd .. ::: ck=E.cwdIs('C:\\Users\\Student')

=== 2.2 | cd: papkalar orasida yurish | 9
@cwd C:\Users\Student
`cd` («change directory») — CMD dagi **eng ko‘p ishlatiladigan** buyruq. U sizni papkadan papkaga ko‘chiradi.

## Asosiy ko‘rinishlari

$ cd ::: Argumentsiz — hozirgi papka yo‘lini ko‘rsatadi.
$ cd Documents ::: Hozirgi papka ichidagi `Documents` ga kiradi.
$ cd .. ::: Bir daraja yuqoriga chiqadi.
$ cd ..\.. ::: Ikki daraja yuqoriga chiqadi.
$ cd \ ::: Diskning ildizi (C:\) ga o‘tadi.
$ cd C:\Windows ::: To‘liq yo‘l bilan to‘g‘ridan-to‘g‘ri sakraydi.
$ cd Documents\Loyihalar ::: Bir buyruqda bir necha papka ichkariga.

! Misollarni ketma-ket bossangiz papka o‘zgarib boradi. Adashsangiz `cd /d C:\Users\Student` bilan boshiga qayting.

! Katta-kichik harf farq qilmaydi: `cd documents` ham ishlaydi. Papka nomining boshini yozib [[Tab]] bosing — qolganini o‘zi to‘ldiradi!

## Boshqa diskka o‘tish — ikki usul

Diskka o‘tish uchun faqat `cd` yetmaydi! Eng ko‘p xato shu yerda:

$ D: ::: Diskni almashtirish — faqat harf va ikki nuqta, `cd` kerak emas.
$ cd /d D:\Kino ::: `/d` kaliti disk **va** papkani bir yo‘la almashtiradi.

!! Agar C: da turib `cd D:\Kino` desangiz, CMD D: diskning «joriy papkasini» o‘zgartiradi, lekin **siz C: da qolasiz**. Buning uchun `/d` kalitini yozing yoki avval `D:` ni yozing.

## Probelli nomlar

$ cd "C:\Program Files" ::: Probel bor — qo‘shtirnoq kerak.

## Xatolar

~~~out
C:\Users\Student>cd Nomavjud
The system cannot find the path specified.
~~~

Demak papka nomi xato yoki siz boshqa joydasiz. Avval `dir` bilan nima borligini ko‘ring.

## pushd va popd — «xatcho‘p» sifatida

Ba’zan bir joyga borib, ishni tugatib, **aynan avvalgi joyga qaytish** kerak bo‘ladi:

$ pushd C:\Windows ::: Hozirgi joyni eslab qoladi va C:\Windows ga o‘tadi.
$ popd ::: Eslab qolingan joyga qaytaradi.

~ Kitobga xatcho‘p qo‘yib, boshqa bobga o‘tib, keyin xatcho‘pdan aniq o‘sha betga qaytish kabi.

## Eng foydali kalitlar

| Buyruq | Nima qiladi |
|---|---|

Ko‘p faylni bir yo‘la tanlash uchun maxsus belgilar:

- `*` — **istalgan miqdordagi** istalgan belgilar

Har bir buyruq: ma’lumot **oladi** (kirish), natija **chiqaradi** (chiqish) va xato **xabar** beradi (xato oqimi). Odatda hammasi sizning ekraningiz va klaviaturangiz.

|---|---|

=== 4.4 | Buyruqlarni birlashtirish: &, &&, || | 7
@cwd C:\Users\Student
Bir qatorga bir nechta buyruq yozish mumkin. Ularni ajratish usuliga qarab, natija **boshqacha** bo‘ladi.

## Uch ulagich

| Belgi | Ma’nosi | Misol |
|---|---|---|
| `&` | Ikkinchisi **har holda** bajariladi | `cd Documents & dir` |
| `&&` | Ikkinchisi **faqat birinchi muvaffaqiyatli bo‘lsa** | `mkdir Yangi && cd Yangi` |
| `\|\|` | Ikkinchisi **faqat birinchi xato bo‘lsa** | `cd Nomavjud \|\| echo Topilmadi` |

$ echo Birinchi & echo Ikkinchi ::: `&` — ikkalasi ketma-ket.
$ mkdir Yangi && cd Yangi ::: Papka yaratilsa — ichiga kiradi. Yaratilmasa — `cd` bajarilmaydi.
$ cd Nomavjud || echo Bunday papka yo‘q! ::: Birinchi xato bergani uchun ikkinchisi ishlaydi.
$ cd Yangi && echo OK || echo Xato ::: Birgalikda: muvaffaqiyatli bo‘lsa «OK», aks holda «Xato».

~ `&&` — «agar muvaffaqiyatli bo‘lsa, **keyin** …». `||` — «aks holda, …». `&` — «va keyin ham, nima bo‘lishidan qat’i nazar».

## Qaysi foydali?

- **Ehtiyot uchun**: `cd Papka && del *.tmp` — agar `cd` xato bersa, `del` bajarilmaydi. Aks holda `del *.tmp` **noto‘g‘ri papkada** ishlab ketishi mumkin edi!
- **Xabar berish**: `copy a.txt D:\ && echo Nusxa olindi || echo Xato yuz berdi`.

!! Quvur belgisi bilan chalkashtirmang: `|` — bitta vertikal chiziq (ma’lumot uzatish), `||` — ikkita (xatolik bo‘lsa).

## Errorlevel — «buyruq muvaffaqiyatli bo‘ldimi?»

Har buyruq tugagach **chiqish kodi** qoldiradi: **0** — muvaffaqiyat, **0 dan farqli** — xato. `&&` va `||` aynan shuni tekshiradi. Uni ko‘rish uchun:

$ cd Nomavjud ::: Xato.
$ echo %errorlevel% ::: Oxirgi buyruq kodini ko‘rsatadi (`0` emas).

## Tashxis algoritmi

Doim shu tartibda — **ichkaridan tashqariga**:

1. Kompyuter o‘zida tarmoq bormi? → `ipconfig` (IP, gateway bormi?)
2. Router bilan aloqa? → `ping 192.168.1.1`
3. Internetning o‘zi bormi? → `ping 8.8.8.8`
4. Nom bo‘yicha ishlayaptimi? → `ping google.com`

Har qadamda natijani baholaymiz.

## Qadam-baqadam

Bosqich 1–3 ni bajarib ko‘ring:

$ ipconfig ::: IP va gateway bor.
$ ping -n 2 192.168.1.1 ::: Router javob beryapti.
$ ping -n 2 8.8.8.8 ::: Internet **ishlayapti**!
$ ping -n 2 google.com ::: Lekin nom bo‘yicha — xato!

## Keltirib chiqarib ko‘ramiz

$ dirr ::: «not recognized» — imlo xatosi.
$ cd Nomavjud ::: «cannot find the path».
$ type nomavjud.txt ::: «cannot find the file».
$ del C:\Windows\win.ini ::: «Access is denied» — tizim fayli himoyalangan.
$ mkdir ::: «syntax of the command is incorrect» — argument yetishmaydi.
$ dir *.xyz ::: «File Not Found» — mos fayl yo‘q.
$ rmdir Documents ::: «directory is not empty».
$ mkdir Documents ::: «already exists» — bunday papka allaqachon bor.

## Xato bilan ishlash tartibi

1. **O‘qing** — xabarning asosiy so‘zlarini: *path / file / access / syntax*.
2. **Gumon qiling** — odatda 80% hollarda: imlo, noto‘g‘ri yo‘l, probel/qo‘shtirnoq.
3. **Tekshiring** — `dir` (nima bor?), `cd` (qayerdaman?), `echo %CD%`.
4. **Yordam oling** — `buyruq /?`.
5. **Googleda qidiring** — xato matnini **qo‘shtirnoqda** aynan nusxalab (masalan: `"is not recognized as an internal or external command"`).

! Xato xabarini **nusxalab** qidirish — dasturchilarning kundalik odati. Uyalmang.

=== 8.2 | Xavfli buyruqlar va xavfsiz ishlash qoidalari | 9

CMD — kuchli vosita. Kuch bilan birga mas’uliyat keladi: bitta noto‘g‘ri buyruq **butun papkani** o‘chirib yuborishi mumkin va **savat yo‘q** — qaytarib bo‘lmaydi. Bu darsda xavfsiz ishlash qoidalarini o‘rganamiz.

## Eng xavfli buyruqlar

| Buyruq | Xavf |
|---|---|
| `del /s /q *.*` | Papka va ichki papkalardagi **hamma** fayllarni jimgina o‘chiradi |
| `rmdir /s /q papka` | Papkani ichi bilan **butunlay** o‘chiradi |
| `format D:` | Diskni **tozalaydi** (barcha ma’lumot yo‘qoladi) |
| `robocopy A B /mir` | B ni A ga o‘xshatadi: B dagi ortiqchalarni **o‘chiradi** |
| `diskpart` → `clean` | Butun diskni **butunlay** tozalaydi |
| `>` bilan yozish | Mavjud faylni **ustidan yozib** yuboradi |
| `taskkill /f /im ...` | Dasturni saqlamasdan yopadi |
| `reg delete ...` | Reyestrdan yozuv o‘chiradi — Windows buzilishi mumkin |
| Noma’lum skriptni ishga tushirish | Ichida nima borligini bilmaysiz! |

## 7 ta oltin qoida

1. **Avval ko‘ring, keyin o‘chiring.** `del *.tmp` dan oldin `dir *.tmp`.
2. **Qayerda turganingizni biling.** O‘chirishdan oldin `cd` yoki `echo %CD%`. Ayniqsa `C:\` va `Users` yaqinida ehtiyot bo‘ling.
3. **To‘liq yo‘l bering.** `del *.*` ga qaraganda `del C:\Temp\*.tmp` xavfsizroq.
4. **Oldin zaxira oling.** Muhim ma’lumotni o‘zgartirishdan oldin nusxa qiling.
5. **Sinov papkasida mashq qiling.** Yangi buyruqni muhim fayllarda emas, `C:\Temp\sinov` kabi joyda sinang.
6. **Tushunmagan buyruqni ishga tushirmang.** Internetdan topilgan buyruqni so‘zma-so‘z o‘qing, `/?` bilan tekshiring.
7. **Admin huquqini kamdan-kam ishlating.** Faqat kerak bo‘lganda.

!! **Firibgarlik haqida:** ba’zi saytlar yoki «texnik xodimlar» sizga «CMD ni oching va shu buyruqni yozing» deb aytadi — aslida u parolingizni o‘g‘irlaydi yoki fayllaringizni shifrlaydi. **Hech qachon** ishonchsiz manbadan olingan buyruq yoki `.bat` faylni ishga tushirmang. Ayniqsa `powershell -enc ...`, `curl ... | cmd` kabi tushunarsiz uzun satrlarni.

## Xavfsiz o‘chirish — amalda

`C:\Temp` papkasida mashq qilamiz. Birinchi `echo` bilan «quruq yurish» (dry run):

$ cd /d C:\Temp ::: Avval joyni belgilab oling.
$ dir *.tmp ::: Ko‘rish.
$ echo del *.tmp ::: **Hech narsa o‘chmaydi** — faqat qanday buyruq bajarilishi ko‘rinadi. «Quruq yurish».

## «Sinov» papkasi bilan ishlash

$ mkdir C:\Temp\sinov ::: Mashq maydoni.
$ copy C:\Temp\*.tmp C:\Temp\sinov ::: Nusxa oling.
$ del C:\Temp\sinov\*.tmp ::: Endi nusxada sinab ko‘rdingiz — asl fayllar xavfsiz.

~ Haydovchi darsi: avval maydonchada mashq qiling, keyin ko‘chaga chiqing.

@task `cd /d C:\Temp` bilan sinov joyiga o‘ting. ::: a=cd /d C:\Temp ::: ck=E.cwdIs('C:\\Temp')
@task O‘chirishdan oldin `dir *.tmp` bilan ko‘ring va «quruq yurish» qiling: `echo del *.tmp` ::: h=Avval dir, keyin echo del. ::: a=dir *.tmp ;; echo del *.tmp ::: ck=E.ran(/^dir\s+\*\.tmp/i)&&E.ran(/^echo\s+del\s+\*\.tmp/i)&&E.exists('C:\\Temp\\a.tmp')
@task `C:\Temp\sinov` yarating, `.tmp` fayllarni unga nusxalang va **faqat nusxani** o‘chiring. ::: h=mkdir, copy, del — hammasi sinov papkasida. ::: a=mkdir C:\Temp\sinov ;; copy C:\Temp\*.tmp C:\Temp\sinov ;; del C:\Temp\sinov\*.tmp ::: ck=E.isDir('C:\\Temp\\sinov')&&E.names('C:\\Temp\\sinov').length===0&&E.exists('C:\\Temp\\a.tmp')
@quiz O‘chirishdan oldin qaysi odat eng xavfsiz? ::: Bir marta Enter bosish ::: *Avval `dir` bilan ko‘rish yoki `echo` bilan «quruq yurish» ::: Admin sifatida ishlatish ::: /q qo‘shish ::: why=Ko‘rib tekshirish xatoni oldindan fosh qiladi.
@quiz Internetdan topilgan tushunarsiz buyruqni nima qilasiz? ::: Darhol ishga tushiraman ::: Admin bilan ishga tushiraman ::: *Ishga tushirmayman — avval tushunib olaman yoki ishonchli odamdan so‘rayman ::: Do‘stlarimga yuboraman ::: why=Firibgarlar ko‘pincha «shu buyruqni yozing» deb zararli kod beradi.
@quiz `format D:` nima qiladi? ::: Diskni tekshiradi ::: *Diskni tozalaydi — ichidagi hamma ma’lumot yo‘qoladi ::: Diskni tezlashtiradi ::: Nomini o‘zgartiradi ::: why=Formatlash — diskni bo‘shatish.

##### m9 | Kengaytirilgan bilimlar | 🚀 | CMD, PowerShell va Terminal; professional usullar

=== 9.1 | CMD, PowerShell va Windows Terminal | 8
@cwd C:\Users\Student
Zamonaviy Windows da bir nechta «buyruq oynasi» bor. Ular nima farq qilishini bilib olsangiz, adashmaysiz.

## Uchtasi

| Nom | Nima | Qachon |
|---|---|---|
| **CMD (Command Prompt)** | Klassik buyruq satri (40+ yillik tarix) | Oddiy ishlar, eski skriptlar (.bat), tezkor buyruqlar |
| **PowerShell** | Zamonaviy, kuchli qobiq: buyruqlar **matn emas, ob’ekt** qaytaradi | Murakkab avtomatlashtirish, tizim boshqaruvi, serverlar |
| **Windows Terminal** | Hozirgi oyna (konteyner): ichida CMD, PowerShell, Linux (WSL) ni **tab**lar bilan ochadi | Qulay ish muhiti: chiroyli, ko‘p tab, nusxalash/qo‘yish oson |

~ Windows Terminal — **uy** (oyna), CMD va PowerShell — undagi turli **xonalar** (qobiqlar).

## Qanday farqlash mumkin?

Prompt ga qarang:

- `C:\Users\Student>` — **CMD**
- `PS C:\Users\Student>` — **PowerShell** (boshida PS)

CMD dan PowerShell ga o‘tish: `powershell`. Qaytish: `exit`. PowerShell dan CMD ga: `cmd`.

## Mashhur buyruqlarning PowerShell ekvivalentlari

PowerShell da ko‘p CMD buyruqlari **ishlaydi** (ular aliaslar), lekin asl nomlari boshqa:

| CMD | PowerShell | Nima qiladi |
|---|---|---|
| `dir` | `Get-ChildItem` (qisqa: `ls`, `gci`) | Papka ichi |
| `cd` | `Set-Location` (`cd`) | Papkaga o‘tish |
| `type` | `Get-Content` (`cat`) | Fayl ichini ko‘rish |
| `copy` | `Copy-Item` (`cp`) | Nusxalash |
| `move` | `Move-Item` (`mv`) | Ko‘chirish |
| `del` | `Remove-Item` (`rm`) | O‘chirish |
| `echo` | `Write-Output` (`echo`) | Chiqarish |
| `cls` | `Clear-Host` (`cls`) | Ekranni tozalash |
| `tasklist` | `Get-Process` | Jarayonlar |
| `taskkill` | `Stop-Process` | Jarayonni to‘xtatish |
| `ipconfig` | `Get-NetIPConfiguration` (ipconfig ham ishlaydi) | IP sozlamalari |
| `find` / `findstr` | `Select-String` (`sls`) | Matn qidirish |

## Nima uchun hali ham CMD ni o‘rganish kerak?

- Hamma Windows kompyuterida **bor** va ishlaydi.
- Ko‘plab eski skriptlar, o‘rnatuvchilar, ko‘rsatmalar aynan CMD uchun.
- `ping`, `ipconfig`, `tracert`, `netstat` kabi vositalar ikkalasida bir xil.
- CMD ni bilsangiz, **PowerShell ga o‘tish juda oson** bo‘ladi.

! Yo‘l-yo‘riq: kundalik ish va oddiy skriptlar uchun CMD yetarli. Katta avtomatlashtirish yoki server boshqaruvi kerak bo‘lsa, PowerShell o‘rganing.

## Windows Terminal ni sozlash (ixtiyoriy)

- Microsoft Store dan «Windows Terminal» ni o‘rnating (Windows 11 da tayyor).
- `Ctrl+Shift+T` — yangi tab, `Ctrl+Shift+W` — yopish.
- Sozlamalar (Ctrl+,) da shrift, rang va boshlang‘ich profilni (masalan, CMD) tanlang.

@task `powershell` buyrug‘ini yozib ko‘ring (simulyatorda u faqat tushuntirish chiqaradi). ::: a=powershell ::: ck=E.ran(/^powershell/i)
@task PowerShell dagi `Get-ChildItem` ning CMD dagi ekvivalenti: `dir` — uni bajaring. ::: a=dir ::: ck=E.ok(/^dir\s*$/i)
@quiz `PS C:\Users\Student>` nimani bildiradi? ::: CMD ::: *PowerShell ::: Terminal sozlamalari ::: Xato ::: why=Boshidagi «PS» — PowerShell belgisi.
@quiz PowerShell dagi `Get-ChildItem` ning CMD dagi analogi? ::: type ::: *dir ::: copy ::: tasklist ::: why=Ikkalasi ham papka ichini ko‘rsatadi.
@quiz Windows Terminal nima? ::: Yangi qobiq ::: Antivirus ::: *CMD, PowerShell va boshqalarni tablarda ochadigan zamonaviy oyna ::: Brauzer ::: why=U qobiq emas — qobiqlar uchun konteyner.

=== 9.2 | Professional usullar va birlashtirilgan bir qatorlar | 11
@cwd C:\Users\Student
Hozirgacha o‘rganganlaringizni **birlashtirib**, kuchli «bir qatorli» buyruqlar yozamiz. Professionallar aynan shunday ishlaydi.

## Aqlli bir qatorlar

$ dir /s /b *.jpg | find /c /v "" ::: Hamma jpg fayllarni **sanaydi** (papka va ichki papkalarda). Bu yerda `find /c /v ""` — «bo‘sh matn yo‘q bo‘lgan qatorlar soni» = qatorlar soni.
$ dir /b /s | findstr /i "plan" ::: Nomida «plan» bor fayllarni toping.
$ dir /s /b *.txt > C:\Temp\txtlar.txt ::: Hamma .txt fayllar ro‘yxatini faylga yozing.
$ tree /f /a > C:\Temp\tuzilma.txt ::: Papka tuzilmasini faylga saqlang.
$ systeminfo | findstr /i "os.name total.physical" ::: Ikki qatorni birdan: OS nomi va RAM.
$ type Documents\notes.txt | find /i "imtihon" ::: Fayl ichidan qidirish.

## Ma’lumotni nusxalash

$ dir /b | clip ::: Ro‘yxatni buferga — keyin Word ga yoki Telegramga qo‘yasiz.
$ ipconfig | find "IPv4" | clip ::: Faqat IP manzilingizni buferga.

## Papka ichini nusxalab zaxira olish

$ xcopy %USERPROFILE%\Documents D:\Backup\Docs /s /e /i /y ::: Hujjatlarni zaxiralash.

## Doskey — o‘z buyruqlaringiz

$ doskey tp=type $1 ^| more ::: `tp fayl` — fayl ichini sahifalab ko‘rsatadi (`$1` — birinchi argument).
$ doskey ip=ipconfig ^| find "IPv4" ::: `ip` yozsangiz IP manzil chiqadi.
$ ip ::: Sinab ko‘ring!

## Foydali yorliqlar

| Nima | Qanday |
|---|---|
| Oynani tezda yopmasdan buyruq bajarish | `cmd /k buyruq` — buyruqni bajarib, oyna ochiq qoladi |
| Buyruqni bajarib oynani yopish | `cmd /c buyruq` |
| Joriy papkani Explorer da ochish | `start .` |
| Joriy papkani Notepad da... | `notepad fayl.txt` |
| Uzun buyruqni ikki qatorga bo‘lish (skriptda) | Qator oxiriga `^` qo‘yish |
| Buyruqlar ro‘yxati | `help` |
| Qaysi buyruq nima qilishini bilish | `buyruq /?` |

## Qaysi kalitlar bor — qanday topish

Har qanday yangi buyruq uchun: **`buyruq /?`**. Masalan:

$ robocopy /? ::: robocopy ning barcha kalitlari.
$ findstr /? ::: findstr haqida.

!! Maxsus belgilarni (`| & > <`) `doskey` makrosida yoki `echo` da yozish uchun oldiga `^` qo‘yiladi: `^|`, `^&`, `^>`.

## Keyingi qadamlar

Kursni tugatgach, quyidagilarni o‘rganing:
- **PowerShell** — murakkab avtomatlashtirish uchun.
- **Vazifalar rejalashtiruvchisi (schtasks)** — skriptlarni jadval bo‘yicha o‘zi ishga tushirish.
- **WSL (Linux Windows ichida)** — dasturchilar uchun.

@task Hamma `.jpg` fayllar sonini toping: `dir /s /b *.jpg | find /c /v ""` (avval `cd /d C:\Users\Student`). ::: h=Avval Student papkasiga o‘ting. ::: a=dir /s /b *.jpg | find /c /v "" ::: ck=E.outOf(/^dir\s+\/s\s+\/b\s+\*\.jpg\s*\|\s*find\s+\/c\s+\/v\s+""/i,/^5\s*$/m)
@task Hamma `.txt` fayllar ro‘yxatini `C:\Temp\txtlar.txt` ga yozing. ::: a=dir /s /b *.txt > C:\Temp\txtlar.txt ::: ck=E.has('C:\\Temp\\txtlar.txt',/notes\.txt/)
@task `ip` makrosini yarating (`doskey ip=ipconfig ^| find "IPv4"`) va ishlating. ::: a=doskey ip=ipconfig ^| find "IPv4" ;; ip ::: ck=E.ran(/^doskey\s+ip=/i)&&E.outOf(/^ip\s*$/i,/192\.168\.1\.23/)
@task `tree /f /a` natijasini `C:\Temp\tuzilma.txt` ga saqlang. ::: a=tree /f /a > C:\Temp\tuzilma.txt ::: ck=E.has('C:\\Temp\\tuzilma.txt',/Documents/)
@quiz `cmd /k buyruq` va `cmd /c buyruq` farqi? ::: Farqi yo‘q ::: */k — bajarib oynani ochiq qoldiradi; /c — bajarib yopadi ::: /c tezroq ::: /k faqat admin ::: why=k = keep (qoldir), c = close (yop).
@quiz Qator oxiridagi `^` nima qiladi? ::: Xatoni yashiradi ::: *Buyruq keyingi qatorda davom etishini yoki keyingi maxsus belgi oddiy matn ekanini bildiradi ::: Kommentariy ::: Qatorni o‘chiradi ::: why=Escape belgisi: maxsus belgini «oddiy» qiladi yoki qatorni davom ettiradi.
@quiz Fayllarni sanash uchun qaysi birikma? ::: dir /w ::: *dir /s /b ... | find /c /v "" ::: dir /c ::: count dir ::: why=Quvur va find /c /v "" qatorlarni sanaydi.

=== 10.2 | Loyiha 2: avtomatik zaxira skripti | 14
@cwd C:\Users\Student\Skriptlar
@setup
fs.mkdirp('C:\\Users\\Student\\Skriptlar');
@end
## Vaziyat

Muhim hujjatlaringizni har hafta `D:` diskka nusxalashingiz kerak. Har safar qo‘lda xcopy yozmay, **bir skript** yozasiz.

## Vazifa

`Skriptlar` papkasida **`zaxira.bat`** nomli skript yarating (Notepad yoki `echo >>` bilan). U:

1. `@echo off` bilan boshlansin.
2. «Zaxira boshlandi…» xabarini chiqarsin.
3. `C:\Users\Student\Documents` papkasini **ichki papkalari bilan** `D:\Backup\Zaxira` ga `xcopy` (yoki `robocopy`) qilsin.
4. Natijani tekshirsin: **muvaffaqiyatli bo‘lsa «Tayyor!»**, xato bo‘lsa **«XATO!»** chiqarsin (`if errorlevel` yoki `&&` / `||`).
5. Oxirida `pause` bo‘lsin.

Skriptni ishga tushiring va `D:\Backup\Zaxira` ichida fayllar paydo bo‘lganini tekshiring.

! Maslahat: skriptni birdan to‘liq yozmang — avval 3 qator bilan ishlatib ko‘ring, keyin qo‘shing (7.7 darsdagi usul).

## Skriptni qanday yozish mumkin

**1-usul — Notepad:** `notepad zaxira.bat` → matnni yozing → [[Ctrl]]+[[S]].
**2-usul — echo bilan:** `echo @echo off > zaxira.bat`, keyin har qatorga `echo ... >> zaxira.bat`. Maxsus belgilarni (`>`, `|`) `^` bilan «oddiy» qiling: `^>`.

@task `zaxira.bat` skriptini yarating: `@echo off`, `xcopy` (yoki `robocopy`) va xabarlar bilan. ::: h=Hujjatlar manbasi: C:\Users\Student\Documents; manzil: D:\Backup\Zaxira. ::: a=echo @echo off > zaxira.bat ;; echo echo Zaxira boshlandi... >> zaxira.bat ;; echo xcopy C:\Users\Student\Documents D:\Backup\Zaxira /s /e /i /y ^>nul >> zaxira.bat ;; echo if errorlevel 1 (echo XATO!) else (echo Tayyor!) >> zaxira.bat ;; echo pause >> zaxira.bat ::: ck=E.isFile('zaxira.bat')&&E.has('zaxira.bat',/@echo off/i)&&E.has('zaxira.bat',/(xcopy|robocopy)/i)&&E.has('zaxira.bat',/Documents/i)
@task Skriptni ishga tushiring. ::: a=zaxira ::: i=x ::: ck=E.outOf(/^zaxira(\.bat)?\s*$/i,/Tayyor|OK|tayyor/i)
@task Tekshiring: `D:\Backup\Zaxira` ichida `notes.txt` bo‘lishi kerak. ::: a=dir D:\Backup\Zaxira /b ::: ck=E.isFile('D:\\Backup\\Zaxira\\notes.txt')&&E.ran(/^dir\s+D:\\Backup\\Zaxira/i)
@quiz Zaxira skriptini birinchi marta qayerda sinash kerak? ::: Muhim hujjatlarda ::: *Sinov papkalarida (yoki D:\Backup kabi xavfsiz manzilga nusxalab) ::: Tizim papkalarida ::: Admin bilan C:\ da ::: why=Manzil xavfsiz bo‘lsa, xato qilsangiz ham asl ma’lumot saqlanadi.
@quiz `robocopy ... /mir` zaxira uchun nega xavfli bo‘lishi mumkin? ::: Sekin ::: *Manzilda ortiqcha fayllarni o‘chirib yuboradi — manzil xato yozilsa ma’lumot yo‘qoladi ::: Nusxa olmaydi ::: Faqat admin ::: why=Mirroring manzilni manbaga o‘xshatadi.

=== 10.3 | Loyiha 3: tarmoq diagnostika skripti | 14
@cwd C:\Users\Student\Skriptlar
@setup
fs.mkdirp('C:\\Users\\Student\\Skriptlar');
@end
## Vaziyat

Qarindoshlaringiz «Internet ishlamayapti» deb qo‘ng‘iroq qilishadi. Siz **bir marta bosish bilan** hisobot beradigan skript yozasiz: ular uni ishga tushirib, hisobotni sizga yuboradi.

## Vazifa

`tarmoq.bat` skriptini yozing. U:

1. `tarmoq_hisobot.txt` fayliga quyidagilarni **yozsin**:
   - sarlavha: `=== Tarmoq hisoboti ===`
   - IP manzil (`ipconfig | find "IPv4"`)
   - router tekshiruvi (`ping -n 1 192.168.1.1`)
   - internet tekshiruvi (`ping -n 1 8.8.8.8`)
   - DNS tekshiruvi (`ping -n 1 google.com`)
2. Oxirida hisobotni ekranga chiqarsin (`type`).

Tushuntirish: birinchi qator `>` (faylni yangidan yozadi), qolganlari `>>` (oxiriga qo‘shadi).

! Eslatma: skriptdan oldin **qo‘lda** har buyruqni sinab ko‘ring — ishlashiga ishonch hosil qiling.

## Vazifa

`asboblar.bat` yarating. U menyu chiqarsin:

~~~out
========== ASBOBLAR ==========
 1. IP manzilimni ko‘rsat
 2. Papkadagi fayllar sonini sana
 3. Chiqish
==============================
Tanlang (1-3):
~~~

Tanlovga qarab:

- **1** — `ipconfig | find "IPv4"` natijasini chiqarsin, `pause` qilib, menyuga qaytsin.
- **2** — joriy papkadagi fayllar sonini chiqarsin (`dir /b | find /c /v ""`), `pause`, menyuga qaytsin.
- **3** — «Xayr!» deb tugasin.

Ishlatadigan vositalaringiz: `choice`, `if errorlevel` (**kattadan kichikka!**), `goto`, yorliqlar, `pause`, `cls`.

!! Bu darsda to‘liq yechim bor (pastda «Namuna»). Avval **o‘zingiz** urinib ko‘ring — shunda eng ko‘p o‘rganasiz!

@task `asboblar.bat` skriptini yozing (menyu, `choice`, `goto`, yorliqlar). ::: h=7.5 darsdagi menyu.bat ga qarang. Namuna pastda. ::: a=@file asboblar.bat ::: ck=E.isFile('asboblar.bat')&&E.has('asboblar.bat',/choice/i)&&E.has('asboblar.bat',/goto/i)&&E.has('asboblar.bat',/errorlevel/i)&&E.has('asboblar.bat',/IPv4/i)
@task Skriptni ishga tushiring: **1** (IP), istalgan tugma, **2** (fayllar soni), istalgan tugma, **3** (chiqish). ::: a=asboblar ::: i=1,x,2,x,3 ::: ck=E.outOf(/^asboblar(\.bat)?\s*$/i,/192\.168\.1\.23/)&&E.outOf(/^asboblar(\.bat)?\s*$/i,/Xayr/i)

## Namuna (avval o‘zingiz urinib ko‘ring!)

~~~code asboblar.bat
@echo off
setlocal
:menyu
cls
echo ========== ASBOBLAR ==========
echo  1. IP manzilimni ko‘rsat
echo  2. Papkadagi fayllar sonini sana
echo  3. Chiqish
echo ==============================
choice /c 123 /n /m "Tanlang (1-3): "
if errorlevel 3 goto chiqish
if errorlevel 2 goto sanash
if errorlevel 1 goto ip
goto menyu

:ip
echo.
ipconfig | find "IPv4"
pause
goto menyu

:sanash
echo.
dir /b | find /c /v ""
pause
goto menyu

:chiqish

~~~

@term Fayl ::: Ma’lumot saqlaydigan birlik: nomi va kengaytmasi bor (notes.txt).

@term Disk (drayv) ::: C:, D: kabi saqlash qurilmasi yoki bo‘limi.
@term Yo‘l (path) ::: Fayl yoki papkaning manzili: C:\Users\Student\Documents.
@term Nisbiy yo‘l ::: Hozirgi papkadan boshlanadigan yo‘l: Documents\notes.txt.
@term To‘liq (absolyut) yo‘l ::: Disk harfidan boshlanadigan yo‘l.
@term Kengaytma ::: Fayl turini bildiruvchi nuqtadan keyingi qism (.txt, .jpg).
@term Prompt ::: Buyruq kutayotganini bildiruvchi belgi: C:\Users\Student>
@term Argument ::: Buyruqqa beriladigan ma’lumot (fayl nomi, matn).
@term Kalit (switch) ::: Buyruq ishlashini o‘zgartiruvchi parametr: /s, /b.
@term Andoza (wildcard) ::: * (ko‘p belgi) va ? (bitta belgi) — ko‘p faylni tanlash.
@term Yo‘naltirish ::: Chiqishni faylga yuborish: > va >>.
@term Quvur (pipe) ::: | belgisi: chap buyruq chiqishini o‘ngga kirish qiladi.
@term Errorlevel ::: Oxirgi buyruqning chiqish kodi: 0 — muvaffaqiyat.
@term O‘zgaruvchi ::: Nomi bor «xotira qutisi»: %ISM%.
@term PATH ::: CMD dasturlarni qidiradigan papkalar ro‘yxati.
@term Jarayon (process) ::: Ishlayotgan dastur; PID — uning raqami.
@term Administrator ::: Yuqori huquqli rejim: tizimni o‘zgartira oladi.
@term Skript (batch) ::: Buyruqlar yozilgan .bat/.cmd fayl.
@term IP manzil ::: Qurilmaning tarmoqdagi manzili.
@term Gateway (shlyuz) ::: Internetga chiqish eshigi — odatda router.
@term DNS ::: Sayt nomini IP manzilga o‘giradigan tizim.
@term DHCP ::: Qurilmalarga IP manzil avtomatik beradigan xizmat.
@term MAC manzil ::: Tarmoq kartasining zavod raqami.
@term APIPA (169.254.x.x) ::: DHCP javob bermaganda o‘zi olgan vaqtinchalik manzil.

  parse(abs){const drive=abs[0].toUpperCase();return {drive,parts:abs.slice(3).split('\\').filter(Boolean)};}

  /* o‘lcham yig‘indisi */
  sizeOf(n){if(n.t==='f')return n.size;let s=0;for(const k of n.kids.values())s+=this.sizeOf(k);return s;}

  isDir(p){const a=this.norm(p);const n=a&&this.get(a);return !!(n&&n.t==='d');}
  isFile(p){const a=this.norm(p);const n=a&&this.get(a);return !!(n&&n.t==='f');}
  read(p){const a=this.norm(p);const n=a&&this.get(a);return n&&n.t==='f'?n.data:null;}

function extractRedirs(t){

    if(c==='"'){q=!q;out+=c;continue;}

function evalArith(sh,expr){
  let pos=0;const s=expr;
  const ws=()=>{while(pos<s.length&&/\s/.test(s[pos]))pos++;};
  const num=()=>{ws();let m=/^(0x[0-9a-f]+|\d+)/i.exec(s.slice(pos));if(m){pos+=m[0].length;const t=m[0];return /^0x/i.test(t)?parseInt(t,16):(t.length>1&&t[0]==='0'?parseInt(t,8):parseInt(t,10));}
    m=/^[A-Za-z_]\w*/.exec(s.slice(pos));if(m){pos+=m[0].length;const v=sh.getVar(m[0]);return v===null?0:(parseInt(v,10)||0);}return null;};
  const prim=()=>{ws();if(s[pos]==='('){pos++;const v=or();ws();if(s[pos]===')')pos++;return v;}
    if(s[pos]==='-'){pos++;return -prim();}if(s[pos]==='+'){pos++;return prim();}if(s[pos]==='~'){pos++;return ~prim();}if(s[pos]==='!'){pos++;return prim()?0:1;}
    const n=num();if(n===null)throw new Error('Missing operand.');return n;};
  const mul=()=>{let v=prim();for(;;){ws();const c=s[pos];if(c==='*'){pos++;v=v*prim();}else if(c==='/'){pos++;const d=prim();if(d===0)throw new Error('Divide by zero error.');v=Math.trunc(v/d);}else if(c==='%'){pos++;const d=prim();if(d===0)throw new Error('Divide by zero error.');v=v%d;}else return v;}};
  const add=()=>{let v=mul();for(;;){ws();const c=s[pos];if(c==='+'&&s[pos+1]!=='='){pos++;v=v+mul();}else if(c==='-'&&s[pos+1]!=='='){pos++;v=v-mul();}else return v;}};
  const sh_=()=>{let v=add();for(;;){ws();if(s.startsWith('<<',pos)&&s[pos+2]!=='='){pos+=2;v=v<<add();}else if(s.startsWith('>>',pos)&&s[pos+2]!=='='){pos+=2;v=v>>add();}else return v;}};
  const and=()=>{let v=sh_();for(;;){ws();if(s[pos]==='&'&&s[pos+1]!=='='){pos++;v=v&sh_();}else return v;}};
  const xor=()=>{let v=and();for(;;){ws();if(s[pos]==='^'&&s[pos+1]!=='='){pos++;v=v^and();}else return v;}};
  const or=()=>{let v=xor();for(;;){ws();if(s[pos]==='|'&&s[pos+1]!=='='){pos++;v=v|xor();}else return v;}};
  const v=or();ws();if(pos<s.length)throw new Error('Invalid number.  Numeric constants are either decimal (17),\nhexadecimal (0x11), or octal (021).');return v|0;
}
reg('setx',async(X,P,rest)=>{

  X.sh.persist=X.sh.persist||{};X.sh.persist[a[0]]=a.slice(1).join(' ');
  X.out('\nSUCCESS: Specified value was saved.\n');return 0;
});
reg('set',async(X,P,rest)=>{
  const sh=X.sh;
  let r=rest.replace(/^\s+/,'');
  if(/^\/a\b/i.test(r)){
    const ex=r.slice(2).trim().replace(/^"|"$/g,'');let last=0;
    try{
      for(const part of ex.split(',')){
        const m=/^\s*([A-Za-z_]\w*)\s*(\+|-|\*|\/|%|<<|>>|&|\||\^)?=\s*(.+)$/.exec(part);
        if(m&&!/^==/.test(part.slice(part.indexOf('=')))){
          const rhs=evalArith(sh,m[3]);let cur=parseInt(sh.getVar(m[1])||'0',10)||0;let v=rhs;
          if(m[2]){v=({'+':cur+rhs,'-':cur-rhs,'*':cur*rhs,'/':Math.trunc(cur/(rhs||1)),'%':cur%(rhs||1),'<<':cur<<rhs,'>>':cur>>rhs,'&':cur&rhs,'|':cur|rhs,'^':cur^rhs})[m[2]];}
          sh.setVar(m[1],v|0);last=v|0;
        }else last=evalArith(sh,part);
      }
    }catch(e){X.err(e.message+'\n');return 1;}
    if(!X.frame)X.out(last+'\n');return 0;
  }
  if(/^\/p\b/i.test(r)){
    r=r.slice(2).replace(/^\s+/,'').replace(/^"(.*)"\s*$/,'$1');const i=r.indexOf('=');if(i<0)return fail(X,'The syntax of the command is incorrect.');
    const name=r.slice(0,i).trim(),prompt=r.slice(i+1);
    let ans;if(X.stdin!=null){ans=X.stdin.split(/\r?\n/)[0];}else ans=await X.io.readLine(prompt);
    if(ans!=='')sh.setVar(name,ans);else if(sh.getVar(name)===null){return 1;}
    return 0;
  }
  if(!r){const a=[...sh.env.values()].sort((x,y)=>lc(x.n)<lc(y.n)?-1:1);a.forEach(e=>X.out(e.n+'='+e.v+'\n'));return 0;}
  const q=/^"(.*)"\s*$/.exec(r);if(q)r=q[1];
  const i=r.indexOf('=');
  if(i<0){const u=r.toUpperCase();const m=[...sh.env.values()].filter(e=>e.n.toUpperCase().startsWith(u)).sort((x,y)=>lc(x.n)<lc(y.n)?-1:1);
    if(!m.length){X.err('Environment variable '+r+' not defined\n');return 1;}m.forEach(e=>X.out(e.n+'='+e.v+'\n'));return 0;}
  const name=r.slice(0,i),val=r.slice(i+1);
  if(!name)return fail(X,'The syntax of the command is incorrect.');
  sh.setVar(name,val===''?null:val);return 0;
});

});

reg('pause',async(X)=>{X.out('Press any key to continue . . . ');await X.io.readKey();X.out('\n');return 0;});
reg('timeout',async(X,P)=>{
  let n=parseInt(P.sw.t!==undefined&&P.sw.t!==true?P.sw.t:(P.raw.find(r=>r.sw==='t')?P.pos[0]:P.pos[0]),10);
  if(isNaN(n))return fail(X,'ERROR: Invalid syntax. Value expected for \'/T\'.');
  if(n<-1||n>99999)return fail(X,'ERROR: Invalid value for timeout (/T) specified. Valid range is -1 to 99999.');
  if(!P.sw.nobreak)X.out('\nWaiting for '+n+' seconds, press a key to continue ...\n');else X.out('\nWaiting for '+n+' seconds, press CTRL+C to quit ...\n');
  await X.sh.sleep(Math.min(n,8)*180);return 0;
});
reg('choice',async(X,P,rest)=>{
  let set='YN';let m=/\/c[:\s]*("[^"]*"|[^\s\/]+)/i.exec(rest);if(m)set=m[1].replace(/"/g,'').toUpperCase();
  m=/\/m[:\s]*("[^"]*"|[^\s\/]+)/i.exec(rest);const msg=m?m[1].replace(/"/g,''):'';
  const nolist=/\/n\b/i.test(rest);
  X.out(msg+(nolist?'':(msg?' ':'')+'['+set.split('').join(',')+']?')+'');
  for(;;){const k=(await X.io.readKey()).toUpperCase();const i=set.indexOf(k);if(i>=0){X.out(k+'\n');return i+1;}}
});

reg('tasklist',async(X,P,rest)=>{
  const sh=X.sh;let list=sh.procs.slice();list.push({name:'tasklist.exe',pid:9124,sn:'Console',sess:1,mem:8812});
  let m;const fi=P.sw.fi&&P.sw.fi!==true?P.sw.fi:null;
  const fm=/\/fi\s+"([^"]+)"/i.exec(rest);const f=fm?fm[1]:fi;
  if(f){
    const mm=/^(\w+)\s+(eq|ne)\s+(.+)$/i.exec(f.trim());
    if(mm){const key=lc(mm[1]),op=lc(mm[2]),val=lc(mm[3].replace(/"/g,''));
      list=list.filter(p=>{let v=key==='imagename'?lc(p.name):key==='pid'?String(p.pid):key==='sessionname'?lc(p.sn):key==='status'?'running':'';const eq=v===val||(val.includes('*')&&new RegExp('^'+val.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*')+'$').test(v));return op==='eq'?eq:!eq;});}
  }
  if(!list.length){X.out('INFO: No tasks are running which match the specified criteria.\n');return 0;}
  const fo=lc(P.sw.fo&&P.sw.fo!==true?P.sw.fo:'table');
  if(fo==='csv'){if(!P.sw.nh)X.out('"Image Name","PID","Session Name","Session#","Mem Usage"\n');list.forEach(p=>X.out('"'+p.name+'","'+p.pid+'","'+p.sn+'","'+p.sess+'","'+fmtNum(p.mem)+' K"\n'));return 0;}
  if(fo==='list'){list.forEach(p=>X.out('\nImage Name:   '+p.name+'\nPID:          '+p.pid+'\nSession Name: '+p.sn+'\nSession#:     '+p.sess+'\nMem Usage:    '+fmtNum(p.mem)+' K\n'));return 0;}
  if(!P.sw.nh){X.out('\nImage Name                     PID Session Name        Session#    Mem Usage\n========================= ======== ================ =========== ============\n');}
  list.forEach(p=>X.out(p.name.padEnd(25).slice(0,25)+' '+pad(p.pid,8)+' '+p.sn.padEnd(16)+' '+pad(p.sess,11)+' '+pad(fmtNum(p.mem)+' K',12)+'\n'));
  return 0;
});
reg('taskkill',async(X,P)=>{
  const sh=X.sh;
  const im=P.sw.im&&P.sw.im!==true?P.sw.im:(P.raw.find(r=>r.sw==='im')?P.pos[0]:null);
  const pid=P.sw.pid&&P.sw.pid!==true?P.sw.pid:(P.raw.find(r=>r.sw==='pid')?P.pos[0]:null);
  if(!im&&!pid)return fail(X,'ERROR: Invalid syntax. Neither /FI, /PID nor /IM is specified.\nType "TASKKILL /?" for usage.');
  let targets;
  if(im){const re=new RegExp('^'+lc(im).replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'.*')+'$');targets=sh.procs.filter(p=>re.test(lc(p.name)));if(!targets.length)return fail(X,'ERROR: The process "'+im+'" not found.',128);}
  else{targets=sh.procs.filter(p=>String(p.pid)===String(pid));if(!targets.length)return fail(X,'ERROR: The process "'+pid+'" not found.',128);}
  let rc=0;
  for(const p of targets){
    if(CRIT.includes(lc(p.name))||p.name==='cmd.exe'&&false){X.err('ERROR: The process "'+p.name+'" with PID '+p.pid+' could not be terminated.\nReason: Access is denied.\n');rc=1;continue;}
    if(!P.sw.f&&p.sess===1&&!['notepad.exe','calc.exe','mspaint.exe'].includes(lc(p.name))){X.out('ERROR: The process with PID '+p.pid+' (child process of PID '+p.pid+') could not be terminated.\nReason: This process can only be terminated forcefully (with /F option).\n'.replace('(child process of PID '+p.pid+') ',''));rc=1;continue;}
    sh.procs=sh.procs.filter(q=>q!==p);
    X.out(P.sw.f?'SUCCESS: The process "'+p.name+'" with PID '+p.pid+' has been terminated.\n':'SUCCESS: Sent termination signal to the process "'+p.name+'" with PID '+p.pid+'.\n');
    if(lc(p.name)==='notepad.exe'||lc(p.name)==='calc.exe')X.sh.ui.toast(p.name+' yopildi');
  }
  return rc;
});
const GUI={'notepad.exe':'Notepad','calc.exe':'Calculator','mspaint.exe':'Paint','chrome.exe':'Chrome','telegram.exe':'Telegram','explorer.exe':'Explorer','msedge.exe':'Edge','winword.exe':'Word','excel.exe':'Excel'};
SIM.runExe=async function(sh,base,rest,X,prog){
  const b=lc(base);
  if(b==='notepad.exe'){
    const arg=rest.trim().replace(/^"|"$/g,'');
    const p=SIM.addProc(sh,'notepad.exe',18000);
    let abs=arg?sh.fs.norm(arg):null;
    if(abs&&sh.fs.get(abs)&&sh.fs.get(abs).t==='d'){sh.procs=sh.procs.filter(q=>q!==p);X.err('Access is denied.\n');return 1;}
    const ex=abs?sh.fs.get(abs):null;
    const res=await sh.ui.edit(abs?sh.fs.canon(abs):null,ex?ex.data:'');
    sh.procs=sh.procs.filter(q=>q!==p);
    if(res&&res.save!==null&&res.save!==undefined){
      const path=res.path?sh.fs.norm(res.path):abs;
      if(!path){return 0;}
      const w=sh.fs.isProtected(path)?'denied':sh.fs.writeFile(path,res.save.replace(/\r?\n/g,'\r\n'),false);
      if(w!=='ok')sh.ui.toast('Saqlab bo‘lmadi: '+(w==='nopath'?'yo‘l topilmadi':'ruxsat yo‘q'));else sh.ui.toast('Saqlandi: '+sh.fs.canon(path));
    }
    return 0;
  }
  if(GUI[b]){SIM.addProc(sh,b);sh.ui.toast(GUI[b]+' ochildi (simulyatsiya) — jarayonni tasklist bilan ko‘ring');return 0;}
  if(b==='cmd.exe'){X.out('(Simulyator: ichma-ich cmd.exe qo‘llab-quvvatlanmaydi.)\n');return 0;}
  X.out('(Simulyatsiya) '+b+' dasturi ishga tushdi.\n');return 0;
};
reg('start',async(X,P,rest)=>{
  const sh=X.sh;let r=rest.trim();r=r.replace(/^"[^"]*"\s+(?=\S)/,'');
  r=r.replace(/^(\/(min|max|wait|b)\s+)+/i,'');
  if(!r){X.out('(Simulyator) Yangi CMD oynasi ochilishi kerak edi.\n');return 0;}
  if(/^https?:\/\//i.test(r)||/^www\./i.test(r)){SIM.addProc(sh,'msedge.exe');sh.ui.toast('Brauzer ochildi (simulyatsiya)');return 0;}
  if(r==='.'||/^[a-z]:\\?/i.test(r)&&sh.fs.isDir(r)||sh.fs.isDir(r)){SIM.addProc(sh,'explorer.exe',52000);sh.ui.toast('Explorer ochildi (simulyatsiya)');return 0;}
  const name=/^("[^"]*"|\S+)/.exec(r)[0].replace(/"/g,'');const args=r.slice(/^("[^"]*"|\S+)/.exec(r)[0].length);
  const prog=sh.findProgram(name);
  if(!prog){
    const f=sh.fs.norm(name);if(f&&sh.fs.isFile(name)){SIM.addProc(sh,'notepad.exe');sh.ui.toast('Fayl standart dastur bilan ochildi (simulyatsiya)');return 0;}
    X.err('The system cannot find the file '+name+'.\n');return 1;
  }
  if(/\.(bat|cmd)$/i.test(prog)){X.out('(Simulyator) «start» yangi oynada ishga tushiradi; bu yerda shu oynada bajariladi:\n');return sh.runBatch(prog,[prog].concat(args.match(/"[^"]*"|\S+/g)||[]),X);}

function paintTree(el,fs,onIns){
  const drive=fs.drive;const cwd=fs.cwd.toLowerCase();
  let h='';
  const rec=(node,path,depth)=>{
    const kids=[...node.kids.values()].sort((a,b)=>(a.t===b.t?0:a.t==='d'?-1:1)||(a.name.toLowerCase()<b.name.toLowerCase()?-1:1));
    for(const k of kids){
      const p=(path.endsWith('\\')?path:path+'\\')+k.name;const lp=p.toLowerCase();
      const onPath=cwd===lp||cwd.startsWith(lp+'\\');
      const open=k.t==='d'&&(onPath||expanded.has(lp));
      h+=`<div class="ft-row ${cwd===lp?'cwd':''} ${k.attr.h?'hid':''}" style="padding-left:${6+depth*14}px" data-p="${esc(p)}" data-d="${k.t==='d'?1:0}"><span class="fi">${k.t==='d'?(open?'📂':'📁'):'📄'}</span>${esc(k.name)}${k.t==='f'&&k.size?` <span style="color:#6b7c95">${k.size>1048576?(k.size/1048576).toFixed(1)+' MB':k.size>1024?Math.round(k.size/1024)+' KB':k.size+' B'}</span>`:''}</div>`;
      if(open)rec(k,p,depth+1);
    }
  };
  h+=`<div class="ft-row ${cwd===drive.toLowerCase()+':\\'?'cwd':''}" data-p="${drive}:\\" data-d="1"><span class="fi">💽</span>${drive}:\\${fs.label[drive]?' ('+esc(fs.label[drive])+')':''}</div>`;
  rec(fs.roots[drive],drive+':\\',1);
  el.innerHTML=h;
  el.onclick=e=>{
    const r=e.target.closest('.ft-row');if(!r)return;
    const p=r.dataset.p;
    if(r.dataset.d==='1'){const lp=p.toLowerCase();if(expanded.has(lp))expanded.delete(lp);else expanded.add(lp);paintTree(el,fs,onIns);}
    onIns(p.includes(' ')?'"'+p+'"':p);
  };
}
