<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT SHAKH — Valyuta Kurslari</title>
<style>
:root{--bg:#050b12;--panel:#081522;--line:#153247;--text:#e8f7ff;--muted:#7f9aaa;--accent:#00e5ff;--green:#31e981;--red:#ff6378}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#10304a 0,#050b12 42%);color:var(--text);font-family:Segoe UI,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1180px;margin:auto;padding:28px 18px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}
.brand{font-size:24px;font-weight:900;letter-spacing:1px}.brand span{color:var(--accent)}
.back{border:1px solid #1b4662;background:#081827;color:#dff5ff;border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}.back:hover{border-color:var(--accent);color:var(--accent)}
.hero{border:1px solid var(--line);background:linear-gradient(145deg,#091a29,#07111b);border-radius:18px;padding:28px;margin-bottom:18px;box-shadow:0 15px 45px #0008}
h1{margin:0 0 8px;font-size:34px}.sub{color:var(--muted)}.status{margin-top:16px;color:#8eb2c5;font-size:13px}.status b{color:var(--green)}
.converter{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end;margin-top:24px}
.field label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;background:#050d15;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:13px;font-size:16px;outline:none}.field input:focus,.field select:focus{border-color:var(--accent)}
.swap{height:45px;width:45px;border:1px solid #1b4662;background:#081827;color:var(--accent);border-radius:10px;font-size:20px;cursor:pointer}
.result{font-size:20px;font-weight:900;margin-top:18px}.result span{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.card{background:#07131f;border:1px solid var(--line);border-radius:14px;padding:18px}.code{font-size:20px;font-weight:900}.name{font-size:12px;color:var(--muted);margin-top:3px}.rate{font-size:23px;font-weight:900;margin-top:14px}.diff{font-size:12px;margin-top:7px}.up{color:var(--green)}.down{color:var(--red)}.flat{color:var(--muted)}
.search{width:100%;margin:20px 0 14px;background:#050d15;color:white;border:1px solid var(--line);border-radius:10px;padding:13px;outline:none}.search:focus{border-color:var(--accent)}
.note{color:var(--muted);font-size:12px;margin-top:18px}
@media(max-width:650px){.top{align-items:flex-start}.hero{padding:20px}h1{font-size:27px}.converter{grid-template-columns:1fr}.swap{width:100%}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">IT <span>SHAKH</span> / VALYUTA</div>
    <button class="back" onclick="location.href='index.html'">← ORQAGA</button>
  </div>

  <section class="hero">
    <h1>💱 Valyuta kurslari</h1>
    <div class="sub">O‘zbekiston Respublikasi Markaziy bankining rasmiy kurslari</div>
    <div class="status" id="status">Kurslar yuklanmoqda...</div>

    <div class="converter">
      <div class="field"><label>MIQDOR</label><input id="amount" type="number" min="0" step="any" value="1"></div>
      <button class="swap" id="swap" title="Almashtirish">⇄</button>
      <div class="field"><label>VALYUTA</label><select id="currency"></select></div>
    </div>
    <div class="result" id="result">—</div>
  </section>

  <input class="search" id="search" placeholder="Valyutani qidirish...">
  <div class="grid" id="grid"></div>
  <div class="note">Manba: O‘zbekiston Respublikasi Markaziy banki. Rasmiy kurslar Markaziy bank API'sidan avtomatik olinadi.</div>
</div>

<script>
const API='https://cbu.uz/uz/arkhiv-kursov-valyut/json/';
let all=[], currentTo='USD';

function fmt(n){return Number(n).toLocaleString('uz-UZ',{minimumFractionDigits:2,maximumFractionDigits:2});}
function icon(code){return ({USD:'🇺🇸',EUR:'🇪🇺',RUB:'🇷🇺',GBP:'🇬🇧',JPY:'🇯🇵',CNY:'🇨🇳',CHF:'🇨🇭',KZT:'🇰🇿',TRY:'🇹🇷',AED:'🇦🇪',KRW:'🇰🇷',CAD:'🇨🇦',AUD:'🇦🇺'})[code]||'💱';}

async function loadRates(){
  const status=document.getElementById('status');
  try{
    const r=await fetch(API+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    all=await r.json();
    render();
    status.innerHTML='<b>● LIVE</b> — Markaziy bankdan avtomatik yangilandi: '+(all[0]?.Date||'');
  }catch(e){
    status.textContent='Kurslarni yuklashda xatolik. Internet ulanishini tekshiring.';
  }
}

function render(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const grid=document.getElementById('grid');
  const select=document.getElementById('currency');
  const old=select.value||currentTo;
  const list=all.filter(x=>(x.Ccy+' '+x.CcyNm_UZ).toLowerCase().includes(q));
  grid.innerHTML=list.map(x=>{
    const d=Number(x.Diff||0);
    return `<div class="card"><div class="code">${icon(x.Ccy)} ${x.Ccy}</div><div class="name">${x.CcyNm_UZ}</div><div class="rate">${fmt(x.Rate)} so'm</div><div class="diff ${d>0?'up':d<0?'down':'flat'}">${d>0?'▲ ':d<0?'▼ ':''}${fmt(Math.abs(d))}</div></div>`;
  }).join('');
  if(!select.options.length){
    select.innerHTML=all.map(x=>`<option value="${x.Ccy}">${x.Ccy} — ${x.CcyNm_UZ}</option>`).join('');
  }
  select.value=all.some(x=>x.Ccy===old)?old:(all[0]?.Ccy||'USD');
  currentTo=select.value;
  convert();
}

function convert(){
  const x=all.find(v=>v.Ccy===document.getElementById('currency').value);
  const amount=Number(document.getElementById('amount').value)||0;
  document.getElementById('result').innerHTML=x?`${fmt(amount)} ${x.Ccy} = <span>${fmt(amount*Number(x.Rate))} so'm</span>`:'—';
}
document.getElementById('amount').addEventListener('input',convert);
document.getElementById('currency').addEventListener('change',convert);
document.getElementById('search').addEventListener('input',render);
document.getElementById('swap').addEventListener('click',()=>{
  const x=document.getElementById('currency'), old=x.value;
  x.value='USD'; if(x.value!=='USD') x.value=old; convert();
});
loadRates();
setInterval(loadRates,5*60*1000);
</script>
<!-- IT-SHAKH-SITELOCK -->
<style>
#sl-modal,#vb-modal,#bk-modal{position:fixed;inset:0;z-index:2147483647;background:rgba(2,6,14,.96);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit}
.sl-box{width:min(440px,100%);background:#06101c;border:1px solid rgba(31,214,245,.4);border-radius:16px;padding:28px 24px;box-shadow:0 0 60px rgba(31,214,245,.25);text-align:center;box-sizing:border-box}
.sl-ic{font-size:42px}
.sl-box h2{margin:8px 0 10px;font-size:21px;color:#1fd6f5;font-family:inherit}
.sl-box p{margin:0;font-size:13px;line-height:1.55;color:#cbd5e1;font-family:inherit}
#bk-modal{background:rgba(10,2,4,.94)}
.bk-box{width:min(440px,100%);background:#1a0608;border:1px solid rgba(248,113,113,.5);border-radius:16px;padding:28px 24px;box-shadow:0 0 60px rgba(248,113,113,.25);text-align:center;box-sizing:border-box;font-family:inherit}
.bk-ic{font-size:42px}
.bk-box h2{margin:8px 0 10px;font-size:21px;color:#f87171;font-family:inherit}
.bk-box p{margin:0 0 10px;font-size:13px;line-height:1.55;color:#cbd5e1;font-family:inherit}
.bk-box .bk-sub{color:#94a3b8;font-size:12px;margin:0}
</style>
<script>
/* ===== SAYTNI TO'LIQ BLOKLASH + VPN TAQIQLASH + FOYDALANUVCHINI BLOKLASH — TOOLS sahifalari uchun =====
   index.html dagi admin panelidan "SAYTNI BLOKLASH" yoki "VPN TAQIQLASH" yoqilsa, yoki ma'lum bir foydalanuvchi
   akkaunti (email yoki uning IP manzili orqali) bloklansa — bu tekshiruv shu asbob sahifasida ham ishlaydi.
   Foydalanuvchini bloklash tekshiruvi FAQAT tizimga kirgan (Google orqali) foydalanuvchilar uchun ishlaydi —
   index.html'dagi xuddi shu cheklov bilan bir xil (kirmagan mehmon uchun bu tekshiruv ishlamaydi).
   ADMIN_EMAIL hech qachon tekshirilmaydi/bloklanmaydi. Hech qanday Google token talab qilinmaydi (sayt bloklash
   va VPN taqiqlash ommaviy tekshiruv) — faqat foydalanuvchi bloki uchun localStorage'dagi kredensial ishlatiladi. */
(function(){
 var USERS_API_URL='https://script.google.com/macros/s/AKfycbyGcZgnnp91p19OhUVCep3zh_Izw9Day-jQaveO0rYVX7cK0F_y9yZaSHJ-qdMUZzhiBA/exec';
 var ADMIN='anonimshakh4647@gmail.com';
 var showingLock=false,showingVpn=false,showingBlock=false,checking=false,vpnFlag=null,vpnCheckedAt=0;
 var DEFAULT_LOCK_MSG='Hozirda saytda texnik ishlar olib borilmoqda. Iltimos, birozdan so‘ng qayta urinib ko‘ring.';
 var DEFAULT_BLOCK_MSG='Qoidabuzarlik yoki shubhali faoliyat tufayli ushbu akkaunt uchun saytdan foydalanish to‘xtatildi.';
 function getUser(){try{return JSON.parse(localStorage.getItem('it_shakh_google_user')||'null')}catch(e){return null}}
 function isAdmin(){var u=getUser();return !!(u&&String(u.email||'').toLowerCase()===ADMIN);}
 function expMs(c){try{return JSON.parse(atob(c.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}}
 function blkMsgKey(){var u=getUser();return (u&&u.email)?('it_shakh_blk_'+String(u.email).toLowerCase()+'_msg'):null;}
 function getCachedMsg(key,def){if(!key)return def;try{var v=localStorage.getItem(key);return (v&&v.trim())?v:def;}catch(e){return def;}}
 function api(params,ms){return new Promise(function(res){
  var cb='sl2_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script'),done=false;
  var fin=function(v){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.parentNode&&sc.remove();res(v);};
  window[cb]=fin;sc.onerror=function(){fin(null)};setTimeout(function(){fin(null)},ms||9000);
  var qs='';for(var k in params){if(params[k]==null)continue;qs+=(qs?'&':'')+k+'='+encodeURIComponent(params[k]);}
  sc.src=USERS_API_URL+'?'+qs+'&callback='+cb+'&_='+Date.now();document.head.appendChild(sc);});}
 function showLock(msg){
  var txt=(msg&&String(msg).trim())?String(msg):getCachedMsg('it_shakh_sitelock_msg',DEFAULT_LOCK_MSG);
  var d=document.getElementById('sl-modal');
  if(!d){
   ['vb-modal','bk-modal'].forEach(function(id){var m=document.getElementById(id);if(m)m.remove();});
   showingVpn=false;showingBlock=false;
   d=document.createElement('div');d.id='sl-modal';
   d.innerHTML='<div class="sl-box"><div class="sl-ic">🛠️</div><h2>Sayt vaqtincha yopiq</h2><p></p></div>';
   document.body.appendChild(d);document.body.style.overflow='hidden';
  }
  showingLock=true;
  var p=d.querySelector('p');if(p)p.textContent=txt;
 }
 function hideLock(){var d=document.getElementById('sl-modal');if(!d)return;d.remove();showingLock=false;document.body.style.overflow=(showingVpn||showingBlock)?'hidden':'';}
 function showBlock(msg){
  if(showingLock)return;
  var txt=(msg&&String(msg).trim())?String(msg):getCachedMsg(blkMsgKey(),DEFAULT_BLOCK_MSG);
  var d=document.getElementById('bk-modal');
  if(!d){
   var vb=document.getElementById('vb-modal');if(vb)vb.remove();showingVpn=false;
   d=document.createElement('div');d.id='bk-modal';
   d.innerHTML='<div class="bk-box"><div class="bk-ic">🚫</div><h2>Akkauntingiz bloklangan</h2><p></p><p class="bk-sub">Bu xato deb hisoblasangiz, administrator bilan bog‘laning.</p></div>';
   document.body.appendChild(d);document.body.style.overflow='hidden';
  }
  showingBlock=true;
  var p=d.querySelector('p');if(p)p.textContent=txt;
 }
 function hideBlock(){var d=document.getElementById('bk-modal');if(!d)return;d.remove();showingBlock=false;document.body.style.overflow=(showingLock||showingVpn)?'hidden':'';}
 function showVpn(){
  if(showingVpn||showingLock||showingBlock||document.getElementById('vb-modal'))return;showingVpn=true;
  var d=document.createElement('div');d.id='vb-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛡️</div><h2>VPN/Proksi orqali kirish taqiqlangan</h2><p>Saytdan foydalanish uchun VPN yoki proksi dasturini o‘chirib, sahifani qayta yuklang.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideVpn(){var d=document.getElementById('vb-modal');if(!d)return;d.remove();showingVpn=false;document.body.style.overflow=(showingLock||showingBlock)?'hidden':'';}
 function checkVpn(){
  return new Promise(function(res){
   var c=(typeof AbortController!=='undefined')?new AbortController():null,t=setTimeout(function(){if(c)c.abort();},5000);
   fetch('https://api.ipapi.is/',c?{signal:c.signal}:{}).then(function(r){
    clearTimeout(t);if(!r.ok)return res(null);return r.json();
   }).then(function(j){
    if(!j||typeof j!=='object'||(j.is_vpn==null&&j.is_proxy==null&&j.is_datacenter==null))return res(null);
    res(!!(j.is_vpn||j.is_proxy||j.is_tor||j.is_datacenter));
   }).catch(function(){clearTimeout(t);res(null);});
  });
 }
 function tick(){
  if(checking||isAdmin())return;
  checking=true;
  var u=getUser(),credOk=!!(u&&u.email&&u.credential);
  // XAVFSIZLIK (reload bilan aylanib o'tishning oldini olish): sayt bloki yoki shu foydalanuvchining bloki
  // oldin keshlangan bo'lsa, serverdan javob kelgunga QADAR HAM tegishli ekran DARHOL ko'rsatiladi.
  var cachedLock=false;try{cachedLock=localStorage.getItem('it_shakh_sitelock_flag')==='1';}catch(e){}
  if(cachedLock&&!showingLock)showLock();
  var blkKey=credOk?('it_shakh_blk_'+String(u.email).toLowerCase()):null;
  var cachedBlk=false;if(blkKey){try{cachedBlk=localStorage.getItem(blkKey)==='1';}catch(e){}}
  if(cachedBlk&&!showingBlock)showBlock();
  var p1=api({action:'sitestat'},9000);
  var p2=credOk?api({action:(expMs(u.credential)>Date.now()+10000?'me':'blockstat'),credential:u.credential},9000):Promise.resolve(null);
  Promise.all([p1,p2]).then(function(res){checking=false;
   var r=res[0],rb=res[1];
   if(r&&r.ok&&r.locked){try{localStorage.setItem('it_shakh_sitelock_flag','1');if(r.lockMsg)localStorage.setItem('it_shakh_sitelock_msg',r.lockMsg);else localStorage.removeItem('it_shakh_sitelock_msg');}catch(e){}return showLock(r.lockMsg);}
   if(r&&r.ok&&!r.locked){try{localStorage.removeItem('it_shakh_sitelock_flag');localStorage.removeItem('it_shakh_sitelock_msg');}catch(e){}if(showingLock)hideLock();}
   if(rb&&rb.ok&&rb.blocked){if(blkKey){try{localStorage.setItem(blkKey,'1');var bmk=blkMsgKey();if(bmk){if(rb.blockMsg)localStorage.setItem(bmk,rb.blockMsg);else localStorage.removeItem(bmk);}}catch(e){}}return showBlock(rb.blockMsg);}
   if(rb&&rb.ok&&!rb.blocked){if(blkKey){try{localStorage.removeItem(blkKey);var bmk2=blkMsgKey();if(bmk2)localStorage.removeItem(bmk2);}catch(e){}}if(showingBlock)hideBlock();}
   if(r&&r.ok&&r.vpnBlock){
    if(vpnFlag===null||Date.now()-vpnCheckedAt>120000){
     checkVpn().then(function(v){vpnFlag=v;vpnCheckedAt=Date.now();
      if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
     });
    }else if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
   }else if(showingVpn)hideVpn();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
</script>
</body>
