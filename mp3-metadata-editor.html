<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MP3 Metadata Editor | IT SHAKH</title><style>
:root{--bg:#05070b;--panel:#0b111a;--line:#172235;--text:#eef5ff;--muted:#8da0b8;--a:#00e5ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#102033,#05070b 48%);color:var(--text);font-family:Segoe UI,Arial,sans-serif;min-height:100vh}.wrap{max-width:950px;margin:auto;padding:40px 20px}.brand{font-size:28px;font-weight:900;letter-spacing:2px;color:var(--a)}.sub,.hint{color:var(--muted)}.card{background:#0b111aee;border:1px solid var(--line);border-radius:20px;padding:26px;margin-top:25px;box-shadow:0 15px 50px #0008}h1{margin-top:0}input,select,textarea{width:100%;padding:13px;margin:7px 0 14px;background:#070c13;color:var(--text);border:1px solid #24334a;border-radius:10px}.btn{padding:13px 18px;border:0;border-radius:11px;background:linear-gradient(135deg,#00e5ff,#188cff);font-weight:800;cursor:pointer}.btn:disabled{opacity:.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.status{margin-top:15px;color:var(--muted);white-space:pre-wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="brand">IT SHAKH</div><div class="sub">Tools / MP3 Metadata Editor</div><section class="card"><h1>🎵 MP3 Metadata Editor</h1><p class="hint">Edit MP3 title, artist, album, year, genre and comment directly in your browser.</p><input id="file" type="file" accept=".mp3,audio/mpeg"><div id="editor" hidden><div class="grid"><label>Title<input id="title"></label><label>Artist<input id="artist"></label><label>Album<input id="album"></label><label>Year<input id="year"></label><label>Genre<input id="genre"></label><label>Comment<input id="comment"></label></div><button class="btn" id="save">Save & Download MP3</button><div id="status" class="status"></div></div></section></main>
<script type="module">
import {ID3Writer} from 'https://cdn.jsdelivr.net/npm/browser-id3-writer@6.1.0/dist/browser-id3-writer.mjs';
let buf,name;
const $=x=>document.getElementById(x);
$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;buf=await f.arrayBuffer();name=f.name;$('editor').hidden=false;$('status').textContent='MP3 ready.'};
$('save').onclick=()=>{try{const w=new ID3Writer(buf);w.setFrame('TIT2',$('title').value||'').setFrame('TPE1',$('artist').value||'').setFrame('TALB',$('album').value||'').setFrame('TYER',$('year').value||'').setFrame('TCON',$('genre').value||'').setFrame('COMM',{description:'',text:$('comment').value||''});w.addTag();const a=document.createElement('a');a.href=URL.createObjectURL(w.getBlob());a.download=name.replace(/\.mp3$/i,'')+'-edited.mp3';a.click();$('status').textContent='Done. Edited MP3 downloaded.'}catch(e){$('status').textContent='Error: '+e.message}};
</script></body></html>
