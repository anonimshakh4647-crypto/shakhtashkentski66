<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP3 Metadata Editor | IT SHAKH</title>
<style>
:root{--bg:#05070b;--panel:#0b111a;--line:#172235;--text:#eef5ff;--muted:#8da0b8;--a:#00e5ff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -10%,#102033,#05070b 48%);color:var(--text);font-family:Segoe UI,Arial,sans-serif;min-height:100vh}
.wrap{max-width:950px;margin:auto;padding:40px 20px}
.brand{font-size:28px;font-weight:900;letter-spacing:2px;color:var(--a)}
.sub,.hint{color:var(--muted)}
.card{background:#0b111aee;border:1px solid var(--line);border-radius:20px;padding:26px;margin-top:25px;box-shadow:0 15px 50px #0008}
h1{margin-top:0}
input,textarea{width:100%;padding:13px;margin:7px 0 14px;background:#070c13;color:var(--text);border:1px solid #24334a;border-radius:10px}
.cover-box{display:grid;grid-template-columns:170px 1fr;gap:18px;align-items:center;margin:8px 0 18px;padding:16px;border:1px solid #24334a;border-radius:14px;background:#070c13}
.cover-preview{width:170px;height:170px;border-radius:12px;border:1px dashed #2a3b55;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);text-align:center}
.cover-preview img{width:100%;height:100%;object-fit:cover}
.btn{padding:13px 18px;border:0;border-radius:11px;background:linear-gradient(135deg,#00e5ff,#188cff);font-weight:800;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.status{margin-top:15px;color:var(--muted);white-space:pre-wrap;line-height:1.5}
@media(max-width:700px){.grid{grid-template-columns:1fr}.cover-box{grid-template-columns:1fr}.cover-preview{width:180px;height:180px}}
</style>
</head>
<body>
<main class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center"><div class="brand">IT SHAKH</div><a href="javascript:history.back()" style="color:var(--a);text-decoration:none;font-weight:800;font-size:12px;letter-spacing:1px">← ORQAGA</a></div>
  <div class="sub">Tools / MP3 Metadata Editor</div>

  <section class="card">
    <h1>🎵 MP3 Metadata Editor</h1>
    <p class="hint">Edit MP3 metadata and add an album cover directly in your browser. Nothing is uploaded.</p>

    <label>MP3 File
      <input id="file" type="file" accept=".mp3,audio/mpeg">
    </label>

    <div id="editor" hidden>
      <div class="cover-box">
        <div class="cover-preview" id="coverPreview">No cover selected</div>
        <div>
          <label>Album Cover
            <input id="cover" type="file" accept="image/jpeg,image/png,image/webp">
          </label>
          <div class="hint">JPG, PNG or WebP. The image will be embedded as the MP3 front cover.</div>
        </div>
      </div>

      <div class="grid">
        <label>Title<input id="title" type="text" autocomplete="off"></label>
        <label>Artist<input id="artist" type="text" autocomplete="off"></label>
        <label>Album<input id="album" type="text" autocomplete="off"></label>
        <label>Year<input id="year" type="number" min="0" max="9999" inputmode="numeric"></label>
        <label>Genre<input id="genre" type="text" autocomplete="off"></label>
        <label>Comment<input id="comment" type="text" autocomplete="off"></label>
      </div>

      <button class="btn" id="save" type="button">Save &amp; Download MP3</button>
      <div id="status" class="status">MP3 ready.</div>
    </div>
  </section>
</main>

<script type="module">
import { ID3Writer } from 'https://cdn.jsdelivr.net/npm/browser-id3-writer@6.4.0/dist/browser-id3-writer.mjs';

let mp3Buffer = null;
let originalName = '';
let coverBuffer = null;
let coverObjectUrl = null;

const $ = (id) => document.getElementById(id);
const status = (message) => { $('status').textContent = message; };

$('file').addEventListener('change', async (event) => {
  const file = event.target.files?.[0];
  if (!file) return;

  try {
    if (!file.name.toLowerCase().endsWith('.mp3') && file.type !== 'audio/mpeg') {
      throw new Error('Please select an MP3 file.');
    }

    mp3Buffer = await file.arrayBuffer();
    originalName = file.name;
    $('editor').hidden = false;
    status('MP3 ready.');
  } catch (error) {
    mp3Buffer = null;
    $('editor').hidden = true;
    status('Error: ' + (error?.message || error));
  }
});

$('cover').addEventListener('change', async (event) => {
  const file = event.target.files?.[0];

  if (coverObjectUrl) {
    URL.revokeObjectURL(coverObjectUrl);
    coverObjectUrl = null;
  }

  coverBuffer = null;
  $('coverPreview').textContent = 'No cover selected';

  if (!file) return;

  const allowed = ['image/jpeg', 'image/png', 'image/webp'];
  if (!allowed.includes(file.type)) {
    event.target.value = '';
    status('Error: Please select a JPG, PNG or WebP image.');
    return;
  }

  try {
    coverBuffer = await file.arrayBuffer();
    coverObjectUrl = URL.createObjectURL(file);
    $('coverPreview').innerHTML = '';
    const img = document.createElement('img');
    img.src = coverObjectUrl;
    img.alt = 'Album cover preview';
    $('coverPreview').appendChild(img);
    status('MP3 ready. Cover selected.');
  } catch (error) {
    coverBuffer = null;
    status('Error reading cover: ' + (error?.message || error));
  }
});

$('save').addEventListener('click', () => {
  if (!mp3Buffer) {
    status('Please select an MP3 file first.');
    return;
  }

  try {
    const writer = new ID3Writer(mp3Buffer);

    const title = $('title').value.trim();
    const artist = $('artist').value.trim();
    const album = $('album').value.trim();
    const yearText = $('year').value.trim();
    const genre = $('genre').value.trim();
    const comment = $('comment').value.trim();

    // browser-id3-writer expects TPE1 and TCON as arrays of strings.
    if (title) writer.setFrame('TIT2', title);
    if (artist) writer.setFrame('TPE1', [artist]);
    if (album) writer.setFrame('TALB', album);
    if (yearText) {
      const year = Number.parseInt(yearText, 10);
      if (!Number.isInteger(year) || year < 0 || year > 9999) {
        throw new Error('Year must be between 0 and 9999.');
      }
      writer.setFrame('TYER', year);
    }
    if (genre) writer.setFrame('TCON', [genre]);
    if (comment) writer.setFrame('COMM', { description: '', text: comment, language: 'eng' });

    if (coverBuffer) {
      writer.setFrame('APIC', {
        type: 3,
        data: coverBuffer,
        description: ''
      });
    }

    writer.addTag();

    const blob = writer.getBlob();
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const base = originalName.replace(/\.mp3$/i, '') || 'audio';
    link.href = url;
    link.download = base + '-edited.mp3';
    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => URL.revokeObjectURL(url), 2000);
    status(coverBuffer ? 'Done. Metadata + album cover saved and downloaded.' : 'Done. Edited MP3 downloaded.');
  } catch (error) {
    console.error(error);
    status('Error: ' + (error?.message || error));
  }
});
</script>
