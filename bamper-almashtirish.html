<!DOCTYPE html>

body{margin:0;font:13px/1.45 'Inter',system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:var(--bg0);color:var(--text);

button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input[type=range]{accent-color:var(--accent);width:100%}

.hide{display:none!important}
#top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg1);border-bottom:1px solid var(--line)}
#top .back{color:var(--accent);text-decoration:none;font-weight:800;font-size:11px;letter-spacing:2px;white-space:nowrap;padding-right:12px;border-right:1px solid var(--line)}
#top h1{margin:0;font-size:13px;letter-spacing:3px;font-weight:800;white-space:nowrap}

.btn{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:7px 13px;font-weight:600;font-size:12.5px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--violet));border:0;color:#04101c;font-weight:800}
.btn.on{border-color:var(--accent);background:rgba(31,214,245,.14);color:var(--accent)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.big{width:100%;padding:12px;font-size:14px;border-radius:11px}
#stage{position:relative;min-width:0;min-height:0;background:#000}
#gl{width:100%;height:100%;display:block}
#hud{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{background:rgba(8,12,24,.86);backdrop-filter:blur(8px);border:1px solid var(--line2);border-radius:12px;padding:7px 11px;display:flex;align-items:center;gap:10px}

#empty{position:absolute;inset:0;display:grid;place-items:center;padding:20px;pointer-events:none}
#empty .box{pointer-events:auto;max-width:520px;text-align:center;border:2px dashed var(--line2);border-radius:18px;padding:30px 24px;background:rgba(12,19,34,.92)}
#empty.over .box{border-color:var(--accent)}

#empty .btn{padding:10px 18px;font-size:14px}

.card>header i{font-style:normal;width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--violet));color:#04101c;font-weight:800;font-size:12px;display:grid;place-items:center}

.card.exp{border-color:var(--line2)}
.card.exp .cb{display:grid;gap:9px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg0);border:1px solid var(--line2);border-radius:12px;padding:3px}

.tabs button[aria-pressed="true"]{background:var(--bg3);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line2)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.meta{font-size:12px;color:var(--mute);margin-bottom:8px}
.meta b{color:var(--text)}
.hint,.mode,.step{color:var(--mute);font-size:12.5px;margin:0 0 10px}
.step{color:var(--text)}
.mode{font-size:12px;border-left:3px solid var(--accent);padding:5px 10px;background:rgba(31,214,245,.06);border-radius:0 8px 8px 0}

.pcard small{color:var(--dim);font-size:11px}

.metrics table{width:100%;border-collapse:collapse;font:12px ui-monospace,Menlo,Consolas,monospace;margin-bottom:6px}
.metrics th,.metrics td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line)}

.ori{flex:1;text-align:center;font-size:12px;color:var(--mute);align-self:center}

<script>

/* ===== DFF (RenderWare 3.6 / GTA SA) reader + writer + decal builder. DOM-free. ===== */
(function(root){
'use strict';
const T={STRUCT:1,STRING:2,EXT:3,TEXTURE:6,MATERIAL:7,MATLIST:8,FRAMELIST:14,GEOMETRY:15,CLUMP:16,ATOMIC:20,GEOLIST:26,
  BINMESH:0x50E,SKIN:0x116,NIGHT:0x253F2F9,FX2D:0x253F2F8,FRAMENAME:0x253F2FE};
const CONT=new Set([3,6,7,8,14,15,16,20,26]);

/* ---------- chunk tree ---------- */
function sizeOf(c){
  if(c.children){let s=c.tail?c.tail.length:0;for(const k of c.children)s+=12+sizeOf(k);return s;}
  return c.data.length;
}
function parseChunks(buf,start,end){
  const dv=new DataView(buf.buffer,buf.byteOffset,buf.byteLength),out=[];let o=start;
  while(o+12<=end){
    const type=dv.getUint32(o,true),size=dv.getUint32(o+4,true),ver=dv.getUint32(o+8,true);
    let e=o+12+size;if(e>end)e=end;
    const c={type,ver};
    if(CONT.has(type)){
      c.children=parseChunks(buf,o+12,e);
      let used=0;for(const k of c.children)used+=12+sizeOf(k);
      c.tail=used<e-o-12?buf.slice(o+12+used,e):null;
    }else c.data=buf.slice(o+12,e);
    out.push(c);o=e;
  }
  return out;
}
function writeChunk(c,out,o){
  const dv=new DataView(out.buffer);
  dv.setUint32(o,c.type,true);dv.setUint32(o+4,sizeOf(c),true);dv.setUint32(o+8,c.ver,true);
  o+=12;
  if(c.children){for(const k of c.children)o=writeChunk(k,out,o);if(c.tail){out.set(c.tail,o);o+=c.tail.length;}}
  else{out.set(c.data,o);o+=c.data.length;}
  return o;
}
function serialize(roots){
  let total=0;for(const c of roots)total+=12+sizeOf(c);
  const out=new Uint8Array(total);let o=0;for(const c of roots)o=writeChunk(c,out,o);
  return out;
}
const child=(c,t)=>c.children&&c.children.find(k=>k.type===t);
const childs=(c,t)=>c.children?c.children.filter(k=>k.type===t):[];
const dvOf=d=>new DataView(d.buffer,d.byteOffset,d.byteLength);
function rwVersion(stamp){ // library stamp -> RW version (e.g. 0x36003)
  if(stamp&0xFFFF0000)return(((stamp>>14)&0x3FF00)+0x30000)|((stamp>>16)&0x3F);
  return stamp<<8;
}

/* ---------- byte writer ---------- */
class BW{
  constructor(){this.a=[];this.n=0;}
  _p(u){this.a.push(u);this.n+=u.length;}
  u8(v){this._p(new Uint8Array([v&255]));}
  u16(v){const b=new Uint8Array(2);new DataView(b.buffer).setUint16(0,v,true);this._p(b);}
  u32(v){const b=new Uint8Array(4);new DataView(b.buffer).setUint32(0,v>>>0,true);this._p(b);}
  i32(v){const b=new Uint8Array(4);new DataView(b.buffer).setInt32(0,v,true);this._p(b);}
  f32(v){const b=new Uint8Array(4);new DataView(b.buffer).setFloat32(0,v,true);this._p(b);}
  bytes(u){this._p(u instanceof Uint8Array?u:new Uint8Array(u));}
  str(s,len){const b=new Uint8Array(len);for(let i=0;i<Math.min(len-1,s.length);i++)b[i]=s.charCodeAt(i)&127;this._p(b);}
  done(){const o=new Uint8Array(this.n);let p=0;for(const u of this.a){o.set(u,p);p+=u.length;}return o;}
}

/* ---------- decode ---------- */
function decodeFrames(fl){
  const st=child(fl,T.STRUCT).data,dv=dvOf(st),n=dv.getUint32(0,true),frames=[];
  const exts=childs(fl,T.EXT);
  for(let i=0;i<n;i++){
    const o=4+i*56,rot=new Float32Array(9);for(let k=0;k<9;k++)rot[k]=dv.getFloat32(o+k*4,true);
    const pos=[dv.getFloat32(o+36,true),dv.getFloat32(o+40,true),dv.getFloat32(o+44,true)];
    let name='';const nm=exts[i]&&child(exts[i],T.FRAMENAME);
    if(nm)name=String.fromCharCode(...nm.data).replace(/\0.*$/,'');
    frames.push({name,rot,pos,parent:dv.getInt32(o+48,true),flags:dv.getUint32(o+52,true)});
  }
  return frames;
}
function decodeMaterial(m){
  const st=child(m,T.STRUCT).data,dv=dvOf(st);
  const color=[st[4],st[5],st[6],st[7]],textured=dv.getUint32(12,true)!==0;

const rdStr=s=>s?String.fromCharCode(...s.data).replace(/\0.*$/,''):'';

/* ---------- nom bo'yicha bamperni tanish ---------- */
function classify(fname){
  const n=(fname||'').toLowerCase(),tk=n.split(/[^a-z0-9]+/).filter(Boolean),has=(...a)=>tk.some(t=>a.includes(t));
  const bump=tk.some(t=>t.startsWith('bump'))||/bumper|bamper|bumpr/.test(n);
  const front=has('front','frnt','fr','f')||/front/.test(n),rear=has('rear','back','rr','r','b')||/rear/.test(n);
  const dam=has('dam','damaged')||/_dam/.test(n),vlo=has('vlo','lo');
  let kind=null;if(bump){if(front&&!rear)kind='front';else if(rear&&!front)kind='rear';}
  return{kind,dam,vlo,bump};
}

/* ---------- model yuklash ---------- */
function bboxOf(pts){const mn=[1e18,1e18,1e18],mx=[-1e18,-1e18,-1e18];
  for(let i=0;i<pts.length;i+=3)for(let k=0;k<3;k++){const v=pts[i+k];if(v<mn[k])mn[k]=v;if(v>mx[k])mx[k]=v;}
  return{min:mn,max:mx};}
const dimsOf=b=>[b.max[0]-b.min[0],b.max[1]-b.min[1],b.max[2]-b.min[2]];
function loadModel(bytes,name){
  const dff=D.parseDff(bytes),parts=[];let native=0;
  dff.atomics.forEach((a,ai)=>{
    const wm=G.worldMesh(dff,ai);if(!wm){native++;return;}
    const fname=(dff.frames[a.frame]&&dff.frames[a.frame].name)||'',cls=classify(fname),bb=bboxOf(wm.wpos),tex=new Set();
    wm.materials.forEach(m=>{if(m&&m.tex)tex.add(m.tex.toLowerCase());});
    parts.push({ai,frame:a.frame,geom:a.geom,fname,wm,nV:wm.nV,nT:wm.nT,bbox:bb,tex:[...tex],kind:cls.kind,dam:cls.dam,vlo:cls.vlo,bump:cls.bump});
  });
  const all=[];parts.forEach(p=>{all.push(...p.bbox.min,...p.bbox.max);});
  const bbox=parts.length?bboxOf(all):{min:[-1,-1,-1],max:[1,1,1]};
  return{name:name||'model.dff',bytes,dff,parts,bbox,native,rwv:dff.rwv,FW:G.frameWorlds(dff.frames)};
}
/* oldi/orqa bamper qismlarini nomidan topish */
function detect(model){
  const out={};
  for(const kind of['front','rear']){
    const ok=model.parts.filter(p=>p.kind===kind&&!p.dam&&!p.vlo&&p.nV>0).sort((a,b)=>b.nV-a.nV);
    const dam=model.parts.filter(p=>p.kind===kind&&p.dam);
    out[kind]={ok:ok.map(p=>p.ai),dam:dam.map(p=>p.ai),frame:ok.length?ok[0].frame:-1};
  }
  return out;
}

/* ---------- nuqtalar (moslash hisoblari uchun) ---------- */
function surfacePts(parts,max){
  let total=0;parts.forEach(p=>total+=p.wm.nV+p.wm.nT);const stride=Math.max(1,Math.ceil(total/(max||40000))),out=[];let c=0;
  for(const p of parts){const P=p.wm.wpos,Tr=p.wm.tris;
    for(let i=0;i<p.wm.nV;i++)if((c++)%stride===0)out.push(P[i*3],P[i*3+1],P[i*3+2]);
    for(let i=0;i<p.wm.nT;i++)if((c++)%stride===0){const a=Tr[i*3]*3,b=Tr[i*3+1]*3,d=Tr[i*3+2]*3;
      out.push((P[a]+P[b]+P[d])/3,(P[a+1]+P[b+1]+P[d+1])/3,(P[a+2]+P[b+2]+P[d+2])/3);}}
  return new Float32Array(out);
}
function rotPts(pts,R){const o=new Float32Array(pts.length);
  for(let i=0;i<pts.length;i+=3){const x=pts[i],y=pts[i+1],z=pts[i+2];o[i]=R[0]*x+R[1]*y+R[2]*z;o[i+1]=R[3]*x+R[4]*y+R[5]*z;o[i+2]=R[6]*x+R[7]*y+R[8]*z;}return o;}
function occupancy(pts,N){const bb=bboxOf(pts),sz=dimsOf(bb).map(v=>Math.max(v,1e-6)),g=new Uint8Array(N*N*N);
  for(let i=0;i<pts.length;i+=3){const a=Math.min(N-1,Math.floor((pts[i]-bb.min[0])/sz[0]*N)),b=Math.min(N-1,Math.floor((pts[i+1]-bb.min[1])/sz[1]*N)),c=Math.min(N-1,Math.floor((pts[i+2]-bb.min[2])/sz[2]*N));g[(a*N+b)*N+c]=1;}
  return g;}
function iou(a,b){let i=0,u=0;for(let k=0;k<a.length;k++){const x=a[k],y=b[k];if(x&&y)i++;if(x||y)u++;}return u?i/u:0;}
/* donor yo'nalishlarini eski bamperga o'xshashligi bo'yicha saralash (eng yaxshisi birinchi) */
function rankOrientations(oldPts,newPts){
  const N=12,oa=occupancy(oldPts,N),od=dimsOf(bboxOf(oldPts)),res=[];
  ROTS.forEach((R,k)=>{
    const q=rotPts(newPts,R),qd=dimsOf(bboxOf(q)),lr=[0,1,2].map(i=>Math.log(Math.max(qd[i],1e-6)/Math.max(od[i],1e-6))),mean=(lr[0]+lr[1]+lr[2])/3;
    const sd=Math.sqrt(((lr[0]-mean)**2+(lr[1]-mean)**2+(lr[2]-mean)**2)/3),j=iou(oa,occupancy(q,N));
    res.push({k,iou:j,sd,score:j-0.25*sd});});
  res.sort((a,b)=>b.score-a.score);return res;
}
/* moslash: donor dunyo koordinatasidan asosiy model dunyo koordinatasiga afin o'zgarish.
   p: {rot, fine:[rx,ry,rz]°, scaleMode:'width'|'fill'|'none', mult:[x,y,z], anchor:['c'|'min'|'max' x3], off:[x,y,z]} */
function makeFit(pts,oldBB,p){
  const O=ROTS[(p.rot|0)%24],f=p.fine||[0,0,0],Rf=m3mul(rotZ(f[2]),m3mul(rotY(f[1]),rotX(f[0]))),R=m3mul(Rf,O);
  const q=rotPts(pts,R),bb=bboxOf(q),qd=dimsOf(bb),od=dimsOf(oldBB);
  let s=[1,1,1];
  if(p.scaleMode==='width'){const k=od[0]/Math.max(qd[0],1e-6);s=[k,k,k];}
  else if(p.scaleMode==='fill'){const k=od[0]/Math.max(qd[0],1e-6);/* o'qlar kenglikdagi masshtabdan juda og'ib ketmasin */
    s=[0,1,2].map(i=>{const v=od[i]/Math.max(qd[i],1e-6);return i===0?v:Math.min(k*1.8,Math.max(k*0.55,v));});}
  const mu=p.mult||[1,1,1];s=s.map((v,i)=>v*mu[i]);
  const pick=(m,mn,mx)=>m==='min'?mn:m==='max'?mx:(mn+mx)/2,an=p.anchor||['c','min','max'],off=p.off||[0,0,0];
  const aD=[0,1,2].map(i=>pick(an[i],bb.min[i],bb.max[i])),aT=[0,1,2].map(i=>pick(an[i],oldBB.min[i],oldBB.max[i]));
  const M=[R[0]*s[0],R[1]*s[0],R[2]*s[0],R[3]*s[1],R[4]*s[1],R[5]*s[1],R[6]*s[2],R[7]*s[2],R[8]*s[2]];
  const t=[0,1,2].map(i=>aT[i]-s[i]*aD[i]+off[i]);
  const nb={min:[0,1,2].map(i=>s[i]*(bb.min[i]-aD[i])+aT[i]+off[i]),max:[0,1,2].map(i=>s[i]*(bb.max[i]-aD[i])+aT[i]+off[i])};
  return{A:{R:M,t},s,newBB:nb,oldBB};

/* ---------- geometriyani o'zgartirish (donor -> asosiy modelning frame koordinatasi) ---------- */
function transformGeometryChunk(gchunk,srcRwv,dstRwv,A,verStamp,texRename,warn){
  const cl=deepClone(gchunk);setVer(cl,verStamp);
  const ext0=child(cl,T.EXT);
  if(ext0&&child(ext0,T.SKIN))throw new Error('Donor qismi skin (suyakli) geometriya — bamperda bunday bo\'lmaydi.');
  const S=D.readGeoStruct(cl,srcRwv);
  if(S.nMorph<1||!S.morphs[0].pos)throw new Error('Donor geometriyasida vertex joylashuvi topilmadi.');
  if(S.nMorph>1){warn&&warn('Donor qismida bir nechta morph bor edi — faqat birinchisi qoldirildi.');S.morphs=[S.morphs[0]];new DataView(S.hdr.buffer,S.hdr.byteOffset,S.hdr.byteLength).setUint32(12,1,true);}
  const M0=S.morphs[0],nV=S.nV,pos=new Float32Array(M0.pos.buffer.slice(M0.pos.byteOffset,M0.pos.byteOffset+nV*12));
  const Ninv=m3t(m3inv(A.R));let nrm=null;
  if(M0.hn&&M0.nrm)nrm=new Float32Array(M0.nrm.buffer.slice(M0.nrm.byteOffset,M0.nrm.byteOffset+nV*12));
  const mn=[1e18,1e18,1e18],mx=[-1e18,-1e18,-1e18];
  for(let i=0;i<nV;i++){const p=applyA(A,[pos[i*3],pos[i*3+1],pos[i*3+2]]);pos[i*3]=p[0];pos[i*3+1]=p[1];pos[i*3+2]=p[2];for(let k=0;k<3;k++){if(p[k]<mn[k])mn[k]=p[k];if(p[k]>mx[k])mx[k]=p[k];}
    if(nrm){const n=m3v(Ninv,[nrm[i*3],nrm[i*3+1],nrm[i*3+2]]),l=Math.hypot(n[0],n[1],n[2])||1;nrm[i*3]=n[0]/l;nrm[i*3+1]=n[1]/l;nrm[i*3+2]=n[2]/l;}}
  const c=[(mn[0]+mx[0])/2,(mn[1]+mx[1])/2,(mn[2]+mx[2])/2];let r=0;
  for(let i=0;i<nV;i++)r=Math.max(r,Math.hypot(pos[i*3]-c[0],pos[i*3+1]-c[1],pos[i*3+2]-c[2]));
  const sp=new Uint8Array(16),spv=dvOf(sp);spv.setFloat32(0,c[0],true);spv.setFloat32(4,c[1],true);spv.setFloat32(8,c[2],true);spv.setFloat32(12,r,true);

  M0.sphere=sp;M0.pos=new Uint8Array(pos.buffer);if(nrm)M0.nrm=new Uint8Array(nrm.buffer);

  const sh=srcRwv<0x34000?28:16,dh=dstRwv<0x34000?28:16;
  if(sh!==dh){if(dh===16)S.hdr=S.hdr.slice(0,16);else{const h=new Uint8Array(28);h.set(S.hdr.slice(0,16));const v=dvOf(h);v.setFloat32(16,1,true);v.setFloat32(20,1,true);v.setFloat32(24,1,true);S.hdr=h;}}
  child(cl,T.STRUCT).data=D.writeGeoStruct(S,dstRwv);
  const ext=child(cl,T.EXT);
  if(ext){const n0=ext.children.length;ext.children=ext.children.filter(k=>k.type!==T.FX2D);if(ext.children.length<n0)warn&&warn('Donor qismidagi 2DFX yozuvlari olib tashlandi.');}

  const ml=child(cl,T.MATLIST);
  if(ml&&texRename)childs(ml,T.MATERIAL).forEach(m=>{const t=child(m,T.TEXTURE);if(!t)return;const ss=childs(t,T.STRING);
    if(ss[0]){const nm=rdStr(ss[0]).toLowerCase();if(texRename[nm])setString(ss[0],texRename[nm]);}});

/* ---------- TXD ---------- */
function readName(b,o){let s='';for(let i=0;i<32&&b[o+i];i++)s+=String.fromCharCode(b[o+i]);return s;}
function parseTxd(bytes){

  const ver=dv.getUint32(8,true),end=Math.min(bytes.length,12+dv.getUint32(4,true));let o=12,device=0;const natives=[],tail=[];
  while(o+12<=end){const t=dv.getUint32(o,true),sz=dv.getUint32(o+4,true),ch=bytes.subarray(o,Math.min(end,o+12+sz));
    if(t===1&&o===12){device=ch.length>=16?dvOf(ch).getUint16(14,true):0;}
    else if(t===0x15){const nm=readName(ch,32);natives.push({name:nm,lower:nm.toLowerCase(),chunk:ch});}
    else tail.push(ch);o+=12+sz;}
  return{ver,device,natives,tail};

function buildTxd(t){
  let total=16;t.natives.forEach(n=>total+=n.chunk.length);t.tail.forEach(c=>total+=c.length);
  const out=new Uint8Array(12+total),v=dvOf(out);v.setUint32(0,0x16,true);v.setUint32(4,total,true);v.setUint32(8,t.ver,true);
  v.setUint32(12,1,true);v.setUint32(16,4,true);v.setUint32(20,t.ver,true);v.setUint16(24,t.natives.length,true);v.setUint16(26,t.device,true);
  let o=28;t.natives.forEach(n=>{out.set(n.chunk,o);o+=n.chunk.length;});t.tail.forEach(c=>{out.set(c,o);o+=c.length;});

const bytesEq=(a,b)=>{if(a.length!==b.length)return false;for(let i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true;};
/* needs: [{txd: parseTxd natijasi yoki null, names:[lowercase...]}] ; baseTxd: parseTxd natijasi yoki null
   Qaytaradi {bytes, renames:[{lower:{...}}] (needs bilan bir xil tartibda), added, reused, missing, shared} */
function mergeTxd(baseTxd,needs,dry){
  const natives=baseTxd?baseTxd.natives.slice():[],byLower=new Map();natives.forEach(n=>byLower.set(n.lower,n));
  const rep={added:[],reused:[],missing:[],shared:[],renamed:[],renames:[]};
  needs.forEach(nd=>{
    const ren={};rep.renames.push(ren);
    for(const nm of nd.names){
      if(SHARED_TEX.has(nm)){if(!rep.shared.includes(nm))rep.shared.push(nm);continue;}
      const src=nd.txd?nd.txd.natives.find(n=>n.lower===nm):null;
      if(!src){const inBase=byLower.has(nm);if(!inBase&&!rep.missing.includes(nm))rep.missing.push(nm);else if(inBase&&!rep.reused.includes(nm))rep.reused.push(nm);continue;}
      const ex=byLower.get(nm);
      if(!ex){const n={name:src.name,lower:nm,chunk:src.chunk};natives.push(n);byLower.set(nm,n);rep.added.push(src.name);continue;}
      if(bytesEq(ex.chunk,src.chunk)){if(!rep.reused.includes(nm))rep.reused.push(nm);continue;}
      // nomi band, mazmuni boshqa -> yangi nom
      let base=src.name.slice(0,26),k=2,nn=base+'_'+k;while(byLower.has(nn.toLowerCase()))nn=base+'_'+(++k);
      const ch=new Uint8Array(src.chunk);for(let i=0;i<32;i++)ch[32+i]=0;for(let i=0;i<nn.length;i++)ch[32+i]=nn.charCodeAt(i);
      const n={name:nn,lower:nn.toLowerCase(),chunk:ch};natives.push(n);byLower.set(n.lower,n);ren[nm]=nn;rep.renamed.push(src.name+' → '+nn);rep.added.push(nn);
    }

  rep.count=natives.length;if(!dry)rep.bytes=buildTxd({ver,device,natives,tail});

}

/* ---------- asosiy model DFF ini yangilash ---------- */
/* job: {kind, oldAis:[], damAis:[], targetFrame, donor:{model, ais:[]}, fit:{A}, texRename:{}}  opt: {dam:'copy'|'keep'|'remove'} */
function buildOutput(base,jobs,opt){
  opt=opt||{};const warnings=[],warn=m=>{if(!warnings.includes(m))warnings.push(m);};
  const dff=D.parseDff(base.bytes),clump=dff.clump,gl=child(clump,T.GEOLIST),geoChunks=childs(gl,T.GEOMETRY),atomChunks=childs(clump,T.ATOMIC);
  const verStamp=dff.clump.ver,FW=G.frameWorlds(dff.frames);
  const remove=new Set(),adds=[];let removedCount=0;
  jobs.forEach(job=>{
    if(!job.oldAis.length)throw new Error('Eski bamper qismi tanlanmagan ('+job.kind+').');
    if(!job.donor||!job.donor.ais.length)throw new Error('Yangi bamper qismi tanlanmagan ('+job.kind+').');
    job.oldAis.forEach(a=>remove.add(a));
    const tf=job.targetFrame,Winv=affInv(W2A(FW[tf]));
    const damMode=opt.dam||'copy',damFrames=[...new Set(job.damAis.map(a=>dff.atomics[a].frame))];
    if(damMode!=='keep')job.damAis.forEach(a=>remove.add(a));
    const frames=[tf];if(damMode==='copy')damFrames.forEach(f=>{if(!frames.includes(f))frames.push(f);});
    job.donor.ais.forEach(dai=>{
      const dm=job.donor.model,da=dm.dff.atomics[dai],dg=dm.dff.geoChunks[da.geom];
      const Wd=W2A(dm.FW[da.frame]),A=affMul(Winv,affMul(job.fit.A,Wd));
      const datom=dm.dff.clump&&childs(dm.dff.clump,T.ATOMIC)[dai];
      frames.forEach(fr=>{
        const ng=transformGeometryChunk(dg,dm.rwv,dff.rwv,A,verStamp,job.texRename,warn);
        const ac=deepClone(datom);setVer(ac,verStamp);
        adds.push({frame:fr,geom:ng,atomic:ac,job:job.kind,dam:fr!==tf});
      });
    });
  });
  // qaysi geometriyalar o'chadi
  const usedKept=new Set(),usedRemoved=new Set();
  dff.atomics.forEach((a,i)=>{(remove.has(i)?usedRemoved:usedKept).add(a.geom);});
  const dropGeo=new Set([...usedRemoved].filter(g=>!usedKept.has(g)));
  const newGeoList=[],map=new Map();
  geoChunks.forEach((g,i)=>{if(dropGeo.has(i))return;map.set(i,newGeoList.length);newGeoList.push(g);});
  const addBase=newGeoList.length;adds.forEach(a=>newGeoList.push(a.geom));
  // atomic chunklari
  const keptAt=[];atomChunks.forEach((c,i)=>{if(remove.has(i))return;const st=child(c,T.STRUCT);st.data=new Uint8Array(st.data);dvOf(st.data).setUint32(4,map.get(dff.atomics[i].geom),true);keptAt.push(c);});
  adds.forEach((a,i)=>{const st=child(a.atomic,T.STRUCT);st.data=new Uint8Array(st.data);const v=dvOf(st.data);v.setUint32(0,a.frame,true);v.setUint32(4,addBase+i,true);keptAt.push(a.atomic);});
  removedCount=remove.size;
  // geometriya ro'yxati va clump sanagichlari
  const gst=child(gl,T.STRUCT);gst.data=new Uint8Array(gst.data);dvOf(gst.data).setUint32(0,newGeoList.length,true);
  gl.children=[gst,...newGeoList];
  const cst=child(clump,T.STRUCT);cst.data=new Uint8Array(cst.data);dvOf(cst.data).setUint32(0,keptAt.length,true);
  const rest=clump.children.filter(c=>c.type!==T.ATOMIC),gi=rest.indexOf(gl);rest.splice(gi+1,0,...keptAt);clump.children=rest;
  const bytes=D.serialize(dff.roots);
  return{bytes,warnings,removed:removedCount,added:adds.length,droppedGeometries:dropGeo.size};
}

/* ---------- tayyor faylni mustaqil tekshirish ---------- */
function verify(baseBytes,outBytes,jobs){
  const A=D.parseDff(baseBytes),B=D.parseDff(outBytes),rep={ok:true,lines:[],errors:[]};
  const same=A.frames.length===B.frames.length&&A.frames.every((f,i)=>B.frames[i].name===f.name&&B.frames[i].parent===f.parent);
  if(same)rep.lines.push('✓ Frame tuzilmasi (dummy lar ham) aynan o\'zgarishsiz: '+A.frames.length+' ta frame.');
  else{rep.ok=false;rep.errors.push('Frame tuzilmasi o\'zgargan!');}
  const maxV=Math.max(0,...B.geoms.map(g=>g.native?0:g.nV));
  if(B.geoms.some(g=>g.native)){rep.ok=false;rep.errors.push('Native geometriya paydo bo\'lgan.');}
  if(maxV>65535){rep.ok=false;rep.errors.push('Geometriyada 65535 dan ortiq vertex bor.');}
  B.atomics.forEach((a,i)=>{if(a.frame>=B.frames.length||a.geom>=B.geoms.length){rep.ok=false;rep.errors.push('Atomic '+i+' noto\'g\'ri frame/geometriyaga bog\'langan.');}});
  const FWB=G.frameWorlds(B.frames);
  jobs.forEach(job=>{
    // yangi bamper atomiclari: asosiy frame'da bo'lganlar
    const at=[];B.atomics.forEach((a,i)=>{if(a.frame===job.targetFrame)at.push(i);});
    const pts=[];at.forEach(i=>{const wm=G.worldMesh(B,i);if(wm)pts.push(...Array.from(wm.wpos));});
    if(!pts.length){rep.ok=false;rep.errors.push(job.kind+': bamper frame\'ida geometriya yo\'q.');return;}
    const bb=bboxOf(new Float32Array(pts)),exp=job.fit.newBB,tol=0.02;
    const dif=[0,1,2].map(i=>Math.max(Math.abs(bb.min[i]-exp.min[i]),Math.abs(bb.max[i]-exp.max[i])));
    const good=dif.every(d=>d<tol);
    if(!good){rep.ok=false;rep.errors.push(job.kind+': joylashuv kutilganidan farq qiladi (max '+Math.max(...dif).toFixed(3)+' m).');}
    else rep.lines.push('✓ '+(job.kind==='front'?'Old':'Orqa')+' bamper: yangi detal aynan moslangan joyda (farq < 2 sm).');
    rep['bb_'+job.kind]=bb;
  });
  rep.atomics=[A.atomics.length,B.atomics.length];rep.geoms=[A.geoms.length,B.geoms.length];
  return rep;

const TINT={old:[1,.3,.25],don:[.25,.92,.4],hov:[.3,.8,1],oth:[1,.62,.2]};
function compose(){
  const list=[];if(!S.base){view.setEnts(list);return;}
  const act=J(),other=S.jobs[S.active==='front'?'rear':'front'];
  const hov=S.hover;
  if(S.scene==='donor'&&act.donor){
    const m=act.donor.model;
    m.parts.forEach(p=>{const e=instOf(m.uid+':'+p.ai+':d',m,p);e.M=ID4;e.NM=[1,0,0,0,1,0,0,0,1];e.visible=true;e.pick=true;e.alpha=1;
      if(hov&&hov.m===m&&hov.ai===p.ai){e.tint=TINT.hov;e.mix=.7;}else if(act.donorSel.has(p.ai)){e.tint=TINT.don;e.mix=.55;}else{e.tint=null;e.mix=0;}list.push(e);});
  }else if(S.scene==='base'||(S.scene==='donor'&&!act.donor)){
    S.base.parts.forEach(p=>{const e=instOf(S.base.uid+':'+p.ai+':b',S.base,p);e.M=ID4;e.NM=[1,0,0,0,1,0,0,0,1];e.visible=true;e.pick=true;e.alpha=1;
      if(hov&&hov.m===S.base&&hov.ai===p.ai){e.tint=TINT.hov;e.mix=.7;}else if(act.oldSel.has(p.ai)){e.tint=TINT.old;e.mix=.6;}else if(other.oldSel.has(p.ai)){e.tint=TINT.oth;e.mix=.4;}else{e.tint=null;e.mix=0;}list.push(e);});
  }else{ // natija
    const removed=new Set();
    for(const k of['front','rear']){const j=S.jobs[k];if(!ready(j)||!j.enabled)continue;j.oldSel.forEach(a=>removed.add(a));if(S.dam!=='keep')S.det[k].dam.forEach(a=>removed.add(a));}
    S.base.parts.forEach(p=>{const e=instOf(S.base.uid+':'+p.ai+':b',S.base,p);e.M=ID4;e.NM=[1,0,0,0,1,0,0,0,1];e.pick=false;e.tint=null;e.mix=0;e.alpha=1;e.visible=!removed.has(p.ai);list.push(e);});
    if(S.ghost)for(const k of['front','rear']){const j=S.jobs[k];if(!ready(j)||!j.enabled||k!==S.active)continue;
      j.oldSel.forEach(a=>{const p=partOf(S.base,a),e=instOf(S.base.uid+':'+a+':g',S.base,p);e.M=ID4;e.NM=[1,0,0,0,1,0,0,0,1];e.visible=true;e.pick=false;e.tint=TINT.old;e.mix=.8;e.alpha=.28;list.push(e);});}
    for(const k of['front','rear']){const j=S.jobs[k];if(!ready(j)||!j.enabled)continue;const fr=j.fitRes||refit(j);if(!fr)continue;
      const M=BS.A2M4(fr.A),NM=BS.m3inv(fr.A.R);
      donorParts(j).forEach(p=>{const e=instOf(j.donor.model.uid+':'+p.ai+':f'+k,j.donor.model,p);e.M=M;e.NM=NM;e.visible=true;e.pick=false;e.tint=null;e.mix=0;e.alpha=1;list.push(e);});}
  }
  view.setEnts(list);
}
const ready=j=>!!(j.donor&&j.donorSel.size&&j.oldSel.size);

function toggleSel(which,ai){

/* ---------- eksport ---------- */
function pickTarget(j){
  const ps=oldParts(j),cand=ps.filter(p=>p.kind===j.kind&&!p.dam).sort((a,b)=>b.nV-a.nV);
  if(cand.length)return cand[0].frame;
  return ps.slice().sort((a,b)=>b.nV-a.nV)[0].frame;
}
const buildable=()=>!!S.base&&['front','rear'].some(k=>S.jobs[k].enabled&&ready(S.jobs[k]));
function texNeeds(){
  const js=['front','rear'].filter(k=>S.jobs[k].enabled&&ready(S.jobs[k])).map(k=>S.jobs[k]);
  return js.map(j=>{const set=new Set();donorParts(j).forEach(p=>p.tex.forEach(t=>set.add(t)));return{job:j,txd:j.donor.txd,names:[...set]};});
}
function compute(){
  const needs=texNeeds();
  const rep=BS.mergeTxd(S.baseTxd,needs.map(n=>({txd:n.txd,names:n.names})));
  const jobs=needs.map((n,i)=>{const j=n.job;const fr=refit(j);return{kind:j.kind,oldAis:[...j.oldSel],damAis:S.det[j.kind].dam.slice(),targetFrame:pickTarget(j),
    donor:{model:j.donor.model,ais:[...j.donorSel]},fit:fr,texRename:rep.renames[i]||{}};});
  const out=BS.buildOutput(S.base,jobs,{dam:S.dam}),ver=BS.verify(S.base.bytes,out.bytes,jobs);
  return{out,ver,rep,jobs,needs};
}
function runBuild(){
  try{const r=compute();S.out=r;renderReport();return r;}catch(e){console.error(e);toast(e.message);return null;}
}
function renderReport(){
  const el=$('#report');if(!el)return;el.replaceChildren();const r=S.out;if(!r)return;

const crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=crcT[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};
function makeZip(entries){
  const enc=new TextEncoder(),chunks=[],central=[];let off=0;const d=new Date();
  const time=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,date=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
  for(const e of entries){const nm=enc.encode(e.name),data=typeof e.data==='string'?enc.encode(e.data):e.data,crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,nm.length,true);chunks.push(new Uint8Array(lh.buffer),nm,data);
    const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);ch.setUint16(28,nm.length,true);ch.setUint32(38,0o100644*65536>>>0,true);ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+data.length;}
  const cs=central.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,entries.length,true);end.setUint16(10,entries.length,true);end.setUint32(12,cs,true);end.setUint32(16,off,true);
  return new Blob([...chunks,...central,new Uint8Array(end.buffer)],{type:'application/zip'});
}
function dlZip(){const r=runBuild();if(!r)return;if(!r.ver.ok){toast('Tekshiruvda xato bor — hisobotni ko\'ring.');return;}
  const dir='bamper-almashtirish/',ent=[{name:dir+S.base.name,data:r.out.bytes}];
  if(S.baseTxd||r.rep.added.length)ent.push({name:dir+txdOutName(),data:r.rep.bytes});
  ent.push({name:dir+'YORIQNOMA.txt',data:readme(r)});save(makeZip(ent),'bamper_'+bn()+'.zip');toast('ZIP tayyor (fayllar asl nomlari bilan).');}

<script>

  var fin=function(v){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.parentNode&&sc.remove();res(v);};

 function showLock(msg){

 function checkVpn(){

 function tick(){
