<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Translate | IT SHAKH</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"><style>.upload{display:block;border:1px dashed var(--accent);border-radius:14px;padding:34px 18px;text-align:center;cursor:pointer;background:rgba(3,10,19,.55)}.upload input{display:none}.upload:hover{box-shadow:var(--glow)}.pick{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.pick button{color:var(--text);background:transparent;border:1px solid rgba(56,189,248,.5);font-size:11px}.pick .on{color:#021018;background:var(--accent)}#name{margin:14px 0;color:var(--accent);font:13px monospace}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// FORMAT SAFE CONVERTER</div><h1>TRANSLATE</h1><p class="intro">Word va Excel hujjatlaridagi faqat harflarni o‘giradi. Chiziqlar, jadval, rasm, joylashuv va format saqlanadi.</p><section class="panel"><label class="upload"><input id="file" type="file" accept=".docx,.xlsx,.xls,.txt"><b>FAYLNI TANLANG</b><br><span class="notice">DOCX, XLSX, XLS yoki TXT</span></label><div id="name">Fayl tanlanmagan</div><div class="label">YO‘NALISH</div><div class="pick"><button class="on" data-m="auto">AVTOMATIK</button><button data-m="c2l">KIRILL → LOTIN</button><button data-m="l2c">LOTIN → KIRILL</button></div><button id="go">O‘GIRISH VA YUKLASH</button><p class="notice" id="status">Fayl faqat sizning brauzeringizda qayta ishlanadi.</p></section></main><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script>const f=document.getElementById('file'),n=document.getElementById('name'),s=document.getElementById('status');let mode='auto';const cm={'А':'A','а':'a','Б':'B','б':'b','В':'V','в':'v','Г':'G','г':'g','Ғ':'Gʻ','ғ':'gʻ','Д':'D','д':'d','Е':'E','е':'e','Ё':'Yo','ё':'yo','Ж':'J','ж':'j','З':'Z','з':'z','И':'I','и':'i','Й':'Y','й':'y','К':'K','к':'k','Л':'L','л':'l','М':'M','м':'m','Н':'N','н':'n','О':'O','о':'o','П':'P','п':'p','Қ':'Q','қ':'q','Р':'R','р':'r','С':'S','с':'s','Т':'T','т':'t','У':'U','у':'u','Ф':'F','ф':'f','Х':'X','х':'x','Ҳ':'H','ҳ':'h','Ц':'Ts','ц':'ts','Ч':'Ch','ч':'ch','Ш':'Sh','ш':'sh','Ъ':'','ъ':'','Ь':'','ь':'','Э':'E','э':'e','Ю':'Yu','ю':'yu','Я':'Ya','я':'ya','Ў':'Oʻ','ў':'oʻ'};const lm=[['o[ʻ’‘\']','ў'],['g[ʻ’‘\']','ғ'],['sh','ш'],['ch','ч'],['yo','ё'],['yu','ю'],['ya','я'],['ts','ц'],['a','а'],['b','б'],['v','в'],['g','г'],['d','д'],['e','е'],['j','ж'],['z','з'],['i','и'],['y','й'],['k','к'],['l','л'],['m','м'],['n','н'],['o','о'],['p','п'],['q','қ'],['r','р'],['s','с'],['t','т'],['u','у'],['f','ф'],['x','х'],['h','ҳ']];const cap=(x,y)=>x===x.toUpperCase()?y.toUpperCase():x[0]===x[0].toUpperCase()?y[0].toUpperCase()+y.slice(1):y;function cl(x){return String(x).replace(/[А-Яа-яЎўҚқҒғҲҳ]/g,k=>cm[k]||k)}function lc(x){let y=String(x);lm.forEach(([a,b])=>y=y.replace(new RegExp(a,'gi'),z=>cap(z,b)));return y}function tr(x){if(mode==='c2l')return cl(x);if(mode==='l2c')return lc(x);return((String(x).match(/[А-Яа-яЎўҚқҒғҲҳ]/g)||[]).length>=(String(x).match(/[A-Za-zʻ’‘']/g)||[]).length)?cl(x):lc(x)}function save(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}f.onchange=()=>n.textContent=f.files[0]?f.files[0].name:'Fayl tanlanmagan';document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',x===b))});document.getElementById('go').onclick=async()=>{const file=f.files[0];if(!file){s.textContent='Avval faylni tanlang.';return}const ext=file.name.split('.').pop().toLowerCase(),base=file.name.replace(/\.[^.]+$/,'');s.textContent='Faqat harflar o‘girilmoqda…';try{const data=await file.arrayBuffer();if(ext==='docx'){if(!window.JSZip)throw Error('Kutubxona yuklanmadi. Internetni tekshiring.');const zip=await JSZip.loadAsync(data);const paths=Object.keys(zip.files).filter(p=>/^word\/(document|header\d+|footer\d+|footnotes|endnotes|comments)\.xml$/i.test(p));await Promise.all(paths.map(async p=>{const xml=await zip.file(p).async('string');zip.file(p,xml.replace(/(<w:t(?:\s[^>]*)?>)([\s\S]*?)(<\/w:t>)/g,(_,a,text,b)=>a+tr(text)+b))}));save(await zip.generateAsync({type:'blob',compression:'DEFLATE'}),base+'-translated.docx')}else if(ext==='xlsx'||ext==='xls'){const wb=XLSX.read(data,{type:'array'});wb.SheetNames.forEach(k=>Object.keys(wb.Sheets[k]).forEach(c=>{const cell=wb.Sheets[k][c];if(cell&&cell.t==='s'){cell.v=tr(cell.v);cell.w=cell.v}}));save(new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),base+'-translated.xlsx')}else if(ext==='txt')save(new Blob([tr(new TextDecoder().decode(data))],{type:'text/plain;charset=utf-8'}),base+'-translated.txt');else throw Error('Faqat DOCX, XLSX, XLS yoki TXT tanlang.');s.textContent='✓ Tayyor. Chiziq va format saqlangan yangi fayl yuklandi.'}catch(e){s.textContent='✕ Xatolik: '+e.message}};</script></body></html>
