<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Background Remover | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>.drop{display:block;width:100%;border:1px dashed var(--accent);padding:28px;border-radius:14px;text-align:center;cursor:pointer;background:rgba(3,10,19,.45);transition:.2s}.drop:hover{box-shadow:var(--glow);background:rgba(3,10,19,.7)}.drop input{display:none}.drop b{display:block;font-size:15px;margin-bottom:6px}.preview{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.preview>div{min-width:0}.preview img{display:block;width:100%;height:360px;max-height:420px;object-fit:contain;border-radius:12px;background:repeating-conic-gradient(#1a2b3b 0 25%,#09141e 0 50%) 50%/22px 22px;border:1px solid rgba(56,189,248,.18);margin-top:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}@media(max-width:650px){.preview{grid-template-columns:1fr}.preview img{height:300px}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header><main><div class="eyebrow">// AI IMAGE TOOL</div><h1>BACKGROUND REMOVER</h1><p class="intro">Rasm fonini AI yordamida olib tashlaydi. Birinchi ishlatishda AI modeli brauzerga yuklanadi.</p><section class="panel"><label class="drop"><input id="file" type="file" accept="image/*"><b>RASMMI TANLANG</b><br><span class="notice">PNG, JPG yoki WebP</span></label><p id="status" class="notice">Rasm tanlang.</p><div class="preview"><div><b>ORIGINAL</b><img id="before"></div><div><b>FONSIZ</b><img id="after"></div></div><div class="actions"><a id="download" class="secondary" hidden>↓ PNG YUKLAB OLISH</a></div></section></main><script type="module">const file=document.getElementById('file'),status=document.getElementById('status'),before=document.getElementById('before'),after=document.getElementById('after'),download=document.getElementById('download');file.onchange=async()=>{const f=file.files[0];if(!f)return;before.src=URL.createObjectURL(f);after.removeAttribute('src');download.hidden=true;status.textContent='AI modeli yuklanmoqda…';try{const {removeBackground}=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm');status.textContent='Fon olib tashlanmoqda…';const blob=await removeBackground(f,{progress:(p)=>{if(p&&p.progress)status.textContent='Model: '+Math.round(p.progress*100)+'%'}});const url=URL.createObjectURL(blob);after.src=url;download.href=url;download.download='it-shakh-no-background.png';download.hidden=false;status.textContent='Tayyor.'}catch(e){console.error(e);status.textContent='Fon olib tashlashda xatolik. Internet ulanishini tekshiring.'}};</script></body></html>
