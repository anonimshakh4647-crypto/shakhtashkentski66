:root{--bg:#05080e;--panel:#0b1220;--panel2:#101a2c;--line:#26354c;--accent:#38bdf8;--accent2:#8b5cf6;--text:#e5e7eb;--muted:#8ea0b8;--sheet:#fff;--sheetText:#111827}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#10243b 0,#05080e 45%);color:var(--text);font-family:Inter,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.top{height:62px;border-bottom:1px solid #1e2b3e;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:50;background:rgba(5,8,14,.92);backdrop-filter:blur(14px)}.brand{font-weight:800;letter-spacing:2px}.nav{display:flex;gap:8px;align-items:center}.nav button,.nav a{background:transparent;color:var(--text);border:1px solid #26354c;border-radius:9px;padding:8px 11px;text-decoration:none;font-size:12px}.nav button:hover,.nav a:hover{border-color:var(--accent);color:var(--accent)}main{padding:18px;max-width:1600px;margin:auto}.hero{text-align:center;margin:4px 0 14px}.hero h1{font-size:clamp(24px,4vw,38px);margin:0 0 5px}.hero p{margin:0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;justify-content:center;margin:16px 0}.tabs button{padding:10px 28px;background:#0b1220;border:1px solid #26354c;color:#dbeafe;border-radius:10px;font-weight:800}.tabs .on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#03111b;border-color:transparent}.app{display:none}.app.on{display:block}.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:linear-gradient(180deg,#101a2c,#0b1220);border:1px solid #26354c;border-radius:12px;padding:8px;margin-bottom:8px}.bar button,.bar select,.bar input{height:34px;background:#07101c;color:#dbeafe;border:1px solid #293b55;border-radius:7px;padding:0 9px;font-size:12px}.bar button:hover{border-color:var(--accent);color:var(--accent)}.bar .primary{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#03111b;border:0;font-weight:800}.sep{width:1px;height:24px;background:#334155;margin:0 3px}.formula{display:grid;grid-template-columns:85px 1fr;gap:6px;margin-bottom:8px}.formula input{height:36px;background:#07101c;color:#e5e7eb;border:1px solid #293b55;border-radius:7px;padding:0 10px}.gridwrap{background:#fff;border:1px solid #26354c;border-radius:10px;overflow:auto;height:65vh}.grid{border-collapse:collapse;width:max-content;min-width:100%;table-layout:fixed;color:var(--sheetText)}.grid th,.grid td{border:1px solid #d5dbe3;height:27px;min-width:105px}.grid th{position:sticky;top:0;background:#eef2f7;color:#334155;font-size:11px;z-index:3}.grid th.corner{left:0;z-index:5;width:42px;min-width:42px}.grid td.rn{position:sticky;left:0;background:#eef2f7;text-align:center;color:#64748b;font-size:11px;z-index:2;width:42px;min-width:42px}.cell{width:100%;height:26px;border:0;outline:0;padding:3px 6px;background:transparent;color:#111827;font-size:12px}.cell.sel{outline:2px solid #38bdf8;outline-offset:-2px;background:#eff6ff}.sheetbar{display:flex;gap:5px;align-items:center;background:#0b1220;border:1px solid #26354c;border-top:0;border-radius:0 0 10px 10px;padding:6px;overflow:auto}.sheet{background:#07101c;border:1px solid #293b55;color:#dbeafe;padding:7px 14px;border-radius:7px;white-space:nowrap}.sheet.active{background:#1d4ed8;border-color:#38bdf8}.status{min-height:20px;color:#8ea0b8;font-size:11px;margin:7px 2px}.word-tools{display:flex;flex-wrap:wrap;gap:6px}.word-tools button,.word-tools select,.word-tools input{height:34px;background:#07101c;color:#dbeafe;border:1px solid #293b55;border-radius:7px;padding:0 8px}.page{background:#dbe1e8;padding:28px;min-height:70vh;overflow:auto}.doc{background:#fff;color:#111827;max-width:850px;min-height:1050px;margin:auto;padding:80px;outline:0;box-shadow:0 8px 35px #0007;font-family:Arial,sans-serif;line-height:1.55}.doc table{border-collapse:collapse;width:100%}.doc td,.doc th{border:1px solid #555;padding:6px}.doc img{max-width:100%}.findbox{display:flex;gap:6px;align-items:center}.findbox input{width:150px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:100}.modal.on{display:flex}.dialog{width:min(900px,94vw);max-height:88vh;overflow:auto;background:#0b1220;border:1px solid #334155;border-radius:14px;padding:16px}.dialog h3{margin-top:0}.dialog input,.dialog select,.dialog textarea{width:100%;background:#050b14;color:#e5e7eb;border:1px solid #334155;border-radius:7px;padding:8px}.dialog .actions{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}.small{font-size:11px;color:var(--muted)}.count{margin-left:auto;color:#64748b;font-size:11px}.hidden{display:none!important}@media(max-width:800px){.top{height:auto;padding:10px;gap:8px;flex-wrap:wrap}.nav{width:100%;justify-content:flex-end}.doc{padding:35px;min-height:800px}.page{padding:10px}.gridwrap{height:58vh}.bar{overflow-x:auto;flex-wrap:nowrap}.formula{grid-template-columns:70px 1fr}}

<script>
(()=>{
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
// common
$('excelTab').onclick=()=>{ $('excelTab').classList.add('on');$('wordTab').classList.remove('on');$('excelApp').classList.add('on');$('wordApp').classList.remove('on');};
$('wordTab').onclick=()=>{ $('wordTab').classList.add('on');$('excelTab').classList.remove('on');$('wordApp').classList.add('on');$('excelApp').classList.remove('on');};
$('mode').onclick=()=>{document.body.classList.toggle('light');document.body.style.setProperty('--bg',document.body.classList.contains('light')?'#eef3f8':'#05080e');document.body.style.setProperty('--text',document.body.classList.contains('light')?'#0f172a':'#e5e7eb');};
function modal(title,body,ok){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modal').classList.add('on');$('modalOk').onclick=()=>{ok?.();$('modal').classList.remove('on')};$('modalCancel').onclick=()=>$('modal').classList.remove('on')}
// EXCEL ENGINE
let book=[{name:'Sheet1',data:Array.from({length:30},()=>Array(12).fill('')),merges:[]}], active=0, selected={r:0,c:0}, anchor=null, history=[], future=[];
const grid=$('grid');
function col(n){let s='';n++;while(n){let x=(n-1)%26;s=String.fromCharCode(65+x)+s;n=Math.floor((n-1)/26)}return s}
function coord(r,c){return col(c)+(r+1)}
function parseAddr(a){let m=String(a).toUpperCase().match(/^([A-Z]+)(\d+)$/);if(!m)return null;let c=0;for(const ch of m[1])c=c*26+ch.charCodeAt(0)-64;return {r:+m[2]-1,c:c-1}}
function cur(){return book[active]}
function snapshot(){history.push(JSON.stringify(book));if(history.length>60)history.shift();future=[]}
function value(r,c,seen=new Set()){
let raw=cur().data[r]?.[c]??'';if(typeof raw!=='string'||raw[0]!=='=')return raw;if(seen.has(r+','+c))return '#CYCLE!';seen.add(r+','+c);return evalFormula(raw.slice(1),seen)}
function rangeVals(a,b,seen){let p=parseAddr(a),q=parseAddr(b);if(!p||!q)return[];let out=[];for(let r=Math.min(p.r,q.r);r<=Math.max(p.r,q.r);r++)for(let c=Math.min(p.c,q.c);c<=Math.max(p.c,q.c);c++){let v=value(r,c,new Set(seen||[]));if(v!==''&&!isNaN(Number(v)))out.push(Number(v));}return out}
function evalFormula(f,seen=new Set()){
let s=f.trim();s=s.replace(/\b([A-Z]{1,3}\d+)\b/g,(m)=>{let p=parseAddr(m);return p?JSON.stringify(value(p.r,p.c,seen)):m});
s=s.replace(/([A-Z]{1,3}\d+):([A-Z]{1,3}\d+)/gi,(m,a,b)=>JSON.stringify(rangeVals(a,b,seen)));
// restore functions before generic eval by evaluating directly on original function patterns
const orig=f.toUpperCase();let m;
const funcs={SUM:x=>x.reduce((a,b)=>a+b,0),AVERAGE:x=>x.length?x.reduce((a,b)=>a+b,0)/x.length:0,MIN:x=>Math.min(...x),MAX:x=>Math.max(...x),COUNT:x=>x.length};
for(const [fn,cb] of Object.entries(funcs)){let re=new RegExp(fn+'\\(([^()]*)\\)','gi');s=s.replace(re,(_,inside)=>{let nums=[];inside.split(',').forEach(part=>{let rm=part.trim().match(/^\[([^\]]*)\]$/);if(rm)nums.push(...rm[1].split(',').filter(Boolean).map(Number));else if(!isNaN(Number(part)))nums.push(Number(part));});return cb(nums)})}
s=s.replace(/IF\(([^,]+),([^,]+),([^\)]+)\)/gi,(_,a,b,c)=>Number(a)?b:c).replace(/ROUND\(([^,]+),([^\)]+)\)/gi,(_,a,n)=>Number(Number(a).toFixed(Number(n))));
s=s.replace(/ABS\(([^\)]+)\)/gi,(_,x)=>Math.abs(Number(x))).replace(/SQRT\(([^\)]+)\)/gi,(_,x)=>Math.sqrt(Number(x))).replace(/POWER\(([^,]+),([^\)]+)\)/gi,(_,a,b)=>Math.pow(Number(a),Number(b)));
s=s.replace(/\bTRUE\b/gi,'1').replace(/\bFALSE\b/gi,'0').replace(/\^/g,'**');
try{let z=Function('"use strict";return ('+s+')')();return Number.isFinite(z)?Math.round(z*1e12)/1e12:z}catch{return '#ERROR!'}}
function render(){let d=cur().data,R=d.length,C=d[0]?.length||1;let h='<thead><tr><th class="corner">#</th>';for(let c=0;c<C;c++)h+='<th>'+col(c)+'</th>';h+='</tr></thead><tbody>';for(let r=0;r<R;r++){h+='<tr><td class="rn">'+(r+1)+'</td>';for(let c=0;c<C;c++){let v=value(r,c);h+='<td><input class="cell" data-r="'+r+'" data-c="'+c+'" value="'+esc(v)+'"></td>'}h+='</tr>'}grid.innerHTML=h+'</tbody>';grid.querySelectorAll('.cell').forEach(x=>{x.onfocus=()=>select(+x.dataset.r,+x.dataset.c);x.onclick=()=>select(+x.dataset.r,+x.dataset.c);x.oninput=()=>{let r=+x.dataset.r,c=+x.dataset.c;cur().data[r][c]=x.value;updateFormula();};x.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();select(+x.dataset.r+1,+x.dataset.c);grid.querySelector('.cell[data-r="'+(+x.dataset.r+1)+'"][data-c="'+x.dataset.c+'"]')?.focus()}if(e.key==='Tab'){e.preventDefault();select(+x.dataset.r,+x.dataset.c+1);grid.querySelector('.cell[data-r="'+(+x.dataset.r)+'"][data-c="'+(+x.dataset.c+1)+'"]')?.focus()}}});renderSheets();updateFormula()}
function select(r,c){selected={r:Math.max(0,r),c:Math.max(0,c)};$('nameBox').value=coord(r,c);$('selInfo').textContent=coord(r,c);let x=grid.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]');grid.querySelectorAll('.sel').forEach(a=>a.classList.remove('sel'));x?.classList.add('sel');updateFormula()}
function updateFormula(){$('formula').value=cur().data[selected.r]?.[selected.c]??'';$('selInfo').textContent=coord(selected.r,selected.c);$('nameBox').value=coord(selected.r,selected.c)}
function commitFormula(){let v=$('formula').value;cur().data[selected.r][selected.c]=v;render();select(selected.r,selected.c)}
function renderSheets(){let s=$('sheets');s.innerHTML='';book.forEach((sh,i)=>{let b=document.createElement('button');b.className='sheet '+(i===active?'active':'');b.textContent=sh.name;b.onclick=()=>{active=i;render()};s.appendChild(b)});let add=document.createElement('button');add.className='sheet';add.textContent='＋';add.onclick=()=>{snapshot();book.push({name:'Sheet'+(book.length+1),data:Array.from({length:30},()=>Array(12).fill('')),merges:[]});active=book.length-1;render()};s.appendChild(add)}
function expand(r,c){while(cur().data.length<=r)cur().data.push(Array(cur().data[0].length).fill(''));while(cur().data[0].length<=c)cur().data.forEach(x=>x.push(''))}
$('formula').onkeydown=e=>{if(e.key==='Enter')commitFormula()};$('nameBox').onkeydown=e=>{if(e.key==='Enter'){let p=parseAddr(e.target.value);if(p){expand(p.r,p.c);select(p.r,p.c);grid.querySelector('.cell[data-r="'+p.r+'"][data-c="'+p.c+'"]').focus()}}};
$('newBook').onclick=()=>{snapshot();book=[{name:'Sheet1',data:Array.from({length:30},()=>Array(12).fill('')),merges:[]}];active=0;render();$('excelStatus').textContent='Yangi workbook.'};
$('addRow').onclick=()=>{snapshot();cur().data.splice(selected.r+1,0,Array(cur().data[0].length).fill(''));render();select(selected.r+1,selected.c)};$('addCol').onclick=()=>{snapshot();cur().data.forEach(r=>r.splice(selected.c+1,0,''));render();select(selected.r,selected.c+1)};$('delRow').onclick=()=>{if(cur().data.length>1){snapshot();cur().data.splice(selected.r,1);selected.r=Math.max(0,selected.r-1);render();}};$('delCol').onclick=()=>{if(cur().data[0].length>1){snapshot();cur().data.forEach(r=>r.splice(selected.c,1));selected.c=Math.max(0,selected.c-1);render();}};
$('undo').onclick=()=>{if(history.length){future.push(JSON.stringify(book));book=JSON.parse(history.pop());active=Math.min(active,book.length-1);render()}};$('redo').onclick=()=>{if(future.length){history.push(JSON.stringify(book));book=JSON.parse(future.pop());active=Math.min(active,book.length-1);render()}};
function styleCell(prop,val){let x=grid.querySelector('.cell[data-r="'+selected.r+'"][data-c="'+selected.c+'"]');if(!x)return;x.style[prop]=val;}
$('bold').onclick=()=>styleCell('fontWeight','bold');$('italic').onclick=()=>styleCell('fontStyle','italic');$('underline').onclick=()=>styleCell('textDecoration','underline');$('fontName').onchange=e=>styleCell('fontFamily',e.target.value);$('fontSize').onchange=e=>styleCell('fontSize',e.target.value+'px');$('textColor').oninput=e=>styleCell('color',e.target.value);$('fillColor').oninput=e=>styleCell('background',e.target.value);$('alignL').onclick=()=>styleCell('textAlign','left');$('alignC').onclick=()=>styleCell('textAlign','center');$('alignR').onclick=()=>styleCell('textAlign','right');$('border').onclick=()=>styleCell('boxShadow','inset 0 0 0 1px #111827');$('numFmt').onchange=e=>{let v=cur().data[selected.r][selected.c];if(e.target.value==='0%'&&!isNaN(v))cur().data[selected.r][selected.c]=Number(v)*100+'%';render()};
$('merge').onclick=()=>modal('Kataklarni birlashtirish','<p>Hozir tanlangan katakdan boshlab nechta qator va ustun?</p><input id="mr" type="number" value="1" min="1"><input id="mc" type="number" value="2" min="1">',()=>{let rs=+$('mr').value,cs=+$('mc').value;let t=grid.querySelector('.cell[data-r="'+selected.r+'"][data-c="'+selected.c+'"]');if(t){t.parentElement.colSpan=cs;t.parentElement.rowSpan=rs}});
$('sortAsc').onclick=()=>sortSelected(false);$('sortDesc').onclick=()=>sortSelected(true);function sortSelected(desc){snapshot();let c=selected.c;cur().data.sort((a,b)=>String(a[c]).localeCompare(String(b[c]),undefined,{numeric:true})*(desc?-1:1));render()}
$('filter').onclick=()=>{let q=prompt('Filter qiymati (bo‘sh = hammasi):','');if(q===null)return;let c=selected.c;cur().data.forEach((r,i)=>{let el=grid.querySelector('.cell[data-r="'+i+'"][data-c="'+c+'"]')?.closest('tr');if(el)el.style.display=!q||String(r[c]).toLowerCase().includes(q.toLowerCase())?'':'none'})};
$('findCell').onclick=()=>modal('Excel — Topish','<input id="q" placeholder="Qidiriladigan matn">',()=>{let q=$('q').value.toLowerCase();for(let r=0;r<cur().data.length;r++)for(let c=0;c<cur().data[0].length;c++)if(String(cur().data[r][c]).toLowerCase().includes(q)){select(r,c);grid.querySelector('.cell[data-r="'+r+'"][data-c="'+c+'"]').focus();return}});$('replaceCell').onclick=()=>modal('Excel — Almashtirish','<input id="q" placeholder="Eski"><br><br><input id="n" placeholder="Yangi">',()=>{snapshot();let q=$('q').value,n=$('n').value;cur().data=cur().data.map(r=>r.map(v=>String(v).split(q).join(n)));render()});
$('copy').onclick=()=>navigator.clipboard?.writeText(String(cur().data[selected.r][selected.c]??''));$('cut').onclick=()=>{navigator.clipboard?.writeText(String(cur().data[selected.r][selected.c]??''));snapshot();cur().data[selected.r][selected.c]='';render()};$('paste').onclick=async()=>{try{let t=await navigator.clipboard.readText();snapshot();let rows=t.split(/\r?\n/).map(r=>r.split('\t'));rows.forEach((rr,i)=>rr.forEach((v,j)=>{expand(selected.r+i,selected.c+j);cur().data[selected.r+i][selected.c+j]=v}));render()}catch{alert('Clipboard ruxsati berilmadi. Ctrl+V bilan katakka qo‘yishingiz mumkin.')}};
$('freeze').onclick=()=>{$('gridwrap').style.position='relative';$('grid').querySelectorAll('th').forEach(x=>x.style.position='sticky');$('excelStatus').textContent='Freeze ko‘rinishi yoqildi.'};$('validate').onclick=()=>modal('Data validation','<p>Tanlangan katak uchun vergul bilan variantlar kiriting.</p><input id="opts" placeholder="Ha,Yo‘q,Jarayonda">',()=>{let x=grid.querySelector('.cell[data-r="'+selected.r+'"][data-c="'+selected.c+'"]');if(x){x.setAttribute('list','dvlist');let dl=document.getElementById('dvlist')||document.body.appendChild(Object.assign(document.createElement('datalist'),{id:'dvlist'}));dl.innerHTML=$('opts').value.split(',').map(v=>'<option value="'+esc(v.trim())+'">').join('');x.setAttribute('list','dvlist')}});
$('chartBtn').onclick=()=>{let labels=cur().data.slice(0,20).map((r,i)=>r[0]||String(i+1));let vals=cur().data.slice(0,20).map(r=>Number(r[1])||0);modal('Diagramma','<canvas id="chart" height="220"></canvas>',()=>{});setTimeout(()=>new Chart($('chart'),{type:'bar',data:{labels,datasets:[{label:'B ustun',data:vals}]},options:{responsive:true}}),50)};
$('xlsxOpen').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{try{let wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array',cellFormula:true});book=wb.SheetNames.map(n=>{let ws=wb.Sheets[n],a=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});let R=Math.max(a.length,1),C=Math.max(...a.map(x=>x.length),1);let data=Array.from({length:R},(_,r)=>Array.from({length:C},(_,c)=>{let cell=ws[XLSX.utils.encode_cell({r,c})];return cell?.f?'='+cell.f:(a[r]?.[c]??'')}));return{name:n,data,merges:ws['!merges']||[]}});active=0;render();$('excelStatus').textContent='✔ '+f.name+' ochildi.'}catch(err){alert(err.message)}};rd.readAsArrayBuffer(f);e.target.value=''};
$('saveXlsx').onclick=()=>{let wb=XLSX.utils.book_new();book.forEach(sh=>{let ws=XLSX.utils.aoa_to_sheet(sh.data);XLSX.utils.book_append_sheet(wb,ws,sh.name.slice(0,31)||'Sheet');});XLSX.writeFile(wb,'IT-SHAKH-Office.xlsx')};$('saveCsv').onclick=()=>{let ws=XLSX.utils.aoa_to_sheet(cur().data),csv=XLSX.utils.sheet_to_csv(ws);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=cur().name+'.csv';a.click()};$('printSheet').onclick=()=>{let w=open('','_blank');w.document.write('<html><body>'+grid.outerHTML+'<script>print()<\\/script></body></html>');w.document.close()};
render();
// WORD
const doc=$('doc');function wcmd(cmd,arg=null){doc.focus();document.execCommand(cmd,false,arg);updateCount()};$('wUndo').onclick=()=>wcmd('undo');$('wRedo').onclick=()=>wcmd('redo');$('wBold').onclick=()=>wcmd('bold');$('wItalic').onclick=()=>wcmd('italic');$('wUnderline').onclick=()=>wcmd('underline');$('wStrike').onclick=()=>wcmd('strikeThrough');$('wLeft').onclick=()=>wcmd('justifyLeft');$('wCenter').onclick=()=>wcmd('justifyCenter');$('wRight').onclick=()=>wcmd('justifyRight');$('wJustify').onclick=()=>wcmd('justifyFull');$('wUL').onclick=()=>wcmd('insertUnorderedList');$('wOL').onclick=()=>wcmd('insertOrderedList');$('block').onchange=e=>wcmd('formatBlock',e.target.value);$('wFont').onchange=e=>wcmd('fontName',e.target.value);$('wSize').onchange=e=>wcmd('fontSize',e.target.value);$('wColor').oninput=e=>wcmd('foreColor',e.target.value);$('wHighlight').oninput=e=>wcmd('hiliteColor',e.target.value);$('wLink').onclick=()=>{let u=prompt('URL:','https://');if(u)wcmd('createLink',u)};$('insertHR').onclick=()=>wcmd('insertHorizontalRule');$('insertDate').onclick=()=>wcmd('insertText',new Date().toLocaleDateString('uz-UZ'));$('wTable').onclick=()=>{let r=+prompt('Qator:',3)||3,c=+prompt('Ustun:',3)||3;let t='<table><tbody>'+Array.from({length:r},()=>'<tr>'+Array.from({length:c},()=>'<td>&nbsp;</td>').join('')+'</tr>').join('')+'</tbody></table><p></p>';wcmd('insertHTML',t)};$('wImage').onclick=()=>$('imgInput').click();$('imgInput').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>wcmd('insertImage',rd.result);rd.readAsDataURL(f)};
$('docNew').onclick=()=>{doc.innerHTML='<h1>Yangi hujjat</h1><p>Hujjatingizni shu yerda yozishni boshlang...</p>';updateCount()};function updateCount(){let t=doc.innerText||'';$('wordCount').textContent=(t.trim()?t.trim().split(/\s+/).length:0)+' so‘z · '+t.length+' belgi'}doc.oninput=updateCount;updateCount();
$('docOpen').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=ev=>{if(f.name.endsWith('.txt'))doc.innerText=ev.target.result;else if(f.name.endsWith('.html'))doc.innerHTML=ev.target.result;else mammoth.convertToHtml({arrayBuffer:ev.target.result}).then(x=>doc.innerHTML=x.value).catch(x=>alert(x.message));updateCount()};rd.readAsArrayBuffer(f);e.target.value=''};
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click()}
$('docSave').onclick=()=>download('hujjat.doc','<html><body>'+doc.innerHTML+'</body></html>','application/msword');$('htmlSave').onclick=()=>download('hujjat.html','<!doctype html><html><head><meta charset="utf-8"><title>Hujjat</title></head><body>'+doc.innerHTML+'</body></html>','text/html');$('txtSave').onclick=()=>download('hujjat.txt',doc.innerText,'text/plain');$('printDoc').onclick=()=>{let w=open('','_blank');w.document.write('<html><head><title>Print</title></head><body>'+doc.innerHTML+'<script>print()<\\/script></body></html>');w.document.close()};
$('pageMargins').onclick=()=>modal('Sahifa sozlamalari','<label>Yuqori/pastki padding (px)<input id="pad" type="number" value="80"></label><br><label>Orientation<select id="ori"><option value="portrait">Portrait</option><option value="landscape">Landscape</option></select></label>',()=>{doc.style.padding=$('pad').value+'px';if($('ori').value==='landscape')doc.style.maxWidth='1100px'});
$('wordFind').onclick=()=>modal('Word — Topish','<input id="q" placeholder="Qidirish">',()=>{let q=$('q').value;if(!q)return;let n=doc.innerHTML.split(q).length-1;$('wordStatus').textContent=n+' ta topildi.'});$('wordReplace').onclick=()=>modal('Word — Almashtirish','<input id="q" placeholder="Eski"><br><br><input id="n" placeholder="Yangi">',()=>{let q=$('q').value,n=$('n').value;doc.innerHTML=doc.innerHTML.split(q).join(n);updateCount()});
$('docxSave').onclick=async()=>{if(!window.docx){alert('DOCX kutubxonasi yuklanmadi.');return}try{let {Document,Packer,Paragraph,TextRun}=docx;let lines=doc.innerText.split(/\n+/);let d=new Document({sections:[{properties:{page:{margin:{top:1000,right:1000,bottom:1000,left:1000}}},children:lines.map(x=>new Paragraph({children:[new TextRun(x)]}))}]});let b=await Packer.toBlob(d);let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='IT-SHAKH-Hujjat.docx';a.click();$('wordStatus').textContent='✔ DOCX saqlandi.'}catch(e){alert(e.message)}};
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();document.activeElement?.closest('#wordApp')?$('docxSave').click():$('saveXlsx').click()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();document.activeElement?.closest('#wordApp')?$('wordFind').click():$('findCell').click()}});
})();
</script></body></html>
