<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IT SHAKH | Excel &amp; Word Online</title>
<style>
    :root{ --ribbon-blue:#f3f2f1; --word-blue:#2b579a; --excel-green:#217346; --accent-active:var(--word-blue); }
    *{box-sizing:border-box}
    body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:#faf9f8;color:#1b1b1b}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:#04060b;color:#e5e7eb;font-size:12px}
    .topbar a{color:#38bdf8;text-decoration:none;margin-right:14px;font-weight:700}
    .app-switch{display:flex}
    .app-switch button{padding:6px 16px;border:none;background:#1b1e27;color:#cbd5e1;font:700 12px 'Segoe UI';cursor:pointer;letter-spacing:.5px}
    .app-switch button.active.word{background:var(--word-blue);color:#fff}
    .app-switch button.active.excel{background:var(--excel-green);color:#fff}

    .office{display:none}
    .office.active{display:block}
    .titlebar{display:flex;align-items:center;gap:10px;padding:6px 14px;color:#fff;font-size:13px}
    .titlebar .app-icon{width:22px;height:22px;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
    .word .titlebar{background:var(--word-blue)}
    .excel .titlebar{background:var(--excel-green)}
    .titlebar .app-icon.w{background:#1a3f73}
    .titlebar .app-icon.x{background:#14532d}
    .titlebar .fname{opacity:.95}
    .titlebar .spacer{flex:1}
    .titlebar button.save{background:transparent;border:none;color:#fff;cursor:pointer;font-size:14px}

    .ribbon-tabs{display:flex;background:#fff;border-bottom:1px solid #e1dfdd;padding-left:8px}
    .ribbon-tabs span{padding:8px 14px;font-size:13px;cursor:pointer;color:#444}
    .ribbon-tabs span.on{color:var(--accent-active);font-weight:700;border-bottom:2px solid var(--accent-active)}
    .word .ribbon-tabs span.on{color:var(--word-blue);border-color:var(--word-blue)}
    .excel .ribbon-tabs span.on{color:var(--excel-green);border-color:var(--excel-green)}

    .ribbon{display:flex;background:#fff;border-bottom:1px solid #e1dfdd;padding:6px 10px;gap:2px;overflow-x:auto}
    .rgroup{display:flex;flex-direction:column;align-items:center;padding:4px 10px;border-right:1px solid #e1dfdd}
    .rgroup:last-child{border-right:none}
    .rgroup .rrow{display:flex;gap:3px;align-items:center;margin-bottom:2px}
    .rgroup label.glabel{font-size:10.5px;color:#605e5c;margin-top:2px}
    .ribbon button{background:transparent;border:1px solid transparent;border-radius:3px;padding:4px 6px;cursor:pointer;font-size:13px;color:#1b1b1b;min-width:26px}
    .ribbon button:hover{background:#f3f2f1;border-color:#d2d0ce}
    .ribbon button.big{display:flex;flex-direction:column;align-items:center;font-size:11px;padding:4px 8px;min-width:50px}
    .ribbon button.big span.ic{font-size:18px}
    .ribbon select, .ribbon input[type=text]{border:1px solid #d2d0ce;border-radius:3px;padding:4px 6px;font-size:12px;background:#fff}
    .ribbon input[type=color]{width:26px;height:24px;border:1px solid #d2d0ce;border-radius:3px;padding:0;cursor:pointer}
    .style-gallery{display:flex;gap:4px}
    .style-card{border:1px solid #d2d0ce;border-radius:3px;padding:4px 10px;font-size:11px;cursor:pointer;text-align:center;background:#fff;min-width:56px}
    .style-card:hover{border-color:var(--word-blue)}
    .style-card b{display:block;font-size:14px}

    /* WORD page */
    .doc-scroll{background:#e8e6e3;padding:30px 10px;display:flex;justify-content:center;min-height:70vh}
    #docArea{background:#fff;width:100%;max-width:816px;min-height:1056px;padding:96px;box-shadow:0 0 10px rgba(0,0,0,.2);font-family:'Aptos','Calibri',sans-serif;font-size:12pt;line-height:1.5;outline:none;color:#1b1b1b}

    /* EXCEL grid */
    .excel-wrap{padding:0;background:#fff}
    .namebox-row{display:flex;align-items:center;gap:0;border-bottom:1px solid #d2d0ce;padding:4px 8px;background:#fff}
    .namebox{width:70px;border:1px solid #d2d0ce;border-radius:2px;padding:4px 6px;font-size:12px;font-weight:700;color:var(--excel-green)}
    .fx{padding:0 8px;font-style:italic;color:#217346;font-weight:700}
    #formulaBar{flex:1;border:none;padding:5px 8px;font-size:13px;outline:none}
    .sheet-scroll{overflow:auto;max-height:62vh;border-bottom:1px solid #d2d0ce}
    table.grid{border-collapse:collapse;width:max-content}
    table.grid th{background:#f3f2f1;color:#333;font:600 11px 'Segoe UI';padding:4px 2px;border:1px solid #d2d0ce;position:sticky;top:0;z-index:2;min-width:84px}
    table.grid th.rowhead{position:sticky;left:0;z-index:3;min-width:34px}
    table.grid td{border:1px solid #d9d9d9;padding:0}
    table.grid td.rownum{background:#f3f2f1;color:#333;font:600 11px 'Segoe UI';text-align:center;position:sticky;left:0;z-index:1;min-width:34px}
    table.grid td input{width:100%;min-width:84px;border:none;outline:none;padding:4px 6px;font:13px 'Segoe UI';color:#1b1b1b;background:transparent}
    table.grid td input:focus{outline:2px solid #217346;position:relative;z-index:1;background:#fff}
    .sheettabs{display:flex;align-items:center;gap:2px;padding:4px 10px;background:#f3f2f1}
    .sheettabs .tab{padding:5px 16px;background:#fff;border:1px solid #d2d0ce;border-bottom:2px solid var(--excel-green);font-size:12px;border-radius:2px 2px 0 0}
    .sheettabs .plus{padding:4px 10px;cursor:pointer;color:#217346;font-weight:700}

    .status{font:11px 'Segoe UI';color:#605e5c;padding:4px 12px;background:#f3f2f1}
    .status.ok{color:#0e7c3f}
    .status.err{color:#c42b1c}
    .hidden{display:none!important}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script>
(function(){
    /* ---------- App switcher ---------- */
    const tabExcel = document.getElementById('tabExcel'), tabWord = document.getElementById('tabWord');
    const excelApp = document.getElementById('excelApp'), wordApp = document.getElementById('wordApp');
    function showApp(app){
        tabExcel.classList.toggle('active', app==='excel');
        tabWord.classList.toggle('active', app==='word');
        excelApp.classList.toggle('active', app==='excel');
        wordApp.classList.toggle('active', app==='word');
        history.replaceState(null,'',location.pathname+'#'+app);
    }
    tabExcel.addEventListener('click', ()=>showApp('excel'));
    tabWord.addEventListener('click', ()=>showApp('word'));
    if(location.hash==='#excel') showApp('excel');

    /* ================= EXCEL ================= */
    let sheetData = Array.from({length:40}, ()=>Array.from({length:14}, ()=>''));
    let cellStyles = {};
    let activeCell = {r:0,c:0};
    const xlsxTable = document.getElementById('xlsxTable');
    const xlsxStatus = document.getElementById('xlsxStatus');
    const formulaBar = document.getElementById('formulaBar');
    const activeCellLabel = document.getElementById('activeCellLabel');
    function colLetter(i){ let s=''; i++; while(i>0){ let m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
    function colIndex(letters){ let n=0; for(const ch of letters){ n = n*26 + (ch.charCodeAt(0)-64); } return n-1; }
    function setXlsxStatus(msg, cls){ xlsxStatus.textContent = msg; xlsxStatus.className = 'status' + (cls?' '+cls:''); }
    function styleKey(r,c){ return r+','+c; }
    function getStyle(r,c){ return cellStyles[styleKey(r,c)] || {}; }

    function expandRange(a,b){
        const m1=a.match(/^([A-Z]+)(\d+)$/), m2=b.match(/^([A-Z]+)(\d+)$/);
        if(!m1||!m2) return [];
        const c1=colIndex(m1[1]), r1=+m1[2]-1, c2=colIndex(m2[1]), r2=+m2[2]-1;
        const rMin=Math.min(r1,r2), rMax=Math.max(r1,r2), cMin=Math.min(c1,c2), cMax=Math.max(c1,c2);
        const cells=[];
        for(let r=rMin;r<=rMax;r++) for(let c=cMin;c<=cMax;c++) cells.push({r,c});
        return cells;
    }
    function getCellRaw(r,c){ return (sheetData[r] && sheetData[r][c]!=null) ? sheetData[r][c] : ''; }
    function getCellValue(r,c,visited){
        visited = visited || new Set();
        const key=r+','+c;
        if(visited.has(key)) return 0;
        visited.add(key);
        const raw = getCellRaw(r,c);
        if(typeof raw==='string' && raw.trim().startsWith('=')){
            const v = evalFormula(raw.trim().slice(1), visited);
            return typeof v==='number' ? v : 0;
        }
        const n = parseFloat(raw);
        return isNaN(n) ? 0 : n;
    }
    function cellsToValues(cells, visited){ return cells.map(({r,c})=>getCellValue(r,c,visited)); }
    function evalFormula(expr, visited){
        visited = visited || new Set();
        let e = expr.toUpperCase().replace(/\s+/g,'');
        const funcRe = /([A-Z]+)\(([^()]*)\)/;
        let guard=0;
        while(funcRe.test(e) && guard++<50){
            e = e.replace(funcRe, (m, fn, argsStr)=>{
                if(fn === 'IF'){
                    const parts = argsStr.split(',');
                    const condRaw = (parts[0]||'0').replace(/\b([A-Z]+)(\d+)\b/g, (mm2,l,n)=>String(getCellValue(+n-1, colIndex(l), visited)));
                    let condVal = false;
                    if(/^[0-9+\-*/%.()<>=! ]*$/.test(condRaw)){
                        try{ condVal = !!Function('"use strict";return ('+condRaw+')')(); }catch(err){ condVal=false; }
                    }
                    const pick = (condVal ? parts[1] : parts[2]) || '0';
                    const pickRaw = pick.trim();
                    if(/^[A-Z]+\d+$/.test(pickRaw)){
                        const mm3=pickRaw.match(/^([A-Z]+)(\d+)$/);
                        return String(getCellValue(+mm3[2]-1, colIndex(mm3[1]), visited));
                    }
                    const n=parseFloat(pickRaw);
                    return String(isNaN(n)?0:n);
                }
                const args = argsStr.split(',').filter(a=>a.length);
                let values = [];
                args.forEach(a=>{
                    if(a.includes(':')){
                        const parts=a.split(':');
                        values = values.concat(cellsToValues(expandRange(parts[0],parts[1]), visited));
                    } else if(/^[A-Z]+\d+$/.test(a)){
                        const mm=a.match(/^([A-Z]+)(\d+)$/);
                        values.push(getCellValue(+mm[2]-1, colIndex(mm[1]), visited));
                    } else {
                        const n=parseFloat(a); values.push(isNaN(n)?0:n);
                    }
                });
                switch(fn){
                    case 'SUM': return String(values.reduce((s,v)=>s+v,0));
                    case 'AVERAGE': return String(values.length?values.reduce((s,v)=>s+v,0)/values.length:0);
                    case 'MIN': return String(values.length?Math.min(...values):0);
                    case 'MAX': return String(values.length?Math.max(...values):0);
                    case 'COUNT': return String(values.length);
                    case 'ROUND': return String(Math.round(values[0]*Math.pow(10,values[1]||0))/Math.pow(10,values[1]||0));
                    default: return '0';
                }
            });
        }
        e = e.replace(/\b([A-Z]+)(\d+)\b/g, (m,letters,num)=>String(getCellValue(+num-1, colIndex(letters), visited)));
        if(!/^[0-9+\-*/%.()<>=! ]*$/.test(e)) return '#XATO';
        try{
            const val = Function('"use strict";return ('+(e||'0')+')')();
            return typeof val==='number' && !isNaN(val) ? val : (typeof val==='boolean' ? (val?1:0) : '#XATO');
        }catch(err){ return '#XATO'; }
    }
    function displayValue(r,c){
        const raw = getCellRaw(r,c);
        if(typeof raw==='string' && raw.trim().startsWith('=')){
            const v = evalFormula(raw.trim().slice(1));
            if(v==='#XATO') return '#XATO';
            return Number.isInteger(v) ? String(v) : (Math.round(v*100)/100).toString();
        }
        return raw;
    }
    function renderGrid(){
        const rows = sheetData.length, cols = sheetData[0]?sheetData[0].length:0;
        let html = '<thead><tr><th class="rowhead"></th>';
        for(let c=0;c<cols;c++) html += '<th>'+colLetter(c)+'</th>';
        html += '</tr></thead><tbody>';
        for(let r=0;r<rows;r++){
            html += '<tr><td class="rownum">'+(r+1)+'</td>';
            for(let c=0;c<cols;c++){
                const v = (displayValue(r,c) ?? '').toString().replace(/"/g,'&quot;');
                const st = getStyle(r,c);
                const styleAttr = 'font-weight:'+(st.bold?'700':'400')+';font-style:'+(st.italic?'italic':'normal')+';background:'+(st.bg||'#fff')+';color:'+(st.fg||'#111827')+';';
                html += '<td><input type="text" data-r="'+r+'" data-c="'+c+'" value="'+v+'" style="'+styleAttr+'"></td>';
            }
            html += '</tr>';
        }
        html += '</tbody>';
        xlsxTable.innerHTML = html;
        xlsxTable.querySelectorAll('input').forEach(inp=>{
            const r=+inp.dataset.r, c=+inp.dataset.c;
            inp.addEventListener('focus', ()=>{
                activeCell = {r,c};
                activeCellLabel.value = colLetter(c)+(r+1);
                formulaBar.value = getCellRaw(r,c);
                inp.value = getCellRaw(r,c);
                const st=getStyle(r,c);
                document.getElementById('cellBg').value = st.bg && st.bg!=='#fff' ? st.bg : '#ffffff';
                document.getElementById('cellFg').value = st.fg || '#111827';
            });
            inp.addEventListener('input', e=>{ sheetData[r][c] = e.target.value; formulaBar.value = e.target.value; });
            inp.addEventListener('blur', renderGrid);
            inp.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); inp.blur(); const next=xlsxTable.querySelector('input[data-r="'+(r+1)+'"][data-c="'+c+'"]'); if(next) next.focus(); } });
        });
    }
    renderGrid();

    formulaBar.addEventListener('input', ()=>{
        sheetData[activeCell.r][activeCell.c] = formulaBar.value;
        const inp = xlsxTable.querySelector('input[data-r="'+activeCell.r+'"][data-c="'+activeCell.c+'"]');
        if(inp) inp.value = formulaBar.value;
    });
    formulaBar.addEventListener('keydown', e=>{ if(e.key==='Enter'){ renderGrid(); } });

    function applyCellStyle(patch){
        const key = styleKey(activeCell.r, activeCell.c);
        cellStyles[key] = Object.assign({}, cellStyles[key], patch);
        renderGrid();
        const inp = xlsxTable.querySelector('input[data-r="'+activeCell.r+'"][data-c="'+activeCell.c+'"]');
        if(inp) inp.focus();
    }
    document.getElementById('cellBold').onclick = ()=>applyCellStyle({bold: !getStyle(activeCell.r,activeCell.c).bold});
    document.getElementById('cellItalic').onclick = ()=>applyCellStyle({italic: !getStyle(activeCell.r,activeCell.c).italic});
    document.getElementById('cellBg').addEventListener('input', e=>applyCellStyle({bg:e.target.value}));
    document.getElementById('cellFg').addEventListener('input', e=>applyCellStyle({fg:e.target.value}));
    document.getElementById('autoSumBtn').onclick = ()=>{
        const r=activeCell.r, c=activeCell.c;
        let top=r; while(top>0 && getCellRaw(top-1,c)!=='') top--;
        if(top===r && r>0) top=0;
        const formula = '=SUM('+colLetter(c)+(top+1)+':'+colLetter(c)+r+')';
        sheetData[r][c] = r>top ? formula : '=SUM('+colLetter(c)+'1:'+colLetter(c)+(r+1>1?r:1)+')';
        renderGrid();
    };

    document.getElementById('xlsxAddRow').onclick = ()=>{ const cols = sheetData[0]?sheetData[0].length:8; sheetData.push(Array.from({length:cols}, ()=>'')); renderGrid(); };
    document.getElementById('xlsxAddCol').onclick = ()=>{ sheetData.forEach(row=>row.push('')); renderGrid(); };
    document.getElementById('xlsxDelRow').onclick = ()=>{ if(sheetData.length>1) sheetData.pop(); renderGrid(); };
    document.getElementById('xlsxDelCol').onclick = ()=>{ if(sheetData[0] && sheetData[0].length>1) sheetData.forEach(row=>row.pop()); renderGrid(); };
    document.getElementById('xlsxNew').onclick = ()=>{
        sheetData = Array.from({length:40}, ()=>Array.from({length:14}, ()=>''));
        cellStyles = {};
        document.getElementById('sheetName').value = 'Jadval1';
        document.getElementById('sheetTabLabel').textContent = 'Jadval1';
        renderGrid();
        setXlsxStatus('Yangi jadval yaratildi.');
    };
    document.getElementById('sheetName').addEventListener('input', e=>{ document.getElementById('sheetTabLabel').textContent = e.target.value || 'Jadval1'; });
    document.getElementById('xlsxOpen').addEventListener('change', function(e){
        const f = e.target.files[0];
        if(!f) return;
        setXlsxStatus('Fayl o\'qilmoqda...');
        const reader = new FileReader();
        reader.onload = function(ev){
            try{
                const data = new Uint8Array(ev.target.result);
                const wb = XLSX.read(data, {type:'array'});
                const wsName = wb.SheetNames[0];
                const ws = wb.Sheets[wsName];
                const aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
                if(!aoa.length) aoa.push(['']);
                const maxCols = Math.max(...aoa.map(r=>r.length), 1);
                sheetData = aoa.map(r=>{ const row = r.slice(0,maxCols).map(v=>v==null?'':String(v)); while(row.length<maxCols) row.push(''); return row; });
                cellStyles = {};
                document.getElementById('sheetName').value = wsName;
                document.getElementById('sheetTabLabel').textContent = wsName;
                renderGrid();
                setXlsxStatus('✔ "'+f.name+'" ochildi.', 'ok');
            }catch(err){
                console.error(err);
                setXlsxStatus('✕ Faylni o\'qib bo\'lmadi: '+err.message, 'err');
            }
        };
        reader.readAsArrayBuffer(f);
        e.target.value='';
    });
    document.getElementById('xlsxSaveXlsx').onclick = ()=>{
        try{
            const wb = XLSX.utils.book_new();
            const displayData = sheetData.map((row,r)=>row.map((v,c)=>{
                const raw = v;
                if(typeof raw==='string' && raw.trim().startsWith('=')) return getCellValue(r,c);
                const n = parseFloat(raw);
                return (raw!=='' && !isNaN(n) && String(n)===raw.trim()) ? n : raw;
            }));
            const ws = XLSX.utils.aoa_to_sheet(displayData);
            sheetData.forEach((row,r)=>row.forEach((raw,c)=>{
                if(typeof raw==='string' && raw.trim().startsWith('=')){
                    const addr = XLSX.utils.encode_cell({r,c});
                    if(ws[addr]) ws[addr].f = raw.trim().slice(1);
                }
            }));
            const name = (document.getElementById('sheetName').value||'Jadval1').slice(0,31);
            XLSX.utils.book_append_sheet(wb, ws, name);
            XLSX.writeFile(wb, name+'.xlsx');
            setXlsxStatus('✔ .xlsx fayl yuklab olindi (formulalar bilan).', 'ok');
        }catch(err){ console.error(err); setXlsxStatus('✕ Saqlashda xatolik: '+err.message, 'err'); }
    };
    document.getElementById('xlsxSaveCsv').onclick = ()=>{
        try{
            const displayData = sheetData.map((row,r)=>row.map((v,c)=>displayValue(r,c)));
            const ws = XLSX.utils.aoa_to_sheet(displayData);
            const csv = XLSX.utils.sheet_to_csv(ws);
            const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = (document.getElementById('sheetName').value||'jadval')+'.csv';
            a.click();
            setXlsxStatus('✔ .csv fayl yuklab olindi.', 'ok');
        }catch(err){ console.error(err); setXlsxStatus('✕ Saqlashda xatolik: '+err.message, 'err'); }
    };

    /* ================= WORD ================= */
    const docArea = document.getElementById('docArea');
    const docStatus = document.getElementById('docStatus');
    function setDocStatus(msg, cls){ docStatus.innerHTML = msg + ' · <span id="wordCount">'+(document.getElementById('wordCount')?document.getElementById('wordCount').textContent:'0 so\'z')+'</span>'; docStatus.className = 'status' + (cls?' '+cls:''); }
    function updateWordCount(){
        const text = docArea.innerText || '';
        const words = text.trim().split(/\s+/).filter(Boolean).length;
        const el = document.getElementById('wordCount');
        if(el) el.textContent = words + " so'z";
    }
    docArea.addEventListener('input', updateWordCount);
    updateWordCount();

    document.getElementById('docBold').onclick = ()=>{ document.execCommand('bold'); docArea.focus(); };
    document.getElementById('docItalic').onclick = ()=>{ document.execCommand('italic'); docArea.focus(); };
    document.getElementById('docUnderline').onclick = ()=>{ document.execCommand('underline'); docArea.focus(); };
    document.getElementById('docLeft').onclick = ()=>{ document.execCommand('justifyLeft'); docArea.focus(); };
    document.getElementById('docCenter').onclick = ()=>{ document.execCommand('justifyCenter'); docArea.focus(); };
    document.getElementById('docRight').onclick = ()=>{ document.execCommand('justifyRight'); docArea.focus(); };
    document.getElementById('docUl').onclick = ()=>{ document.execCommand('insertUnorderedList'); docArea.focus(); };
    document.getElementById('docOl').onclick = ()=>{ document.execCommand('insertOrderedList'); docArea.focus(); };
    document.getElementById('wCut').onclick = ()=>{ document.execCommand('cut'); docArea.focus(); };
    document.getElementById('wCopy').onclick = ()=>{ document.execCommand('copy'); docArea.focus(); };
    document.getElementById('wPaste').onclick = async ()=>{ try{ const t = await navigator.clipboard.readText(); document.execCommand('insertText', false, t); }catch(e){ setDocStatus('Joylash uchun Ctrl+V ishlating.', 'err'); } docArea.focus(); };
    document.getElementById('docFont').addEventListener('change', e=>{ document.execCommand('fontName', false, e.target.value); docArea.focus(); });
    document.getElementById('docSize').addEventListener('change', e=>{ document.execCommand('fontSize', false, e.target.value); docArea.focus(); });
    document.getElementById('docColor').addEventListener('input', e=>{ document.execCommand('foreColor', false, e.target.value); docArea.focus(); });
    document.getElementById('docHighlight').addEventListener('input', e=>{ document.execCommand('hiliteColor', false, e.target.value); docArea.focus(); });
    document.querySelectorAll('.style-card').forEach(card=>{
        card.addEventListener('click', ()=>{ document.execCommand('formatBlock', false, card.dataset.block); docArea.focus(); });
    });
    document.getElementById('docImgInput').addEventListener('change', function(e){
        const f = e.target.files[0]; if(!f) return;
        const reader = new FileReader();
        reader.onload = ev=>{
            docArea.focus();
            document.execCommand('insertImage', false, ev.target.result);
            docArea.querySelectorAll('img').forEach(img=>{ img.style.maxWidth='100%'; });
            updateWordCount();
        };
        reader.readAsDataURL(f);
        e.target.value='';
    });
    document.getElementById('docTable').addEventListener('click', function(){
        const rows = parseInt(prompt('Nechta qator?','3'))||3;
        const cols = parseInt(prompt('Nechta ustun?','3'))||3;
        let html = '<table style="border-collapse:collapse;width:100%;margin:10px 0">';
        for(let r=0;r<rows;r++){ html += '<tr>'; for(let c=0;c<cols;c++) html += '<td style="border:1px solid #999;padding:6px 10px;min-width:40px">&nbsp;</td>'; html += '</tr>'; }
        html += '</table><p><br></p>';
        docArea.focus();
        document.execCommand('insertHTML', false, html);
        updateWordCount();
    });
    document.getElementById('docFind').addEventListener('click', function(){
        const q = prompt('Qidirilayotgan so\'z:');
        if(!q) return;
        if(window.find){ window.find(q); } else { setDocStatus('Qidiruv qo\'llab-quvvatlanmaydi', 'err'); }
    });
    document.getElementById('docNew').onclick = ()=>{
        docArea.innerHTML = '<p>Hujjatni shu yerdan yozishni boshlang...</p>';
        setDocStatus('Yangi hujjat yaratildi.');
        updateWordCount();
    };
    document.getElementById('docOpen').addEventListener('change', function(e){
        const f = e.target.files[0];
        if(!f) return;
        setDocStatus('Fayl o\'qilmoqda...');
        if(f.name.toLowerCase().endsWith('.txt')){
            const reader = new FileReader();
            reader.onload = ev=>{
                const text = ev.target.result;
                docArea.innerHTML = text.split(/\r?\n/).map(l=>'<p>'+(l||'&nbsp;')+'</p>').join('');
                setDocStatus('✔ "'+f.name+'" ochildi.', 'ok');
                updateWordCount();
            };
            reader.readAsText(f);
        } else {
            const reader = new FileReader();
            reader.onload = function(ev){
                mammoth.convertToHtml({arrayBuffer: ev.target.result})
                    .then(function(result){
                        docArea.innerHTML = result.value || '<p></p>';
                        setDocStatus('✔ "'+f.name+'" ochildi.', 'ok');
                        updateWordCount();
                    })
                    .catch(function(err){ console.error(err); setDocStatus('✕ .docx faylni o\'qib bo\'lmadi: '+err.message, 'err'); });
            };
            reader.readAsArrayBuffer(f);
        }
        e.target.value='';
    });
    document.getElementById('docSave').onclick = ()=>{
        try{
            const content = docArea.innerHTML;
            const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">'+
                '<head><meta charset="utf-8"><title>Hujjat</title><style>body{font-family:"Aptos",Calibri,sans-serif;font-size:12pt;}</style></head>'+
                '<body>'+content+'</body></html>';
            const blob = new Blob(['\ufeff', html], {type:'application/msword'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'hujjat.doc';
            a.click();
            setDocStatus('✔ .doc fayl yuklab olindi.', 'ok');
        }catch(err){ console.error(err); setDocStatus('✕ Saqlashda xatolik: '+err.message, 'err'); }
    };
})();

// Tools back navigation
(function(){
    const b = document.getElementById('toolsBackBtn');
    if(!b) return;
    b.addEventListener('click', function(e){
        e.preventDefault();
        location.replace('index.html?fromTools=1#tools');
    });
})();
</script>
</body>
