<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>IT SHAKH | Excel &amp; Word Online</title>
<style>
:root{--bg:#04060b;--accent:#38bdf8;--glow:0 0 45px rgba(56,189,248,.85);--text-color:#e5e7eb;--card-bg:rgba(11,18,32,.7);
--ui:'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
--ofbg:#f3f4f6;--ofln:#d1d5db;--ofln2:#e5e7eb;--oftx:#1f2937;--ofmu:#6b7280;--ofac:#1a73e8;--ofac2:#e8f0fe;--xl:#107c41;--wd:#185abd}
body.night-mode{--bg:#000;--accent:#00ff41;--glow:0 0 45px rgba(0,255,65,.85);--text-color:#00ff41;--card-bg:rgba(0,20,0,.7)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;font-family:var(--ui);background:var(--bg);color:var(--text-color);overflow:hidden;transition:background .4s}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 22px;flex-wrap:wrap;gap:8px;border-bottom:1px solid rgba(56,189,248,.15)}
.logo-text{font-weight:800;letter-spacing:2px;font-size:15px}
.nav-links{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.nav-links a{color:var(--text-color);text-decoration:none;font-size:12px;letter-spacing:1px;opacity:.85}
.nav-links a:hover{opacity:1;color:var(--accent)}
.mode-toggle{background:transparent;border:1px solid rgba(56,189,248,.4);color:var(--accent);padding:5px 11px;border-radius:20px;font:11px monospace;letter-spacing:1px;cursor:pointer}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 14px 10px;gap:8px;max-width:1700px;width:100%;margin:0 auto}
.om-top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.om-top h1{margin:0;font-size:15px;letter-spacing:1px;font-weight:700}
.om-top h1 small{color:#94a3b8;font-weight:400;font-size:12px;margin-left:8px}
.app-tabs{display:flex;gap:8px}
.app-tabs button{padding:7px 20px;border-radius:9px;border:1px solid rgba(56,189,248,.3);background:rgba(11,18,32,.6);color:var(--text-color);font:700 12px monospace;letter-spacing:1px;cursor:pointer}
.app-tabs button.active{background:linear-gradient(90deg,var(--accent),#7c4dff);color:#001018;border-color:transparent}
.hidden{display:none!important}
.om-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.open-any{display:inline-flex;align-items:center;gap:8px;padding:7px 18px;border-radius:9px;border:1px solid rgba(56,189,248,.5);background:rgba(56,189,248,.12);color:var(--accent);font:700 12px monospace;letter-spacing:1px;cursor:pointer;box-shadow:0 0 18px rgba(56,189,248,.18)}
.open-any:hover{background:rgba(56,189,248,.24)}.open-any small{font:400 10.5px monospace;opacity:.75;letter-spacing:.5px}
.om-hint{font-size:11px;color:#94a3b8}
#dropVeil{position:fixed;inset:0;z-index:3000;display:none;align-items:center;justify-content:center;background:rgba(4,10,24,.82);backdrop-filter:blur(3px);pointer-events:none}
#dropVeil.on{display:flex}
#dropVeil div{padding:34px 48px;border:2px dashed var(--accent);border-radius:18px;background:rgba(11,18,32,.9);color:#fff;font:700 18px var(--ui);text-align:center;box-shadow:0 0 50px rgba(56,189,248,.35)}
#dropVeil small{display:block;margin-top:8px;font:400 12px var(--ui);color:#94a3b8}
/* ===== app window ===== */
.app{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;color:var(--oftx);border-radius:10px;overflow:hidden;border:1px solid rgba(56,189,248,.35);font-size:13px;position:relative}
.app button{font-family:inherit}
.tbar{flex:none;display:flex;align-items:center;gap:8px;padding:5px 10px;background:#fff;border-bottom:1px solid var(--ofln2);flex-wrap:nowrap;min-height:40px}
.tbar .brand{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font:800 14px var(--ui);flex:none}
#excelApp .brand{background:var(--xl)}#wordApp .brand{background:var(--wd)}
.tbar .title{border:1px solid transparent;background:transparent;font:600 14px var(--ui);color:var(--oftx);padding:4px 8px;border-radius:5px;min-width:90px;width:240px;max-width:36vw}
.tbar .title:hover{border-color:var(--ofln)}.tbar .title:focus{outline:none;border-color:var(--ofac);background:#fff}
.tbar .qa{display:flex;gap:2px}
.tbar .saved{margin-left:auto;font-size:11.5px;color:var(--ofmu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbtn{border:0;background:var(--xl);color:#fff;font:600 12.5px var(--ui);padding:6px 14px;border-radius:6px;cursor:pointer;flex:none}
#wordApp .fbtn{background:var(--wd)}
.fbtn:hover{filter:brightness(1.1)}
.ic{width:16px;height:16px;flex:none;vertical-align:middle}
.rb{border:1px solid transparent;background:transparent;color:#374151;border-radius:5px;min-width:27px;height:27px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:12px}
.rb:hover{background:#e5e7eb}.rb.on,.rb[aria-pressed=true]{background:var(--ofac2);border-color:#bcd2f7;color:var(--ofac)}
.rb:disabled{opacity:.4;cursor:default}
.rb.big{flex-direction:column;height:auto;min-width:50px;padding:4px 6px;font-size:11px;gap:2px}.rb.big .ic{width:22px;height:22px}
.rb.lab .rl,.rb .rl{font-size:11.5px;white-space:nowrap}
.rb .rtx{font:700 13px var(--ui)}.rb .rtx.s{font-size:10px}
.rb.caret{min-width:14px;padding:0 1px}.rb.caret .ic{width:11px;height:11px}
.rsplit{display:inline-flex}.rsplit .rb:first-child{border-top-right-radius:0;border-bottom-right-radius:0}.rsplit .rb.caret{border-top-left-radius:0;border-bottom-left-radius:0}
.rcolor{position:relative;flex-direction:column;gap:0;justify-content:center}.rcolor .cbar{display:block;width:15px;height:3.5px;border-radius:1px;margin-top:-1px}
.rb .ic.sm{width:11px;height:11px}
.rsel{height:26px;border:1px solid var(--ofln);border-radius:5px;background:#fff;font:12px var(--ui);color:var(--oftx);padding:0 3px;max-width:150px}
.rsel:focus{outline:none;border-color:var(--ofac)}
.rsep{width:1px;align-self:stretch;background:var(--ofln2);margin:2px 3px}
.rrow{display:flex;align-items:center;gap:1px;flex-wrap:nowrap}
.rcol{display:flex;flex-direction:column;gap:3px;justify-content:center}
.ribbon{flex:none;background:var(--ofbg);border-bottom:1px solid var(--ofln)}
.rtabs{display:flex;gap:2px;padding:3px 8px 0;background:#fff;border-bottom:1px solid var(--ofln2);overflow-x:auto;scrollbar-width:none}
.rtabs .rtab{border:0;background:transparent;padding:6px 13px;font:12.5px var(--ui);color:#4b5563;cursor:pointer;border-radius:6px 6px 0 0;border-bottom:2px solid transparent;white-space:nowrap}
.rtabs .rtab:hover{background:var(--ofbg)}.rtabs .rtab.on{color:var(--xl);font-weight:600;border-bottom-color:var(--xl)}
#wordApp .rtabs .rtab.on{color:var(--wd);border-bottom-color:var(--wd)}
.rtab.hid{display:none}.rtab.hid.show{display:block}
.rpanels{overflow-x:auto;scrollbar-width:thin}
.rpanel{display:none;padding:5px 8px;gap:0;align-items:stretch;min-height:84px;width:max-content;min-width:100%}
.rpanel.on{display:flex}
.rg{display:flex;flex-direction:column;padding:0 6px;border-right:1px solid var(--ofln);justify-content:space-between}
.rg:last-child{border-right:0}
.rgi{display:flex;align-items:center;gap:3px;flex-wrap:wrap;flex:1;align-content:center;max-width:370px;justify-content:center}
.rgt{text-align:center;font-size:10.5px;color:var(--ofmu);padding-top:3px}
/* ===== dialogs, popovers ===== */
.ovl{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:14px}
.dlg{background:#fff;color:var(--oftx);border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:100%;max-height:92vh;display:flex;flex-direction:column;font:13px var(--ui)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:1px solid var(--ofln2);font-weight:700;font-size:14.5px}
.dlg-b{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.dlg-f{padding:11px 16px;border-top:1px solid var(--ofln2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:transparent;cursor:pointer;color:#6b7280;border-radius:6px;width:28px;height:28px;display:grid;place-items:center}.x:hover{background:#f3f4f6}
.btn{border:1px solid var(--ofln);background:#fff;color:var(--oftx);border-radius:7px;padding:7px 15px;font:600 12.5px var(--ui);cursor:pointer}
.btn:hover{background:#f3f4f6}.btn.pri{background:var(--ofac);border-color:var(--ofac);color:#fff}.btn.pri:hover{filter:brightness(1.08)}
.btn.dan{color:#b91c1c;border-color:#fecaca}.btn.dan:hover{background:#fef2f2}.btn.sm{padding:4px 10px;font-size:12px}
.in{width:100%;border:1px solid var(--ofln);border-radius:7px;padding:7px 9px;font:13px var(--ui);color:var(--oftx);background:#fff}
.in:focus{outline:none;border-color:var(--ofac);box-shadow:0 0 0 3px rgba(26,115,232,.15)}
.fld{display:flex;flex-direction:column;gap:4px}.fld>span{font-size:12px;color:var(--ofmu);font-weight:600}.fld small{color:var(--ofmu);font-size:11px}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}.chk input{accent-color:var(--ofac)}
.chkrow{display:flex;gap:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cinp{width:42px;height:28px;padding:0;border:1px solid var(--ofln);border-radius:5px;background:#fff;cursor:pointer}
.pmsg{color:#374151;line-height:1.55;font-size:13.5px}
.pop{position:fixed;z-index:1100;background:#fff;color:var(--oftx);border:1px solid var(--ofln);border-radius:9px;box-shadow:0 10px 32px rgba(0,0,0,.22);font:13px var(--ui);max-height:80vh;overflow:auto}
.menu{padding:5px;min-width:210px;max-width:330px}
.mi{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:6px 9px;border-radius:6px;cursor:pointer;font:13px var(--ui);color:var(--oftx)}
.mi:hover:not(.dis){background:#eff4fb}.mi.dis{opacity:.4;cursor:default}
.mi-i{width:18px;display:inline-flex;justify-content:center;flex:none;color:#4b5563}.mi-l{flex:1;white-space:nowrap}.mi-k{color:var(--ofmu);font-size:11.5px;margin-left:14px}
.msep{height:1px;background:var(--ofln2);margin:4px 2px}.mtitle{padding:5px 9px;font-size:11px;color:var(--ofmu);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.palette{padding:8px;width:230px}.sw-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:4px 0}
.sw{width:100%;aspect-ratio:1;border:1px solid rgba(0,0,0,.18);border-radius:3px;cursor:pointer;padding:0}.sw:hover{transform:scale(1.18);z-index:1;position:relative}.sw.on{outline:2px solid var(--ofac)}
.sw-t{font-size:11px;color:var(--ofmu);margin-top:6px}.sw-c{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#111827;color:#fff;padding:9px 16px;border-radius:9px;font:13px var(--ui);box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(10px);transition:.25s;max-width:90vw}
.toast.in{opacity:1;transform:none}.toast.err{background:#b91c1c}
/* ===== spreadsheet ===== */
.gx{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff;position:relative}
.fbar{flex:none;display:flex;align-items:flex-start;gap:0;border-bottom:1px solid var(--ofln);background:#fff;padding:3px 6px;gap:6px;position:relative}
.fbar .nb{width:96px;height:26px;border:1px solid var(--ofln);border-radius:5px;padding:0 8px;font:12.5px var(--ui);text-align:center;flex:none}
.fbar .nb:focus{outline:none;border-color:var(--ofac);text-align:left}
.fxb{border:0;background:transparent;width:30px;height:26px;cursor:pointer;color:#6b7280;flex:none;border-radius:5px}.fxb:hover{background:#e5e7eb}.fxb i{font:italic 700 14px Georgia,serif}
.fxi{flex:1;min-width:0;height:26px;border:1px solid var(--ofln);border-radius:5px;padding:4px 8px;font:13px Consolas,'Courier New',monospace;resize:none;overflow:hidden;line-height:16px;color:var(--oftx);background:#fff}
.fxi:focus{outline:none;border-color:var(--ofac)}.fxi.open{position:absolute;left:174px;right:36px;z-index:20;box-shadow:0 6px 20px rgba(0,0,0,.2);overflow:auto}
.gwrap{position:relative;flex:1;min-height:0;background:#fff;outline:none;overflow:hidden;user-select:none}
.gc{position:absolute;left:0;top:0;display:block}
.gs{position:absolute;right:0;bottom:0;overflow:scroll;background:transparent}
.gsp{position:relative;pointer-events:none}
.glayer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.gin{position:absolute;left:-9999px;top:0;width:1px;height:1px;border:0;padding:0;margin:0;opacity:0;resize:none;overflow:hidden;font:14px Calibri,Carlito,'Segoe UI',Arial,sans-serif;white-space:pre-wrap;pointer-events:auto;background:#fff;color:#000;outline:none;z-index:5}
.gin.on{opacity:1;border:2px solid var(--ofac);padding:0 3px;box-shadow:0 2px 10px rgba(26,115,232,.25);line-height:1.25;min-width:30px;overflow:hidden}
.ghint{position:absolute;z-index:8;background:#fff;border:1px solid var(--ofln);box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:6px;padding:4px 9px;font:12px Consolas,monospace;pointer-events:none;white-space:nowrap;color:#374151}
.ghint u{font-weight:700;text-decoration:none;color:var(--ofac)}
.gac{position:absolute;z-index:9;background:#fff;border:1px solid var(--ofln);box-shadow:0 6px 18px rgba(0,0,0,.22);border-radius:6px;min-width:200px;pointer-events:auto;overflow:hidden}
.gac-i{padding:4px 10px;font:12.5px Consolas,monospace;display:flex;gap:10px;justify-content:space-between;cursor:pointer;align-items:baseline}.gac-i small{color:var(--ofmu);font:11px var(--ui);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gac-i.on,.gac-i:hover{background:var(--ofac2)}
.gtabs{flex:none;display:flex;align-items:stretch;background:var(--ofbg);border-top:1px solid var(--ofln);height:31px}
.tnav{display:flex;align-items:center;padding:0 4px;flex:none}
.tlist{display:flex;overflow-x:auto;scrollbar-width:none;flex:0 1 auto;min-width:0}
.stab{border:0;border-right:1px solid var(--ofln2);background:transparent;padding:0 16px;font:12.5px var(--ui);color:#4b5563;cursor:pointer;white-space:nowrap}
.stab:hover{background:#e5e7eb}.stab.on{background:#fff;color:var(--xl);font-weight:700;box-shadow:inset 0 -2px 0 var(--xl)}.stab.dov{background:#dbeafe}
.addtab{align-self:center;margin-left:4px}
.sbar{flex:none;display:flex;align-items:center;gap:16px;padding:0 12px;height:25px;background:var(--ofbg);border-top:1px solid var(--ofln);font-size:11.5px;color:#4b5563}
.sbar .sb-stat{margin-left:auto;display:flex;gap:14px;white-space:nowrap;overflow:hidden}.sbar .sb-zoom{display:flex;align-items:center;gap:6px}
.sbar input[type=range]{width:100px;accent-color:var(--xl)}
.gtip{position:fixed;z-index:3000;background:#111827;color:#fff;padding:3px 8px;border-radius:5px;font:11.5px var(--ui);pointer-events:none}
.chart{position:absolute;background:#fff;border:1px solid #c9ced6;box-shadow:0 2px 8px rgba(0,0,0,.15);pointer-events:auto;cursor:move;user-select:none}
.chart.sel{outline:2px solid var(--ofac)}.chart-b{width:100%;height:100%;overflow:hidden}.chart-b svg{display:block}
.chart-g{position:absolute;right:-1px;bottom:-1px;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,var(--ofac) 50%)}
.chart:not(.sel) .chart-g{display:none}
.chart-prev{border:1px solid var(--ofln2);border-radius:8px;overflow:hidden;background:#fff;display:flex;justify-content:center}
.fpanel{position:absolute;top:8px;right:22px;z-index:15;background:#fff;border:1px solid var(--ofln);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px 12px;width:350px;max-width:calc(100% - 30px);pointer-events:auto;display:flex;flex-direction:column;gap:8px}
.fp-h{display:flex;justify-content:space-between;align-items:center}.fp-r{display:flex;gap:6px}.fp-r .in{flex:1;min-width:0}.fp-rep{display:none}.fpanel.rep .fp-rep{display:flex}
.fp-o{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;font-size:12px}.fi{font-size:11.5px;color:var(--ofmu);min-height:14px}
.fl{padding:8px;width:250px;display:flex;flex-direction:column;gap:6px}.fl-list{max-height:210px;overflow:auto;border:1px solid var(--ofln2);border-radius:6px;padding:3px}
.fl-i{display:flex;align-items:center;gap:7px;padding:3px 5px;font-size:12.5px;cursor:pointer;border-radius:4px}.fl-i:hover{background:#f3f4f6}.fl-i span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fl-i small{color:var(--ofmu)}
.fl-b{display:flex;justify-content:flex-end;gap:6px}
.cfl,.nml{display:flex;flex-direction:column;gap:6px}.cfi{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:6px 8px;border:1px solid var(--ofln2);border-radius:7px;font-size:12.5px}.cfi code{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:12px;color:#4b5563}
.fx-list{max-height:320px;overflow:auto;border:1px solid var(--ofln2);border-radius:7px;margin-top:8px}
.fmt-tabs{display:flex;gap:2px;border-bottom:1px solid var(--ofln2);margin-bottom:10px;flex-wrap:wrap}.fmt-tabs .rtab{border:0;background:transparent;padding:7px 12px;cursor:pointer;font:600 12.5px var(--ui);color:#4b5563;border-bottom:2px solid transparent}.fmt-tabs .rtab.on{color:var(--ofac);border-bottom-color:var(--ofac)}
.fmt-page{display:flex;flex-direction:column;gap:10px}.fmt-list{max-height:170px;overflow:auto;border:1px solid var(--ofln2);border-radius:7px}.fmt-prev{padding:9px 11px;border:1px solid var(--ofln2);border-radius:7px;background:#f9fafb;font-size:13px;min-height:36px}
/* ===== word ===== */
.wd{flex:1;min-height:0;display:flex;flex-direction:column;background:#e6e8ec;position:relative}
.wd-scroll{flex:1;min-height:0;overflow:auto;padding:22px 16px 60px;display:block;position:relative}
.wd-zoom{transform-origin:top center;width:max-content;margin:0 auto}
.wd-sheet{position:relative;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.28);margin:0 auto}
.wd-hf{position:absolute;left:0;right:0;font:10pt Calibri,Carlito,Arial,sans-serif;color:#666;display:flex;justify-content:center;pointer-events:none}
.wd-hf>*{pointer-events:auto}
.wd-hf [contenteditable]{outline:none;min-width:80px;text-align:center;border:1px dashed transparent;padding:0 6px;border-radius:3px}.wd-hf [contenteditable]:hover,.wd-hf [contenteditable]:focus{border-color:#9ca3af}
.wd-hd{top:0}.wd-ft{bottom:0}
.doc{outline:none;color:#000;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;font-size:11pt;line-height:1.15;word-wrap:break-word;overflow-wrap:anywhere;min-height:100%;position:relative}
.doc p{margin:0 0 8pt}.doc h1{font-size:20pt;margin:16pt 0 6pt;color:#2f5496;font-weight:400;line-height:1.1}.doc h2{font-size:16pt;margin:12pt 0 4pt;color:#2f5496;font-weight:400}.doc h3{font-size:13pt;margin:10pt 0 3pt;color:#1f3763;font-weight:400}
.doc h4{font-size:12pt;margin:8pt 0 2pt;color:#2f5496;font-style:italic;font-weight:400}.doc h5{font-size:11pt;margin:8pt 0 2pt;color:#2f5496;font-weight:400}.doc h6{font-size:11pt;margin:8pt 0 2pt;color:#1f3763;font-weight:400}
.doc blockquote{margin:8pt 36pt;padding:2pt 12pt;border-left:3px solid #c7cdd6;color:#555;font-style:italic}
.doc pre{background:#f3f4f6;font:10pt Consolas,'Courier New',monospace;padding:8pt;border-radius:4px;margin:0 0 8pt;white-space:pre-wrap}
.doc code{font-family:Consolas,'Courier New',monospace;background:#f3f4f6;padding:0 3px;border-radius:3px}

function decompile(t,cr,cc,ctx){
  const dv=new DataView(t.buffer,t.byteOffset,t.byteLength);
  const st=[];let p=0;const A=F.addr;
  const shName=ix=>{const x=ctx.xti[ix];if(!x||x.first!==x.last)return null;const n=ctx.sheetNames[x.first];return n==null?null:F.sheetPrefix(n)};
  const refAt=(q,rel)=>{ // BIFF8 ref: row u16, col u16
    let r=dv.getUint16(q,true);const cw=dv.getUint16(q+2,true);let c=cw&0x3FFF;const rr=!!(cw&0x8000),rc=!!(cw&0x4000);
    if(rel){if(rr)r=(cr+(r<<16>>16))&0xFFFF;if(rc)c=(cc+((c&0xFF)<<24>>24))&0xFF}
    return A(r,c,rr?0:1,rc?0:1);
  };
  const areaAt=(q,rel)=>{
    let r1=dv.getUint16(q,true),r2=dv.getUint16(q+2,true);const w1=dv.getUint16(q+4,true),w2=dv.getUint16(q+6,true);let c1=w1&0x3FFF,c2=w2&0x3FFF;
    const rr1=!!(w1&0x8000),rc1=!!(w1&0x4000),rr2=!!(w2&0x8000),rc2=!!(w2&0x4000);
    if(rel){if(rr1)r1=(cr+(r1<<16>>16))&0xFFFF;if(rr2)r2=(cr+(r2<<16>>16))&0xFFFF;if(rc1)c1=(cc+((c1&0xFF)<<24>>24))&0xFF;if(rc2)c2=(cc+((c2&0xFF)<<24>>24))&0xFF}
    return A(r1,c1,rr1?0:1,rc1?0:1)+':'+A(r2,c2,rr2?0:1,rc2?0:1);
  };
  const pop=()=>{if(!st.length)throw 0;return st.pop()};
  const bin=op=>{const b=pop(),a=pop();st.push(a+op+b)};
  try{
    while(p<t.length){
      const id=t[p++];
      const base=id>=0x20?(id&0x1F)|0x20:id;
      switch(base){
        case 0x01:{ // ptgExp
          const sr=dv.getUint16(p,true),sc=dv.getUint16(p+2,true);p+=4;
          const sh=ctx.shared.find(x=>cr>=x.r1&&cr<=x.r2&&cc>=x.c1&&cc<=x.c2);
          if(!sh||t.length!==5||ctx.depth>0)return null;
          ctx.depth++;const s=decompile(sh.rgce,cr,cc,ctx);ctx.depth--;return s;
        }
        case 0x03:bin('+');break;case 0x04:bin('-');break;case 0x05:bin('*');break;case 0x06:bin('/');break;case 0x07:bin('^');break;case 0x08:bin('&');break;
        case 0x09:bin('<');break;case 0x0A:bin('<=');break;case 0x0B:bin('=');break;case 0x0C:bin('>=');break;case 0x0D:bin('>');break;case 0x0E:bin('<>');break;
        case 0x0F:bin(' ');break;case 0x10:bin(',');break;case 0x11:bin(':');break;
        case 0x12:st.push('+'+pop());break;case 0x13:st.push('-'+pop());break;case 0x14:st.push(pop()+'%');break;case 0x15:st.push('('+pop()+')');break;
        case 0x16:st.push('');break;
        case 0x17:{const n=t[p],fl=t[p+1];p+=2;let s;if(fl&1){s=u16s(t.subarray(p,p+n*2));p+=n*2}else{s=latin1(t.subarray(p,p+n));p+=n}st.push('"'+s.replace(/"/g,'""')+'"');break}
        case 0x19:{ // ptgAttr
          const g=t[p];
          if(g&0x04){const n=dv.getUint16(p+1,true);p+=3+(n+1)*2;break}
          if(g&0x10){p+=3;st.push('SUM('+pop()+')');break}
          p+=3;break;
        }
        case 0x1C:st.push(ERRS[t[p]]||'#VALUE!');p+=1;break;
        case 0x1D:st.push(t[p]?'TRUE':'FALSE');p+=1;break;
        case 0x1E:st.push(String(dv.getUint16(p,true)));p+=2;break;
        case 0x1F:{const x=dv.getFloat64(p,true);p+=8;st.push(String(x));break}
        case 0x21:{const fid=dv.getUint16(p,true);p+=2;const n=FIXARGS[fid],nm=FUNCS[fid];if(n==null||!nm)return null;const args=[];for(let i=0;i<n;i++)args.unshift(pop());st.push(nm+'('+args.join(',')+')');break}
        case 0x22:{const n=t[p]&0x7F,fid=dv.getUint16(p+1,true)&0x7FFF;p+=3;const nm=FUNCS[fid];if(!nm||fid===255)return null;const args=[];for(let i=0;i<n;i++)args.unshift(pop());st.push(nm+'('+args.join(',')+')');break}
        case 0x23:{const ix=dv.getUint32(p,true);p+=4;const nm=ctx.names[ix-1];if(!nm)return null;st.push(nm);break}
        case 0x24:st.push(refAt(p,false));p+=4;break;
        case 0x25:st.push(areaAt(p,false));p+=8;break;
        case 0x2C:st.push(refAt(p,true));p+=4;break;
        case 0x2D:st.push(areaAt(p,true));p+=8;break;
        case 0x3A:{const pre=shName(dv.getUint16(p,true));if(pre==null)return null;p+=2;st.push(pre+refAt(p,false));p+=4;break}
        case 0x3B:{const pre=shName(dv.getUint16(p,true));if(pre==null)return null;p+=2;st.push(pre+areaAt(p,false));p+=8;break}
        case 0x29:p+=2;break; // ptgMemFunc: ichki ifoda
        default:return null;
      }
    }
  }catch(e){return null}
  return st.length===1?st[0]:null;
}

function readXls(buf,opts){
  opts=opts||{};
  const ole=buf&&buf.get?buf:oleOpen(buf);
  const w=ole.get('Workbook')||ole.get('Book');
  if(!w)throw new Error('Excel kitobi (Workbook) oqimi topilmadi');
  const dv=new DataView(w.buffer,w.byteOffset,w.byteLength);
  if(w.length<8||dv.getUint16(0,true)!==0x0809)throw new Error('Bu .xls ning juda eski varianti (Excel 2–4) — qo‘llab-quvvatlanmaydi');
  const biff8=dv.getUint16(4,true)>=0x0600;
  const wb=new M.Workbook();wb.hist.suspend=true;
  let cp=1252,date1904=false;const sheetsInfo=[],sstSegs=[],fonts=[],xfs=[],fmts={},pal=PAL.slice(),xti=[],names=[],ctx={xti,sheetNames:[],names:[],shared:[],depth:0};
  const rec=p=>{if(p+4>w.length)return null;const id=dv.getUint16(p,true),len=dv.getUint16(p+2,true);return{id,p:p+4,len,next:p+4+len}};
  const lab=()=>cpLabel(cp);
  /* --- globals --- */
  let p=0,first=true;
  for(;;){
    const r=rec(p);if(!r)break;p=r.next;
    if(first){first=false;continue}
    const d=r.p;
    if(r.id===0x0A)break;
    switch(r.id){
      case 0x2F:throw new Error('Fayl parol bilan himoyalangan (shifrlangan) — avval Excelda parolni olib tashlang');
      case 0x42:cp=dv.getUint16(d,true);break;
      case 0x22:date1904=dv.getUint16(d,true)===1;break;
      case 0x85:{
        const pos=dv.getUint32(d,true),hs=w[d+4],dt=w[d+5];let name;
        if(biff8){const n=w[d+6],fl=w[d+7];name=fl&1?u16s(w.subarray(d+8,d+8+n*2)):latin1(w.subarray(d+8,d+8+n))}
        else{const n=w[d+6];name=dec(lab(),w.subarray(d+7,d+7+n))}
        sheetsInfo.push({pos,hs,dt,name});break}
      case 0xFC:{ // SST + CONTINUE
        const segs=[w.subarray(d,d+r.len)];
        for(;;){const n=rec(p);if(!n||n.id!==0x3C)break;segs.push(w.subarray(n.p,n.next));p=n.next}
        sstSegs.push(...segs);break}
      case 0x31:{ // FONT
        const hgt=dv.getUint16(d,true),gr=dv.getUint16(d+2,true),icv=dv.getUint16(d+4,true),bls=dv.getUint16(d+6,true),sss=dv.getUint16(d+8,true),uls=w[d+10];
        let nm='';if(biff8){const n=w[d+14],fl=w[d+15];nm=fl&1?u16s(w.subarray(d+16,d+16+n*2)):latin1(w.subarray(d+16,d+16+n))}else{const n=w[d+14];nm=dec(lab(),w.subarray(d+15,d+15+n))}
        fonts.push({fs:hgt/20,b:bls>=700,i:!!(gr&2),st:!!(gr&8),u:uls>0,icv,sss,ff:nm});break}
      case 0x41E:{const id=dv.getUint16(d,true);let s;if(biff8){const n=dv.getUint16(d+2,true),fl=w[d+4];s=fl&1?u16s(w.subarray(d+5,d+5+n*2)):latin1(w.subarray(d+5,d+5+n))}else{const n=w[d+2];s=dec(lab(),w.subarray(d+3,d+3+n))}fmts[id]=s;break}
      case 0xE0:{
        const x={ifnt:dv.getUint16(d,true),ifmt:dv.getUint16(d+2,true)};
        if(biff8&&r.len>=20){
          const al=w[d+6];x.ha=al&7;x.wrap=!!(al&8);x.va=(al>>4)&7;x.ind=w[d+8]&15;
          const b1=dv.getUint32(d+10,true),b2=dv.getUint32(d+14,true),f=dv.getUint16(d+18,true);
          x.bL=b1&15;x.bR=(b1>>4)&15;x.bT=(b1>>8)&15;x.bB=(b1>>12)&15;x.cL=(b1>>16)&127;x.cR=(b1>>23)&127;
          x.cT=b2&127;x.cB=(b2>>7)&127;x.fls=(b2>>>26)&63;x.fg=f&127;x.bgc=(f>>7)&127;
        }
        xfs.push(x);break}
      case 0x92:{const n=dv.getUint16(d,true);for(let i=0;i<n;i++)pal[8+i]=[w[d+2+i*4],w[d+3+i*4],w[d+4+i*4]].map(x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();break}
      case 0x17:{const n=dv.getUint16(d,true);for(let i=0;i<n;i++)xti.push({sb:dv.getUint16(d+2+i*6,true),first:dv.getUint16(d+4+i*6,true),last:dv.getUint16(d+6+i*6,true)});break}
      case 0x18:{ // NAME
        if(!biff8)break;
        const gr=dv.getUint16(d,true),cch=w[d+3],cce=dv.getUint16(d+4,true),itab=dv.getUint16(d+8,true);
        const l1=w[d+10],l2=w[d+11],l3=w[d+12],l4=w[d+13];
        if(gr&0x20||itab!==0){names.push(null);break}
        const fl=w[d+14];let q=d+15,nm;if(fl&1){nm=u16s(w.subarray(q,q+cch*2));q+=cch*2}else{nm=latin1(w.subarray(q,q+cch));q+=cch}
        names.push({name:nm,rgce:w.subarray(q,q+cce)});break}
    }
  }
  // fon indeksi: 4 mavjud emas
  const fontAt=i=>fonts[i>3?i-1:i]||{};
  const f0=fontAt(0);
  /* SST */
  const sst=[];
  if(sstSegs.length){
    let si=0,cur=sstSegs[0],pos=8;const cu=new DataView(cur.buffer,cur.byteOffset,cur.byteLength).getUint32(4,true);
    const nxt=()=>{si++;cur=sstSegs[si];pos=0;return!!cur};
    const b=()=>{while(cur&&pos>=cur.length){if(!nxt())return 0}return cur[pos++]};
    const w16=()=>b()|(b()<<8);const d32=()=>(w16()|(w16()<<16))>>>0;
    const skip=n=>{while(n>0&&cur){const k=Math.min(n,cur.length-pos);pos+=k;n-=k;if(n>0&&!nxt())break}};
    for(let i=0;i<cu&&cur;i++){
      const cch=w16(),fl=b();let runs=0,ext=0;if(fl&8)runs=w16();if(fl&4)ext=d32();
      let hi=fl&1,s='',n=cch;
      while(n>0&&cur){
        if(pos>=cur.length){if(!nxt())break;hi=cur[pos++]&1;continue}
        const avail=cur.length-pos;
        if(hi){const k=Math.min(n,avail>>1);if(k===0){pos=cur.length;continue}s+=u16s(cur.subarray(pos,pos+k*2));pos+=k*2;n-=k}
        else{const k=Math.min(n,avail);s+=latin1(cur.subarray(pos,pos+k));pos+=k;n-=k}
      }
      skip(runs*4+ext);sst.push(s);
    }
  }
  /* uslublar */
  const colorOf=icv=>{if(icv==null||icv>=0x7FFF||icv===64||icv===65)return null;const c=pal[icv];return c?'#'+c:null};
  const xfCache=[];
  const xfStyle=i=>{
    if(xfCache[i]!=null)return xfCache[i];
    const x=xfs[i];if(!x)return xfCache[i]=0;
    const o={};const f=fontAt(x.ifnt);
    if(f.b)o.b=1;if(f.i)o.i=1;if(f.u)o.u=1;if(f.st)o.st=1;
    if(f.fs&&f.fs!==f0.fs)o.fs=f.fs;if(f.ff&&f.ff!==f0.ff)o.ff=f.ff;
    const fc=colorOf(f.icv);if(fc&&fc!=='#000000')o.fc=fc;
    if(x.ifmt){const nf=fmts[x.ifmt]||NFB[x.ifmt];if(nf&&!/^general$/i.test(nf))o.nf=nf}
    if(x.fls>0){const c=colorOf(x.fg);if(c&&c!=='#FFFFFF')o.bg=c}
    const ha=['','left','center','right','left','justify','center'][x.ha||0];if(ha)o.ha=ha;
    if(biff8){if(x.va===1)o.va='middle';else if(x.va===0)o.va='top'}
    if(x.wrap)o.wrap=1;if(x.ind)o.ind=x.ind;
    for(const[k,sk,ck]of[['bL','bL','cL'],['bR','bR','cR'],['bT','bT','cT'],['bB','bB','cB']]){const s=BDR[x[sk]||0];if(s)o[k]={st:s,c:colorOf(x[ck])||'#000000'}}
    return xfCache[i]=Object.keys(o).length?wb.styleId(o):0;
  };
  /* --- varaqlar --- */
  for(const info of sheetsInfo){
    if(info.dt!==0)continue; // faqat ishchi varaqlar
    const sh=new M.Sheet(wb,info.name||('Varaq'+(wb.sheets.length+1)));wb.sheets.push(sh);ctx.sheetNames.push(info.name);
    if(info.hs===1||info.hs===2)sh.hidden=true;
  }
  // sheetNames: BOUNDSHEET tartibi bo‘yicha indekslanadi (jadvallardan tashqari varaqlar ham hisobga olinadi)
  ctx.sheetNames=sheetsInfo.map(s=>s.name);
  ctx.names=names.map(n=>n?n.name:null);
  let shi=0;
  for(const info of sheetsInfo){
    if(info.dt!==0)continue;
    const sh=wb.sheets[shi++];
    let q=info.pos,depth=0,started=false;const pend=[];let lastF=null;
    let frozen=false,px=0,py=0;
    const cells=sh.cells;
    const put=(r,c,xf,v)=>{const s=xfStyle(xf);if(v==null&&!s)return;if(v==null&&s&&false)return;cells.set(key(r,c),{v,f:null,s})};
    const num=(r,c,xf,x)=>{const s=xfStyle(xf);if(date1904&&F.isDateFmt(wb.styles[s].nf))x+=1462;cells.set(key(r,c),{v:x,f:null,s})};
    for(;;){
      const r=rec(q);if(!r)break;q=r.next;const d=r.p;
      if(r.id===0x0809){depth++;if(depth>1)continue;started=true;continue}
      if(!started)continue;
      if(r.id===0x0A){depth--;if(depth<=0)break;continue}
      if(depth>1)continue;
      switch(r.id){
        case 0x0203:{const row=dv.getUint16(d,true),col=dv.getUint16(d+2,true);num(row,col,dv.getUint16(d+4,true),dv.getFloat64(d+6,true));break}
        case 0x027E:{const row=dv.getUint16(d,true),col=dv.getUint16(d+2,true);num(row,col,dv.getUint16(d+4,true),rk(dv.getUint32(d+6,true)));break}
        case 0xBD:{const row=dv.getUint16(d,true);let c=dv.getUint16(d+2,true);const n=(r.len-6)/6|0;for(let i=0;i<n;i++){num(row,c+i,dv.getUint16(d+4+i*6,true),rk(dv.getUint32(d+6+i*6,true)))}break}
        case 0x0201:{const row=dv.getUint16(d,true),col=dv.getUint16(d+2,true);put(row,col,dv.getUint16(d+4,true),null);break}

  /* ---------- select special / table style / delete sheet ---------- */
  function selectSpecial(kind){
    const u=wb.usedRange(X.sh);const s=sel();const cells=[];

    const rs=cells.map(c=>c[0]),cs=cells.map(c=>c[1]);X.select(Math.min(...rs),Math.min(...cs),Math.max(...rs),Math.max(...cs));toast(cells.length+' ta katak topildi (diapazon sifatida belgilandi)');
  }
  function tableStyle(hc,bc,headerOnly){

    wb.hist.begin('tblstyle');
    X.sh.applyStyle(s.r1,s.c1,s.r2,s.c2,{},(st,r,c)=>{
      if(r===s.r1)return{bg:hc,fc:'#ffffff',b:1,bB:{st:'medium',c:hc}};

  async function openFile(file){
    const base=file.name.replace(/\.[^.]+$/,'');
    const busy=toast('«'+file.name+'» ochilmoqda…',null,60000);
    try{
      const info=await OF.L.detect(file);
      if(info.unsupported){busy.remove();toast(OF.L.unsupportedMsg(file,info),'err',10000);return}
      if(info.app==='word'&&OF.openAny){busy.remove();return OF.openAny([file])}
      const u8=await OF.L.bytes(file);const kind=info.kind;let nw;
      if(kind==='xlsx')nw=await OF.X.readXlsx(u8,p=>{busy.textContent='Ochilmoqda… '+Math.round(p*100)+'%'});
      else if(kind==='xls')nw=OF.L.readXls(info.ole||u8);
      else if(kind==='xlsb')nw=await OF.L.readXlsb(u8);
      else if(kind==='ods')nw=await OF.L.readOds(u8);

async function appFor(f){
  let info;try{info=await OF.L.detect(f)}catch(e){return{app:null,why:'o‘qib bo‘lmadi'}}
  if(info.unsupported)return{app:null,why:OF.L.UNSUP[info.unsupported]||info.unsupported};

const curApp=()=>$('#excelApp').classList.contains('hidden')?'word':'excel';
async function openAny(files){
  files=[...files];if(!files.length)return;
  const routed=[];for(const f of files)routed.push({f,...await appFor(f)});
  const bad=routed.filter(x=>!x.app);
  if(bad.length)OF.UI.toast('Bu tur qo‘llab-quvvatlanmaydi: '+bad.slice(0,3).map(x=>x.f.name+' ('+x.why+')').join(', '),'err',7000);
  const good=routed.filter(x=>x.app);if(!good.length)return;
  const first={};for(const x of good){if(!first[x.app])first[x.app]=x.f}
  const order=[good[0].app,good[0].app==='excel'?'word':'excel'].filter(a=>first[a]);
  if(good.length>Object.keys(first).length)OF.UI.toast('Har bir ilovada faqat bitta fayl ochiladi (birinchisi).',null,3500);
  for(const a of order.slice().reverse()){ // oxirida birinchi faylning ilovasi ko‘rinib qoladi
    showApp(a);await new Promise(r=>setTimeout(r,60));
    const app=a==='excel'?OF.ExcelApp:OF.WordApp;

function wireOpenAny(){
  const b=$('#openAny');

  const veil=$('#dropVeil');let depth=0;
  const hasFiles=e=>e.dataTransfer&&[...(e.dataTransfer.types||[])].includes('Files');
  window.addEventListener('dragenter',e=>{if(!hasFiles(e))return;depth++;veil.classList.add('on')},true);
  window.addEventListener('dragleave',e=>{if(!hasFiles(e))return;depth=Math.max(0,depth-1);if(!depth)veil.classList.remove('on')},true);
  window.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault()},true); // brauzer faylni o‘zi ochib yubormasin

  if(location.hash==='#word')showApp('word',true);else showApp('excel',true);
  window.addEventListener('hashchange',()=>{if(location.hash==='#word')showApp('word',true);else if(location.hash==='#excel')showApp('excel',true)});
  const back=$('#toolsBackBtn');if(back)back.addEventListener('click',()=>{location.replace('index.html?fromTools=1#tools')});
  const body=document.body,btn=$('#modeToggle');
  try{if(localStorage.getItem('it_shakh_night_mode')==='1')body.classList.add('night-mode')}catch(e){}
  const lab=()=>{btn.textContent=body.classList.contains('night-mode')?'DAY MODE':'NIGHT MODE'};lab();
  btn.addEventListener('click',()=>{body.classList.toggle('night-mode');try{localStorage.setItem('it_shakh_night_mode',body.classList.contains('night-mode')?'1':'0')}catch(e){}lab()});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
})(window.OF=window.OF||{});

</script>

<script>
/* ===== SAYTNI TO'LIQ BLOKLASH + VPN TAQIQLASH + FOYDALANUVCHINI BLOKLASH — TOOLS sahifalari uchun =====
   index.html dagi admin panelidan "SAYTNI BLOKLASH" yoki "VPN TAQIQLASH" yoqilsa, yoki ma'lum bir foydalanuvchi

   ADMIN_EMAIL hech qachon tekshirilmaydi/bloklanmaydi. Hech qanday Google token talab qilinmaydi (sayt bloklash

(function(){
 var USERS_API_URL='https://script.google.com/macros/s/AKfycbyGcZgnnp91p19OhUVCep3zh_Izw9Day-jQaveO0rYVX7cK0F_y9yZaSHJ-qdMUZzhiBA/exec';
 var ADMIN='anonimshakh4647@gmail.com';
 var showingLock=false,showingVpn=false,showingBlock=false,checking=false,vpnFlag=null,vpnCheckedAt=0;

 function getUser(){try{return JSON.parse(localStorage.getItem('it_shakh_google_user')||'null')}catch(e){return null}}
 function isAdmin(){var u=getUser();return !!(u&&String(u.email||'').toLowerCase()===ADMIN);}
 function expMs(c){try{return JSON.parse(atob(c.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}}
 function blkMsgKey(){var u=getUser();return (u&&u.email)?('it_shakh_blk_'+String(u.email).toLowerCase()+'_msg'):null;}
 function getCachedMsg(key,def){if(!key)return def;try{var v=localStorage.getItem(key);return (v&&v.trim())?v:def;}catch(e){return def;}}
 function api(params,ms){return new Promise(function(res){
  var cb='sl2_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script'),done=false;
  var fin=function(v){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.parentNode&&sc.remove();res(v);};
  window[cb]=fin;sc.onerror=function(){fin(null)};setTimeout(function(){fin(null)},ms||9000);
  var qs='';for(var k in params){if(params[k]==null)continue;qs+=(qs?'&':'')+k+'='+encodeURIComponent(params[k]);}
  sc.src=USERS_API_URL+'?'+qs+'&callback='+cb+'&_='+Date.now();document.head.appendChild(sc);});}
 function showLock(msg){
  var txt=(msg&&String(msg).trim())?String(msg):getCachedMsg('it_shakh_sitelock_msg',DEFAULT_LOCK_MSG);
  var d=document.getElementById('sl-modal');
  if(!d){
   ['vb-modal','bk-modal'].forEach(function(id){var m=document.getElementById(id);if(m)m.remove();});
   showingVpn=false;showingBlock=false;
   d=document.createElement('div');d.id='sl-modal';
   d.innerHTML='<div class="sl-box"><div class="sl-ic">🛠️</div><h2>Sayt vaqtincha yopiq</h2><p></p></div>';
   document.body.appendChild(d);document.body.style.overflow='hidden';
  }
  showingLock=true;
  var p=d.querySelector('p');if(p)p.textContent=txt;
 }
 function hideLock(){var d=document.getElementById('sl-modal');if(!d)return;d.remove();showingLock=false;document.body.style.overflow=(showingVpn||showingBlock)?'hidden':'';}
 function showBlock(msg){
  if(showingLock)return;
  var txt=(msg&&String(msg).trim())?String(msg):getCachedMsg(blkMsgKey(),DEFAULT_BLOCK_MSG);
  var d=document.getElementById('bk-modal');
  if(!d){
   var vb=document.getElementById('vb-modal');if(vb)vb.remove();showingVpn=false;
   d=document.createElement('div');d.id='bk-modal';
   d.innerHTML='<div class="bk-box"><div class="bk-ic">🚫</div><h2>Akkauntingiz bloklangan</h2><p></p><p class="bk-sub">Bu xato deb hisoblasangiz, administrator bilan bog‘laning.</p></div>';
   document.body.appendChild(d);document.body.style.overflow='hidden';
  }
  showingBlock=true;
  var p=d.querySelector('p');if(p)p.textContent=txt;
 }
 function hideBlock(){var d=document.getElementById('bk-modal');if(!d)return;d.remove();showingBlock=false;document.body.style.overflow=(showingLock||showingVpn)?'hidden':'';}
 function showVpn(){
  if(showingVpn||showingLock||showingBlock||document.getElementById('vb-modal'))return;showingVpn=true;
  var d=document.createElement('div');d.id='vb-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛡️</div><h2>VPN/Proksi orqali kirish taqiqlangan</h2><p>Saytdan foydalanish uchun VPN yoki proksi dasturini o‘chirib, sahifani qayta yuklang.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideVpn(){var d=document.getElementById('vb-modal');if(!d)return;d.remove();showingVpn=false;document.body.style.overflow=(showingLock||showingBlock)?'hidden':'';}
 function checkVpn(){
  return new Promise(function(res){
   var c=(typeof AbortController!=='undefined')?new AbortController():null,t=setTimeout(function(){if(c)c.abort();},5000);
   fetch('https://api.ipapi.is/',c?{signal:c.signal}:{}).then(function(r){
    clearTimeout(t);if(!r.ok)return res(null);return r.json();
   }).then(function(j){
    if(!j||typeof j!=='object'||(j.is_vpn==null&&j.is_proxy==null&&j.is_datacenter==null))return res(null);
    res(!!(j.is_vpn||j.is_proxy||j.is_tor||j.is_datacenter));
   }).catch(function(){clearTimeout(t);res(null);});
  });
 }
 function tick(){
  if(checking||isAdmin())return;
  checking=true;
  var u=getUser(),credOk=!!(u&&u.email&&u.credential);
  // XAVFSIZLIK (reload bilan aylanib o'tishning oldini olish): sayt bloki yoki shu foydalanuvchining bloki
  // oldin keshlangan bo'lsa, serverdan javob kelgunga QADAR HAM tegishli ekran DARHOL ko'rsatiladi.
  var cachedLock=false;try{cachedLock=localStorage.getItem('it_shakh_sitelock_flag')==='1';}catch(e){}
  if(cachedLock&&!showingLock)showLock();
  var blkKey=credOk?('it_shakh_blk_'+String(u.email).toLowerCase()):null;
  var cachedBlk=false;if(blkKey){try{cachedBlk=localStorage.getItem(blkKey)==='1';}catch(e){}}
  if(cachedBlk&&!showingBlock)showBlock();
  var p1=api({action:'sitestat'},9000);
  var p2=credOk?api({action:(expMs(u.credential)>Date.now()+10000?'me':'blockstat'),credential:u.credential},9000):Promise.resolve(null);
  Promise.all([p1,p2]).then(function(res){checking=false;
   var r=res[0],rb=res[1];
   if(r&&r.ok&&r.locked){try{localStorage.setItem('it_shakh_sitelock_flag','1');if(r.lockMsg)localStorage.setItem('it_shakh_sitelock_msg',r.lockMsg);else localStorage.removeItem('it_shakh_sitelock_msg');}catch(e){}return showLock(r.lockMsg);}
   if(r&&r.ok&&!r.locked){try{localStorage.removeItem('it_shakh_sitelock_flag');localStorage.removeItem('it_shakh_sitelock_msg');}catch(e){}if(showingLock)hideLock();}
   if(rb&&rb.ok&&rb.blocked){if(blkKey){try{localStorage.setItem(blkKey,'1');var bmk=blkMsgKey();if(bmk){if(rb.blockMsg)localStorage.setItem(bmk,rb.blockMsg);else localStorage.removeItem(bmk);}}catch(e){}}return showBlock(rb.blockMsg);}
   if(rb&&rb.ok&&!rb.blocked){if(blkKey){try{localStorage.removeItem(blkKey);var bmk2=blkMsgKey();if(bmk2)localStorage.removeItem(bmk2);}catch(e){}}if(showingBlock)hideBlock();}
   if(r&&r.ok&&r.vpnBlock){
    if(vpnFlag===null||Date.now()-vpnCheckedAt>120000){
     checkVpn().then(function(v){vpnFlag=v;vpnCheckedAt=Date.now();
      if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
     });
    }else if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
   }else if(showingVpn)hideVpn();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
