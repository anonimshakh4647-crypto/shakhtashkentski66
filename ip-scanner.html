<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP Scanner | IT SHAKH</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header><main><div class="eyebrow">// NETWORK INTELLIGENCE</div><h1>IP SCANNER</h1><p class="intro">IP manzilning ochiq geolokatsiya va tarmoq ma’lumotlarini ko‘ring. Bu vosita portlarni skanerlamaydi va hech qanday tizimga kirmaydi.</p><section class="panel"><div class="input-row"><input id="ip" placeholder="Masalan: 8.8.8.8 yoki my IP" autocomplete="off"><button id="scan">TEKSHIRISH</button></div><p class="notice">Faqat ommaga ochiq IP ma’lumoti ko‘rsatiladi. Natija tashqi geolokatsiya xizmatidan olinadi.</p><div id="status" class="loading">Tayyor.</div><div class="grid" id="results" hidden></div></section></main><script>
const fields=[['IP','ip'],['Davlat','country_name'],['Shahar','city'],['Region','region'],['Provayder / ASN','org'],['Vaqt zonasi','timezone']]; const results=document.querySelector('#results'),status=document.querySelector('#status');
async function scan(){let ip=document.querySelector('#ip').value.trim();status.textContent='Ma’lumot olinmoqda…';results.hidden=true;try{if(!ip||ip.toLowerCase()==='my ip') ip=await (await fetch('https://api64.ipify.org?format=json')).json().then(x=>x.ip);document.querySelector('#ip').value=ip;const r=await fetch('https://ipapi.co/'+encodeURIComponent(ip)+'/json/');const d=await r.json();if(d.error)throw Error(d.reason||'IP topilmadi');results.innerHTML=fields.map(([label,key])=>'<div class="stat"><div class="label">'+label+'</div><div class="value">'+(d[key]||'—')+'</div></div>').join('');results.hidden=false;status.textContent='✓ Ochiq ma’lumot topildi.'}catch(e){status.textContent='✕ Natijani olish imkoni bo‘lmadi: '+e.message}}
document.querySelector('#scan').onclick=scan;document.querySelector('#ip').addEventListener('keydown',e=>{if(e.key==='Enter')scan()});
</script></body></html>
