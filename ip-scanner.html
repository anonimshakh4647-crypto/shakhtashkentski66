<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP Scanner | IT SHAKH</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// NETWORK INTELLIGENCE</div><h1>IP SCANNER</h1><p class="intro">IP manzilning ochiq geolokatsiya va tarmoq ma’lumotlarini ko‘ring. Bu vosita portlarni skanerlamaydi va hech qanday tizimga kirmaydi.</p><section class="panel"><div class="input-row"><input id="ip" placeholder="Masalan: 8.8.8.8 yoki my IP" autocomplete="off"><button id="scan">TEKSHIRISH</button></div><p class="notice">Faqat ommaga ochiq IP ma’lumoti ko‘rsatiladi. Natija tashqi geolokatsiya xizmatidan olinadi.</p><div id="status" class="loading">Tayyor.</div><div class="grid" id="results" hidden></div></section></main><script>
const fields=[['IP','ip'],['Davlat','country_name'],['Shahar','city'],['Region','region'],['Provayder / ASN','org'],['Vaqt zonasi','timezone']];
const results=document.querySelector('#results'),status=document.querySelector('#status');

function isIPv4(s){
  const p=s.split('.');
  return p.length===4 && p.every(x=>/^\d+$/.test(x)&&+x>=0&&+x<=255);
}
function hostnameOf(value){
  try{
    const u=/^[a-z][a-z0-9+.-]*:\/\//i.test(value) ? new URL(value) : new URL('https://'+value);
    return u.hostname;
  }catch(e){
    return value.replace(/^[a-z][a-z0-9+.-]*:\/\//i,'').split('/')[0].split(':')[0].trim();
  }
}
async function getJSON(url,options){
  const r=await fetch(url,options||{});
  const t=await r.text();
  if(!r.ok) throw new Error('Server javobi: HTTP '+r.status);
  try{return JSON.parse(t)}
  catch(e){throw new Error('Tashqi xizmat JSON o‘rniga HTML yoki boshqa javob qaytardi.')}
}
async function resolveHost(host){
  const d=await getJSON('https://cloudflare-dns.com/dns-query?name='+encodeURIComponent(host)+'&type=A',{headers:{Accept:'application/dns-json'}});
  const a=(d.Answer||[]).find(x=>x.type===1 && isIPv4(x.data));
  if(!a) throw new Error('Domen uchun IPv4 manzil topilmadi.');
  return a.data;
}
async function scan(){
  let input=document.querySelector('#ip').value.trim();
  status.textContent='Ma’lumot olinmoqda…';
  results.hidden=true;
  try{
    let ip=input;
    if(!ip || input.toLowerCase()==='my ip'){
      ip=(await getJSON('https://api64.ipify.org?format=json')).ip;
    }else if(!isIPv4(ip)){
      ip=await resolveHost(hostnameOf(ip));
    }
    document.querySelector('#ip').value=ip;
    const d=await getJSON('https://ipapi.co/'+encodeURIComponent(ip)+'/json/');
    if(d.error) throw new Error(d.reason||'IP topilmadi');
    results.innerHTML=fields.map(([label,key])=>'<div class="stat"><div class="label">'+label+'</div><div class="value">'+String(d[key]??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))+'</div></div>').join('');
    results.hidden=false;
    status.textContent='✓ Ochiq ma’lumot topildi.';
  }catch(e){
    status.textContent='✕ Natijani olish imkoni bo‘lmadi: '+e.message;
  }
}
document.querySelector('#scan').onclick=scan;
document.querySelector('#ip').addEventListener('keydown',e=>{if(e.key==='Enter')scan()});
</script></body></html>
