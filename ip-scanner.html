<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP Scanner | IT SHAKH</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// NETWORK INTELLIGENCE</div><h1>IP SCANNER</h1><p class="intro">IP manzilning ochiq geolokatsiya va tarmoq ma’lumotlarini ko‘ring. Bu vosita portlarni skanerlamaydi va hech qanday tizimga kirmaydi.</p><section class="panel"><div class="input-row"><input id="ip" placeholder="Masalan: 8.8.8.8 yoki my IP" autocomplete="off"><button id="scan">TEKSHIRISH</button></div><p class="notice">Faqat ommaga ochiq IP ma’lumoti ko‘rsatiladi. Natija tashqi geolokatsiya xizmatidan olinadi.</p><div id="status" class="loading">Tayyor.</div><div class="grid" id="results" hidden></div></section></main><script>
const results=document.querySelector('#results'),status=document.querySelector('#status');

function isIPv4(s){
  const p=s.split('.');
  return p.length===4 && p.every(x=>/^\d+$/.test(x)&&+x>=0&&+x<=255);
}
function hostnameOf(value){
  try{
    const u=/^[a-z][a-z0-9+.-]*:\/\//i.test(value) ? new URL(value) : new URL('https://'+value);
    return u.hostname;
  }catch(e){
    return value.replace(/^[a-z][a-z0-9+.-]*:\/\//i,'').split('/')[0].split(':')[0].trim();
  }
}
async function getJSON(url,options){
  const r=await fetch(url,options||{});
  const t=await r.text();
  if(!r.ok) throw new Error('HTTP '+r.status);
  try{return JSON.parse(t)}
  catch(e){throw new Error('Xizmat JSON ma’lumot qaytarmadi.')}
}
async function resolveHost(host){
  const d=await getJSON(
    'https://cloudflare-dns.com/dns-query?name='+encodeURIComponent(host)+'&type=A',
    {headers:{Accept:'application/dns-json'}}
  );
  const a=(d.Answer||[]).find(x=>x.type===1 && isIPv4(x.data));
  if(!a) throw new Error('Domen uchun IPv4 manzil topilmadi.');
  return a.data;
}
function esc(v){
  return String(v??'—').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function flatten(obj,prefix='',out=[]){
  if(obj===null || obj===undefined || obj==='') return out;
  if(typeof obj!=='object'){out.push([prefix,String(obj)]);return out;}
  if(Array.isArray(obj)){
    if(obj.length===0) return out;
    obj.forEach((v,i)=>flatten(v,prefix+'['+i+']',out));
    return out;
  }
  Object.entries(obj).forEach(([k,v])=>{
    const key=prefix?prefix+'.'+k:k;
    if(v!==null && typeof v==='object') flatten(v,key,out);
    else if(v!==null && v!==undefined && v!=='') out.push([key,String(v)]);
  });
  return out;
}
function labelize(k){
  const labels={
    ip:'IP manzil',version:'IP versiya',network:'Tarmoq / CIDR',
    country_name:'Davlat',country_code:'Davlat kodi',continent_code:'Qit’a kodi',
    continent_name:'Qit’a',region:'Region / viloyat',city:'Shahar',
    postal:'Pochta indeksi',latitude:'Kenglik (Latitude)',longitude:'Uzunlik (Longitude)',
    timezone:'Vaqt zonasi',utc_offset:'UTC offset',org:'Provayder / tashkilot',
    asn:'ASN',hostname:'Hostname / Reverse DNS',country_calling_code:'Telefon kodi',
    currency:'Valyuta',currency_name:'Valyuta nomi',languages:'Tillar',
    country_capital:'Poytaxt',country_population:'Aholi',in_eu:'EU hududi',
    abuse:'Abuse ma’lumoti',version_name:'IP versiyasi'
  };
  return labels[k] || k.replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
}
async function getIPData(ip){
  try{
    const d=await getJSON('https://ipapi.co/'+encodeURIComponent(ip)+'/json/');
    if(!d.error) return d;
  }catch(e){}
  const w=await getJSON('https://ipwho.is/'+encodeURIComponent(ip));
  if(w.success===false) throw new Error(w.message||'IP ma’lumoti topilmadi.');
  return {
    ip:w.ip,version:w.type,continent_code:w.continent_code,continent_name:w.continent,
    country_name:w.country,country_code:w.country_code,region:w.region,city:w.city,
    postal:w.postal,latitude:w.latitude,longitude:w.longitude,
    timezone:w.timezone?.id,utc_offset:w.timezone?.utc,
    org:w.connection?.org,asn:w.connection?.asn,network:w.connection?.domain,
    hostname:w.reverse?.dns
  };
}
async function scan(){
  const input=document.querySelector('#ip').value.trim();
  status.textContent='Barcha ochiq ma’lumotlar olinmoqda…';
  results.hidden=true;
  try{
    let ip=input;
    if(!ip || input.toLowerCase()==='my ip'){
      ip=(await getJSON('https://api64.ipify.org?format=json')).ip;
    }else if(!isIPv4(ip)){
      ip=await resolveHost(hostnameOf(ip));
    }
    document.querySelector('#ip').value=ip;

    const d=await getIPData(ip);
    const rows=flatten(d);
    results.innerHTML=rows.map(([key,val])=>
      '<div class="stat"><div class="label">'+esc(labelize(key))+'</div><div class="value">'+esc(val)+'</div></div>'
    ).join('');
    results.hidden=false;
    status.textContent='✓ '+rows.length+' ta ochiq ma’lumot topildi.';
  }catch(e){
    status.textContent='✕ Natijani olish imkoni bo‘lmadi: '+e.message;
  }
}
document.querySelector('#scan').onclick=scan;
document.querySelector('#ip').addEventListener('keydown',e=>{if(e.key==='Enter')scan()});
</script><!-- IT-SHAKH-SITELOCK -->

<script>
/* ===== SAYTNI TO'LIQ BLOKLASH (texnik ishlar rejimi) — TOOLS sahifalari uchun =====

   Hech qanday Google token/kredensial talab qilinmaydi — shuning uchun sessiya holatidan qat'i nazar ishlaydi. */
(function(){
 var USERS_API_URL='https://script.google.com/macros/s/AKfycbyGcZgnnp91p19OhUVCep3zh_Izw9Day-jQaveO0rYVX7cK0F_y9yZaSHJ-qdMUZzhiBA/exec';
 var ADMIN='anonimshakh4647@gmail.com';
 var showing=false,checking=false;
 function getUser(){try{return JSON.parse(localStorage.getItem('it_shakh_google_user')||'null')}catch(e){return null}}
 function isAdmin(){var u=getUser();return !!(u&&String(u.email||'').toLowerCase()===ADMIN);}
 function api(ms){return new Promise(function(res){
  var cb='sl2_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script'),done=false;
  var fin=function(v){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.parentNode&&sc.remove();res(v);};
  window[cb]=fin;sc.onerror=function(){fin(null)};setTimeout(function(){fin(null)},ms||9000);
  sc.src=USERS_API_URL+'?action=sitestat&callback='+cb+'&_='+Date.now();document.head.appendChild(sc);});}
 function show(){
  if(showing||document.getElementById('sl-modal'))return;showing=true;
  var d=document.createElement('div');d.id='sl-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛠️</div><h2>Sayt vaqtincha yopiq</h2><p>Hozirda saytda texnik ishlar olib borilmoqda. Iltimos, birozdan so‘ng qayta urinib ko‘ring.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hide(){var d=document.getElementById('sl-modal');if(!d)return;d.remove();showing=false;document.body.style.overflow='';}
 function tick(){
  if(checking||isAdmin())return;
  checking=true;api(9000).then(function(r){checking=false;
   if(r&&r.ok&&r.locked)show();else if(r&&r.ok&&!r.locked&&showing)hide();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
</script>
