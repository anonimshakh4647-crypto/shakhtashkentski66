<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHAKH BASS | IT SHAKH</title>
<link rel="stylesheet" href="tools.css">
<style>
:root{--accent:#38bdf8;--green:#22c55e;--bg:#030811;--panel:rgba(5,13,25,.78);--muted:#8fa8bd}
*{box-sizing:border-box}body{min-height:100vh;background:radial-gradient(circle at 75% 15%,rgba(28,91,145,.22),transparent 35%),#030811;color:#eaf4ff;font-family:Inter,system-ui,sans-serif}header{height:76px;padding:0 4%;border-bottom:1px solid rgba(56,189,248,.2);display:flex;align-items:center;justify-content:space-between;background:rgba(2,7,14,.88);backdrop-filter:blur(10px)}header a{color:var(--accent);text-decoration:none;font-weight:800}.brand{letter-spacing:2px}main{max-width:1180px;margin:0 auto;padding:70px 24px}.eyebrow{color:var(--accent);font:13px/1.2 monospace;letter-spacing:4px}.hero-title{font-size:clamp(48px,8vw,96px);line-height:.9;margin:18px 0 12px;font-weight:900;letter-spacing:-4px}.intro{color:#9fb5c8;font-size:18px;max-width:760px}.player{margin-top:38px;border:1px solid rgba(56,189,248,.4);border-radius:24px;padding:28px;background:linear-gradient(145deg,rgba(6,17,31,.92),rgba(2,8,17,.86));box-shadow:0 0 55px rgba(56,189,248,.12)}.track{display:grid;grid-template-columns:90px 1fr auto;gap:22px;align-items:center}.cover{width:90px;height:90px;border-radius:20px;display:grid;place-items:center;border:1px solid rgba(56,189,248,.45);background:radial-gradient(circle,#123a57,#06101c 68%);font-size:30px;box-shadow:0 0 35px rgba(56,189,248,.2)}.track h2{margin:0 0 7px;font-size:25px}.track p{margin:0;color:var(--muted)}button{border:0;cursor:pointer;color:#03101a;background:var(--accent);font-weight:900;border-radius:12px;padding:12px 18px}.play{width:58px;height:58px;border-radius:50%;font-size:20px}.timeline{margin:26px 0 8px}.timeline input{width:100%}input[type=range]{accent-color:var(--accent);cursor:pointer}.times{display:flex;justify-content:space-between;color:#7891a6;font:12px monospace}.controls{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.control{padding:18px;border:1px solid rgba(56,189,248,.17);border-radius:16px;background:rgba(2,9,18,.55)}.control label{display:flex;justify-content:space-between;margin-bottom:12px;color:#9fb5c8;font:12px monospace;letter-spacing:2px}.switch{display:flex;gap:10px;align-items:center}.switch input{width:20px;height:20px}.visual{margin-top:22px;border:1px solid rgba(56,189,248,.17);border-radius:16px;padding:14px;background:#020811}.visual canvas{width:100%;height:150px;display:block}.status{margin-top:12px;color:#6f8da4;font:12px monospace}.playlist{margin-top:24px;display:grid;gap:10px}.song{display:flex;align-items:center;gap:14px;padding:15px 17px;border:1px solid rgba(56,189,248,.16);border-radius:14px;background:rgba(3,10,19,.58)}.song.active{border-color:rgba(56,189,248,.55);box-shadow:0 0 22px rgba(56,189,248,.1)}.song-icon{color:var(--accent);font-size:20px}.song-title{font-weight:800}.song-sub{font-size:12px;color:#71899e;margin-top:3px}@media(max-width:700px){main{padding:45px 15px}.track{grid-template-columns:70px 1fr}.track .play{grid-column:1/-1;width:100%;border-radius:12px}.cover{width:70px;height:70px}.controls{grid-template-columns:1fr}.hero-title{letter-spacing:-2px}}
</style>
</head>
<body>
<header><a class="brand" href="index.html">IT SHAKH</a><a href="index.html">← BOSH SAHIFA</a></header>
<main>
<div class="eyebrow">// SHAKH BASS AUDIO SYSTEM</div>
<h1 class="hero-title">BASS</h1>
<p class="intro">SHAKH BASS musiqa bo‘limi. Bass Boost, 3D Hall va jonli equalizer bilan musiqani boshqaring.</p>
<section class="player">
  <div class="track">
    <div class="cover">♫</div>
    <div><h2>SHAKH BASS</h2><p>SHAKH.mp3 • IT SHAKH AUDIO</p></div>
    <button class="play" id="play">▶</button>
  </div>
  <div class="timeline"><input id="seek" type="range" min="0" max="100" value="0"><div class="times"><span id="current">00:00</span><span id="duration">00:00</span></div></div>
  <div class="controls">
    <div class="control"><label><span>VOLUME</span><b id="volText">70%</b></label><input id="volume" type="range" min="0" max="100" value="70"></div>
    <div class="control"><label><span>BASS BOOST</span><b id="bassText">0 dB</b></label><input id="bass" type="range" min="0" max="18" value="0"></div>
    <div class="control"><label><span>3D HALL</span><b id="hallText">OFF</b></label><div class="switch"><input id="hall" type="checkbox"><span>Spatial hall effect</span></div></div>
    <div class="control"><label><span>PLAYBACK</span><b>LOOP</b></label><div class="switch"><input id="loop" type="checkbox" checked><span>Avtomatik takrorlash</span></div></div>
  </div>
  <div class="visual"><canvas id="eq" width="1100" height="300"></canvas><div class="status" id="status">READY • SHAKH BASS</div></div>
  <div class="playlist"><div class="song active"><div class="song-icon">♫</div><div><div class="song-title">SHAKH BASS</div><div class="song-sub">SHAKH.mp3</div></div></div></div>
</section>
<audio id="audio" src="SHAKH.mp3" preload="metadata"></audio>
</main>
<script>
const audio=document.getElementById('audio'),play=document.getElementById('play'),seek=document.getElementById('seek'),volume=document.getElementById('volume'),bass=document.getElementById('bass'),hall=document.getElementById('hall'),loop=document.getElementById('loop'),eq=document.getElementById('eq'),ctx=eq.getContext('2d');
let ac,source,gain,bassFilter,analyser,convolver,hallGain,dryGain,ready=false;
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function initAudio(){if(ready)return;ac=new (window.AudioContext||window.webkitAudioContext)();source=ac.createMediaElementSource(audio);gain=ac.createGain();bassFilter=ac.createBiquadFilter();bassFilter.type='lowshelf';bassFilter.frequency.value=120;analyser=ac.createAnalyser();analyser.fftSize=128;convolver=ac.createConvolver();hallGain=ac.createGain();dryGain=ac.createGain();convolver.buffer=makeImpulse(ac,1.8,2.2);hallGain.gain.value=0;dryGain.gain.value=1;source.connect(bassFilter);bassFilter.connect(dryGain);dryGain.connect(gain);bassFilter.connect(convolver);convolver.connect(hallGain);hallGain.connect(gain);gain.connect(analyser);analyser.connect(ac.destination);gain.gain.value=.7;ready=true;draw();}
function makeImpulse(ac,duration,decay){const len=Math.floor(ac.sampleRate*duration),b=ac.createBuffer(2,len,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay)}return b}
async function toggle(){initAudio();if(ac.state==='suspended')await ac.resume();if(audio.paused){await audio.play();play.textContent='❚❚';document.getElementById('status').textContent='PLAYING • SHAKH BASS'}else{audio.pause();play.textContent='▶';document.getElementById('status').textContent='PAUSED • SHAKH BASS'}}
play.onclick=toggle;audio.addEventListener('loadedmetadata',()=>document.getElementById('duration').textContent=fmt(audio.duration));audio.addEventListener('timeupdate',()=>{if(audio.duration)seek.value=audio.currentTime/audio.duration*100;document.getElementById('current').textContent=fmt(audio.currentTime)});audio.addEventListener('ended',()=>{if(loop.checked){audio.currentTime=0;audio.play()}else{play.textContent='▶';document.getElementById('status').textContent='ENDED • SHAKH BASS'}});seek.oninput=()=>{if(audio.duration)audio.currentTime=seek.value/100*audio.duration};volume.oninput=()=>{const v=volume.value/100;if(gain)gain.gain.value=v;document.getElementById('volText').textContent=volume.value+'%'};bass.oninput=()=>{if(bassFilter)bassFilter.gain.value=+bass.value;document.getElementById('bassText').textContent=bass.value+' dB'};hall.onchange=()=>{if(hallGain)hallGain.gain.value=hall.checked?.28:0;if(dryGain)dryGain.gain.value=hall.checked?.78:1;document.getElementById('hallText').textContent=hall.checked?'ON':'OFF'};
function draw(){requestAnimationFrame(draw);ctx.clearRect(0,0,eq.width,eq.height);ctx.fillStyle='#020811';ctx.fillRect(0,0,eq.width,eq.height);if(!analyser)return;const data=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(data);const gap=5,w=(eq.width-gap*(data.length-1))/data.length;for(let i=0;i<data.length;i++){const h=Math.max(2,data[i]/255*eq.height*.9);ctx.fillStyle='#38bdf8';ctx.fillRect(i*(w+gap),eq.height-h,w,h)}}
</script>
</body></html>
