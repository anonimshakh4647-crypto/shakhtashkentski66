<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT SHAKH — KALENDAR</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at top,#10283a,#050b12 55%);color:#e8f7ff;font-family:Segoe UI,Arial,sans-serif}
.wrap{max-width:1050px;margin:auto}.top,.card{background:#07111beF;border:1px solid #16344a;border-radius:18px;box-shadow:0 15px 50px #0008}
.top{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;letter-spacing:2px}.brand b{color:#00e5ff}
.back,.nav{border:1px solid #1b4662;background:#081827;color:#dff5ff;border-radius:10px;font-weight:800;cursor:pointer}.back{padding:10px 15px}.back:hover,.nav:hover{border-color:#00e5ff;color:#00e5ff}
.card{padding:22px}.live{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #16344a;padding-bottom:20px;margin-bottom:20px}.label{font-size:11px;color:#8ba8ba;font-weight:800;letter-spacing:1.5px}.today{font-size:clamp(25px,5vw,42px);font-weight:900;margin-top:5px}.clock{font-size:clamp(20px,4vw,31px);font-weight:800;color:#00e5ff;font-variant-numeric:tabular-nums}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.title{font-size:clamp(21px,4vw,31px);font-weight:900}.nav{width:44px;height:44px;font-size:23px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week div{text-align:center;color:#8ba8ba;font-size:12px;font-weight:800;padding:7px}.day{min-height:70px;padding:8px;border:1px solid #123047;background:#081521;border-radius:11px;font-weight:800}.empty{background:transparent;border-color:transparent}.num{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center}.todaycell{border-color:#00e5ff;box-shadow:0 0 15px #00e5ff18}.todaycell .num{border-radius:50%;background:#00e5ff;color:#001017}.note{text-align:center;color:#8ba8ba;font-size:11px;margin-top:16px}

.prayer-box{margin-top:22px;padding:18px;border:1px solid #16344a;border-radius:16px;background:#081521}
.prayer-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}
.prayer-title{font-size:17px;font-weight:900;color:#e8f7ff}
.prayer-location{font-size:10px;color:#8ba8ba;font-family:monospace}
.prayers{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.prayer{padding:12px 7px;text-align:center;border:1px solid #123047;border-radius:10px;background:#07111b}
.prayer.active{border-color:#00e5ff;box-shadow:0 0 15px #00e5ff18}
.prayer-name{font-size:10px;color:#8ba8ba;font-weight:800}
.prayer-time{margin-top:6px;font-size:18px;font-weight:900;color:#00e5ff;font-variant-numeric:tabular-nums}
.prayer-next{margin-top:13px;text-align:center;color:#94a8b8;font:11px monospace}
.prayer-status{margin-top:8px;text-align:center;color:#64748b;font:9px monospace}

@media(max-width:600px){.prayers{grid-template-columns:repeat(3,1fr)}.prayer-time{font-size:16px}}
@media(max-width:600px){body{padding:9px}.card{padding:13px}.live{align-items:flex-start;flex-direction:column;gap:15px}.day{min-height:54px;padding:5px}.week,.days{gap:4px}.week div{font-size:10px}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand">IT <b>SHAKH</b> — KALENDAR</div><button class="back" onclick="location.href='index.html'">← ORQAGA</button></div>
<div class="card"><div class="live"><div><div class="label">BUGUN</div><div class="today" id="today">—</div></div><div><div class="label">HOZIRGI VAQT</div><div class="clock" id="clock">—</div></div></div>
<div class="head"><button class="nav" id="prev">‹</button><div class="title" id="title">—</div><button class="nav" id="next">›</button></div>
<div class="week" id="week"></div><div class="days" id="days"></div><div class="note">Sana va vaqt qurilmangizning lokal vaqtiga asoslanib avtomatik yangilanadi.</div>
<div class="prayer-box">
  <div class="prayer-head">
    <div class="prayer-title">🕌 NAMOZ VAQTLARI</div>
    <div class="prayer-location">Toshkent, O‘zbekiston</div>
  </div>
  <div class="prayers" id="prayers">
    <div class="prayer"><div class="prayer-name">BOMDOD</div><div class="prayer-time">—</div></div>
    <div class="prayer"><div class="prayer-name">PESHIN</div><div class="prayer-time">—</div></div>
    <div class="prayer"><div class="prayer-name">ASR</div><div class="prayer-time">—</div></div>
    <div class="prayer"><div class="prayer-name">SHOM</div><div class="prayer-time">—</div></div>
    <div class="prayer"><div class="prayer-name">XUFTON</div><div class="prayer-time">—</div></div>
    <div class="prayer"><div class="prayer-name">QUYOSH</div><div class="prayer-time">—</div></div>
  </div>
  <div class="prayer-next" id="prayerNext">Keyingi namoz: —</div>
  <div class="prayer-status" id="prayerStatus">Namoz vaqtlari internetdan olinmoqda…</div>
</div>
</div></div>
<script>
(()=>{'use strict';
const months=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const weeks=['Du','Se','Cho','Pa','Ju','Sha','Ya'];
weeks.forEach(x=>{const e=document.createElement('div');e.textContent=x;document.getElementById('week').appendChild(e);});

const pad=n=>String(n).padStart(2,'0');
const todayEl=document.getElementById('today');
const clockEl=document.getElementById('clock');
const titleEl=document.getElementById('title');
const daysEl=document.getElementById('days');

let y,m;
let networkNowMs=null;
let lastSyncLocalMs=Date.now();
let syncing=false;

function networkNow(){
  if(networkNowMs===null) return new Date();
  return new Date(networkNowMs+(Date.now()-lastSyncLocalMs));
}

async function syncRealTime(){
  if(syncing)return;
  syncing=true;
  try{
    const t0=Date.now();
    const r=await fetch('https://worldtimeapi.org/api/timezone/Asia/Tashkent?x='+Date.now(),{
      cache:'no-store',
      headers:{'Accept':'application/json'}
    });
    if(!r.ok)throw new Error('time api');
    const data=await r.json();
    const serverMs=Date.parse(data.datetime);
    if(!Number.isNaN(serverMs)){
      const t1=Date.now();
      networkNowMs=serverMs+Math.round((t1-t0)/2);
      lastSyncLocalMs=t1;
    }
  }catch(e){
    // Network vaqt vaqtincha olinmasa, oxirgi sinxronlangan vaqt davom etadi.
    // Birinchi yuklanishda API ishlamasa, qurilma vaqti vaqtinchalik fallback bo'ladi.
  }finally{
    syncing=false;
    updateLive();
    const n=networkNow();
    if(y!==n.getFullYear()||m!==n.getMonth()){
      y=n.getFullYear();m=n.getMonth();draw();
    }
  }
}

function updateLive(){
  const n=networkNow();
  todayEl.textContent=pad(n.getDate())+'.'+pad(n.getMonth()+1)+'.'+n.getFullYear();
  clockEl.textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}

function draw(){
  titleEl.textContent=months[m]+' '+y;
  daysEl.innerHTML='';
  const first=(new Date(y,m,1).getDay()+6)%7;
  const count=new Date(y,m+1,0).getDate();
  const n=networkNow();
  for(let i=0;i<first;i++){
    const e=document.createElement('div');e.className='day empty';daysEl.appendChild(e);
  }
  for(let d=1;d<=count;d++){
    const e=document.createElement('div');e.className='day';
    const z=document.createElement('span');z.className='num';z.textContent=d;e.appendChild(z);
    if(y===n.getFullYear()&&m===n.getMonth()&&d===n.getDate())e.classList.add('todaycell');
    daysEl.appendChild(e);
  }
}

document.getElementById('prev').onclick=()=>{if(--m<0){m=11;y--}draw()};
document.getElementById('next').onclick=()=>{if(++m>11){m=0;y++}draw()};

const initial=new Date();
y=initial.getFullYear();m=initial.getMonth();
updateLive();draw();
syncRealTime();
setInterval(updateLive,1000);
setInterval(syncRealTime,5*60*1000);
async function loadPrayerTimes(){
  const status=document.getElementById('prayerStatus');
  try{
    const n=networkNow();
    const date=pad(n.getDate())+'-'+pad(n.getMonth()+1)+'-'+n.getFullYear();
    const url='https://api.aladhan.com/v1/timingsByCity/'+encodeURIComponent(date)+'?city=Tashkent&country=Uzbekistan&method=2&school=1';
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('prayer api');
    const j=await r.json();
    const t=j?.data?.timings;
    if(!t)throw new Error('no timings');

    const vals=[t.Fajr,t.Dhuhr,t.Asr,t.Maghrib,t.Isha,t.Sunrise];
    document.querySelectorAll('#prayers .prayer-time').forEach((e,i)=>e.textContent=(vals[i]||'—').slice(0,5));

    const names=['Bomdod','Peshin','Asr','Shom','Xufton'];
    const times=vals.slice(0,5).map(x=>(x||'').slice(0,5));
    const current=pad(n.getHours())+':'+pad(n.getMinutes());
    let next=-1;
    for(let i=0;i<times.length;i++){if(times[i]>current){next=i;break}}
    document.querySelectorAll('#prayers .prayer').forEach((e,i)=>e.classList.toggle('active',i===next));
    document.getElementById('prayerNext').textContent=next>=0?'Keyingi namoz: '+names[next]+' — '+times[next]:'Keyingi namoz: Bomdod — '+times[0]+' (ertaga)';
    status.textContent='Toshkent namoz vaqtlari internetdan avtomatik yangilanadi.';
  }catch(e){
    status.textContent='Namoz vaqtlarini olishda internet xatosi yuz berdi.';
  }
}
loadPrayerTimes();
setInterval(loadPrayerTimes,15*60*1000);

})();
</script></body></html>
