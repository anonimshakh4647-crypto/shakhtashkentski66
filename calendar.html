<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IT SHAKH — KALENDAR</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:18px;background:radial-gradient(circle at top,#10283a,#050b12 55%);color:#e8f7ff;font-family:Segoe UI,Arial,sans-serif}
.wrap{max-width:1050px;margin:auto}.top,.card{background:#07111beF;border:1px solid #16344a;border-radius:18px;box-shadow:0 15px 50px #0008}
.top{padding:15px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;letter-spacing:2px}.brand b{color:#00e5ff}
.back,.nav{border:1px solid #1b4662;background:#081827;color:#dff5ff;border-radius:10px;font-weight:800;cursor:pointer}.back{padding:10px 15px}.back:hover,.nav:hover{border-color:#00e5ff;color:#00e5ff}
.card{padding:22px}.live{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #16344a;padding-bottom:20px;margin-bottom:20px}.label{font-size:11px;color:#8ba8ba;font-weight:800;letter-spacing:1.5px}.today{font-size:clamp(25px,5vw,42px);font-weight:900;margin-top:5px}.clock{font-size:clamp(20px,4vw,31px);font-weight:800;color:#00e5ff;font-variant-numeric:tabular-nums}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.title{font-size:clamp(21px,4vw,31px);font-weight:900}.nav{width:44px;height:44px;font-size:23px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.week div{text-align:center;color:#8ba8ba;font-size:12px;font-weight:800;padding:7px}.day{min-height:70px;padding:8px;border:1px solid #123047;background:#081521;border-radius:11px;font-weight:800}.empty{background:transparent;border-color:transparent}.num{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center}.todaycell{border-color:#00e5ff;box-shadow:0 0 15px #00e5ff18}.todaycell .num{border-radius:50%;background:#00e5ff;color:#001017}.note{text-align:center;color:#8ba8ba;font-size:11px;margin-top:16px}
@media(max-width:600px){body{padding:9px}.card{padding:13px}.live{align-items:flex-start;flex-direction:column;gap:15px}.day{min-height:54px;padding:5px}.week,.days{gap:4px}.week div{font-size:10px}}
</style></head>
<body><div class="wrap">
<div class="top"><div class="brand">IT <b>SHAKH</b> — KALENDAR</div><button class="back" onclick="location.href='index.html'">← ORQAGA</button></div>
<div class="card"><div class="live"><div><div class="label">BUGUN</div><div class="today" id="today">—</div></div><div><div class="label">HOZIRGI VAQT</div><div class="clock" id="clock">—</div></div></div>
<div class="head"><button class="nav" id="prev">‹</button><div class="title" id="title">—</div><button class="nav" id="next">›</button></div>
<div class="week" id="week"></div><div class="days" id="days"></div><div class="note">Sana va vaqt real vaqt yangilanib turadi.</div>
</div></div>
<script>
(()=>{'use strict';
const months=['Yanvar','Fevral','Mart','Aprel','May','Iyun','Iyul','Avgust','Sentabr','Oktabr','Noyabr','Dekabr'];
const weeks=['Du','Se','Cho','Pa','Ju','Sha','Ya'];
weeks.forEach(x=>{const e=document.createElement('div');e.textContent=x;document.getElementById('week').appendChild(e);});

const pad=n=>String(n).padStart(2,'0');
const todayEl=document.getElementById('today');
const clockEl=document.getElementById('clock');
const titleEl=document.getElementById('title');
const daysEl=document.getElementById('days');

let y,m;
let networkNowMs=null;
let lastSyncLocalMs=Date.now();
let syncing=false;

function networkNow(){
  if(networkNowMs===null) return new Date();
  return new Date(networkNowMs+(Date.now()-lastSyncLocalMs));
}

async function syncRealTime(){
  if(syncing)return;
  syncing=true;
  try{
    const t0=Date.now();
    const r=await fetch('https://worldtimeapi.org/api/timezone/Asia/Tashkent?x='+Date.now(),{
      cache:'no-store',
      headers:{'Accept':'application/json'}
    });
    if(!r.ok)throw new Error('time api');
    const data=await r.json();
    const serverMs=Date.parse(data.datetime);
    if(!Number.isNaN(serverMs)){
      const t1=Date.now();
      networkNowMs=serverMs+Math.round((t1-t0)/2);
      lastSyncLocalMs=t1;
    }
  }catch(e){
    // Network vaqt vaqtincha olinmasa, oxirgi sinxronlangan vaqt davom etadi.
    // Birinchi yuklanishda API ishlamasa, qurilma vaqti vaqtinchalik fallback bo'ladi.
  }finally{
    syncing=false;
    updateLive();
    const n=networkNow();
    if(y!==n.getFullYear()||m!==n.getMonth()){
      y=n.getFullYear();m=n.getMonth();draw();
    }
  }
}

function updateLive(){
  const n=networkNow();
  todayEl.textContent=pad(n.getDate())+'.'+pad(n.getMonth()+1)+'.'+n.getFullYear();
  clockEl.textContent=pad(n.getHours())+':'+pad(n.getMinutes())+':'+pad(n.getSeconds());
}

function draw(){
  titleEl.textContent=months[m]+' '+y;
  daysEl.innerHTML='';
  const first=(new Date(y,m,1).getDay()+6)%7;
  const count=new Date(y,m+1,0).getDate();
  const n=networkNow();
  for(let i=0;i<first;i++){
    const e=document.createElement('div');e.className='day empty';daysEl.appendChild(e);
  }
  for(let d=1;d<=count;d++){
    const e=document.createElement('div');e.className='day';
    const z=document.createElement('span');z.className='num';z.textContent=d;e.appendChild(z);
    if(y===n.getFullYear()&&m===n.getMonth()&&d===n.getDate())e.classList.add('todaycell');
    daysEl.appendChild(e);
  }
}

document.getElementById('prev').onclick=()=>{if(--m<0){m=11;y--}draw()};
document.getElementById('next').onclick=()=>{if(++m>11){m=0;y++}draw()};

const initial=new Date();
y=initial.getFullYear();m=initial.getMonth();
updateLive();draw();
syncRealTime();
setInterval(updateLive,1000);
setInterval(syncRealTime,5*60*1000);
})();
</script><!-- IT-SHAKH-SITELOCK -->
<style>
#sl-modal,#vb-modal{position:fixed;inset:0;z-index:2147483647;background:rgba(2,6,14,.96);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;font-family:inherit}
.sl-box{width:min(440px,100%);background:#06101c;border:1px solid rgba(31,214,245,.4);border-radius:16px;padding:28px 24px;box-shadow:0 0 60px rgba(31,214,245,.25);text-align:center;box-sizing:border-box}
.sl-ic{font-size:42px}
.sl-box h2{margin:8px 0 10px;font-size:21px;color:#1fd6f5;font-family:inherit}
.sl-box p{margin:0;font-size:13px;line-height:1.55;color:#cbd5e1;font-family:inherit}
</style>
<script>
/* ===== SAYTNI TO'LIQ BLOKLASH + VPN TAQIQLASH — TOOLS sahifalari uchun =====
   index.html dagi admin panelidan "SAYTNI BLOKLASH" yoki "VPN TAQIQLASH" yoqilsa,
   bu tekshiruv shu asbob sahifasida ham ishlaydi — ADMIN_EMAIL'dan boshqa hech kim
   to'g'ridan-to'g'ri havola orqali ham asbobdan foydalana olmaydi (sayt bloklanganda),
   yoki VPN/proksi/datacenter orqali kirgan bo'lsa foydalana olmaydi (VPN taqiqlanganda).
   Hech qanday Google token/kredensial talab qilinmaydi — shuning uchun sessiya holatidan qat'i nazar ishlaydi. */
(function(){
 var USERS_API_URL='https://script.google.com/macros/s/AKfycbyGcZgnnp91p19OhUVCep3zh_Izw9Day-jQaveO0rYVX7cK0F_y9yZaSHJ-qdMUZzhiBA/exec';
 var ADMIN='anonimshakh4647@gmail.com';
 var showingLock=false,showingVpn=false,checking=false,vpnFlag=null,vpnCheckedAt=0;
 function getUser(){try{return JSON.parse(localStorage.getItem('it_shakh_google_user')||'null')}catch(e){return null}}
 function isAdmin(){var u=getUser();return !!(u&&String(u.email||'').toLowerCase()===ADMIN);}
 function api(ms){return new Promise(function(res){
  var cb='sl2_cb_'+Date.now()+'_'+Math.floor(Math.random()*1e6),sc=document.createElement('script'),done=false;
  var fin=function(v){if(done)return;done=true;try{delete window[cb]}catch(e){window[cb]=undefined}sc.parentNode&&sc.remove();res(v);};
  window[cb]=fin;sc.onerror=function(){fin(null)};setTimeout(function(){fin(null)},ms||9000);
  sc.src=USERS_API_URL+'?action=sitestat&callback='+cb+'&_='+Date.now();document.head.appendChild(sc);});}
 function showLock(){
  if(showingLock||document.getElementById('sl-modal'))return;showingLock=true;
  var vb=document.getElementById('vb-modal');if(vb)vb.remove();showingVpn=false;
  var d=document.createElement('div');d.id='sl-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛠️</div><h2>Sayt vaqtincha yopiq</h2><p>Hozirda saytda texnik ishlar olib borilmoqda. Iltimos, birozdan so‘ng qayta urinib ko‘ring.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideLock(){var d=document.getElementById('sl-modal');if(!d)return;d.remove();showingLock=false;document.body.style.overflow=showingVpn?'hidden':'';}
 function showVpn(){
  if(showingVpn||showingLock||document.getElementById('vb-modal'))return;showingVpn=true;
  var d=document.createElement('div');d.id='vb-modal';
  d.innerHTML='<div class="sl-box"><div class="sl-ic">🛡️</div><h2>VPN/Proksi orqali kirish taqiqlangan</h2><p>Saytdan foydalanish uchun VPN yoki proksi dasturini o‘chirib, sahifani qayta yuklang.</p></div>';
  document.body.appendChild(d);document.body.style.overflow='hidden';
 }
 function hideVpn(){var d=document.getElementById('vb-modal');if(!d)return;d.remove();showingVpn=false;document.body.style.overflow=showingLock?'hidden':'';}
 function checkVpn(){
  return new Promise(function(res){
   var c=(typeof AbortController!=='undefined')?new AbortController():null,t=setTimeout(function(){if(c)c.abort();},5000);
   fetch('https://api.ipapi.is/',c?{signal:c.signal}:{}).then(function(r){
    clearTimeout(t);if(!r.ok)return res(null);return r.json();
   }).then(function(j){
    if(!j||typeof j!=='object'||(j.is_vpn==null&&j.is_proxy==null&&j.is_datacenter==null))return res(null);
    res(!!(j.is_vpn||j.is_proxy||j.is_tor||j.is_datacenter));
   }).catch(function(){clearTimeout(t);res(null);});
  });
 }
 function tick(){
  if(checking||isAdmin())return;
  checking=true;api(9000).then(function(r){checking=false;
   if(r&&r.ok&&r.locked)return showLock();
   if(r&&r.ok&&!r.locked&&showingLock)hideLock();
   if(r&&r.ok&&r.vpnBlock){
    if(vpnFlag===null||Date.now()-vpnCheckedAt>120000){
     checkVpn().then(function(v){vpnFlag=v;vpnCheckedAt=Date.now();
      if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
     });
    }else if(vpnFlag===true)showVpn();else if(vpnFlag===false&&showingVpn)hideVpn();
   }else if(showingVpn)hideVpn();
  });
 }
 setTimeout(tick,200);setInterval(tick,4000);
})();
</script>
</body></html>
