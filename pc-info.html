<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Info | IT SHAKH</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header><main><div class="eyebrow">// LOCAL SYSTEM OVERVIEW</div><h1>PC INFO</h1><p class="intro">Brauzeringiz ruxsat bergan qurilma ma’lumotlari shu sahifaning o‘zida ko‘rsatiladi. Hech qanday ma’lumot serverga yuborilmaydi.</p><section class="panel"><div class="grid" id="info"></div><p class="notice">Ayrim maydonlar maxfiylik sozlamalari sababli “Mavjud emas” bo‘lishi mumkin.</p></section></main><script>
