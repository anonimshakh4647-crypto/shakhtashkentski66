<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Info | IT SHAKH</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="tools.css"></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="index.html">← BOSH SAHIFA</a></header><main><div class="eyebrow">// LOCAL SYSTEM OVERVIEW</div><h1>PC INFO</h1><p class="intro">Brauzeringiz ruxsat bergan qurilma ma’lumotlari shu sahifaning o‘zida ko‘rsatiladi. Hech qanday ma’lumot serverga yuborilmaydi.</p><section class="panel"><div class="grid" id="info"></div><p class="notice">Ayrim maydonlar maxfiylik sozlamalari sababli “Mavjud emas” bo‘lishi mumkin.</p></section></main><script>
(() => {
  const nav = window.navigator || {};
  const connection = nav.connection || nav.mozConnection || nav.webkitConnection || {};
  const unavailable = 'Mavjud emas';
  const safe = (fn) => { try { const value = fn(); return value || unavailable; } catch (_) { return unavailable; } };
  const data = [
    ['Brauzer', safe(() => nav.userAgent)],
    ['Platforma', safe(() => (nav.userAgentData && nav.userAgentData.platform) || nav.platform)],
    ['Til', safe(() => nav.language)],
    ['Ekran', safe(() => window.screen.width + ' × ' + window.screen.height + ' px')],
    ['CPU yadrolari', safe(() => nav.hardwareConcurrency ? nav.hardwareConcurrency + ' ta' : unavailable)],
    ['Qurilma xotirasi', safe(() => nav.deviceMemory ? nav.deviceMemory + ' GB' : unavailable)],
    ['Ulanish turi', safe(() => connection.effectiveType || connection.type || unavailable)],
    ['Taxminiy tezlik', safe(() => connection.downlink ? connection.downlink + ' Mbps' : unavailable)],
    ['Vaqt zonasi', safe(() => Intl.DateTimeFormat().resolvedOptions().timeZone)],
    ['Cookie holati', safe(() => nav.cookieEnabled ? 'Yoqilgan' : 'O‘chirilgan')]
  ];
  const container = document.getElementById('info');
  container.innerHTML = data.map(([label, value]) => '<div class="stat"><div class="label">' + label + '</div><div class="value"></div></div>').join('');
  [...container.querySelectorAll('.value')].forEach((el, index) => { el.textContent = data[index][1]; });
})();
</script></body></html>
