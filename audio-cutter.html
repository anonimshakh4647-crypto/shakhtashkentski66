<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Cutter | IT SHAKH</title><link rel="stylesheet" href="tools.css"><style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}audio{width:100%;margin:16px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><a class="brand" href="index.html">IT SHAKH</a><a class="back" href="javascript:history.back()">← ORQAGA</a></header><main><div class="eyebrow">// LOCAL AUDIO TOOL</div><h1>AUDIO CUTTER</h1><p class="intro">Qo‘shiq yoki audio faylning kerakli qismini kesib, WAV formatida saqlang.</p><section class="panel"><input id="file" type="file" accept="audio/*"><audio id="audio" controls hidden></audio><div class="grid"><label class="field"><span class="label">BOSHLANISH (SONIYA)</span><input id="start" type="number" min="0" step="0.1" value="0"></label><label class="field"><span class="label">TUGASH (SONIYA)</span><input id="end" type="number" min="0" step="0.1" value="0"></label></div><div class="actions"><button id="cut">KESISH</button><a id="download" class="secondary" hidden>↓ WAV YUKLAB OLISH</a></div><p id="status" class="notice">Audio tanlang.</p></section></main><script>const f=document.getElementById('file'),a=document.getElementById('audio'),st=document.getElementById('start'),en=document.getElementById('end'),msg=document.getElementById('status'),dl=document.getElementById('download');let src=null;f.onchange=()=>{if(!f.files[0])return;src=URL.createObjectURL(f.files[0]);a.src=src;a.hidden=false;a.onloadedmetadata=()=>{st.value=0;en.value=a.duration.toFixed(1);msg.textContent='Davomiyligi: '+a.duration.toFixed(1)+' soniya.'}};function wav(buffer){const ch=buffer.numberOfChannels,len=buffer.length*ch*2+44,ab=new ArrayBuffer(len),v=new DataView(ab),rate=buffer.sampleRate;const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};w(0,'RIFF');v.setUint32(4,36+buffer.length*ch*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,rate,true);v.setUint32(28,rate*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,buffer.length*ch*2,true);let off=44;for(let i=0;i<buffer.length;i++)for(let c=0;c<ch;c++){let x=Math.max(-1,Math.min(1,buffer.getChannelData(c)[i]));v.setInt16(off,x<0?x*32768:x*32767,true);off+=2}return new Blob([ab],{type:'audio/wav'})}document.getElementById('cut').onclick=async()=>{if(!f.files[0]){msg.textContent='Audio tanlang.';return}const s=Number(st.value),e=Number(en.value);if(e<=s){msg.textContent='Tugash vaqti boshlanishdan katta bo‘lishi kerak.';return}msg.textContent='Kesilmoqda…';const ac=new AudioContext();const buf=await ac.decodeAudioData(await f.files[0].arrayBuffer());const from=Math.floor(s*buf.sampleRate),to=Math.min(buf.length,Math.floor(e*buf.sampleRate)),out=ac.createBuffer(buf.numberOfChannels,to-from,buf.sampleRate);for(let c=0;c<buf.numberOfChannels;c++)out.copyToChannel(buf.getChannelData(c).slice(from,to),c);const blob=wav(out),url=URL.createObjectURL(blob);dl.href=url;dl.download='it-shakh-cut.wav';dl.hidden=false;msg.textContent='Tayyor. WAV faylni yuklab oling.'};</script></body></html>
